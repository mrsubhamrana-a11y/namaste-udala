  const cal = {};

function planPrice(days, type) {
  const base = +(S.planRates[type || F.type]?.[days] || (days === 7 ? 749 : days === 15 ? 1499 : days === 39 ? 3699 : 2899));
  return base;
}

function cartEntries() {
  return Object.entries(C).filter(([, q]) => (+q || 0) > 0);
}
function cartCount() {
  return cartEntries().reduce((a, [, q]) => a + (+q || 0), 0);
}
function rawCartSubTotal() {
  return cartEntries().reduce((a, [k, q]) => {
    const [pidStr, wTag] = String(k).split("_");
    const p = S.prod.find(x => String(x.id) === pidStr);
    if (!p || !p.s) return a;
    const mult = wTag === "5kg" ? 4.6 : wTag === "500g" ? 0.55 : 1;
    return a + Math.round(p.p * mult) * (+q || 0);
  }, 0);
}
function bulkDiscountAmt() {
  const hasAtta5 = !!C["11_5kg"] || !!C["11_1kg"];
  const hasRice5 = !!C["12_5kg"] || !!C["12_1kg"];
  return (hasAtta5 && hasRice5) ? 45 : 0;
}
function deliveryFee(sub) {
  if (sub <= 0) return 0;
  return sub >= (+S.cfg.freeMin || 300) ? 0 : (+S.cfg.dlvFee || 25);
}
function finalCartTotal() {
  const st = Math.max(0, rawCartSubTotal() - bulkDiscountAmt());
  return st + deliveryFee(st);
}
function commissionFor(amt, vendorId) {
  const v = getVendor(vendorId);
  const pct = +(v.commPct ?? S.cfg.commDefault ?? 5);
  return Math.round((+amt || 0) * pct / 100);
}

function strHash(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i += Math.max(1, Math.floor(s.length / 400))) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return "H-" + (h >>> 0).toString(16);
}

function checkUtr(raw) {
  const u = String(raw || "").replace(/\D/g, "");
  if (u.length !== 12) return { ok: false, msg: "⚠️ 12-digit UPI UTR zaroori hai!" };
  if (/^(\d)\1{6,}/.test(u) || new Set(u.split("")).size < 4) return { ok: false, msg: "⚠️ Fake UTR number blocked!" };
  if (S.usedUtr.includes(u)) return { ok: false, msg: "⚠️ Duplicate UTR already used!" };
  return { ok: true, utr: u };
}

    vStat: modeLabel === "COD" ? "cod" : "ok", utr: utrRef,
    autoRenew: F.autoRenew ? 1 : 0, swapUsed: 0, dabbaPending: 1,
    diet: F.diet, spice: F.spice,

    cal: defaultCalendar(days)
  };
  S.subs = [sub, ...S.subs.filter(x => x.phone !== cleanP)];

function finalizeCart(amt, modeLabel, utrRef) {
  const cleanP = ph(F.phone);
  const items = cartEntries().map(([k, q]) => {
    const [pidStr, wTag] = String(k).split("_");
    const p = S.prod.find(x => String(x.id) === pidStr);
    const mult = wTag === "5kg" ? 4.6 : wTag === "500g" ? 0.55 : 1;
    return { id: p.id, n: `${p.n} (${wTag || "1kg"})`, w: wTag || "1kg", q: +q, p: Math.round(p.p * mult), cost: Math.round((p.cost || p.p * 0.75) * mult) };
  });
  const ord = {
    id: uid("o"), ts: Date.now(), date: iso(D0()), name: F.name.trim(), phone: cleanP,
    area: F.area, addr: F.addr.trim(), vendorId: SEL_VENDOR === "all" ? "v_mkt" : SEL_VENDOR,
    rider: BATCH_RIDER, items, total: amt,
    paid: modeLabel === "Wallet" ? 1 : 0,
    vStat: modeLabel === "COD" ? "cod" : modeLabel === "Wallet" ? "ok" : "verify",
    dlv: 0, pMode: modeLabel, utr: utrRef, proof: PROOF_IMG || "", proofNote: ""
  };
  S.orders.push(ord);
  if (modeLabel === "COD") {
    S.khata[cleanP] = { ...(S.khata[cleanP] || { name: F.name.trim(), phone: cleanP, area: F.area, due: 0, wallet: 0 }), due: (+(S.khata[cleanP]?.due) || 0) + amt };
  }
  if (utrRef && /^\d{12}$/.test(utrRef)) S.usedUtr.push(utrRef);
  C = {}; saveCart();
  PAY_BOX = null; CART_OPEN = false; DRAFT_UTR = ""; PROOF_IMG = "";
  save();
  toast(`✅ Order #${String(ord.id).slice(-4)} Placed!`);
}

const A = {
  theme: () => {

    localStorage.setItem("nu10_theme", d ? "dark" : "");
    render();
  },
  toggle_lowdata: () => {
    LOW_DATA = !LOW_DATA;
    localStorage.setItem("nu10_lowdata", LOW_DATA ? "1" : "0");
    document.body.classList.toggle("low-data", LOW_DATA);
    render();
  },
  tab: v => { tab = v; CART_OPEN = false; PAY_BOX = null; render(); scrollTo({ top: 0, behavior: "smooth" }); },
  otab: v => { O_TAB = v; render(); },
  fset: (v, k) => { F[k] = k === "days" ? +v : v; render(); },
  toggle_f_bool: (v, k) => { F[k] = F[k] ? 0 : 1; render(); },
  set_area: v => { F.area = v; localStorage.setItem("nu10_area", v); render(); },
  set_vendor: v => { SEL_VENDOR = v; render(); },
  set_cat: v => { SEL_CAT = v; render(); },

  skip_today: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    const now = new Date();
    if ((now.getHours() > 9 || (now.getHours() === 9 && now.getMinutes() > 0)) && ROLE !== "owner") {
      toast("⚠️ Aaj ka skip 9:00 AM tak hi allowed hai!");
      return;
    }
    const td = iso(D0());
    s.cal[td] = { ...(s.cal[td] || { menu: "Daily Tiffin" }), skip: 1, done: 0 };
    s.days = (+s.days || 30) + 1;
    s.cal[iso(addD(new Date(s.start + "T12:00:00"), s.days - 1))] = { menu: "Extended Day Meal", done: 0, skip: 0, rating: 0 };
    save();
    toast("⏭ Aaj ka meal skip + billing/days auto-adjusted (+1d)!");
  },
  meal_swap: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    if (s.swapUsed) { toast("⚠️ Is hafte ka meal swap already use ho chuka hai!"); return; }
    s.swapUsed = 1;
    const td = iso(D0());
    s.cal[td] = { ...(s.cal[td] || {}), menu: "Swapped: Egg Masala + 4 Roti" };
    save();
    toast("🔄 Meal Swapped (Paneer → Egg Masala)!");
  },
  toggle_renew: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    s.autoRenew = s.autoRenew ? 0 : 1;
    save();
    toast(`🔁 Auto-Renewal ${s.autoRenew ? "ON" : "OFF"}`);
  },
  vacation_mode: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    const n = Math.min(10, Math.max(3, +($("#vac_n")?.value || 4)));
    for (let i = 1; i <= n; i++) {
      const dk = iso(addD(D0(), i));
      s.cal[dk] = { ...(s.cal[dk] || { menu: "Vacation Pause" }), skip: 1, done: 0 };
    }
    s.days = (+s.days || 30) + n;
    save();
    toast(`✈️ Vacation Mode ON for ${n} days (+${n}d extended)!`);
  },
  cycle_fam_spice: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    const idx = +v;
    const order = ["Low", "Medium", "Spicy"];
    const cur = s.familyMembers[idx]?.spice || "Medium";
    s.familyMembers[idx].spice = order[(order.indexOf(cur) + 1) % order.length];
    save();
    toast(`🌶 ${s.familyMembers[idx].role} spice: ${s.familyMembers[idx].spice}`);
  },
  rate_day: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s || !s.cal[v]) return;
    const prev = +s.cal[v].rating || 0;
    s.cal[v].rating = prev >= 5 ? 3 : (prev ? prev + 1 : 5);
    save();
    toast(`⭐ Rated ${v}: ${s.cal[v].rating}/5`);

  add_w: (v, k, id) => {

  dec_w: (v, k, id) => {
    const keys = Object.keys(C).filter(x => x.startsWith(id + "_") && C[x] > 0);
    if (keys.length) { C[keys[0]] = Math.max(0, C[keys[0]] - 1); saveCart(); render(); }

  inc_key: v => { C[v] = (C[v] || 0) + 1; saveCart(); render(); },
  dec_key: v => { C[v] = Math.max(0, (C[v] || 0) - 1); saveCart(); render(); },

  close_proof: () => { VIEW_PROOF = ""; render(); },

  pmode: v => { if ($("#utr_inp")) DRAFT_UTR = $("#utr_inp").value; PAY_MODE = v; render(); },
  pick_proof: () => { if ($("#utr_inp")) DRAFT_UTR = $("#utr_inp").value; const inp = $("#proof_file"); if (inp) { inp.value = ""; inp.click(); } },

  start_pay_sub: () => {

    const amt = planPrice(+F.days, F.type);
    PAY_MODE = "upi"; DRAFT_UTR = ""; PROOF_IMG = "";
    PAY_BOX = { kind: "sub", days: +F.days, amt, title: `${F.days}-Day Tiffin (${inr(amt)})` };
    render();
  },
  start_pay_trial: () => {
    if (!checkUser()) return;
    const amt = +(S.cfg.trialPrice || 49);
    PAY_MODE = "upi"; DRAFT_UTR = ""; PROOF_IMG = "";
    PAY_BOX = { kind: "sub", days: 1, amt, title: `1-Day Trial (${inr(amt)})` };
    render();
  },
  start_pay_cart: () => {
    if (!checkUser()) return;
    const amt = finalCartTotal();
    if (amt <= 0) { toast("Cart khali hai"); return; }
    CART_OPEN = false; PAY_MODE = "upi"; DRAFT_UTR = ""; PROOF_IMG = "";
    PAY_BOX = { kind: "cart", amt, title: `Shop Order (${inr(amt)})` };
    render();
  },
  confirm_pay: () => {
    if (!PAY_BOX) return;
    const cleanP = ph(F.phone);
    const rawUtr = $("#utr_inp")?.value.trim() || DRAFT_UTR;

    if (PAY_MODE === "wallet") {
      const bal = +(S.khata[cleanP]?.wallet || 0);
      if (bal < PAY_BOX.amt) { toast(`⚠️ Wallet balance ${inr(bal)} kam hai!`); return; }
      S.khata[cleanP].wallet = bal - PAY_BOX.amt;
      if (PAY_BOX.kind === "sub") finalizeSub(PAY_BOX.days, PAY_BOX.amt, "Wallet", "WALLET");
      else finalizeCart(PAY_BOX.amt, "Wallet", "WALLET");
      return;
    }

    if (PAY_MODE === "cod") {
      if (PAY_BOX.kind === "sub") finalizeSub(PAY_BOX.days, PAY_BOX.amt, "COD", "DOOR-COD");
      else finalizeCart(PAY_BOX.amt, "COD", "DOOR-COD");
      return;
    }

    const chk = checkUtr(rawUtr);
    if (!chk.ok) { toast(chk.msg); return; }
    if (PAY_MODE === "proof") {
      if (!PROOF_IMG) { toast("⚠️ Pehle UPI screenshot upload karein!"); return; }
      if (S.usedImgHash.includes(PROOF_HASH)) { toast("⚠️ Duplicate screenshot blocked!"); return; }
      S.usedImgHash.push(PROOF_HASH);
    }
    if (PAY_BOX.kind === "sub") finalizeSub(PAY_BOX.days, PAY_BOX.amt, "UPI Verified", chk.utr);
    else finalizeCart(PAY_BOX.amt, PAY_MODE === "proof" ? "Proof+UTR" : "UPI UTR", chk.utr);
  },

  load_wallet: v => {
    if (!checkUser()) return;
    const p = ph(F.phone), addA = +v || 500;
    S.khata[p] = { ...(S.khata[p] || { name: F.name.trim(), phone: p, area: F.area, due: 0, wallet: 0 }), wallet: (+(S.khata[p]?.wallet) || 0) + addA };
    save();
    toast(`💳 ${inr(addA)} Wallet mein add ho gaya!`);
  },
  apply_referral: () => {
    const p = ph(F.phone);
    if (!p) { toast("Phone number daalein"); return; }
    S.khata[p] = { ...(S.khata[p] || { name: F.name.trim(), phone: p, area: F.area, due: 0, wallet: 0 }), wallet: (+(S.khata[p]?.wallet) || 0) + 50 };
    save();
    toast("🎁 Referral Bonus ₹50 Wallet mein add ho gaya!");
  },
  add_khata_due: () => {
    const p = ph(F.phone), addD = +($("#khata_add_amt")?.value || 0);
    if (!p || addD <= 0) { toast("Valid due amount daalein"); return; }
    S.khata[p] = { ...(S.khata[p] || { name: F.name.trim(), phone: p, area: F.area, due: 0, wallet: 0 }), due: (+(S.khata[p]?.due) || 0) + addD };
    save();
    toast(`📒 Udhaar ${inr(addD)} added`);
  },
  clear_khata_due: () => {
    const p = ph(F.phone); if (!p || !S.khata[p]) return;
    S.khata[p].due = 0; S.khata[p].lastPaid = iso(D0());
    save();
    toast("✓ Udhaar clear ho gaya!");
  },
  calc_gst: () => {
    const base = +($("#gst_base")?.value || 0), rate = +($("#gst_rate")?.value || 5);
    const gst = Math.round(base * rate / 100);
    const out = $("#gst_out");
    if (out) out.textContent = `GST (${rate}%): ${inr(gst)} · Grand Total: ${inr(base + gst)}`;
  },
  add_exp: () => {
    const n = ($("#exp_name")?.value || "").trim(), amt = +($("#exp_amt")?.value || 0);
    if (!n || amt <= 0) { toast("Expense name & ₹ daalein"); return; }
    S.expenses.push({ id: uid("e"), d: iso(D0()), n, amt });
    save();
    toast("Expense logged");
  },

  set_batch_rider: v => { BATCH_RIDER = v; render(); },
  batch_assign_all: () => {
    S.orders.forEach(o => { if (!o.dlv) o.rider = BATCH_RIDER; });
    save();
    toast(`⚡ Pending orders assigned to ${BATCH_RIDER}`);
  },
  toggle_contactless: () => { CONTACTLESS_DEFAULT = CONTACTLESS_DEFAULT ? 0 : 1; render(); },
  snap_dlv_proof: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    o.proofNote = `Gate Photo Proof @ ${new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" })}`;
    save();
    toast("📸 Contactless delivery proof saved!");
  },
  mark_dlv: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    o.dlv = o.dlv ? 0 : 1;
    if (o.dlv && o.vStat === "cod") {
      o.paid = 1;
      const p = ph(o.phone);
      if (S.khata[p]) S.khata[p].due = Math.max(0, (+S.khata[p].due || 0) - (+o.total || 0));
    }
    save();
    toast(o.dlv ? "Delivered ✓" : "Unmarked");
  },
  return_item: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    S.returns.push({ id: uid("r"), ordId: id, name: o.name, amt: o.total, d: iso(D0()) });
    o.dlv = 1;
    save();
    toast("↩ Return logged");
  },
  add_fuel: () => {
    const km = +($("#fuel_km")?.value || 0), cost = +($("#fuel_cost")?.value || 0);
    if (km <= 0 || cost <= 0) { toast("KM & Fuel ₹ daalein"); return; }
    S.fuelLogs.push({ id: uid("f"), d: iso(D0()), km, cost });
    save();
    toast(`⛽ Fuel logged (${(km / cost).toFixed(1)} km/₹)`);
  },

  save_owner_cfg: () => {
    S.cfg.commDefault = Math.max(0, Math.min(30, +($("#cfg_comm")?.value ?? 5)));
    S.cfg.rainBanner = ($("#cfg_alert")?.value || "").trim();
    save();
    toast("Owner config saved ✓");
  },
  approve_ord: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    o.paid = o.paid ? 0 : 1; o.vStat = o.paid ? "ok" : "verify";
    save();
  },
  print_bill: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    $("#printArea").innerHTML = `<h2>NAMASTE UDALA</h2><p>Bill #${String(o.id).slice(-4)} · ${esc(o.date)}</p><p>${esc(o.name)} (${esc(o.phone)}) · ${esc(o.area)}</p><hr>` +
      (o.items || []).map(i => `<div>${esc(i.n)} x ${i.q} = ${inr(i.p * i.q)}</div>`).join("") +
      `<hr><h3>TOTAL: ${inr(o.total)}</h3>`;
    window.print();
  },
  logout_role: () => { ROLE = ""; sessionStorage.removeItem("nu10_role"); tab = "plan"; render(); }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (b && A[b.dataset.a]) {
    if (b.tagName !== "A") e.preventDefault();
    A[b.dataset.a](b.dataset.v, b.dataset.k, b.dataset.id, e);
  }
});

document.addEventListener("input", e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.id === "utr_inp") DRAFT_UTR = e.target.value;
  if (e.target.id === "sq") {
    SQ = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#sq");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});

$("#proof_file").addEventListener("change", e => {
  const f = e.target.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const sc = Math.min(1, 360 / Math.max(img.width, img.height));
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const dataUrl = c.toDataURL("image/jpeg", 0.65);
      PROOF_IMG = dataUrl;
      PROOF_HASH = strHash(dataUrl);
      render();
      toast("📷 Screenshot ready!");
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
});

let taps = 0, tapTimer;
$("#mark").addEventListener("click", () => {
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => { taps = 0; }, 1600);
  if (taps >= 5) {
    taps = 0;
    const pin = prompt("Owner PIN (4827) ya Staff PIN (7788):");
    if (pin === OPIN) { ROLE = "owner"; sessionStorage.setItem("nu10_role", "owner"); tab = "owner"; render(); toast("Owner Mode Unlocked"); }
    else if (pin === DPIN) { ROLE = "staff"; sessionStorage.setItem("nu10_role", "staff"); tab = "logistics"; render(); toast("Staff Mode Unlocked"); }
    else if (pin !== null) toast("Galat PIN");
  }
});

function render() {
  if (S.cfg.marquee) {
    const mt = $("#marqTrack");
    if (mt) mt.textContent = `✦ ${S.cfg.marquee} ✦ ${S.cfg.marquee} ✦`;
  }
  let ab = $("#alertBar");
  if (S.cfg.rainBanner) {
    if (!ab) { document.querySelector(".marquee").insertAdjacentHTML("afterend", `<div id="alertBar" class="alert-bar"></div>`); ab = $("#alertBar"); }
    ab.textContent = "🚨 " + S.cfg.rainBanner;
  } else if (ab) ab.remove();

  const topBar = `<div class="top-bar">
    <div class="grp">
      <button class="pill-btn ${LOW_DATA ? "on" : ""}" data-a="toggle_lowdata">${LOW_DATA ? "⚡ Data Saver ON" : "⚡ Data Saver"}</button>
      <button class="pill-btn" data-a="theme">${document.documentElement.dataset.theme === "dark" ? "☀️ Light" : "🌙 Dark"}</button>
    </div>
    <span style="font-size:10.5px;font-weight:800;color:var(--mu)">Comm: ${S.cfg.commDefault}% · Free ≥ ${inr(S.cfg.freeMin)}</span>
  </div>`;

  const views = { plan: vPlan, shop: vShop, finance: vFinance, logistics: vLogistics, owner: vOwner };
  $("#v").innerHTML = topBar + (views[tab] || vPlan)();
  $("#sheet").innerHTML = sheetHTML();

  const cnt = cartCount();
  $("#cbar").innerHTML = (cnt > 0 && !CART_OPEN && !PAY_BOX)
    ? `<div class="cbar-fixed" data-a="open_cart"><span>${cnt} Item · ${inr(finalCartTotal())}</span><span>View Cart →</span></div>`
    : "";

  const navItems = [
    ["plan", `<svg class="ic" viewBox="0 0 24 24"><path d="M6 9h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9Z"/><path d="M8 5h8v4H8z"/></svg>`, "7/15/30/39d"],
    ["shop", `<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L23 7H6"/></svg>`, "Kirana"],
    ["finance", `<svg class="ic" viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`, "Finance"],
    ["logistics", `<svg class="ic" viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M12 17.5H9v-7h6v7z"/></svg>`, "Delivery"]
  ];
  if (ROLE === "owner") {
    navItems.push(["owner", `<svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>`, "Owner"]);
  }
  $("#nav").innerHTML = navItems.map(([k, ic, lbl]) =>
    `<button class="${tab === k ? "on" : ""}" data-a="tab" data-v="${k}">${ic}<span class="nl">${lbl}</span>${k === "shop" && cnt ? `<span class="nb">${cnt}</span>` : ""}</button>`
  ).join("");
}

render();
</script>
</body>
</html>
