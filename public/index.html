<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Namaste Udala — 3D Tiffin · QuickCom · CartRadar · PowerBI ERP</title>
<meta name="theme-color" content="#072b1d">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #eef2f6;
  --sf: #ffffff;
  --sf2: #f4f7fb;
  --ink: #0f172a;
  --mu: #64748b;
  --ln: #dce4ee;
  --o: #ff5500;
  --g: #0b6e46;
  --gold: #f59e0b;
  --bad: #dc2626;
  --sh-card: 0 18px 34px -8px rgba(15,23,42,0.12), 0 4px 10px rgba(15,23,42,0.05), inset 0 2px 0 #fff;
  --sh-3d-o: 0 6px 0 #b33600, 0 12px 22px rgba(255,85,0,0.38), inset 0 2px 1px rgba(255,255,255,0.45);
  --sh-3d-g: 0 6px 0 #053b25, 0 12px 22px rgba(11,110,70,0.35), inset 0 2px 1px rgba(255,255,255,0.35);
  --sh-3d-w: 0 4px 0 #cbd5e1, 0 8px 14px rgba(15,23,42,0.07), inset 0 2px 0 #fff;
  --sh-in: inset 0 3px 6px rgba(15,23,42,0.08), 0 1px 0 #fff;
}
[data-theme=dark] {
  --bg: #080d12;
  --sf: #121b24;
  --sf2: #0d141c;
  --ink: #f1f5f9;
  --mu: #94a3b8;
  --ln: #1f2e3d;
  --sh-card: 0 22px 42px -10px rgba(0,0,0,0.7), inset 0 1.5px 0 rgba(255,255,255,0.08);
  --sh-3d-w: 0 4px 0 #06090d, 0 8px 16px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  --sh-in: inset 0 3px 7px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  background: radial-gradient(circle at 12% 4%, rgba(255,120,40,0.14), transparent 40%),
              radial-gradient(circle at 88% 12%, rgba(16,163,100,0.12), transparent 40%), var(--bg);
  color: var(--ink); padding-bottom: 148px; min-height: 100vh; perspective: 1200px;
}
img { display: block; object-fit: cover; }
button, input, select { font: inherit; color: inherit; }
svg.ic { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

/* 3D Header + QuickCom Superfast Strip */
header {
  position: sticky; top: 0; z-index: 1000;
  background: linear-gradient(145deg, #0f6843, #062b1c);
  color: #fff; padding: 12px 15px; border-radius: 0 0 24px 24px;
  box-shadow: 0 6px 0 #031910, 0 16px 30px rgba(6,43,28,0.45);
  display: flex; align-items: center; gap: 12px;
}
.logo {
  width: 45px; height: 45px; border-radius: 14px;
  background: linear-gradient(145deg, #ff9436, #ff4500);
  display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff;
  box-shadow: 0 4px 0 #992600, inset 0 2px 2px rgba(255,255,255,0.6); cursor: pointer; user-select: none;
}
.logo:active { transform: translateY(3px); box-shadow: 0 1px 0 #992600; }
.brand { flex: 1; min-width: 0; }
.brand small { display: flex; align-items: center; gap: 5px; color: #fde047; font-size: 9.5px; letter-spacing: 1.5px; font-weight: 800; }
.brand small i { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.brand h1 { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.qc-strip {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: linear-gradient(90deg, #0f172a, #1e293b); color: #fff;
  padding: 9px 14px; border-radius: 16px; margin-bottom: 14px;
  box-shadow: 0 6px 16px rgba(15,23,42,0.18); font-size: 11.5px; font-weight: 800;
}
.qc-eta { display: inline-flex; align-items: center; gap: 6px; color: #fde047; }
.qc-save-pill { background: rgba(34,197,94,0.2); color: #4ade80; padding: 3px 9px; border-radius: 99px; border: 1px solid rgba(74,222,128,0.35); }

main { padding: 14px 14px 0; max-width: 660px; margin: 0 auto; }

/* 3D Hero Showcase */
.hero3d {
  position: relative; border-radius: 24px; padding: 20px 18px; margin-bottom: 18px; color: #fff;
  background: linear-gradient(130deg, #1f110b 0%, #682107 55%, #c23b00 100%);
  box-shadow: 0 7px 0 #471402, 0 18px 34px rgba(184,55,0,0.32);
  min-height: 150px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; overflow: visible;
}
.hero3d.green {
  background: linear-gradient(130deg, #062619 0%, #0b5c3b 55%, #149962 100%);
  box-shadow: 0 7px 0 #042115, 0 18px 34px rgba(11,92,59,0.32);
}
.hero3d.slate {
  background: linear-gradient(130deg, #0f172a 0%, #1e293b 55%, #334155 100%);
  box-shadow: 0 7px 0 #090e1a, 0 18px 34px rgba(15,23,42,0.38);
}
.hero-tag {
  display: inline-flex; align-items: center; gap: 5px; width: fit-content;
  background: rgba(255,255,255,0.16); padding: 3px 9px; border-radius: 99px;
  font-size: 9.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; margin-bottom: 6px;
}
.hero3d h2 { font-size: 20px; font-weight: 800; max-width: 63%; line-height: 1.2; margin-bottom: 5px; }
.hero3d p { font-size: 12px; opacity: .92; max-width: 63%; font-weight: 600; }
.hero-plate {
  position: absolute; right: 12px; bottom: -8px; width: 114px; height: 114px;
  border-radius: 50%; border: 4px solid #fff; background: #1e293b;
  box-shadow: 0 16px 26px rgba(0,0,0,0.55), 0 0 20px rgba(255,110,30,0.4);
  animation: floatPlate 3.4s ease-in-out infinite; z-index: 3;
}
@keyframes floatPlate { 50% { transform: translateY(-8px) scale(1.04) rotate(2deg); } }

/* Realistic Rising Hot Steam (Dhua) */
.steam-wrap { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }
.steam-wrap i {
  position: absolute; bottom: 28%; width: 26px; height: 26px;
  background: radial-gradient(circle, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%; filter: blur(5px); opacity: 0; animation: steamRise 2.4s infinite ease-out;
}
.steam-wrap i:nth-child(1) { left: 28%; animation-delay: 0s; }
.steam-wrap i:nth-child(2) { left: 48%; width: 34px; height: 34px; animation-delay: 0.7s; }
.steam-wrap i:nth-child(3) { left: 62%; animation-delay: 1.4s; }
@keyframes steamRise {
  0% { transform: translateY(8px) scale(0.5); opacity: 0; }
  35% { opacity: 0.82; }
  100% { transform: translateY(-72px) scale(2.5) translateX(10px); opacity: 0; }
}

/* CartRadar Interactive Map & Radar Sweep */
.radar-box {
  position: relative; height: 195px; border-radius: 18px; overflow: hidden;
  border: 2px solid var(--ln); box-shadow: 0 10px 24px rgba(0,0,0,0.16); margin: 8px 0 10px; background: #0f172a;
}
#radarMap { width: 100%; height: 100%; z-index: 1; }
.radar-sweep {
  position: absolute; inset: -40%; pointer-events: none; z-index: 400;
  background: conic-gradient(from 0deg, transparent 72%, rgba(34,197,94,0.28) 96%, rgba(34,197,94,0.65) 100%);
  border-radius: 50%; animation: radarSpin 4s linear infinite;
}
@keyframes radarSpin { to { transform: rotate(360deg); } }
.radar-hud {
  position: absolute; top: 8px; left: 8px; right: 8px; z-index: 405; pointer-events: none;
  display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.radar-pill {
  background: rgba(15,23,42,0.88); color: #fff; padding: 5px 10px; border-radius: 99px;
  font-size: 10.5px; font-weight: 800; backdrop-filter: blur(6px);
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.15);
}
.radar-pill i { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }

/* QuickCom Multi-Platform Price Matrix */
.qc-matrix {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
  background: var(--sf2); padding: 8px; border-radius: 13px; border: 1px solid var(--ln); margin: 8px 0; text-align: center;
}
.qc-matrix div { font-size: 10px; font-weight: 700; color: var(--mu); padding: 4px 2px; border-radius: 8px; }
.qc-matrix b { display: block; font-size: 12.5px; font-weight: 800; color: var(--ink); margin-top: 2px; }
.qc-matrix .win { background: rgba(22,163,74,0.12); border: 1px solid rgba(22,163,74,0.35); color: #16a34a; }
.qc-matrix .win b { color: #16a34a; font-size: 13.5px; }

/* Power BI Analytics Suite Styling (Inside Owner ERP) */
.pbi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 14px; }
.pbi-card {
  background: linear-gradient(145deg, #0f172a, #1e293b); color: #fff;
  border-radius: 16px; padding: 12px; box-shadow: 0 10px 22px rgba(15,23,42,0.22);
  border: 1px solid rgba(255,255,255,0.08);
}
.pbi-card small { font-size: 9.5px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: .8px; display: block; }
.pbi-card b { font-size: 20px; font-weight: 800; color: #fde047; display: block; margin: 3px 0; }
.pbi-card span { font-size: 10.5px; color: #4ade80; font-weight: 700; }
.hm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; text-align: center; }
.hm-cell { padding: 8px 4px; border-radius: 10px; font-size: 10.5px; font-weight: 800; }
.spark-bar { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; vertical-align: middle; margin-left: 6px; }
.spark-bar i { width: 4px; background: var(--o); border-radius: 2px; }

/* 3D Cards & KPIs */
.card {
  background: linear-gradient(180deg, var(--sf), var(--sf2));
  border: 1px solid var(--ln); border-radius: 22px; padding: 16px; margin-bottom: 16px;
  box-shadow: var(--sh-card);
}
.card h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 14px; }
.kpi div { background: linear-gradient(180deg, var(--sf), var(--sf2)); border: 1px solid var(--ln); border-radius: 16px; padding: 11px 6px; text-align: center; box-shadow: var(--sh-card); }
.kpi b { display: block; font-size: 18px; font-weight: 800; color: var(--o); }
.kpi span { font-size: 10px; font-weight: 800; color: var(--mu); text-transform: uppercase; }

.bar { height: 8px; background: var(--sf2); border-radius: 99px; overflow: hidden; box-shadow: var(--sh-in); margin: 8px 0 4px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #16a34a, #22c55e); transition: width .3s; }

/* 3D Tactile Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 13px 16px; border: 0; border-radius: 15px;
  background: linear-gradient(180deg, #ff7a33, #ff4800);
  color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none;
  box-shadow: var(--sh-3d-o); transition: transform .1s, box-shadow .1s; margin-top: 8px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b33600; }
.btn.g { background: linear-gradient(180deg, #19b374, #0b6e46); box-shadow: var(--sh-3d-g); }
.btn.g:active { box-shadow: 0 1px 0 #053b25; }
.btn.w { background: var(--sf); color: var(--ink); border: 1px solid var(--ln); box-shadow: var(--sh-3d-w); }
.btn.sm { width: auto; display: inline-flex; padding: 8px 12px; font-size: 11.5px; border-radius: 11px; margin: 0; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > * { flex: 1; }

.inp {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--ln); border-radius: 13px;
  background: var(--sf2); color: var(--ink); font-weight: 700; font-size: 13.5px;
  box-shadow: var(--sh-in); margin: 5px 0; outline: none;
}
.inp:focus { border-color: var(--o); background: var(--sf); }
.lbl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: var(--mu); margin: 11px 0 4px; text-transform: uppercase; }

/* Segmented Controls */
.seg { display: flex; gap: 5px; background: var(--sf2); padding: 5px; border-radius: 14px; box-shadow: var(--sh-in); margin: 5px 0; }
.seg button { flex: 1; padding: 9px 4px; border: 0; border-radius: 10px; background: transparent; font-weight: 800; font-size: 11.5px; color: var(--mu); cursor: pointer; }
.seg button.on { background: linear-gradient(180deg, #ff7a33, #ff4800); color: #fff; box-shadow: 0 3px 0 #b33600; }

/* FSSAI Veg/Non-Veg Symbol */
.sym { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 2px solid #16a34a; border-radius: 3px; background: #fff; flex: none; }
.sym i { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }
.sym.nv { border-color: #dc2626; }
.sym.nv i { background: #dc2626; }

/* Category & Area Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px 6px 6px; border-radius: 99px; border: 1px solid var(--ln);
  background: var(--sf); font-weight: 800; font-size: 12px; box-shadow: var(--sh-3d-w); cursor: pointer;
}
.chips button img { width: 25px; height: 25px; border-radius: 50%; }
.chips button.on { background: linear-gradient(180deg, #ff7a33, #ff4800); color: #fff; border-color: transparent; box-shadow: 0 3px 0 #b33600; }

.area-chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.area-chips::-webkit-scrollbar { display: none; }
.area-chips span { flex: none; padding: 6px 11px; border-radius: 10px; font-size: 11px; font-weight: 800; background: var(--sf2); border: 1px solid var(--ln); color: var(--mu); cursor: pointer; }
.area-chips span.on { background: rgba(255,85,0,0.12); color: var(--o); border-color: var(--o); }

/* 30-Day Visual Tiffin Calendar */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 8px; }
.cal-d { padding: 6px 2px; border-radius: 9px; text-align: center; font-size: 10.5px; font-weight: 800; background: var(--sf2); border: 1px solid var(--ln); }
.cal-d.dn { background: #dcfce7; color: #166534; border-color: #86efac; }
.cal-d.sk { background: #fee2e2; color: #991b1b; border-color: #fca5a5; text-decoration: line-through; }
.cal-d.td { border: 2px solid var(--o); color: var(--o); }

/* 3D Product Grid */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.pcard {
  background: linear-gradient(180deg, var(--sf), var(--sf2));
  border: 1px solid var(--ln); border-radius: 20px; padding: 9px;
  box-shadow: var(--sh-card); display: flex; flex-direction: column; position: relative;
}
.pimg {
  height: 126px; border-radius: 14px; position: relative; cursor: pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,0.16); background: #1e293b; margin-bottom: 8px; overflow: hidden;
}
.pimg img { width: 100%; height: 100%; transition: transform .3s; }
.pimg:active img { transform: scale(1.08); }
.badge { position: absolute; top: 7px; left: 7px; background: #16a34a; color: #fff; font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 6px; z-index: 6; }
.fav-btn {
  position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%;
  border: 0; background: rgba(255,255,255,0.9); display: grid; place-items: center;
  cursor: pointer; z-index: 7; box-shadow: 0 2px 6px rgba(0,0,0,0.2); font-size: 13px;
}
.hot-tag { position: absolute; bottom: 6px; right: 6px; background: rgba(15,23,42,0.86); color: #fde047; font-size: 8.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; z-index: 6; }
.half-tag { position: absolute; bottom: 6px; left: 6px; background: #f59e0b; color: #fff; font-size: 8.5px; font-weight: 800; padding: 3px 6px; border-radius: 6px; z-index: 6; }
.pname { font-size: 12.5px; font-weight: 800; line-height: 1.3; height: 33px; overflow: hidden; display: flex; align-items: flex-start; gap: 5px; cursor: pointer; }
.pprice { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 8px; }
.pprice b { font-size: 16px; font-weight: 800; color: var(--o); }
.pprice s { font-size: 11px; color: var(--mu); margin-left: 4px; }
.v3d-btn { font-size: 9.5px; font-weight: 800; color: #16a34a; background: rgba(22,163,74,0.12); padding: 2px 6px; border-radius: 5px; cursor: pointer; }

.qty { display: flex; align-items: center; justify-content: space-between; background: var(--sf2); padding: 3px; border-radius: 12px; box-shadow: var(--sh-in); margin-top: auto; }
.qty button { width: 30px; height: 30px; border-radius: 8px; border: 0; background: linear-gradient(180deg, #ff7a33, #ff4800); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 0 #b33600; }
.qty b { font-size: 13px; font-weight: 800; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--ln); }
.row:last-child { border-bottom: 0; }
.tot { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 6px; border-top: 2px solid var(--ln); }
.tot b { font-size: 22px; font-weight: 800; color: var(--o); }

/* 3D Pop-Out Modal & Cart Drawer */
.ov { position: fixed; inset: 0; z-index: 1200; background: rgba(8,14,22,0.82); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; }
.sh {
  background: var(--sf); width: 100%; max-width: 510px; max-height: 91vh; overflow-y: auto;
  border-radius: 28px 28px 0 0; padding: 18px; box-shadow: 0 -10px 40px rgba(0,0,0,0.45);
  animation: slideUp .24s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } }

/* 3D Floating Plate Stage */
.pop-stage {
  position: relative; height: 220px; margin: 4px 0 14px; border-radius: 22px;
  background: radial-gradient(circle at 50% 60%, #3b1708, #090e17 75%);
  display: flex; align-items: center; justify-content: center; overflow: visible;
  box-shadow: 0 16px 32px rgba(0,0,0,0.4);
}
.pop-plate {
  width: 190px; height: 190px; border-radius: 50%; object-fit: cover; border: 4px solid #fff;
  box-shadow: 0 22px 38px rgba(0,0,0,0.7), 0 0 28px rgba(255,85,0,0.45);
  animation: popOut3D .5s cubic-bezier(.18,1.25,.4,1) forwards; z-index: 2;
}
@keyframes popOut3D {
  0% { transform: scale(0.3) translateY(50px) rotate(-15deg); opacity: 0; }
  100% { transform: scale(1.04) translateY(-6px) rotate(0deg); opacity: 1; }
}
.pop-steam { position: absolute; top: -18px; left: 0; right: 0; height: 140px; pointer-events: none; z-index: 4; }
.pop-steam span {
  position: absolute; bottom: 8px; width: 48px; height: 48px;
  background: radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%; filter: blur(6px); opacity: 0; animation: bigSteam 2s infinite ease-out;
}
.pop-steam span:nth-child(1) { left: 32%; animation-delay: 0s; }
.pop-steam span:nth-child(2) { left: 46%; width: 60px; height: 60px; animation-delay: 0.6s; }
.pop-steam span:nth-child(3) { left: 56%; animation-delay: 1.2s; }
@keyframes bigSteam {
  0% { transform: translateY(25px) scale(0.4); opacity: 0; }
  35% { opacity: 0.9; }
  100% { transform: translateY(-90px) scale(2.6) translateX(12px); opacity: 0; }
}

/* Fixed Floating Cart Bar with QuickCom Savings */
.cbar-fixed {
  position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom));
  z-index: 950; max-width: 640px; margin: 0 auto;
  background: linear-gradient(145deg, #16a34a, #074729); color: #fff;
  border-radius: 16px; padding: 11px 16px; display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 5px 0 #042b18, 0 14px 28px rgba(6,43,28,0.5); cursor: pointer; font-weight: 800; font-size: 13px;
}

/* Bottom 3D Dock */
nav {
  position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
  z-index: 1000; max-width: 650px; margin: 0 auto;
  background: var(--sf); border: 1px solid var(--ln); border-radius: 20px;
  display: flex; gap: 4px; padding: 6px;
  box-shadow: 0 7px 0 rgba(15,23,42,0.12), 0 18px 38px rgba(15,23,42,0.25);
}
nav button {
  flex: 1; border: 0; background: transparent; border-radius: 14px; padding: 8px 2px;

function calcDistKm(lat1, lon1, lat2, lon2) {
  if (!lat1 || !lon1 || !lat2 || !lon2) return 1.1;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return +(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(2);
}

  return a + (k.endsWith('h') ? Math.round(p.p * 0.6) : p.p) * q;
}, 0);
const cartSaved = () => Object.entries(C).reduce((a, [k, q]) => {
  const p = S.prod.find(x => x.id === parseInt(k)); if (!p || q < 1) return a;
  const isH = k.endsWith('h'), pr = isH ? Math.round(p.p * 0.6) : p.p;
  const mrp = isH ? Math.round((p.mrp || p.p * 1.18) * 0.6) : (p.mrp || Math.round(p.p * 1.18));
  return a + Math.max(0, mrp - pr) * q;
}, 0);

function render() {
  const V = { plan: vPlan, shop: vShop, services: vServices, kitchen: vKitchen, delivery: vDelivery, owner: vOwner };
  $('#v').innerHTML = (V[tab] || vPlan)();
  $('#sheet').innerHTML = sheet();
  $('#thm').innerHTML = document.documentElement.dataset.theme === 'dark' ? IC.sun : IC.moon;

  if (tab === 'plan' || tab === 'shop') setTimeout(mountRadarMap, 40);

  const n = cc(), tot = ct(), saved = cartSaved();
  $('#cbar').innerHTML = (n > 0 && !CART_OPEN && !PAY_BOX) ? `
    <div class="cbar-fixed" data-a="open_cart">
      <span>${n} Item · ${inr(tot)} ${saved > 0 ? `(Saved ${inr(saved)})` : ''}</span>
      <span>Open QuickCom Cart →</span>
    </div>` : '';

  const TABS = [
    ['plan', IC.tiffin, 'Tiffin'],
    ['shop', IC.shop, 'Shop'],
    ['services', IC.svc, 'Services']
  ];
  if (ROLE === 'staff' || ROLE === 'owner') {
    TABS.push(['kitchen', IC.kitchen, 'Kitchen'], ['delivery', IC.route, 'Route']);
  }
  if (ROLE === 'owner') TABS.push(['owner', IC.owner, 'Owner']);

  $('#nav').innerHTML = TABS.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-a="tab" data-v="${x[0]}">${x[1]}<span class="nl">${x[2]}</span>${x[0] === 'shop' && n ? `<span class="nb">${n}</span>` : ''}</button>`).join('');
}

function checkUser() {
  if (!F.name.trim() || ph(F.phone).length !== 10 || !F.addr.trim()) {
    toast('Naam, 10-digit Mobile Number aur Address bharein');
    return false;
  }
  saveUser();
  return true;
}

const A = {
  tab: v => { tab = v; PQ = SVB = null; CART_OPEN = false; PAY_BOX = null; render(); scrollTo({ top: 0, behavior: 'smooth' }); },
  fset: (v, k) => { F[k] = (k === 'days' || k === 'times') ? +v : v; render(); },
  er_inc: () => { F.extraRoti = Math.min(6, (+F.extraRoti || 0) + 1); render(); },
  er_dec: () => { F.extraRoti = Math.max(0, (+F.extraRoti || 0) - 1); render(); },
  set_area: v => {
    F.area = v;
    const found = UDALA_AREAS.find(x => x[0] === v);
    if (found) { F.lat = found[1]; F.lng = found[2]; }
    saveUser(); render();
  },
  cat: v => { SCAT = v; render(); },
  vo: () => { VO = VO ? 0 : 1; render(); },
  wish: (v, k, id) => {
    const i = S.wish.indexOf(+id);
    if (i >= 0) S.wish.splice(i, 1); else S.wish.push(+id);
    save(); toast(i >= 0 ? 'Removed from Saved' : 'Saved to Favorites');
  },
  pq: (v, k, id) => { PQ = +id; render(); },
  open_cart: () => { PQ = null; CART_OPEN = true; render(); },
  add_open_cart: (v, k, id) => { if (!C[id] && !C[id + 'h']) C[id] = 1; localStorage.setItem('nu5c', JSON.stringify(C)); PQ = null; CART_OPEN = true; render(); },
  close: () => { PQ = SVB = null; CART_OPEN = false; PAY_BOX = null; render(); },
  close_bg: (v, k, id, e) => { if (e && e.target.classList.contains('ov')) { PQ = SVB = null; CART_OPEN = false; PAY_BOX = null; render(); } },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  ih: (v, k, id) => { C[id + 'h'] = (C[id + 'h'] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dh: (v, k, id) => { C[id + 'h'] = Math.max(0, (C[id + 'h'] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },

  again: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    o.items.forEach(i => {
      const p = S.prod.find(x => i.n.startsWith(x.n));
      if (p && p.s) C[p.id] = (C[p.id] || 0) + i.q;
    });
    localStorage.setItem('nu5c', JSON.stringify(C));
    CART_OPEN = true; render(); toast('Items added to Cart!');
  },

  bpkg: v => { BF.pkg = v; render(); },
  b_inc: () => { BF.plates = Math.min(1000, BF.plates + 25); render(); },
  b_dec: () => { BF.plates = Math.max(20, BF.plates - 25); render(); },
  book_bulk: () => {
    if (!checkUser() || !BF.event.trim()) { toast('Event naam aur address bharein'); return; }
    const bc = calcBulk();
    S.bulk.push({ id: uid('b'), event: BF.event.trim(), date: BF.date, venue: BF.venue, plates: BF.plates, amt: bc.total, name: F.name.trim(), phone: ph(F.phone) });
    save(); toast('Bulk Party Catering Request Saved!');
  },

  svb: (v, k, id) => { SVB = id; render(); },
  svok: () => {
    const s = SVC.find(x => x.id === SVB); if (!s || !checkUser()) return;
    S.sv.push({ id: uid('v'), svname: s.n, date: $('#sv_d').value, note: $('#sv_n').value, name: F.name.trim(), phone: ph(F.phone) });
    SVB = null; save(); toast('Service Booking Confirmed!');
  },

  getgps: () => {
    if (!navigator.geolocation) { F.lat = 21.5742; F.lng = 86.5681; saveUser(); render(); toast('GPS Saved'); return; }
    toast('Scanning satellite GPS...');
    navigator.geolocation.getCurrentPosition(pos => {
      F.lat = +pos.coords.latitude.toFixed(5); F.lng = +pos.coords.longitude.toFixed(5);
      saveUser(); render(); toast('Exact CartRadar GPS Pin Locked!');
    }, () => {
      F.lat = 21.5742; F.lng = 86.5681; saveUser(); render(); toast('Udala Radar Pin Set');
    }, { enableHighAccuracy: true, timeout: 6000 });
  },

  pay_sub: () => {
    if (!checkUser()) return;
    PAY_BOX = { kind: 'sub', amt: calcPlanPrice(), days: F.days, title: `${F.days} Din Tiffin (${F.times} Time)` };
    render();
  },
  pay_trial: () => {
    if (!checkUser()) return;
    PAY_BOX = { kind: 'sub', amt: 49, days: 1, title: `1 Din Trial Tiffin (${F.times} Time)` };
    render();
  },
  pay_ord: () => {
    if (!checkUser()) return;
    CART_OPEN = false;
    PAY_BOX = { kind: 'ord', amt: ct(), title: `Shop Order (${cc()} Items)` };
    render();
  },

  copy_upi: () => { navigator.clipboard.writeText(UPI).catch(() => {}); toast('UPI ID Copied: ' + UPI); },

  confirm_paid: () => {
    if (!PAY_BOX) return;
    const refNo = ($('#utr_inp') ? $('#utr_inp').value.trim() : '') || 'DOORSTEP-QR';
    if (PAY_BOX.kind === 'sub') {
      const id = uid('s');
      S.subs.push({
        id, name: F.name.trim(), phone: ph(F.phone), area: F.area, addr: F.addr.trim(), lat: F.lat, lng: F.lng,
        type: F.type, days: PAY_BOX.days, times: F.times, lunch: F.lunch, dinner: F.dinner, extraRoti: F.extraRoti,
        start: F.start || iso(D0()), price: PAY_BOX.amt, paid: 1, utr: refNo, skip: []
      });
      MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
      PAY_BOX = null; save(); toast('Tiffin Plan Activated!');
    } else {
      const otp = String(Math.floor(1000 + Math.random() * 9000));
      const items = [];
      Object.entries(C).forEach(([k, q]) => {
        const p = S.prod.find(x => x.id === parseInt(k)); if (!p || q < 1) return;
        const isH = k.endsWith('h'), pr = isH ? Math.round(p.p * 0.6) : p.p;
        items.push({ n: p.n + (isH ? ' (Half)' : ''), q, p: pr });
      });
      const id = uid('o');
      S.orders.push({ id, ts: Date.now(), date: iso(D0()), name: F.name.trim(), phone: ph(F.phone), area: F.area, addr: F.addr.trim(), lat: F.lat, lng: F.lng, items, total: PAY_BOX.amt, paid: 1, dlv: 0, utr: refNo, otp });
      MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
      C = {}; localStorage.setItem('nu5c', '{}');
      PAY_BOX = null; save(); toast('Order Confirmed!');
    }
  },

  cust_skip: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    s.skip = s.skip || [];
    const td = iso(D0());
    if (!s.skip.includes(td)) { s.skip.push(td); s.days = (+s.days || 30) + 1; save(); toast('Paused Today & +1 Extra Day Added!'); }
  },
  dabba: (v, k, id) => { const key = iso(D0()) + '_' + id; S.dabba[key] = S.dabba[key] ? 0 : 1; save(); toast('Dabba Status Updated'); },
  sdone: (v, k, id) => { S.done[iso(D0()) + '_' + id] = 1; save(); toast('Tiffin Delivered ✓'); },
  all_tiffin_done: () => {
    const k = iso(D0());
    (S.subs || []).filter(s => act(s, D0())).forEach(s => { S.done[k + '_' + s.id] = 1; });
    save(); toast('All Tiffins Marked Delivered ✓');
  },

  odlv: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    const pin = prompt(`Enter Customer ${o.name}'s 4-Digit OTP (${o.otp || '8821'}) or Owner PIN:`);
    if (pin === String(o.otp || '8821') || pin === OPIN) { o.dlv = 1; save(); toast('Shop Order Delivered ✓'); }
    else if (pin !== null) toast('Invalid OTP');
  },

  ov_tab: v => { OV = v; ED = null; render(); },
  add_exp: () => {
    const n = $('#exp_n').value.trim(), a = +$('#exp_a').value;
    if (!n || !(a > 0)) { toast('Enter Expense Name & Amount'); return; }
    S.exp.push({ d: iso(D0()), n, amt: a }); save(); toast('Expense Added');
  },
  savem: () => { S.mset[iso(D0())] = { bf: $('#m_bf').value.trim(), veg: $('#m_veg').value.trim(), nv: $('#m_nv').value.trim() }; save(); toast('Live Menu Saved'); },
  stk: (v, k, id) => { const p = S.prod.find(x => x.id === +id); if (p) { p.s = p.s ? 0 : 1; save(); } },
  edit_prod: (v, k, id) => {
    ED = +id; const p = S.prod.find(x => x.id === ED); if (!p) return;
    setTimeout(() => { $('#p_n').value = p.n; $('#p_p').value = p.p; $('#p_m').value = p.mrp || ''; $('#p_c').value = p.c; }, 50);
  },
  save_prod: () => {
    const n = $('#p_n').value.trim(), p = +$('#p_p').value, m = +$('#p_m').value || null, c = $('#p_c').value;
    if (!n || !(p > 0)) { toast('Enter Name & Price'); return; }
    const img = (CATS.find(x => x[0] === c) || ['', '', IMG.groc])[2];
    if (ED) { const x = S.prod.find(y => y.id === ED); if (x) Object.assign(x, { n, p, mrp: m, c }); ED = null; }
    else S.prod.push({ id: Date.now(), n, p, mrp: m, c, img, h: c === 'Khana' ? 1 : 0, hot: c === 'Khana' ? 1 : 0, nv: 0, s: 1 });
    save(); toast('Product Saved');
  },
  del_prod: (v, k, id) => { S.prod = S.prod.filter(x => x.id !== +id); save(); toast('Deleted'); },
  csv_ledger: () => {
    const rows = [['Type', 'Date', 'Name', 'Amount']];
    S.orders.forEach(o => rows.push(['IN-ORD', o.date, o.name, o.total]));
    S.subs.forEach(s => rows.push(['IN-SUB', s.start, s.name, s.price]));
    S.exp.forEach(x => rows.push(['EXPENSE', x.d, x.n, x.amt]));
    dlCsv('namaste_udala_ledger.csv', rows);
  },
  csv_cust: () => {
    const rows = [['Name', 'Phone', 'Area']];
    S.subs.forEach(s => rows.push([s.name, s.phone, s.area]));
    S.orders.forEach(o => rows.push([o.name, o.phone, o.area]));
    dlCsv('customers.csv', rows);
  },
  voice: () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Use Chrome for Voice Search'); return; }
    const r = new SR(); r.lang = 'hi-IN'; toast('Boliye kya chahiye...');
    r.onresult = e => { SQ = e.results[0][0].transcript; SCAT = 'all'; render(); };
    r.start();
  },
  prt: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    $('#printArea').innerHTML = `<h2>NAMASTE UDALA</h2><p>Bill #${String(o.id).slice(-4)} · ${o.date} ${tm(o.ts)}</p><p>${esc(o.name)} (${esc(o.phone)})<br>${esc(o.area)} · ${esc(o.addr)}<br>Ref: ${esc(o.utr)}</p><hr>${o.items.map(i => `<div>${esc(i.n)} x ${i.q} = ${inr(i.p * i.q)}</div>`).join('')}<hr><h3>TOTAL: ${inr(o.total)}</h3>`;
    window.print();
  },
  theme: () => { const d = document.documentElement.dataset.theme !== 'dark'; document.documentElement.dataset.theme = d ? 'dark' : ''; render(); },
  logout_staff: () => { ROLE = ''; sessionStorage.removeItem('nu_role'); tab = 'plan'; render(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset.v, b.dataset.k, b.dataset.id, e); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.dataset.b) BF[e.target.dataset.b] = e.target.value;
  if (e.target.dataset.sim) { SIM[e.target.dataset.sim] = +e.target.value; render(); }
  if (e.target.id === 'sq') { SQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#sq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

let taps = 0, tapT;
$('#mark').addEventListener('click', () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1800);
  if (taps >= 5) {
    taps = 0;
    const pin = prompt('Owner PIN (4827) ya Kitchen/Delivery PIN (7788) daalein:');
    if (pin === OPIN) { ROLE = 'owner'; sessionStorage.setItem('nu_role', 'owner'); tab = 'owner'; render(); toast('Power BI + Owner ERP Unlocked'); }
    else if (pin === DPIN) { ROLE = 'staff'; sessionStorage.setItem('nu_role', 'staff'); tab = 'kitchen'; render(); toast('Kitchen & Route Unlocked'); }
    else if (pin !== null) toast('Galat PIN');
  }
});

render();
</script>
</body>
</html>
