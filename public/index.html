<style>

  --sh-3d-o: 0 6px 0 #b83200, 0 14px 24px rgba(255,90,31,0.4), inset 0 2px 1px rgba(255,255,255,0.5);
  --sh-3d-g: 0 6px 0 #063824, 0 14px 24px rgba(14,92,63,0.35), inset 0 2px 1px rgba(255,255,255,0.4);
  --sh-3d-w: 0 5px 0 #cbd5e1, 0 10px 18px rgba(15,23,42,0.08), inset 0 2px 0 #fff;
  --sh-in: inset 0 4px 8px rgba(15,23,42,0.09), inset 0 1px 2px rgba(15,23,42,0.12), 0 1px 0 #fff;
}
[data-theme=dark] {
  --bg: #0b1116;
  --sf: #17212b;
  --sf2: #111921;
  --ink: #f1f5f9;
  --mu: #94a3b8;
  --ln: #263545;
  --sh-card: 0 20px 38px -8px rgba(0,0,0,0.65), inset 0 1.5px 0 rgba(255,255,255,0.08), inset 0 -3px 0 rgba(0,0,0,0.45);
  --sh-3d-w: 0 5px 0 #090d11, 0 10px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
  --sh-in: inset 0 4px 8px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.05);

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body {
  background: radial-gradient(circle at 15% 5%, rgba(255,154,61,0.2), transparent 45%),
              radial-gradient(circle at 85% 15%, rgba(21,154,99,0.16), transparent 45%), var(--bg);
  color: var(--ink);
  padding-bottom: 120px;
  min-height: 100vh;
  perspective: 1200px;
}
img { display: block; object-fit: cover; }
button, input, select { font: inherit; color: inherit; }

/* 3D Realistic Header */
header {
  position: sticky; top: 0; z-index: 60;
  background: linear-gradient(145deg, #137a54, #073523);
  color: #fff; padding: 13px 15px;
  border-radius: 0 0 26px 26px;
  box-shadow: 0 7px 0 #042115, 0 18px 34px rgba(8,46,32,0.45), inset 0 2px 1px rgba(255,255,255,0.25);
  display: flex; align-items: center; gap: 12px;
}
.logo {
  width: 46px; height: 46px; border-radius: 15px;
  background: linear-gradient(145deg, #ff9a3d, #ff4500);
  display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #fff;
  box-shadow: 0 5px 0 #9e2a00, 0 10px 18px rgba(0,0,0,0.35), inset 0 2px 2px rgba(255,255,255,0.6);
  cursor: pointer; user-select: none;
}
.logo:active { transform: translateY(4px); box-shadow: 0 1px 0 #9e2a00; }
.brand { flex: 1; }
.brand small { display: block; color: #fde047; font-size: 9.5px; letter-spacing: 2px; font-weight: 800; }
.brand h1 { font-size: 19px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.35); }

main { padding: 18px 14px 0; max-width: 680px; margin: 0 auto; }

/* 3D Hero Banners */
.hero3d {
  position: relative; border-radius: 26px; padding: 22px 18px; margin-bottom: 18px; color: #fff;
  background: linear-gradient(135deg, #ff8533 0%, #ff4500 65%, #b82c00 100%);
  box-shadow: 0 8px 0 #8a2000, 0 20px 38px rgba(255,69,0,0.35), inset 0 2px 2px rgba(255,255,255,0.45);
  overflow: visible;
}
.hero3d.green {
  background: linear-gradient(135deg, #1ad188 0%, #0e7a4e 65%, #07472d 100%);
  box-shadow: 0 8px 0 #042b1b, 0 20px 38px rgba(14,122,78,0.35), inset 0 2px 2px rgba(255,255,255,0.4);
}
.hero3d.purple {
  background: linear-gradient(135deg, #a855f7 0%, #6d28d9 65%, #4c1d95 100%);
  box-shadow: 0 8px 0 #331068, 0 20px 38px rgba(109,40,217,0.35), inset 0 2px 2px rgba(255,255,255,0.4);
}
.hero3d h2 { font-size: 22px; font-weight: 800; max-width: 72%; line-height: 1.18; text-shadow: 0 3px 6px rgba(0,0,0,0.3); margin-bottom: 5px; }
.hero3d p { font-size: 12.5px; font-weight: 700; opacity: .95; max-width: 72%; }
.hero3d .float3d {
  position: absolute; right: 12px; bottom: -6px; font-size: 72px;
  filter: drop-shadow(0 16px 14px rgba(0,0,0,0.45));
  animation: bob 3s ease-in-out infinite; cursor: pointer;
}
@keyframes bob { 50% { transform: translateY(-10px) scale(1.06) rotate(4deg); } }

/* Realistic Rising Hot Steam (Dhua) Effect */
.steam-wrap {
  position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible;
}
.steam-wrap i {
  position: absolute; bottom: 25%; width: 26px; height: 26px;
  background: radial-gradient(circle, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%; filter: blur(5px); opacity: 0;
  animation: steamRise 2.6s infinite ease-out;
}
.steam-wrap i:nth-child(1) { left: 28%; animation-delay: 0s; }
.steam-wrap i:nth-child(2) { left: 48%; width: 34px; height: 34px; animation-delay: 0.7s; }
.steam-wrap i:nth-child(3) { left: 62%; animation-delay: 1.4s; }
.steam-wrap i:nth-child(4) { left: 38%; width: 30px; height: 30px; animation-delay: 2.0s; }
@keyframes steamRise {
  0% { transform: translateY(10px) scale(0.5) translateX(0); opacity: 0; }
  35% { opacity: 0.75; }
  70% { transform: translateY(-42px) scale(1.9) translateX(-10px); opacity: 0.4; }
  100% { transform: translateY(-75px) scale(2.6) translateX(12px); opacity: 0; }
}

/* 3D Cards & KPIs */
.card {
  background: linear-gradient(180deg, var(--sf) 0%, var(--sf2) 100%);
  border: 1px solid var(--ln); border-radius: 24px; padding: 17px; margin-bottom: 16px;
  box-shadow: var(--sh-card);
}
.card h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.kpi div {
  background: linear-gradient(180deg, var(--sf), var(--sf2)); border: 1px solid var(--ln);
  border-radius: 18px; padding: 12px 6px; text-align: center; box-shadow: var(--sh-card);
}
.kpi b { display: block; font-size: 20px; font-weight: 800; color: var(--o); }
.kpi span { font-size: 11px; font-weight: 800; color: var(--mu); }

/* 3D Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 13px 16px; border: 0; border-radius: 16px;
  background: linear-gradient(180deg, #ff7a33, #ff4d00);
  color: #fff; font-weight: 800; font-size: 14.5px; cursor: pointer; text-decoration: none;
  box-shadow: var(--sh-3d-o); transition: transform .1s, box-shadow .1s; margin-top: 9px;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #b83200; }
.btn.g { background: linear-gradient(180deg, #19b374, #0e7047); box-shadow: var(--sh-3d-g); }
.btn.g:active { box-shadow: 0 1px 0 #063824; }
.btn.w { background: linear-gradient(180deg, var(--sf), var(--sf2)); color: var(--ink); border: 1px solid var(--ln); box-shadow: var(--sh-3d-w); }
.btn.w:active { box-shadow: 0 1px 0 #cbd5e1; }
.btn.sm { width: auto; display: inline-flex; padding: 8px 13px; font-size: 12px; border-radius: 12px; margin: 0; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > * { flex: 1; }

/* Inputs & Segmented Controls */
.inp {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--ln); border-radius: 14px;
  background: var(--sf2); color: var(--ink); font-weight: 700; font-size: 14px;
  box-shadow: var(--sh-in); margin: 5px 0; outline: none;
}
.inp:focus { border-color: var(--o); background: var(--sf); }
.lbl { display: block; font-size: 11.5px; font-weight: 800; color: var(--mu); margin: 11px 0 4px; }

.seg {
  display: flex; gap: 6px; background: var(--sf2); padding: 5px;
  border-radius: 15px; box-shadow: var(--sh-in); margin: 5px 0;
}
.seg button {
  flex: 1; padding: 10px 4px; border: 0; border-radius: 11px;
  background: transparent; font-weight: 800; font-size: 12px; color: var(--mu); cursor: pointer; transition: .15s;
}
.seg button.on {
  background: linear-gradient(180deg, #ff7a33, #ff4d00); color: #fff;
  box-shadow: 0 4px 0 #b83700, 0 6px 12px rgba(255,77,0,0.3); transform: translateY(-1px);

/* Category Pills */
.chips { display: flex; gap: 9px; overflow-x: auto; padding: 4px 2px 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; padding: 9px 15px; border-radius: 99px; border: 1px solid var(--ln);
  background: var(--sf); font-weight: 800; font-size: 12px; color: var(--ink);
  box-shadow: var(--sh-3d-w); cursor: pointer;
}
.chips button.on {
  background: linear-gradient(180deg, #ff7a33, #ff4d00); color: #fff; border-color: transparent;
  box-shadow: 0 4px 0 #b83700, 0 8px 14px rgba(255,77,0,0.35); transform: translateY(-2px);
}

/* 3D Pop-Out Product Cards */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 18px; }
.pcard {
  background: linear-gradient(180deg, var(--sf), var(--sf2));
  border: 1px solid var(--ln); border-radius: 22px; padding: 10px;
  box-shadow: var(--sh-card); display: flex; flex-direction: column;
  position: relative; transition: transform .25s cubic-bezier(.2,.8,.2,1);
}
.pcard:active { transform: translateY(-6px) rotateX(6deg) scale(1.03); z-index: 10; }
.pimg {
  height: 126px; border-radius: 16px; position: relative; cursor: pointer;
  box-shadow: 0 10px 20px rgba(0,0,0,0.18); background: var(--sf2); margin-bottom: 10px; overflow: hidden;
}
.pimg img { width: 100%; height: 100%; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.pcard:hover .pimg img, .pcard:active .pimg img { transform: scale(1.12); }
.badge {
  position: absolute; top: 7px; left: 7px; background: linear-gradient(180deg, #22c55e, #15803d);
  color: #fff; font-size: 9.5px; font-weight: 800; padding: 3px 7px; border-radius: 7px; z-index: 6;
  box-shadow: 0 3px 6px rgba(0,0,0,0.25);
}
.hot-tag {
  position: absolute; bottom: 7px; right: 7px; background: rgba(15,23,42,0.82);
  color: #fde047; font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 8px; z-index: 6;
  backdrop-filter: blur(4px);
}
.pname { font-size: 13px; font-weight: 800; line-height: 1.3; margin-bottom: 4px; height: 34px; overflow: hidden; }
.pprice { display: flex; align-items: baseline; gap: 6px; margin-bottom: 9px; }
.pprice b { font-size: 16.5px; font-weight: 800; color: var(--o); }
.pprice s { font-size: 11px; color: var(--mu); }

/* 3D Stepper */
.qty {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--sf2); padding: 4px; border-radius: 13px; box-shadow: var(--sh-in); margin-top: auto;
}
.qty button {
  width: 32px; height: 32px; border-radius: 9px; border: 0;
  background: linear-gradient(180deg, #ff7a33, #ff4d00); color: #fff;
  font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 #b83700;

.qty button:active { transform: translateY(2px); box-shadow: none; }
.qty b { font-size: 13.5px; font-weight: 800; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--ln); }
.row:last-child { border-bottom: 0; }
.tot { display: flex; justify-content: space-between; align-items: center; padding-top: 13px; margin-top: 6px; border-top: 2px solid var(--ln); }
.tot b { font-size: 23px; font-weight: 800; color: var(--o); }

.ov {
  position: fixed; inset: 0; z-index: 200; background: rgba(8,14,22,0.78);
  backdrop-filter: blur(8px); display: flex; align-items: flex-end; justify-content: center;

@keyframes fadeIn { from { opacity: 0; } }
.sh {

  animation: slideUp .28s cubic-bezier(.2,.8,.2,1);

@keyframes slideUp { from { transform: translateY(100%); } }

.pop-stage {

  border-radius: 24px; background: radial-gradient(circle at 50% 60%, #2a1810, #0f172a);

@keyframes popOut3D {

  70% { transform: scale(1.1) translateY(-14px) rotate(3deg); }
  100% { transform: scale(1.04) translateY(-8px) rotate(0deg); opacity: 1; }
}
.pop-steam {
  position: absolute; top: -18px; left: 0; right: 0; height: 140px; pointer-events: none; z-index: 4;
}
.pop-steam span {
  position: absolute; bottom: 10px; width: 48px; height: 48px;

.pop-steam span:nth-child(1) { left: 32%; animation-delay: 0s; }

.pop-steam span:nth-child(4) { left: 38%; width: 54px; height: 54px; animation-delay: 1.5s; }
@keyframes bigSteam {
  0% { transform: translateY(30px) scale(0.4); opacity: 0; }
  35% { opacity: 0.9; }
  100% { transform: translateY(-95px) scale(2.8) translateX(15px); opacity: 0; }
}

.cbar {
  position: sticky; bottom: 98px; z-index: 40;
  background: linear-gradient(145deg, #16a34a, #09472b); color: #fff;

nav button {
  flex: 1; border: 0; background: transparent; border-radius: 15px; padding: 8px 2px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--mu); font-weight: 800; position: relative; transition: .15s;
}
nav button.on {
  background: linear-gradient(180deg, #ff7a33, #ff4d00); color: #fff;
  box-shadow: 0 4px 0 #b83700, 0 8px 14px rgba(255,77,0,0.35); transform: translateY(-4px);

nav .ni { font-size: 18px; }
nav .nl { font-size: 9.5px; }
nav .nb {
  position: absolute; top: 2px; right: 14%; background: #16a34a; color: #fff;
  font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 99px; border: 1.5px solid #fff;

#toast {
  position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%) translateY(20px);

  box-shadow: 0 5px 0 #000, 0 14px 28px rgba(0,0,0,0.4); transition: .25s;

#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.wa {
  position: fixed; right: 14px; bottom: 102px; z-index: 70; width: 52px; height: 52px;
  border-radius: 50%; background: linear-gradient(145deg, #25d366, #128c4a);
  display: grid; place-items: center; font-size: 25px; text-decoration: none;
  box-shadow: 0 5px 0 #09522b, 0 14px 26px rgba(18,140,74,0.45);

#printArea { display: none; }
@media print { body > * { display: none !important; } #printArea { display: block !important; padding: 16px; font-family: monospace; } }
</style>

};

const calcPlanPrice = () => {

};

        <a class="btn w sm" href="tel:+91${esc(s.phone)}">📞 Call</a>
        <button class="btn g sm" data-a="sdone" data-id="${s.id}">✅ De Diya</button>
      </div>
    </div>`).join('') || '<p style="color:#16a34a;font-weight:800">🎉 Saare Tiffin Deliver Ho Gaye!</p>'}
  </div>

  <div class="card">
    <h3>🛒 Shop Order Delivery (${pendOrds.length} Baaki)</h3>
    ${pendOrds.map(o => `<div class="row" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between">
        <b>${esc(o.name)} — ${inr(o.total)}</b>
        <span style="font-weight:800;color:${o.paid ? '#16a34a' : '#dc2626'}">${o.paid ? 'PAID' : 'CASH/UPI LO'}</span>
      </div>
      <div style="font-size:12px;color:var(--mu);margin:4px 0">📍 ${esc(o.addr)} · ${o.items.map(i => i.n + '×' + i.q).join(', ')}</div>
      <div class="btn-row" style="margin-top:6px">
        <a class="btn w sm" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.addr + ' Udala')}" target="_blank">📍 Map</a>
        <a class="btn w sm" href="tel:+91${esc(o.phone)}">📞 Call</a>
        <button class="btn g sm" data-a="odlv" data-id="${o.id}">✅ Delivered</button>
      </div>
    </div>`).join('') || '<p style="color:#16a34a;font-weight:800">🎉 Saare Shop Orders Deliver Ho Gaye!</p>'}`;
}

/* --- 5. SERVICES VIEW --- */
function vServices() {
  return `
  <div class="hero3d purple">
    <h2>🎪 Udala Local Services & Catering</h2>
    <p>Tuition · Photography · Decoration · Hostel · Party Catering</p>
    <div class="float3d">🎪</div>
  </div>
  ${SVC.map(s => `
    <div class="card" style="display:flex;gap:14px;align-items:center">
      <img src="${s.img}" style="width:86px;height:86px;border-radius:16px;box-shadow:0 8px 16px rgba(0,0,0,0.2)">
      <div style="flex:1">
        <div style="font-weight:800;font-size:15px">${esc(s.n)}</div>
        <p style="font-size:12px;color:var(--mu);margin:4px 0 8px">${esc(s.d)}</p>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b style="color:var(--o);font-size:16px">${inr(s.p)}<span style="font-size:11px;color:var(--mu)">${s.u}</span></b>
          <button class="btn sm" data-a="svb" data-id="${s.id}">Book Karein</button>
        </div>
      </div>
    </div>
  `).join('')}`;
}

/* --- 6. OWNER PANEL --- */
function vOwner() {
  const ords = (S.orders || []).slice().reverse();
  const subs = (S.subs || []).slice().reverse();
  return `
  <div class="hero3d purple">
    <h2>📊 Owner Control Room</h2>
    <p>Menu, Orders, Tiffin aur Stock Control (PIN: 4827)</p>
    <div class="float3d">👑</div>
  </div>

  <div class="card">
    <h3>🍽️ Aaj Ka 3-Time Menu Update (${iso(D0())})</h3>
    <span class="lbl">🌅 Subah Nashta</span>
    <input class="inp" id="m_bf" value="${esc(menu(D0(), 'bf'))}">
    <span class="lbl">🟢 Pure Veg Menu</span>
    <input class="inp" id="m_veg" value="${esc(menu(D0(), 'veg'))}">
    <span class="lbl">🍗 Non-Veg Menu</span>
    <input class="inp" id="m_nv" value="${esc(menu(D0(), 'nv'))}">
    <button class="btn g" data-a="savem">💾 Live Menu Save Karein</button>
  </div>

  <div class="card">
    <h3>🛒 Shop Orders (${ords.length})</h3>
    ${ords.map(o => `<div class="row">
      <div><b>${esc(o.name)} (${esc(o.phone)}) — ${inr(o.total)}</b><div style="font-size:12px;color:var(--mu)">${o.items.map(i => i.n + '×' + i.q).join(', ')}</div></div>
      <div style="display:flex;gap:5px">
        ${!o.paid ? `<button class="btn g sm" data-a="opaid" data-id="${o.id}">Paid</button>` : ''}
        ${!o.dlv ? `<button class="btn sm" data-a="odlv" data-id="${o.id}">Done</button>` : '✅'}
        <button class="btn w sm" data-a="prt" data-id="${o.id}">🖨️</button>
      </div>
    </div>`).join('') || '<p style="color:var(--mu)">Koi order nahi</p>'}
  </div>

  <div class="card">
    <h3>🍱 Tiffin Subscriptions (${subs.length})</h3>
    ${subs.map(s => `<div class="row">
      <div><b>${esc(s.name)} (${esc(s.phone)})</b><div style="font-size:12px;color:var(--mu)">${s.days}d · ${s.times || 2} Time · ${inr(s.price)}</div></div>
      ${s.paid ? '<span style="color:#16a34a;font-weight:800">✅ Paid</span>' : `<button class="btn g sm" data-a="spaid" data-id="${s.id}">Mark Paid</button>`}
    </div>`).join('')}
  </div>

  <div class="card">
    <h3>📦 Stock On / Off</h3>
    ${S.prod.map(p => `<div class="row"><b>${esc(p.n)} (${inr(p.p)})</b><button class="btn sm ${p.s ? 'g' : 'w'}" data-a="stk" data-id="${p.id}">${p.s ? 'In Stock' : 'Khatam'}</button></div>`).join('')}
  </div>`;
}

/* --- 3D POP-OUT & STEAM MODAL SHEET --- */
function sheet() {
  if (PQ) {
    const p = S.prod.find(x => x.id === +PQ); if (!p) return '';
    const qf = C[p.id] || 0, qh = C[p.id + 'h'] || 0;
    return `<div class="ov" data-a="close_bg"><div class="sh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-weight:800;color:var(--o)">🔥 3D REAL VIEW</span>
        <button class="btn w sm" data-a="close">✕ Band Karein</button>
      </div>
      <div class="pop-stage">
        ${p.hot ? `<div class="pop-steam"><span></span><span></span><span></span><span></span></div>` : ''}
        <img class="pop-plate" src="${p.img}" alt="${esc(p.n)}">
      </div>
      <h2 style="font-size:21px;font-weight:800;text-align:center">${esc(p.n)}</h2>
      <p style="text-align:center;color:var(--mu);font-size:12.5px;margin:4px 0 14px">${p.hot ? '♨️ Taza Garma-Garam Kitchen Se Seedha' : '✅ Fresh Quality Checked'}</p>

      <div class="row">
        <div><b>Full Plate / Pack</b><div style="font-size:12px;color:var(--mu)">${inr(p.p)}</div></div>
        <div class="qty" style="width:120px;margin:0">
          <button data-a="dec" data-id="${p.id}">−</button><b>${qf}</b><button data-a="inc" data-id="${p.id}">+</button>
        </div>
      </div>

      ${p.h ? `<div class="row">
        <div><b>½ Half Plate</b><div style="font-size:12px;color:var(--mu)">${inr(Math.round(p.p * 0.6))}</div></div>
        <div class="qty" style="width:120px;margin:0">
          <button data-a="dh" data-id="${p.id}">−</button><b>${qh}</b><button data-a="ih" data-id="${p.id}">+</button>
        </div>
      </div>` : ''}

      <button class="btn" data-a="buynow" data-id="${p.id}">⚡ Abhi Order Karein</button>
    </div></div>`;
  }
  if (TRK) {
    const o = S.orders.find(x => x.id === TRK); if (!o) return '';
    return `<div class="ov" data-a="close_bg"><div class="sh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3>🧾 Order #${String(o.id).slice(-5)}</h3>
        <button class="btn w sm" data-a="close">✕</button>
      </div>
      <p style="font-size:13px;color:var(--mu);margin-bottom:12px">Status: <b>${o.dlv ? '✅ Delivered' : o.paid ? '🍳 Kitchen Mein Ban Raha Hai' : '⏳ Payment Pending'}</b></p>
      ${o.items.map(i => `<div class="row"><span>${esc(i.n)} × ${i.q}</span><b>${inr(i.p * i.q)}</b></div>`).join('')}
      <div class="tot"><span>Total</span><b>${inr(o.total)}</b></div>
      ${!o.paid ? `<a class="btn" href="${esc(upi(o.total, 'Order ' + o.name))}">💳 UPI Se ${inr(o.total)} Pay Karein</a>` : ''}
      <button class="btn w" data-a="prt" data-id="${o.id}">🖨️ Bill Print Karein</button>
    </div></div>`;
  }
  if (SVB) {
    const s = SVC.find(x => x.id === SVB); if (!s) return '';
    return `<div class="ov" data-a="close_bg"><div class="sh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3>🎪 ${esc(s.n)}</h3>
        <button class="btn w sm" data-a="close">✕</button>
      </div>
      <input class="inp" id="sv_d" type="date" value="${iso(addD(D0(), 2))}">
      <input class="inp" data-f="name" placeholder="Aapka Naam" value="${esc(F.name)}">
      <input class="inp" data-f="phone" type="tel" maxlength="10" placeholder="10-digit Mobile Number" value="${esc(F.phone)}">
      <button class="btn" data-a="svok">✅ Booking Request Bhejein</button>
    </div></div>`;
  }
  return '';
}

function render() {
  const V = { plan: vPlan, shop: vShop, kitchen: vKitchen, delivery: vDelivery, services: vServices, owner: vOwner };
  $('#v').innerHTML = (V[tab] || vPlan)();
  $('#sheet').innerHTML = sheet();
  const TABS = [
    ['plan', '🍱', 'Tiffin'],
    ['shop', '🍗', 'Shop'],
    ['services', '🎪', 'Services'],
    ['kitchen', '🍳', 'Kitchen'],
    ['delivery', '🛵', 'Route'],
    ['owner', '📊', 'Owner']
  ];
  const n = cc();
  $('#nav').innerHTML = TABS.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-a="tab" data-v="${x[0]}"><span class="ni">${x[1]}</span><span class="nl">${x[2]}</span>${x[0] === 'shop' && n ? `<span class="nb">${n}</span>` : ''}</button>`).join('');
}

function need() {
  if (!F.name.trim() || ph(F.phone).length !== 10 || !F.addr.trim()) {
    toast('⚠️ Naam, 10-digit Phone aur Address bharein');
    return false;
  }
  saveUser();
  return true;
}

const A = {
  tab: v => {
    if ((v === 'kitchen' || v === 'delivery') && !OK && !ST) {
      const p = prompt('Staff PIN (7788) ya Owner PIN (4827) daalein:');
      if (p === OPIN) { OK = 1; sessionStorage.setItem('nu5ok', '1'); }
      else if (p === DPIN) { ST = 1; sessionStorage.setItem('nu5st', '1'); }
      else { if (p !== null) toast('❌ Galat PIN'); return; }
    }
    if (v === 'owner' && !OK) {
      const p = prompt('Owner PIN (4827) daalein:');
      if (p === OPIN) { OK = 1; sessionStorage.setItem('nu5ok', '1'); }
      else { if (p !== null) toast('❌ Galat PIN'); return; }
    }
    tab = v; PQ = TRK = SVB = null; render(); scrollTo({ top: 0, behavior: 'smooth' });
  },
  fset: (v, k) => { F[k] = (k === 'days' || k === 'times') ? +v : v; render(); },
  cat: v => { SCAT = v; render(); },
  pq: (v, k, id) => { PQ = +id; render(); },
  close: () => { PQ = TRK = SVB = null; render(); },
  close_bg: (v, k, id, e) => { if (e && e.target.classList.contains('ov')) { PQ = TRK = SVB = null; render(); } },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  ih: (v, k, id) => { C[id + 'h'] = (C[id + 'h'] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dh: (v, k, id) => { C[id + 'h'] = Math.max(0, (C[id + 'h'] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  buynow: (v, k, id) => {
    if (!C[id] && !C[id + 'h']) C[id] = 1;
    localStorage.setItem('nu5c', JSON.stringify(C));
    PQ = null; tab = 'shop'; render();
    setTimeout(() => { const e = $('#co'); if (e) e.scrollIntoView({ behavior: 'smooth' }); }, 120);
  },
  goco: () => { const e = $('#co'); if (e) e.scrollIntoView({ behavior: 'smooth' }); },
  trk: (v, k, id) => { TRK = id; render(); },
  svb: (v, k, id) => { SVB = id; render(); },
  svok: () => {
    const s = SVC.find(x => x.id === SVB); if (!s) return;
    if (!F.name.trim() || ph(F.phone).length !== 10) { toast('⚠️ Naam aur Phone daalein'); return; }
    saveUser();
    S.sv.push({ id: uid('v'), svname: s.n, date: $('#sv_d').value, name: F.name.trim(), phone: ph(F.phone) });
    SVB = null; save(); toast('🎉 Booking Request Bhej Di Gayi!');
  },
  sub: () => {
    if (!need()) return;
    const pr = calcPlanPrice(), id = uid('s');
    S.subs.push({ id, name: F.name.trim(), phone: ph(F.phone), addr: F.addr.trim(), type: F.type, days: F.days, times: F.times, lunch: F.lunch, dinner: F.dinner, start: iso(addD(D0(), 1)), price: pr, paid: 0, skip: [] });
    MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
    save(); toast('🎉 Tiffin Plan Book Ho Gaya!');
    location.href = upi(pr, 'Tiffin ' + F.name);
  },
  trial: () => {
    if (!need()) return;
    const id = uid('s');
    S.subs.push({ id, name: F.name.trim(), phone: ph(F.phone), addr: F.addr.trim(), type: F.type, days: 1, times: F.times, lunch: F.lunch, dinner: F.dinner, start: iso(D0()), price: 0, paid: 1, skip: [] });
    MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
    save(); toast('🎁 1 Din Free Trial Book Ho Gaya!');
  },
  order: () => {
    if (!need()) return;
    const items = []; let tot = 0;
    Object.entries(C).forEach(([k, q]) => {
      const p = S.prod.find(x => x.id === parseInt(k)); if (!p || q < 1 || !p.s) return;
      const isH = k.endsWith('h'), pr = isH ? Math.round(p.p * 0.6) : p.p;
      items.push({ n: p.n + (isH ? ' (½)' : ''), q, p: pr }); tot += pr * q;
    });
    if (tot < S.cfg.min) { toast('Minimum order ' + inr(S.cfg.min)); return; }
    const id = uid('o');
    S.orders.push({ id, ts: Date.now(), date: iso(D0()), name: F.name.trim(), phone: ph(F.phone), addr: F.addr.trim(), items, total: tot, paid: 0, dlv: 0 });
    MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
    C = {}; localStorage.setItem('nu5c', '{}'); TRK = id; save(); toast('🎉 Order Place Ho Gaya!');
  },
  skip: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    s.skip = s.skip || []; s.skip.push(iso(D0())); save(); toast('⏭️ Aaj ka dabba skip kiya gaya');
  },
  sdone: (v, k, id) => { S.done[iso(D0()) + '_' + id] = 1; save(); toast('✅ Tiffin Delivered!'); },
  allsub: () => {
    const k = iso(D0());
    (S.subs || []).filter(s => act(s, D0())).forEach(s => S.done[k + '_' + s.id] = 1);
    save(); toast('🎉 Saare Tiffin Delivered!');
  },
  savem: () => {
    S.mset[iso(D0())] = { bf: $('#m_bf').value.trim(), veg: $('#m_veg').value.trim(), nv: $('#m_nv').value.trim() };
    save(); toast('✅ 3-Time Menu Update Ho Gaya!');
  },
  opaid: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.paid = 1; save(); toast('✅ Paid'); } },
  odlv: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.dlv = 1; save(); toast('🛵 Delivered'); } },
  spaid: (v, k, id) => { const s = S.subs.find(x => x.id === id); if (s) { s.paid = 1; save(); toast('✅ Plan Paid'); } },
  stk: (v, k, id) => { const p = S.prod.find(x => x.id === +id); if (p) { p.s = p.s ? 0 : 1; save(); } },
  voice: () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Chrome browser use karein'); return; }
    const r = new SR(); r.lang = 'hi-IN'; toast('🎤 Boliye kya chahiye...');
    r.onresult = e => { SQ = e.results[0][0].transcript; SCAT = 'all'; render(); };
    r.start();
  },
  prt: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    $('#printArea').innerHTML = `<h2>NAMASTE UDALA</h2><p>Bill #${String(o.id).slice(-5)} · ${o.date} ${tm(o.ts)}</p><p>${esc(o.name)} (${esc(o.phone)})<br>${esc(o.addr)}</p><hr>${o.items.map(i => `<div>${esc(i.n)} x ${i.q} = ${inr(i.p * i.q)}</div>`).join('')}<hr><h3>Total: ${inr(o.total)} (${o.paid ? 'PAID' : 'DUE'})</h3>`;
    window.print();
  },
  theme: () => {
    const d = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = d ? 'dark' : '';
    $('#thm').textContent = d ? '☀️' : '🌙';
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset.v, b.dataset.k, b.dataset.id, e); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.id === 'sq') { SQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#sq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

let taps = 0, tapT;
$('#mark').addEventListener('click', () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1800);
  if (taps >= 5) { taps = 0; A.tab('owner'); }
});

render();
</script>
</body>
</html>
