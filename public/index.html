
<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eeefeb">
<meta name="description" content="Namaste Udala — ghar jaisa khana, daily meal plans aur everyday essentials.">
<title>Namaste Udala — A little closer to home.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#eeefeb;--paper:#fafbf8;--card:#fff;--ink:#171a17;
  --muted:#737870;--line:rgba(23,26,23,.11);--orange:#ff6a32;
  --orange-soft:#fff0e8;--green:#28734e;--green-soft:#e9f4ec;
  --red:#b52d35;--red-soft:#fdebed;--glass:rgba(250,251,248,.84);
  --shadow:0 18px 65px rgba(25,35,20,.07);--radius:26px;
}
[data-theme=dark]{
  --bg:#131612;--paper:#191d18;--card:#20251f;--ink:#f0f2ea;
  --muted:#a2ac9d;--line:rgba(238,242,230,.12);
  --orange-soft:#36261e;--green:#91d7a6;--green-soft:#233729;
  --red:#ffb0b6;--red-soft:#3a2528;--glass:rgba(25,29,24,.88);
  --shadow:0 18px 65px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "DM Sans",sans-serif;overflow-x:hidden;
  transition:background .3s,color .3s;
}
body:has(dialog[open]){overflow:hidden}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:disabled{cursor:wait;opacity:.5}
button,a{touch-action:manipulation}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button:focus-visible,a:focus-visible,input:focus-visible,
select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--orange);outline-offset:4px;
}
::selection{background:#ffb393;color:#111}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:Manrope,sans-serif}
h1,h2{letter-spacing:-.065em;line-height:1.02}
h3{letter-spacing:-.035em;line-height:1.25}
button svg,a svg{pointer-events:none}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.skip-link{
  position:fixed;top:-80px;left:20px;z-index:1000;
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;
}
.skip-link:focus{top:10px}
.container{width:min(1320px,calc(100% - 72px));margin:auto}
.topbar{
  position:sticky;top:0;z-index:50;background:var(--glass);
  backdrop-filter:blur(22px);border-bottom:1px solid var(--line);
}
.nav-inner{min-height:86px;display:flex;align-items:center;gap:30px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{
  width:43px;height:43px;display:grid;place-items:center;
  background:var(--orange);color:#151515;border-radius:15px;
  font-size:25px;font-weight:800;transform:rotate(-9deg);
}
.brand-name{font:800 17px/1.12 Manrope,sans-serif;letter-spacing:-.6px}
.brand-name small{
  display:block;font:600 9px/1.5 "DM Sans",sans-serif;
  letter-spacing:3.4px;text-transform:uppercase;margin-top:3px;
}
.desktop-nav{display:flex;gap:6px;margin:auto}
.nav-link{
  border:0;background:transparent;color:var(--muted);
  border-radius:99px;padding:11px 17px;font-size:13px;font-weight:700;
}
.nav-link.active{background:var(--ink);color:var(--bg)}
.nav-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:44px;height:44px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:50%;
  background:transparent;color:var(--ink);flex-shrink:0;
}
.icon-btn:hover{background:var(--card)}
.cart-btn{
  border:0;background:var(--orange);color:#161916;
  padding:11px 19px;border-radius:99px;display:flex;align-items:center;
  gap:9px;font-size:13px;font-weight:800;min-height:44px;
}
.cart-count{
  background:#171a17;color:#fff;width:22px;height:22px;
  display:grid;place-items:center;border-radius:50%;font-size:10px;
}
.connection{
  padding:7px 18px;text-align:center;font-size:11px;
  border-bottom:1px solid var(--line);background:var(--paper);
  color:var(--muted);letter-spacing:.2px;
}
.connection strong{color:var(--ink)}
.hero{
  position:relative;min-height:690px;display:grid;
  grid-template-columns:1fr 1fr;align-items:center;padding:70px 0 85px;
}
.hero-copy{position:relative;z-index:2;pointer-events:none}
.hero-copy button,.hero-copy a{pointer-events:auto}
.eyebrow{
  display:flex;align-items:center;gap:9px;
  font-size:10px;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:25px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:var(--orange);
  box-shadow:0 0 0 5px rgba(255,106,50,.1);display:inline-block;
}
.hero h1{font-size:clamp(66px,7.7vw,112px);font-weight:800}
.hero h1 .soft{color:var(--muted)}
.hero h1 .serif{font-family:Georgia,serif;font-style:italic;font-weight:400}
.hero-description{max-width:365px;color:var(--muted);margin:26px 0;font-size:15px}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:48px;padding:13px 23px;border:1px solid transparent;
  border-radius:99px;font-size:13px;font-weight:800;
  background:var(--ink);color:var(--bg);
  transition:transform .2s,background .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.orange{background:var(--orange);color:#171a17}
.btn.outline{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.green{background:var(--green-soft);color:var(--green)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.small{padding:9px 15px;min-height:38px;font-size:11px}
.btn.full{width:100%}
.hero-facts{display:flex;gap:22px;margin-top:44px}
.hero-facts>div{padding-right:22px;border-right:1px solid var(--line)}
.hero-facts>div:last-child{border:0}
.hero-facts b{display:block;font-size:13px}
.hero-facts span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.hero-art{
  position:relative;min-height:520px;align-self:stretch;
  display:grid;place-items:center;isolation:isolate;
}
.hero-art::before{
  content:"";position:absolute;width:85%;aspect-ratio:1;
  background:radial-gradient(circle,#ffbc8e44 0%,transparent 68%);
  z-index:-1;
}
.hero-art canvas{position:absolute;inset:0;width:100%;height:100%}
.orbit{
  position:absolute;width:85%;aspect-ratio:1;border:1px solid var(--line);
  border-radius:50%;transform:rotateX(65deg) rotateZ(-25deg);pointer-events:none;
}
.orbit.two{transform:rotateX(55deg) rotateZ(50deg);width:100%}
.art-fallback{
  position:relative;width:72%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 25%,#ffcba3,#ff7837 40%,#873b14 76%,#ffe5ba);
  box-shadow:inset -25px -25px 45px #0003,25px 50px 70px #0002;
  transform:rotate(-15deg);display:grid;place-items:center;
  font-size:130px;animation:bob 6s ease-in-out infinite;
}
.hero-art.ready .art-fallback{display:none}
.float-label{
  position:absolute;z-index:3;background:var(--glass);
  backdrop-filter:blur(14px);border:1px solid var(--line);
  box-shadow:var(--shadow);padding:13px 18px;border-radius:17px;
  display:flex;gap:11px;align-items:center;font-size:12px;
}
.float-label span:first-child{font-size:25px}
.float-label b{display:block;font-size:11px}
.float-label small{display:block;color:var(--muted);font-size:10px}
.label-a{top:15%;right:1%;transform:rotate(7deg)}
.label-b{bottom:13%;left:2%;transform:rotate(-7deg)}
.art-caption{
  position:absolute;bottom:0;right:0;font-size:9px;
  color:var(--muted);letter-spacing:2px;text-transform:uppercase;
}
.scroll-hint{
  position:absolute;bottom:28px;left:0;display:flex;align-items:center;
  gap:14px;font-size:10px;letter-spacing:1px;color:var(--muted);
}
.scroll-hint span{width:35px;height:35px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:18px 0}
.ticker-track{
  display:flex;gap:45px;width:max-content;animation:marquee 35s linear infinite;
  font:800 13px Manrope,sans-serif;letter-spacing:1px;text-transform:uppercase;
}
.ticker-track span::before{content:"✳";color:var(--orange);margin-right:45px}
.section{padding:78px 0}
.section-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px}
.section-top h2{font-size:clamp(36px,4.4vw,64px)}
.section-top p{color:var(--muted);font-size:13px;max-width:290px}
.kicker{font-size:10px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:15px}
.category-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
.editorial{
  position:relative;min-height:350px;border-radius:var(--radius);
  overflow:hidden;background:#253c28;color:#fff;isolation:isolate;
}
.editorial img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:-2;transition:transform 1s;
}
.editorial:hover img{transform:scale(1.055)}
.editorial::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000b,transparent 95%);z-index:-1}
.editorial-copy{padding:30px;height:100%;min-height:350px;display:flex;flex-direction:column;align-items:start;justify-content:end}
.editorial h3{font-size:36px;max-width:300px;margin:10px 0}
.editorial p{font-size:12px;opacity:.8}
.round-arrow{
  position:absolute;right:25px;bottom:28px;background:#fff;
  color:#111;width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:50%;font-size:22px;
}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
  border-radius:99px;font-size:10px;font-weight:800;
  background:var(--green-soft);color:var(--green);white-space:nowrap;
}
.pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.gray{background:var(--bg);color:var(--muted)}
.pill.red{background:var(--red-soft);color:var(--red)}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.product{
  background:var(--paper);border:1px solid var(--line);border-radius:23px;
  overflow:hidden;transition:transform .25s,box-shadow .25s;
}
.product:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.product-image{height:220px;position:relative;overflow:hidden;background:var(--card)}
.product-image img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.product:hover img{transform:scale(1.06)}
.product-image .pill{position:absolute;bottom:12px;left:12px;background:#fff;color:#252a22}
.favourite{
  position:absolute;right:12px;top:12px;border:0;width:34px;height:34px;
  border-radius:50%;background:#fffc;color:#222;font-size:20px;
}
.favourite.selected{color:#d84a36}
.product-body{padding:18px}
.product-body h3{font-size:15px;min-height:38px}
.product-meta{font-size:10px;color:var(--muted);margin:8px 0 16px}
.product-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.product-price{font-size:17px;font-weight:800}
.add-button{
  background:transparent;border:1px solid var(--line);border-radius:99px;
  color:var(--ink);font-size:11px;font-weight:800;padding:8px 14px;min-height:36px;
}
.add-button:hover{background:var(--orange);border-color:var(--orange);color:#111}
.stepper{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:99px;padding:3px}
.stepper button{
  border:0;border-radius:50%;width:29px;height:29px;
  background:var(--ink);color:var(--bg);font-size:17px;
}
.stepper b{font-size:12px;min-width:12px;text-align:center}
.story-band{
  border-radius:32px;background:#263e2e;color:#eef4e9;
  padding:55px;display:grid;grid-template-columns:1.3fr 1fr;gap:55px;
}
.story-band h2{font-size:clamp(38px,4.2vw,65px)}
.story-band h2 em{font-family:Georgia,serif;font-weight:400;color:#c0d6ae}
.story-list{display:grid;gap:24px}
.story-item{display:flex;align-items:start;gap:20px}
.story-item .number{font-size:11px;color:#9eaf98;border:1px solid #ffffff30;border-radius:50%;width:35px;height:35px;display:grid;place-items:center;flex-shrink:0}
.story-item h4{font-size:15px;margin-bottom:5px}
.story-item p{font-size:12px;color:#b5c2af}
.page-intro{padding:50px 0 30px}
.page-intro h1{font-size:clamp(42px,6vw,78px);margin-bottom:18px}
.page-intro p{color:var(--muted);max-width:600px}
.toolbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin:15px 0 25px;position:relative;
}
.search-wrap{position:relative;flex:1;min-width:190px}
.search-wrap input{padding-left:43px;margin:0}
.search-wrap svg{position:absolute;left:15px;top:15px;color:var(--muted)}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;background:var(--paper);color:var(--ink);
  min-height:46px;outline:none;font-size:14px;
}
input:focus,select:focus,textarea:focus{border-color:var(--orange)}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:15px 0 7px}
select option{background:var(--paper);color:var(--ink)}
.toolbar select{width:170px}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 18px;scrollbar-width:none}
.chip{
  flex-shrink:0;border:1px solid var(--line);border-radius:99px;
  padding:9px 17px;background:transparent;color:var(--muted);
  font-size:11px;font-weight:700;min-height:40px;
}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:23px;padding:25px;margin-bottom:20px}
.panel h3{font-size:20px;margin-bottom:14px}
.muted{color:var(--muted)}
.small-text{font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.stack{display:grid;gap:12px}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.empty{padding:65px 25px;text-align:center;border:1px dashed var(--line);border-radius:24px}
.empty .empty-icon{font-size:42px;margin-bottom:13px}
.empty h3{font-size:23px;margin-bottom:10px}
.empty p{color:var(--muted);font-size:13px;margin-bottom:20px}
.notice{padding:14px 17px;border-radius:15px;background:var(--orange-soft);font-size:12px;margin:14px 0;color:var(--ink)}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}
.plan-card{padding:32px;border-radius:25px;border:1px solid var(--line);background:var(--paper);position:relative}
.plan-card.featured{background:#263e2e;color:#fff}
.plan-card .price{font:800 42px Manrope,sans-serif;letter-spacing:-2px;margin:20px 0 4px}
.plan-card .price small{font:400 12px "DM Sans";letter-spacing:0}
.plan-card ul{padding:15px 0;list-style:none;font-size:12px;line-height:2.5}
.plan-card li::before{content:"✓";margin-right:9px;color:var(--orange)}
.plan-card.featured .muted{color:#bfceba}
.plan-card.featured .btn{background:#e0eccf;color:#203021}
.order-card{padding:22px;border:1px solid var(--line);background:var(--paper);border-radius:22px;margin-bottom:16px}
.order-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.order-top h3{font-size:16px}
.progress-track{display:flex;margin:22px 0 12px;gap:6px}
.progress-track span{flex:1;height:4px;border-radius:99px;background:var(--line)}
.progress-track span.on{background:var(--orange)}
.order-items{font-size:12px;color:var(--muted);line-height:1.9}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
.stat{padding:25px;background:var(--paper);border:1px solid var(--line);border-radius:20px}
.stat strong{display:block;font:800 30px Manrope;letter-spacing:-1px}
.stat span{font-size:11px;color:var(--muted)}
.account-badge{width:52px;height:52px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font:800 19px Manrope}
.footer{padding:60px 0 110px;border-top:1px solid var(--line);margin-top:35px}
.footer-top{display:flex;justify-content:space-between;align-items:center;gap:25px}
.footer h2{font-size:clamp(32px,4vw,56px)}
.footer-bottom{display:flex;justify-content:space-between;gap:15px;font-size:10px;color:var(--muted);border-top:1px solid var(--line);margin-top:35px;padding-top:22px;flex-wrap:wrap}
.mobile-nav{display:none}
.mobile-cart{
  position:fixed;bottom:88px;left:16px;right:16px;z-index:40;
  padding:13px 19px;border-radius:18px;background:#253e2e;color:#fff;
  box-shadow:0 10px 35px #0003;border:0;text-align:left;
  justify-content:space-between;align-items:center;
}
.mobile-cart[hidden]{display:none}
dialog{
  padding:0;border:1px solid var(--line);border-radius:27px;
  background:var(--paper);color:var(--ink);max-height:90dvh;
  width:min(580px,calc(100% - 24px));box-shadow:0 30px 100px #0003;
}
dialog::backdrop{background:#10181066;backdrop-filter:blur(9px)}
dialog[open]{animation:dialogIn .25s ease}
dialog.drawer{
  margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(510px,100%);
  border-radius:25px 0 0 25px;border-right:0;
}
.dialog-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:23px 25px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--paper);z-index:3;
}
.dialog-head h2{font-size:25px;letter-spacing:-1px}
.dialog-body{padding:25px}
.dialog-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}
.cart-line{display:flex;align-items:center;gap:13px;padding:16px 0;border-bottom:1px solid var(--line)}
.cart-line img{width:63px;height:63px;border-radius:14px;object-fit:cover}
.cart-line .info{flex:1;min-width:0}
.cart-line h4{font-size:12px}
.cart-line small{font-size:11px;color:var(--muted)}
.cart-line .stepper{gap:5px}
.cart-line .stepper button{width:25px;height:25px}
.bill{background:var(--bg);padding:15px 18px;border-radius:17px;margin:20px 0;font-size:12px}
.bill .total{font-size:17px;font-weight:800}
.payment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.payment-option{
  border:1px solid var(--line);padding:12px 6px;border-radius:13px;
  text-align:center;background:var(--paper);color:var(--muted);
  font-size:11px;min-height:65px;
}
.payment-option strong{display:block;font-size:17px;margin-bottom:4px}
.payment-option.active{border-color:var(--orange);background:var(--orange-soft);color:var(--ink)}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 22px;
  z-index:200;box-shadow:var(--shadow);font-size:12px;opacity:0;pointer-events:none;
  max-width:min(520px,90%);transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:#9c2831;color:#fff}
.reveal{animation:reveal .5s ease both}
.loading-dot{animation:blink 1.2s infinite}
@keyframes reveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes dialogIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-20px) rotate(-8deg)}}
@keyframes blink{50%{opacity:.35}}
@keyframes marquee{to{transform:translateX(-50%)}}
@media(min-width:801px){.mobile-cart{display:none!important}}
@media(max-width:1100px){
  .container{width:calc(100% - 44px)}
  .nav-inner{gap:16px}
  .nav-link{padding:10px 12px}
  .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero h1{font-size:78px}
  .hero-art{min-height:440px}
}
@media(max-width:800px){
  .container{width:calc(100% - 32px)}

const record = v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};
const read = (key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};

function normalise(raw){
  const d=record(raw);
  return {
    ...d,v:7,
    prod:d.prod===undefined?clone(SEED):list(d.prod).map(p=>({
      ...p,id:String(p.id),n:String(p.n||"Item"),p:Math.max(0,Number(p.p)||0),
      c:String(p.c||"General"),kind:p.kind==="food"?"food":"grocery",
      nv:p.nv?1:0,s:p.s===0?0:1,img:safeURL(p.img)
    })),
    subs:list(d.subs).map(s=>({
      ...s,id:String(s.id),name:String(s.name||"Customer"),
      phone:String(s.phone||""),days:Math.min(365,Math.max(1,Number(s.days)||30)),
      start:validDay(s.start)?s.start:day(),skip:list(s.skip),pause:list(s.pause),
      type:s.type==="nv"?"nv":"veg",lunch:s.lunch||"chawal",
      dinner:s.dinner||"roti",extraRoti:Number(s.extraRoti)||0,
      status:s.status||(s.trial?"trial":s.paid?"active":"pending")
    })),
    orders:list(d.orders).map(o=>({...o,id:String(o.id),items:list(o.items)})),
    pays:list(d.pays),walletLedger:list(d.walletLedger),
    wallet:record(d.wallet),meals:record(d.meals),done:record(d.done),
    mset:record(d.mset),waste:list(d.waste),notifications:list(d.notifications),
    coupons:d.coupons===undefined?{
      UDALA50:{type:"flat",value:50,min:299,expiry:"2026-12-31",maxUses:100,usedCount:0}
    }:record(d.coupons)
  };
}

let S=normalise(CONFIG.cloudEnabled?{}:read(CONFIG.localKey,{}));

let view="home", category="All", search="", sort="default", vegOnly=false;

async function transaction(mutator){
  assert(!busy,"Ek request already process ho rahi hai.");
  busy=true;
  $$("dialog button[type=submit]").forEach(b=>b.disabled=true);
  try{
    let next;
    if(CONFIG.cloudEnabled){
      assert(loaded&&online&&cloud,"Connection unavailable. Please reconnect.");
      let validationError="";
      const result=await cloud.api.runTransaction(cloud.root,current=>{
        validationError="";
        try{
          const draft=normalise(current);
          mutator(draft);
          return draft;
        }catch(error){validationError=error.message;return}
      },{applyLocally:false});
      assert(result.committed,validationError||"Change could not be saved.");
      next=normalise(result.snapshot.val());
    }else{
      const commit=()=>{
        const draft=normalise(read(CONFIG.localKey,S));
        mutator(draft);
        write(CONFIG.localKey,draft);
        return draft;
      };
      next=navigator.locks
        ?await navigator.locks.request(CONFIG.localKey,commit)
        :commit();
    }
    S=next;
    return next;
  }finally{
    busy=false;
    $$("dialog button[type=submit]").forEach(b=>b.disabled=false);
    renderPreservingFocus();
  }
}

async function connectCloud(){
  if(!CONFIG.cloudEnabled){setConnection();return}
  setConnection();
  const timeout=setTimeout(()=>{
    if(!loaded){
      $("#connection").textContent="Cloud connection is taking longer. Checkout stays unavailable until connected.";
    }
  },8000);
  try{
    const [appApi,api]=await Promise.all([
      import("https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js")
    ]);
    const app=appApi.initializeApp({databaseURL:CONFIG.databaseURL});
    const db=api.getDatabase(app);
    const root=api.ref(db,CONFIG.databasePath);
    cloud={api,root};
    api.onValue(api.ref(db,".info/connected"),snap=>{
      online=snap.val()===true;setConnection();
    });
    api.onValue(root,snap=>{
      S=normalise(snap.val());loaded=true;clearTimeout(timeout);
      setConnection();renderPreservingFocus();
    },error=>{
      loaded=false;online=false;clearTimeout(timeout);
      $("#connection").textContent="Cloud access unavailable. Check authentication and database rules.";
      console.error(error);
    });
  }catch(error){
    clearTimeout(timeout);online=false;
    $("#connection").textContent="Cloud could not load. Checkout unavailable.";
    console.error(error);
  }
}

function planEnd(s){
  const pauses=new Set(s.pause||[]);
  let date=s.start,remaining=Math.max(1,Number(s.days)||1),guard=0;
  while(remaining>0 && guard++<1100){
    if(!pauses.has(date))remaining--;
    date=dayAdd(date,1);
  }
  return date;
}
function subStatus(s){
  if(["pending","rejected"].includes(s.status))return s.status;
  if(day()<s.start)return "scheduled";
  if(day()>=planEnd(s))return "expired";
  if((s.pause||[]).includes(day()))return "paused";
  return s.trial?"trial":"active";
}
function subDaysLeft(s){
  const pauses=new Set(s.pause||[]);
  let used=0,date=s.start;
  while(date<day()&&date<planEnd(s)){
    if(!pauses.has(date))used++;
    date=dayAdd(date,1);
  }
  return Math.max(0,s.days-used);
}
function badge(status){
  const colours={active:"",trial:"",delivered:"",verified:"",paid:"",pending:"orange",preparing:"orange",out:"orange",scheduled:"orange",paused:"gray",expired:"gray",cancelled:"red",rejected:"red"};
  const names={out:"Out for delivery",pending:"Pending",active:"Active",trial:"Trial",delivered:"Delivered",verified:"Verified",paid:"Paid",preparing:"Preparing",scheduled:"Scheduled",paused:"Paused",expired:"Expired",cancelled:"Cancelled",rejected:"Rejected"};
  return `<span class="pill ${colours[status]??"gray"}">${esc(names[status]||status)}</span>`;
}
function quote(data=S,bag=cart,code=coupon,tip=checkoutDraft.tip,strict=false){
  let subtotal=0,count=0;
  const items=[],invalid=[];
  for(const [id,quantity] of Object.entries(bag)){
    const p=data.prod.find(x=>x.id===id);
    const q=Number(quantity);
    if(!p||p.s===0||!Number.isInteger(q)||q<1||q>99){
      invalid.push(p?.n||"Unavailable item");continue;
    }
    const price=Number(p.p);
    if(!Number.isFinite(price)||price<=0){invalid.push(p.n);continue}
    subtotal+=price*q;count+=q;items.push({id:p.id,n:p.n,q,p:price,img:p.img,kind:p.kind});
  }
  if(strict)assert(!invalid.length,"Unavailable item in bag. Remove it before checkout.");
  let discount=0,applied="",reason="";
  if(code){
    const cp=data.coupons[code];
    if(!cp)reason="Coupon not found.";
    else if(cp.expiry&&day()>cp.expiry)reason="Coupon expired.";
    else if(Number(cp.usedCount||0)>=Number(cp.maxUses??Infinity))reason="Coupon usage limit reached.";
    else if(subtotal<Number(cp.min||0))reason="Minimum order "+money(cp.min)+" required.";
    else{
      discount=cp.type==="percent"
        ?Math.round(subtotal*Math.max(0,Number(cp.value)||0)/100)
        :Math.max(0,Number(cp.value)||0);
      discount=Math.min(subtotal,discount);applied=code;
    }
  }
  const safeTip=Math.min(500,Math.max(0,Number(tip)||0));
  return {items,subtotal,discount,code:applied,reason,count,tip:safeTip,
    total:Math.round((subtotal-discount+safeTip)*100)/100,invalid};
}
function updateCounters(){
  const q=quote();

function renderPreservingFocus(){
  const active=document.activeElement;
  const id=active?.id;
  const selection=typeof active?.selectionStart==="number"?active.selectionStart:null;
  const insideDialog=$("#dialog").contains(active);
  render();
  if(!insideDialog&&id){
    const next=document.getElementById(id);
    next?.focus({preventScroll:true});
    if(selection!==null)try{next?.setSelectionRange(selection,selection)}catch{}
  }
}

function formData(form){return Object.fromEntries(new FormData(form).entries())}
async function submitOrder(form){
  const fields=formData(form);
  Object.assign(checkoutDraft,fields);
  const name=String(fields.name||"").trim(),phone=String(fields.phone||"").trim();
  assert(name.length>=2&&validPhone(phone),"Valid name aur 10-digit mobile daalein.");
  assert(String(fields.addr||"").trim().length>=8,"Complete delivery address required.");
  let scheduledAt=0;
  if(fields.timing==="scheduled"){
    scheduledAt=new Date(fields.when+":00+05:30").getTime();
    assert(Number.isFinite(scheduledAt)&&scheduledAt>Date.now(),"Choose a future requested delivery time.");
  }
  if(payMode==="UPI")assert(/^[A-Za-z0-9 -]{8,40}$/.test(String(fields.utr||"").trim()),"Valid transaction reference daalein.");
  if(payMode==="WALLET"){
    profileRequired();assert(me.phone===phone,"Wallet payment ke liye profile phone use karein.");
  }
  const bag=clone(cart),code=coupon,tip=Number(fields.tip)||0;
  const expected=quote(S,bag,code,tip,true);
  assert(expected.count>0,"Bag is empty.");
  const id=operationId,ts=Date.now();
  await transaction(d=>{
    if(d.orders.some(o=>o.id===id))return;
    const q=quote(d,bag,code,tip,true);
    assert(q.count>0,"Bag is empty.");
    assert(q.total===expected.total,"Prices or coupon changed. Review your bag and try again.");
    if(payMode==="WALLET"){
      const balance=Number(d.wallet[phone])||0;
      assert(balance>=q.total,"Wallet balance insufficient. Recharge or choose another payment method.");
      d.wallet[phone]=balance-q.total;
      d.walletLedger.push({id:"debit_"+id,type:"debit",phone,name,amt:q.total,status:"verified",date:day(),ts,orderId:id});
    }
    const order={
      id,ts,name,phone,addr:String(fields.addr).trim(),area:String(fields.area).trim(),
      map:safeURL(checkoutDraft.map),notes:String(fields.notes||"").trim(),
      items:q.items.map(({img,...item})=>item),total:q.total,sub:q.subtotal,
      discount:q.discount,coupon:q.code,tip:q.tip,deliveryFee:0,
      status:"pending",paid:payMode==="WALLET"?1:0,paymentMode:payMode,
      utr:payMode==="UPI"?String(fields.utr).trim():payMode,
      date:day(),scheduledAt,slot:"anytime",kind:q.items.every(i=>i.kind==="grocery")?"kirana":"shop"
    };
    d.orders.push(order);
    if(q.code)d.coupons[q.code].usedCount=Number(d.coupons[q.code].usedCount||0)+1;
    if(payMode==="WALLET")d.pays.push({id:"pay_"+id,d:day(),name,phone,amt:q.total,mode:"wallet",kind:"Order",orderId:id});
    notify(d,`${name} placed an order for ${money(q.total)}.`);
  });
  me={name,phone,addr:fields.addr,area:fields.area,map:checkoutDraft.map};
  saveProfile();
  cart={};coupon="";checkoutDraft.tip=0;checkoutDraft.utr="";
  saveCart();operationId=uid();
  render();orderDetail(id,true);
  toast(CONFIG.cloudEnabled?"Order saved. Team will confirm delivery.":"Demo order saved on this browser.");
}

async function verify(kind,id,reject=false){
  ownerOnly();
  assert(confirm(reject?"Reject this request?":"Payment received and reference checked?"),"Action cancelled.");
  await transaction(d=>{
    if(kind==="wallet"){
      const w=d.walletLedger.find(x=>x.id===id);
      assert(w?.status==="pending","This request has already been processed.");
      if(reject){w.status="rejected";return}
      const amount=Number(w.amt);
      assert(Number.isFinite(amount)&&amount>0,"Invalid recharge amount.");
      assert(!d.walletLedger.some(x=>x.id!==id&&x.utr===w.utr&&x.status==="verified"&&x.type!=="debit"),"This UTR was already credited.");
      w.status="verified";w.verifiedAt=Date.now();
      d.wallet[w.phone]=(Number(d.wallet[w.phone])||0)+amount;
      notify(d,`${w.name}'s wallet credited ${money(amount)}.`);
    }else if(kind==="plan"){
      const s=d.subs.find(x=>x.id===id);
      assert(s?.status==="pending","This plan has already been processed.");
      if(reject){s.status="rejected";return}
      assert(!d.pays.some(p=>p.utr===s.utr&&p.mode==="upi"),"This UTR is already recorded.");
      s.status="active";s.paid=1;s.start=s.start<day()?day():s.start;
      d.pays.push({id:"plan_"+id,d:day(),phone:s.phone,name:s.name,amt:s.price,mode:"upi",utr:s.utr,kind:"Plan"});
      notify(d,`${s.name}'s plan is active.`);
    }else{
      const o=d.orders.find(x=>x.id===id);
      assert(o&&!o.paid&&o.status!=="cancelled","Order payment already processed or order cancelled.");
      if(o.paymentMode==="UPI")assert(!d.pays.some(p=>p.utr===o.utr&&p.mode==="upi"),"This UTR is already recorded.");
      o.paid=1;
      d.pays.push({id:"pay_"+id,d:day(),name:o.name,phone:o.phone,amt:o.total,
        mode:o.paymentMode==="COD"?"cash":"upi",utr:o.utr||"",kind:"Order",orderId:id});
    }
  });
  toast(reject?"Request rejected.":"Payment recorded.");
}

function download(name,body,type){
  const url=URL.createObjectURL(new Blob([body],{type}));
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(value){
  let s=String(value??"");
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}

  navigate:({value})=>navigate(value),
  close:()=>closeModal(),
  theme:()=>{

      if(p){cart[p.id]=Math.min(99,(Number(cart[p.id])||0)+(Number(i.q)||1));added++}

    saveCart();render();cartModal();toast("Available items added at current prices.");

  orderDetail:({id})=>orderDetail(id),
  copyOrder:async({id})=>{
    const o=S.orders.find(x=>x.id===id);
    assert(o&&(role!=="customer"||o.phone===me?.phone),"Order not accessible.");
    await navigator.clipboard.writeText(`Namaste Udala #${o.id}\n${o.name}\n${list(o.items).map(i=>`${i.n} x${i.q}`).join("\n")}\nTotal ${money(o.total)}\n${o.addr}`);

    showModal("Staff access.",`<form id="staffForm"><p class="muted small-text">Enter your operations access code.</p><label>Access code</label><input name="pin" type="password" inputmode="numeric" required autocomplete="off"><button class="btn orange full" style="margin-top:22px">Continue ↗</button></form>`);

  rejectWallet:({id})=>verify("wallet",id,true),
  verifyPlan:({id})=>verify("plan",id),
  rejectPlan:({id})=>verify("plan",id,true),
  verifyOrder:({id})=>verify("order",id),
  advanceOrder:async({id,value})=>{
    staffOnly();
    await transaction(d=>{
      const o=d.orders.find(x=>x.id===id);assert(o,"Order not found.");
      const next={pending:"preparing",preparing:"out",out:"delivered"}[o.status];
      assert(next===value,"Order status changed. Reopen the order.");

  },
  cancelOrder:async({id})=>{
    ownerOnly();if(!confirm("Cancel this order? Wallet payments will be refunded automatically. Recorded cash/UPI payments need a separate refund."))return;
    await transaction(d=>{
      const o=d.orders.find(x=>x.id===id);
      assert(o&&!["delivered","cancelled"].includes(o.status),"Order cannot be cancelled.");
      o.status="cancelled";o.cancelledAt=Date.now();
      if(o.paymentMode==="WALLET"&&o.paid){
        d.wallet[o.phone]=(Number(d.wallet[o.phone])||0)+Number(o.total);
        d.walletLedger.push({id:"refund_"+id,type:"refund",phone:o.phone,name:o.name,amt:o.total,status:"verified",date:day(),orderId:id});
        d.pays.push({id:"refund_"+id,d:day(),name:o.name,phone:o.phone,amt:-Number(o.total),mode:"wallet",kind:"Refund",orderId:id});
        o.refunded=1;
      }else if(o.paid){o.refundStatus="manual_refund_required"}
      notify(d,`Order ${id.slice(-6)} cancelled${o.refundStatus?" — manual refund required":""}.`);
    });
    orderDetail(id);toast("Order cancelled.");
  },
  stock:async({id})=>{
    ownerOnly();
    await transaction(d=>{const p=d.prod.find(x=>x.id===id);assert(p,"Product not found.");p.s=p.s===0?1:0});
  },
  productEditor:({id})=>productEditor(id),
  skip:async({id})=>{
    staffOnly();
    await transaction(d=>{
      const s=d.subs.find(x=>x.id===id);assert(s,"Plan not found.");
      s.skip=s.skip.includes(day())?s.skip.filter(x=>x!==day()):[...s.skip,day()];
    });

  mealDelivered:async({id})=>{
    staffOnly();

    toast("Subscription delivery recorded.");
  },
  copyKitchen:async()=>{
    staffOnly();
    await navigator.clipboard.writeText(`NAMASTE UDALA · ${day()}\n`+eligibleSubs().filter(s=>!s.skip.includes(day())).map(s=>`${s.name} · ${s.type} · Lunch ${s.lunch} · Dinner ${s.dinner}`).join("\n"));
    toast("Kitchen summary copied.");
  },
  backup:()=>{
    ownerOnly();download("udala-backup-"+day()+".json",JSON.stringify(S,null,2),"application/json");
  },
  export:()=>{
    ownerOnly();
    const rows=[["ID","Date","Name","Phone","Address","Total","Payment","Paid","Status"],...S.orders.map(o=>[o.id,o.date,o.name,o.phone,o.addr,o.total,o.paymentMode,o.paid?"Yes":"No",o.status])];
    download("udala-orders-"+day()+".csv","\uFEFF"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"),"text/csv;charset=utf-8");

  import:()=>{ownerOnly();$("#importFile").click()},

  }
};

document.addEventListener("submit",async event=>{
  const form=event.target;
  event.preventDefault();
  if(busy)return;
  try{
    if(form.id==="profileForm"){
      const f=formData(form);assert(validPhone(f.phone),"Valid mobile number required.");
      me={name:f.name.trim(),phone:f.phone};saveProfile();
      Object.assign(checkoutDraft,{name:me.name,phone:me.phone});
      render();toast("Profile saved.");
    }
    if(form.id==="checkoutForm")await submitOrder(form);
    if(form.id==="joinForm")await submitPlan(form);
    if(form.id==="staffForm"){
      const pin=formData(form).pin;
      role=pin===CONFIG.ownerPin?"owner":pin===CONFIG.deliveryPin?"delivery":"customer";
      assert(role!=="customer","Incorrect access code.");
      sessionStorage.setItem("udala_role_v2",JSON.stringify({role,until:Date.now()+4*60*60*1000}));
      closeModal();navigate(role==="owner"?"owner":"delivery");
    }
    if(form.id==="rechargeForm"){
      profileRequired();
      const f=formData(form),amt=Number(f.amt),utr=f.utr.trim(),id=uid();
      assert(Number.isFinite(amt)&&amt>=10&&amt<=50000,"Invalid recharge amount.");
      await transaction(d=>{
        assert(!d.walletLedger.some(w=>w.utr===utr&&w.type!=="debit"&&w.status!=="rejected"),"This recharge reference already exists.");
        d.walletLedger.push({id,type:"credit",name:me.name,phone:me.phone,amt,utr,status:"pending",date:day(),ts:Date.now()});
        notify(d,`${me.name} requested a ${money(amt)} wallet recharge.`);
      });
      closeModal();toast("Recharge submitted for verification.");
    }
    if(form.id==="pauseForm"){
      profileRequired();const f=formData(form),id=form.dataset.id;
      assert(validDay(f.start)&&validDay(f.end)&&f.start>day()&&f.end>=f.start,"Choose valid future dates.");
      const dates=[];
      for(let date=f.start;date<=f.end&&dates.length<=30;date=dayAdd(date,1))dates.push(date);
      assert(dates.length<=30,"Maximum 30 days per pause request.");
      await transaction(d=>{
        const s=d.subs.find(x=>x.id===id&&x.phone===me.phone);
        assert(s&&["active","trial","scheduled","paused"].includes(subStatus(s)),"Plan cannot be paused.");
        assert(f.start>=s.start&&f.start<planEnd(s),"Pause must start during the plan.");
        s.pause=[...new Set([...s.pause,...dates])].sort();
        assert(s.pause.length<=365,"Pause limit reached.");
      });
      closeModal();toast("Pause saved. Service period updated.");
    }
    if(form.id==="productForm"){
      ownerOnly();const f=formData(form),id=form.dataset.id||uid(),price=Number(f.p);
      assert(Number.isFinite(price)&&price>0,"Enter a valid price.");
      assert(!f.img||safeURL(f.img),"Image must use an HTTP or HTTPS URL.");
      await transaction(d=>{
        const existing=d.prod.find(x=>x.id===id);
        const p={...existing,id,n:f.n.trim(),p:price,c:f.c.trim(),kind:f.kind,nv:Number(f.nv)?1:0,img:safeURL(f.img),allergens:f.allergens||"",s:existing?.s??1};
        if(existing)Object.assign(existing,p);else d.prod.push(p);
      });
      closeModal();toast("Product saved.");
    }
    if(form.id==="menuForm"){
      ownerOnly();const f=formData(form);
      await transaction(d=>{d.mset[dayAdd(day(),1)]={veg:f.veg.trim(),nv:f.nv.trim()}});
      toast("Tomorrow’s menu saved.");
    }
    if(form.id==="wasteForm"){
      ownerOnly();const f=formData(form),qty=Number(f.qty);
      assert(qty>0,"Positive quantity required.");
      await transaction(d=>d.waste.push({id:uid(),date:day(),item:f.item.trim(),qty,reason:f.reason||""}));
      toast("Waste recorded.");
    }
  }catch(error){console.error(error);toast(error.message||"Could not save. Please try again.",true)}
});

/* REAL-TIME THREE.JS SCULPTURE
   A procedural scene: no 3D-model download required.
   Static fallback remains visible if WebGL/CDN is unavailable.
*/
async function initScene(){
  const host=$("#heroArt");if(!host)return;
  let disposed=false,renderer,scene,observer,frame=0;
  let pointerX=0,pointerY=0,visible=true,lastFrame=0;
  const reduced=matchMedia("(prefers-reduced-motion: reduce)");
  const pointer=event=>{
    const r=host.getBoundingClientRect();
    pointerX=(event.clientX-r.left)/r.width-.5;
    pointerY=(event.clientY-r.top)/r.height-.5;
    if(reduced.matches)draw(performance.now());
  };
  const leave=()=>{pointerX=0;pointerY=0};
  const resize=()=>{
    if(!renderer||disposed)return;
    const w=host.clientWidth,h=host.clientHeight;
    renderer.setSize(w,h,false);
    camera.aspect=w/h;camera.updateProjectionMatrix();
    if(reduced.matches)draw(performance.now());
  };
  let camera,sculpture,orangeGroup,satellites=[];
  stopScene=()=>{
    disposed=true;cancelAnimationFrame(frame);
    observer?.disconnect();
    window.removeEventListener("resize",resize);
    host.removeEventListener("pointermove",pointer);
    host.removeEventListener("pointerleave",leave);
    const geometries=new Set(),materials=new Set();
    scene?.traverse(o=>{
      if(o.geometry)geometries.add(o.geometry);
      if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));
    });
    geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());
    renderer?.dispose();renderer?.domElement.remove();
  };
  function draw(time){
    if(disposed||!renderer)return;
    const t=reduced.matches?0:time*.0004;
    sculpture.rotation.y+=(pointerX*.45-sculpture.rotation.y)*.06;
    sculpture.rotation.x+=(pointerY*.2-sculpture.rotation.x)*.06;
    orangeGroup.rotation.z=t*.4;
    orangeGroup.rotation.y=Math.sin(t*.5)*.25;
    sculpture.position.y=Math.sin(t*1.6)*.12;
    satellites.forEach((m,i)=>{
      const a=t*.5+i*2.1;
      m.position.set(Math.cos(a)*(2.1+i*.12),Math.sin(a*1.1)*1.35,Math.sin(a)*.8);
    });
    renderer.render(scene,camera);
  }
  function loop(time){
    if(disposed)return;
    frame=requestAnimationFrame(loop);
    if(document.hidden||!visible||time-lastFrame<32)return;
    lastFrame=time;draw(time);
  }
  try{
    const THREE=await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
    if(disposed||!host.isConnected)return;
    renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:"low-power"});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.25;
    renderer.domElement.setAttribute("aria-hidden","true");
    host.prepend(renderer.domElement);
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(35,1,.1,100);
    camera.position.set(0,.3,9);
    scene.add(new THREE.HemisphereLight(0xffffff,0x8f6946,2.3));
    const key=new THREE.DirectionalLight(0xfff3de,4);
    key.position.set(-4,6,5);scene.add(key);
    const rim=new THREE.DirectionalLight(0xffffff,3);
    rim.position.set(5,1,-2);scene.add(rim);
    const orangeLight=new THREE.PointLight(0xff7138,12,12);
    orangeLight.position.set(1,-3,3);scene.add(orangeLight);
    sculpture=new THREE.Group();scene.add(sculpture);
    orangeGroup=new THREE.Group();sculpture.add(orangeGroup);
    const orange=new THREE.MeshPhysicalMaterial({
      color:0xff6b30,roughness:.22,metalness:.12,clearcoat:1,clearcoatRoughness:.18
    });
    const silver=new THREE.MeshPhysicalMaterial({
      color:0xdde2d8,roughness:.2,metalness:.65,clearcoat:1
    });
    const green=new THREE.MeshPhysicalMaterial({
      color:0x4e7354,roughness:.38,metalness:.1
    });
    const knot=new THREE.Mesh(new THREE.TorusKnotGeometry(1.12,.43,140,24,2,3),orange);
    knot.rotation.set(.35,.2,-.4);orangeGroup.add(knot);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.95,.055,12,100),silver);
    ring.rotation.set(1.05,.25,-.4);sculpture.add(ring);
    const orbGeometry=new THREE.SphereGeometry(.24,24,20);
    [silver,green,orange].forEach(material=>{
      const m=new THREE.Mesh(orbGeometry,material);satellites.push(m);sculpture.add(m);
    });
    const inner=new THREE.Mesh(new THREE.SphereGeometry(.57,32,24),silver);
    inner.position.set(.1,.1,.15);sculpture.add(inner);
    const disc=new THREE.Mesh(
      new THREE.CircleGeometry(1.8,64),
      new THREE.MeshBasicMaterial({color:0x293122,transparent:true,opacity:.06,depthWrite:false})
    );
    disc.rotation.x=-Math.PI/2;disc.position.y=-2;scene.add(disc);
    host.classList.add("ready");
    host.addEventListener("pointermove",pointer,{passive:true});
    host.addEventListener("pointerleave",leave);
    window.addEventListener("resize",resize,{passive:true});
    observer=new IntersectionObserver(entries=>{
      visible=entries[0].isIntersecting;
      if(visible&&reduced.matches)draw(performance.now());
    });
    observer.observe(host);
    resize();draw(0);
    if(!reduced.matches)frame=requestAnimationFrame(loop);
  }catch(error){
    console.warn("3D fallback active:",error);
    host.classList.remove("ready");
    renderer?.dispose();renderer?.domElement.remove();
  }
}
