const normalizeOrder=o=>{if(!o||!o.id)return null;

function migrate(d){
  if(!d||typeof d!=='object')return {v:SCHEMA_V,prod:[],subs:[],orders:[],pays:[],meals:{},done:{},mset:{},coupons:COUPONS_DEFAULT,notifications:[],waste:[],lastOrderTime:0};
  const v=d.v||1;
  if(v<2)(d.orders||[]).forEach(o=>{o.slot=o.slot||'lunch';o.discount=o.discount||0;o.coupon=o.coupon||''});
  if(v<3){d.coupons=d.coupons||COUPONS_DEFAULT;d.walletLedger=d.walletLedger||[]}
  if(v<4)(d.subs||[]).forEach(s=>{if(!s.avatar)s.avatar=randAvatar(s.id)});
  if(v<5){
    (d.orders||[]).forEach(o=>{o.rating=o.rating||0;o.feedback=o.feedback||'';o.contactless=o.contactless?1:0;o.tip=+o.tip||0});
    (d.subs||[]).forEach(s=>{s.rating=s.rating||0;s.feedback=s.feedback||''});
  }
  
  d.prod=d.prod||[];
  d.subs=d.subs||[];
  d.orders=d.orders||[];
  d.pays=d.pays||[];
  d.expenses=d.expenses||[];
  d.meals=d.meals||{};
  d.done=d.done||{};
  d.mset=d.mset||{};
  d.cred=d.cred||{};
  d.refs=d.refs||{};
  d.wallet=d.wallet||{};
  d.walletLedger=d.walletLedger||[];
  d.feedback=d.feedback||{};
  d.coupons=d.coupons||COUPONS_DEFAULT;
  d.notifications=d.notifications||[];
  d.referrals=d.referrals||{};
  d.waste=d.waste||[];
  d.lastOrderTime=d.lastOrderTime||0;
  d.partners=d.partners||['Raju Bhaiya'];
  d.dailyVideo=d.dailyVideo||'';
  
  d.v=SCHEMA_V;
  return d;
}

function loadState(){
 const out={v:SCHEMA_V,prod:[],subs:[],orders:[],pays:[],expenses:[],meals:{},done:{},mset:{},cred:{},refs:{},wallet:{},walletLedger:[],feedback:{},dailyVideo:'',partners:['Raju Bhaiya'],coupons:COUPONS_DEFAULT,notifications:[],referrals:{},waste:[],lastOrderTime:0};
 let recovered=0;
 [STORAGE_KEY,'udala2','udala6','udala7','udala_logic'].forEach(k=>{
  try{const raw=localStorage.getItem(k);if(!raw)return;let d=migrate(JSON.parse(raw));if(!d||typeof d!=='object')return;
   (d.prod||[]).forEach(p=>{const n=normalizeProd(p);if(n&&!out.prod.find(x=>x.id===n.id))out.prod.push(n)});
   (d.subs||[]).forEach(s=>{const n=normalizeSub(s);if(n&&!out.subs.find(x=>x.id===n.id)){out.subs.push(n);if(k!==STORAGE_KEY)recovered++}});
   (d.orders||[]).forEach(o=>{const n=normalizeOrder(o);if(n&&!out.orders.find(x=>x.id===n.id)){out.orders.push(n);if(k!==STORAGE_KEY)recovered++}});
   (d.pays||[]).forEach(p=>{if(p&&p.id&&!out.pays.find(x=>x.id===p.id))out.pays.push(p)});
   (d.expenses||[]).forEach(p=>{if(p&&p.id&&!out.expenses.find(x=>x.id===p.id))out.expenses.push(p)});
   Object.assign(out.meals,d.meals||{});Object.assign(out.done,d.done||{});Object.assign(out.mset,d.mset||{});
   Object.assign(out.cred,d.cred||{});Object.assign(out.refs,d.refs||{});Object.assign(out.wallet,d.wallet||{});
   Object.assign(out.walletLedger,d.walletLedger||[]);Object.assign(out.feedback,d.feedback||{});
   Object.assign(out.coupons,d.coupons||COUPONS_DEFAULT);Object.assign(out.notifications,d.notifications||[]);
   Object.assign(out.referrals,d.referrals||{});Object.assign(out.waste,d.waste||[]);
   if(d.dailyVideo&&!out.dailyVideo)out.dailyVideo=d.dailyVideo;
   if(d.lastOrderTime)out.lastOrderTime=d.lastOrderTime;
  }catch(e){}
 });
 if(!out.prod.length)out.prod=SEED.slice();
 if(!out.prod.some(p=>p.kind==='food')){FOOD_SEED.forEach(f=>{out.prod.push({...f,id:generateId()})})}
 return {data:out,recovered};
}

const getMealHistory=(subId,days=7)=>{
 const history=[];
 for(let i=days-1;i>=0;i--){
   const d=iso(addDays(new Date(),-i));
   history.push({
     date:d,
     subah:(S.meals||{})[mealKey(subId,'subah',d)]||'pending',
     lunch:(S.meals||{})[mealKey(subId,'lunch',d)]||'pending',
     dinner:(S.meals||{})[mealKey(subId,'dinner',d)]||'pending',
     skipped:((S.subs||[]).find(s=>s.id===subId)?.skip||[]).includes(d)
   });
 }
 return history;
};

 el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateY(${x*5}deg) rotateX(${-y*5}deg) translateZ(4px)`});
 el.addEventListener('mouseleave',()=>{el.style.transform=''})})};

let S=null;
let isLoading=true;

async function initCloudState() {
  const safetyTimeout = setTimeout(() => {
    if (isLoading) {
      console.warn("Cloud timeout! Using local phone data.");
      S = loadState().data;
      isLoading = false;
      render();
    }
  }, 5000);

  try {
    const pathsToCheck = ['namaste_udala_data', 'udala_state', 'udala_final_v1', '/'];
    let dataFound = false;

    for (let path of pathsToCheck) {
      try {
        const testRef = ref(db, path);
        const snapshot = await get(testRef);
        
        if (snapshot.exists()) {
          console.log("✅ Purana data mil gaya path par:", path);
          S = migrate(snapshot.val());
          dataFound = true;
          
          onValue(testRef, (snap) => {
            if (snap.exists()) {
              S = migrate(snap.val());
              render();
            }
          });
          break;
        }
      } catch (err) {
        console.log("Path check failed:", path);
      }
    }

    if (!dataFound) {
      console.log("☁️ Cloud mein data nahi mila. Phone ka local backup use kar rahe hain.");
      S = loadState().data;
    }
  } catch (error) {
    console.error("Firebase connection error:", error);
    S = loadState().data;
  }

  clearTimeout(safetyTimeout);
  isLoading = false;
  render();
}

document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){
    if(e.key==='1'){e.preventDefault();tab='plan';render()}
    else if(e.key==='2'){e.preventDefault();tab='shop';render()}
    else if(e.key==='3'&&OK){e.preventDefault();tab='kitchen';render()}
    else if(e.key==='4'&&OK){e.preventDefault();tab='delivery';render()}
    else if(e.key==='5'&&OK){e.preventDefault();tab='owner';render()}
  }
  if(e.key==='Escape'){closeModal()}
});

initTheme();

initCloudState();
