<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste Udala</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e5c3f">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--o:#ff5a1f;--o2:#ff8a3d;--g:#0e5c3f;--g2:#127a52;--bg:#f6f3ec;--ink:#1c1917;--muted:#7d7468;--card:#fffdf9;--line:#ece2d0;--gold:#f5b301;--r:22px}
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:#ffd9c2}
html{scroll-behavior:smooth}
img{background:#f3ede3}
body{background:radial-gradient(1100px 480px at -8% -10%,#ffe9d2 0%,transparent 55%),radial-gradient(900px 520px at 108% 8%,#dff0e6 0%,transparent 50%),radial-gradient(760px 460px at 50% 112%,#fff3e0 0%,transparent 60%),var(--bg);color:var(--ink);padding-bottom:104px;font-weight:500;position:relative;-webkit-font-smoothing:antialiased}
body::before,body::after{content:'';position:fixed;width:380px;height:380px;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;pointer-events:none;animation:blob 14s ease-in-out infinite}
body::before{left:-120px;top:12%;background:#ffb37a}
body::after{right:-120px;top:52%;background:#9ed8b5;animation-delay:3s;animation-direction:reverse}
@keyframes blob{50%{transform:translateY(-46px) scale(1.12)}}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheen{0%{transform:translateX(-70%) rotate(12deg)}55%,100%{transform:translateX(170%) rotate(12deg)}}
@keyframes fog{50%{transform:translateX(7%) translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
header{background:linear-gradient(135deg,#0b3d2c,#0e5c3f 55%,#127a52),radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:auto,18px 18px;color:#fff;padding:18px 18px 26px;border-radius:0 0 28px 28px;box-shadow:0 14px 40px rgba(11,61,44,.35),inset 0 1px 0 rgba(255,255,255,.15);position:relative;overflow:hidden;z-index:5}
header::after{content:'';position:absolute;top:-60%;left:-20%;width:50%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);transform:rotate(12deg);animation:sheen 7s ease-in-out infinite}
.hwrap{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.logo{width:46px;height:46px;border-radius:16px;background:conic-gradient(from 210deg,#f5b301,#ff5a1f,#f5b301);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px;box-shadow:0 8px 18px rgba(255,90,31,.45),inset 0 2px 4px rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(0,0,0,.3);flex:none}
header b{display:block;color:#ffd77a;font-size:10px;letter-spacing:3.5px;font-weight:800}
header h1{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-.3px;text-shadow:0 3px 8px rgba(0,0,0,.35)}
header .s{color:rgba(255,255,255,.85)!important;font-size:11.5px;font-weight:600}
#v{padding:0 14px;margin-top:-18px;position:relative;z-index:1}
#v>.card:nth-child(2){animation-delay:.07s}#v>.card:nth-child(3){animation-delay:.14s}#v>.card:nth-child(4){animation-delay:.21s}
.card{background:linear-gradient(180deg,#fffdf9,#fff9f0);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;box-shadow:0 1px 2px rgba(28,25,23,.04),0 8px 20px rgba(28,25,23,.06),0 24px 48px rgba(14,92,63,.06);animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
.card h3{color:var(--g);font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3::before{content:'';width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--o),var(--gold));box-shadow:0 2px 6px rgba(255,90,31,.4);flex:none}
.s{font-size:12px;color:var(--muted);line-height:1.5}
.seg{display:flex;gap:6px;margin:6px 0;background:#f3ede2;padding:4px;border-radius:14px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);transition:.2s}
.seg .on{background:#fff;color:var(--o);box-shadow:0 3px 10px rgba(28,25,23,.12),inset 0 0 0 1.5px var(--o)}
.btn{display:block;width:100%;margin-top:8px;padding:13px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,#ff7a3d,#ff5a1f 60%,#f04e12);color:#fff;font-weight:800;font-size:14.5px;letter-spacing:.2px;box-shadow:0 5px 0 #c2410c,0 14px 26px rgba(255,90,31,.35),inset 0 1.5px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);transform:translateX(-70%);transition:transform .5s}
.btn:hover::after{transform:translateX(70%)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c2410c,0 8px 16px rgba(255,90,31,.3)}
.btn.sm{width:auto;flex:none;padding:7px 12px;margin:0 0 0 6px;font-size:11px;border-radius:10px}
.btn.g{background:linear-gradient(180deg,#f0faf3,#dcf0e3);color:#166534;box-shadow:0 4px 0 #b7d4b7,0 10px 20px rgba(22,101,52,.15),inset 0 1.5px 0 #fff}
.btn.r{background:linear-gradient(180deg,#fef2f2,#fde3e3);color:#b91c1c;box-shadow:0 4px 0 #e5bcbc,0 10px 20px rgba(185,28,28,.12)}
.btn.b{background:linear-gradient(180deg,#60a5fa,#2563eb);color:#fff;box-shadow:0 4px 0 #1d4ed8,0 12px 22px rgba(37,99,235,.3)}
.btn.y{background:linear-gradient(180deg,#fff4d6,#ffe6a3);color:#8a5a00;box-shadow:0 4px 0 #d9a800,0 10px 20px rgba(217,168,0,.25),inset 0 1.5px 0 #fff}
.btn.p{background:linear-gradient(180deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 5px 0 #5b21b6,0 14px 26px rgba(124,58,237,.35),inset 0 1.5px 0 rgba(255,255,255,.5)}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;margin:5px 0;font-size:14px;font-weight:600;background:#fff;color:var(--ink);box-shadow:inset 0 2px 5px rgba(28,25,23,.05);transition:.2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 4px rgba(255,90,31,.14);background:#fffdf9}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed #e7dcc9}
.row:last-child{border-bottom:0}
.big{background:linear-gradient(135deg,#ff8a3d,#ff5a1f 55%,#e8480c);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 18px 36px rgba(255,90,31,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.big::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 160px at 85% 0%,rgba(255,255,255,.25),transparent 60%)}
.big .n{font-size:44px;font-weight:800;letter-spacing:-1px;text-shadow:0 4px 12px rgba(0,0,0,.25)}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gr div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 6px;text-align:center;font-size:10.5px;font-weight:700;backdrop-filter:blur(4px)}
.gr b{font-size:17px;display:block;font-weight:800}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pm div{background:#f6f0e4;border:1px solid #eee3cf;border-radius:14px;padding:10px 6px;text-align:center;font-size:10.5px;color:var(--muted);font-weight:700}
.pm b{font-size:17px;display:block;color:var(--o);font-weight:800}
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.86);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.7);border-radius:22px;display:flex;padding:6px;box-shadow:0 16px 40px rgba(28,25,23,.18),inset 0 1px 0 #fff;z-index:100}
.nav div{flex:1;text-align:center;font-size:9.5px;font-weight:800;color:var(--muted);padding:6px 2px 5px;border-radius:16px;position:relative;transition:.2s}
.nav div.on{color:var(--o);background:linear-gradient(180deg,#fff1e6,#ffe3cd)}
.nav div.on::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--o);box-shadow:0 0 6px var(--o)}
.nimg{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 3px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.nav div.on .nimg{border-color:var(--o);transform:scale(1.06)}
a{color:var(--o);font-weight:700;font-size:12px;text-decoration:none}
.zban{position:relative;margin:0 -14px 14px;padding:18px 16px 20px;border-radius:0 0 30px 30px;background-size:cover;background-position:center;color:#fff;overflow:hidden;box-shadow:0 20px 44px rgba(11,61,44,.35);animation:rise .5s both}
.zban::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,40,28,.25),rgba(8,40,28,.55) 45%,rgba(8,40,28,.88))}
.zban::after{content:'';position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:rotate(12deg);animation:sheen 6s ease-in-out infinite}
.ztop{display:flex;justify-content:space-between;align-items:center;font-size:13px;position:relative;z-index:5}
.zban h2{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.12;margin:18px 0 14px;text-shadow:0 4px 14px rgba(0,0,0,.5);position:relative;z-index:5}
.zsearch{background:rgba(255,255,255,.96);color:#57534e;border-radius:16px;padding:13px 15px;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 -2px 0 rgba(0,0,0,.05);display:flex;gap:9px;align-items:center;position:relative;z-index:5;cursor:pointer;backdrop-filter:blur(6px)}
.zmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;font-weight:800;position:relative;z-index:5}
.zmeta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.rpill{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:9px;box-shadow:0 4px 10px rgba(22,163,74,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.zrest{background:#fffdf9;border:1px solid rgba(255,255,255,.9);border-radius:24px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 4px rgba(28,25,23,.04),0 14px 34px rgba(28,25,23,.10);animation:rise .5s .1s both}
.zrimg{height:132px;background-size:cover;background-position:center;position:relative}
.zrimg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(20,12,4,.62))}
.zpromo{position:absolute;left:0;bottom:0;z-index:2;background:linear-gradient(90deg,#0e5c3f,#127a52);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:7px 14px;border-radius:0 14px 0 0;box-shadow:0 6px 16px rgba(14,92,63,.4)}
.zrbody{padding:16px}
.vi{display:inline-block;width:15px;height:15px;border:2px solid #16a34a;border-radius:4px;position:relative;vertical-align:-3px;background:#fff}
.vi::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#16a34a}
.vi.nv{border-color:#dc2626}.vi.nv::after{background:#dc2626}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:11.5px;color:#57534e;display:flex;align-items:center;gap:6px;box-shadow:0 3px 8px rgba(28,25,23,.06);transition:.2s}
.chips2 button.on{background:linear-gradient(180deg,#ff7a3d,#ff5a1f);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(255,90,31,.35)}
.cimg{width:20px;height:20px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #e9dfcd}
.it:last-child{border-bottom:0}
.in{flex:1;min-width:0;font-size:14px}
.in b{font-weight:700;font-size:13.5px}
.stp2{display:flex;align-items:center;gap:8px;border:1.5px solid #ffd9c2;border-radius:12px;padding:3px;flex:none;background:#fff7f0}
.stp2 button{width:30px;height:30px;border:0;border-radius:9px;background:#fff;color:var(--o);font-size:19px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.stp2 b{min-width:20px;text-align:center;color:var(--o);font-weight:800}
.cbar{position:sticky;bottom:96px;background:linear-gradient(135deg,#0e5c3f,#127a52);color:#fff;border-radius:18px;padding:13px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;z-index:6;box-shadow:0 16px 34px rgba(14,92,63,.4)}
.dcard{border-left:5px solid var(--o);border-radius:20px}
.pill{padding:4px 10px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.4px}
.edbox{background:#fffaf0;border:1.5px dashed #e5c986;border-radius:16px;padding:12px;margin-bottom:10px}
.nut{display:inline-block;background:#eef7f0;color:#166534;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:8px;margin-left:4px}
.wafloat{position:fixed;right:14px;bottom:100px;z-index:99;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c4a);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 12px 26px rgba(18,140,74,.45);border:2px solid rgba(255,255,255,.6);animation:fl 3s ease-in-out infinite}
.rimg{width:22px;height:22px;border-radius:7px;object-fit:cover;vertical-align:-6px;margin-right:6px;box-shadow:0 0 0 2px #fff,0 3px 6px rgba(0,0,0,.15)}
.iew{width:60px;flex:none;display:flex;align-items:center;justify-content:center}
.mrp{text-decoration:line-through;color:var(--muted);font-size:11px;margin-right:4px}
.price{color:var(--o);font-weight:800;font-size:13.5px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}#printArea tr{page-break-inside:avoid}}
.fv{position:relative;display:inline-block;perspective:900px;pointer-events:auto}
.fv .stage{position:relative;display:inline-block;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.fv:hover .stage{transform:rotateY(-12deg) rotateX(8deg)}
.fv.tilt .stage{transition:none}
.fv .edge{position:absolute;inset:0;border-radius:50%;background:linear-gradient(180deg,#9aa0a6,#565b60 45%,#2e3236);transform:translate3d(0,9px,-16px);box-shadow:0 16px 32px rgba(0,0,0,.45)}
.fv .ph{position:relative;border-radius:50%;overflow:hidden;transform:translateZ(0);box-shadow:0 8px 20px rgba(20,12,4,.25),0 18px 40px rgba(20,12,4,.35),inset 0 -14px 26px rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.92),0 0 0 7px rgba(0,0,0,.06)}
.fv .ph::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.35) 48%,transparent 58%);transform:translateX(-100%);transition:transform .8s ease;z-index:3}
.fv:hover .ph::before{transform:translateX(100%)}
.fv .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.fv:hover .ph img{transform:scale(1.05)}
.fv .fvemo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#fff7ec,#ffe3c2)}
.fv .ring{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(255,255,255,.55);box-shadow:0 0 26px rgba(255,140,60,.28);pointer-events:none;transform:translateZ(26px)}
.fv .stm{position:absolute;left:50%;bottom:80%;width:10px;height:36%;border-radius:10px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.5));filter:blur(6px);opacity:0;animation:fvsteam 4s ease-in-out infinite;transform-origin:bottom}
.fv .stm.s2{left:38%;animation-delay:1.3s}
.fv .stm.s3{left:62%;animation-delay:2.6s}
@keyframes fvsteam{0%{opacity:0;transform:translate3d(0,6px,46px) scaleY(.7)}35%{opacity:.7}100%{opacity:0;transform:translate3d(0,-18px,46px) scaleY(1.15)}}
.fv .glow{position:absolute;left:50%;bottom:-14%;transform:translate3d(-50%,0,-26px);width:82%;height:22%;background:radial-gradient(ellipse,rgba(255,140,60,.38),transparent 70%);filter:blur(10px)}
.fv.sm .ph{width:52px;height:52px;box-shadow:0 8px 18px rgba(20,12,4,.28),inset 0 -6px 12px rgba(0,0,0,.25),0 0 0 3px rgba(255,255,255,.92)}
.fv.sm .edge{transform:translate3d(0,5px,-10px)}
.fv.sm .stm,.fv.sm .ring,.fv.sm .glow{display:none}
.fv.sm .fvemo{font-size:24px}
.fv.md .ph{width:96px;height:96px}
.fv.md .fvemo{font-size:44px}
.fv.lg .ph{width:150px;height:150px}
.fv.lg .fvemo{font-size:60px}
.iew .flip{position:relative;width:56px;height:56px;perspective:420px;cursor:pointer}
.iew .flip .face{position:absolute;inset:0;border-radius:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.iew .flip .face.front{transform:rotateY(0)}
.iew .flip .face.back{transform:rotateY(180deg);background:linear-gradient(160deg,#0e5c3f,#127a52);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;line-height:1.45;text-align:center;box-shadow:0 6px 14px rgba(14,92,63,.35),0 0 0 3px rgba(255,255,255,.9)}
.iew .flip.on .face.front{transform:rotateY(-180deg)}
.iew .flip.on .face.back{transform:rotateY(0)}
.fv .ph,.nimg,.cimg,.rimg{background-image:linear-gradient(100deg,#ece5d8 40%,#f7f1e6 50%,#ece5d8 60%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.hero{background:linear-gradient(135deg,#ff8a3d,#ff5a1f 55%,#d63f0a);border-radius:26px;padding:22px 18px 92px;margin:14px 0 16px;position:relative;overflow:hidden;color:#fff;box-shadow:0 22px 44px rgba(255,90,31,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff30 50%,transparent 60%);transform:translateX(-60%);animation:sheen 5s ease-in-out infinite;pointer-events:none;z-index:1}
.hero h2,.hero p{position:relative;z-index:2}
.hero h2{font-size:22px;line-height:1.2;margin-bottom:8px;font-weight:800;letter-spacing:-.4px;text-shadow:0 3px 10px rgba(0,0,0,.35)}
.hero p{font-size:13px;opacity:.95}
.fog{position:absolute;left:-20%;right:-20%;bottom:-40px;height:130px;background:radial-gradient(ellipse at center,rgba(255,255,255,.34),transparent 70%);filter:blur(12px);animation:fog 7s ease-in-out infinite;z-index:1;pointer-events:none}
.fog.f2{bottom:34px;animation-delay:2.5s;opacity:.55}
.svgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.svcard{background:linear-gradient(180deg,#fffdf9,#fff9f0);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:14px;text-align:center;box-shadow:0 8px 20px rgba(28,25,23,.08);animation:rise .5s both}
.svcard b{display:block;font-size:13px;margin:8px 0 2px}
.smart-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-size:9px;font-weight:800;padding:3px 8px;border-radius:8px;animation:pulse 2s infinite}
