function validateStrictUTR(raw, usedList) {
  const clean = String(raw || "").replace(/\D/g, "");
  if (clean.length !== 12) return { ok: false, msg: "⚠️ Exact 12-digit UPI UTR number daalein!" };
  if (/^(\d)\1{6,}/.test(clean) || /(012345|123456|234567|345678|456789|987654|654321)/.test(clean)) {
    return { ok: false, msg: "⚠️ Fake sequence UTR blocked! Asli bank UTR daalein." };
  }
  if ((usedList || []).includes(clean)) return { ok: false, msg: "⚠️ Duplicate UTR! Yeh UTR pehle use ho chuka hai." };
  return { ok: true, utr: clean };
}

function parsePaymentAlertText(rawText) {
  const txt = String(rawText || "").trim();
  if (!txt) return { utr: "", amount: null, raw: "" };
  const utrMatch = txt.match(/\b(\d{12})\b/) || txt.match(/(?:utr|ref(?:erence)?|upi\s*ref)[^0-9]*(\d{10,16})/i);
  const amtMatch = txt.match(/(?:rs\.?|inr|₹|paid|received|credited)\s*[:\-]?\s*([0-9]+(?:\.[0-9]{1,2})?)/i)
    || txt.match(/([0-9]+(?:\.[0-9]{1,2})?)\s*(?:rs\.?|inr|₹)/i);
  return { utr: utrMatch ? utrMatch[1] : "", amount: amtMatch ? parseFloat(amtMatch[1]) : null, raw: txt };
}

function playOrderAlertSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!AUDIO_CTX) AUDIO_CTX = new Ctx();
    if (AUDIO_CTX.state === "suspended") AUDIO_CTX.resume().catch(() => {});
    const now = AUDIO_CTX.currentTime;
    [{ t: 0, f: 659 }, { t: 0.22, f: 880 }, { t: 0.44, f: 1174 }].forEach(p => {
      const osc = AUDIO_CTX.createOscillator();
      const g = AUDIO_CTX.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(p.f, now + p.t);
      g.gain.setValueAtTime(0.001, now + p.t);
      g.gain.exponentialRampToValueAtTime(0.28, now + p.t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + p.t + 0.35);
      osc.connect(g); g.connect(AUDIO_CTX.destination);
      osc.start(now + p.t); osc.stop(now + p.t + 0.4);
    });
  } catch (e) {}
}

let applyingRemote = false;
async function pullRemoteState() {
  try {
    const res = await fetch(FB_REST);
    if (!res.ok) return;
    const val = await res.json();
    if (val && val.cfg && (+val.rev || 0) > (+S.rev || 0)) {
      applyingRemote = true;
      S = { ...defaultState(), ...val, cfg: { ...defaultState().cfg, ...val.cfg } };
      localStorage.setItem("NU_V4_STATE", JSON.stringify(S));
      if ($("#fbStatus")) $("#fbStatus").textContent = "🟢 Live Sync";
      render();
      applyingRemote = false;
    } else if ($("#fbStatus")) {
      $("#fbStatus").textContent = "🟢 Live Ready";
    }
  } catch (e) {
    if ($("#fbStatus")) $("#fbStatus").textContent = "🟡 Offline";
  }
}
pullRemoteState();
setInterval(pullRemoteState, 8000);

function save(logMsg) {
  if (logMsg) {
    S.auditLog = S.auditLog || [];
    S.auditLog.unshift({ t: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), m: logMsg });
    if (S.auditLog.length > 50) S.auditLog.length = 50;
  }
  S.rev = Date.now();
  try { localStorage.setItem("NU_V4_STATE", JSON.stringify(S)); } catch (e) {}
  if (!applyingRemote) {
    fetch(FB_REST, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) }).catch(() => {});
  }
  render();
}

function calcTiffinPrice(diet, days, slot) {
  const base = +(S.cfg.tiffinRates[diet]?.[days] || 920);
  const bf = (+S.cfg.tiffinRates.breakfastPerDay || 40) * days;
  if (slot === "Morning Breakfast (7:30 AM)") return bf;
  if (slot === "Breakfast + Lunch") return bf + base;
  if (slot === "Lunch + Dinner") return Math.round(base * 1.85);
  if (slot === "All 3 Meals (B+L+D)") return bf + Math.round(base * 1.85);
  return base;
}

const foodCartCount = () => Object.values(FOOD_CART).reduce((a, b) => a + (+b || 0), 0);
const foodCartTotal = () => Object.entries(FOOD_CART).reduce((s, [id, q]) => { const it = S.foodItems.find(x => x.id === id); return it ? s + it.price * q : s; }, 0);
const kiranaCartCount = () => Object.values(KIRANA_CART).reduce((a, b) => a + (+b || 0), 0);
const kiranaSubtotal = () => Object.entries(KIRANA_CART).reduce((s, [id, q]) => { const it = S.kiranaItems.find(x => x.id === id); return it ? s + it.price * q : s; }, 0);
const kiranaDeliveryFee = sub => sub <= 0 ? 0 : (sub >= (+S.cfg.kiranaFreeDeliveryAt || 500) ? 0 : (+S.cfg.kiranaDeliveryFee || 25));

function statusTimeline(st, isKirana) {
  const steps = isKirana ? ["Placed", "Packed", "Ready for Pickup", "Out for Delivery", "Delivered"] : ["Placed", "Confirmed", "Cooking", "Ready for Pickup", "Out for Delivery", "Delivered"];
  if (st === "Cancelled") return `<div class="tl"><span style="background:#ffe4e6;color:#9f1239">❌ Cancelled</span></div>`;
  const idx = Math.max(0, steps.indexOf(st));
  return `<div class="tl">${steps.map((s, i) => `<span class="${i < idx ? "done" : i === idx ? "now" : ""}">${s === "Ready for Pickup" ? "Ready" : s === "Out for Delivery" ? "On Way" : s}</span>`).join("")}</div>`;
}

function getVendorLedger(v) {
  const list = v.type === "FOOD" ? (S.foodOrders || []) : (S.kiranaOrders || []);
  let gross = 0, comm = 0;
  list.filter(o => o.status !== "Cancelled").forEach(o => {
    const sub = o.items.filter(i => i.vendorId === v.id).reduce((a, i) => a + i.price * i.qty, 0);
    if (sub > 0) {
      gross += sub;
      if (!v.isSelf) {
        if (v.type === "FOOD") comm += Math.round((sub * (+S.cfg.foodPartnerCommPct || 20)) / 100);
        if (v.type === "KIRANA" && o.status === "Delivered") comm += (+S.cfg.kiranaPostDeliveryComm || 30);
      }
    }
  });
  return { gross, comm, due: Math.max(0, gross - comm - (+v.settledPaid || 0)) };
}

    ...(S.foodOrders || []).map(o => ({ ...o, kind: "FOOD" })),
    ...(S.kiranaOrders || []).map(o => ({ ...o, kind: "KIRANA" }))
  ].reverse();
  return `
    <div class="card">
      <h3>📦 My Orders (${all.length})</h3>
      ${all.map(o => `
        <div class="order-smart-card">
          <div class="order-smart-head">
            <div><b>[${o.kind}] ${esc(o.id)} · ${inr(o.total)}</b><div style="font-size:10.5px;color:var(--mu)">${esc(o.date)} · ${esc(o.time)} · 📍 ${esc(o.area)}</div></div>
            <span class="pill ${o.status === "Delivered" ? "p-green" : o.status === "Cancelled" ? "p-red" : "p-amber"}">${esc(o.status)}</span>
          </div>
          ${statusTimeline(o.status, o.kind === "KIRANA")}
          ${o.deliveryOtp && o.status !== "Delivered" && o.status !== "Cancelled" ? `<div style="font-size:11px;background:#fef3c7;color:#92400e;padding:4px 8px;border-radius:8px;font-weight:800;margin:4px 0">🔐 Handover PIN: <b>${esc(o.deliveryOtp)}</b></div>` : ""}
          <div class="order-smart-meta">${(o.items || []).map(i => `${esc(i.name)} ×${i.qty}`).join(", ")} · Pay: <b>${esc(o.payMode)}</b> ${o.utr ? `· UTR: ${esc(o.utr)}` : ""}</div>
        </div>`).join("") || `<p style="font-size:12px;color:var(--mu)">Abhi koi order nahi hai.</p>`}
    </div>`;
}

function viewProfile() {
  return `
    <div class="card">
      <h3>👤 Saved Profile & Address</h3>
      <span class="lbl">Naam</span><input class="inp" data-tf="name" value="${esc(TF.name)}" placeholder="Aapka naam" />
      <span class="lbl">10-Digit Mobile</span><input class="inp" data-tf="phone" type="tel" maxlength="10" value="${esc(TF.phone)}" placeholder="10-digit mobile" />
      <span class="lbl">Udala Area</span><select class="inp" data-tf="area">${UDALA_AREAS.map(a => `<option value="${a}" ${TF.area === a ? "selected" : ""}>📍 ${a}</option>`).join("")}</select>
      <span class="lbl">Address</span><input class="inp" data-tf="addr" value="${esc(TF.addr)}" placeholder="Pura address" />
      <button class="btn g full" data-act="saveProfile">✓ Save Profile</button>
    </div>
    <div class="card">
      <h3>🔐 Staff / Owner Login</h3>
      <p style="font-size:11.5px;color:var(--mu);margin-bottom:8px">Owner (4827), Kitchen (1122), Delivery (3344) ya Vendor PIN se panel kholein.</p>
      <button class="btn o full" data-act="staffPinLogin">🔑 Enter Staff / Owner PIN</button>
    </div>`;
}

function viewOwner() {
  const fValid = (S.foodOrders || []).filter(o => o.status !== "Cancelled");
  const kValid = (S.kiranaOrders || []).filter(o => o.status !== "Cancelled");
  const allOrds = [...fValid.map(o => ({ ...o, kind: "FOOD" })), ...kValid.map(o => ({ ...o, kind: "KIRANA" }))].reverse();
  const tSales = (S.tiffinSubs || []).filter(s => s.paid).reduce((a, s) => a + (+s.price || 0), 0);
  const fSales = fValid.reduce((a, o) => a + (+o.total || 0), 0);
  const kSales = kValid.reduce((a, o) => a + (+o.total || 0), 0);
  const codCol = allOrds.filter(o => o.payMode === "COD" && o.status === "Delivered").reduce((a, o) => a + (+o.total || 0), 0);
  const codDue = Math.max(0, codCol - (+S.riderCashSettled || 0));

  return `
    <div class="card" style="background:#0f172a;color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><small style="color:#fbbf24;font-weight:800">OWNER MASTER (4827) · ${todayIso()}</small><h2>Admin Control Center</h2></div>
        <div style="display:flex;gap:6px"><button class="btn amb sm" data-act="testSound">🔊 Sound</button><button class="btn w sm" data-act="exitStaff">Exit</button></div>
      </div>
    </div>
    <div class="kpi">
      <div><b>${inr(tSales)}</b><span>Tiffin Rev</span></div>
      <div><b>${inr(fSales)}</b><span>Food GMV</span></div>
      <div><b>${inr(kSales)}</b><span>Sauda GMV</span></div>
    </div>
    <div class="card" style="border-left:5px solid var(--g2)">
      <h3>📲 Notification / SMS Quick-Match</h3>
      <div class="btn-row">
        <input class="inp" id="notifAlertPasteInp" placeholder="Paste UPI SMS / Notification text..." />
        <button class="btn g sm" style="max-width:130px" data-act="quickMatchAlert">⚡ Match & Verify</button>
      </div>
    </div>
    <div class="card">
      <h3>📦 All Live Orders (${allOrds.length}) · COD Due: ${inr(codDue)}</h3>
      ${allOrds.map(o => `
        <div class="order-smart-card" style="border-left-color:${o.utrVerified ? "var(--g2)" : "var(--amb)"}">
          <div class="order-smart-head">
            <div><b>[${o.kind}] ${esc(o.id)} · ${esc(o.name)} · ${inr(o.total)}</b><div style="font-size:10.5px;color:var(--mu)">📞 ${esc(o.phone)} · 📍 ${esc(o.area)} · ${esc(o.payMode)} ${o.utr ? `· UTR: ${esc(o.utr)}` : ""}</div></div>
            <span class="pill ${o.utrVerified ? "p-green" : "p-amber"}">${esc(o.status)}</span>
          </div>
          <div class="order-smart-meta">${(o.items || []).map(i => `${esc(i.name)}×${i.qty}`).join(", ")}</div>
          <div class="btn-row" style="margin-top:8px">
            ${o.payMode === "UPI" && !o.utrVerified ? `<button class="btn g sm" data-act="verifyUtr" data-k="${o.kind}" data-id="${o.id}">Verify UTR ✓</button>` : ""}
            <button class="btn amb sm" data-act="ordStatus" data-k="${o.kind}" data-id="${o.id}" data-s="Ready for Pickup">✅ Ready</button>
            <button class="btn g sm" data-act="ordStatus" data-k="${o.kind}" data-id="${o.id}" data-s="Delivered">Delivered</button>
            <button class="btn r sm" data-act="cancelOrder" data-k="${o.kind}" data-id="${o.id}">Cancel</button>
          </div>
        </div>`).join("") || `<p style="font-size:12px;color:var(--mu)">No orders yet.</p>`}
    </div>`;
}

function viewKitchen() {
  const subs = (S.tiffinSubs || []).filter(s => !s.skipToday);
  const fOrds = (S.foodOrders || []).filter(o => o.status !== "Delivered" && o.status !== "Cancelled");
  return `
    <div class="card" style="background:#113221;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><div><small style="color:#fbbf24;font-weight:800">KITCHEN (1122)</small><h2>Rasoi Queue</h2></div><button class="btn w sm" data-act="exitStaff">Exit</button></div></div>
    <div class="card"><h3>🍱 Active Tiffins (${subs.length})</h3>${subs.map(s => `<div class="row"><b>${esc(s.name)} (${s.diet === "nv" ? "NV" : "Veg"} · ${esc(s.slot)})</b><span>${esc(s.area)}</span></div>`).join("")}</div>
    <div class="card"><h3>🍛 Open Food Orders (${fOrds.length})</h3>
      ${fOrds.map(o => `<div class="order-smart-card"><b>${esc(o.id)} — ${esc(o.name)}</b><div class="order-smart-meta">${(o.items || []).map(i => `${esc(i.name)}×${i.qty}`).join(", ")}</div>
        <div class="btn-row" style="margin-top:6px"><button class="btn amb sm" data-act="ordStatus" data-k="FOOD" data-id="${o.id}" data-s="Cooking">🔥 Cooking</button><button class="btn g sm" data-act="ordStatus" data-k="FOOD" data-id="${o.id}" data-s="Ready for Pickup">📦 Ready</button></div></div>`).join("") || `<p style="font-size:12px;color:var(--mu)">No pending food orders.</p>`}
    </div>`;
}

function viewDelivery() {
  const drops = [
    ...(S.foodOrders || []).filter(o => o.status !== "Delivered" && o.status !== "Cancelled").map(o => ({ ...o, kind: "FOOD" })),
    ...(S.kiranaOrders || []).filter(o => o.status !== "Delivered" && o.status !== "Cancelled").map(o => ({ ...o, kind: "KIRANA" }))
  ];
  return `
    <div class="card" style="background:#064e3b;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><div><small style="color:#fbbf24;font-weight:800">DELIVERY (3344)</small><h2>Active Drops (${drops.length})</h2></div><button class="btn w sm" data-act="exitStaff">Exit</button></div></div>
    <div class="card">
      ${drops.map(o => `<div class="order-smart-card"><b>[${o.kind}] ${esc(o.id)} — ${esc(o.name)} (${o.payMode === "COD" ? "Collect " + inr(o.total) : "UPI Paid"})</b>
        <div class="order-smart-meta">📍 ${esc(o.area)} · ${esc(o.addr)} · 📞 ${esc(o.phone)}</div>
        <div class="btn-row" style="margin-top:8px"><a class="btn w sm" href="tel:+91${esc(o.phone)}">📞 Call</a>
        <button class="btn amb sm" data-act="ordStatus" data-k="${o.kind}" data-id="${o.id}" data-s="Out for Delivery">🛵 Picked Up</button>
        <button class="btn g sm" data-act="deliverPin" data-k="${o.kind}" data-id="${o.id}">✅ Deliver (PIN)</button></div></div>`).join("") || `<p style="font-size:12px;color:var(--mu)">No pending drops.</p>`}
    </div>`;
}

function viewVendor() {
  const v = S.vendors.find(x => x.id === ACTIVE_VENDOR_ID);
  if (!v) { ROLE = "customer"; return viewTiffin(); }
  const led = getVendorLedger(v);
  const myOrders = (v.type === "FOOD" ? S.foodOrders : S.kiranaOrders).filter(o => o.status !== "Cancelled" && o.items.some(i => i.vendorId === v.id));
  return `
    <div class="card" style="background:#78350f;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><div><small style="color:#fde68a;font-weight:800">VENDOR PANEL</small><h2>${esc(v.name)}</h2></div><button class="btn w sm" data-act="exitStaff">Exit</button></div></div>
    <div class="kpi"><div><b>${inr(led.gross)}</b><span>Gross</span></div><div><b>-${inr(led.comm)}</b><span>Comm</span></div><div><b>${inr(led.due)}</b><span>Due</span></div></div>
    <div class="card"><h3>Incoming Orders (${myOrders.length})</h3>
      ${myOrders.slice().reverse().map(o => `<div class="order-smart-card"><b>${esc(o.id)} · ${esc(o.name)} (${esc(o.status)})</b>
        <div class="order-smart-meta">${o.items.filter(i => i.vendorId === v.id).map(i => `${esc(i.name)}×${i.qty}`).join(", ")}</div>
        <div class="btn-row" style="margin-top:6px"><button class="btn g sm" data-act="ordStatus" data-k="${v.type}" data-id="${o.id}" data-s="Ready for Pickup">📦 Mark Ready</button></div></div>`).join("") || `<p style="font-size:12px;color:var(--mu)">No orders yet.</p>`}
    </div>`;
}

function render() {
  if (ROLE === "owner") $("#appMain").innerHTML = viewOwner();
  else if (ROLE === "kitchen") $("#appMain").innerHTML = viewKitchen();
  else if (ROLE === "delivery") $("#appMain").innerHTML = viewDelivery();
  else if (ROLE === "vendor") $("#appMain").innerHTML = viewVendor();
  else {
    if (TAB === "checkout" && CHECKOUT) $("#appMain").innerHTML = viewCheckout();
    else if (TAB === "tiffin") $("#appMain").innerHTML = viewTiffin();
    else if (TAB === "food") $("#appMain").innerHTML = viewFood();
    else if (TAB === "kirana") $("#appMain").innerHTML = viewKirana();
    else if (TAB === "orders") $("#appMain").innerHTML = viewOrders();
    else $("#appMain").innerHTML = viewProfile();
  }

  let cbar = "";
  if (ROLE === "customer" && TAB === "food" && foodCartCount() > 0) {
    cbar = `<div class="cbar" data-act="openFoodCheckout"><span>🍛 Food Cart: ${foodCartCount()} Items · ${inr(foodCartTotal())}</span><span>Checkout →</span></div>`;
  } else if (ROLE === "customer" && TAB === "kirana" && kiranaCartCount() > 0) {
    const sub = kiranaSubtotal();
    cbar = `<div class="cbar" data-act="openKiranaCheckout"><span>🛒 Sauda: ${inr(sub)}</span><span>Checkout →</span></div>`;
  }
  $("#cartFloat").innerHTML = cbar;

  if (ROLE === "customer") {
    $("#bottomNav").style.display = "flex";
    const navs = [["tiffin","🍱","Tiffin",0],["food","🍛","Food",foodCartCount()],["kirana","🛒","Sauda",kiranaCartCount()],["orders","📦","Orders",(S.foodOrders.length+S.kiranaOrders.length)],["account","👤","Profile",0]];
    $("#bottomNav").innerHTML = navs.map(([t,ic,lbl,cnt]) => `<button class="${TAB === t ? "on" : ""}" data-act="setTab" data-v="${t}"><span style="font-size:17px">${ic}</span><span>${lbl}</span>${cnt > 0 ? `<span class="nb">${cnt}</span>` : ""}</button>`).join("");
  } else {
    $("#bottomNav").style.display = "none";
  }
}

/* ==================== ACTIONS ==================== */
const ACT = {
  toggleTheme: () => { const d = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = d ? "dark" : ""; localStorage.setItem("nu_dark", d ? "1" : "0"); render(); },
  setTab: v => { TAB = v; SELECTED_REST_ID = null; render(); scrollTo({ top: 0, behavior: "smooth" }); },
  tfSet: (v, k) => { TF[k] = k === "days" ? +v : v; render(); },
  openRest: (v, k, id) => { SELECTED_REST_ID = id; render(); },
  backVendors: () => { SELECTED_REST_ID = null; render(); },
  setFoodCat: v => { FOOD_CAT = v; render(); },
  setKiranaCat: v => { KIRANA_CAT = v; render(); },
  fInc: (v, k, id) => { FOOD_CART[id] = (FOOD_CART[id] || 0) + 1; render(); },
  fDec: (v, k, id) => { FOOD_CART[id] = Math.max(0, (FOOD_CART[id] || 0) - 1); if (!FOOD_CART[id]) delete FOOD_CART[id]; render(); },
  kInc: (v, k, id) => { KIRANA_CART[id] = (KIRANA_CART[id] || 0) + 1; render(); },
  kDec: (v, k, id) => { KIRANA_CART[id] = Math.max(0, (KIRANA_CART[id] || 0) - 1); if (!KIRANA_CART[id]) delete KIRANA_CART[id]; render(); },
  openTiffinCheckout: () => {
    const total = calcTiffinPrice(TF.diet, TF.days, TF.slot);
    CHECKOUT = { kind: "TIFFIN", title: "Mera Tiffin", summary: `${TF.days}d · ${TF.diet === "nv" ? "Non-Veg" : "Veg"} · ${TF.slot}`, total, payMode: "UPI" };
    TAB = "checkout"; render();
  },
  openFoodCheckout: () => {
    const items = Object.entries(FOOD_CART).map(([id, qty]) => { const it = S.foodItems.find(x => x.id === id); return it ? { ...it, qty } : null; }).filter(Boolean);
    if (!items.length) return;
    CHECKOUT = { kind: "FOOD", title: "Food Checkout", summary: items.map(i => `${i.name}×${i.qty}`).join(", "), items, total: foodCartTotal(), payMode: "UPI" };
    TAB = "checkout"; render();
  },
  openKiranaCheckout: () => {
    const sub = kiranaSubtotal();
    const minOrd = +S.cfg.kiranaMinOrder || 300;
    if (sub < minOrd) return toast(`⚠️ Min ₹${minOrd} order zaroori hai!`);
    const items = Object.entries(KIRANA_CART).map(([id, qty]) => { const it = S.kiranaItems.find(x => x.id === id); return it ? { ...it, qty } : null; }).filter(Boolean);
    const fee = kiranaDeliveryFee(sub);
    CHECKOUT = { kind: "KIRANA", title: "Sauda Checkout", summary: items.map(i => `${i.name}×${i.qty}`).join(", "), items, sub, deliveryFee: fee, total: sub + fee, payMode: "UPI" };
    TAB = "checkout"; render();
  },
  cancelCheckout: () => { CHECKOUT = null; TAB = "tiffin"; render(); },
  setPayMode: v => { if (CHECKOUT) { CHECKOUT.payMode = v; render(); } },
  copyUpi: () => { navigator.clipboard?.writeText(S.cfg.upi); toast(`📋 Copied: ${S.cfg.upi}`); },
  confirmCheckout: () => {
    if (!CHECKOUT) return;
    const cleanPhone = ph(TF.phone);
    if (!TF.name.trim() || cleanPhone.length !== 10 || TF.addr.trim().length < 5) return toast("⚠️ Naam, 10-digit Mobile aur Address bharein!");
    localStorage.setItem("nu_cname", TF.name.trim()); localStorage.setItem("nu_cphone", cleanPhone);
    localStorage.setItem("nu_carea", TF.area); localStorage.setItem("nu_caddr", TF.addr.trim());
    let utr = "";
    if (CHECKOUT.payMode === "UPI") {
      const chk = validateStrictUTR($("#chkUtrInp")?.value, S.usedUtrs);
      if (!chk.ok) return toast(chk.msg);
      utr = chk.utr;
      S.usedUtrs.push(utr);
    }
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (CHECKOUT.kind === "TIFFIN") {
      S.tiffinSubs.unshift({ id: "TS-" + Math.floor(1000 + Math.random() * 9000), date: todayIso(), time, name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(), diet: TF.diet, days: TF.days, remaining: TF.days, slot: TF.slot, price: CHECKOUT.total, paid: CHECKOUT.payMode === "UPI" ? 1 : 0, utr, skipToday: false });
    } else if (CHECKOUT.kind === "FOOD") {
      S.foodOrders.push({ id: "FD-" + Math.floor(10000 + Math.random() * 90000), deliveryOtp: String(Math.floor(1000 + Math.random() * 9000)), date: todayIso(), time, name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(), items: CHECKOUT.items, total: CHECKOUT.total, payMode: CHECKOUT.payMode, utr, utrVerified: false, status: "Placed" });
      FOOD_CART = {};
    } else {
      S.kiranaOrders.push({ id: "KR-" + Math.floor(10000 + Math.random() * 90000), deliveryOtp: String(Math.floor(1000 + Math.random() * 9000)), date: todayIso(), time, name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(), items: CHECKOUT.items, total: CHECKOUT.total, payMode: CHECKOUT.payMode, utr, utrVerified: false, status: "Placed" });
      KIRANA_CART = {};
    }
    CHECKOUT = null; TAB = "orders";
    playOrderAlertSound();
    save(`New ${TAB} order by ${TF.name.trim()}`);
    toast("🎉 Order Placed!");
  },
  skipTiffin: (v, k, id) => { const s = S.tiffinSubs.find(x => x.id === id); if (s && !s.skipToday) { s.skipToday = true; s.remaining = (+s.remaining || 1) + 1; save(`Skipped tiffin ${s.id}`); toast("⏭ Skipped (+1d added)"); } },
  saveProfile: () => { localStorage.setItem("nu_cname", TF.name.trim()); localStorage.setItem("nu_cphone", ph(TF.phone)); localStorage.setItem("nu_carea", TF.area); localStorage.setItem("nu_caddr", TF.addr.trim()); toast("✅ Profile Saved!"); },
  staffPinLogin: () => {
    const pin = prompt("Staff / Owner PIN daalein (4827 / 1122 / 3344 / Vendor PIN):");
    if (!pin) return;
    if (pin === PINS.owner) { ROLE = "owner"; sessionStorage.setItem("nu_role", "owner"); render(); return toast("👑 Owner Unlocked"); }
    if (pin === PINS.kitchen) { ROLE = "kitchen"; sessionStorage.setItem("nu_role", "kitchen"); render(); return toast("🍳 Kitchen Unlocked"); }
    if (pin === PINS.delivery) { ROLE = "delivery"; sessionStorage.setItem("nu_role", "delivery"); render(); return toast("🛵 Delivery Unlocked"); }
    const vPins = { ...PINS.vendors, ...(S.cfg.vendorPins || {}) };
    const vid = Object.keys(vPins).find(k => vPins[k] === pin);
    if (vid) { ROLE = "vendor"; ACTIVE_VENDOR_ID = vid; sessionStorage.setItem("nu_role", "vendor"); sessionStorage.setItem("nu_vid", vid); render(); return toast("🏪 Vendor Unlocked"); }
    toast("❌ Galat PIN!");
  },
  exitStaff: () => { ROLE = "customer"; sessionStorage.setItem("nu_role", "customer"); render(); },
  testSound: () => { playOrderAlertSound(); toast("🔔 Sound Test OK!"); },
  ordStatus: (v, k, id, e) => {
    const st = e.target.closest("[data-s]")?.dataset.s;
    const o = (k === "FOOD" ? S.foodOrders : S.kiranaOrders).find(x => x.id === id);
    if (o && st) { o.status = st; save(`${k} ${id} -> ${st}`); toast(`Updated: ${st}`); }
  },
  deliverPin: (v, k, id) => {
    const o = (k === "FOOD" ? S.foodOrders : S.kiranaOrders).find(x => x.id === id);
    if (!o) return;
    const p = prompt(`Customer 4-digit PIN daalein (Hint: ${o.deliveryOtp || "1234"}):`);
    if (p === null) return;
    if (o.deliveryOtp && p.trim() !== String(o.deliveryOtp)) return toast("❌ Galat PIN!");
    o.status = "Delivered"; save(`Delivered ${id}`); toast("✅ Delivered!");
  },
  cancelOrder: (v, k, id) => {
    const o = (k === "FOOD" ? S.foodOrders : S.kiranaOrders).find(x => x.id === id);
    if (!o) return;
    const r = prompt("Cancel reason likhein:", "Item unavailable");
    if (!r || !r.trim()) return;
    o.status = "Cancelled"; o.cancelReason = r.trim(); save(`Cancelled ${id}: ${r.trim()}`); toast("❌ Cancelled");
  },
  verifyUtr: (v, k, id) => {
    const o = (k === "FOOD" ? S.foodOrders : S.kiranaOrders).find(x => x.id === id);
    if (!o) return;
    o.utrVerified = true;
    if (o.status === "Placed") o.status = k === "KIRANA" ? "Packed" : "Confirmed";
    save(`Verified UTR ${o.utr} for ${id}`); toast("✅ UTR Verified!");
  },
  quickMatchAlert: () => {
    const raw = ($("#notifAlertPasteInp")?.value || "").trim();
    if (!raw) return toast("⚠️ SMS / Notification text paste karein");
    window.onPaymentNotification("ManualPaste", "", raw);
    if ($("#notifAlertPasteInp")) $("#notifAlertPasteInp").value = "";
  }
};

document.addEventListener("click", e => {
  if (e.target.closest("#logoBtn")) {
    window._taps = (window._taps || 0) + 1;
    clearTimeout(window._tapT);
    window._tapT = setTimeout(() => { window._taps = 0; }, 1400);
    if (window._taps >= 5) { window._taps = 0; ACT.staffPinLogin(); }
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (btn && ACT[btn.dataset.act]) {
    if (btn.tagName !== "A") e.preventDefault();
    ACT[btn.dataset.act](btn.dataset.v, btn.dataset.k, btn.dataset.id, e);
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "chkUtrInp" && CHECKOUT) { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 12); CHECKOUT.draftUtr = e.target.value; return; }
  if (e.target.dataset.tf) {
    if (e.target.dataset.tf === "phone") e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10);
    TF[e.target.dataset.tf] = e.target.value;
  }
});
document.addEventListener("change", e => { if (e.target.dataset.tf) { TF[e.target.dataset.tf] = e.target.value; render(); } });

/* ==================== ANDROID LISTENER AUTO-VERIFY BRIDGE ==================== */
(function initNamasteUdalaListenerBridge() {
  const isBridge = Boolean(window.AndroidListener || window.NamasteUdalaBridge || /NamasteUdalaAlert/i.test(navigator.userAgent || ""));
  const badge = document.getElementById("listenerBadge");
  if (badge) badge.textContent = isBridge ? "📡 Listener ON" : "🌐 Web Mode";

  window.onPaymentNotification = function (pkg, title, body) {
    const raw = `${title || ""} ${body || ""}`.trim();
    const parsed = parsePaymentAlertText(raw);
    if (!parsed.utr && !(parsed.amount > 0)) return toast("⚠️ Amount ya 12-digit UTR nahi mila");

    const candidates = [
      ...(S.foodOrders || []).map(o => ({ o, kind: "FOOD" })),
      ...(S.kiranaOrders || []).map(o => ({ o, kind: "KIRANA" }))
    ].filter(x => x.o && x.o.payMode === "UPI" && !x.o.utrVerified && x.o.status !== "Cancelled");

    const hit = candidates.find(x =>
      (parsed.utr && String(x.o.utr || "").includes(parsed.utr)) ||
      (parsed.amount > 0 && Math.abs((+x.o.total || 0) - parsed.amount) < 0.01)
    );
    if (hit) {
      hit.o.utrVerified = true;
      if (parsed.utr && !hit.o.utr) hit.o.utr = parsed.utr;
      if (hit.o.status === "Placed") hit.o.status = hit.kind === "KIRANA" ? "Packed" : "Confirmed";
      playOrderAlertSound();
      save(`Auto-Verified [${pkg || "UPI"}] ${hit.o.id} (${inr(hit.o.total)})`);
      return toast(`✅ Auto-Verified: ${hit.o.id} · ${inr(hit.o.total)}`);
    }

    const tHit = (S.tiffinSubs || []).find(s =>
      !s.paid && (
        (parsed.utr && String(s.utr || "").includes(parsed.utr)) ||
        (parsed.amount > 0 && Math.abs((+s.price || 0) - parsed.amount) < 0.01)
      )
    );
    if (tHit) {
      tHit.paid = 1;
      if (parsed.utr && !tHit.utr) tHit.utr = parsed.utr;
      playOrderAlertSound();
      save(`Auto-Verified Tiffin [${pkg || "UPI"}] ${tHit.id} (${inr(tHit.price)})`);
      return toast(`✅ Tiffin Verified: ${tHit.id} · ${inr(tHit.price)}`);
    }
    toast("⚠️ Koi matching pending UPI order nahi mila");
  };
})();

render();
</script>
