<style>
:root{--o:#ff5a1f;--o2:#ff8a3d;--g:#0e5c3f;--g2:#127a52;--bg:#f6f3ec;--ink:#1c1917;--muted:#7d7468;--card:#fffdf9;--line:#ece2d0;--gold:#f5b301;--r:22px}
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:#ffd9c2}
html{scroll-behavior:smooth}
img{background:#f3ede3}
body{background:radial-gradient(1100px 480px at -8% -10%,#ffe9d2 0%,transparent 55%),radial-gradient(900px 520px at 108% 8%,#dff0e6 0%,transparent 50%),radial-gradient(760px 460px at 50% 112%,#fff3e0 0%,transparent 60%),var(--bg);color:var(--ink);padding-bottom:104px;font-weight:500;position:relative;-webkit-font-smoothing:antialiased}
body::before,body::after{content:'';position:fixed;width:380px;height:380px;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;pointer-events:none;animation:blob 14s ease-in-out infinite}
body::before{left:-120px;top:12%;background:#ffb37a}
body::after{right:-120px;top:52%;background:#9ed8b5;animation-delay:3s;animation-direction:reverse}
@keyframes blob{50%{transform:translateY(-46px) scale(1.12)}}
@keyframes fl{50%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.6)}40%{opacity:.85}100%{opacity:0;transform:translateY(-16px) scaleY(1.25)}}
@keyframes sheen{0%{transform:translateX(-70%) rotate(12deg)}55%,100%{transform:translateX(170%) rotate(12deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.06,.94) rotate(-3deg)}30%{transform:translateY(-16px) scale(.94,1.08) rotate(5deg)}50%{transform:translateY(-20px) scale(1,1) rotate(2deg)}68%{transform:translateY(-6px) scale(1.03,.97) rotate(-2deg)}}
@keyframes spark{0%,20%{opacity:0;transform:translateY(4px) scale(.4)}45%{opacity:1}70%,100%{opacity:0;transform:translateY(-16px) scale(1)}}
@keyframes fog{50%{transform:translateX(7%) translateY(-12px)}}
@keyframes bub{0%{transform:translateY(2px) scale(.6);opacity:0}40%{opacity:.9}100%{transform:translateY(-4px) scale(1.1);opacity:0}}
@keyframes sway{50%{transform:rotate(10deg) translateY(-1px)}}
@keyframes sway2{50%{transform:rotate(-9deg)}}
header{background:linear-gradient(135deg,#0b3d2c,#0e5c3f 55%,#127a52),radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:auto,18px 18px;color:#fff;padding:18px 18px 26px;border-radius:0 0 28px 28px;box-shadow:0 14px 40px rgba(11,61,44,.35),inset 0 1px 0 rgba(255,255,255,.15);position:relative;overflow:hidden;z-index:5}
header::after{content:'';position:absolute;top:-60%;left:-20%;width:50%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);transform:rotate(12deg);animation:sheen 7s ease-in-out infinite}
.hwrap{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.logo{width:46px;height:46px;border-radius:16px;background:conic-gradient(from 210deg,#f5b301,#ff5a1f,#f5b301);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;letter-spacing:.5px;box-shadow:0 8px 18px rgba(255,90,31,.45),inset 0 2px 4px rgba(255,255,255,.5);text-shadow:0 1px 2px rgba(0,0,0,.3);flex:none}
header b{display:block;color:#ffd77a;font-size:10px;letter-spacing:3.5px;font-weight:800}
header h1{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-.3px;text-shadow:0 3px 8px rgba(0,0,0,.35)}
header .s{color:rgba(255,255,255,.85)!important;font-size:11.5px;font-weight:600}
#v{padding:0 14px;margin-top:-18px;position:relative;z-index:1}
#v>.card:nth-child(2){animation-delay:.07s}#v>.card:nth-child(3){animation-delay:.14s}#v>.card:nth-child(4){animation-delay:.21s}
.card{background:linear-gradient(180deg,#fffdf9,#fff9f0);border:1px solid rgba(255,255,255,.9);border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;box-shadow:0 1px 2px rgba(28,25,23,.04),0 8px 20px rgba(28,25,23,.06),0 24px 48px rgba(14,92,63,.06);animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
.card h3{color:var(--g);font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--o),var(--gold));box-shadow:0 2px 6px rgba(255,90,31,.4);flex:none}
.s{font-size:12px;color:var(--muted);line-height:1.5}
.seg{display:flex;gap:6px;margin:6px 0;background:#f3ede2;padding:4px;border-radius:14px}
.seg button{flex:1;padding:10px 6px;border-radius:11px;border:0;background:transparent;font-weight:700;font-size:12.5px;color:var(--muted);transition:.2s}
.seg .on{background:#fff;color:var(--o);box-shadow:0 3px 10px rgba(28,25,23,.12),inset 0 0 0 1.5px var(--o)}
.btn{display:block;width:100%;margin-top:8px;padding:13px 16px;border:0;border-radius:14px;background:linear-gradient(180deg,#ff7a3d,#ff5a1f 60%,#f04e12);color:#fff;font-weight:800;font-size:14.5px;letter-spacing:.2px;box-shadow:0 5px 0 #c2410c,0 14px 26px rgba(255,90,31,.35),inset 0 1.5px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.35) 50%,transparent 58%);transform:translateX(-70%);transition:transform .5s}
.btn:hover::after{transform:translateX(70%)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c2410c,0 8px 16px rgba(255,90,31,.3)}
.btn.sm{width:auto;flex:none;padding:7px 12px;margin:0 0 0 6px;font-size:11px;border-radius:10px}
.btn.g{background:linear-gradient(180deg,#f0faf3,#dcf0e3);color:#166534;box-shadow:0 4px 0 #b7d4b7,0 10px 20px rgba(22,101,52,.15),inset 0 1.5px 0 #fff}
.btn.r{background:linear-gradient(180deg,#fef2f2,#fde3e3);color:#b91c1c;box-shadow:0 4px 0 #e5bcbc,0 10px 20px rgba(185,28,28,.12)}
.btn.b{background:linear-gradient(180deg,#60a5fa,#2563eb);color:#fff;box-shadow:0 4px 0 #1d4ed8,0 12px 22px rgba(37,99,235,.3)}
.btn.y{background:linear-gradient(180deg,#fff4d6,#ffe6a3);color:#8a5a00;box-shadow:0 4px 0 #d9a800,0 10px 20px rgba(217,168,0,.25),inset 0 1.5px 0 #fff}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;margin:5px 0;font-size:14px;font-weight:600;background:#fff;color:var(--ink);box-shadow:inset 0 2px 5px rgba(28,25,23,.05);transition:.2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 4px rgba(255,90,31,.14);background:#fffdf9}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed #e7dcc9}
.row:last-child{border-bottom:0}
.big{background:linear-gradient(135deg,#ff8a3d,#ff5a1f 55%,#e8480c);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 18px 36px rgba(255,90,31,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.big::before{content:'';position:absolute;inset:0;background:radial-gradient(400px 160px at 85% 0%,rgba(255,255,255,.25),transparent 60%)}
.big .n{font-size:44px;font-weight:800;letter-spacing:-1px;text-shadow:0 4px 12px rgba(0,0,0,.25)}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.gr div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 6px;text-align:center;font-size:10.5px;font-weight:700;backdrop-filter:blur(4px)}
.gr b{font-size:17px;display:block;font-weight:800}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pm div{background:#f6f0e4;border:1px solid #eee3cf;border-radius:14px;padding:10px 6px;text-align:center;font-size:10.5px;color:var(--muted);font-weight:700}
.pm b{font-size:17px;display:block;color:var(--o);font-weight:800}
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.86);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid rgba(255,255,255,.7);border-radius:22px;display:flex;padding:6px;box-shadow:0 16px 40px rgba(28,25,23,.18),inset 0 1px 0 #fff;z-index:100}
.nav div{flex:1;text-align:center;font-size:9.5px;font-weight:800;color:var(--muted);padding:6px 2px 5px;border-radius:16px;position:relative;transition:.2s}
.nav div.on{color:var(--o);background:linear-gradient(180deg,#fff1e6,#ffe3cd)}
.nav div.on::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--o);box-shadow:0 0 6px var(--o)}
.nimg{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 3px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.nav div.on .nimg{border-color:var(--o);transform:scale(1.06)}
a{color:var(--o);font-weight:700;font-size:12px;text-decoration:none}
.zban{position:relative;margin:0 -14px 14px;padding:18px 16px 20px;border-radius:0 0 30px 30px;background-size:cover;background-position:center;color:#fff;overflow:hidden;box-shadow:0 20px 44px rgba(11,61,44,.35);animation:rise .5s both}
.zban::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,40,28,.25),rgba(8,40,28,.55) 45%,rgba(8,40,28,.88))}
.zban::after{content:'';position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:rotate(12deg);animation:sheen 6s ease-in-out infinite}
.ztop{display:flex;justify-content:space-between;align-items:center;font-size:13px;position:relative;z-index:5}
.zban h2{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.12;margin:18px 0 14px;text-shadow:0 4px 14px rgba(0,0,0,.5);position:relative;z-index:5}
.zsearch{background:rgba(255,255,255,.96);color:#57534e;border-radius:16px;padding:13px 15px;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25),inset 0 -2px 0 rgba(0,0,0,.05);display:flex;gap:9px;align-items:center;position:relative;z-index:5;cursor:pointer;backdrop-filter:blur(6px)}
.zmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;font-size:10.5px;font-weight:800;position:relative;z-index:5}
.zmeta span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:6px 11px;border-radius:999px;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.rpill{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:9px;box-shadow:0 4px 10px rgba(22,163,74,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.zrest{background:#fffdf9;border:1px solid rgba(255,255,255,.9);border-radius:24px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 4px rgba(28,25,23,.04),0 14px 34px rgba(28,25,23,.10);animation:rise .5s .1s both}
.zrimg{height:132px;background-size:cover;background-position:center;position:relative}
.zrimg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(20,12,4,.62))}
.zpromo{position:absolute;left:0;bottom:0;z-index:2;background:linear-gradient(90deg,#0e5c3f,#127a52);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:7px 14px;border-radius:0 14px 0 0;box-shadow:0 6px 16px rgba(14,92,63,.4)}
.zrbody{padding:16px}
.vi{display:inline-block;width:15px;height:15px;border:2px solid #16a34a;border-radius:4px;position:relative;vertical-align:-3px;background:#fff}
.vi::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#16a34a}
.vi.nv{border-color:#dc2626}.vi.nv::after{background:#dc2626}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:11.5px;color:#57534e;display:flex;align-items:center;gap:6px;box-shadow:0 3px 8px rgba(28,25,23,.06);transition:.2s}
.chips2 button.on{background:linear-gradient(180deg,#ff7a3d,#ff5a1f);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(255,90,31,.35)}
.cimg{width:20px;height:20px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed #e9dfcd}
.it:last-child{border-bottom:0}
.in{flex:1;min-width:0;font-size:14px}
.in b{font-weight:700;font-size:13.5px}
.stp2{display:flex;align-items:center;gap:8px;border:1.5px solid #ffd9c2;border-radius:12px;padding:3px;flex:none;background:#fff7f0}
.stp2 button{width:30px;height:30px;border:0;border-radius:9px;background:#fff;color:var(--o);font-size:19px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.stp2 b{min-width:20px;text-align:center;color:var(--o);font-weight:800}
.cbar{position:sticky;bottom:96px;background:linear-gradient(135deg,#0e5c3f,#127a52);color:#fff;border-radius:18px;padding:13px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;z-index:6;box-shadow:0 16px 34px rgba(14,92,63,.4)}
.shc{background:linear-gradient(135deg,#0b3d2c,#127a52)!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;border-radius:22px!important;padding:18px!important;margin-bottom:14px!important;box-shadow:0 18px 38px rgba(11,61,44,.4)!important}
.shc h3{color:#fff!important}
.shc h3::before{background:linear-gradient(180deg,#ffd77a,#f5b301)}
.shc .s{color:#cdeadd!important}
.shc .row{border-bottom:1px dashed rgba(255,255,255,.18)!important}
.shc .pm div{background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.2)!important;color:#e7f6ee}
.shc .pm b{color:#fff!important}
.dcard{border-left:5px solid var(--o);border-radius:20px}
.pill{padding:4px 10px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.4px}
.pill.gf{background:#fff0e8;color:#c2410c}
.edbox{background:#fffaf0;border:1.5px dashed #e5c986;border-radius:16px;padding:12px;margin-bottom:10px}
.nut{display:inline-block;background:#eef7f0;color:#166534;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:8px;margin-left:4px}
.wafloat{position:fixed;right:14px;bottom:100px;z-index:99;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#25d366,#128c4a);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 12px 26px rgba(18,140,74,.45);border:2px solid rgba(255,255,255,.6);animation:fl 3s ease-in-out infinite}
.rimg{width:22px;height:22px;border-radius:7px;object-fit:cover;vertical-align:-6px;margin-right:6px;box-shadow:0 0 0 2px #fff,0 3px 6px rgba(0,0,0,.15)}
.iew{width:60px;flex:none;display:flex;align-items:center;justify-content:center}
.mrp{text-decoration:line-through;color:var(--muted);font-size:11px;margin-right:4px}
.price{color:var(--o);font-weight:800;font-size:13.5px}
#printArea{display:none}
@media print{body>*{display:none!important}#printArea{display:block!important}#printArea tr{page-break-inside:avoid}}
.dish3d{position:relative;width:56px;height:62px;pointer-events:none}
.dish3d.bigd{width:110px;height:116px}
.dish3d .gshadow{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:82%;height:12px;background:radial-gradient(ellipse at center,rgba(0,0,0,.28),transparent 70%);border-radius:50%;z-index:0}
.kadhai{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:52px;height:26px;z-index:0}
.bigd .kadhai{width:100px;height:48px}
.kadhai .bowl{position:absolute;inset:0;background:linear-gradient(180deg,#fdfdfd 0%,#d7dade 25%,#a7abb0 55%,#7c8085 80%,#5f6367 100%);border-radius:10px 10px 30px 30px/10px 10px 26px 26px;box-shadow:inset 0 6px 10px rgba(255,255,255,.7),inset 0 -8px 12px rgba(0,0,0,.35),0 10px 18px rgba(0,0,0,.35);z-index:2}

.bigd .kadhai .rim{top:-7px;height:14px}
.kadhai .hdl{position:absolute;top:0;width:14px;height:11px;border:4px solid #b9bdc2;border-bottom:0;border-radius:50% 50% 0 0/60% 60% 0 0;z-index:1;box-shadow:0 2px 3px rgba(0,0,0,.25)}
.kadhai .hdl.l{left:-12px;transform:rotate(-14deg)}
.kadhai .hdl.r{right:-12px;transform:rotate(14deg)}
.bigd .kadhai .hdl{width:22px;height:16px;border-width:5px;left:-18px}

.dish3d .steam{position:absolute;left:50%;top:-4px;width:6px;height:22px;border-radius:6px;background:linear-gradient(180deg,transparent,#ffffffc0);filter:blur(3px);opacity:0;animation:steam 2.6s ease-in-out infinite;z-index:4}

.bigd .steam{width:9px;height:34px;top:-8px}

.dish3d .spark.p1{left:24%;bottom:38%}
.dish3d .spark.p2{left:70%;bottom:50%;animation-delay:.3s}
.dish3d .spark.p3{left:48%;bottom:62%;animation-delay:.6s}

const hav=(a,b,c,d)=>{const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const s=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(s))};
const smartRoute=l=>{const o=parseLL(S.kll);const wc=[],nc=[];l.forEach(s=>{const ll=parseLL(s.map);if(ll)wc.push({s,ll});else nc.push(s)});let cur=o||(wc[0]?wc[0].ll:null),rem=wc.slice(),out=[],km=0;if(cur){while(rem.length){let bi=0,bd=1e9;rem.forEach((x,i)=>{const d=hav(cur[0],cur[1],x.ll[0],x.ll[1]);if(d<bd){bd=d;bi=i}});const p=rem.splice(bi,1)[0];km+=bd;cur=p.ll;out.push(p.s)}}else out=wc.map(x=>x.s);const seen={},grp=[];nc.forEach(s=>{const a=s.area||'Other';if(seen[a]==null){seen[a]=grp.length;grp.push([])}grp[seen[a]].push(s)});const tail=[];grp.forEach(g=>g.forEach(s=>tail.push(s)));return{list:out.concat(tail),km:Math.round(km*10)/10,clusters:grp.length+(out.length?1:0),coord:wc.length}};
const churnScore=s=>{if(!s.paid)return{score:0,reason:'unpaid',end:'',days:0};const k=iso(D0()),y=iso(add(D0(),-1));let sc=0,rs=[];if(s.skip&&(s.skip.includes(k)||s.skip.includes(y))){sc+=30;rs.push('recent skip')}const end=iso(add(new Date(s.start+'T12:00:00'),s.days-1));const d=Math.round((new Date(end+'T12:00:00')-D0())/86400000);if(d>=0&&d<=3){sc+=25;rs.push(d+' din mein expire')}if(!S.orders.some(o=>o.sid===s.id&&o.ts>Date.now()-7*86400000)){sc+=15;rs.push('7 din add-on nahi')}if(s.pause&&s.pause.includes(k)){sc+=20;rs.push('aaj paused')}return{score:Math.min(100,sc),reason:rs.join(' · ')||'stable',end,days:d}};

addCpn:()=>{if(!needOK())return;const code=($('#cpn2c')||{}).value||'';const pct=+($('#cpn2p')||{}).value;const tag=($('#cpn2t')||{}).value||'all';const cc=code.trim().toUpperCase().replace(/\s+/g,'');if(!cc||cc.length<3){alert('3+ letter code daalo');return}if(!(pct>=1&&pct<=90)){alert('Discount 1-90%');return}if(S.cpn2.find(x=>x.code===cc)){alert('Code already hai');return}S.cpn2.push({code:cc,pct:Math.round(pct),tag,t:Date.now(),exp:clamp(+($('#cpn2e')||{}).value||30,1,365)});logAdd('Smart coupon '+cc+' '+pct+'% '+tag);save();alert('Coupon bana: '+cc+' ('+tag+')')},
delCpn:(v,k,id)=>{if(!needOK())return;S.cpn2=S.cpn2.filter(c=>c.code!==id);if(S.cpnUsed)delete S.cpnUsed[id];logAdd('Coupon del '+id);save()},
smartR:()=>{SMART_R=1;render()},normR:()=>{SMART_R=0;render()},
prepPrint:()=>{if(!needOK())return;const p=prepData();$('#printArea').innerHTML='<div style="font-family:sans-serif;padding:20px"><h2 style="margin:0 0 4px">Namaste Udala · Prep Sheet</h2><p style="margin:0 0 12px;font-size:13px">'+p.date+' · '+p.total+' dabbe ('+p.veg+' veg / '+p.nv+' NV) · Roti '+p.roti+' · Chawal '+p.chawal+' plates'+(p.extra?' · +'+p.extra+' extra':'')+'</p><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px"><tr><th>#</th><th>Naam</th><th>Type</th><th>Lunch</th><th>Dinner</th><th style="width:70px">✔</th></tr>'+p.lines.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.n)+'</td><td>'+x.t+'</td><td>'+x.l+'</td><td>'+x.d+'</td><td></td></tr>').join('')+'</table></div>';window.print()},
churnWa:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const c=cpnFor(s.phone);const base='Namaste '+s.name+'! 🙏\n';const msg=c?base+'Aapke liye special coupon '+c.code+' ('+c.pct+'% off) ready hai. Plan continue/renew kijiye — ghar ka khana wait kar raha hai. 🍱':base+'Humein aapki yaad aati hai! Koi dikkat ho toh bataiye, turant adjust kar denge. 💚';wa(s.phone,msg)},
selfPause:()=>{if(!ME)return;const s=S.subs.find(x=>x.phone===ME.phone&&x.paid&&act(x,D0()));if(!s){alert('Koi active plan nahi');return}autoPause(s,7);logAdd('Self-pause '+s.name+' 7d');save();alert('✅ 7 din pause — days aage badh gaye')},
autoPause:(v,k,id)=>{if(!needOK())return;const s=S.subs.find(x=>x.id==id);if(!s)return;autoPause(s,7);logAdd('Auto-pause '+s.name+' 7d');save();alert('✅ '+s.name+' ko 7 din pause')},
digest:()=>{if(!needOK())return;S.digest=S.digest||{};S.digest.date=iso(D0());S.digest.at=Date.now();save();window.open('https://wa.me/?text='+encodeURIComponent(digestText()),'_blank')},
notifPerm:()=>{if(!('Notification' in window)){alert('Is browser mein notifications nahi');return}Notification.requestPermission().then(p=>alert(p==='granted'?'✅ Subah alert ON — jab app khula ho, digest notification milega':'Permission nahi mili'))},
printInv:(v,k,id)=>printInvoice(id),
setmenu:()=>{if(!needOK())return;const a=$('#mveg'),b=$('#mnv');const k=iso(add(D0(),1));S.mset=S.mset||{};S.mset[k]={veg:a?String(a.value).slice(0,60).trim():'',nv:b?String(b.value).slice(0,60).trim():''};logAdd('Menu set '+k);save();alert('Kal ka menu set ✅')},
login:()=>{const ne=$('#lname'),pe2=$('#lphone');const n=ne?ne.value.trim().slice(0,40):'';const p=pe2?cleanPh(pe2.value):'';if(!n||p.length<10){alert('Naam aur 10 digit phone daalo');return}ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();alert('Login ho gaya! 🙏')},
logout:()=>{ME=null;DET=null;saveME();render();alert('Logout ho gaya')},
cat:v=>{SCAT=v;render()},
goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
vo:()=>{VO=VO?0:1;render()},
utr:(v,k,id)=>{const el=$('#u'+id);const c=el?el.value.replace(/\s/g,'').slice(0,14):'';if(!/^\d{12}$/.test(c)){alert('12 digit UTR daalo');return}const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(!s)return;s.utr=c;S.orders.forEach(o=>{if(o.sid===s.id)o.utr=c})}else{const o=S.orders.find(x=>x.id==n);if(!o)return;o.utr=c}save();alert('UTR mil gaya ✓')},
badu:(v,k,id)=>{if(!needOK())return;const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(s){s.utr='';S.orders.forEach(o=>{if(o.sid===s.id)o.utr=''})}}else{const o=S.orders.find(x=>x.id==n);if(o)o.utr=''}save()},
paidS:(v,k,id)=>{if(!needOK())return;const s=S.subs.find(x=>x.id==id);if(!s)return;const lo=S.orders.filter(o=>o.sid===s.id&&!o.paid);const amt=s.price+lo.reduce((a,o)=>a+o.total,0);if(!confirm(s.name+': '+inr(amt)+' mil gaye?'))return;s.paid=1;lo.forEach(o=>{o.paid=1});S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:s.name,amt:amt,mode:s.pay,utr:s.utr||'',kind:'Plan'});award(s.phone,Math.round(amt/10));logAdd('Paid: '+s.name);save()},
paidO:(v,k,id)=>{if(!needOK())return;const o=S.orders.find(x=>x.id==id);if(!o)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:o.name,amt:o.total,mode:o.pay,utr:o.utr||'',kind:'Shop'});award(o.phone,Math.round(o.total/10));logAdd('Paid: '+o.name);save()},
remS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s)wa(s.phone,'Namaste '+s.name+'! 🙏\nAapka '+inr(due(s))+' pending hai.\nUPI: '+UPI)},
remO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o)wa(o.phone,'Namaste '+o.name+'! 🙏\nAapke order ka '+inr(o.total)+' pending hai.\nUPI: '+UPI)},
tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const dv=v==='delivery';const x=prompt(dv?'Delivery PIN daalo':'Owner PIN daalo');if(x===null)return;const ok=dv?(x===DPIN||x===OPIN):(x===OPIN);if(!ok){pinWrong();alert('Galat PIN');return}pinClear();OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}}if(v==='owner'){OVIEW='deliv';DET=null}tab=v;render()},
gps:()=>{if(!navigator.geolocation){alert('GPS nahi hai');return}navigator.geolocation.getCurrentPosition(p=>{F.map='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);render();alert('Location mil gayi ✓')},e=>alert('Location nahi mili. Phone ka Location ON karo.'),{enableHighAccuracy:true,timeout:15000})},
set:(v,k)=>{F[k]=v;render()},
join:()=>mk(0),trial:()=>mk(1),
inc:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)+1,0,4);render()}else{C[id]=clamp((C[id]||0)+1,0,99);render()}},
dec:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)-1,0,4);render()}else{C[id]=clamp((C[id]||0)-1,0,99);render()}},
order:()=>{if(need())return;const it=[];let total=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k,10));if(!p||q<1)return;const h=k.endsWith('h');const pp=h?Math.round(p.p*.6):p.p;const qq=clamp(q,1,99);it.push({n:p.n+(h?' (Half)':''),q:qq,p:pp});total+=pp*qq});if(!it.length){alert('Cart khali hai');return}S.orders.push({id:Date.now(),ts:Date.now(),name:String(F.name).slice(0,40),phone:cleanPh(F.phone),area:String(F.area||'Other').slice(0,40),addr:String(F.addr).slice(0,120),map:String(F.map).slice(0,200),items:it,total:total,pay:F.pay==='online'?'online':'cash',paid:0,dlv:0,t:new Date().toLocaleString()});MY.push('o'+S.orders[S.orders.length-1].id);saveMY();C={};save();alert('Order ho gaya: '+inr(total));if(F.pay==='online')location.href=upi(total)},
skip:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const d=iso(D0());const i=s.skip.indexOf(d);if(i>=0)s.skip.splice(i,1);else s.skip.push(d);save()},
done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save()},
odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.dlv=1;save()}},
addp:()=>{if(!needOK())return;const n=($('#pn')||{}).value||'';const p=+($('#pp')||{}).value;const c=($('#pc')||{}).value||'Other';const nn=n.trim().slice(0,40);if(!nn||!(p>0)||p>100000){alert('Sahi naam aur price daalo');return}S.prod.push({id:Date.now(),n:nn,p:Math.round(p),c:String(c).trim().slice(0,30),s:1,h:0,img:CIM[c]||IM.grocery,mrp:Math.round(p*1.2),brand:null,cal:0});logAdd('Product add: '+nn);save()},
stock:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s?0:1;save()}},
delp:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);logAdd('Product delete: '+p.n);save()}},
out:()=>{OK=0;DET=null;PED=null;IMPON=0;try{sessionStorage.removeItem('udok')}catch(e){}tab='plan';render()},
reset:()=>{if(!needOK())return;if(confirm('Sab data delete? Pakka?')){S={prod:SEED,subs:[],orders:[],done:{},pays:[],mset:{},kll:'',cred:{},refs:{},plog:[],log:[],pts:{},cpn2:[],cpnUsed:{},wx:null,digest:{}};logAdd('FULL RESET');save()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;e.preventDefault();try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){alert('Error: '+x.message)}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPh(F.phone);if(f==='extraRoti')F.extraRoti=clamp(+F.extraRoti||0,0,4)}if(e.target.id==='sq'){SQ=e.target.value;const el=$('#pl');if(el)el.innerHTML=shopList()}if(e.target.id==='dsel'){DSEL=e.target.value||iso(D0());render()}});
document.addEventListener('change',e=>{if(e.target.id==='xlf'){handleFile(e.target.files&&e.target.files[0]);e.target.value=''}});
function ologin(){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const x=prompt('Owner PIN daalo');if(x===null)return;if(x===OPIN){pinClear();OK=1;DET=null;try{sessionStorage.setItem('udok','1')}catch(e){}tab='owner';render()}else{pinWrong();alert('Galat PIN')}}
let hc=0;document.querySelector('header').addEventListener('click',()=>{hc++;if(hc>=5){hc=0;ologin()}});
/* ===== SMART LAYER 5: PWA + OFFLINE + INSTALL + DIGEST NOTIFICATION ===== */
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW off',e))})}
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_deferredPrompt=e;const b=$('#installBtn');if(b&&!localStorage.getItem('nu_install_dismissed'))b.hidden=false});
(()=>{const b=$('#installBtn');if(b)b.addEventListener('click',async()=>{if(!_deferredPrompt){alert('Browser install ready nahi. Menu → "Add to Home Screen" use karo.');return}_deferredPrompt.prompt();const r=await _deferredPrompt.userChoice;if(r&&r.outcome==='accepted'){b.hidden=true;localStorage.setItem('nu_install_dismissed','1')}_deferredPrompt=null})})();
window.addEventListener('appinstalled',()=>{const b=$('#installBtn');if(b)b.hidden=true;localStorage.setItem('nu_install_dismissed','1')});
const setOffline=()=>{const p=$('#offpill');if(p)p.hidden=navigator.onLine};
window.addEventListener('online',setOffline);window.addEventListener('offline',setOffline);setOffline();
const digestNotify=()=>{if(!OK||!digestDue())return;if(!('Notification' in window)||Notification.permission!=='granted')return;if(sessionStorage.getItem('nu_digest_notified')===iso(D0()))return;sessionStorage.setItem('nu_digest_notified',iso(D0()));try{new Notification('📬 Namaste Udala digest ready',{body:'Kal prep + aaj delivery + churn summary — Owner → 🧠 Smart se WhatsApp karo.',tag:'nu-digest'})}catch(e){}};
setInterval(digestNotify,60000);digestNotify();fetchWX();
render();
if(location.hash==='#owner')ologin();
if(location.hash==='#delivery'){tab='delivery';A.tab('delivery')}
</script></body></html>
