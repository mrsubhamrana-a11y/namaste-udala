<script>
// ===== CONFIG =====
const UPI='9583937047@jio';
const PL={veg:{7:749,15:1499,30:2899},nv:{7:949,15:1849,30:3599}};
const OPIN='4821', DPIN='7788';
const IM={thali:'',grocery:'🛒',kitchen:'🍳',scooter:'🛵',money:'💰',curry:'',roti:'🫓',chawal:'🍚',paneer:'',chicken:'🍗',egg:'🥚',doodh:'🥛',chai:'☕',dal:'',meetha:'🍮',clean:'🧹',care:'🧼'};

// ===== HELPERS =====
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const D0=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cleanPh=s=>String(s||'').replace(/\D/g,'').slice(-10);

// ===== SEED DATA =====
const SEED=[
{n:'Doodh 500 ml',p:30,c:'Doodh aur dairy',h:0,img:'🥛',mrp:34},
{n:'Dahi 400 g',p:40,c:'Doodh aur dairy',h:0,img:'',mrp:46},
{n:'Paneer 200 g',p:80,c:'Doodh aur dairy',h:0,img:'🧀',mrp:95},
{n:'Chai patti 250 g',p:130,c:'Chai aur nashta',h:0,img:'☕',mrp:150},
{n:'Bread',p:40,c:'Chai aur nashta',h:0,img:'🍞',mrp:45},
{n:'Ande (6)',p:72,c:'Chai aur nashta',h:0,img:'🥚',mrp:85},
{n:'Detergent 1 kg',p:130,c:'Ghar ki safai',h:0,img:'🧹',mrp:155},
{n:'Sabun',p:30,c:'Body care',h:0,img:'🧼',mrp:36},
{n:'Atta 1 kg',p:50,c:'Kirana',h:0,img:'🌾',mrp:58},
{n:'Chawal 1 kg',p:70,c:'Kirana',h:0,img:'🍚',mrp:82},
{n:'Dal 1 kg',p:150,c:'Kirana',h:0,img:'🫘',mrp:175},
{n:'Tel 1 L',p:150,c:'Kirana',h:0,img:'🫙',mrp:178},
{n:'Roti',p:5,c:'Extra khana',h:1,img:'🫓',mrp:6},
{n:'Chawal plate',p:20,c:'Extra khana',h:1,img:'',mrp:25},
{n:'Paneer sabzi',p:50,c:'Extra khana',h:1,img:'🧀',mrp:65},
{n:'Egg curry',p:40,c:'Extra khana',h:1,img:'🥚',mrp:50},
{n:'Chicken piece',p:60,c:'Extra khana',h:1,img:'🍗',mrp:75,nv:1}
].map((a,i)=>({id:i+1,...a,s:1,brand:null}));

// ===== STATE =====
let S={prod:SEED,subs:[],orders:[],done:{},pays:[],mset:{},kll:'',cred:{},refs:{},plog:[],log:[]};
try{const l=JSON.parse(localStorage.getItem('udala2'));if(l)S={...S,...l}}catch(e){}

const fix=()=>{
  S.prod=Array.isArray(S.prod)?S.prod:SEED;
  S.subs=Array.isArray(S.subs)?S.subs:[];
  S.orders=Array.isArray(S.orders)?S.orders:[];
  S.done=S.done||{};
  S.pays=Array.isArray(S.pays)?S.pays:[];
  S.mset=S.mset||{};
  S.cred=S.cred||{};
  S.refs=S.refs||{};
  S.plog=Array.isArray(S.plog)?S.plog:[];
  S.log=Array.isArray(S.log)?S.log:[];
};
fix();

let tab='plan',C={},OVIEW='deliv',DET=null,PED=null,DSEL=iso(D0()),CUST=0,KMEAL='subah',OK=0,SCAT='all',SQ='',VO=0;
const F={type:'veg',days:'30',half:'0',pay:'cash',name:'',phone:'',area:'',addr:'',map:'',ref:'',start:iso(add(D0(),1)),lunch:'chawal',dinner:'roti',extraRoti:0};
let ME=null;
try{ME=JSON.parse(localStorage.getItem('udme'))||null}catch(e){}
if(ME){F.name=ME.name;F.phone=ME.phone}

const save=()=>{
  try{localStorage.setItem('udala2',JSON.stringify(S))}catch(e){}
  render();
};
const saveME=()=>{try{localStorage.setItem('udme',JSON.stringify(ME))}catch(e){}};
const logAdd=m=>{S.log.push({d:iso(D0())+' '+new Date().toTimeString().slice(0,5),m:String(m).slice(0,80)});if(S.log.length>60)S.log=S.log.slice(-60)};
const bp=(ty,d)=>PL[ty][d]||Math.round(PL[ty][30]/30*(+d||30));
const pr=()=>{const dd=clamp(+F.days||30,1,365);let b=bp(F.type,dd);let x=0;if(F.lunch==='both')x+=10*dd;if(F.dinner==='both')x+=10*dd;x+=clamp(F.extraRoti||0,0,4)*5*dd;return +F.half?Math.round((b+x)*.6):(b+x)};
const upi=a=>'upi://pay?pa='+UPI+'&pn=Namaste%20Udala&cu=INR&am='+Math.round(a);
const wa=(ph,t)=>window.open('https://wa.me/91'+ph+'?text='+encodeURIComponent(t),'_blank');
const act=(s,dt)=>{const k=iso(dt);return k>=s.start&&k<=iso(add(new Date(s.start+'T12:00:00'),s.days-1))};
const vi=t=>'<span class="vi '+(t==='nv'?'nv':'')+'"></span>';
const seg=(k,o)=>'<div class="seg">'+o.map(a=>'<button class="'+(String(F[k])===String(a[0])?'on':'')+'" data-a="set" data-k="'+k+'" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
const codeOf=ph=>'NU'+(ph||'').slice(-4);
const credOf=ph=>(S.cred&&S.cred[ph])||0;
const refEnd=()=>S.refEnd||'2026-11-10';
const refActive=()=>iso(D0())<=refEnd();
const elig=d=>(+d===15||+d===30);
const needOK=()=>{if(!OK){alert('Pehle owner login karo (header par 5 tap)');return false}return true};

const mf=(d,t)=>{const k=iso(d);const o=(S.mset||{})[k];if(o){if(t==='nv'&&o.nv)return String(o.nv);if(t!=='nv'&&o.veg)return String(o.veg)}const w=d.getDay();if(t==='nv'){if(w===3)return'Fish curry';if(w===5)return'Egg curry';if(w===0)return'Chicken'}else{if(w===3)return'Paneer sabzi';if(w===5)return'Special thali + meetha';if(w===0)return'Mushroom curry'}return'Dal, sabzi'};

const due=s=>s.price+S.orders.filter(o=>o.sid===s.id&&!o.paid).reduce((a,o)=>a+o.total,0);
const prefOf=s=>(s.lunch==='both'?'L:Dono':s.lunch==='chawal'?'L:Chawal':'L:Roti')+' | '+(s.dinner==='both'?'D:Dono':s.dinner==='chawal'?'D:Chawal':'D:Roti')+(s.extraRoti>0?' +'+s.extraRoti+'R':'');

// ===== RENDER VIEWS =====
const V={
plan:()=>{
  const t=D0();let at=0;
  Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k,10));if(p&&q>0)at+=(k.endsWith('h')?Math.round(p.p*.6):p.p)*q});
  const hr=new Date().getHours();
  const greet=hr<12?'Suprabhat!':hr<17?'Namaste! 🙏':'Shubh Sandhya!';
  const mp=S.subs.find(s=>ME&&s.phone===ME.phone&&act(s,D0()));

  let html='<div class="zban"><div class="ztop"><div>📍 <b>Udala, Odisha</b></div><div>'+(ME?'<span style="font-weight:800"> '+esc(ME.name.split(' ')[0])+'</span>':'<button class="btn sm g" data-a="focuslogin" style="margin:0">Login</button>')+'</div></div><h2>'+greet+'<br>Ghar jaisa khana,<br>roz time pe</h2><div class="zmeta"><span class="rpill">4.5 ★</span><span>🛵 30-40 min</span><span>🆓 Free delivery</span><span>🎁 1 din trial</span>'+(refActive()?'<span>🪔 Refer ₹100</span>':'')+'</div></div>';

  // Status card
  if(ME){
    const used=mp?Math.max(1,Math.round((D0()-new Date(mp.start+'T12:00:00'))/86400000)):0;
    const left=mp?Math.max(0,mp.days-used):0;
    html+='<div class="card" style="border-left:4px solid var(--g)"><div style="display:flex;justify-content:space-between;align-items:center"><b>👤 '+esc(ME.name)+'</b><button class="btn sm r" data-a="logout" style="margin:0">Logout</button></div>'+(mp?'<div class="s" style="color:#166534;font-weight:700;margin-top:4px">✅ '+used+' din chua · '+left+' baaki · 🍱 '+mf(D0(),mp.type)+'</div>':'<div class="s" style="margin-top:4px">Koi active plan nahi</div>')+'<div class="s" style="margin-top:4px">🪔 Code <b style="color:var(--o)">'+codeOf(ME.phone)+'</b> · Credit ₹'+credOf(ME.phone)+'</div></div>';
  } else {
    html+='<div class="card" id="logcard"><div class="s" style="font-weight:700;margin-bottom:6px">👤 Login karo (optional)</div><div style="display:flex;gap:8px"><input id="lname" style="margin:0" maxlength="40" placeholder="Naam"><input id="lphone" style="margin:0" type="tel" maxlength="10" placeholder="Phone"><button class="btn sm g" data-a="login" style="margin:0;flex:none">Login</button></div></div>';
  }

  // Plan form
  const crNow=credOf(F.phone);
  const disc=(elig(F.days)&&crNow>0)?Math.min(crNow,pr()):0;

  html+='<div class="zrest"><div class="zrimg"><span class="zpromo"> ₹100 OFF on refer · 🎁 1 din free trial</span></div><div class="zrbody"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">Namaste Udala Tiffin</b><span class="rpill">4.5 ★</span></div><div class="s" style="margin:4px 0">Veg · Non-veg | Subah-Lunch-Dinner</div><div class="s" style="margin:6px 0;font-weight:700;color:var(--g)">🍽️ Aaj: '+mf(t,F.type)+'</div>';
  html+='<div class="s">Khana</div>'+seg('type',[['veg','🟢 Veg'],['nv','🔴 Non-veg']]);
  html+='<div class="s">Kitne din</div>'+seg('days',[[7,'7 din'],[15,'15 din'],[30,'30 din']]);
  html+='<div class="s">Naam & phone</div><input data-f="name" maxlength="40" placeholder="Naam" value="'+esc(F.name)+'"><input data-f="phone" type="tel" maxlength="10" placeholder="Phone" value="'+esc(F.phone)+'">';
  html+='<button class="btn g" data-a="gps">📍 GPS location lo</button>';
  html+='<button class="btn g" data-a="cust">'+(CUST?'▲ Customize band karo':'▼ Customize (address/lunch/dinner)')+'</button>';

  if(CUST){
    html+='<div class="s" style="margin-top:8px">Area + address</div><input data-f="area" maxlength="40" placeholder="Area" value="'+esc(F.area)+'"><input data-f="addr" maxlength="120" placeholder="Pura address" value="'+esc(F.addr)+'">';
    html+='<div class="s">Lunch mein</div>'+seg('lunch',[['roti','🫓 Roti'],['chawal','🍚 Chawal'],['both',' Dono +₹10']]);
    html+='<div class="s">Dinner mein</div>'+seg('dinner',[['roti',' Roti'],['chawal','🍚 Chawal'],['both','🍱 Dono +₹10']]);
    html+='<div class="s" style="margin-top:6px">Extra roti (5/din)</div><div class="stp2" style="width:fit-content"><button data-a="dec" data-id="extraRoti">−</button><b>'+clamp(F.extraRoti||0,0,4)+'</b><button data-a="inc" data-id="extraRoti">+</button></div>';
    html+='<div class="s" style="margin-top:6px">Start date</div><input type="date" data-f="start" value="'+F.start+'">';
    html+='<div class="s">Payment</div>'+seg('pay',[['cash','💵 Cash'],['online','📲 UPI']]);
    if(refActive())html+='<div class="s">Friend ka refer code</div><input data-f="ref" maxlength="10" placeholder="Jaise NU3047" value="'+esc(F.ref)+'">';
  }

  html+='<div class="row" style="margin-top:8px"><span>Plan + add-on</span><b>'+inr(pr()+at)+'</b></div>';
  if(disc>0)html+='<div class="row"><span>🪔 Refer credit</span><b style="color:#1f7a3f">−'+inr(disc)+'</b></div>';
  html+='<div class="row"><span>🛵 Delivery</span><b style="color:#1f7a3f">FREE</b></div>';
  html+='<div class="row"><b>Total</b><b style="font-size:24px">'+inr(pr()+at-disc)+'</b></div>';
  html+='<button class="btn" data-a="join">✅ Plan shuru karo</button>';
  html+='<button class="btn g" data-a="trial">🎁 1 din FREE trial</button></div></div>';

  return html;
},

shop:()=>{
  let tot=0,cnt=0;const ln=[];
  Object.entries(C).forEach(([k,n])=>{
    const p=S.prod.find(x=>x.id===parseInt(k,10));
    if(p&&n>0){const h=k.endsWith('h');const pp=h?Math.round(p.p*.6):p.p;tot+=pp*n;cnt+=n;ln.push('<div class="row"><span>'+esc(p.n)+(h?' (Half)':'')+' × '+n+'</span><b>'+inr(pp*n)+'</b></div>')}
  });
  const cats=[...new Set(S.prod.filter(p=>p.s).map(p=>p.c))];
  if(SCAT!=='all'&&!cats.includes(SCAT))SCAT='all';

  let html='<div class="hero"><h2>Ghar ka saaman</h2><p>Khana, doodh, kirana — sab yahan</p></div>';

    const cq=C[p.id]||0;
    const ctl=cq?('<div class="stp2"><button data-a="dec" data-id="'+p.id+'">−</button><b>'+cq+'</b><button data-a="inc" data-id="'+p.id+'">+</button></div>'):('<button class="btn sm" data-a="inc" data-id="'+p.id+'">ADD +</button>');

  }).join('')+'</div>').join('')||'<div class="card">Kuch nahi mila 🔍</div>';

  // Cart bar
  if(cnt)html+='<div class="cbar"><span> '+cnt+' item · <b>'+inr(tot)+'</b></span><button class="btn sm g" data-a="goc">Checkout ↓</button></div>';

  // Checkout
  html+='<div class="card" id="co"><h3>📦 Cart aur delivery</h3>'+(ln.join('')||'<div class="s">Cart khali hai</div>');
  html+='<div class="row"><b>Total</b><b style="font-size:22px">'+inr(tot)+'</b></div>';
  html+='<input data-f="name" maxlength="40" placeholder="Naam" value="'+esc(F.name)+'"><input data-f="phone" type="tel" maxlength="10" placeholder="Phone" value="'+esc(F.phone)+'"><input data-f="addr" maxlength="120" placeholder="Address" value="'+esc(F.addr)+'">';
  html+='<button class="btn g" data-a="gps">📍 GPS location lo</button>';
  html+='<div class="s">Payment</div>'+seg('pay',[['cash','Cash'],['online','Online UPI']]);
  html+='<button class="btn" data-a="order">Order karo 🚀</button>';
  if(cnt)html+='<button class="btn r" data-a="clearCart" style="margin-top:8px">️ Clear Cart</button>';
  html+='</div>';
  return html;
},

kitchen:()=>{
  const t=D0(),k=iso(t);
  const all=S.subs.filter(s=>act(s,t));
  const on=all.filter(s=>!s.skip.includes(k));
  const vegC=on.filter(s=>s.type==='veg').length,nvC=on.filter(s=>s.type==='nv').length;
  const exR=on.reduce((a,s)=>a+(s.extraRoti||0),0);
  const cntL=m=>on.filter(s=>(s.lunch||'chawal')===m).length;
  const cntD=m=>on.filter(s=>(s.dinner||'roti')===m).length;
  const mealTxt=m=>m==='chawal'?'🍚 Chawal':m==='both'?'🫓 Roti x4 + 🍚 Chawal':'🫓 Roti x4';
  const curry=s=>s.type==='nv'?'🍗 NV curry':' Veg sabzi';

  let agg='',lines=[];
  if(KMEAL==='subah'){agg='<div class="pm"><div><b>'+on.length+'</b><span class="s">Chai</span></div><div><b>'+on.length+'</b><span class="s">Nashta</span></div><div><b>'+on.length+'</b><span class="s">Dabbe</span></div></div>';lines=on.map(s=>({s:s,l:'🌅 Chai + nashta'}))}
  else if(KMEAL==='lunch'){const rp=(cntL('roti')+cntL('both'))*4;const cp=cntL('chawal')+cntL('both');agg='<div class="pm"><div><b>'+rp+'</b><span class="s">Roti pcs</span></div><div><b>'+cp+'</b><span class="s">Chawal plate</span></div><div><b>'+vegC+'/'+nvC+'</b><span class="s">Veg/NV curry</span></div></div>';lines=on.map(s=>({s:s,l:mealTxt(s.lunch||'chawal')+' + '+curry(s)}))}
  else if(KMEAL==='dinner'){const rp=(cntD('roti')+cntD('both'))*4+exR;const cp=cntD('chawal')+cntD('both');agg='<div class="pm"><div><b>'+rp+'</b><span class="s">Roti pcs (+'+exR+' extra)</span></div><div><b>'+cp+'</b><span class="s">Chawal plate</span></div><div><b>'+vegC+'/'+nvC+'</b><span class="s">Veg/NV curry</span></div></div>';lines=on.map(s=>({s:s,l:mealTxt(s.dinner||'roti')+' + '+curry(s)+(s.extraRoti?' + 🫓'+s.extraRoti:'')}))}
  else{agg='<div class="pm"><div><b>'+vegC+'</b><span class="s">Veg</span></div><div><b>'+nvC+'</b><span class="s">NV</span></div><div><b>'+exR+'</b><span class="s">Extra roti</span></div></div>';lines=on.map(s=>({s:s,l:' Full dabba'}))}

  let html='<div style="height:14px"></div><div class="big"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="s" style="color:#fff">AAJ · '+({subah:'SUBAH 7:30',lunch:'LUNCH 1:30',dinner:'DINNER 8:00',all:'FULL DABBA'})[KMEAL]+'</div><div class="n">'+on.length+'</div><div class="s" style="color:#fff">🟢 '+vegC+' ·  '+nvC+' · 🫓 +'+exR+'</div></div><div style="font-size:60px">🥘</div></div></div>';
  html+='<div class="card"><h3>🍳 Cooking count</h3><div class="chips2">'+[['subah','🌅 Subah'],['lunch','☀️ Lunch'],['dinner','🌙 Dinner'],['all','📦 Full']].map(a=>'<button class="'+(KMEAL===a[0]?'on':'')+'" data-a="kmeal" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>'+agg+'<button class="btn g" data-a="copyKitchen" style="margin-top:12px"> WhatsApp Summary Copy</button></div>';
  html+='<div class="card"><h3>👥 Kis ko kya ('+on.length+')</h3>'+(lines.map(x=>'<div class="row" style="align-items:flex-start"><div style="flex:1"><b>'+esc(x.s.name)+'</b> <span class="s">'+(x.s.type==='veg'?'🟢':'')+(x.s.half?' Half':'')+'</span><div class="s" style="color:var(--g);font-weight:700;margin-top:2px">'+x.l+'</div></div><button class="btn sm '+(x.s.skip.includes(k)?'g':'r')+'" data-a="skip" data-id="'+x.s.id+'">'+(x.s.skip.includes(k)?'Wapas':'Skip')+'</button></div>').join('')||'<div class="s">Koi nahi</div>')+'</div>';
  return html;
},

  if(ords.length){html+='<div class="card"><h3>🛒 Shop Orders ('+ords.length+')</h3>'+ords.map((o,i)=>'<div class="row"><div><b>'+esc(o.name)+'</b><div class="s">'+o.items.length+' items · '+inr(o.total)+'</div></div><button class="btn sm g" data-a="odone" data-id="'+o.id+'">Diya</button></div>').join('')+'</div>'}
  if(doneL.length){html+='<div class="card"><h3>✅ Ho gaya ('+doneL.length+')</h3>'+doneL.map(s=>'<div class="row"><div><b>'+esc(s.name)+'</b><div class="s">'+esc(s.area)+'</div></div><span style="color:#06d6a0;font-size:18px">✓</span></div>').join('')+'</div>'}

owner:()=>{
  if(!OK)return '<div class="card"><h3>🔒 Owner Login</h3><div class="s">Header par 5 baar tap karo</div></div>';
  if(DET){
    const s=S.subs.find(x=>x.id==DET.id);
    if(s){
      const used=Math.max(1,Math.round((D0()-new Date(s.start+'T12:00:00'))/86400000));
      const left=Math.max(0,s.days-used);
      const on=act(s,D0());
      let h='<button class="btn g" data-a="detback" style="margin-bottom:12px">← Wapas</button>';
      h+='<div class="card"><b style="font-size:18px">'+esc(s.name)+'</b><div class="s">'+esc(s.phone)+' · '+esc(s.area)+'</div><span class="pill" style="background:'+(on?'#e3f4e8':'#fdeeee')+';color:'+(on?'#1f7a3f':'#c92a2a')+'">'+(on?'ACTIVE':'EXPIRED')+'</span>';
      h+='<div class="row"><div>🍱 Plan</div><div class="s">'+s.days+' din · '+(s.type==='veg'?'Veg':'Non-veg')+' · '+(s.half?'Half':'Full')+'</div></div>';
      h+='<div class="row"><div>📅 Status</div><div class="s">'+used+' din chua · '+left+' baaki</div></div>';
      h+='<div class="row"><div>📝 Selection</div><div class="s" style="color:var(--o);font-weight:700">'+prefOf(s)+'</div></div>';
      h+='<div class="row"><div>💰 Price</div><b>'+inr(s.price)+'</b></div>';
      h+='<div class="row"><div><b>Total due</b></div><b style="font-size:20px;color:#c92a2a">'+inr(due(s))+'</b></div>';
      h+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a class="btn b" style="flex:1;margin:0;text-align:center;text-decoration:none" href="tel:+91'+esc(s.phone)+'">📞 Call</a><button class="btn g" style="flex:1;margin:0" data-a="remS" data-id="'+s.id+'">💬 Remind</button><button class="btn" style="flex:1;margin:0" data-a="paidS" data-id="'+s.id+'">Paid ✓</button><button class="btn sm r" style="flex:1;margin:0" data-a="pause" data-id="'+s.id+'">⏸ Pause</button></div></div>';
      return h;
    }
    return '<div class="card">Not found</div>';
  }

  const t=D0(),td=iso(D0()),P=S.pays||[];
  const actS=S.subs.filter(s=>act(s,D0()));
  const todayDel=actS.filter(s=>!s.skip.includes(td));
  const doneN=todayDel.filter(s=>S.done[td+'_'+s.id]).length;
  const todayEarn=P.filter(p=>p.d===td).reduce((a,p)=>a+p.amt,0);
  const totalEarn=P.reduce((a,p)=>a+p.amt,0);
  const pendAmt=S.subs.filter(s=>!s.paid).reduce((a,s)=>a+due(s),0)+S.orders.filter(o=>!o.paid).reduce((a,o)=>a+o.total,0);

  let html='<div style="height:14px"></div>';
  html+='<div class="card" style="background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff"><h3 style="color:#fff">📊 Dashboard</h3><div class="gr"><div><b>'+inr(todayEarn)+'</b><span class="s" style="color:#dbe9e1">💰 Aaj</span></div><div><b>'+actS.length+'</b><span class="s" style="color:#dbe9e1">📦 Plans</span></div><div><b style="color:#ffbe0b">'+inr(pendAmt)+'</b><span class="s" style="color:#ffbe0b"> Pending</span></div><div><b style="color:#7ef0c0">'+doneN+'/'+todayDel.length+'</b><span class="s" style="color:#7ef0c0">🛵 Delivered</span></div></div></div>';

  // Ledger tabs
  html+='<div class="card"><h3>📒 Ledger</h3><div class="chips2">'+[['deliv',' Aaj'],['plan','🍱 Plan'],['shop','🛒 Shop'],['pay','💰 Payment'],['kitch','🧑 Kitchen'],['set','️ Set']].map(a=>'<button class="'+(OVIEW===a[0]?'on':'')+'" data-a="oview" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';

  if(OVIEW==='deliv'){
    html+=todayDel.map(s=>{const d=S.done[td+'_'+s.id];return '<div class="row"><div><b>'+esc(s.name)+'</b> · '+esc(s.phone)+'<div class="s">'+esc(s.area)+'</div></div><button class="btn sm '+(d?'g':'')+'" data-a="done" data-id="'+s.id+'">'+(d?'✓':'Diya?')+'</button></div>'}).join('')||'<div class="s">Koi delivery nahi</div>';
  } else if(OVIEW==='plan'){
    html+=S.subs.slice().reverse().map(s=>'<div class="row" style="cursor:pointer" data-a="det" data-v="plan" data-id="'+s.id+'"><div><b>'+esc(s.name)+'</b> · '+esc(s.phone)+'<div class="s">'+s.days+' din · '+(s.type==='veg'?'Veg':'NV')+'</div></div><div style="text-align:right"><b>'+inr(s.price)+'</b><div class="s">'+(s.paid?'✅':'⏳')+'</div></div></div>').join('')||'<div class="s">Koi plan nahi</div>';
  } else if(OVIEW==='shop'){
    html+=S.orders.slice().reverse().map(o=>'<div class="row"><div><b>'+esc(o.name)+'</b><div class="s">'+o.items.map(i=>esc(i.n)+' x'+i.q).join(', ')+'</div></div><div style="text-align:right"><b>'+inr(o.total)+'</b><div class="s">'+(o.paid?'✅':'⏳')+' '+(o.dlv?'🟢':'')+'</div></div></div>').join('')||'<div class="s">Koi order nahi</div>';
  } else if(OVIEW==='pay'){
    html+='<div class="row"><span>💰 Total</span><b>'+inr(totalEarn)+'</b></div>';
    html+=P.slice().reverse().map(p=>'<div class="row"><div><b>'+esc(p.name)+'</b><div class="s">'+esc(p.d)+' · '+(p.mode==='online'?'UPI':'Cash')+'</div></div><b>'+inr(p.amt)+'</b></div>').join('')||'<div class="s">Koi payment nahi</div>';
  } else if(OVIEW==='kitch'){
    html+=todayDel.map(s=>'<div class="row"><div><b>'+esc(s.name)+'</b><div class="s" style="color:var(--g);font-weight:700">📦 '+(s.type==='veg'?'Veg':'NV')+' · '+(s.half?'Half':'Full')+'</div></div></div>').join('')||'<div class="s">Kuch nahi</div>';
  } else if(OVIEW==='set'){
    html+='<div class="s">Kal ka menu:</div><input id="mveg" maxlength="60" placeholder="Veg menu" value="'+esc(mf(add(D0(),1),'veg'))+'"><input id="mnv" maxlength="60" placeholder="Non-veg menu" value="'+esc(mf(add(D0(),1),'nv'))+'"><button class="btn sm" data-a="setmenu">💾 Menu save</button>';
    html+='<div class="edbox" style="margin-top:12px"><div class="s" style="font-weight:800">🔒 Security</div><div class="s">Naya Owner PIN (Default: 4821)</div><input id="newopin" maxlength="4" placeholder="Naya 4 digit PIN" type="password"><button class="btn sm g" data-a="chopin" style="margin-top:6px">PIN Badlo</button></div>';
    if(S.log&&S.log.length)html+='<div class="s" style="font-weight:800;margin-top:10px"> Log:</div>'+S.log.slice(-6).reverse().map(x=>'<div class="s">'+esc(x.d)+' · '+esc(x.m)+'</div>').join('');
  }
  html+='</div>';

  // Products
  const ep=PED?S.prod.find(p=>p.id==PED):null;
  html+='<div class="card"><h3>🛍 Products</h3>';
  if(ep){html+='<div class="edbox"><div class="s" style="font-weight:800">✏️ Edit: '+esc(ep.n)+'</div><input id="epn" maxlength="40" value="'+esc(ep.n)+'"><input id="epp" type="number" min="1" value="'+ep.p+'"><input id="epc" maxlength="30" value="'+esc(ep.c)+'"><div style="display:flex;gap:8px"><button class="btn sm g" data-a="savep">💾 Save</button><button class="btn sm r" data-a="editp">✕ Cancel</button></div></div>'}
  html+='<input id="pn" maxlength="40" placeholder="Naam"><input id="pp" type="number" min="1" placeholder="Price"><input id="pc" maxlength="30" placeholder="Category"><button class="btn" data-a="addp">Product jodo</button>';
  html+=S.prod.map(p=>'<div class="row"><div style="display:flex;align-items:center;gap:8px"><div class="iew">'+(p.img||'🍛')+'</div><div>'+esc(p.n)+'<div class="s">'+(p.mrp?'<span class="mrp">MRP ₹'+p.mrp+'</span>':'')+'<span class="price">'+inr(p.p)+'</span></div></div></div><div><button class="btn sm" data-a="editp" data-id="'+p.id+'">✏️</button><button class="btn sm '+(p.s?'g':'r')+'" data-a="stock" data-id="'+p.id+'">'+(p.s?'Stock':'X')+'</button><button class="btn sm r" data-a="delp" data-id="'+p.id+'">✕</button></div></div>').join('');
  html+='</div>';

  html+='<button class="btn" data-a="out">Owner se bahar</button>';
  html+='<button class="btn r" data-a="reset">⚠️ Reset All Data</button>';
  return html;
}
};

// ===== ACTIONS =====
const A={
  oview:v=>{OVIEW=v;DET=null;render()},
  det:(v,k,id)=>{DET={t:v,id:id};render();window.scrollTo(0,0)},
  detback:()=>{DET=null;render()},
  kmeal:v=>{KMEAL=v;render()},
  cust:()=>{CUST=CUST?0:1;render()},
  focuslogin:()=>{const e=$('#logcard');if(e)e.scrollIntoView({behavior:'smooth'});const i=$('#lname');if(i)setTimeout(()=>i.focus(),400)},
  editp:(v,k,id)=>{if(!needOK())return;PED=id||null;render()},
  savep:()=>{if(!needOK())return;const ep=S.prod.find(p=>p.id==PED);if(!ep){PED=null;render();return}
    const n=($('#epn')||{}).value||'';const p=+($('#epp')||{}).value;const c=($('#epc')||{}).value||'Other';
    if(!n.trim()){alert('Naam daalo');return}if(!(p>0)){alert('Sahi price daalo');return}
    ep.n=n.trim().slice(0,40);ep.p=Math.round(p);ep.c=c.trim().slice(0,30);
    PED=null;save();alert('Product update ✅')},
  setmenu:()=>{if(!needOK())return;const a=$('#mveg'),b=$('#mnv');const k=iso(add(D0(),1));S.mset[k]={veg:a?String(a.value).slice(0,60).trim():'',nv:b?String(b.value).slice(0,60).trim():''};logAdd('Menu set '+k);save();alert('Kal ka menu set ✅')},
  login:()=>{const ne=$('#lname'),pe2=$('#lphone');const n=ne?ne.value.trim().slice(0,40):'';const p=pe2?cleanPh(pe2.value):'';if(!n||p.length<10){alert('Naam aur 10 digit phone daalo');return}ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();alert('Login ho gaya! 🙏')},
  logout:()=>{ME=null;DET=null;saveME();render();alert('Logout ho gaya')},
  cat:v=>{SCAT=v;render()},
  goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
  vo:()=>{VO=VO?0:1;render()},
  paidS:(v,k,id)=>{if(!needOK())return;const s=S.subs.find(x=>x.id==id);if(!s)return;if(!confirm(s.name+': '+inr(due(s))+' mil gaye?'))return;s.paid=1;S.pays.push({id:Date.now(),d:iso(D0()),name:s.name,amt:due(s),mode:s.pay,kind:'Plan'});logAdd('Paid: '+s.name);save()},
  paidO:(v,k,id)=>{if(!needOK())return;const o=S.orders.find(x=>x.id==id);if(!o)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;S.pays.push({id:Date.now(),d:iso(D0()),name:o.name,amt:o.total,mode:o.pay,kind:'Shop'});logAdd('Paid: '+o.name);save()},
  remS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s)wa(s.phone,'Namaste '+s.name+'! Aapka '+inr(due(s))+' pending hai. UPI: '+UPI)},
  tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const x=prompt(v==='delivery'?'Delivery PIN daalo':'Owner PIN daalo');if(x===null)return;const ok=v==='delivery'?(x===DPIN||x===OPIN):(x===OPIN);if(!ok){alert('Galat PIN');return}OK=1}if(v==='owner'){OVIEW='deliv';DET=null}tab=v;render()},
  gps:()=>{if(!navigator.geolocation){alert('GPS nahi hai');return}navigator.geolocation.getCurrentPosition(p=>{F.map='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);render();alert('Location mil gayi ✓')},e=>alert('Location nahi mili. Phone ka Location ON karo.'),{enableHighAccuracy:true,timeout:15000})},
  set:(v,k)=>{F[k]=v;render()},
  join:()=>mk(0),
  trial:()=>mk(1),
  inc:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)+1,0,4);render()}else{C[id]=clamp((C[id]||0)+1,0,99);render()}},
  dec:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)-1,0,4);render()}else{C[id]=clamp((C[id]||0)-1,0,99);render()}},
  order:()=>{if(!F.name||!F.phone){alert('Naam aur phone daalo');return}const it=[];let total=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k,10));if(!p||q<1)return;const h=k.endsWith('h');const pp=h?Math.round(p.p*.6):p.p;it.push({n:p.n+(h?' (Half)':''),q:clamp(q,1,99),p:pp});total+=pp*q});if(!it.length){alert('Cart khali hai');return}S.orders.push({id:Date.now(),ts:Date.now(),name:String(F.name).slice(0,40),phone:cleanPh(F.phone),area:String(F.area||'Other').slice(0,40),addr:String(F.addr).slice(0,120),map:String(F.map).slice(0,200),items:it,total:total,pay:F.pay==='online'?'online':'cash',paid:0,dlv:0,t:new Date().toLocaleString()});C={};save();alert('Order ho gaya: '+inr(total));if(F.pay==='online')location.href=upi(total)},
  clearCart:()=>{C={};render();alert('Cart saaf ho gaya')},
  skip:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const d=iso(D0());const i=s.skip.indexOf(d);if(i>=0)s.skip.splice(i,1);else s.skip.push(d);save()},
  pause:(v,k,id)=>{if(!needOK())return;const s=S.subs.find(x=>x.id==id);if(!s)return;const d=iso(D0());if(!s.skip.includes(d)){s.skip.push(d);save();alert(s.name+' ka aaj ka meal skip ✅')}else{alert('Pehle se skip hai')}},
  done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save()},
  odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.dlv=1;save()}},
  addp:()=>{if(!needOK())return;const n=($('#pn')||{}).value||'';const p=+($('#pp')||{}).value;const c=($('#pc')||{}).value||'Other';if(!n.trim()||!(p>0)){alert('Sahi naam aur price daalo');return}S.prod.push({id:Date.now(),n:n.trim().slice(0,40),p:Math.round(p),c:String(c).trim().slice(0,30),s:1,h:0,img:'🍛',mrp:Math.round(p*1.2),brand:null});logAdd('Product add: '+n);save()},
  stock:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s?0:1;save()}},
  delp:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);logAdd('Product delete: '+p.n);save()}},
  out:()=>{OK=0;DET=null;PED=null;tab='plan';render()},
  reset:()=>{if(!needOK())return;if(confirm('Sab data delete? Pakka?')){S={prod:SEED,subs:[],orders:[],done:{},pays:[],mset:{},kll:'',cred:{},refs:{},plog:[],log:[]};logAdd('FULL RESET');save()}},
  chopin:()=>{if(!needOK())return;const el=$('#newopin');if(el&&el.value.length===4&&/^\d{4}$/.test(el.value)){localStorage.setItem('ud_opin',el.value);alert('Owner PIN badal gaya: '+el.value);el.value=''}else{alert('Sahi 4 digit PIN daalo')}},
  copyKitchen:()=>{
    const t=D0(),k=iso(t);const on=S.subs.filter(s=>act(s,t)&&!s.skip.includes(k));
    const vegC=on.filter(s=>s.type==='veg').length,nvC=on.filter(s=>s.type==='nv').length;
    const exR=on.reduce((a,s)=>a+(s.extraRoti||0),0);
    const cntL=m=>on.filter(s=>(s.lunch||'chawal')===m).length;
    const cntD=m=>on.filter(s=>(s.dinner||'roti')===m).length;
    const rp=(cntL('roti')+cntL('both'))*4+(cntD('roti')+cntD('both'))*4+exR;
    const cp=cntL('chawal')+cntL('both')+cntD('chawal')+cntD('both');
    const txt=' Namaste Udala - Aaj Ka Kitchen\n📅 '+k+'\n👥 Total: '+on.length+'\n🟢 Veg: '+vegC+' | 🔴 NV: '+nvC+'\n🫓 Roti: '+rp+' pcs\n🍚 Chawal: '+cp+' plates\n Extra: '+exR;
    navigator.clipboard.writeText(txt).then(()=>alert('Copy ho gayi! WhatsApp mein paste karo.')).catch(()=>alert('Copy nahi hui'));
  }
};

function mk(tr){
  if(!F.name||!F.phone){alert('Naam aur phone daalo');return}
  const s={id:Date.now(),ts:Date.now(),name:String(F.name).slice(0,40),phone:cleanPh(F.phone),area:String(F.area||'Other').slice(0,40),addr:String(F.addr).slice(0,120),map:String(F.map).slice(0,200),type:F.type==='nv'?'nv':'veg',days:tr?1:clamp(+F.days||30,1,365),half:+F.half?1:0,start:F.start||iso(add(D0(),1)),price:0,pay:F.pay==='online'?'online':'cash',paid:tr?1:0,skip:[],trial:tr?1:0,lunch:F.lunch,dinner:F.dinner,extraRoti:clamp(F.extraRoti||0,0,4),ref:''};
  let disc=0;
  if(!tr&&elig(s.days)){const cred=credOf(s.phone);disc=Math.min(cred,pr());if(disc>0){S.cred[s.phone]=cred-disc}}
  s.price=tr?0:(pr()-disc);
  S.subs.push(s);
  const rc=(F.ref||'').trim().toUpperCase();
  if(!tr&&refActive()&&elig(s.days)&&rc){const refSub=S.subs.find(x=>codeOf(x.phone)===rc&&x.phone!==s.phone);if(refSub){S.refs[refSub.phone]=S.refs[refSub.phone]||[];if(!S.refs[refSub.phone].some(e=>e.p===s.phone)){S.refs[refSub.phone].push({p:s.phone,n:s.name,d:iso(D0()),amt:100});S.cred[refSub.phone]=(S.cred[refSub.phone]||0)+100;s.ref=rc}}}
  saveME();save();
  alert(tr?'1 din free trial shuru!':'Plan ban gaya: '+inr(s.price)+(disc>0?' (₹'+disc+' credit kata)':''));
  if(!tr&&F.pay==='online')location.href=upi(s.price);
}

// ===== RENDER =====
function render(){
  if(!OK&&tab!=='plan'&&tab!=='shop')tab='plan';
  let html='';
  try{html=V[tab]()}catch(e){html='<div class="card"><h3>⚠️ Error</h3><div class="s">'+esc(e.message)+'</div><button class="btn g" onclick="location.reload()">Refresh</button></div>'}
  $('#v').innerHTML=html;
  $('#ht').textContent=({plan:'Aaj ka Plan',shop:'Shop',kitchen:'Aaj Ka Khana',delivery:'Aaj Ka Route',owner:'Owner Dashboard'})[tab];
  const tabs=[['plan','Plan','🍱'],['shop','Shop','🛒'],['kitchen','Kitchen','🍳'],['delivery','Delivery',''],['owner','Owner','💰']];
  $('#nav').innerHTML=tabs.filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>'<div class="'+(x[0]===tab?'on':'')+'" data-a="tab" data-v="'+x[0]+'"><span class="emoji">'+x[2]+'</span>'+x[1]+'</div>').join('');
}

// ===== EVENT LISTENERS =====
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f)try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){alert('Error: '+x.message)}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPh(F.phone);if(f==='extraRoti')F.extraRoti=clamp(+F.extraRoti||0,0,4)}if(e.target.id==='sq'){SQ=e.target.value;render()}});

// Header tap for owner login
let hc=0;
document.querySelector('header').addEventListener('click',()=>{hc++;if(hc>=5){hc=0;const lk=0;const x=prompt('Owner PIN daalo (Default: 4821)');if(x===null)return;if(x===OPIN){OK=1;DET=null;tab='owner';render()}else{alert('Galat PIN')}}});

// Initial render
render();
if(location.hash==='#owner'){const x=prompt('Owner PIN');if(x===OPIN){OK=1;tab='owner';render()}}
</script>
