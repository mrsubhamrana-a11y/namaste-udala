 return{id:p.id,n:String(p.n||'Item'),p:+p.p||0,c:p.c||'General',nv:p.nv?1:0,s:p.s===0?0:1,img:p.img||'',kind:p.kind==='food'?'food':'grocery',rating:p.rating||0,time:p.time||0,best:p.best?1:0}};

function migrate(d){if(!d||typeof d!=='object')return d;
 const v=d.v||1;
 if(v<2)(d.orders||[]).forEach(o=>{o.slot=o.slot||'lunch';o.discount=o.discount||0;o.coupon=o.coupon||''});
 if(v<3){d.coupons=d.coupons||COUPONS_DEFAULT;d.walletLedger=d.walletLedger||[]}
 d.v=SCHEMA_V;return d}

}

  <div class="stat" style="background:linear-gradient(135deg,#1B4332,#2D6A4F)"><div class="v">${veg}</div><div class="l">Veg</div></div>
  <div class="stat" style="background:linear-gradient(135deg,#FF6B35,#E85D04)"><div class="v">${nv}</div><div class="l">Non-Veg</div></div>
  <div class="stat" style="background:linear-gradient(135deg,#7C3AED,#5B21B6)"><div class="v">${roti}</div><div class="l">Roti</div></div>
  <div class="stat" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8)"><div class="v">${chawal}</div><div class="l">Chawal</div></div></div>
  <button class="btn g" data-a="copyKitchen">📋 Summary Copy</button></div>`;
 h+=`<div class="card"><h3>👥 List (${on.length})</h3>`;
 on.forEach(s=>{h+=`<div class="row"><div><b>${esc(s.name)}</b> <span class="s">${s.type==='veg'?'🟢':''}</span><div class="s" style="color:var(--neon);font-weight:700">${packItems(s).join(' · ')}</div></div><button class="btn sm ${s.skip.includes(k)?'g':'r'}" data-a="skipToday" data-id="${s.id}">${s.skip.includes(k)?'Wapas':'Skip'}</button></div>`});
 if(!on.length)h+=`<p class="s">Koi nahi.</p>`;
 return h+`</div>`},

delivery:()=>{
 if(!OK)return `<div class="card"><h3>🔒 Locked</h3><p class="s">Header par 5 tap → PIN</p></div>`;
 const k=todayStr();
 const live=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k)&&!(s.pause||[]).includes(k));
 const pend=live.filter(s=>!S.done[k+'_'+s.id]);
 const done=live.filter(s=>S.done[k+'_'+s.id]);
 const ords=(S.orders||[]).filter(o=>o.status==='pending');
 let h=`<div class="card" style="background:linear-gradient(135deg,rgba(27,67,50,.9),rgba(7,11,20,.85));color:#fff;border:1px solid rgba(6,214,160,.3);text-align:center">
  <div class="s" style="color:#A7F3D0">AAJ KI DELIVERY</div><div style="font-size:36px;font-weight:900;text-shadow:0 0 20px rgba(6,214,160,.7)">${done.length} / ${live.length}</div>
  <div class="pbar" style="background:rgba(255,255,255,.15)"><div class="pfill" style="width:${live.length?Math.round(done.length/live.length*100):0}%"></div></div></div>`;
 h+=`<div class="card"><h3>⏳ Baaki (${pend.length})</h3>`;
 pend.forEach((s,i)=>{h+=`<div class="row" style="align-items:flex-start"><div style="flex:1"><b>#${i+1} ${esc(s.name)}</b><div class="s">${esc(s.addr)}, ${esc(s.area)}</div><div class="s" style="color:var(--o);font-weight:700">${s.type==='veg'?'🟢':'🔴'} · ${packItems(s).length} items</div></div>
  <div style="display:flex;flex-direction:column;gap:6px">${s.map?`<a class="btn sm b" href="${s.map}" target="_blank">🗺️</a>`:''}<a class="btn sm g" href="tel:+91${s.phone}">📞</a><button class="btn sm" data-a="done" data-id="${s.id}">✅</button></div></div>`});
 if(!pend.length)h+=`<p class="s">Sab ho gaya 🎉</p>`;
 h+=`</div>`;
 if(ords.length){h+=`<div class="card"><h3>🛒 Shop Orders (${ords.length})</h3>`;
  ords.forEach(o=>{h+=`<div class="row" style="align-items:flex-start"><div style="flex:1"><b>${esc(o.name)}</b><div class="s">${o.items.map(i=>i.n+' x'+i.q).join(', ')}</div><div class="s">🕐 ${o.slot==='dinner'?'Dinner':'Lunch'} · <b style="color:var(--o)">${inr(o.total)}</b></div></div><button class="btn sm g" data-a="odone" data-id="${o.id}">✅</button></div>`});
  h+=`</div>`}
 return h},

owner:()=>{
 if(!OK)return `<div class="card"><h3>🔒 Owner Access</h3><p class="s">Header par 5 tap → PIN 4821</p></div>`;
 const pendPay=(S.subs||[]).filter(s=>s.status==='pending');
 const act=(S.subs||[]).filter(isLive).length;
 const rev=(S.pays||[]).reduce((a,p)=>a+(+p.amt||0),0);
 let h=`<div class="card"><h3>📊 Dashboard</h3><div class="grid2">
  <div class="stat" style="background:linear-gradient(135deg,#1B4332,#2D6A4F)"><div class="v">${act}</div><div class="l">Active</div></div>
  <div class="stat" style="background:linear-gradient(135deg,#FF6B35,#E85D04)"><div class="v">${inr(rev)}</div><div class="l">Kamai</div></div>
  <div class="stat" style="background:linear-gradient(135deg,${pendPay.length?'#F59E0B,#B45309':'#10B981,#059669'})"><div class="v">${pendPay.length}</div><div class="l">Pending</div></div>
  <div class="stat" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8)"><div class="v">${(S.orders||[]).length}</div><div class="l">Orders</div></div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm b" data-a="backup">💾 Backup</button><button class="btn sm g" data-a="restore">📂 Restore</button></div></div>`;
 h+=`<div class="card"><h3>🧾 Sections</h3><div class="seg"><button class="${OSEC==='pay'?'on':''}" data-a="osec" data-v="pay">💳 Pay</button><button class="${OSEC==='subs'?'on':''}" data-a="osec" data-v="subs">🍱 Plans</button><button class="${OSEC==='prod'?'on':''}" data-a="osec" data-v="prod">🛒 Prod</button><button class="${OSEC==='set'?'on':''}" data-a="osec" data-v="set">⚙️ Set</button></div>`;
 if(OSEC==='pay'){
  if(pendPay.length){pendPay.forEach(s=>{h+=`<div style="background:var(--inp);border:1px solid rgba(245,158,11,.4);border-radius:14px;padding:12px;margin-top:10px"><div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b>${badge('pending')}</div><div class="s">📱 ${s.phone} · ${inr(s.price)}</div><div class="s" style="font-weight:800">🔢 UTR: ${esc(s.utr||'-')}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm g" data-a="verifyPay" data-id="${s.id}" style="flex:1">✅ Verify</button><button class="btn sm r" data-a="rejectPay" data-id="${s.id}" style="flex:1">❌</button></div></div>`})}
  else h+=`<p class="s">Koi pending nahi 🎉</p>`;
 } else if(OSEC==='subs'){
  (S.subs||[]).slice().reverse().forEach(s=>{h+=`<div class="row"><div><b>${esc(s.name)}</b><div class="s">${s.phone} · ${inr(s.price)}</div></div>${badge(getSubStatus(s))}</div>`});
 } else if(OSEC==='prod'){
  h+=`<div style="background:var(--inp);border-radius:14px;padding:12px"><input id="pn" placeholder="Naam" style="margin:0 0 8px"><div style="display:flex;gap:8px"><input id="pp" type="number" placeholder="Price" style="margin:0"><input id="pc" placeholder="Cat" style="margin:0"></div>
   <select id="pkind" style="margin:8px 0 0"><option value="grocery">🛒 Grocery</option><option value="food">🍛 Food</option></select>
   <button class="btn g" data-a="addProd">➕ Add</button></div>`;
  (S.prod||[]).forEach(p=>{h+=`<div class="row"><div style="flex:1"><b>${p.kind==='food'?'🍛':''} ${esc(p.n)}</b><div class="s">${inr(p.p)}</div></div><button class="btn sm ${p.s===0?'r':'g'}" data-a="stock" data-id="${p.id}">${p.s===0?'Out':'Stock'}</button><button class="btn sm r" data-a="delProd" data-id="${p.id}">🗑️</button></div>`});
 } else {
  h+=`<div class="s">Kal ka menu:</div><input id="mveg" placeholder="Veg" value="${esc(mf(addDays(new Date(),1),'veg'))}"><input id="mnv" placeholder="NV" value="${esc(mf(addDays(new Date(),1),'nv'))}"><button class="btn sm g" data-a="setMenu">💾 Save</button>
   <button class="btn r" data-a="out" style="margin-top:16px">🚪 Logout</button>`;
 }
 return h+`</div>`}
};

const PAUSE_MODAL=()=>{if(!ME)return '';
 const live=(S.subs||[]).filter(s=>s.phone===ME.phone).find(isLive);if(!live)return '';
 return `<div class="modal" data-a="closeModal"><div class="modal-content" onclick="event.stopPropagation()">
  <h3>⏸️ Plan Pause</h3><div class="s">Dates chunein — plan auto-extend hoga.</div>
  <div style="display:flex;gap:8px;margin-top:12px"><input type="date" id="pauseStart" value="${todayStr()}" min="${todayStr()}"><input type="date" id="pauseEnd" value="${iso(addDays(new Date(),3))}" min="${todayStr()}"></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn g" data-a="applyPause" style="flex:1">✅ Apply</button><button class="btn r" data-a="closeModal" style="flex:1">Cancel</button></div></div></div>`};

const bindTilt=()=>{$$('.card,.pcard').forEach(el=>{
 el.addEventListener('mousemove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(900px) rotateY(${x*6}deg) rotateX(${-y*6}deg) translateZ(4px)`});
 el.addEventListener('mouseleave',()=>{el.style.transform=''})})};

const render=()=>{
 try{
  if(!OK&&!['plan','shop'].includes(tab))tab='plan';
  $('#v').innerHTML=VIEWS[tab]();
  $('#ht').textContent={plan:'Aaj ka Plan',shop:'Shop',kitchen:'Kitchen',delivery:'Delivery',owner:'Owner Panel'}[tab];
  $('#nav').innerHTML=[['plan','🍱','Plan'],['shop','🛍️','Shop'],['kitchen','👨‍🍳','Kitchen'],['delivery','🛵','Delivery'],['owner','👤','Owner']].filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>`<div class="${x[0]===tab?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
  bindTilt();
 }catch(err){$('#v').innerHTML=`<div class="card"><h3>⚠️ Error</h3><p class="s">${esc(err.message)}</p><button class="btn g" onclick="location.reload()">🔄 Refresh</button></div>`}
};

const needGPS=()=>{if(!F.map){showToast('❌ Pehle GPS lein','error');return false}return true};
const needUser=()=>{const n=(F.name||'').trim(),p=cleanPhone(F.phone);if(n.length<2){showToast('❌ Sahi naam','error');return null}if(p.length!==10){showToast('❌ 10 digit phone','error');return null}return {n,p}};

const ACTIONS={
 tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const x=prompt(v==='owner'?'Owner PIN:':'PIN:');if(x===null)return;
   const ok=v==='owner'?(x===CONFIG.ownerPin):(x===CONFIG.delivPin||x===CONFIG.ownerPin);
   if(!ok){showToast('❌ Galat PIN','error');return}OK=1;sessionStorage.setItem('udok','1')}
  tab=v;render();window.scrollTo({top:0,behavior:'smooth'})},
 osec:v=>{OSEC=v;render()},
 shopmode:v=>{SHOPMODE=v;SQ='';FCAT='Sab';render()},
 fcat:v=>{FCAT=v;render()},
 set:(v,k)=>{F[k]=v;render()},
 setSlot:v=>{F.slot=v;render()},
 inc:(v,k,id)=>{C[id]=(C[id]||0)+1;saveCart();render()},
 dec:(v,k,id)=>{C[id]=Math.max(0,(C[id]||0)-1);if(!C[id])delete C[id];saveCart();render()},
 goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
 addPreset:()=>{let n=0;KIRANA_PRESET.forEach(name=>{const p=S.prod.find(x=>x.n===name);if(p&&p.s!==0){C[p.id]=(C[p.id]||0)+1;n++}});saveCart();render();showToast(`✅ ${n} items add`)},
 applyCoupon:()=>{const code=($('#couponInput')?.value||'').trim().toUpperCase();
  if(!code){CART_COUPON='';render();return}
  if(!S.coupons[code]){showToast('❌ Galat coupon','error');return}
  if(calcCart().sub<S.coupons[code].min){showToast(`❌ Min ₹${S.coupons[code].min} chahiye`,'error');return}
  CART_COUPON=code;render();showToast('✅ Coupon applied!')},
 gps:()=>{const b=$('#gpsBtn');if(!navigator.geolocation){showToast('❌ GPS nahi','error');return}
  if(b)b.innerHTML='<span class="loader"></span> Dhundh rahe hain...';
  navigator.geolocation.getCurrentPosition(p=>{F.map=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;showToast('✅ Location lock');render()},()=>showToast('❌ Permission allow karein','error'),{enableHighAccuracy:true,timeout:10000})},
 login:()=>{const n=($('#lname')?.value||'').trim(),p=cleanPhone($('#lphone')?.value);
  if(n.length<2||p.length!==10){showToast('❌ Naam + 10 digit phone','error');return}
  ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();showToast('👤 Login!')},
 logout:()=>{ME=null;saveME();render()},
 mealMark:(v,k,id)=>{if(k!=='subah'&&!checkCutoff(k)){showToast(`⚠️ Cutoff: ${k==='lunch'?'9 AM':'4 PM'} ke baad skip nahi`,'error');return}
  S.meals[mealKey(id,k)]=v;save(true);showToast(v==='consumed'?'✅ Khaya':'❌ Skip')},
 skipToday:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const k2=todayStr();const i=s.skip.indexOf(k2);if(i>=0)s.skip.splice(i,1);else s.skip.push(k2);save(true)},
 openPause:()=>{$('#v').insertAdjacentHTML('beforeend',PAUSE_MODAL())},
 closeModal:()=>{$$('.modal').forEach(m=>m.remove())},
 applyPause:()=>{if(!ME)return;const live=(S.subs||[]).filter(s=>s.phone===ME.phone).find(isLive);
  if(!live){showToast('❌ Koi plan nahi','error');return}
  const st=$('#pauseStart')?.value,en=$('#pauseEnd')?.value;
  if(!st||!en||en<st||st<todayStr()){showToast('❌ Sahi dates chunein','error');return}
  const pa=live.pause||(live.pause=[]);let n=0;
  for(let d=new Date(st);d<=new Date(en);d=addDays(d,1)){const k=iso(d);if(!pa.includes(k)){pa.push(k);n++}}
  save(true);ACTIONS.closeModal();showToast(`✅ ${n} din pause — plan extend hoga`)},
 joinTrial:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const fp=deviceFp();
  if((S.subs||[]).find(s=>s.phone===u.p&&s.trial)){showToast('❌ Phone par trial ho chuka','error');return}
  if((S.subs||[]).find(s=>s.deviceFp===fp&&s.trial)){showToast('❌ Device par trial ho chuka','error');return}
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:1,start:todayStr(),price:0,status:'trial',trial:1,paid:1,utr:'FREE_TRIAL',skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,deviceFp:fp});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save(true);showToast('🎁 Trial ACTIVE!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🎁 *TRIAL*%0A👤 ${u.n}%0A📱 ${u.p}`,'_blank')},
 joinPaid:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const utr=prompt('💳 UTR likhein:');if(!utr||utr.trim().length<4){showToast('❌ Bina UTR nahi','error');return}
  const price=PRICING[F.type][F.days]||2899;
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr:utr.trim(),skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,deviceFp:deviceFp()});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save(true);showToast('⏳ Owner verify karega');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *PLAN*%0A👤 ${u.n}%0A💰 ${inr(price)}%0A🔢 ${utr}`,'_blank')},
 order:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address','error');return}
  const cart=calcCart();if(!cart.cnt){showToast('❌ Cart khali','error');return}
  const items=[];Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0)items.push({n:p.n,q,p:p.p})});
  S.orders.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,items,total:cart.total,sub:cart.sub,discount:cart.disc,coupon:cart.code,status:'pending',paid:0,date:todayStr(),slot:F.slot});
  C={};CART_COUPON='';saveCart();save(true);showToast('✅ Order mil gaya!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *ORDER*%0A👤 ${u.n}%0A📦 ${items.map(i=>i.n+' x'+i.q).join(', ')}%0A🕐 ${F.slot}%0A💰 ${inr(cart.total)}`,'_blank')},
 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;
  S.pays.push({id:Date.now(),d:todayStr(),name:s.name,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});save(true);showToast('✅ Active!')},
 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm('Reject?')){s.status='rejected';save(true)}},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save(true)},
 odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.status='delivered';save(true);showToast('✅ Delivered')}},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim(),kind=($('#pkind')?.value)||'grocery';
  if(!n||!p||p<=0){showToast('❌ Naam + price','error');return}
  S.prod.push({id:Date.now(),n,p,c,nv:0,s:1,img:'',kind});save(true);showToast('✅ Add')},
 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);save(true)}},
 setMenu:()=>{const k=iso(addDays(new Date(),1));S.mset[k]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save(true);showToast('💾 Save')},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));
  navigator.clipboard.writeText(`🍱 KITCHEN ${k}\n👥 ${on.length}\n\n`+on.map(s=>`• ${s.name} - ${packItems(s).join(', ')}`).join('\n')).then(()=>showToast('📋 Copy!')).catch(()=>showToast('❌ Copy fail','error'))},
 backup:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render()}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACTIONS[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(err){showToast('❌ Error','error')}}});
document.addEventListener('input',e=>{const f=e.target.dataset?.f;
 if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone)}
 if(e.target.id==='sq'){clearTimeout(window._t);window._t=setTimeout(()=>{SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{S=migrate(JSON.parse(r.result));save(true);showToast('✅ Restore!')}catch(err){showToast('❌ Galat file','error')}};
 r.readAsText(f);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Owner PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();showToast('🔓 Owner')}else showToast('❌ PIN','error')}});

const initTheme=()=>{const t=localStorage.getItem('ud_theme')||'dark';document.documentElement.setAttribute('data-theme',t);$('#themeToggle').textContent=t==='dark'?'☀️':'🌙'};
$('#themeToggle').addEventListener('click',()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('ud_theme',n);$('#themeToggle').textContent=n==='dark'?'☀️':'🌙'});

initTheme();render();
setTimeout(()=>showToast('🌌 Neon UI ready · Schema v'+SCHEMA_V),600);
</script>
</body>
