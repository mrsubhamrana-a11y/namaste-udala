let analytics = JSON.parse(localStorage.getItem('nu_behavior') || '{"visits":0, "orders":0, "favItem":""}');
analytics.visits++;

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('installBanner');
  if (banner) banner.style.display = 'flex';
});

document.addEventListener('click', async (e) => {
  if (e.target && e.target.id === 'installBtn') {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        const banner = document.getElementById('installBanner');
        if (banner) banner.style.display = 'none';
      }
      deferredPrompt = null;
    } else {
      alert('Browser menu (3 dots) par click karke "Add to Home Screen" select karein!');
    }
  }
});

const UDALA_AREAS = ['Udala Bus Stand', 'Market Square', 'High School Rd', 'College Rd', 'Block Office', 'Hospital Rd', 'Ward 1–6', 'Bhanjpur'];
const AREA_COORDS = {
  'Udala Bus Stand': [21.5732, 86.5675],
  'Market Square': [21.5718, 86.5648],
  'High School Rd': [21.5755, 86.5630],
  'College Rd': [21.5790, 86.5612],

  'Hospital Rd': [21.5740, 86.5710],
  'Ward 1–6': [21.5768, 86.5688],
  'Bhanjpur': [21.5810, 86.5720]

const KITCHEN_HQ = [21.5732, 86.5675];
const NODE = 'udala_phase2';

function pinHash(str) {
  let h = 2166136261;
  const s = 'nu_salt_' + String(str).trim();
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}
const ROLE_HASHES = { owner: pinHash('4827'), staff: pinHash('7788') };
function verifyPinRole(pin) {
  const h = pinHash(pin);
  if (h === ROLE_HASHES.owner) return 'owner';
  if (h === ROLE_HASHES.staff) return 'staff';

function getCustomerCoords(item) {
  if (item.lat && item.lng) return [+item.lat, +item.lng];
  return AREA_COORDS[item.area] || KITCHEN_HQ;
}
function haversineKm(c1, c2) {
  const toRad = x => (x * Math.PI) / 180;
  const R = 6371;
  const dLat = toRad(c2[0] - c1[0]);
  const dLon = toRad(c2[1] - c1[1]);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(c1[0])) * Math.cos(toRad(c2[0])) * Math.sin(dLon / 2) ** 2;
  return +(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(2);
}
function sortRouteNearestFirst(list) {
  if (!list || !list.length) return [];
  const remaining = list.map(item => ({ item, coords: getCustomerCoords(item) }));
  const ordered = [];
  let curr = KITCHEN_HQ;
  while (remaining.length > 0) {
    let bestIdx = 0, bestDist = Infinity;
    for (let i = 0; i < remaining.length; i++) {
      const d = haversineKm(curr, remaining[i].coords);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    const next = remaining.splice(bestIdx, 1)[0];
    next.item._distKm = Math.max(0.2, bestDist);
    next.item._etaMin = Math.max(4, Math.round(bestDist * 4 + 3));
    ordered.push(next.item);
    curr = next.coords;
  }
  return ordered;
}

function calcKitchenProcurement(activeSubs, pendOrds, slot) {
  let riceG = 0, attaG = 0, dalG = 0, vegG = 0, paneerG = 0, chickenG = 0;
  activeSubs.forEach(s => {
    const rCount = calcRotiForSub(s, slot);
    attaG += rCount * 35;
    if (slot === 'bf') {
      attaG += 100; vegG += 120;
    } else {
      const pref = slot === 'lunch' ? (s.lunch || 'chawal') : (s.dinner || 'roti');
      if (pref === 'chawal') riceG += 160;
      else if (pref === 'both') riceG += 100;
      dalG += 60;
      if (s.type === 'nv') chickenG += 180;
      else { paneerG += 85; vegG += 140; }
    }
  });
  (pendOrds || []).forEach(o => {
    if (+o.packed) return;
    (o.items || []).forEach(it => {
      const n = (it.n || '').toLowerCase();
      const mult = (it.h ? 0.5 : 1) * (+it.q || 1);
      if (n.includes('chicken')) chickenG += Math.round(250 * mult);
      if (n.includes('paneer')) paneerG += Math.round(150 * mult);
      if (n.includes('roti')) attaG += Math.round(350 * mult);
      if (n.includes('chawal')) riceG += Math.round(180 * mult);
    });
  });
  const fmt = g => g >= 1000 ? (g / 1000).toFixed(2) + ' kg' : g + ' g';
  return { rice: fmt(riceG), atta: fmt(attaG), dal: fmt(dalG), chicken: fmt(chickenG), paneer: fmt(paneerG), sabzi: fmt(vegG) };
}

function evaluateFraudRisk(item) {
  if (item.paid && item.pMode && item.pMode.includes('Auto-Matched')) return { score: 0, label: '🟢 0% Risk (Bank Matched)', cls: 'st-ok' };
  if (item.vStat === 'cod') return { score: 10, label: '🟢 Doorstep Collect', cls: 'st-wait' };
  let risk = 15;
  const utr = String(item.utr || '');
  const uniqueDigits = new Set(utr.split('')).size;
  if (uniqueDigits <= 4) risk += 35;
  if (!item.proof) risk += 20;
  if ((item.total || item.price) > 2000 && !item.proof) risk += 25;
  const hr = new Date(item.ts || Date.now()).getHours();
  if (hr >= 0 && hr <= 5) risk += 15;
  risk = Math.min(98, risk);
  if (risk >= 60) return { score: risk, label: `🔴 High Risk (${risk}%)`, cls: 'st-bad' };
  if (risk >= 35) return { score: risk, label: `🟡 Medium Risk (${risk}%)`, cls: 'st-wait' };
  return { score: risk, label: `🟢 Low Risk (${risk}%)`, cls: 'st-ok' };
}

function strHash(s) {
  let h1 = 0xdeadbeef ^ s.length, h2 = 0x41c6ce57 ^ s.length;
  const step = Math.max(1, Math.floor(s.length / 6000));
  for (let i = 0; i < s.length; i += step) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  return 'IMG-' + s.length + '-' + (h1 >>> 0).toString(16) + '-' + (h2 >>> 0).toString(16);
}

function validateStrictUTR(raw, usedList) {
  const clean = String(raw || '').replace(/\D/g, '');
  if (clean.length !== 12) return { ok: false, msg: '⚠️ Bank UPI Ref/UTR hamesha poore 12-digit ka hota hai!' };
  if (/^(\d)\1{6,}$/.test(clean) || /^(\d{2,4})\1+$/.test(clean) || /^(012345678901|123456789012|987654321098)$/.test(clean)) {
    return { ok: false, msg: '⚠️ Fake sequence UTR detected! Asli bank SMS/UPI UTR daalein.' };
  }
  if (new Set(clean.split('')).size < 4) {
    return { ok: false, msg: '⚠️ Invalid UTR pattern! Sahi 12-digit UTR number daalein.' };
  }
  if ((usedList || []).includes(clean)) {
    return { ok: false, msg: '⚠️ Yeh UTR pehle hi use ho chuka hai (Duplicate UTR Blocked)!' };
  }
  return { ok: true, utr: clean };
}

function inspectReceiptCanvas(canvas, origW, origH) {
  const ratio = origH / Math.max(1, origW);
  if (ratio < 0.72 || ratio > 3.6) {
    return { ok: false, msg: '⚠️ Invalid image dimensions! Asli UPI payment screenshot upload karein.' };
  }
  const ctx = canvas.getContext('2d');
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  let uiBgPixels = 0, contrastPixels = 0, total = data.length / 4;
  for (let i = 0; i < data.length; i += 16) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const maxDiff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
    const lum = (r + g + b) / 3;
    if (maxDiff < 38 && (lum > 185 || lum < 75)) uiBgPixels++;
    if (lum < 110 || lum > 200) contrastPixels++;
  }
  const sampleCount = Math.max(1, total / 4);
  if (uiBgPixels / sampleCount < 0.16) {
    return { ok: false, msg: '⚠️ Camera photo detected! Sirf GPay/PhonePe/Paytm/BHIM ka screenshot lagayein.' };
  }
  if (contrastPixels / sampleCount < 0.02) {
    return { ok: false, msg: '⚠️ Blank ya blur image blocked! Sahi screenshot select karein.' };
  }
  return { ok: true };
}

function playChime() {

    [880, 1174.66, 1567.98].forEach((freq, i) => {

      o.type = 'triangle'; o.frequency.value = freq;

      g.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + i * 0.09 + 0.35);
      o.connect(g); g.connect(_audioCtx.destination);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };

    });
  } catch (e) {}
}

function isSubActiveOn(s, d, slot) {
  if (!s || s.vStat === 'bad') return false;
  if (slot === 'bf' && (+s.times || 3) < 3) return false;
  const k = iso(d);
  if ((s.skip || []).includes(k)) return false;
  const startStr = s.start || iso(D0());
  const endStr = iso(addD(new Date(startStr + 'T12:00:00'), (+s.days || 30) - 1));
  return k >= startStr && k <= endStr;
}

function getSubDaysRemaining(s) {
  const startStr = s.start || iso(D0());
  const endD = addD(new Date(startStr + 'T12:00:00'), (+s.days || 30) - 1);
  return Math.round((endD - D0()) / 864e5) + 1;
}

function isSubSlotDone(subId, dateStr, slot) {

function calcRotiForSub(s, slot) {
  if (slot === 'bf') return 0;

}

function generateUniqueExactAmt(base) {
  const usedKeys = new Set();
  (S.orders || []).forEach(o => { if (!o.paid && o.vStat !== 'bad') usedKeys.add(amtKey(o.total)); });
  (S.subs || []).forEach(s => { if (!s.paid && s.vStat !== 'bad') usedKeys.add(amtKey(s.price)); });
  for (let tries = 0; tries < 85; tries++) {
    const p = +(Math.floor(11 + Math.random() * 88) / 100).toFixed(2);
    const candidate = +(base + p).toFixed(2);
    if (!usedKeys.has(amtKey(candidate))) return candidate;
  }
  return +(base + 0.49).toFixed(2);
}

function getDiscountBreakdown(itemSubTotal) {
  let cpnDisc = 0, ptsDisc = 0;
  const c = COUPONS[COUPON_CODE];
  if (c && itemSubTotal >= c.min) cpnDisc = c.disc;
  const afterCpn = Math.max(0, itemSubTotal - cpnDisc);
  if (USE_PTS && afterCpn > 10) {
    ptsDisc = Math.min(getMyPts(), Math.floor(itemSubTotal * 0.25), Math.max(0, afterCpn - 10));
  }
  const totalDisc = Math.min(cpnDisc + ptsDisc, Math.max(0, itemSubTotal - 10));
  return { cpnDisc, ptsDisc, totalDisc };
}

  const prep = calcKitchenProcurement(activeSubs, [], K_SLOT);
  return `
  <div class="hero3d">
    <h2>Kitchen Production & Prep AI</h2>
    <p>Aaj ke Active Tiffins Forecast</p>
  </div>
  <div class="seg" style="margin-bottom:12px">
    <button type="button" class="${K_SLOT === 'bf' ? 'on' : ''}" data-a="kslot" data-v="bf">Nashta</button>
    <button type="button" class="${K_SLOT === 'lunch' ? 'on' : ''}" data-a="kslot" data-v="lunch">Lunch</button>
    <button type="button" class="${K_SLOT === 'dinner' ? 'on' : ''}" data-a="kslot" data-v="dinner">Dinner</button>
  </div>
  <div class="prep-grid">
    <div class="prep-box"><b>${prep.rice}</b><span>Chawal</span></div>
    <div class="prep-box"><b>${prep.atta}</b><span>Atta</span></div>
    <div class="prep-box"><b>${prep.chicken}</b><span>Chicken</span></div>
    <div class="prep-box"><b>${prep.paneer}</b><span>Paneer</span></div>
  </div>`;
}

function vRoute() {
  const subs = sortRouteNearestFirst((S.subs || []).filter(s => isSubActiveOn(s, D0(), K_SLOT)));
  return `
  <div class="card" style="background:var(--g);color:#fff">
    <h2 style="font-family:var(--serif);font-size:18px">GPS Shortest-Path Route</h2>
  </div>
  <div class="card">
    <h3>Delivery Drops (${subs.length})</h3>
    ${subs.map((s, i) => `<div class="row"><div><b>#${i+1} · ${esc(s.name)}</b><div style="font-size:11.5px;color:var(--mu)">${esc(s.addr)} (${s._distKm} km)</div></div><a class="btn sm g" href="tel:+91${esc(s.phone)}">Call</a></div>`).join('')}
  </div>`;
}

function vOwner() {
  const totIn = (S.orders || []).reduce((a, o) => a + (+o.paid ? +o.total : 0), 0) + (S.subs || []).reduce((a, s) => a + (+s.paid ? +s.price : 0), 0);
  return `
  <div class="card" style="background:var(--g);color:#fff">
    <h2 style="font-family:var(--serif);font-size:18px">Owner Master Control</h2>
  </div>
  <div class="kpi">
    <div><b>${inr(totIn)}</b><span>Collection</span></div>
    <div><b>${S.orders.length}</b><span>Orders</span></div>
    <div><b>${S.subs.length}</b><span>Subs</span></div>
  </div>`;
}

function sheet() {
  if (PAY_BOX) {
    const g = PAY_BOX, uLink = upiLink(g.exactAmt, g.title, g.trId);
    return `<div class="ov"><div class="sh" style="text-align:center">
      <h3>⚡ 1-TAP UPI PAYMENT</h3>
      <h2 style="color:var(--o);margin:10px 0">${inr(g.exactAmt)}</h2>
      <div class="upi-grid">
        <button type="button" class="upi-btn upi-pp" data-a="open_upi_app" data-v="phonepe">🟣 PhonePe</button>
        <button type="button" class="upi-btn upi-gp" data-a="open_upi_app" data-v="gpay">🔵 Google Pay</button>
      </div>
      <div style="margin:12px 0"><img src="${esc(qrUrl(uLink))}" style="width:130px;margin:0 auto"></div>
      <input class="inp" id="utr_inp" placeholder="12-Digit UTR" value="${esc(DRAFT_UTR)}" style="text-align:center">
      <button type="button" class="btn g" data-a="confirm_paid">I Have Paid ✓</button>
      <button type="button" class="btn w sm" data-a="cancel_pay" style="margin-top:8px">Cancel</button>
    </div></div>`;
  }
  if (CART_OPEN) {
    const st = subTot(), tot = ct();
    return `<div class="ov"><div class="sh">
      <h3>Aapka Cart</h3>
      ${userFormHTML(st)}
      <div class="tot"><span>Total Bill</span><b>${inr(tot)}</b></div>
      <button type="button" class="btn" data-a="pay_ord">Proceed to Payment · ${inr(tot)}</button>
      <button type="button" class="btn w sm" data-a="close" style="margin-top:8px">Close</button>
    </div></div>`;
  }
  return '';
}

function render() {
  saveCart();
  const V = { plan: vPlan, shop: vShop, profile: vProfile, kitchen: vKitchen, route: vRoute, owner: vOwner };
  try {
    $('#v').innerHTML = (V[tab] || vPlan)();
    $('#sheet').innerHTML = sheet();
  } catch (e) {}

  const n = cc(), tot = ct();
  $('#cbar').innerHTML = (n > 0 && !CART_OPEN && !PAY_BOX) ? `
    <button type="button" class="cbar-fixed" data-a="open_cart">
      <span>${n} Item · ${inr(tot)}</span>
      <span>View Cart & Order →</span>
    </button>` : '';

  const TABS = [['plan', IC.tiffin, 'Plans'], ['shop', IC.shop, 'Shop'], ['profile', IC.user, 'Profile']];
  if (ROLE === 'staff' || ROLE === 'owner') TABS.push(['kitchen', IC.kitchen, 'Kitchen'], ['route', IC.route, 'Route']);
  if (ROLE === 'owner') TABS.push(['owner', IC.owner, 'Owner']);

  $('#nav').innerHTML = TABS.map(x => `<button type="button" class="${tab === x[0] ? 'on' : ''}" data-a="tab" data-v="${x[0]}">${x[1]}<span class="nl">${x[2]}</span>${x[0] === 'shop' && n ? `<span class="nb">${n}</span>` : ''}</button>`).join('');
}

function checkUser() {
  if (!F.name.trim() || !isValidPhone(F.phone) || !F.addr.trim()) {
    toast('Naam, mobile aur address bharein');
    return false;
  }
  syncCustomerProfile();
  return true;
}

function finalizeOrder(isPaid, vStat, modeLabel, refNo) {
  if (!PAY_BOX) return;
  syncCustomerProfile();
  setPayBox(null); playChime(); save();
  toast('🎉 Order & Payment Successful!');
}

const A = {
  tab: v => { tab = v; CART_OPEN = false; setPayBox(null); render(); },
  logo_tap: () => {
    LOGO_TAPS++;
    clearTimeout(LOGO_TIMER);
    LOGO_TIMER = setTimeout(() => { LOGO_TAPS = 0; }, 2200);
    if (LOGO_TAPS >= 5) {
      LOGO_TAPS = 0;
      ROLE = 'owner'; sessionStorage.setItem('nu_role_tok', ROLE_HASHES.owner);
      tab = 'owner'; render(); toast('🔓 Owner Master Control Unlocked!');
    } else if (LOGO_TAPS >= 3) {
      toast(`${5 - LOGO_TAPS} more taps for Owner Login`);
    }
  },
  toggle_pts: () => { USE_PTS = !USE_PTS; render(); },
  apply_cpn: () => { COUPON_CODE = $('#cpn_inp').value.toUpperCase(); render(); toast('Promo Applied!'); },
  set_area: v => { F.area = v; render(); },
  cat: v => { SCAT = v; render(); },
  kslot: v => { K_SLOT = v; render(); },
  open_cart: () => { CART_OPEN = true; render(); },
  close: () => { CART_OPEN = false; setPayBox(null); render(); },
  cancel_pay: () => { setPayBox(null); render(); },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; saveCart(); render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); saveCart(); render(); },
  open_upi_app: v => launchUpiApp(v),
  confirm_paid: () => finalizeOrder(1, 'ok', '1-Tap UPI', 'UPI-' + Date.now().toString().slice(-8)),
  fset: (v, k) => { F[k] = (k === 'days' || k === 'times') ? +v : v; render(); },
  save_prof: () => { if (checkUser()) toast('Profile Saved ✓'); },
  pay_sub: () => {
    if (!checkUser()) return;
    const raw = tierPrice(+F.days);
    setPayBox({ exactAmt: Math.max(10, raw), days: +F.days, trId: 'NUSUB' + Date.now().toString().slice(-7), title: `${F.days} Din Tiffin` });
    render();
  },
  pay_trial: () => {
    if (!checkUser()) return;
    const raw = tierPrice(1);
    setPayBox({ exactAmt: Math.max(10, raw), days: 1, trId: 'NUTRL' + Date.now().toString().slice(-7), title: `1 Din Trial` });
    render();
  },
  pay_ord: () => {
    if (!checkUser()) return;
    CART_OPEN = false;
    setPayBox({ exactAmt: ct(), trId: 'NUORD' + Date.now().toString().slice(-7), title: `Shop Order` });
    render();
  },
  theme: () => {
    const d = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = d ? 'dark' : '';
    localStorage.setItem('nu_theme', d ? 'dark' : '');
    $('#thm').textContent = d ? '☀️' : '🌙';
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const f = A[b.dataset.a];
  if (f) { e.preventDefault(); f(b.dataset.v, b.dataset.k, b.dataset.id, e); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.id === 'utr_inp') DRAFT_UTR = e.target.value;
  if (e.target.id === 'sq') { SQ = e.target.value; render(); }
});

render();
</script>
</body>
</html>
.
