<html lang="hi">
<head>
<meta charset="UTF-8">

<style>
:root{--o:#FF6B35;--g:#1B4332;--bg:#FAFAFA;--text:#1A1A1A;--muted:#6B7280;--card:#fff;--line:#F3F4F6;--ok:#10B981;--bad:#EF4444;--warn:#F59E0B}
*{box-sizing:border-box;font-family:'Poppins',sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:90px;min-height:100vh}
header{background:linear-gradient(135deg,var(--g),#0F2C21);color:#fff;padding:22px 20px 40px;border-radius:0 0 32px 32px}
header .logo{font-size:11px;letter-spacing:3px;font-weight:800;color:#FCD34D}
header h1{font-size:24px;font-weight:900;margin-top:4px}
header .tagline{font-size:13px;opacity:.9;margin-top:4px}
#v{padding:0 16px;margin-top:-20px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.card h3{color:var(--g);font-size:17px;font-weight:800;margin-bottom:10px}
.s{font-size:12.5px;color:var(--muted);line-height:1.5}
.btn{padding:13px;border-radius:14px;border:none;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:8px;background:var(--o);color:#fff}
.btn:active{transform:scale(.97)}
.btn.g{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
.btn.r{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA}
.btn.b{background:#3B82F6;color:#fff}
.btn.y{background:var(--warn);color:#fff}
.btn.sm{padding:7px 12px;font-size:12px;width:auto;margin:0;border-radius:10px}
input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;margin:5px 0 10px;font-size:15px;background:var(--bg);color:var(--text);font-family:inherit}
textarea{min-height:60px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border-bottom:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 14px;z-index:100}
.nav div{text-align:center;font-size:10px;font-weight:700;color:var(--muted);flex:1;cursor:pointer}
.nav div.on{color:var(--o)}
.nav div span{font-size:21px;display:block;margin-bottom:2px}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge.active{background:#D1FAE5;color:#065F46}.badge.pending{background:#FEF3C7;color:#92400E}.badge.trial{background:#DBEAFE;color:#1E40AF}.badge.expired,.badge.rejected{background:#F3F4F6;color:#6B7280}.badge.paused{background:#E0E7FF;color:#3730A3}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:#1F2937;color:#fff;padding:12px 24px;border-radius:50px;font-weight:700;font-size:13.5px;z-index:1000;opacity:0;transition:all .3s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:var(--bad)}
.pbar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.pfill{height:100%;background:var(--ok)}
.fab{position:fixed;right:16px;bottom:90px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;text-decoration:none}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer}
.seg button.on{background:var(--o);color:#fff;border-color:var(--o)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{border-radius:16px;padding:14px;text-align:center;color:#fff}
.stat .v{font-size:22px;font-weight:900}.stat .l{font-size:10.5px;opacity:.9;font-weight:600}
.vd{display:inline-block;width:15px;height:15px;border:2px solid #16a34a;border-radius:3px;position:relative;background:#fff;vertical-align:-3px}
.vd::after{content:'';position:absolute;inset:2px;border-radius:50%;background:#16a34a}
.vd.nv{border-color:#dc2626}.vd.nv::after{background:#dc2626}
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.pcard .ph{position:relative;height:110px;overflow:hidden}
.pcard .ph img{width:100%;height:110px;object-fit:cover;display:block}
.grow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow img{width:48px;height:48px;border-radius:12px;object-fit:cover}
.taskbox{border-radius:14px;padding:14px;margin:10px 0}
.taskbox b{font-size:15px}
</style>
</head>

const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};

const FOOD=[{n:'Special Veg Thali',p:120,c:'Thali',nv:0,img:IMG.thali,rating:4.6,time:30,best:1},{n:'Paneer Butter Masala + 2 Roti',p:140,c:'Curry',nv:0,img:IMG.paneer,rating:4.5,time:25,best:1},{n:'Dal Fry + Chawal',p:90,c:'Curry',nv:0,img:IMG.dal,rating:4.3,time:20},{n:'Chicken Curry + 2 Roti',p:160,c:'Curry',nv:1,img:IMG.chicken,rating:4.7,time:30,best:1},{n:'Fish Fry + Chawal',p:180,c:'Curry',nv:1,img:IMG.fish,rating:4.6,time:30},{n:'Egg Curry + Roti',p:100,c:'Curry',nv:1,img:IMG.egg,rating:4.2,time:20},{n:'Chicken Biryani',p:150,c:'Biryani',nv:1,img:IMG.biryani,rating:4.8,time:35,best:1},{n:'Veg Biryani',p:120,c:'Biryani',nv:0,img:IMG.biryani,rating:4.4,time:35},{n:'Butter Roti (2)',p:24,c:'Roti-Chawal',nv:0,img:IMG.roti,rating:4.4,time:15},{n:'Gulab Jamun (2)',p:40,c:'Meetha',nv:0,img:IMG.meetha,rating:4.7,time:10},{n:'Masala Chai',p:20,c:'Peene ko',nv:0,img:IMG.chai,rating:4.5,time:10}].map(a=>({...a,kind:'food',s:1}));
const COUPONS={'UDALA50':{discount:50,minOrder:200,expiry:'2026-12-31',type:'flat',usage:0,maxUsage:100},'FIRST20':{discount:20,minOrder:0,expiry:'2026-12-31',type:'percent',usage:0,maxUsage:50}};

const nSub=s=>{if(!s||!s.id)return null;s.name=String(s.name||'Customer');s.phone=cleanPhone(s.phone);s.type=s.type==='nv'?'nv':'veg';s.days=clamp(+s.days||30,1,365);s.start=s.start||todayStr();s.price=Math.max(0,+s.price||0);s.skip=Array.isArray(s.skip)?s.skip:[];s.pause=Array.isArray(s.pause)?s.pause:[];s.lunch=['roti','chawal','both'].includes(s.lunch)?s.lunch:'chawal';s.dinner=['roti','chawal','both'].includes(s.dinner)?s.dinner:'roti';s.extraRoti=clamp(+s.extraRoti||0,0,4);s.addr=s.addr||'';s.area=s.area||'Udala';s.map=s.map||'';s.notes=s.notes||'';s.utr=s.utr||'';s.paid=s.paid?1:0;s.trial=s.trial?1:0;s.wallet=s.wallet||0;s.points=s.points||0;s.streak=s.streak||0;s.autoPay=s.autoPay?1:0;if(!s.status)s.status=s.trial?'trial':(s.paid?'active':'pending');return s};
const nOrd=o=>{if(!o||!o.id)return null;o.name=String(o.name||'Customer');o.phone=cleanPhone(o.phone);o.items=Array.isArray(o.items)?o.items.filter(i=>i&&i.n):[];o.total=Math.max(0,+o.total||0);o.date=o.date||todayStr();o.status=o.status==='delivered'?'delivered':'pending';o.paid=o.paid?1:0;o.addr=o.addr||'';o.area=o.area||'Udala';o.map=o.map||'';o.discount=o.discount||0;o.coupon=o.coupon||null;return o};
const nProd=p=>p&&p.id?{id:p.id,n:String(p.n||'Item'),p:+p.p||0,c:p.c||'General',nv:p.nv?1:0,s:p.s===0?0:1,img:p.img||'',kind:p.kind==='food'?'food':'grocery',rating:p.rating||0,time:p.time||0,best:p.best?1:0}:null;

function load(){
 const out={prod:[],subs:[],orders:[],pays:[],expenses:[],meals:{},done:{},mset:{},wallet:{},photos:[],coupons:{...COUPONS},partners:['Raju Bhaiya']};
 let rec=0;
 [KEY,'udala_phase2','udala_final_v1','udala2','udala6','udala7'].forEach(k=>{try{const raw=localStorage.getItem(k);if(!raw)return;const d=JSON.parse(raw);
  (d.prod||[]).forEach(p=>{const n=nProd(p);if(n&&!out.prod.find(x=>x.id===n.id))out.prod.push(n)});
  (d.subs||[]).forEach(s=>{const n=nSub(s);if(n&&!out.subs.find(x=>x.id===n.id)){out.subs.push(n);if(k!==KEY)rec++}});
  (d.orders||[]).forEach(o=>{const n=nOrd(o);if(n&&!out.orders.find(x=>x.id===n.id)){out.orders.push(n);if(k!==KEY)rec++}});
  (d.pays||[]).forEach(p=>{if(p&&p.id&&!out.pays.find(x=>x.id===p.id))out.pays.push(p)});
  (d.expenses||[]).forEach(p=>{if(p&&p.id&&!out.expenses.find(x=>x.id===p.id))out.expenses.push(p)});
  Object.assign(out.meals,d.meals||{});Object.assign(out.done,d.done||{});Object.assign(out.mset,d.mset||{});Object.assign(out.wallet,d.wallet||{});
  if(d.photos)out.photos=d.photos;if(d.coupons)Object.assign(out.coupons,d.coupons);
 }catch(e){}});
 if(!out.prod.length)out.prod=SEED.slice();
 if(!out.prod.some(p=>p.kind==='food')){let m=out.prod.reduce((a,p)=>Math.max(a,p.id),0);FOOD.forEach(f=>{m++;out.prod.push({...f,id:m})})}
 return {data:out,rec};
}
const L=load();let S=L.data;
let ME=null;try{ME=JSON.parse(localStorage.getItem('udme')||'null')}catch(e){}
let tab='plan',C={},OK=0,OV='home',SHOPMODE='food',FCAT='Sab',SQ='',COUPON=null,ADDR=0;

const F={type:'veg',days:'30',name:ME?ME.name:'',phone:ME?ME.phone:'',area:'',addr:'',map:'',notes:'',slot:'default'};

const mf=(d,t)=>{const o=S.mset[iso(d)];if(o){if(t==='nv'&&o.nv)return o.nv;if(t!=='nv'&&o.veg)return o.veg}
 const w=d.getDay();
 if(t==='nv'){if(w===0)return 'Chicken curry, roti, chawal';if(w===3)return 'Fish curry, roti, chawal';if(w===5)return '2 egg curry, roti, chawal';if(w===6)return 'Mutton special'}
 else{if(w===0)return 'Paneer butter masala, roti, chawal';if(w===3)return 'Mushroom curry, roti, chawal';if(w===5)return 'Special thali + meetha';if(w===6)return 'Dal makhani + paneer'}
 return 'Dal, sabzi, roti, chawal'};
const subEnd=s=>addDays(new Date(s.start+'T12:00:00'),s.days);
const stOf=s=>{if(!s)return 'expired';if(s.status==='rejected')return 'rejected';if(s.status==='pending')return 'pending';const t=new Date();t.setHours(12,0,0,0);if(t>=subEnd(s))return 'expired';if(s.pause.includes(todayStr()))return 'paused';if(s.status==='trial')return 'trial';return 'active'};
const live=s=>['active','trial'].includes(stOf(s));
const badge=st=>`<span class="badge ${st}">${st==='active'?'✅ Chalu':st==='pending'?'⏳ Paisa baaki':st==='trial'?'🎁 Trial':st==='paused'?'⏸ Ruka hua':st==='rejected'?'❌ Mana':' Khatam'}</span>`;
const mKey=(id,m)=>todayStr()+'_'+id+'_'+m;
const pack=s=>{const meal=m=>m==='chawal'?'Chawal':m==='both'?'Roti+Chawal':'Roti';return ['Nashta','Lunch: '+meal(s.lunch),'Dinner: '+meal(s.dinner),(s.extraRoti?'Extra roti '+s.extraRoti:null),(s.type==='nv'?'NV curry':'Veg sabzi')].filter(Boolean)};

const step=(id,q)=>`<div style="display:flex;align-items:center;gap:8px;border:2px solid var(--o);border-radius:10px;padding:3px"><button data-a="dec" data-id="${id}" style="width:26px;height:26px;border:0;border-radius:8px;background:var(--o);color:#fff;font-weight:800">−</button><b style="min-width:18px;text-align:center">${q}</b><button data-a="inc" data-id="${id}" style="width:26px;height:26px;border:0;border-radius:8px;background:var(--o);color:#fff;font-weight:800">+</button></div>`;
const couponVal=(code,tot)=>{const c=S.coupons[code.toUpperCase()];if(!c)return{error:'Galat code'};if(new Date(c.expiry)<new Date())return{error:'Code ki time khatam'};if(tot<c.minOrder)return{error:'Kam se kam '+inr(c.minOrder)+' ka order karo'};let d=0;if(c.type==='flat')d=c.discount;else if(c.type==='percent')d=Math.round(tot*c.discount/100);else d=30;return{ok:1,d,code:code.toUpperCase()}};

const V={
plan:()=>{
 const price=PRICING[F.type][F.days]||2899;
 let h=`<div class="card" style="background:linear-gradient(135deg,var(--g),#0F2C21);color:#fff;border:none"><h3 style="color:#FCD34D"> NAMASTE UDALA</h3><p style="font-size:20px;font-weight:900">Ghar jaisa khana, roz time pe</p><p class="s" style="color:#D1FAE5">Aaj ka menu: <b>${esc(mf(new Date(),F.type))}</b></p></div>`;
 // 📸 Aaj ki khana photo (sabke liye)
 const tp=(S.photos||[]).filter(p=>p.date===todayStr());
 if(tp.length)h+=`<div class="card"><h3>📸 Aaj ka khana dekhiye</h3><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">`+tp.map(p=>`<img src="${p.url}" style="width:100%;height:110px;object-fit:cover;border-radius:12px">`).join('')+`</div><p class="s" style="margin-top:6px">Photo ${tp[0].time} bheji gayi thi</p></div>`;

 if(ME){
  const mine=(S.subs||[]).filter(s=>s.phone===ME.phone).sort((a,b)=>b.id-a.id);
  const sub=mine.find(live)||mine[0];
  h+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>👤 ${esc(ME.name)}</b><button class="btn sm r" data-a="logout">Logout</button></div>`;
  if(sub){
   const st=stOf(sub),start=new Date(sub.start+'T12:00:00'),end=subEnd(sub),t=new Date();t.setHours(12,0,0,0);
   const used=clamp(Math.floor((t-start)/86400000),0,sub.days),left=sub.days-used;
   h+=`<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b>${sub.type==='veg'?'🟢 Veg':' Non-Veg'} · ${sub.days} din</b>${badge(st)}</div>
    <div class="s" style="margin-top:4px">📅 ${fmtDate(sub.start)} se ${fmtDate(iso(end))} tak · ⏳ Bache: <b style="color:var(--o)">${left} din</b></div>
    <div class="pbar"><div class="pfill" style="width:${Math.round(used/sub.days*100)}%"></div></div></div>`;
   h+=`<div class="grid2" style="margin:10px 0"><div style="background:#ECFDF5;padding:10px;border-radius:12px;text-align:center"><div style="font-size:17px;font-weight:900;color:#065F46">${inr(sub.wallet||0)}</div><div class="s">Wallet mein paisa</div></div><div style="background:#FEF3C7;padding:10px;border-radius:12px;text-align:center"><div style="font-size:17px;font-weight:900;color:#92400E">${sub.points||0}</div><div class="s">Points</div></div></div>`;

  h+=`</div>`;if(!list.length)h+=`<div class="card"><p class="s">Kuch nahi mila</p></div>`;

  if(un.length){h+=`<div class="card"><h3>🛒 Dukaan ka paisa baaki (${un.length})</h3>`+un.slice(-6).reverse().map(o=>`<div class="row"><div><b>${esc(o.name)}</b><div class="s">${inr(o.total)} · ${o.date}</div></div><button class="btn sm g" data-a="opaid" data-id="${o.id}">💰 Paisa mila</button></div>`).join('')+`</div>`}
  h+=`<div class="card"><h3>📒 Kharcha likho</h3><div style="display:flex;gap:8px"><input id="en" placeholder="Kis cheez par (jaise sabzi)" style="margin:0;flex:1"><input id="ea" type="number" placeholder="₹" style="margin:0;width:90px"></div><button class="btn y" data-a="addExp">➕ Kharcha jodo</button>
   ${(S.expenses||[]).slice(-5).reverse().map(e=>`<div class="row"><span>${esc(e.name)} <span class="s">(${e.d})</span></span><b>${inr(e.amount)}</b></div>`).join('')}</div>`;
 }
 else if(OV==='plans'){
  const all=(S.subs||[]).slice().reverse();
  h+=`<div class="card"><h3>🍱 Sab plans (${all.length})</h3><p class="s">Naam par tap karne ki zaroorat nahi — sab kuch yahi dikh raha hai.</p>`;
  all.forEach(s=>{h+=`<div class="row"><div><b>${esc(s.name)}</b><div class="s">${s.phone} · ${s.type==='veg'?'Veg':'NV'} ${s.days} din · ${inr(s.price)} · ${fmtDate(s.start)} se</div></div>${badge(stOf(s))}</div>`});
  if(!all.length)h+=`<p class="s">Abhi koi plan nahi bana.</p>`;h+=`</div>`;
 }
 else{
  h+=`<div class="card"><h3>🍽️ Kal ka menu likho</h3><input id="mveg" placeholder="Veg (jaise dal, roti, chawal)" value="${esc(mf(addDays(new Date(),1),'veg'))}"><input id="mnv" placeholder="Non-veg" value="${esc(mf(addDays(new Date(),1),'nv'))}"><button class="btn g" data-a="menu">💾 Menu save</button></div>`;
  h+=`<div class="card"><h3>🛒 Nayi cheez jodo</h3><input id="pn" placeholder="Naam (jaise Doodh 1L)" style="margin:0 0 6px"><div style="display:flex;gap:6px"><input id="pp" type="number" placeholder="₹" style="margin:0"><select id="pk" style="margin:0"><option value="grocery">Kirana</option><option value="food">Khana menu</option></select></div><button class="btn y" data-a="addProd">➕ Jodo</button>
   <div style="margin-top:10px">${(S.prod||[]).slice(-6).reverse().map(p=>`<div class="row"><span>${p.kind==='food'?'🍛':'🛒'} ${esc(p.n)}</span><div style="display:flex;gap:6px"><button class="btn sm ${p.s===0?'r':'g'}" data-a="stock" data-id="${p.id}">${p.s===0?'Band':'Chalu'}</button><button class="btn sm r" data-a="delProd" data-id="${p.id}">🗑️</button></div></div>`).join('')}</div></div>`;
  h+=`<div class="card"><h3>🎫 Coupon code</h3>${Object.entries(S.coupons||{}).map(([c,x])=>`<div class="row"><b style="color:var(--warn)">${c}</b><span class="s">${x.type==='percent'?x.discount+'% off':inr(x.discount)+' off'} · ${x.usage}/${x.maxUsage} use</span></div>`).join('')}<button class="btn g" data-a="addCoupon">➕ Naya coupon</button></div>`;
  h+=`<div class="card"><h3>⚙️ Baki setting</h3><div class="s">Delivery wale (comma se):</div><input id="partners" value="${esc((S.partners||[]).join(', '))}"><button class="btn sm g" data-a="partners">💾 Save</button>
   <div class="grid2" style="margin-top:10px"><button class="btn b" data-a="backup" style="margin:0">💾 Backup lo</button><button class="btn g" data-a="restore" style="margin:0">📂 Backup dalo</button></div>
   <button class="btn r" data-a="out" style="margin-top:10px">🚪 Bahar jao (Logout)</button></div>`;
 }
 return h}
};

const render=()=>{try{
 if(!OK&&!['plan','shop'].includes(tab))tab='plan';
 $('#v').innerHTML=V[tab]();
 $('#ht').textContent={plan:'Aaj ka Plan',shop:'Dukaan',kitchen:'Kitchen',delivery:'Delivery',owner:'Malik Panel'}[tab];
 $('#nav').innerHTML=[['plan','🍱','Plan'],['shop','🛍️','Dukaan'],['kitchen','👨‍🍳','Kitchen'],['delivery','🛵','Delivery'],['owner','👤','Malik']].filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>`<div class="${x[0]===tab?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
 const mp=$('#mp2');if(mp)mp.addEventListener('change',e=>uploadPhoto(e));
}catch(e){$('#v').innerHTML=`<div class="card"><h3>⚠️ Dikkat</h3><p class="s">${esc(e.message)}</p><button class="btn g" onclick="location.reload()">🔄 Refresh</button></div>`}};

function uploadPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=ev=>{S.photos.push({id:Date.now(),date:todayStr(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),url:ev.target.result});save();toast('📸 Photo chali gayi! Sab customer ko dikhegi')};
 r.readAsDataURL(f);e.target.value=''}

const needU=()=>{const n=(F.name||'').trim(),p=cleanPhone(F.phone);if(n.length<2){toast('❌ Naam sahi likho','error');return null}if(p.length!==10){toast('❌ 10 number ka phone dalo','error');return null}return{n,p}};
const needG=()=>{if(!F.map){toast('❌ Pehle "Location bhejo" dabao','error');return false}return true};

const A={
 tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const x=prompt(v==='owner'?'Malik PIN:':'PIN:');if(x===null)return;if(!(v==='owner'?x===CONFIG.ownerPin:(x===CONFIG.delivPin||x===CONFIG.ownerPin))){toast('❌ Galat PIN','error');return}OK=1;sessionStorage.setItem('udok','1')}tab=v;render();scrollTo({top:0,behavior:'smooth'})},
 ov:v=>{OV=v;render()},
 shopmode:v=>{SHOPMODE=v;SQ='';FCAT='Sab';render()},
 fcat:v=>{FCAT=v;render()},
 set:(v,k)=>{F[k]=v;render()},
 inc:(v,k,id)=>{C[id]=(C[id]||0)+1;render()},
 dec:(v,k,id)=>{C[id]=Math.max(0,(C[id]||0)-1);if(!C[id])delete C[id];render()},
 goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
 gps:()=>{if(!navigator.geolocation){toast('❌ GPS nahi hai phone mein','error');return}toast('📍 Location dhundh rahe...');navigator.geolocation.getCurrentPosition(p=>{F.map=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;toast('✅ Location aa gayi');render()},()=>toast('❌ Location ki permission do','error'),{enableHighAccuracy:true,timeout:10000})},
 login:()=>{const n=($('#lname')?.value||'').trim(),p=cleanPhone($('#lphone')?.value);if(n.length<2||p.length!==10){toast('❌ Naam aur phone dalo','error');return}ME={name:n,phone:p};localStorage.setItem('udme',JSON.stringify(ME));F.name=n;F.phone=p;render();toast('👤 Swagat hai '+n+'!')},
 logout:()=>{ME=null;localStorage.removeItem('udme');render()},
 meal:(v,k,id,m)=>{S.meals[mKey(id,k)]=v;const s=S.subs.find(x=>x.id==id);if(s&&v==='consumed'){s.streak=(s.streak||0)+1;if(s.streak===30)toast('🎉 30 din! Meetha FREE')}save();toast(v==='consumed'?'✅ Theek hai, mila':'❌ Note kar liya, nahi mila')},
 skipToday:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const i=s.skip.indexOf(todayStr());i>=0?s.skip.splice(i,1):s.skip.push(todayStr());save()},
 pauseAdd:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const n=parseInt(v)||1;if(!s.pause)s.pause=[];let d=addDays(new Date(),1),add=0,g=0;while(add<n&&g<60){const kk=iso(d);if(!s.pause.includes(kk)){s.pause.push(kk);add++}d=addDays(d,1);g++}save();toast(`⏸️ ${add} din khana ruka. Plan ${add} din aage badha.`)},
 unpause:(v,k,id,date)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.pause=s.pause.filter(d=>d!==date);save();toast('▶️ Wo din chalu ho gaya')},
 unpauseAll:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.pause=[];save();toast('▶️ Sab chalu! Khana aayega')},
 topup:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const a=parseInt(v);s.wallet=(s.wallet||0)+a;save();toast(`✅ ₹${a} wallet mein aa gaya`);window.open(`https://wa.me/91${s.phone}?text=💳 Wallet mein ₹${a} dala. Balance: ₹${s.wallet}`,'_blank')},
 autoPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.autoPay=s.autoPay?0:1;save();toast(s.autoPay?'✅ Auto-pay chalu':'⏹ Auto-pay band')},
 invoice:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;
  const html=`<html><head><meta charset="UTF-8"><title>Parchi</title></head><body style="font-family:monospace;padding:20px"><h2>🍱 NAMASTE UDALA</h2><p>Parchi #INV-${s.id}<br>Tareekh: ${todayStr()}<br>Naam: ${esc(s.name)}<br>Phone: ${s.phone}<br>Plan: ${s.type==='veg'?'Veg':'Non-Veg'} ${s.days} din<br>${s.start} se ${iso(subEnd(s))} tak<br><b>Kul paisa: ${inr(s.price)}</b></p><p>Shukriya! </p></body></html>`;
  const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parchi-'+s.name+'.html';a.click();toast('📄 Parchi download ho gayi')},
 coupon:()=>{const c=$('#cin')?.value?.trim();if(!c){toast('❌ Code likho','error');return}const tot=Object.entries(C).reduce((s,[k,q])=>{const p=S.prod.find(x=>x.id==k);return s+(p&&q>0?p.p*q:0)},0);const r=couponVal(c,tot);if(r.ok){COUPON=r.code;toast(`✅ ${r.code} laga! ${inr(r.d)} bacha`)}else toast('❌ '+r.error,'error');render()},
 joinTrial:()=>{const u=needU();if(!u||!needG())return;if((F.addr||'').trim().length<8){toast('❌ Pura pata likho','error');return}
  if((S.subs||[]).find(s=>s.phone===u.p&&s.trial)){toast('❌ Trial pehle le chuke ho','error');return}
  S.subs.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:1,start:todayStr(),price:0,status:'trial',trial:1,paid:1,utr:'FREE',skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,wallet:0,points:0,streak:0,autoPay:0});
  if(!ME){ME={name:u.n,phone:u.p};localStorage.setItem('udme',JSON.stringify(ME))}
  save();toast('🎁 1 din MUFT chalu!');window.open(`https://wa.me/${CONFIG.whatsapp}?text=🎁 *MUFT TRIAL*%0A${u.n} ${u.p}%0A${F.map}`,'_blank')},
 joinPaid:()=>{const u=needU();if(!u||!needG())return;if((F.addr||'').trim().length<8){toast('❌ Pura pata likho','error');return}
  const utr=prompt('💳 Pehle UPI/bank se paisa bhejo, phir payment number (UTR) yahan likho:');if(!utr||utr.trim().length<4){toast('❌ Payment number ke bina plan nahi','error');return}
  const price=PRICING[F.type][F.days]||2899;
  S.subs.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr:utr.trim(),skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,wallet:0,points:0,streak:0,autoPay:0});
  if(!ME){ME={name:u.n,phone:u.p};localStorage.setItem('udme',JSON.stringify(ME))}
  save();toast('⏳ Malik check karega, phir chalu hoga');window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *NAYA PLAN*%0A${u.n} ${u.p}%0A${F.type} ${F.days} din ${inr(price)}%0APayment no: ${utr}%0A${F.map}`,'_blank')},
 order:()=>{const u=needU();if(!u||!needG())return;if((F.addr||'').trim().length<8){toast('❌ Pata likho','error');return}
  const items=[];let tot=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0){items.push({n:p.n,q,p:p.p});tot+=p.p*q}});
  if(!items.length){toast('❌ Pehle kuch ADD karo','error');return}
  let d=0,cc=null;if(COUPON){const r=couponVal(COUPON,tot);if(r.ok){d=r.d;cc=r.code;S.coupons[cc].usage++}}
  S.orders.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,items,total:tot-d,discount:d,coupon:cc,status:'pending',paid:0,date:todayStr()});
  C={};COUPON=null;save();toast('✅ Order mil gaya!');window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *ORDER*%0A${u.n}%0A${items.map(i=>i.n+' x'+i.q).join(', ')}%0A${inr(tot-d)}%0A${F.map}`,'_blank')},
 verify:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;S.pays.push({id:Date.now(),d:todayStr(),name:s.name,amt:s.price,kind:'Plan'});save();toast('✅ Plan chalu kar diya!');window.open(`https://wa.me/91${s.phone}?text=✅ Aapka plan CHALU ho gaya! Shubh ho 🎉`,'_blank')},
 reject:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm(s.name+' ka paisa galat hai?')){s.status='rejected';save();toast('❌ Mana kar diya')}},
 opaid:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(!o)return;o.paid=1;o.status='delivered';S.pays.push({id:Date.now(),d:todayStr(),name:o.name,amt:o.total,kind:'Shop'});save();toast('💰 Paisa mil gaya')},
 addExp:()=>{const n=($('#en')?.value||'').trim(),a=parseInt($('#ea')?.value);if(!n||!a){toast('❌ Naam aur paisa dono likho','error');return}S.expenses.push({id:Date.now(),name:n,amount:a,d:todayStr()});save();toast('✅ Kharcha likh gaya')},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save()},
 odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.status='delivered';save();toast('✅ Diya')}},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),k=($('#pk')?.value)||'grocery';if(!n||!p){toast('❌ Naam aur paisa dalo','error');return}S.prod.push({id:Date.now(),n,p,c:k==='food'?'Khana menu':'Kirana',nv:0,s:1,img:k==='food'?IMG.thali:IMG.grocery,kind:k,rating:4.3,time:25,best:0});save();toast('✅ Cheez jud gayi')},
 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm(p.n+' hatani hai?')){S.prod=S.prod.filter(x=>x.id!=id);save()}},
 addCoupon:()=>{const c=prompt('Coupon code (jaise SAVE50):')?.trim().toUpperCase();if(!c)return;const d=parseInt(prompt('Kitna off? (paisa ya %):')||'0');if(!d)return;const t=prompt('Type likho: flat / percent:')||'flat';S.coupons[c]={discount:d,minOrder:0,expiry:'2026-12-31',type:t,usage:0,maxUsage:100};save();toast('✅ Coupon ban gaya')},
 menu:()=>{S.mset[iso(addDays(new Date(),1))]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save();toast('💾 Kal ka menu save')},
 partners:()=>{S.partners=($('#partners')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);save();toast('💾 Save')},
 copyKitchen:()=>{const k=todayStr(),on=(S.subs||[]).filter(s=>live(s)&&s.start<=k&&!s.skip.includes(k)&&!s.pause.includes(k));
  const t=`🍱 KITCHEN ${k}\nTotal: ${on.length}\nVeg: ${on.filter(s=>s.type==='veg').length} · NV: ${on.filter(s=>s.type==='nv').length}\n\n`+on.map(s=>`• ${s.name} — ${pack(s).join(', ')}`).join('\n');
  navigator.clipboard.writeText(t).then(()=>toast('📋 Copy ho gaya')).catch(()=>toast('❌ Copy nahi hua','error'))},
 report:()=>{const k=todayStr(),lv=(S.subs||[]).filter(s=>live(s)&&s.start<=k);const dn=lv.filter(s=>S.done[k+'_'+s.id]).length;
  const todayPay=(S.pays||[]).filter(p=>p.d===k).reduce((a,p)=>a+(+p.amt||0),0);
  const t=`📊 *DIN KA HISAAB* ${k}\n🍱 Chalu plans: ${lv.length}\n🛵 Delivery: ${dn}/${lv.length}\n💰 Aaj paisa aaya: ${inr(todayPay)}\n🛒 Orders: ${(S.orders||[]).filter(o=>o.date===k).length}`;
  navigator.clipboard.writeText(t).then(()=>toast('📋 Report copy! WhatsApp pe paste karo')).catch(()=>toast('❌ Copy nahi hua','error'))},
 backup:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+todayStr()+'.json';a.click();toast('💾 Backup mil gaya — safe rakho')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render();toast('🚪 Bahar aa gaye')}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id,b.dataset.date)}catch(err){toast('❌ Dikkat aayi','error')}}});
document.addEventListener('input',e=>{const f=e.target.dataset?.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone);return}
 if(e.target.id==='sq'){SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}});
$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
 (d.subs||[]).forEach(s=>{const n=nSub(s);if(n&&!S.subs.find(x=>x.id===n.id))S.subs.push(n)});
 (d.orders||[]).forEach(o=>{const n=nOrd(o);if(n&&!S.orders.find(x=>x.id===n.id))S.orders.push(n)});
 (d.prod||[]).forEach(p=>{const n=nProd(p);if(n&&!S.prod.find(x=>x.id===n.id))S.prod.push(n)});
 (d.pays||[]).forEach(p=>{if(p&&p.id&&!S.pays.find(x=>x.id===p.id))S.pays.push(p)});
 save();toast('✅ Backup lag gaya')}catch(err){toast('❌ Galat file','error')}};r.readAsText(f);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Malik PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';OV='home';render();toast('🔓 Swagat boss!')}else toast('❌ Galat PIN','error')}});
render();
if(L.rec>0)setTimeout(()=>toast(`📦 Purana data aa gaya: ${L.rec} records`),600);
</script>
