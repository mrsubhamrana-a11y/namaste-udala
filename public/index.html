};

const render=()=>{
 try{
  if(!OK&&!['plan','shop'].includes(tab))tab='plan';
  $('#v').innerHTML=VIEWS[tab]();
  $('#ht').textContent={plan:'Aaj ka Plan',shop:'Shop',kitchen:'Kitchen',delivery:'Delivery',owner:'Owner Panel'}[tab];
  $('#nav').innerHTML=[['plan','🍱','Plan'],['shop','🛒','Shop'],['kitchen','👨🍳','Kitchen'],['delivery','🛵','Delivery'],['owner','👤','Owner']].filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>`<div class="${x[0]===tab?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
 }catch(err){

const needGPS=()=>{if(!F.map){showToast('❌ Pehle GPS location lein','error');return false}return true};
const needUser=()=>{const n=(F.name||'').trim(),p=cleanPhone(F.phone);if(n.length<2){showToast('❌ Sahi naam likhein','error');return null}if(p.length!==10){showToast('❌ 10 digit phone daalein','error');return null}return {n,p}};

const ACTIONS={
 tab:v=>{
  if(['kitchen','delivery','owner'].includes(v)&&!OK){
   const x=prompt(v==='owner'?'Owner PIN:':'PIN (Delivery/Kitchen):');
   if(x===null)return;
   const ok=v==='owner'?(x===CONFIG.ownerPin):(x===CONFIG.delivPin||x===CONFIG.ownerPin);
   if(!ok){showToast('❌ Galat PIN','error');return}
   OK=1;sessionStorage.setItem('udok','1');showToast('🔓 Access granted');
  }
  tab=v;render();window.scrollTo({top:0,behavior:'smooth'})},
 osec:v=>{OSEC=v;render()},
 set:(v,k)=>{F[k]=v;render()},
 inc:(v,k,id)=>{C[id]=(C[id]||0)+1;render()},
 dec:(v,k,id)=>{C[id]=Math.max(0,(C[id]||0)-1);if(!C[id])delete C[id];render()},
 goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
 gps:()=>{if(!navigator.geolocation){showToast('❌ GPS support nahi','error');return}
  showToast('📍 Location dhoondh rahe hain...');
  navigator.geolocation.getCurrentPosition(p=>{F.map=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;showToast('✅ Location lock ho gayi');render()},()=>showToast('❌ Location permission allow karein','error'),{enableHighAccuracy:true,timeout:10000})},
 login:()=>{const n=($('#lname')?.value||'').trim(),p=cleanPhone($('#lphone')?.value);
  if(n.length<2||p.length!==10){showToast('❌ Naam aur 10 digit phone daalo','error');return}
  ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();showToast(' Login ho gaya')},
 logout:()=>{ME=null;saveME();render();showToast('Logout ho gaya')},
 mealMark:(v,k,id)=>{S.meals[mealKey(id,k)]=v;save();showToast(v==='consumed'?'✅ Khaya mark ho gaya':'❌ Skip mark ho gaya')},
 skipToday:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const k2=todayStr();const i=s.skip.indexOf(k2);if(i>=0)s.skip.splice(i,1);else s.skip.push(k2);save()},
 joinTrial:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Pura address daalein','error');return}
  const had=(S.subs||[]).find(s=>s.phone===u.p&&s.trial);
  if(had){showToast('❌ Trial pehle hi le chuke hain','error');return}
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:1,start:todayStr(),price:0,status:'trial',trial:1,paid:1,utr:'FREE_TRIAL',skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save();showToast('🎁 1 din ka FREE trial ACTIVE!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🎁 *FREE TRIAL*%0A👤 ${u.n}%0A📱 ${u.p}%0A📍 ${F.map}`,'_blank')},
 joinPaid:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Pura address daalein','error');return}
  const utr=prompt('💳 Payment karke UTR / Transaction ID likhein:');

  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save();showToast('⏳ Plan bana! Owner verify karega tab active hoga');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *NAYA PLAN (PENDING)*%0A👤 ${u.n}%0A📱 ${u.p}%0A🍽️ ${F.type} ${F.days} din%0A💰 ${inr(price)}%0A🔢 UTR: ${utr}%0A📍 ${F.map}`,'_blank')},
 order:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const items=[];let tot=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0){items.push({n:p.n,q,p:p.p});tot+=p.p*q}});

  C={};save();showToast('✅ Order mil gaya!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *ORDER*%0A👤 ${u.n}%0A📦 ${items.map(i=>i.n+' x'+i.q).join(', ')}%0A💰 ${inr(tot)}%0A📍 ${F.map}`,'_blank')},
 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;
  S.pays.push({id:Date.now(),d:todayStr(),name:s.name,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});save();showToast('✅ Verified! Plan ACTIVE')},
 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm(s.name+' ka plan reject karein?')){s.status='rejected';save();showToast('❌ Reject ho gaya')}},
 orderPaid:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(!o)return;o.paid=1;o.status='delivered';

 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save()},
 odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.status='delivered';save();showToast('✅ Delivered')}},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim();
  if(!n||!p||p<=0){showToast('❌ Naam aur price daalo','error');return}

 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);save()}},
 setMenu:()=>{const k=iso(addDays(new Date(),1));S.mset[k]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save();showToast('💾 Menu save')},
 setPartners:()=>{S.partners=($('#partners')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);save();showToast('💾 Partners save')},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));
  const veg=on.filter(s=>s.type==='veg').length,nv=on.filter(s=>s.type==='nv').length;
  const t=`🍱 KITCHEN ${k}\n👥 Total: ${on.length}\n🟢 Veg: ${veg}\n🔴 NV: ${nv}\n\n`+on.map(s=>`• ${s.name} (${s.type}) - ${packItems(s).join(', ')}`).join('\n');
  navigator.clipboard.writeText(t).then(()=>showToast('📋 Copy ho gaya!')).catch(()=>showToast('❌ Copy nahi hua','error'))},
 backup:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup download ho gaya')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render();showToast('🚪 Logout')}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACTIONS[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(err){console.error(err);showToast('❌ Error','error')}}});
document.addEventListener('input',e=>{const f=e.target.dataset?.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone)}});
$('#restoreFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);S=mergeStates(S,d);save();showToast('✅ Backup restore ho gaya!')}catch(err){showToast('❌ Galat backup file','error')}};
 rd.readAsText(file);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Owner PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();showToast('🔓 Owner access')}else showToast('❌ Galat PIN','error')}});

render();
if(loaded.fromOld&&loaded.recovered>0)setTimeout(()=>showToast(`📦 Purana data recover hua: ${loaded.recovered} records!`),800);
console.log('🍱 Namaste Udala FINAL loaded. Storage:',STORAGE_KEY);
</script>
</body>
</html>
