
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Namaste Udala — Mera Tiffin · Multi-Vendor Food · Sauda & Daily Needs</title>
<meta name="theme-color" content="#113221" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Namaste Udala" />
<link id="pwaManifestLink" rel="manifest" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f3eb;
    --sf: #ffffff;
    --sf2: #efe9dc;
    --ink: #13221a;
    --mu: #5f6d65;
    --ln: #dfd6c3;
    --o: #e11d48;
    --o2: #be123c;
    --g: #113221;
    --g2: #15803d;
    --amb: #d97706;
    --serif: 'Fraunces', Georgia, serif;
    --sh-card: 0 14px 28px -8px rgba(19,34,26,.12), inset 0 1px 0 #fff;
    --sh-3d-o: 0 4px 0 #9f1239, 0 10px 20px rgba(225,29,72,.28);
    --sh-3d-g: 0 4px 0 #071910, 0 10px 20px rgba(17,50,33,.25);
  }
  [data-theme=dark] {
    --bg: #0b120e; --sf: #142019; --sf2: #1b2a21; --ink: #f3efe6; --mu: #9ca89f; --ln: #26382d;
    --sh-card: 0 16px 32px -8px rgba(0,0,0,.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 12% 4%, rgba(225,29,72,.08), transparent 36%),
                radial-gradient(circle at 88% 92%, rgba(21,128,61,.08), transparent 36%),
                var(--bg);
    color: var(--ink);
    padding-bottom: 135px;
    min-height: 100vh;
  }
  img { display: block; object-fit: cover; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 60;
    background:
      radial-gradient(circle at 15% 20%, rgba(251,191,36,.18), transparent 42%),
      radial-gradient(circle at 88% 80%, rgba(244,63,94,.24), transparent 46%),
      linear-gradient(135deg, #0b2217 0%, #153b28 55%, #2b0f1b 100%);
    backdrop-filter: blur(12px);
    color: #fff; padding: 11px 14px;
    border-bottom: 1px solid rgba(251,191,36,.24);
    box-shadow: 0 12px 28px rgba(10,28,19,.42), inset 0 1px 0 rgba(255,255,255,.18);
    display: flex; align-items: center; gap: 10px;
  }
  .hdr-sub-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(251,191,36,.16); border: 1px solid rgba(251,191,36,.35);
    color: #fde68a; font-size: 8.5px; font-weight: 800; padding: 2px 7px; border-radius: 99px;
    margin-left: 6px; vertical-align: middle;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(145deg, #f43f5e, #be123c);
    display: grid; place-items: center; font-family: var(--serif); font-weight: 800; font-size: 16px; color: #fff;
    box-shadow: 0 4px 0 #881337; cursor: pointer; flex: none;
  }
  .logo:active { transform: translateY(2px); box-shadow: 0 1px 0 #881337; }
  .brand { flex: 1; min-width: 0; }
  .brand small { display: block; color: #fbbf24; font-size: 9px; letter-spacing: 1.4px; font-weight: 800; }
  .brand h1 { font-family: var(--serif); font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb-pill { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.12); color: #a7f3d0; }

  /* Role Quick Bar (Hidden) */
  .role-strip {
    display: none !important;
  }
  .role-strip::-webkit-scrollbar { display: none; }
  .role-strip button {
    flex: none; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #e2e8f0;
    padding: 5px 10px; border-radius: 99px; font-size: 10.5px; font-weight: 800; cursor: pointer;
  }
  .role-strip button.on { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }

  main { max-width: 720px; margin: 0 auto; padding: 14px; }

  /* Cards */
  .card {
    background: var(--sf); border: 1px solid var(--ln); border-radius: 22px;
    padding: 15px; margin-bottom: 14px; box-shadow: var(--sh-card);
  }
  .card h3 {
    font-family: var(--serif); font-size: 16px; font-weight: 800; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .p-green { background: #dcfce7; color: #166534; }
  .p-red { background: #ffe4e6; color: #9f1239; }
  .p-amber { background: #fef3c7; color: #92400e; }
  .p-blue { background: #dbeafe; color: #1e40af; }
  .p-dark { background: #0f172a; color: #fff; }

  /* 3D Pop-Out Hero Banners */
  .hero {
    position: relative; border-radius: 24px; padding: 18px; margin: 8px 0 18px; color: #fff;
    overflow: visible; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 14px 28px rgba(17,50,33,.28);
  }
  .hero.tiffin-bg { background: linear-gradient(135deg, #881337 0%, #e11d48 100%); }
  .hero.food-bg { background: linear-gradient(135deg, #78350f 0%, #d97706 100%); }
  .hero.kirana-bg { background: linear-gradient(135deg, #064e3b 0%, #15803d 100%); }
  .hero h2 { font-family: var(--serif); font-size: 19px; line-height: 1.2; margin: 4px 0; }
  .hero p { font-size: 11.5px; opacity: .94; }
  .hero-pop {
    width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255,255,255,.92); flex: none;
    transform: translateY(-10px) scale(1.08);
    box-shadow: 0 18px 26px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.12);
    transition: transform .25s ease;
  }
  .hero:hover .hero-pop { transform: translateY(-14px) scale(1.13) rotate(-3deg); }

  /* Buttons & Inputs */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 99px; padding: 11px 16px; font-weight: 800; font-size: 12.5px;
    cursor: pointer; text-decoration: none; transition: transform .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn.full { width: 100%; margin-top: 8px; }
  .btn.o { background: linear-gradient(180deg, #f43f5e, #be123c); color: #fff; box-shadow: var(--sh-3d-o); }
  .btn.g { background: linear-gradient(180deg, #16a34a, #113221); color: #fff; box-shadow: var(--sh-3d-g); }
  .btn.amb { background: linear-gradient(180deg, #fbbf24, #d97706); color: #0f172a; }
  .btn.w { background: var(--sf2); color: var(--ink); border: 1px solid var(--ln); }
  .btn.r { background: #ffe4e6; color: #9f1239; border: 1px solid #fecdd3; }
  .btn.sm { padding: 6px 11px; font-size: 11px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .btn-row > * { flex: 1; }

  .inp {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--ln); border-radius: 13px;
    background: var(--sf2); color: var(--ink); font-weight: 700; font-size: 12.5px; margin: 4px 0; outline: none;
  }
  .inp:focus { border-color: var(--o); background: var(--sf); }
  .lbl { display: block; font-size: 10px; font-weight: 800; color: var(--mu); margin: 8px 0 3px; text-transform: uppercase; letter-spacing: .5px; }

  .seg { display: flex; gap: 4px; background: var(--sf2); padding: 4px; border-radius: 99px; margin: 4px 0; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 99px; font-size: 11px; font-weight: 800; color: var(--mu); cursor: pointer; }
  .seg button.on { background: var(--g); color: #fff; }

  /* Tiffin Plans Grid */
  .plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin: 10px 0; }
  .p-tier {
    border: 2px solid var(--ln); border-radius: 18px; padding: 12px 10px; text-align: center;
    background: var(--sf2); cursor: pointer; position: relative; transition: .15s;
  }
  .p-tier.on { border-color: var(--o); background: #fff1f2; transform: translateY(-2px); box-shadow: 0 8px 18px rgba(225,29,72,.18); }
  [data-theme=dark] .p-tier.on { background: #2c121b; }
  .p-tier .tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--g); color: #fbbf24; font-size: 8.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .p-tier.on .tag { background: var(--o); color: #fff; }
  .p-tier b { display: block; font-family: var(--serif); font-size: 19px; color: var(--o); margin: 3px 0; }

  /* Restaurant Cards */
  .rest-card {
    border: 1px solid var(--ln); border-radius: 20px; overflow: hidden; background: var(--sf);
    margin-bottom: 14px; box-shadow: var(--sh-card); cursor: pointer; transition: transform .18s;
  }
  .rest-card:hover { transform: translateY(-3px); }
  .rest-cover { position: relative; height: 145px; background: #1e293b; }
  .rest-cover img { width: 100%; height: 100%; }
  .rest-status { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .rest-eta { position: absolute; bottom: 10px; right: 10px; background: rgba(15,23,42,.85); color: #fff; padding: 4px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .rest-body { padding: 12px 14px; }
  .rest-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rest-rating { background: #15803d; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; }

  /* Product Cards & 3D Pop-Out Dish Frame */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pcard {
    border: 1px solid var(--ln); border-radius: 20px; padding: 10px; background: var(--sf);
    box-shadow: var(--sh-card); display: flex; flex-direction: column; justify-content: space-between;
    overflow: visible; margin-top: 6px;
  }
  .pimg {
    position: relative; height: 118px; border-radius: 16px; overflow: visible;
    background: radial-gradient(circle at 50% 45%, #fffbeb 0%, #fde68a 60%, #f59e0b 100%);
    margin-bottom: 10px; cursor: pointer; display: grid; place-items: center;
  }
  [data-theme=dark] .pimg {
    background: radial-gradient(circle at 50% 45%, #29352d 0%, #17221b 100%);
  }
  .pimg img {
    width: 106%; height: 124px; border-radius: 16px;
    transform: translateY(-8px);
    box-shadow: 0 14px 20px -6px rgba(19,34,26,.38);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .pcard:hover .pimg img, .pcard:active .pimg img {
    transform: translateY(-13px) scale(1.05);
    box-shadow: 0 20px 26px -6px rgba(19,34,26,.48);
  }
  .sym { display: inline-grid; place-items: center; width: 13px; height: 13px; border: 2px solid #16a34a; border-radius: 3px; background: #fff; flex: none; }
  .sym i { width: 5px; height: 5px; border-radius: 50%; background: #16a34a; }
  .sym.nv { border-color: #dc2626; } .sym.nv i { background: #dc2626; }
  .qty { display: flex; align-items: center; justify-content: space-between; background: var(--sf2); padding: 3px; border-radius: 99px; margin-top: 6px; }
  .qty button { width: 27px; height: 27px; border-radius: 50%; border: 0; background: var(--o); color: #fff; font-weight: 800; cursor: pointer; }

  /* Chips & Progress */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--ln); background: var(--sf); font-size: 11px; font-weight: 800; cursor: pointer; }
  .chips button.on { background: var(--g); color: #fbbf24; border-color: var(--g); }
  .pbar { height: 8px; background: var(--sf2); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #e11d48, #16a34a); transition: width .25s; }

  /* Tables, Timeline & Rows */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--ln); font-size: 12px; }
  .row:last-child { border-bottom: 0; }
  .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi div { background: var(--sf); border: 1px solid var(--ln); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: var(--sh-card); }
  .kpi b { display: block; font-family: var(--serif); font-size: 17px; color: var(--o); }
  .kpi span { font-size: 9.5px; font-weight: 800; color: var(--mu); text-transform: uppercase; }
  .tl { display: flex; gap: 4px; margin: 6px 0; }
  .tl span { flex: 1; text-align: center; font-size: 9px; font-weight: 800; padding: 4px 2px; border-radius: 8px; background: var(--sf2); color: var(--mu); }
  .tl span.done { background: #dcfce7; color: #166534; }
  .tl span.now { background: #fbbf24; color: #0f172a; }

  /* Floating Cart & Bottom Nav */
  .cbar {
    position: fixed; left: 12px; right: 12px; bottom: 76px; z-index: 70; max-width: 680px; margin: 0 auto;
    background: linear-gradient(135deg, #15803d, #0f291c); color: #fff; border-radius: 99px;
    padding: 11px 18px; display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; font-weight: 800; box-shadow: 0 10px 24px rgba(15,41,28,.4); cursor: pointer;
  }
  nav {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 80; max-width: 700px; margin: 0 auto;
    background: var(--sf); border: 1px solid var(--ln); border-radius: 99px;
    display: flex; gap: 3px; padding: 5px; box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  nav button {
    flex: 1; border: 0; background: transparent; border-radius: 99px; padding: 7px 2px;
    font-size: 9.5px; font-weight: 800; color: var(--mu); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
  }
  nav button.on { background: var(--g); color: #fbbf24; }
  nav .nb { position: absolute; top: 2px; right: 16%; background: var(--o); color: #fff; font-size: 8.5px; padding: 1px 5px; border-radius: 99px; }

  /* Modal Sheet & Toast */
  .ov { position: fixed; inset: 0; z-index: 200; background: rgba(11,22,16,.78); backdrop-filter: blur(5px); display: flex; align-items: flex-end; justify-content: center; }
  .sh { background: var(--sf); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 18px; animation: sUp .2s ease-out; }
  @keyframes sUp { from { transform: translateY(100%); } }
  #toast {
    position: fixed; left: 50%; bottom: 132px; transform: translateX(-50%) translateY(20px);
    background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 12px; font-weight: 800;
    z-index: 900; opacity: 0; pointer-events: none; transition: .22s; text-align: center; max-width: 90vw;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; width: 58mm; font-family: monospace; font-size: 11px; color: #000; background: #fff; padding: 4px; }
  }

  /* ==================== ENHANCED 3D POP-OUT & DEPTH SYSTEM ==================== */
  header {
    border-bottom: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 28px rgba(11,34,22,.38), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .logo {
    transform: perspective(400px) rotateY(-8deg);
    box-shadow: 3px 5px 0 #881337, 0 12px 20px rgba(225,29,72,.38), inset 0 2px 2px rgba(255,255,255,.45);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .logo:hover { transform: perspective(400px) rotateY(0deg) scale(1.06); }

  .card {
    box-shadow: 0 16px 32px -10px rgba(19,34,26,.16), 0 3px 0 rgba(223,214,195,.85), inset 0 1.5px 0 #fff;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  [data-theme=dark] .card {
    box-shadow: 0 18px 34px -8px rgba(0,0,0,.72), 0 3px 0 #080e0a, inset 0 1px 0 rgba(255,255,255,.07);
  }

  /* 3D Hero Stage with Floating Pop-Out Plate & Ambient Rim */
  .hero {
    transform-style: preserve-3d;
    perspective: 900px;
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 18px 34px -8px rgba(17,50,33,.38), 0 6px 0 rgba(15,23,42,.22), inset 0 1.5px 0 rgba(255,255,255,.32);
    margin: 14px 0 22px;
  }
  .hero-pop-wrap {
    position: relative;
    flex: none;
    transform-style: preserve-3d;
  }
  .hero-pop-wrap::after {
    content: "";
    position: absolute;
    left: 12%; right: 12%; bottom: -8px; height: 14px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, transparent 72%);
    filter: blur(3px);
    z-index: 0;
  }
  .hero-pop {
    position: relative;
    z-index: 1;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: 3.5px solid rgba(255,255,255,.95);
    transform: translateY(-14px) translateZ(28px) scale(1.1);
    box-shadow: 0 22px 28px -6px rgba(0,0,0,.52), 0 0 0 6px rgba(255,255,255,.15), inset 0 2px 6px rgba(255,255,255,.4);
    animation: float3d 3.6s ease-in-out infinite;
  }
  @keyframes float3d {
    0%, 100% { transform: translateY(-14px) scale(1.1) rotate(0deg); }
    50% { transform: translateY(-20px) scale(1.13) rotate(-2.5deg); }
  }

  /* Rising Steam Effect on Hot Meals */
  .steam-wrap {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: none; z-index: 3;
  }
  .steam-wrap i {
    width: 4px; height: 16px; border-radius: 99px;
    background: rgba(255,255,255,.72); filter: blur(1.5px);
    animation: steamUp 2.2s ease-in-out infinite;
  }
  .steam-wrap i:nth-child(2) { animation-delay: .6s; height: 20px; }
  .steam-wrap i:nth-child(3) { animation-delay: 1.2s; }
  @keyframes steamUp {
    0% { opacity: 0; transform: translateY(6px) scaleY(.7); }
    50% { opacity: .85; }
    100% { opacity: 0; transform: translateY(-14px) scaleY(1.2); }
  }

  /* 3D Pop-Out Dish Cards & Contact Shadow Pedestal */
  .pcard {
    position: relative;
    transform-style: preserve-3d;
    border: 1.5px solid var(--ln);
    box-shadow: 0 16px 26px -10px rgba(19,34,26,.18), 0 4px 0 rgba(223,214,195,.9), inset 0 1.5px 0 #fff;
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
    margin-top: 12px;
  }
  [data-theme=dark] .pcard {
    box-shadow: 0 18px 28px -8px rgba(0,0,0,.7), 0 4px 0 #09100c, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .pcard:hover {
    transform: translateY(-5px);
    box-shadow: 0 24px 34px -10px rgba(19,34,26,.26), 0 6px 0 rgba(223,214,195,.95), inset 0 1.5px 0 #fff;
  }
  .pimg {
    position: relative; height: 122px; border-radius: 18px; overflow: visible;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #fef3c7 55%, #f59e0b 100%);
    box-shadow: inset 0 -10px 18px rgba(180,83,9,.18), inset 0 2px 4px rgba(255,255,255,.85);
    margin-bottom: 12px; cursor: pointer; display: grid; place-items: center;
  }
  [data-theme=dark] .pimg {
    background: radial-gradient(circle at 50% 42%, #314237 0%, #16221b 100%);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.12);
  }
  .pimg::after {
    content: "";
    position: absolute; bottom: 4px; left: 14%; right: 14%; height: 12px;
    background: radial-gradient(ellipse at center, rgba(19,34,26,.45) 0%, transparent 74%);
    filter: blur(2.5px);
    z-index: 0;
    transition: transform .22s ease, opacity .22s ease;
  }
  .pimg img {
    position: relative; z-index: 1;
    width: 108%; height: 128px; border-radius: 18px;
    transform: translateY(-12px) scale(1.02);
    border: 2px solid rgba(255,255,255,.85);
    box-shadow: 0 18px 24px -8px rgba(19,34,26,.46), 0 4px 10px rgba(0,0,0,.18);
    transition: transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s ease;
  }
  .pcard:hover .pimg img, .pcard:active .pimg img {
    transform: translateY(-18px) scale(1.07) rotate(-1.5deg);
    box-shadow: 0 26px 32px -8px rgba(19,34,26,.56), 0 6px 14px rgba(0,0,0,.22);
  }
  .pcard:hover .pimg::after {
    transform: scaleX(.86);
    opacity: .65;
  }

  /* 3D Extruded Plan Tiers & Restaurant Cards */
  .p-tier {
    box-shadow: 0 5px 0 var(--ln), 0 10px 16px rgba(19,34,26,.08);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .p-tier.on {
    box-shadow: 0 5px 0 #be123c, 0 14px 24px rgba(225,29,72,.26);
    transform: translateY(-3px);

function autoPrioritySort(orders) {
  const rank = {
    "Placed": 1,
    "Verify Hold": 1,
    "Confirmed": 2,
    "Cooking": 3,
    "Ready for Pickup": 4,
    "Out for Delivery": 5,
    "Delivered": 6,
    "Cancelled": 7
  };
  return (orders || []).slice().sort((a, b) => {
    const rDiff = (rank[a.status] || 9) - (rank[b.status] || 9);
    if (rDiff !== 0) return rDiff;
    if (S.v154 && S.v154.prepaidDispatchPriority) {
      const aPre = a.payMode === "UPI" ? 0 : 1;
      const bPre = b.payMode === "UPI" ? 0 : 1;
      if (aPre !== bPre) return aPre - bPre;
    }
    if (S.v155 && S.v155.hospitalAreaPriority) {
      const aHosp = a.area === "Hospital Rd" ? 0 : 1;
      const bHosp = b.area === "Hospital Rd" ? 0 : 1;
      if (aHosp !== bHosp) return aHosp - bHosp;
    }
    return 0;
  });
}

function validateStrictUTR(raw, usedList) {
  const clean = String(raw || "").replace(/\D/g, "");
  if (clean.length !== 12) return { ok: false, msg: "⚠️ Exact 12-digit UPI UTR number daalein!" };
  if (/^(\d)\1{6,}/.test(clean) || /(012345|123456|234567|345678|456789|987654|654321)/.test(clean)) {
    return { ok: false, msg: "⚠️ Fake sequence UTR blocked! Asli bank UTR daalein." };
  }
  if ((usedList || []).includes(clean)) return { ok: false, msg: "⚠️ Duplicate UTR! Yeh UTR pehle use ho chuka hai." };
  return { ok: true, utr: clean };
}

function hashDataUrl(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i += Math.max(1, Math.floor(s.length / 400))) {
    h = ((h << 5) + h) ^ s.charCodeAt(i);
  }
  return "H-" + (h >>> 0).toString(16);
}

function compressImageFileToDataUrl(file, maxSize = 480, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width || 1, img.height || 1));
        const w = Math.max(1, Math.round((img.width || 300) * scale));
        const h = Math.max(1, Math.round((img.height || 300) * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function tiffinDateTimeline(s) {
  const dStart = esc(s.date || todayIso());
  const tStart = esc(s.time || "08:00 AM");
  const rem = +s.remaining || 0;
  const tot = +s.days || 1;
  let stateCls = "now";
  let stateLbl = "⏳ Pending Drop";
  if (s.skipToday) {
    stateCls = "done";
    stateLbl = "⏭ Skipped (+1d)";
  } else if (+(s.vacationDays || 0) > 0) {
    stateCls = "now";
    stateLbl = `🏖 Pause (${s.vacationDays}d)`;
  } else if (s.deliveredToday) {
    stateCls = "done";
    stateLbl = "✅ Delivered";
  }
  return `
    <div style="font-size:10px;color:var(--mu);font-weight:700;margin-top:4px">📅 Start: <b>${dStart}</b> · 🕒 ${tStart} · Days: <b>${rem}/${tot}</b></div>
    <div class="tl">
      <span class="done">📅 ${dStart}</span>
      <span class="${stateCls}">${stateLbl}</span>
      <span class="${rem > 0 ? "now" : "done"}">🍱 ${rem}d Left</span>
    </div>
  `;
}

function statusTimeline(st, isKirana = false) {
  const steps = isKirana
    ? ["Placed", "Packed", "Ready for Pickup", "Out for Delivery", "Delivered"]
    : ["Placed", "Confirmed", "Cooking", "Ready for Pickup", "Out for Delivery", "Delivered"];
  const norm = st === "Verify Hold" ? "Placed" : st;
  const idx = steps.indexOf(norm);
  if (st === "Cancelled") return `<div class="tl"><span style="background:#ffe4e6;color:#9f1239">❌ Cancelled</span></div>`;
  return `<div class="tl">${steps.map((s, i) =>
    `<span class="${i < idx ? "done" : i === idx ? "now" : ""}">${s === "Ready for Pickup" ? "Ready" : s === "Out for Delivery" ? "On Way" : s}</span>`
  ).join("")}</div>`;
}

function calcTiffinPrice(diet, days, slot) {
  ensureV150_30Defaults();
  const base = +(S.cfg.tiffinRates[diet]?.[days] || 920);
  const bfTotal = (+S.cfg.tiffinRates.breakfastPerDay || 40) * days;
  const proteinExtra = S.v150.proteinAddonActive ? ((+S.v150.proteinAddonPrice || 20) * days) : 0;
  if (slot === "Morning Breakfast (7:30 AM)") return bfTotal + proteinExtra;
  if (slot === "Breakfast + Lunch") return bfTotal + base + proteinExtra;
  if (slot === "Lunch + Dinner") return Math.round(base * 1.85) + proteinExtra;
  if (slot === "All 3 Meals (B+L+D)") return bfTotal + Math.round(base * 1.85) + proteinExtra;
  return base + proteinExtra;
}

function sanitizeAllCatalogAndOrders() {
  let fixed = 0;
  if (!Array.isArray(S.usedUtrs)) { S.usedUtrs = []; fixed++; }
  else {
    const uniqUtrs = [...new Set(S.usedUtrs.map(u => String(u || "").replace(/\D/g, "")).filter(u => u.length === 12))];
    if (uniqUtrs.length !== S.usedUtrs.length) { S.usedUtrs = uniqUtrs; fixed++; }
  }
  if (!Array.isArray(S.usedImgHashes)) { S.usedImgHashes = []; fixed++; }
  if (!Array.isArray(S.auditLog)) { S.auditLog = []; fixed++; }
  const validVids = new Set((S.vendors || []).map(v => v.id));
  (S.foodItems || []).forEach(it => {
    if (!(+it.price > 0)) { it.price = 50; fixed++; }
    if (!it.vendorId || !validVids.has(it.vendorId)) { it.vendorId = "v_self_kitchen"; fixed++; }
    if (!it.img) { it.img = autoMatch3DImage(it.name, it.cat, it.desc); fixed++; }
  });
  (S.kiranaItems || []).forEach(it => {
    if (!(+it.price > 0)) { it.price = 50; fixed++; }
    if (!it.vendorId || !validVids.has(it.vendorId)) { it.vendorId = "v_self_kirana"; fixed++; }
    if (!it.img) { it.img = autoMatch3DImage(it.name, it.cat, it.desc); fixed++; }
  });
  (S.tiffinSubs || []).forEach(s => {
    if (!s.date) { s.date = todayIso(); fixed++; }
    if (!s.time) { s.time = "08:00 AM"; fixed++; }
    if ((+s.remaining || 0) < 0) { s.remaining = 0; fixed++; }
    if (!s.area || !UDALA_AREAS.includes(s.area)) { s.area = "Udala Bus Stand"; fixed++; }
  });
  [...(S.foodOrders || []), ...(S.kiranaOrders || [])].forEach(o => {
    if (!o.date) { o.date = todayIso(); fixed++; }
    if (!o.time) { o.time = "12:00 PM"; fixed++; }
    if (!Array.isArray(o.items)) { o.items = []; fixed++; }
    if ((+o.total || 0) < 0) { o.total = 0; fixed++; }
  });
  (S.expenses || []).forEach(e => {
    if (!e.date) { e.date = todayIso(); fixed++; }
  });
  (S.fuelLogs || []).forEach(f => {
    if (!f.date) { f.date = todayIso(); fixed++; }
  });
  return fixed;
}

function awardCustomerLoyaltyPts(phone, orderTotal) {
  ensureV145_30Defaults();
  ensureV146_30Defaults();
  const p = ph(phone);
  if (!p || p.length !== 10) return 0;
  let earned = Math.floor(((+orderTotal || 0) / 100) * (+S.v145.loyaltyPtsPer100 || 5));
  const pastCount = [...(S.foodOrders || []), ...(S.kiranaOrders || [])].filter(o => ph(o.phone) === p && o.status !== "Cancelled").length;
  if (pastCount === (+S.v146.vipRepeatThreshold || 5)) {
    earned += (+S.v146.vipBonusPts || 25);
  }
  if (earned > 0) {
    S.v145.loyaltyPointsByPhone = S.v145.loyaltyPointsByPhone || {};
    S.v145.loyaltyPointsByPhone[p] = (+S.v145.loyaltyPointsByPhone[p] || 0) + earned;
  }
  return earned;
}

function getDailyTargetProgressPct() {
  ensureV145_30Defaults();
  const s = getOwnerNetCashSummary();
  const totalToday = (+s.gmv || 0) + (+s.tiffinRev || 0);
  const tgt = Math.max(1, +S.v145.dailySalesTarget || 5000);
  return Math.min(100, Math.round((totalToday / tgt) * 100));
}

/* ==================== CATEGORY 3: KIRANA & HUL ==================== */
function kiranaCartCount() {
  return Object.values(KIRANA_CART).reduce((a, b) => a + (+b || 0), 0);
}
function kiranaSubtotal() {
  return Object.entries(KIRANA_CART).reduce((sum, [id, qty]) => {
    const it = S.kiranaItems.find(x => x.id === id);
    return it ? sum + it.price * qty : sum;
  }, 0);
}
function getRainSurgeFee() {
  ensureV145_30Defaults();
  return S.v145.rainSurgeActive ? (+S.v145.rainSurgeFee || 10) : 0;
}

function kiranaDeliveryFee(sub) {
  if (sub <= 0) return 0;
  ensureV150_30Defaults();
  const base = (S.v150.happyHourFreeDelivery || sub >= (+S.cfg.kiranaFreeDeliveryAt || 500)) ? 0 : (+S.cfg.kiranaDeliveryFee || 25);
  return base + getRainSurgeFee();
}

function viewKirana() {
  const sub = kiranaSubtotal();
  const minOrd = +S.cfg.kiranaMinOrder || 300;
  const freeAt = +S.cfg.kiranaFreeDeliveryAt || 500;
  const fee = kiranaDeliveryFee(sub);
  const pct = Math.min(100, Math.round((sub / freeAt) * 100));

  const q = KIRANA_SEARCH.trim().toLowerCase();
  const hideOos = window._saudaInStockOnly || !!(S.v149 && S.v149.hideOutOfStockSauda);
  const items = S.kiranaItems.filter(it =>
    (KIRANA_CAT_FILTER === "ALL" || it.cat === KIRANA_CAT_FILTER) &&
    (!hideOos || it.stock) &&
    (!q || it.name.toLowerCase().includes(q))
  );

  return `
    <div class="hero kirana-bg">
      <div>
        <span class="pill p-amber">MIN ₹${minOrd} ORDER · ₹${freeAt}+ FREE DELIVERY</span>
        <h2>Sauda & Daily Needs</h2>
        <p>Atta, Chawal, Tel, Surf Excel, Lifebuoy, Tea & Dairy ghar baithe</p>
      </div>
      <div class="hero-pop-wrap"><img class="hero-pop" src="${ART3D.surf}" alt="Sauda & Daily Needs" /></div>
    </div>

    <div class="card" style="border:2px solid ${sub >= freeAt ? "#16a34a" : sub >= minOrd ? "#d97706" : "#e11d48"}">
      <div style="font-size:12px;font-weight:800">
        ${sub < minOrd ? `⚠️ Sauda Cart: <b>${inr(sub)}</b> — Minimum order ke liye <b>${inr(minOrd - sub)}</b> aur add karein!` :
          sub < freeAt ? `✅ Min ₹${minOrd} unlocked! <b>${inr(freeAt - sub)}</b> aur add karein <b>FREE Delivery</b> ke liye (Save ₹${fee}).` :
          `🎉 <b>FREE Delivery Unlocked!</b> (Cart ${inr(sub)} ≥ ₹${freeAt})${sub >= ((S.v147 && S.v147.saudaFreeGiftAt) || 999) ? ` + 🎁 <b>${esc((S.v147 && S.v147.saudaFreeGiftLabel) || "Free Gift")}</b>!` : ""}`}
      </div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn amb sm" data-act="addKiranaCombo">⚡ ₹500 Free-Del Combo</button>
        <button class="btn g sm" data-act="addDailyPackQuick">🛍️ Daily Essentials</button>
        ${sub > 0 ? `<button class="btn w sm" data-act="clearKiranaCart">✕ Clear Cart</button>` : ""}
      </div>
    </div>

    <input class="inp" id="kiranaSearchInp" placeholder="🔍 Search Atta, Rice, Surf Excel, Lifebuoy, Tea..." value="${esc(KIRANA_SEARCH)}" />
    <div class="chips" style="margin-top:6px">

      ).join("")}
      <button class="${window._saudaInStockOnly ? "on" : ""}" data-act="toggleSaudaInStock">✓ In Stock</button>
    </div>

    <div class="grid-2">
      ${items.map(it => {
        const v = S.vendors.find(x => x.id === it.vendorId) || { name: "Kirana Store", status: "Open" };

}

function viewCheckoutPage() {
  if (!CHECKOUT_MODAL) { TAB = "tiffin"; return viewTiffin(); }

  // Refresh live items & totals if user edits +/- directly on Checkout Page
  let liveItems = [];
  let subTotal = m.total;
  let delFee = 0;
  let discAmt = +m.discountAmt || 0;
  let grandTotal = Math.max(0, m.total - discAmt);

  if (isFood) {
    liveItems = Object.entries(FOOD_CART).map(([id, qty]) => {
      const it = S.foodItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    if (!liveItems.length) { CHECKOUT_MODAL = null; TAB = "food"; return viewFoodShop(); }
    subTotal = foodCartTotal();
    delFee = 0;
    grandTotal = Math.max(0, subTotal - discAmt);
    m.items = liveItems;
    m.total = grandTotal;
  } else if (isTiffin) {
    discAmt = Math.min(Math.max(0, +m.total || 0), Math.max(0, discAmt));

/* ==================== AUTO ROUTE & AUTO KM ENGINE (DELIVERY) ==================== */
let RIDER_WATCH_ID = null;

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function recordRouteWaypoint(lat, lng, label = "Move") {
  S.riderAutoTrack = S.riderAutoTrack || { active: false, totalKm: 0, points: [], lastFix: null };
  const tr = S.riderAutoTrack;
  const nLat = +(+lat).toFixed(6);
  const nLng = +(+lng).toFixed(6);
  if (tr.lastFix && typeof tr.lastFix.lat === "number" && typeof tr.lastFix.lng === "number") {
    const stepKm = haversineKm(tr.lastFix.lat, tr.lastFix.lng, nLat, nLng);
    // Ignore tiny stationary GPS drift (< 0.015 km = 15m) and unrealistic GPS spikes (> 1.5 km in one tick)
    if (stepKm >= 0.015 && stepKm <= 1.5) {
      tr.totalKm = +((+tr.totalKm || 0) + stepKm).toFixed(2);
    }
  }
  tr.lastFix = { lat: nLat, lng: nLng, t: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
  tr.points = tr.points || [];
  tr.points.push({ lat: nLat, lng: nLng, label, t: tr.lastFix.t });
  if (tr.points.length > 120) tr.points.shift();
  try { localStorage.setItem("NU_V4_STATE", JSON.stringify(S)); } catch (e) {}
}

function toggleRiderAutoTrack(forceState = null) {
  S.riderAutoTrack = S.riderAutoTrack || { active: false, totalKm: 0, points: [], lastFix: null };
  const nextActive = typeof forceState === "boolean" ? forceState : !S.riderAutoTrack.active;
  if (!nextActive) {
    S.riderAutoTrack.active = false;
    if (RIDER_WATCH_ID !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(RIDER_WATCH_ID);
      RIDER_WATCH_ID = null;
    }
    save(`Rider Auto Route & KM stopped (${S.riderAutoTrack.totalKm || 0} km)`);
    toast("⏹ Auto Route & KM Tracking stopped");
    return;
  }
  if (!navigator.geolocation) {
    return toast("⚠️ Is browser mein GPS tracking support nahi hai");
  }
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    return toast("⚠️ Live GPS route ke liye HTTPS link par app kholein");
  }
  S.riderAutoTrack.active = true;
  if (RIDER_WATCH_ID !== null) navigator.geolocation.clearWatch(RIDER_WATCH_ID);
  toast("📡 Auto Route & KM Tracking ON!");
  RIDER_WATCH_ID = navigator.geolocation.watchPosition(
    pos => {
      if (!S.riderAutoTrack?.active) return;
      recordRouteWaypoint(pos.coords.latitude, pos.coords.longitude, "GPS Ping");
      if (ROLE === "delivery") render();
    },
    err => {
      toast(err.code === 1 ? "⚠️ Location Permission allow karein" : "⚠️ GPS signal weak hai");
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
  );
  save("Rider Auto Route & KM tracking started");
}

function getRouteMapsUrl() {
  const pts = (S.riderAutoTrack && S.riderAutoTrack.points) || [];
  if (pts.length >= 2) {
    const first = pts[0];
    const last = pts[pts.length - 1];
    const mid = pts.slice(1, -1).filter((_, i, arr) => i % Math.max(1, Math.floor(arr.length / 4)) === 0).slice(0, 4);
    const wp = mid.map(p => `${p.lat},${p.lng}`).join("/");
    return `https://www.google.com/maps/dir/${first.lat},${first.lng}/${wp ? wp + "/" : ""}${last.lat},${last.lng}`;
  }
  if (pts.length === 1) {
    return `https://www.google.com/maps?q=${pts[0].lat},${pts[0].lng}`;
  }
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent("Udala Bus Stand Udala Odisha")}`;
}

function getVendorLedger(v) {
  const list = v.type === "FOOD" ? (S.foodOrders || []) : (S.kiranaOrders || []);
  let gross = 0, comm = 0;
  list.filter(o => o.status !== "Cancelled").forEach(o => {
    const vSub = o.items.filter(i => i.vendorId === v.id).reduce((a, i) => a + i.price * i.qty, 0);
    if (vSub > 0) {
      gross += vSub;
      if (!v.isSelf && !(S.v150 && S.v150.zeroCommPromoActive)) {
        if (v.type === "FOOD") comm += Math.round((vSub * (+S.cfg.foodPartnerCommPct || 20)) / 100);
        if (v.type === "KIRANA" && o.status === "Delivered") comm += (+S.cfg.kiranaPostDeliveryComm || 30);
      }
    }
  });
  const payable = Math.max(0, gross - comm);
  const due = Math.max(0, payable - (+v.settledPaid || 0));
  return { gross, comm, payable, due };
}

/* ==================== ORDER ALERT SOUND ENGINE (WEB AUDIO) ==================== */
let AUDIO_CTX = null;
function playOrderAlertSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!AUDIO_CTX) AUDIO_CTX = new Ctx();
    if (AUDIO_CTX.state === "suspended") AUDIO_CTX.resume().catch(() => {});
    const now = AUDIO_CTX.currentTime;
    const pattern = [
      { t: 0.00, d: 0.40, f: 587.33 },
      { t: 0.24, d: 0.40, f: 783.99 },
      { t: 0.48, d: 0.50, f: 1046.50 },
      { t: 1.15, d: 0.40, f: 587.33 },
      { t: 1.39, d: 0.40, f: 783.99 },
      { t: 1.63, d: 0.55, f: 1046.50 },
      { t: 2.35, d: 0.42, f: 659.25 },
      { t: 2.60, d: 0.42, f: 880.00 },
      { t: 2.85, d: 0.55, f: 1174.66 },
      { t: 3.55, d: 0.45, f: 783.99 },
      { t: 3.85, d: 0.85, f: 1046.50 }
    ];
    pattern.forEach(p => {
      const osc = AUDIO_CTX.createOscillator();
      const gain = AUDIO_CTX.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(p.f, now + p.t);
      gain.gain.setValueAtTime(0.001, now + p.t);
      gain.gain.exponentialRampToValueAtTime(0.32, now + p.t + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + p.t + p.d);
      osc.connect(gain);
      gain.connect(AUDIO_CTX.destination);
      osc.start(now + p.t);
      osc.stop(now + p.t + p.d + 0.05);
    });
  } catch (e) {}
}

  else if (ROLE === "vendor") $("#appMain").innerHTML = viewVendor();
  else if (ROLE === "owner") $("#appMain").innerHTML = viewOwner();
  else {
    if (TAB === "checkout" && CHECKOUT_MODAL) {
      $("#appMain").innerHTML = viewCheckoutPage();
    } else if (TAB === "success" && LAST_PLACED_ORDER) {
      $("#appMain").innerHTML = viewOrderSuccessPage();
    } else if (TAB === "itemDetail" && DETAIL_ITEM) {
      $("#appMain").innerHTML = viewItemDetailPage();
    } else if (TAB === "tiffinPass") {
      $("#appMain").innerHTML = viewTiffinPassPage();
    } else if (TAB === "page30") {
      $("#appMain").innerHTML = viewExtraPage();
    } else {
      if (TAB === "tiffin") $("#appMain").innerHTML = viewTiffin();
      else if (TAB === "food") $("#appMain").innerHTML = viewFoodShop();
      else if (TAB === "kirana") $("#appMain").innerHTML = viewKirana();
      else if (TAB === "orders") $("#appMain").innerHTML = viewCustomerOrders();
      else $("#appMain").innerHTML = viewAccountPage();
    }
  }

  let cbarHtml = "";
  if (ROLE === "customer" && TAB === "food" && foodCartCount() > 0) {
    cbarHtml = `<div class="cbar" data-act="openFoodCheckout"><span>🍛 Food Cart: ${foodCartCount()} Items · ${inr(foodCartTotal())}</span><span>Checkout Food →</span></div>`;
  } else if (ROLE === "customer" && TAB === "kirana" && kiranaCartCount() > 0) {
    const sub = kiranaSubtotal();
    const minOrd = +S.cfg.kiranaMinOrder || 300;
    const fee = kiranaDeliveryFee(sub);
    cbarHtml = `<div class="cbar" data-act="openKiranaCheckout"><span>🛒 Kirana: ${inr(sub)} ${fee ? `(+₹${fee} Del)` : "(FREE Del)"}</span><span>${sub < minOrd ? `+${inr(minOrd - sub)} for Min` : "Checkout Kirana →"}</span></div>`;
  }
  $("#cartFloat").innerHTML = cbarHtml;

  if (ROLE === "customer") {
    const navItems = [
      ["tiffin", "🍱", "Mera Tiffin", 0],
      ["food", "🍛", "Food Shop", foodCartCount()],
      ["kirana", "🛒", "Sauda & Daily Needs", kiranaCartCount()],
      ["orders", "📦", "My Orders", (S.foodOrders?.length || 0) + (S.kiranaOrders?.length || 0)],
      ["account", "👤", "Profile", 0]
    ];
    $("#bottomNav").style.display = "flex";
    $("#bottomNav").innerHTML = navItems.map(([t, ic, lbl, cnt]) =>
      `<button class="${TAB === t ? "on" : ""}" data-act="setTab" data-v="${t}">
        <span style="font-size:17px">${ic}</span><span>${lbl}</span>
        ${cnt > 0 ? `<span class="nb">${cnt}</span>` : ""}
      </button>`
    ).join("");
  } else {
    $("#bottomNav").style.display = "none";
  }

  const hInst = $("#hdrInstallBtn"); if (hInst && IS_APP_INSTALLED) hInst.style.display = "none";
  if ($("#modalRoot")) $("#modalRoot").innerHTML = "";
}

  quickEnterCustomer: () => {
    LOGIN_MODE = "app";
    ROLE = "customer";
    sessionStorage.setItem("nu_role", "customer");
    sessionStorage.setItem("nu_login_done", "1");
    render();

  loginPickRole: v => {
    LOGIN_ROLE_CHOICE = v;
    LOGIN_PIN_INPUT = "";
    LOGIN_ERROR = "";
    render();
  },
  loginFocusRole: v => {
    LOGIN_ROLE_CHOICE = v;
    LOGIN_PIN_INPUT = "";
    LOGIN_ERROR = "";
    render();
    setTimeout(() => $("#loginPinInp")?.focus(), 40);
  },
  submitLoginPage: () => {
    const role = LOGIN_ROLE_CHOICE;
    if (role === "customer") {
      const nm = ($("#loginCustName")?.value || "").trim();
      const p10 = ph($("#loginCustPhone")?.value || "");
      if (!nm || p10.length !== 10) {
        LOGIN_ERROR = "⚠️ Order aur account ke liye Naam aur 10-digit Mobile number zaroori hai!";
        render();
        return;
      }
      TF.name = nm;
      TF.phone = p10;
      ORDER_PHONE_FILTER = p10;
      localStorage.setItem("nu_cname", nm);
      localStorage.setItem("nu_cphone", p10);
      sessionStorage.setItem("nu_cust_logged_in", "1");
      LOGIN_ERROR = "";
      LOGIN_MODE = "app";
      ROLE = "customer";
      sessionStorage.setItem("nu_role", "customer");
      sessionStorage.setItem("nu_login_done", "1");
      render();
      toast("✅ Logged in! Ab aap order place kar sakte hain.");
      return;
    }
    const pin = ($("#loginPinInp")?.value || "").trim();
    if (role === "vendor") {
      const vid = $("#loginVendorSel")?.value || LOGIN_VENDOR_CHOICE;
      const expected = (S.cfg.vendorPins || {})[vid] || PINS.vendors[vid];
      if (!expected || pin !== expected) {
        LOGIN_ERROR = "❌ Galat Vendor PIN! Sahi 4-digit PIN daalein.";
        render();
        return;
      }
      LOGIN_ERROR = "";
      LOGIN_MODE = "app";
      ROLE = "vendor";
      ACTIVE_VENDOR_ID = vid;
      sessionStorage.setItem("nu_role", "vendor");
      sessionStorage.setItem("nu_vid", vid);
      sessionStorage.setItem("nu_login_done", "1");
      render();
      toast("🏪 Vendor Panel Unlocked ✓");
      return;
    }
    if (pin !== PINS[role]) {
      LOGIN_ERROR = `❌ Galat ${role.toUpperCase()} PIN!`;
      render();
      return;
    }
    LOGIN_ERROR = "";
    LOGIN_MODE = "app";
    ROLE = role;
    sessionStorage.setItem("nu_role", role);
    sessionStorage.setItem("nu_login_done", "1");
    render();
    toast(`✅ ${role.toUpperCase()} Panel Unlocked ✓`);
  },
  installApp: async () => {
    if (IS_APP_INSTALLED) return toast("✅ Namaste Udala App pehle se installed hai!");
    if (DEFERRED_INSTALL_PROMPT) {
      try {
        DEFERRED_INSTALL_PROMPT.prompt();
        const res = await DEFERRED_INSTALL_PROMPT.userChoice;
        DEFERRED_INSTALL_PROMPT = null;
        if (res && res.outcome === "accepted") {
          showZomatoInstallNotification("🎉 Installing Namaste Udala App...", "App install ho raha hai — order & delivery alerts active hain.");
          return;
        }
      } catch (err) {}
    }
    ACT.downloadHtmlCopy();
  },
  closeInstallPopup: () => {
    window._showInstallPopup = false;
    render();
  },
  dismissZomatoNotif: () => {
    window._zomatoInstallNotif = null;
    render();
  },
  downloadHtmlCopy: () => {
    try {
      const clone = document.documentElement.cloneNode(true);
      ["#appMain", "#cartFloat", "#bottomNav", "#modalRoot", "#toast", "#printArea"].forEach(sel => {
        const el = clone.querySelector(sel);
        if (el) el.innerHTML = "";
      });
      const tst = clone.querySelector("#toast");
      if (tst) tst.classList.remove("on");
      const rawHtml = "<!DOCTYPE html>\n" + clone.outerHTML;
      const blob = new Blob([rawHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "namaste-udala-v192-complete.html";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (err) {}
      }, 1200);
      window._showInstallPopup = false;
      render();
      showZomatoInstallNotification("📥 Namaste Udala App Downloaded!", "File save ho gayi hai. Open karke Tiffin, Food aur Sauda ke live alerts paayein.");
    } catch (e) {
      try {
        const w = window.open("", "_blank");
        if (w) {
          w.document.open();
          w.document.write("<!DOCTYPE html>\n" + document.documentElement.outerHTML);
          w.document.close();
          toast("📄 Nayi tab mein app khul gayi — Save Page se download karein");
        } else {
          toast("⚠️ Browser pop-up / download block hai — Chrome 3-dot se Save/Install karein");
        }
      } catch (err2) {
        toast("⚠️ Download shuru nahi ho saka");
      }
    }
  },
  shareAppLink: () => {
    const url = location.href;
    const msg = `Namaste Udala App se ghar baithe Mera Tiffin, Food aur Kirana mangwayein! Yahan se open/install karein: ${url}`;
    if (navigator.share) {
      navigator.share({ title: "Namaste Udala App", text: msg, url }).catch(() => {});
    } else {
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, "_blank");
    }
  },
  toggleTheme: () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "";
    localStorage.setItem("nu_dark", dark ? "1" : "0");
    if ($("#themeBtn")) $("#themeBtn").textContent = dark ? "☀️" : "🌙";
    render();
  },
  setTab: v => { TAB = v; SELECTED_REST_ID = null; render(); scrollTo({ top: 0, behavior: "smooth" }); },
  jumpFoodCat: v => { TAB = "food"; SELECTED_REST_ID = null; FOOD_CAT_FILTER = v; render(); },
  setRole: v => { ROLE = v; sessionStorage.setItem("nu_role", v); render(); },
  askRole: v => {
    if (v === "customer") { ROLE = "customer"; sessionStorage.setItem("nu_role", "customer"); render(); return; }
    if (v.startsWith("vendor_")) {
      const vid = v.replace("vendor_", "");
      const pin = prompt(`Enter PIN for Vendor:`);
      const expectedPin = (S.cfg.vendorPins || {})[vid] || PINS.vendors[vid];
      if (expectedPin && pin === expectedPin) {
        ROLE = "vendor"; ACTIVE_VENDOR_ID = vid;
        sessionStorage.setItem("nu_role", "vendor"); sessionStorage.setItem("nu_vid", vid);
        render(); toast("Vendor Panel Unlocked ✓");
      } else if (pin !== null) toast("❌ Galat Vendor PIN!");
      return;
    }
    const pin = prompt(`Enter Security PIN for ${v.toUpperCase()}:`);
    if (pin === PINS[v]) {
      ROLE = v; sessionStorage.setItem("nu_role", v);
      render(); toast(`${v.toUpperCase()} Panel Unlocked ✓`);
    } else if (pin !== null) toast("❌ Galat PIN!");
  },

  tfSet: (v, k) => { TF[k] = k === "days" ? +v : v; render(); },
  openTiffinCheckout: () => {
    const total = calcTiffinPrice(TF.diet, TF.days, TF.slot);
    PROOF_DATA_URL = "";
    TAB = "checkout"; scrollTo({ top: 0, behavior: "smooth" }); captureMandatoryGps(true);
    CHECKOUT_MODAL = {
      kind: "TIFFIN",
      title: "Mera Tiffin Subscription (0% Comm)",
      summary: `${TF.days} Din · ${TF.diet === "nv" ? "Non-Veg" : "Pure Veg"} · ${TF.slot} (${TF.spice}, ${TF.health})`,
      total,
      payMode: "UPI"
    };
    render();
  },
  renewTiffin: (v, k, id) => {
    const s = S.tiffinSubs.find(x => x.id === id);
    if (!s) return;
    if (+s.days === 1) {
      ensureV144_30Defaults();
      S.v144Ops.trialConvertedCount = (+S.v144Ops.trialConvertedCount || 0) + 1;
    }
    TF.diet = s.diet || "veg";
    TF.days = s.days || 15;
    TF.slot = s.slot || "Lunch (12:30 PM)";
    TF.name = s.name;
    TF.phone = s.phone;

    if (km <= 0) return toast("⚠️ Auto KM abhi 0 hai — Start Auto dabayein ya move karein");
    const estRs = +(km * (+S.cfg.perKmFuelRate || 3.5)).toFixed(1);

  resetAutoKm: () => {
    if (!confirm("Auto tracked KM aur route points reset karein?")) return;
    S.riderAutoTrack = { active: !!(S.riderAutoTrack && S.riderAutoTrack.active), totalKm: 0, points: [], lastFix: null };
    safePersist("Rider reset Auto KM & route trail");

  submitFuel: () => {
    const s = parseFloat($("#odoStart")?.value), e = parseFloat($("#odoEnd")?.value), rs = parseFloat($("#fuelRs")?.value);
    if (isNaN(s) || isNaN(e) || e <= s || isNaN(rs) || rs <= 0) return toast("Sahi Start/End KM aur ₹ daalein");
    const km = +(e - s).toFixed(2);
    const drops = (S.foodOrders.filter(o => o.status === "Delivered").length + S.kiranaOrders.filter(o => o.status === "Delivered").length);
    const estKm = Math.max(2, drops * 2.4);
    const flag = (km > estKm * 1.5 || rs > estKm * S.cfg.perKmFuelRate * 1.35) ? "⚠️ SUSPICIOUS OVER-CLAIM" : "✅ Route Matched";
    S.fuelLogs.unshift({ id: uid("fl"), km, rs, flag, approved: false });
    safePersist(`Fuel claim submitted: ${km}km / ₹${rs} (${flag})`);
    toast("Fuel log submitted!");
  },

document.addEventListener("click", e => {
  if (e.target.closest("#logoBtn")) {
    e.preventDefault();
    window._nuTapCount = (window._nuTapCount || 0) + 1;
    clearTimeout(window._nuTapTimer);
    window._nuTapTimer = setTimeout(() => { window._nuTapCount = 0; }, 1400);
    if (window._nuTapCount >= 5) {
      window._nuTapCount = 0;
      const pin = prompt("Staff / Admin PIN daalein (Owner / Kitchen / Delivery / Vendor):");
      if (pin === null) return;
      if (pin === PINS.owner) { ROLE = "owner"; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "owner"); sessionStorage.setItem("nu_login_done", "1"); render(); toast("👑 Owner Panel Unlocked ✓"); return; }

      if (pin === PINS.delivery) { ROLE = "delivery"; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "delivery"); sessionStorage.setItem("nu_login_done", "1"); render(); toast("🛵 Delivery Panel Unlocked ✓"); return; }
      const vPins = { ...PINS.vendors, ...(S.cfg.vendorPins || {}) };
      const matchedVid = Object.keys(vPins).find(vid => vPins[vid] === pin);
      if (matchedVid) { ROLE = "vendor"; ACTIVE_VENDOR_ID = matchedVid; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "vendor"); sessionStorage.setItem("nu_vid", matchedVid); sessionStorage.setItem("nu_login_done", "1"); render(); toast("🏪 Vendor Panel Unlocked ✓"); return; }
      toast("❌ Galat PIN!");

    render();
    scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

    if (btn.tagName !== "A") e.preventDefault();

document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const card = e.target.closest(".pcard, .hero");
  if (!card) return;
  const r = card.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  card.style.transform = `perspective(700px) rotateX(${(-y * 6).toFixed(1)}deg) rotateY(${(x * 7).toFixed(1)}deg) translateY(-4px)`;
});
document.addEventListener("pointerout", e => {
  const card = e.target.closest(".pcard, .hero");
  if (card && !card.contains(e.relatedTarget)) {
    card.style.transform = "";
  }
});

document.addEventListener("error", e => {
  const img = e.target;
  if (!img || img.tagName !== "IMG") return;
  try {
    let queue = img.dataset.fbQueue ? JSON.parse(img.dataset.fbQueue) : null;
    if (Array.isArray(queue) && queue.length > 0) {
      const nextSrc = queue.shift();
      img.dataset.fbQueue = JSON.stringify(queue);
      if (nextSrc && img.src !== nextSrc) {
        img.src = nextSrc;
        return;
      }
    }
  } catch (err) {}
  if (!img.dataset.fbDone) {
    img.dataset.fbDone = "1";
    img.src = REAL_IMG.thali;
  }
}, true);
