const normalizeSub=s=>{if(!s||!s.id)return null;

 s.days=clamp(+s.days||30,1,365);s.start=s.start||todayStr();s.price=Math.max(0,+s.price||0);
 s.skip=Array.isArray(s.skip)?s.skip:[];s.pause=Array.isArray(s.pause)?s.pause:[];
 s.lunch=['roti','chawal','both'].includes(s.lunch)?s.lunch:'chawal';
 s.dinner=['roti','chawal','both'].includes(s.dinner)?s.dinner:'roti';
 s.extraRoti=clamp(+s.extraRoti||0,0,4);
 s.addr=s.addr||'';s.area=s.area||'Udala';s.map=s.map||'';s.notes=s.notes||'';s.utr=s.utr||'';
 s.paid=s.paid?1:0;s.trial=s.trial?1:0;s.ts=s.ts||s.id;s.deviceFp=s.deviceFp||'';s.avatar=s.avatar||randAvatar(s.id);
 if(!s.status)s.status=s.trial?'trial':(s.paid?'active':'pending');
 return s};
const normalizeOrder=o=>{if(!o||!o.id)return null;
 o.name=String(o.name||'Customer');o.phone=cleanPhone(o.phone);
 o.items=Array.isArray(o.items)?o.items.filter(i=>i&&i.n):[];
 o.total=Math.max(0,+o.total||0);o.date=o.date||todayStr();
 o.status=o.status==='delivered'?'delivered':'pending';o.paid=o.paid?1:0;
 o.map=o.map||'';o.addr=o.addr||'';o.area=o.area||'Udala';o.notes=o.notes||'';
 o.slot=o.slot||'lunch';o.coupon=o.coupon||'';o.discount=+o.discount||0;
 return o};
const normalizeProd=p=>{if(!p||!p.id)return null;
 return{id:p.id,n:String(p.n||'Item'),p:+p.p||0,c:p.c||'General',nv:p.nv?1:0,s:p.s===0?0:1,img:p.img||'',kind:p.kind==='food'?'food':'grocery',rating:p.rating||0,time:p.time||0,best:p.best?1:0}};

function migrate(d){if(!d||typeof d!=='object')return d;
 const v=d.v||1;
 if(v<2)(d.orders||[]).forEach(o=>{o.slot=o.slot||'lunch';o.discount=o.discount||0;o.coupon=o.coupon||''});
 if(v<3){d.coupons=d.coupons||COUPONS_DEFAULT;d.walletLedger=d.walletLedger||[]}
 if(v<4)(d.subs||[]).forEach(s=>{if(!s.avatar)s.avatar=randAvatar(s.id)});
 if(v<5){d.wallet=d.wallet||{balance:0,autopay:false};d.alerts=d.alerts||[]}
 d.v=SCHEMA_V;return d}

function loadState(){
 const out={v:SCHEMA_V,prod:[],subs:[],orders:[],pays:[],expenses:[],meals:{},done:{},mset:{},cred:{},refs:{},wallet:{balance:0,autopay:false},walletLedger:[],feedback:{},dailyVideo:'',partners:['Raju Bhaiya'],coupons:COUPONS_DEFAULT,alerts:[]};
 let recovered=0;
 [STORAGE_KEY,'udala2','udala6','udala7','udala_logic'].forEach(k=>{
  try{const raw=localStorage.getItem(k);if(!raw)return;let d=migrate(JSON.parse(raw));if(!d||typeof d!=='object')return;
   (d.prod||[]).forEach(p=>{const n=normalizeProd(p);if(n&&!out.prod.find(x=>x.id===n.id))out.prod.push(n)});
   (d.subs||[]).forEach(s=>{const n=normalizeSub(s);if(n&&!out.subs.find(x=>x.id===n.id)){out.subs.push(n);if(k!==STORAGE_KEY)recovered++}});
   (d.orders||[]).forEach(o=>{const n=normalizeOrder(o);if(n&&!out.orders.find(x=>x.id===n.id)){out.orders.push(n);if(k!==STORAGE_KEY)recovered++}});
   (d.pays||[]).forEach(p=>{if(p&&p.id&&!out.pays.find(x=>x.id===p.id))out.pays.push(p)});
   Object.assign(out.meals,d.meals||{});Object.assign(out.done,d.done||{});Object.assign(out.mset,d.mset||{});
   Object.assign(out.cred,d.cred||{});Object.assign(out.refs,d.refs||{});Object.assign(out.wallet,d.wallet||{balance:0,autopay:false});
   Object.assign(out.walletLedger,d.walletLedger||[]);Object.assign(out.feedback,d.feedback||{});
   Object.assign(out.coupons,d.coupons||COUPONS_DEFAULT);Object.assign(out.alerts,d.alerts||[]);
  }catch(e){}
 });
 if(!out.prod.length)out.prod=SEED.slice();
 if(!out.prod.some(p=>p.kind==='food')){let m=out.prod.reduce((a,p)=>Math.max(a,p.id),0);FOOD_SEED.forEach(f=>{m++;out.prod.push({...f,id:m})})}
 return {data:out,recovered};
}

 const today=new Date();today.setHours(12,0,0,0);

const ACTIONS={
 tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const x=prompt(v==='owner'?'Owner PIN (4821):':'Delivery PIN (7788):');if(x===null)return;
   const ok=v==='owner'?(x===CONFIG.ownerPin):(x===CONFIG.delivPin||x===CONFIG.ownerPin);
   if(!ok){showToast('❌ Galat PIN','error');return}OK=1;sessionStorage.setItem('udok','1')}
  tab=v;render();window.scrollTo({top:0,behavior:'smooth'})},
 subtab:(v,p,st)=>{SUBTAB[p]=st;render()},
 set:(v,k)=>{F[k]=v;render()},
 setSlot:v=>{F.slot=v;render()},
 inc:(v,k,id)=>{C[id]=(C[id]||0)+1;saveCart();render()},
 dec:(v,k,id)=>{C[id]=Math.max(0,(C[id]||0)-1);if(!C[id])delete C[id];saveCart();render()},
 goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
 addPreset:()=>{let n=0;KIRANA_PRESET.forEach(name=>{const p=S.prod.find(x=>x.n===name);if(p&&p.s!==0){C[p.id]=(C[p.id]||0)+1;n++}});saveCart();render();showToast(`✅ ${n} items add`)},
 applyCoupon:()=>{const code=($('#couponInput')?.value||'').trim().toUpperCase();
  if(!code){CART_COUPON='';render();return}
  if(!S.coupons[code]){showToast('❌ Galat coupon','error');return}
  if(calcCart().sub<S.coupons[code].min){showToast(`❌ Min ₹${S.coupons[code].min} chahiye`,'error');return}
  CART_COUPON=code;render();showToast('✅ Coupon applied!')},
 applyCouponCode:(v,k,code)=>{CART_COUPON=code;$('#couponInput').value=code;render();showToast('✅ Coupon applied!')},
 gps:()=>{const b=event.target;if(!navigator.geolocation){showToast('❌ GPS nahi','error');return}
  b.innerHTML='<span class="loader"></span> Dhundh rahe hain...';
  navigator.geolocation.getCurrentPosition(p=>{F.map=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;showToast('✅ Location lock');render()},()=>showToast('❌ Permission allow karein','error'),{enableHighAccuracy:true,timeout:10000})},
 login:()=>{const n=($('#lname')?.value||'').trim(),p=cleanPhone($('#lphone')?.value);
  if(n.length<2||p.length!==10){showToast('❌ Naam + 10 digit phone','error');return}
  ME={name:n,phone:p,avatar:randAvatar(p.charCodeAt(0))};saveME();F.name=n;F.phone=p;render();showToast('👤 Login!')},
 mealMark:(v,k,id)=>{S.meals[mealKey(id,k)]=v;save(true);showToast(v==='consumed'?'✅ Khaya':'❌ Skip')},
 skipToday:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const k2=todayStr();const i=s.skip.indexOf(k2);if(i>=0)s.skip.splice(i,1);else s.skip.push(k2);save(true)},
 custDetail:(v,k,id)=>{
  const s=(S.subs||[]).find(x=>x.id==id);if(!s)return;
  showModal(`<div class="modal-content" onclick="event.stopPropagation()">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">${esc(s.name)}</h3><button class="btn sm r" data-a="closeModal">✕</button></div>
   <div class="s">📱 ${s.phone} · ${esc(s.area)} ${badge(getSubStatus(s))}</div>
   <div class="s" style="margin-top:8px">📍 ${esc(s.addr||'Address nahi')}</div>
   <div style="display:flex;gap:8px;margin-top:14px">
    <a class="btn g" href="tel:+91${s.phone}" style="flex:1;margin:0;text-decoration:none;text-align:center">📞 Call</a>
    <a class="btn b" href="https://wa.me/91${s.phone}" target="_blank" style="flex:1;margin:0;text-decoration:none;text-align:center">💬 WA</a>
   </div></div>`);
 },
 prodDetail:(v,k,id)=>{
  const p=(S.prod||[]).find(x=>x.id==id);if(!p)return;
  showModal(`<div class="modal-content" onclick="event.stopPropagation()">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">${esc(p.n)}</h3><button class="btn sm r" data-a="closeModal">✕</button></div>
   <div style="background:var(--inp);border-radius:14px;padding:14px;margin:14px 0">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>${vdot(p.nv)} ${esc(p.c)}</b><b style="font-size:22px;color:var(--o)">${inr(p.p)}</b></div>
   </div>
   <button class="btn g" data-a="inc" data-id="${p.id}" data-a2="closeModal" style="width:100%">➕ Cart mein daalo</button></div>`);
 },
 ordDetail:(v,k,id)=>{
  const o=(S.orders||[]).find(x=>x.id==id);if(!o)return;
  showModal(`<div class="modal-content" onclick="event.stopPropagation()">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="margin:0">Order #${String(o.id).slice(-4)}</h3><button class="btn sm r" data-a="closeModal">✕</button></div>
   <div class="s">📅 ${o.date} · 🕐 ${o.slot} · ${badge(o.status)}</div>
   ${o.items.map(i=>`<div class="row"><span>${esc(i.n)} × ${i.q}</span><b>${inr(i.p*i.q)}</b></div>`).join('')}
   <div class="row" style="border-top:2px solid var(--line);padding-top:10px;margin-top:6px"><b>Total</b><b style="color:var(--o);font-size:18px">${inr(o.total)}</b></div>
   </div>`);
 },
 joinPaid:()=>{
  const u={n:(F.name||'').trim(),p:cleanPhone(F.phone)};
  if(u.n.length<2||u.p.length!==10){showToast('❌ Sahi naam + phone','error');return}
  const utr=prompt('💳 UTR likhein:');if(!utr||utr.trim().length<4){showToast('❌ Bina UTR nahi','error');return}
  const price=PRICING[F.type][F.days]||2899;
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr||'Udala',map:F.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr:utr.trim(),skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,deviceFp:deviceFp(),avatar:randAvatar(u.p.charCodeAt(0))});
  save(true);showToast('⏳ Owner verify karega');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *PLAN*%0A👤 ${u.n}%0A💰 ${inr(price)}%0A🔢 ${utr}`,'_blank');
 },
 order:()=>{
  const u={n:(F.name||'').trim(),p:cleanPhone(F.phone)};
  if(u.n.length<2||u.p.length!==10){showToast('❌ Sahi naam + phone','error');return}
  const cart=calcCart();if(!cart.cnt){showToast('❌ Cart khali','error');return}
  const items=[];Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0)items.push({n:p.n,q,p:p.p})});
  S.orders.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr||'Udala',map:F.map,notes:F.notes,items,total:cart.total,sub:cart.sub,discount:cart.disc,coupon:cart.code,status:'pending',paid:0,date:todayStr(),slot:F.slot});
  C={};CART_COUPON='';saveCart();save(true);showToast('✅ Order mil gaya!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *ORDER*%0A👤 ${u.n}%0A📦 ${items.map(i=>i.n+' x'+i.q).join(', ')}%0A🕐 ${F.slot}%0A💰 ${inr(cart.total)}`,'_blank');
 },
 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;
  S.pays.push({id:Date.now(),d:todayStr(),name:s.name,phone:s.phone,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});save(true);showToast('✅ Active!');closeModal()},
 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm('Reject?')){s.status='rejected';save(true);closeModal()}},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save(true)},
 riderLogin:()=>{const pin=$('#riderPin')?.value;if(pin===CONFIG.delivPin){showToast('🔓 Rider Mode Unlocked');SUBTAB.delivery='stops';render()}else showToast('❌ Galat PIN (7788)','error')},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim(),kind=($('#pkind')?.value)||'grocery';
  if(!n||!p||p<=0){showToast('❌ Naam + price','error');return}
  S.prod.push({id:Date.now(),n,p,c,nv:0,s:1,img:kind==='food'?IMG.thali:IMG.grocery,kind,rating:kind==='food'?4.3:0,time:kind==='food'?25:0,best:0});save(true);showToast('✅ Add')},
 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);save(true)}},
 addCoupon:()=>{const code=($('#cCode')?.value||'').trim().toUpperCase();const val=parseInt($('#cVal')?.value);const min=parseInt($('#cMin')?.value);
  if(!code||!val||!min){showToast('❌ Fill all fields','error');return}
  S.coupons[code]={type:val<50?'flat':'percent',value:val,min:min};save(true);showToast('✅ Coupon Created')},
 delCoupon:(v,k,code)=>{delete S.coupons[code];save(true);render()},
 sendBroadcast:()=>{const msg=($('#bcMsg')?.value||'').trim();if(!msg){showToast('❌ Message khali hai','error');return}
  const activePhones=(S.subs||[]).filter(isLive).map(s=>s.phone);
  showToast(`📤 Queued for ${activePhones.length} customers`);
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')},
 exportReport:(v,k,type)=>{showToast(`📥 Exporting ${type} report...`);/* Mock export */},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));
  navigator.clipboard.writeText(`🍱 KITCHEN ${k}\n👥 ${on.length}\n\n`+on.map(s=>`• ${s.name} - ${packItems(s).join(', ')}`).join('\n')).then(()=>showToast('📋 Copy!')).catch(()=>showToast('❌ Copy fail','error'))},
 backup:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';SUBTAB={plan:'myplan',shop:'food',kitchen:'today',delivery:'stops',owner:'dash'};render()},
 closeModal:()=>closeModal()
};

document.addEventListener('click',e=>{
 if(e.target.classList.contains('modal')){closeModal();return}
 const b=e.target.closest('[data-a]');if(!b)return;
 const f=ACTIONS[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id,b.dataset.p)}catch(err){console.error(err);showToast('❌ Error','error')}}
});
document.addEventListener('input',e=>{const f=e.target.dataset?.f;
 if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone)}
 if(e.target.id==='sq'){clearTimeout(window._t);window._t=setTimeout(()=>{SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{S=migrate(JSON.parse(r.result));save(true);showToast('✅ Restore!')}catch(err){showToast('❌ Galat file','error')}};
 r.readAsText(f);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Owner PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();showToast('🔓 Owner')}else showToast('❌ PIN','error')}});

const initTheme=()=>{const t=localStorage.getItem('ud_theme')||'dark';document.documentElement.setAttribute('data-theme',t);$('#themeToggle').textContent=t==='dark'?'☀️':'🌙'};
$('#themeToggle').addEventListener('click',()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('ud_theme',n);$('#themeToggle').textContent=n==='dark'?'☀️':'🌙'});

const initParticles=()=>{const c=$('#particles');if(!c)return;
 for(let i=0;i<25;i++){const p=document.createElement('div');p.className='particle';
  p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*12+'s';
  p.style.animationDuration=(10+Math.random()*6)+'s';
  p.style.opacity=Math.random()*0.6+0.2;
  c.appendChild(p)}};

initTheme();initParticles();render();
setTimeout(()=>showToast('✨ Ultra 3D ready · All CSV Sub-tabs Integrated'),600);
</script>
</body>
</html>
