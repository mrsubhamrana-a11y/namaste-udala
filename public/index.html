 fbApi=v=>{try{fd.update(r,v)}catch(e){}};
 fd.onValue(r,sn=>{const v=sn.val();if(v&&v.cloud===1){S=mergeStates(S,v);render()}});
 fbApi({...S,cloud:1});
}catch(e){console.log('Cloud off - local mode')}})();

function mergeStates(a,b){
 const union=(x,y)=>{const r=[...(x||[])];(y||[]).forEach(it=>{if(it&&it.id&&!r.find(z=>z.id===it.id))r.push(it)});return r};
 return {...a,
  prod:union(a.prod,b.prod).map(normalizeProd).filter(Boolean),
  subs:union(a.subs,b.subs).map(normalizeSub).filter(Boolean),
  orders:union(a.orders,b.orders).map(normalizeOrder).filter(Boolean),
  pays:union(a.pays,b.pays),expenses:union(a.expenses,b.expenses),
  meals:{...(a.meals||{}),...(b.meals||{})},done:{...(a.done||{}),...(b.done||{})},
  mset:{...(a.mset||{}),...(b.mset||{})},cred:{...(a.cred||{}),...(b.cred||{})},
  refs:{...(a.refs||{}),...(b.refs||{})},wallet:{...(a.wallet||{}),...(b.wallet||{})},
  feedback:{...(a.feedback||{}),...(b.feedback||{})},
  coupons:{...(a.coupons||{}),...(b.coupons||{})},
  photos:b.photos||a.photos||[],
  dailyVideo:b.dailyVideo||a.dailyVideo||''};
}
const save=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S))}catch(e){}if(fbApi)fbApi({...S,cloud:1});render()};

const mf=(d,t)=>{const k=iso(d);const o=S.mset[k];if(o){if(t==='nv'&&o.nv)return o.nv;if(t!=='nv'&&o.veg)return o.veg}
 const w=d.getDay();
 if(t==='nv'){if(w===0)return 'Chicken curry, roti, chawal';if(w===3)return 'Fish curry, roti, chawal';if(w===5)return '2 egg curry, roti, chawal';if(w===6)return 'Mutton special, roti, chawal'}
 else{if(w===0)return 'Paneer butter masala, roti, chawal';if(w===3)return 'Mushroom curry, roti, chawal';if(w===5)return 'Special veg thali + meetha';if(w===6)return 'Dal makhani + paneer, roti, chawal'}
 return 'Dal, sabzi, roti, chawal'};

const subEnd=s=>addDays(new Date(s.start+'T12:00:00'),s.days);
const getSubStatus=s=>{if(!s)return 'expired';
 if(s.status==='rejected')return 'rejected';
 if(s.status==='pending')return 'pending';
 const today=new Date();today.setHours(12,0,0,0);
 if(today>=subEnd(s))return 'expired';
 const k=todayStr();
 if(s.pause.includes(k))return 'paused';
 if(s.status==='trial')return 'trial';
 return 'active'};
const isLive=s=>['active','trial'].includes(getSubStatus(s));
const badge=st=>`<span class="badge ${st}">${st==='active'?'✅ Active':st==='pending'?'⏳ Payment Pending':st==='trial'?'🎁 Trial':st==='paused'?'⏸ Paused':st==='rejected'?'❌ Rejected':' Expired'}</span>`;
const mealKey=(sid,meal)=>todayStr()+'_'+sid+'_'+meal;
const packItems=s=>{const meal=m=>m==='chawal'?'Chawal':m==='both'?'Roti x4 + Chawal':'Roti x4';
 return ['Chai+nashta','Lunch: '+meal(s.lunch),'Dinner: '+meal(s.dinner),(s.extraRoti?'Extra roti x'+s.extraRoti:null),(s.type==='nv'?'NV curry x2':'Veg sabzi x2')].filter(Boolean)};
const vdot=nv=>`<span class="vd ${nv?'nv':''}"></span>`;
const stepper=(id,q)=>`<div style="display:flex;align-items:center;gap:8px;border:2px solid var(--o);border-radius:10px;padding:3px;background:rgba(255,107,53,.06)"><button data-a="dec" data-id="${id}" style="width:26px;height:26px;border:0;border-radius:8px;background:var(--o);color:#fff;font-size:15px;font-weight:800">−</button><b style="min-width:18px;text-align:center">${q}</b><button data-a="inc" data-id="${id}" style="width:26px;height:26px;border:0;border-radius:8px;background:var(--o);color:#fff;font-size:15px;font-weight:800">+</button></div>`;

const applyCoupon=(code,total)=>{
 const coupon=S.coupons[code.toUpperCase()];
 if(!coupon)return {error:'Invalid coupon code'};
 if(new Date(coupon.expiry)<new Date())return {error:'Coupon expired'};
 if(coupon.usage>=coupon.maxUsage)return {error:'Coupon limit reached'};
 if(total<coupon.minOrder)return {error:`Min order ₹${coupon.minOrder} required`};
 
 let discount=0;
 if(coupon.type==='flat')discount=coupon.discount;
 else if(coupon.type==='percent')discount=Math.round(total*coupon.discount/100);
 else if(coupon.type==='delivery')discount=30;
 
 return {valid:true,discount,code:code.toUpperCase(),coupon};
};

const handlePhotoUpload=(e,subId)=>{
 const file=e.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=(ev)=>{
  const photo={id:Date.now(),subId,url:ev.target.result,date:todayStr(),time:new Date().toLocaleTimeString()};
  S.photos.push(photo);
  save();
  showToast('📸 Photo uploaded! Customer ko notify ho gaya');
  // Send WhatsApp notification
  const sub=S.subs.find(s=>s.id===subId);
  if(sub){
   window.open(`https://wa.me/91${sub.phone}?text=🍽️ *Aaj ka khana ready hai!*%0A%0A📸 Photo dekhne ke liye app kholen%0A🕐 Time: ${photo.time}`,'_blank');
  }
 };
 reader.readAsDataURL(file);
 e.target.value='';
};

   if(!F.addresses[SELECTED_ADDR])F.addresses[SELECTED_ADDR]={id:Date.now(),label:'Home',addr:'',area:'Udala',map:''};
   F.addresses[SELECTED_ADDR].map=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;
   showToast('✅ Location lock ho gayi');render();
  },()=>showToast('❌ Location permission allow karein','error'),{enableHighAccuracy:true,timeout:10000})},
 login:()=>{const n=($('#lname')?.value||'').trim(),p=cleanPhone($('#lphone')?.value);
  if(n.length<2||p.length!==10){showToast('❌ Naam aur 10 digit phone daalo','error');return}
  ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();showToast('👤 Login ho gaya')},
 logout:()=>{ME=null;saveME();render();showToast('Logout ho gaya')},
 mealMark:(v,k,id)=>{S.meals[mealKey(id,k)]=v;
  const sub=S.subs.find(s=>s.id==id);

  save();showToast(v==='consumed'?'✅ Khaya mark ho gaya':'❌ Skip mark ho gaya')},
 skipToday:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const k2=todayStr();const i=s.skip.indexOf(k2);if(i>=0)s.skip.splice(i,1);else s.skip.push(k2);save()},
 togglePause:(v,k,id,date)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;
  if(!s.pause)s.pause=[];
  const i=s.pause.indexOf(date);

  else s.pause.push(date);

 selectAddr:(v,k,id)=>{SELECTED_ADDR=parseInt(id);render()},
 addAddress:()=>{
  const label=prompt('Address label (Home/Office/Other):');
  if(!label)return;
  const newAddr={id:Date.now(),label,addr:'',area:'Udala',map:''};
  F.addresses.push(newAddr);
  SELECTED_ADDR=F.addresses.length-1;
  render();showToast('✅ Naya address add ho gaya!');
 },
 topup:(v,k,id)=>{
  const sub=S.subs.find(s=>s.id==id);
  if(!sub)return;
  const amount=parseInt(v);
  if(!amount||amount<=0){showToast('❌ Invalid amount','error');return}
  sub.wallet=(sub.wallet||0)+amount;
  save();
  showToast(`✅ ₹${amount} wallet mein add ho gaya! Balance: ₹${sub.wallet}`);
  window.open(`https://wa.me/91${sub.phone}?text=💳 *Wallet Top-up*%0AAmount: ₹${amount}%0ABalance: ₹${sub.wallet}`,'_blank');
 },
 toggleAutoPay:(v,k,id)=>{
  const sub=S.subs.find(s=>s.id==id);
  if(!sub)return;
  sub.autoPay=!sub.autoPay;
  save();
  showToast(sub.autoPay?'✅ Auto-pay ON! Daily bill wallet se katega':'❌ Auto-pay OFF');
 },
 downloadInvoice:(v,k,id)=>{
  const sub=S.subs.find(s=>s.id==id);
  if(!sub)return;
  generateInvoice(sub);
 },
 joinTrial:()=>{const u=needUser();if(!u)return;if(!needGPS())return;
  const addr=F.addresses[SELECTED_ADDR];
  if(!addr||!addr.addr||addr.addr.trim().length<8){showToast('❌ Pura address daalein','error');return}
  const had=(S.subs||[]).find(s=>s.phone===u.p&&s.trial);
  if(had){showToast('❌ Trial pehle hi le chuke hain','error');return}
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:addr.area||'Udala',addr:addr.addr,map:addr.map,notes:F.notes,type:F.type,days:1,start:todayStr(),price:0,status:'trial',trial:1,paid:1,utr:'FREE_TRIAL',skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,slot:F.slot||'default',wallet:0,points:0,streak:0,autoPay:false,addresses:F.addresses||[],selectedAddress:SELECTED_ADDR});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save();showToast('🎁 1 din ka FREE trial ACTIVE!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🎁 *FREE TRIAL*%0A👤 ${u.n}%0A📱 ${u.p}%0A📍 ${addr.map}`,'_blank')},
 joinPaid:()=>{const u=needUser();if(!u)return;if(!needGPS())return;
  const addr=F.addresses[SELECTED_ADDR];
  if(!addr||!addr.addr||addr.addr.trim().length<8){showToast('❌ Pura address daalein','error');return}
  const utr=prompt('💳 Payment karke UTR / Transaction ID likhein:');
  if(!utr||utr.trim().length<4){showToast('❌ Bina UTR plan nahi banega','error');return}
  const price=PRICING[F.type][F.days]||2899;
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:addr.area||'Udala',addr:addr.addr,map:addr.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr:utr.trim(),skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,slot:F.slot||'default',wallet:0,points:0,streak:0,autoPay:false,addresses:F.addresses||[],selectedAddress:SELECTED_ADDR});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save();showToast('⏳ Plan bana! Owner verify karega tab active hoga');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *NAYA PLAN (PENDING)*%0A👤 ${u.n}%0A📱 ${u.p}%0A🍽️ ${F.type} ${F.days} din%0A💰 ${inr(price)}%0A🔢 UTR: ${utr}%0A📍 ${addr.map}`,'_blank')},
 order:()=>{const u=needUser();if(!u)return;if(!needGPS())return;
  const addr=F.addresses[SELECTED_ADDR];
  if(!addr||!addr.addr||addr.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const items=[];let tot=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0){items.push({n:p.n,q,p:p.p});tot+=p.p*q}});
  if(!items.length){showToast('❌ Cart khali hai','error');return}
  
  let discount=0,couponCode=null;
  if(APPLIED_COUPON){
   const result=applyCoupon(APPLIED_COUPON,tot);
   if(result.valid){discount=result.discount;couponCode=result.code;
    S.coupons[couponCode].usage++;
   }
  }
  
  const finalTotal=tot-discount;
  S.orders.push({id:Date.now(),name:u.n,phone:u.p,area:addr.area||'Udala',addr:addr.addr,map:addr.map,notes:F.notes,items,total:finalTotal,originalTotal:tot,discount,coupon:couponCode,status:'pending',paid:0,date:todayStr(),slot:F.slot||'default',riderStatus:'pending',deliveryPhoto:null});
  
  if(ME){
   const sub=S.subs.find(s=>s.phone===u.p);
   if(sub){sub.points=(sub.points||0)+Math.floor(finalTotal/10);}
  }
  
  C={};APPLIED_COUPON=null;save();showToast(`✅ Order mil gaya! ${couponCode?`Saved ${inr(discount)}`:''} Points earned: ${Math.floor(finalTotal/10)}`);
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *ORDER*%0A👤 ${u.n}%0A📦 ${items.map(i=>i.n+' x'+i.q).join(', ')}%0A💰 ${inr(finalTotal)}${discount?` (Saved ${inr(discount)})`:''}%0A📍 ${addr.map}`,'_blank')},
 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;
  S.pays.push({id:Date.now(),d:todayStr(),name:s.name,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});save();showToast('✅ Verified! Plan ACTIVE')},
 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm(s.name+' ka plan reject karein?')){s.status='rejected';save();showToast('❌ Reject ho gaya')}},
 orderPaid:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(!o)return;o.paid=1;o.status='delivered';
  S.pays.push({id:Date.now(),d:todayStr(),name:o.name,amt:o.total,mode:'cash',kind:'Shop'});save();showToast('✅ Paid & delivered')},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save()},
 odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.status='delivered';save();showToast('✅ Delivered')}},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim();
  const kind=($('#pkind')?.value)||'grocery',img=($('#pimg')?.value||'').trim();
  if(!n||!p||p<=0){showToast('❌ Naam aur price daalo','error');return}
  S.prod.push({id:Date.now(),n,p,c,nv:0,s:1,mrp:0,brand:'',img:kind==='food'?(img||IMG.thali):(img||IMG.grocery),kind,rating:kind==='food'?4.3:0,time:kind==='food'?25:0,best:0,components:[]});
  save();showToast('✅ Product add')},
 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);save()}},
 applyCoupon:()=>{const code=$('#couponInput')?.value?.trim();if(!code){showToast('❌ Coupon code daalo','error');return}
  const total=Object.entries(C).reduce((sum,[k,q])=>{const p=S.prod.find(x=>x.id==k);return sum+(p&&q>0?p.p*q:0)},0);
  const result=applyCoupon(code,total);
  if(result.valid){APPLIED_COUPON=result.code;showToast(`✅ ${result.code} applied! Saved ${inr(result.discount)}`);}
  else showToast(`❌ ${result.error}`,'error');
  render();},
 addCoupon:()=>{const code=prompt('Coupon code (e.g., SAVE50):')?.trim().toUpperCase();if(!code)return;
  const discount=parseInt(prompt('Discount amount/percent:')||'0');if(!discount)return;
  const type=prompt('Type (flat/percent/delivery):')||'flat';
  const minOrder=parseInt(prompt('Min order amount (0 for no limit):')||'0');
  S.coupons[code]={discount,minOrder,expiry:'2026-12-31',type,usage:0,maxUsage:100};
  save();showToast(`✅ Coupon ${code} created!`);},
 setMenu:()=>{const k=iso(addDays(new Date(),1));S.mset[k]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save();showToast('💾 Menu save')},
 setPartners:()=>{S.partners=($('#partners')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);save();showToast('💾 Partners save')},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));
  const veg=on.filter(s=>s.type==='veg').length,nv=on.filter(s=>s.type==='nv').length;
  const t=`🍱 KITCHEN ${k}\n👥 Total: ${on.length}\n🟢 Veg: ${veg}\n🔴 NV: ${nv}\n\n`+on.map(s=>`• ${s.name} (${s.type}) - ${packItems(s).join(', ')}`).join('\n');
  navigator.clipboard.writeText(t).then(()=>showToast('📋 Copy ho gaya!')).catch(()=>showToast('❌ Copy nahi hua','error'))},
 backup:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup download ho gaya')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render();showToast('🚪 Logout')}
};

window.handlePhotoUpload=handlePhotoUpload;

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACTIONS[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id,b.dataset.date)}catch(err){console.error(err);showToast('❌ Error','error')}}});
document.addEventListener('input',e=>{
 const f=e.target.dataset?.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone);return}
 if(e.target.id==='sq'){SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
});
$('#restoreFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{const d=JSON.parse(rd.result);S=mergeStates(S,d);save();showToast('✅ Backup restore ho gaya!')}catch(err){showToast('❌ Galat backup file','error')}};
 rd.readAsText(file);e.target.value=''});
