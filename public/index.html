 s.skip=Array.isArray(s.skip)?s.skip:[];s.pause=Array.isArray(s.pause)?s.pause:[];
 s.lunch=['roti','chawal','both'].includes(s.lunch)?s.lunch:'chawal';

 s.addr=s.addr||'';s.area=s.area||'Udala';s.map=s.map||'';s.notes=s.notes||'';s.utr=s.utr||'';
 s.paid=s.paid?1:0;s.trial=s.trial?1:0;s.ts=s.ts||s.id;s.deviceFp=s.deviceFp||'';s.avatar=s.avatar||randAvatar(s.id);
 s.rating=s.rating||0;s.feedback=s.feedback||'';

 return s};
const normalizeOrder=o=>{if(!o||!o.id)return null;
 o.name=String(o.name||'Customer');o.phone=cleanPhone(o.phone);
 o.items=Array.isArray(o.items)?o.items.filter(i=>i&&i.n):[];
 o.total=Math.max(0,+o.total||0);o.date=o.date||todayStr();
 if(!['pending','confirmed','out','delivered','cancelled'].includes(o.status))o.status='pending';
 if(!Array.isArray(o.statusHistory))o.statusHistory=[{st:o.status,ts:o.ts||Date.now()}];

 o.slot=o.slot||'lunch';o.coupon=o.coupon||'';o.discount=+o.discount||0;

function migrate(d){
  if(!d||typeof d!=='object')return {v:SCHEMA_V,prod:[],subs:[],orders:[],pays:[],meals:{},done:{},mset:{},coupons:COUPONS_DEFAULT,notifications:[],waste:[],wallet:{},walletLedger:[],reviews:[],lastOrderTime:0};
  const v=d.v||1;
  if(v<2)(d.orders||[]).forEach(o=>{o.slot=o.slot||'lunch';o.discount=o.discount||0;o.coupon=o.coupon||''});
  if(v<3){d.coupons=d.coupons||COUPONS_DEFAULT;d.walletLedger=d.walletLedger||[]}
  if(v<4)(d.subs||[]).forEach(s=>{if(!s.avatar)s.avatar=randAvatar(s.id)});
  if(v<5){(d.orders||[]).forEach(o=>{o.rating=o.rating||0;o.feedback=o.feedback||''});(d.subs||[]).forEach(s=>{s.rating=s.rating||0;s.feedback=s.feedback||''})}
  if(v<6){(d.orders||[]).forEach(o=>{if(!Array.isArray(o.statusHistory))o.statusHistory=[{st:o.status||'pending',ts:o.ts||Date.now()}];o.paymentMode=o.paymentMode||(o.paid?'UPI':'COD')});d.reviews=d.reviews||[]}
  d.prod=d.prod||[];d.subs=d.subs||[];d.orders=d.orders||[];d.pays=d.pays||[];d.expenses=d.expenses||[];
  d.meals=d.meals||{};d.done=d.done||{};d.mset=d.mset||{};d.cred=d.cred||{};d.refs=d.refs||{};
  d.wallet=d.wallet||{};d.walletLedger=d.walletLedger||[];d.feedback=d.feedback||{};
  d.coupons=d.coupons||COUPONS_DEFAULT;d.notifications=d.notifications||[];d.referrals=d.referrals||{};
  d.waste=d.waste||[];d.reviews=d.reviews||[];d.lastOrderTime=d.lastOrderTime||0;
  d.partners=d.partners||['Raju Bhaiya'];d.dailyVideo=d.dailyVideo||'';
  d.v=SCHEMA_V;return d;
}

function loadState(){
 const out={v:SCHEMA_V,prod:[],subs:[],orders:[],pays:[],expenses:[],meals:{},done:{},mset:{},cred:{},refs:{},wallet:{},walletLedger:[],feedback:{},dailyVideo:'',partners:['Raju Bhaiya'],coupons:COUPONS_DEFAULT,notifications:[],referrals:{},waste:[],reviews:[],lastOrderTime:0};
 [STORAGE_KEY,'udala2','udala6','udala7','udala_logic'].forEach(k=>{
  try{const raw=localStorage.getItem(k);if(!raw)return;let d=migrate(JSON.parse(raw));if(!d||typeof d!=='object')return;
   (d.prod||[]).forEach(p=>{const n=normalizeProd(p);if(n&&!out.prod.find(x=>x.id===n.id))out.prod.push(n)});
   (d.subs||[]).forEach(s=>{const n=normalizeSub(s);if(n&&!out.subs.find(x=>x.id===n.id))out.subs.push(n)});
   (d.orders||[]).forEach(o=>{const n=normalizeOrder(o);if(n&&!out.orders.find(x=>x.id===n.id))out.orders.push(n)});
   (d.pays||[]).forEach(p=>{if(p&&p.id&&!out.pays.find(x=>x.id===p.id))out.pays.push(p)});
   (d.expenses||[]).forEach(p=>{if(p&&p.id&&!out.expenses.find(x=>x.id===p.id))out.expenses.push(p)});
   Object.assign(out.meals,d.meals||{});Object.assign(out.done,d.done||{});Object.assign(out.mset,d.mset||{});
   Object.assign(out.cred,d.cred||{});Object.assign(out.refs,d.refs||{});Object.assign(out.wallet,d.wallet||{});
   out.walletLedger=out.walletLedger.concat(d.walletLedger||[]);Object.assign(out.feedback,d.feedback||{});
   Object.assign(out.coupons,d.coupons||COUPONS_DEFAULT);Object.assign(out.notifications,d.notifications||[]);
   Object.assign(out.referrals,d.referrals||{});Object.assign(out.waste,d.waste||{});
   out.reviews=out.reviews.concat(d.reviews||[]);
   if(d.dailyVideo&&!out.dailyVideo)out.dailyVideo=d.dailyVideo;
   if(d.lastOrderTime)out.lastOrderTime=d.lastOrderTime;
  }catch(e){}
 });
 if(!out.prod.length)out.prod=SEED.slice();
 if(!out.prod.some(p=>p.kind==='food'))FOOD_SEED.forEach(f=>out.prod.push({...f,id:generateId()}));
 return {data:out,recovered:0};
}

   <div style="display:flex;gap:8px"><button class="btn r" data-a="closeModal" style="flex:1">Cancel</button><button class="btn g" data-a="submitReview" data-id="${o.id}" style="flex:1">✅ Submit</button></div>

 setStar:(v,k,n)=>{RATE_STARS=+n;$$('#starRow .star-big').forEach((s,i)=>{s.style.color=i<RATE_STARS?'var(--gold)':'var(--muted)';s.style.transform=i===RATE_STARS-1?'scale(1.3)':'scale(1)'})},
 submitReview:(v,k,id)=>{
  const o=(S.orders||[]).find(x=>x.id==id);if(!o)return;
  if(!RATE_STARS){showToast('❌ Stars select karein','error');return}
  o.rating=RATE_STARS;o.feedback=($('#revText')?.value||'').trim();
  S.reviews=S.reviews||[];
  S.reviews.unshift({id:generateId(),orderId:o.id,phone:o.phone,name:o.name,rating:RATE_STARS,feedback:o.feedback,items:o.items.map(i=>i.n),date:todayStr(),ts:Date.now()});
  addNotification('review',`⭐ ${o.name} ne ${RATE_STARS} star diya`,{orderId:o.id});
  save(true);closeModal();showToast('✅ Shukriya! Review save');showConfetti()},
 printInvoice:(v,k,id)=>{
  const o=(S.orders||[]).find(x=>x.id==id);if(!o)return;
  const rows=o.items.map(i=>`<tr><td style="padding:6px 8px;border-bottom:1px solid #ddd">${i.n}</td><td style="padding:6px 8px;border-bottom:1px solid #ddd;text-align:center">${i.q}</td><td style="padding:6px 8px;border-bottom:1px solid #ddd;text-align:right">Rs.${i.p}</td><td style="padding:6px 8px;border-bottom:1px solid #ddd;text-align:right">Rs.${i.p*i.q}</td></tr>`).join('');
  const w=window.open('','_blank');
  if(!w){showToast('❌ Popup allow karein','error');return}
  w.document.write(`<html><head><title>Invoice #${String(o.id).slice(-4)}</title></head><body style="font-family:Arial,sans-serif;color:#111;padding:24px">
  <div style="text-align:center;border-bottom:3px solid #FF6B35;padding-bottom:12px;margin-bottom:16px">
   <h2 style="margin:0;color:#E85D04">NAMASTE UDALA</h2>
   <div style="font-size:12px">Ghar jaisa khana · Roz time pe · Udala</div>
   <div style="font-size:12px">📱 ${CONFIG.whatsapp} · UPI: ${CONFIG.upi}</div>
  </div>
  <table style="width:100%;font-size:13px;margin-bottom:14px"><tr>
   <td style="vertical-align:top"><b>Bill To:</b><br>${o.name}<br>${o.addr}, ${o.area}<br>Ph: ${o.phone}</td>
   <td style="text-align:right;vertical-align:top"><b>Invoice #:</b> ${String(o.id).slice(-6)}<br><b>Date:</b> ${o.date}<br><b>Slot:</b> ${o.slot}<br><b>Payment:</b> ${o.paymentMode} ${o.paid?'(PAID)':'(DUE)'}</td>
  </tr></table>
  <table style="width:100%;border-collapse:collapse;font-size:13px">
   <thead><tr style="background:#f3f4f6"><th style="padding:6px 8px;text-align:left">Item</th><th style="padding:6px 8px">Qty</th><th style="padding:6px 8px;text-align:right">Rate</th><th style="padding:6px 8px;text-align:right">Amount</th></tr></thead>
   <tbody>${rows}</tbody>
  </table>
  <table style="width:100%;font-size:13px;margin-top:12px">
   <tr><td style="text-align:right;padding:4px 8px">Subtotal:</td><td style="text-align:right;width:120px;padding:4px 8px">Rs.${o.sub||o.total}</td></tr>
   ${o.discount?`<tr><td style="text-align:right;padding:4px 8px">Discount (${o.coupon}):</td><td style="text-align:right;padding:4px 8px">-Rs.${o.discount}</td></tr>`:''}
   ${o.tip?`<tr><td style="text-align:right;padding:4px 8px">Tip:</td><td style="text-align:right;padding:4px 8px">Rs.${o.tip}</td></tr>`:''}
   <tr><td style="text-align:right;padding:6px 8px;font-size:16px"><b>GRAND TOTAL:</b></td><td style="text-align:right;padding:6px 8px;font-size:16px"><b>Rs.${o.total}</b></td></tr>
  </table>
  <div style="margin-top:26px;display:flex;justify-content:space-between;font-size:12px">
   <div>Customer Sign: ____________</div><div>For Namaste Udala<br><br>Authorised Sign: ____________</div>
  </div>
  <div style="text-align:center;font-size:11px;color:#666;margin-top:22px;border-top:1px dashed #bbb;padding-top:10px">Thank you! 🙏 · Status: ${o.status}</div>
  <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print()},400)}</scr`+`ipt>
  </body></html>`);
  w.document.close()},
 verifyPay:(v,k,id)=>{
  const s=(S.subs||[]).find(x=>x.id==id);if(!s)return;
  s.status='active';s.paid=1;
  S.pays.push({id:generateId(),d:todayStr(),name:s.name,phone:s.phone,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});
  addNotification('verified',`✅ ${s.name} ka payment verify hua`,{phone:s.phone});
  save(true);showToast('✅ Active!');showConfetti();closeModal()},
 rejectPay:(v,k,id)=>{const s=(S.subs||[]).find(x=>x.id==id);if(!s)return;if(confirm('Reject karna hai?')){s.status='rejected';save(true)}},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done=S.done||{};S.done[key]=S.done[key]?0:1;save(true)},
 addProd:()=>{
  if(!S||!S.prod){showToast('❌ Data load ho raha hai','error');return}
  const n=($('#pn')?.value||'').trim();
  const p=Number($('#pp')?.value);
  const c=($('#pc')?.value||'General').trim();
  const kind=($('#pkind')?.value)||'grocery';
  if(!n||!p||p<=0){showToast('❌ Sahi Naam aur Price','error');return}
  S.prod.push({id:generateId(),n,p,c,nv:0,s:1,img:kind==='food'?IMG.thali:IMG.grocery,kind,rating:kind==='food'?4.3:0,time:kind==='food'?25:0,best:0});
  save(true);showToast('✅ Product add!');
  ['#pn','#pp','#pc'].forEach(i=>{const el=$(i);if(el)el.value=''})},
 stock:(v,k,id)=>{const p=(S.prod||[]).find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=(S.prod||[]).find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);save(true)}},
 setMenu:()=>{const k=iso(addDays(new Date(),1));S.mset=S.mset||{};S.mset[k]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save(true);showToast('💾 Save')},
 addWaste:()=>{const item=($('#wasteItem')?.value||'').trim(),qty=parseInt($('#wasteQty')?.value)||0,reason=($('#wasteReason')?.value||'').trim();
  if(!item||!qty){showToast('❌ Item + qty','error');return}
  S.waste=S.waste||[];S.waste.push({id:generateId(),date:todayStr(),item,qty,reason});
  save(true);showToast('🗑️ Waste recorded');
  $('#wasteItem').value='';$('#wasteQty').value='';$('#wasteReason').value=''},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));
  navigator.clipboard.writeText(`🍱 KITCHEN ${k}\n👥 ${on.length}\n\n`+on.map(s=>`• ${s.name} - ${packItems(s).join(', ')}`).join('\n')).then(()=>showToast('📋 Copy!')).catch(()=>showToast('❌ Copy fail','error'))},
 backup:()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup')},
 restore:()=>{$('#restoreFile').click()},
 exportData:()=>{
  const csv=['Type,Date,Name,Phone,Amount,Status'];
  (S.orders||[]).forEach(o=>csv.push(`Order,${o.date},${o.name},${o.phone},${o.total},${o.status}`));
  (S.pays||[]).forEach(p=>csv.push(`Payment,${p.d},${p.name},${p.phone},${p.amt},verified`));
  (S.walletLedger||[]).forEach(x=>csv.push(`Wallet,${x.date},${x.name},${x.phone},${x.amt},${x.status}`));
  const blob=new Blob([csv.join('\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='udala-export-'+todayStr()+'.csv';a.click();
  showToast('📤 Exported!')},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render()}
};

document.addEventListener('click',e=>{
 if(e.target.classList.contains('modal')){closeModal();return}
 const b=e.target.closest('[data-a]');if(!b)return;
 const f=ACTIONS[b.dataset.a];
 if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(err){console.error(err);showToast('❌ '+err.message,'error')}}
});
document.addEventListener('input',e=>{const f=e.target.dataset?.f;
 if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone)}
 if(e.target.id==='sq'){clearTimeout(window._t);window._t=setTimeout(()=>{SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{S=migrate(JSON.parse(r.result));save(true);showToast('✅ Restore!')}catch(err){showToast('❌ Galat file','error')}};
 r.readAsText(f);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Owner PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();showToast('🔓 Owner')}else showToast('❌ PIN','error')}});

const initTheme=()=>{
  const saved=localStorage.getItem('ud_theme');
  let t=saved||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  document.documentElement.setAttribute('data-theme',t);
  $('#themeToggle').textContent=t==='dark'?'☀️':'🌙';
};
$('#themeToggle').addEventListener('click',()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('ud_theme',n);$('#themeToggle').textContent=n==='dark'?'☀️':''});
const initParticles=()=>{const c=$('#particles');if(!c)return;
 for(let i=0;i<25;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*12+'s';p.style.animationDuration=(10+Math.random()*6)+'s';p.style.opacity=Math.random()*0.6+0.2;c.appendChild(p)}};

let S=null;
let isLoading=true;

async function initCloudState(){
  const safetyTimeout=setTimeout(()=>{if(isLoading){S=loadState().data;isLoading=false;render()}},5000);
  try{
    const pathsToCheck=['namaste_udala_data','udala_state','udala_final_v1'];
    let dataFound=false;
    for(let path of pathsToCheck){
      try{
        const testRef=ref(db,path);
        const snapshot=await get(testRef);
        if(snapshot.exists()){
          S=migrate(snapshot.val());dataFound=true;
          onValue(testRef,snap=>{if(snap.exists()){S=migrate(snap.val());render()}});
          break;
        }
      }catch(err){}
    }
    if(!dataFound)S=loadState().data;
  }catch(error){S=loadState().data}
  clearTimeout(safetyTimeout);
  isLoading=false;
  render();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
});

initTheme();
initParticles();
initCloudState();
setTimeout(()=>showToast('✨ Premium App Ready!'),600);
</script>
</body>
</html>
