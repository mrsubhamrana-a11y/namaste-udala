svconfirm:()=>{if(BUSY)return;const b=SVC.find(x=>x.id===SVB);if(!b)return;const n=SVF.name.trim(),p=ph(SVF.phone);
if(n.length<2||p.length!==10||!SVF.date){notify('⚠️ Naam, 10-digit phone aur date daalo');return}
BUSY=1;setTimeout(()=>BUSY=0,3000);
S.sv.push({id:uid('v'),ts:Date.now(),svid:b.id,svname:b.n,cat:b.cat,date:SVF.date,time:SVF.time,opt:SVF.opt,notes:SVF.notes,name:n,phone:p,amt:b.from,utr:(SVF.utr||'').replace(/\D/g,''),status:'pending',paid:0});
track('service_book',{n:b.n});logAdd('Service '+b.n+' / '+n);SVB=null;save();notify('✅ Booking request gayi — owner call karega')},
svconf:(v,k,id)=>{if(!needOK())return;const x=S.sv.find(y=>y.id===id);if(x){x.status='confirmed';save();notify('✅ Booking confirmed')}},
svdone:(v,k,id)=>{if(!needOK())return;const x=S.sv.find(y=>y.id===id);if(x){x.status='done';save();notify('🟢 Service done')}},
svpaid:(v,k,id)=>{if(!needOK())return;const x=S.sv.find(y=>y.id===id);if(x&&!x.paid&&confirm(x.name+': '+inr(x.amt)+' mil gaye?')){x.paid=1;S.pays.push({id:uid('p'),d:iso(D0()),name:x.name,phone:x.phone,amt:x.amt,mode:'online',kind:'Service'});award(x.phone,x.amt/10);save();notify('✅ Service paid')}},
bopen:()=>{BOPEN=1;BF.name=ME?.name||F.name;BF.phone=ME?.phone||F.phone;render()},bclose:()=>{BOPEN=0;render()},
bpkg:v=>{BF.pkg=v;render()},binc:()=>{BF.plates=clamp(BF.plates+(BF.plates<100?10:50),20,2000);render()},bdec:()=>{BF.plates=clamp(BF.plates-(BF.plates<=100?10:50),20,2000);render()},bset:v=>{BF.plates=+v;render()},
ainc:()=>{BF.addons=clamp(BF.addons+5,0,50);render()},adec:()=>{BF.addons=clamp(BF.addons-5,0,50);render()},bslot:v=>{BF.slot=v;render()},
bsubmit:()=>{if(BUSY)return;const c=bcalc(),n=BF.name.trim(),p=ph(BF.phone);
if(n.length<2||p.length!==10||!BF.event||!BF.date||!BF.venue){notify('⚠️ Event, date, venue, naam, phone daalo');return}
if(loadOn(BF.date)+BF.plates>CAP()){notify('🚫 '+BF.date+' capacity full ('+loadOn(BF.date)+'/'+CAP()+') — doosri date chuno');return}
BUSY=1;setTimeout(()=>BUSY=0,3000);const pk=BPKG.find(x=>x.id===BF.pkg);
S.bulk.push({id:uid('b'),ts:Date.now(),pkg:BF.pkg,pkgName:pk.n,cat:pk.cat,plates:BF.plates,addons:BF.addons,slot:BF.slot,slotT:BF.slotT,event:BF.event,date:BF.date,venue:BF.venue,name:n,phone:p,notes:BF.notes,rate:c.rate,amt:c.total,adv:Math.round(c.total*.5),utr:'',paidAdv:0,status:'pending',paid:0});
track('bulk_request',{plates:BF.plates});logAdd('Bulk '+n+' '+BF.plates+'p');BOPEN=0;save();notify('✅ Bulk request gayi! Advance '+inr(Math.round(c.total*.5)))},
bconf:(v,k,id)=>{if(!needOK())return;const b=S.bulk.find(x=>x.id===id);if(b){b.status='confirmed';save();notify('✅ Bulk confirmed')}},
bpadv:(v,k,id)=>{if(!needOK())return;const b=S.bulk.find(x=>x.id===id);if(b&&!b.paidAdv){b.paidAdv=1;S.pays.push({id:uid('p'),d:iso(D0()),name:b.name,phone:b.phone,amt:b.adv,mode:'online',kind:'Bulk Advance'});save();notify('💰 Advance mil gaya')}},
bpaid:(v,k,id)=>{if(!needOK())return;const b=S.bulk.find(x=>x.id===id);if(!b||b.paid)return;const bal=b.amt-(b.paidAdv?b.adv:0);if(!confirm(b.event+': baaki '+inr(bal)+' mil gaye?'))return;b.paid=1;b.paidAdv=1;b.status='done';S.pays.push({id:uid('p'),d:iso(D0()),name:b.name,phone:b.phone,amt:bal,mode:'online',kind:'Bulk'});award(b.phone,b.amt/10);save();notify('✅ Bulk full paid')},
setcap:()=>{if(!needOK())return;const v=+$('#capv').value;if(!(v>=20&&v<=2000)){notify('⚠️ 20–2000 ke beech');return}S.cap=v;logAdd('Capacity '+v);save();notify('💾 Capacity '+v+' plate/din')},
setmin:()=>{if(!needOK())return;const v=+$('#minv').value;if(!(v>=0&&v<=2000)){notify('⚠️ 0–2000');return}S.cfg.minOrder=v;logAdd('Min order '+v);save();notify('💾 Min order '+inr(v))},
setk:()=>{if(!needOK())return;if(!navigator.geolocation){notify('GPS nahi');return}navigator.geolocation.getCurrentPosition(p=>{S.kll=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);save();notify('📍 Kitchen point set')},()=>notify('⚠️ Location nahi mili'))},
setmenu:()=>{if(!needOK())return;const k=iso(addD(D0(),1));S.mset[k]={veg:($('#mveg')?.value||'').slice(0,60),nv:($('#mnv')?.value||'').slice(0,60)};logAdd('Menu set '+k);save();notify('💾 Kal ka menu save')},
addexp:()=>{if(!needOK())return;const n=($('#expn')?.value||'').trim(),a=+$('#expa')?.value;if(!n||!(a>0)){notify('⚠️ Naam aur amount daalo');return}S.exp.push({d:iso(D0()),n:n.slice(0,40),amt:Math.round(a)});logAdd('Expense '+n);save();notify('💸 Kharcha add — '+inr(a))},
expall:()=>{if(!needOK())return;const rows=[['Type','Date','Name','Phone','Amount','Mode','Kind']];S.pays.forEach(p=>rows.push(['IN',p.d,p.name,p.phone||'',p.amt,p.mode,p.kind]));S.exp.forEach(x=>rows.push(['OUT',x.d,x.n,'',x.amt,'cash','Expense']));csvDl('nu-ledger.csv',rows);notify('📤 Ledger CSV download')},
expcust:()=>{if(!needOK())return;const m={};S.subs.forEach(s=>{const c=m[s.phone]=m[s.phone]||{name:s.name,phone:s.phone,area:s.area,plans:0,orders:0,spend:0};c.plans++;c.spend+=s.paid?s.price:0});S.orders.forEach(o=>{if(!o.phone)return;const c=m[o.phone]=m[o.phone]||{name:o.name,phone:o.phone,area:o.area,plans:0,orders:0,spend:0};c.orders++;c.spend+=o.paid?o.total:0});
csvDl('nu-customers.csv',[['Name','Phone','Area','Plans','Orders','Spend','Points'],...Object.values(m).map(c=>[c.name,c.phone,c.area,c.plans,c.orders,c.spend,S.pts[c.phone]||0])]);notify('📇 Customers CSV download')},
expp:()=>{if(!needOK())return;csvDl('nu-products.csv',[['Name','Price','MRP','Category','Stock','Half','NV'],...S.prod.map(p=>[p.n,p.p,p.mrp||'',p.c,p.s,p.h,p.nv])]);notify('📦 Products CSV download')},
expEvents:()=>{if(!needOK())return;csvDl('nu-events.csv',[['Time','Session','Name','Phone','Tab','Event','Detail'],...S.events.map(e=>[new Date(e.ts).toISOString(),e.sess,e.name,e.phone,e.tab,e.ev,JSON.stringify(e.data)])]);notify('📤 Events CSV download')},
clearEvents:()=>{if(!needOK()||!confirm('Sab behavior events clear karein?'))return;S.events=[];save();notify('🗑️ Events clear')},
remindCart:(v,k,id)=>{track('cart_remind',{phone:id});wa(id,'Namaste! 🙏 Aapne Namaste Udala app mein items cart mein chhode the. Order karna ho toh reply karo — free delivery 🛵 Minimum order '+inr(S.cfg.minOrder)+' 💚')},
digest:()=>{if(!needOK())return;const td=iso(D0()),on=S.subs.filter(s=>act(s,D0())&&!(s.skip||[]).includes(td)).length,prep=prepRows(iso(addD(D0(),1))).length;
const E=S.events,sess=new Set(E.map(e=>e.sess)).size,orders=E.filter(e=>e.ev==='order').length;
wa('9583937047','🌅 NAMASTE UDALA · '+td+NL+'🍱 Aaj dabbe: '+on+NL+'📋 Kal prep: '+prep+NL+'🛒 Shop pending: '+S.orders.filter(o=>!o.dlv).length+NL+'💰 Aaj kamai: '+inr(S.pays.filter(p=>p.d===td).reduce((a,p)=>a+p.amt,0))+NL+'🧠 Sessions: '+sess+' · Orders: '+orders);
S.digest.date=td;save()},
printInv:(v,k,id)=>printInvoice(id),prepPrint:()=>printPrep(),
voice:()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify('🎤 Voice is browser mein nahi (Chrome use karo)');return}
const r=new SR();r.lang='hi-IN';r.interimResults=false;notify('🎤 Bolo — item ka naam');
r.onresult=e=>{const txt=e.results[0][0].transcript;const words=txt.toLowerCase().split(/[,;]/);let n=0;
words.forEach(w=>{const nm=w.trim().replace(/\s*\d+\s*$/,'');const q=(w.match(/(\d+)\s*$/)||[0,1])[1];const p=S.prod.find(x=>x.s&&x.n.toLowerCase().includes(nm));if(p){C[p.id]=clamp((C[p.id]||0)+ +q,0,99);n++;track('add_cart',{n:p.n,q:+q,voice:1})}});
SQ=n?'':txt;saveC();track('search',{q:txt,voice:1});render();notify(n?'🎤 '+n+' item cart mein add':'🎤 "'+txt+'" — koi item match nahi')};
r.onerror=()=>notify('⚠️ Mic error — permission do');r.start()},
theme:()=>{const d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'';localStorage.setItem('nu_theme',d?'dark':'');$('#themeBtn').textContent=d?'☀️':''},
installApp:async()=>{if(window._dp){window._dp.prompt();const r=await window._dp.userChoice;if(r.outcome==='accepted'){INSTALLED=true;$('#installBtn').hidden=true;render()}window._dp=null}
else alert('📲 Install kaise kare:'+NL+'• Android Chrome: menu (⋮) → "Install app" / "Add to Home screen"'+NL+'• iPhone Safari: Share → "Add to Home Screen"')},
out:()=>{OK=0;STAFF=0;sessionStorage.removeItem('nu_ok');sessionStorage.removeItem('nu_staff');tab='plan';OVIEW='dash';render();notify('🔒 Owner se bahar')},
reset:()=>{if(!needOK())return;if(!confirm('⚠️ SAB DATA DELETE — customers, orders, payments!'+NL+'Pehle Firebase se Export JSON backup liya?'))return;
if(prompt('Pakka? Type karo: DELETE')!=='DELETE'){notify('❌ Reset cancel');return}
S=seedState();S.subs=[];S.orders=[];S.sv=[];S.bulk=[];S.pays=[];S.exp=[];S.events=[];S.log=[];S.pts={};S.cred={};S.refs={};C={};MY=[];saveC();saveMY();logAdd('FULL RESET');save();notify('🗑️ Reset ho gaya')}
};

/* ---------- listeners ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.add,.padd');if(!b)return;const r=document.createElement('span');r.className='rip';const rc=b.getBoundingClientRect(),sz=Math.max(rc.width,rc.height);r.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-rc.left-sz/2)+'px;top:'+(e.clientY-rc.top-sz/2)+'px';b.appendChild(r);setTimeout(()=>r.remove(),650)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const f=A[b.dataset.a];if(!f)return;e.preventDefault();try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){console.error(x);notify('⚠️ '+x.message)}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-a="sel"]');if(b){A.sel(null,null,b.dataset.id);return}});
let sT;document.addEventListener('input',e=>{const d=e.target.dataset||{};
if(d.f){F[d.f]=e.target.value;if(d.f==='phone')F.phone=ph(F.phone);if(d.f==='extraRoti')F.extraRoti=clamp(+F.extraRoti||0,0,4)}
if(d.bf){BF[d.bf]=e.target.value;if(d.bf==='phone')BF.phone=ph(BF.phone)}
if(d.svf){SVF[d.svf]=e.target.value;if(d.svf==='phone')SVF.phone=ph(SVF.phone)}
if(e.target.id==='sq'){SQ=e.target.value;clearTimeout(sT);sT=setTimeout(()=>{if(SQ.trim())track('search',{q:SQ.trim()});const el=$('#pl');if(el)el.innerHTML=shopList()},320)}
if(e.target.id==='oq'){OQ=e.target.value;clearTimeout(sT);sT=setTimeout(()=>{const v=e.target.value,p=e.target.selectionStart;render();const i=$('#oq');if(i){i.focus();i.setSelectionRange(p,p)}},380)}});
document.addEventListener('keydown',e=>{const t=e.target;
if((e.key==='Enter'||e.key===' ')&&t?.dataset?.a&&!['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(t.tagName)){e.preventDefault();A[t.dataset.a]?.(t.dataset.v,t.dataset.k,t.dataset.id);return}
const open=PQ||TRACK||PSUC||EDITP||CUST;if(!open)return;
if(e.key==='Escape'){A.closeD();return}
if(e.key==='Tab'){const sh=$('.sheet');if(!sh)return;const f=[...sh.querySelectorAll('button,[href],input,select,textarea')].filter(x=>!x.disabled);if(!f.length)return;const first=f[0],last=f[f.length-1];
if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
let dragId=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest('.drag');if(r){dragId=+r.dataset.pid;e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const r=e.target.closest('.drag');if(r&&dragId){e.preventDefault();r.classList.add('over')}});
document.addEventListener('dragleave',e=>e.target.closest('.drag')?.classList.remove('over'));
document.addEventListener('drop',e=>{const r=e.target.closest('.drag');if(!r||!dragId)return;e.preventDefault();r.classList.remove('over');
const to=+r.dataset.pid,a=S.prod.findIndex(p=>p.id===dragId),b=S.prod.findIndex(p=>p.id===to);
if(a>=0&&b>=0&&a!==b){const [m]=S.prod.splice(a,1);S.prod.splice(b,0,m);logAdd('Product reorder');save();notify('↕️ Order badal gaya')}dragId=null});
document.addEventListener('dragend',()=>{dragId=null;$$('.drag.over').forEach(x=>x.classList.remove('over'))});

/* ---------- owner unlock ---------- */
function ologin(){const x=prompt('Owner PIN');if(x===null)return;if(x!==OPIN){notify('❌ Galat PIN');return}OK=1;sessionStorage.setItem('nu_ok','1');tab='owner';OVIEW='dash';PQ=TRACK=PSUC=null;render();notify('🔓 Owner panel khul gaya')}
let hc=0,hcT,lpT,lpF=false;const logo=$('#logoTap');
logo.addEventListener('pointerdown',()=>{lpF=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpF=true;hc=0;ologin()},700)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>logo.addEventListener(ev,()=>clearTimeout(lpT)));
logo.addEventListener('click',()=>{if(lpF){lpF=false;return}hc++;clearTimeout(hcT);hcT=setTimeout(()=>hc=0,1800);if(hc===3)notify('🔐 Owner mode — 2 aur tap');if(hc>=5){hc=0;clearTimeout(hcT);ologin()}});

/* ---------- pwa + init ---------- */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._dp=e;if(!INSTALLED)$('#installBtn').hidden=false});
$('#installBtn').addEventListener('click',()=>A.installApp());
window.addEventListener('appinstalled',()=>{INSTALLED=true;$('#installBtn').hidden=true;localStorage.setItem('nu_inst','1');render()});
setTimeout(()=>{if(!INSTALLED&&!localStorage.getItem('nu_inst'))$('#installBtn').hidden=false},2600);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(localStorage.getItem('nu_theme')==='dark'){document.documentElement.dataset.theme='dark';$('#themeBtn').textContent='☀️'}
try{const v=JSON.parse(localStorage.getItem('nu_view'));if(v){OFIL=v.f||'all';OSORT=v.s||'new'}}catch(e){}
setInterval(()=>{if((TRACK||PSUC)&&!isTyping())render()},20000);
render();
if(location.hash==='#owner')ologin();
if(location.hash==='#delivery')A.tab('delivery');
if(location.hash==='#track'){tab='track';render()}
</script></body></html>
