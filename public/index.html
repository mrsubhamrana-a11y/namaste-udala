<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste Udala</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14452a">
<style>
:root{--o:#e8590c;--g:#15543b;--bg:#fff9f0;--text:#2b1d12;--muted:#8a7561;--card:#fff;--line:#f0e3d3}
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:84px;font-weight:500}
header{background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff;padding:22px 20px 30px;border-radius:0 0 32px 32px;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative;overflow:hidden}
header::after{content:'🍱';position:absolute;right:20px;top:15px;font-size:50px;opacity:.3;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
header b{color:#fcc419;font-size:11px;letter-spacing:3px;font-weight:900}
header h1{font-size:26px;font-weight:900;margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
header .s{color:rgba(255,255,255,.9)!important;font-weight:500}
#v{padding:0 14px;margin-top:-16px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(0,0,0,.06);transition:transform .3s,box-shadow .3s;animation:slideUp .5s ease-out}
.card:active{transform:scale(.98)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card h3{color:var(--g);font-size:17px;font-weight:800;margin-bottom:10px}
.s{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button,.btn{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--text);transition:all .2s}
.seg button:active,.btn:active{transform:scale(.95)}
.seg .on{background:linear-gradient(135deg,#f59f00,#e8590c);color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(232,89,12,.28)}
.btn{background:linear-gradient(135deg,#e8590c,#f59f00);color:#fff;border:0;width:100%;margin-top:8px;font-size:15px;box-shadow:0 6px 20px rgba(232,89,12,.28)}
.btn.g{background:#e3f4e8;color:#1f7a3f;box-shadow:none}
.btn.r{background:#fde8e8;color:#c92a2a;box-shadow:none}
.btn.sm{padding:6px 12px;flex:none;width:auto;margin:0 0 0 4px;font-size:11px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:5px 0;font-size:14px;background:#fffdf9;color:var(--text);font-weight:500}
input:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(232,89,12,.15)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:6px}
.big{background:linear-gradient(135deg,#f59f00,#e8590c);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(232,89,12,.28)}
.big .n{font-size:48px;font-weight:900}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.gr div{background:rgba(255,255,255,.2);border-radius:14px;padding:10px;text-align:center;font-size:11px}
.gr b{font-size:18px;display:block;font-weight:900}
.ban{background:#fff4d6;border:1px solid var(--line);color:var(--text);font-size:13px;border-radius:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);display:flex;justify-content:space-around;padding:10px 0 max(12px,env(safe-area-inset-bottom));z-index:100}
.nav div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);flex:1;transition:all .2s}
.nav div.on{color:var(--o);transform:scale(1.1)}
.nav div.on i{transform:scale(1.2);display:block}
.nav i{display:block;font-style:normal;font-size:22px;margin-bottom:2px;transition:transform .2s}
a{color:var(--o);font-weight:700;font-size:12px}
.hero{background:linear-gradient(135deg,#f59f00,#e8590c);border-radius:28px;padding:24px 20px;margin:14px 0 16px;position:relative;overflow:hidden;box-shadow:0 15px 40px rgba(232,89,12,.3);color:#fff}
.hero::before{content:'';position:absolute;top:-50%;right:-20%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.2) 0%,transparent 70%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.hero .em{font-size:60px;position:absolute;right:14px;top:10px;animation:fl 3s ease-in-out infinite;z-index:2}
.hero h2{font-size:26px;line-height:1.2;margin-bottom:8px;font-weight:900;position:relative;z-index:2}
.hero p{font-size:13px;opacity:.95;position:relative;z-index:2}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:2}
.chips span{background:rgba(255,255,255,.25);backdrop-filter:blur(10px);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700}
.pc{flex:1;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--card);text-align:center;transition:all .2s}
.pc.on{background:#fff1e6;border-color:var(--o);box-shadow:0 0 0 3px rgba(232,89,12,.28)}
.pc div{color:var(--text)}
.sps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp{background:#fff1e6;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;color:var(--text);transition:transform .2s}
.sp:active{transform:scale(.95)}
.vi{display:inline-block;width:16px;height:16px;border:2px solid #16a34a;border-radius:4px;position:relative;vertical-align:-3px;background:#fff}
.vi::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#16a34a}
.vi.nv{border-color:#dc2626}.vi.nv::after{background:#dc2626}
.pc .vi{width:32px;height:32px;border-width:3px}.pc .vi::after{inset:6px}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:24px;padding:8px 14px;font-weight:700;font-size:12px;color:var(--text);transition:all .2s}
.chips2 button.on{background:linear-gradient(135deg,#f59f00,#e8590c);color:#fff;border-color:transparent}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pcard{background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.06);border-radius:20px;padding:12px;text-align:center;color:var(--text);transition:transform .2s}
.pcard:active{transform:scale(.97)}
.pcard .pe{font-size:48px;background:#fff1e6;border-radius:16px;margin-bottom:8px;padding:8px}
.pcard b{display:block;font-size:14px;margin-bottom:8px;min-height:34px;font-weight:700}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(128,128,128,.15)}
.it:last-child{border-bottom:0}
.it.half{padding:0 0 12px 60px}
.ie{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,rgba(232,89,12,.1),rgba(245,159,0,.1));display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.in{flex:1;min-width:0;font-size:14px}.in b{font-size:14px;font-weight:700}
.stp2{display:flex;align-items:center;gap:8px;border:1.5px solid var(--o);border-radius:12px;padding:4px;flex:none;background:rgba(232,89,12,.05)}
.stp2 button{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:var(--o);font-size:20px;font-weight:900}
.stp2 b{min-width:20px;text-align:center;color:var(--o)}
#sq{margin:12px 0 6px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pm div{background:rgba(128,128,128,.1);border-radius:14px;padding:12px 6px;text-align:center}
.pm b{font-size:18px;display:block;color:var(--o);font-weight:900}
.cbar{position:sticky;bottom:80px;background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;box-shadow:0 8px 25px rgba(0,0,0,.2)}
.shc{background:linear-gradient(135deg,#15543b,#23734f)!important;color:#fff!important;border:0!important;border-radius:20px!important;padding:18px!important;margin-bottom:14px!important;box-shadow:0 8px 24px rgba(21,84,59,.3)}
.shc h3{color:#fff!important;font-weight:900}
.shc .s{color:#dbe9e1!important}
.shc .row{border-bottom:1px solid rgba(255,255,255,.15)!important}
.shc .pm div{background:rgba(255,255,255,.18)!important}
.shc .pm b{color:#fff!important}
@media(max-width:380px){.hero h2{font-size:22px}.card{padding:14px}.big .n{font-size:36px}}
</style></head>
<body>
<header><b>NAMASTE UDALA</b><h1 id="ht">Plan</h1><div class="s">Ghar jaisa khana · roz time pe</div></header>
<div id="v"></div>
<div class="nav" id="nav"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",authDomain:"namaste-udala.firebaseapp.com",projectId:"namaste-udala",storageBucket:"namaste-udala.firebasestorage.app",messagingSenderId:"998684348165",appId:"1:998684348165:web:4bb0d2f5335a90a394716c"};
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()))}catch(e){}
const UPI='9583937047@jio';
const PL={veg:{7:749,15:1499,30:2899},nv:{7:949,15:1849,30:3599}};
const SL='Subah 7:30-8:15 · Lunch 1:30-2:15 · Dinner 8:00-9:00';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const D0=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const SEED=[['Doodh 500 ml',30,'Doodh aur dairy'],['Dahi 400 g',40,'Doodh aur dairy'],['Paneer 200 g',80,'Doodh aur dairy'],['Butter 100 g',56,'Doodh aur dairy'],['Chai patti 250 g',130,'Chai aur nashta'],['Coffee 50 g',140,'Chai aur nashta'],['Bread',40,'Chai aur nashta'],['Ande (6)',72,'Chai aur nashta'],['Detergent 1 kg',130,'Ghar ki safai'],['Bartan gel 500 ml',110,'Ghar ki safai'],['Floor cleaner 500 ml',99,'Ghar ki safai'],['Sabun',30,'Body care'],['Shampoo 340 ml',180,'Body care'],['Toothpaste 150 g',95,'Body care'],['Body lotion 100 ml',90,'Body care'],['Sanitary pads (8)',50,'Women care'],['Atta 1 kg',50,'Kirana'],['Chawal 1 kg',70,'Kirana'],['Dal 1 kg',150,'Kirana'],['Tel 1 L',150,'Kirana'],['Roti',5,'Extra khana',1],['Chawal plate',20,'Extra khana',1],['Paneer sabzi',50,'Extra khana',1],['Egg',12,'Extra khana'],['Chicken piece',40,'Extra khana']].map((a,i)=>({id:i+1,n:a[0],p:a[1],c:a[2],s:1,h:a[3]||0}));
let S={prod:SEED,subs:[],orders:[],done:{}};
try{const l=JSON.parse(localStorage.getItem('udala2'));if(l)S=l}catch(e){}
const FM={'Roti':'Roti & Chawal','Chawal plate':'Roti & Chawal','Paneer sabzi':'Sabzi & Dal','Egg':'Non-veg special','Chicken piece':'Non-veg special'};
const NEWF=[['Dal fry',40,'Sabzi & Dal',1,0],['Mix veg',45,'Sabzi & Dal',1,0],['Paratha',15,'Roti & Chawal',0,0],['Jeera rice',35,'Roti & Chawal',1,0],['Raita',20,'Meetha & Drinks',0,0],['Gulab jamun (2)',30,'Meetha & Drinks',0,0],['Kheer',35,'Meetha & Drinks',1,0],['Chhaas / Lassi',25,'Meetha & Drinks',0,0],['Egg curry',40,'Non-veg special',1,1],['Fish piece',60,'Non-veg special',0,1]];
const mig=()=>{if(S.mig2)return;S.prod.forEach(p=>{if(p.c==='Extra khana'&&FM[p.n])p.c=FM[p.n];if(p.n==='Egg'||p.n==='Chicken piece')p.nv=1});NEWF.forEach((a,i)=>{if(!S.prod.some(p=>p.n===a[0]))S.prod.push({id:9000+i,n:a[0],p:a[1],c:a[2],s:1,h:a[3],nv:a[4]})});S.mig2=1};
const fix=()=>{S.prod=S.prod||[];S.subs=S.subs||[];S.orders=S.orders||[];S.done=S.done||{};S.pays=S.pays||[];S.subs.forEach(s=>s.skip=s.skip||[]);mig()};fix();
let db=null,tab='plan',C={};
const F={type:'veg',days:'30',half:'0',pay:'cash',name:'',phone:'',area:'',addr:'',map:'',start:iso(add(D0(),1))};
try{const app=initializeApp(firebaseConfig);db=getDatabase(app);onValue(ref(db,'udala2'),sn=>{const v=sn.val();if(v){S=v;fix();const t=document.activeElement&&document.activeElement.tagName;if(t!=='INPUT')render()}})}catch(e){console.log('Cloud off',e)}
const save=()=>{try{localStorage.setItem('udala2',JSON.stringify(S))}catch(e){}try{db&&set(ref(db,'udala2'),S)}catch(e){console.log(e)}render()};
const pr=()=>{const b=PL[F.type][F.days];return +F.half?Math.round(b*.6):b};
const upi=a=>'upi://pay?pa='+UPI+'&pn=Namaste%20Udala&cu=INR&am='+Math.round(a);
const wa=(ph,t)=>window.open('https://wa.me/91'+ph+'?text='+encodeURIComponent(t),'_blank');
const mf=(d,t)=>{const w=d.getDay();if(t==='nv'){if(w===3)return'Fish curry, roti, chawal';if(w===5)return'2 egg curry, roti, chawal';if(w===0)return'Chicken, roti, chawal'}else{if(w===3)return'Paneer sabzi, roti, chawal';if(w===5)return'Dahi vada, sabzi, roti';if(w===0)return'Special paneer + meetha'}return'Dal, sabzi, roti, chawal'};
const act=(s,dt)=>{const k=iso(dt);return k>=s.start&&k<=iso(add(new Date(s.start+'T12:00:00'),s.days-1))};
const seg=(k,o)=>'<div class="seg">'+o.map(([v,l])=>`<button class="${String(F[k])===String(v)?'on':''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')+'</div>';
const contact=()=>`<input data-f="name" placeholder="Naam" value="${esc(F.name)}"><input data-f="phone" type="tel" placeholder="Phone number" value="${esc(F.phone)}"><input data-f="area" placeholder="Area / Sector" value="${esc(F.area)}"><input data-f="addr" placeholder="Pura address" value="${esc(F.addr)}"><input data-f="map" placeholder="Google Maps location link" value="${esc(F.map)}"><button class="btn g" data-a="gps">📍 Meri asli location lo (GPS)</button>`;
const banner=()=>{const t=add(D0(),1);return`<div class="card ban"><b>🔔 Kal ka menu (${t.getDate()}/${t.getMonth()+1})</b><br>Veg: ${mf(t,'veg')}<br>Non-veg: ${mf(t,'nv')}</div>`};
const rt=l=>{const pt=l.map(s=>{const m=(s.map||'').match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);return m?m[1]+','+m[2]:(s.addr+' '+s.area)}).slice(0,10);const d=pt.pop();return'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(d)+(pt.length?'&waypoints='+encodeURIComponent(pt.join('|')):'')};
const OPIN="4821",DPIN="7788";let OK=0;try{OK=sessionStorage.getItem('udok')?1:0}catch(e){}
const vi=t=>'<span class="vi '+(t==='nv'?'nv':'')+'"></span>';
let SCAT='all';
const EM=[[/doodh|milk/,'🥛'],[/dahi/,'🥣'],[/paneer/,'🧀'],[/butter/,'🧈'],[/chai|coffee/,'☕'],[/bread/,'🍞'],[/ande|egg/,'🥚'],[/detergent/,'🧺'],[/bartan/,'🍽️'],[/floor/,''],[/sabun/,'🧼'],[/shampoo|lotion/,'🧴'],[/toothpaste/,'🪥'],[/pad/,'🌸'],[/atta/,''],[/chawal|rice/,'🍚'],[/dal/,'🫘'],[/tel/,'🛢️'],[/roti/,''],[/chicken/,'🍗']];
const CE={'Doodh aur dairy':'','Chai aur nashta':'☕','Ghar ki safai':'🧽','Body care':'🧴','Women care':'🌸','Kirana':'🌾','Extra khana':''};
const ce=c=>CE[c]||'🛍️';
const pe=p=>{const n=p.n.toLowerCase();for(const x of EM)if(x[0].test(n))return x[1];return ce(p.c)};
let SQ='',VO=0,ACAT='all';
const FOOD=['Roti & Chawal','Sabzi & Dal','Non-veg special','Meetha & Drinks','Extra khana'];
const isF=p=>FOOD.includes(p.c);
Object.assign(CE,{'Roti & Chawal':'🫓','Sabzi & Dal':'🥘','Non-veg special':'','Meetha & Drinks':'🍮'});
EM.unshift([/fish/,'🐟'],[/paratha/,'🫓'],[/gulab|kheer/,'🍮'],[/lassi|chhaas/,'🥤'],[/raita/,'🥣'],[/mix veg/,'🥗']);
const item=p=>{const q=C[p.id]||0,qh=C[p.id+'h']||0;const ctl=(k,n)=>n?`<div class="stp2"><button data-a="dec" data-id="${k}">−</button><b>${n}</b><button data-a="inc" data-id="${k}">+</button></div>`:`<button class="btn sm" data-a="inc" data-id="${k}">ADD +</button>`;return`<div class="it"><div class="ie">${pe(p)}</div><div class="in"><b>${isF(p)?vi(p.nv?'nv':'veg')+' ':''}${esc(p.n)}</b><div class="s">${inr(p.p)}${p.h?' · Full':''}</div></div>${ctl(p.id,q)}</div>`+(p.h?`<div class="it half"><div class="in s">½ Half · <b>${inr(Math.round(p.p*.6))}</b></div>${ctl(p.id+'h',qh)}</div>`:'')};
const shopList=()=>{const q=SQ.trim().toLowerCase();let l=S.prod.filter(p=>p.s);if(VO)l=l.filter(p=>!p.nv);if(SCAT==='food')l=l.filter(isF);else if(SCAT!=='all')l=l.filter(p=>p.c===SCAT);if(q)l=l.filter(p=>p.n.toLowerCase().includes(q)||p.c.toLowerCase().includes(q));const g={};l.forEach(p=>(g[p.c]=g[p.c]||[]).push(p));return Object.keys(g).map(c=>`<div class="card"><h3>${ce(c)} ${esc(c)}</h3>${g[c].map(item).join('')}</div>`).join('')||'<div class="card">Kuch nahi mila 🔍</div>'};
const addonCard=()=>{const fi=S.prod.filter(p=>p.s&&isF(p)&&(F.type==='nv'||!p.nv)),fc=[...new Set(fi.map(p=>p.c))];if(ACAT!=='all'&&!fc.includes(ACAT))ACAT='all';const l=fi.filter(p=>ACAT==='all'||p.c===ACAT);return`<div class="card"><h3>➕ Khana add-on</h3><div class="s">Plan ke saath extra khana mangwao. Full ya Half chuno.</div><div class="chips2"><button class="${ACAT==='all'?'on':''}" data-a="acat" data-v="all">🍽️ Sab</button>${fc.map(c=>`<button class="${ACAT===c?'on':''}" data-a="acat" data-v="${esc(c)}">${ce(c)} ${esc(c)}</button>`).join('')}</div>${l.map(item).join('')||'<div class="s">Abhi koi add-on nahi</div>'}<button class="btn g" data-a="tab" data-v="shop">🛒 Doodh, kirana aur saaman → Shop</button></div>`};
const due=s=>s.price+S.orders.filter(o=>o.sid===s.id&&!o.paid).reduce((a,o)=>a+o.total,0);
const PY=()=>S.pays||[];
let MY=[];try{MY=JSON.parse(localStorage.getItem('udmine'))||[]}catch(e){}

const dup=(u,x)=>PY().some(p=>p.utr===u)||S.subs.some(y=>!y.paid&&y!==x&&y.utr===u)||S.orders.some(y=>!y.paid&&y!==x&&y.sid!==x.id&&y.utr===u);
