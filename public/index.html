const products='<div class="card"><h3>🛍 Products</h3><div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn sm g" data-a="imptoggle">📥 Excel import</button><button class="btn sm b" data-a="expp">📤 Export CSV</button></div>'+impBox+editBox+'<input id="pn" maxlength="40" placeholder="Naam"><input id="pp" type="number" min="1" max="100000" placeholder="Price"><input id="pc" maxlength="30" placeholder="Category"><button class="btn" data-a="addp">Product jodo</button>'+S.prod.map(p=>'<div class="row"><div style="display:flex;align-items:center;gap:8px"><div class="iew">'+dish(pe(p),p.img,false,false)+'</div><div>'+esc(p.n)+(p.brand?'<div class="s" style="color:#1f5f3a;font-weight:800">'+esc(p.brand)+'</div>':'')+'<div class="s">'+(p.mrp?'<span class="mrp">MRP ₹'+p.mrp+'</span>':'')+'<span class="price">'+inr(p.p)+'</span></div></div></div><div><button class="btn sm" data-a="editp" data-id="'+p.id+'">✏️</button><button class="btn sm '+(p.s?'g':'r')+'" data-a="stock" data-id="'+p.id+'">'+(p.s?'Stock':'Khatam')+'</button><button class="btn sm r" data-a="delp" data-id="'+p.id+'">✕</button></div></div>').join('')+(plog?'<div class="s" style="font-weight:800;margin-top:10px">📜 Price history:</div>'+plog:'')+'</div>';
return '<div style="height:14px"></div>'+dash+ledger+products+'<button class="btn" data-a="out">Owner se bahar</button><button class="btn r" data-a="reset">Reset</button>';
}catch(e){return '<div class="card"><h3>⚠️ Owner load error</h3><div class="s">'+esc(e.message)+'</div><button class="btn g" data-a="oview" data-v="deliv">Dashboard kholo</button></div>'}}
};
const T=[['plan','Plan',IM.thali],['shop','Shop',IM.grocery],['kitchen','Kitchen',IM.kitchen],['delivery','Delivery',IM.scooter],['owner','Owner',IM.money]];
function render(){if(!OK&&tab!=='plan'&&tab!=='shop')tab='plan';let html='';try{html=V[tab]()}catch(e){html='<div class="card"><h3>⚠️ Error</h3><div class="s">'+esc(e.message)+'</div></div>'}$('#v').innerHTML=html;$('#ht').textContent=({plan:'Aaj ka Plan',shop:'Shop',kitchen:'Aaj Ka Khana',delivery:'Aaj Ka Route',owner:'Owner Dashboard'})[tab];$('#nav').innerHTML=T.filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>'<div class="'+(x[0]===tab?'on':'')+'" data-a="tab" data-v="'+x[0]+'"><img class="nimg" src="'+x[2]+'" onerror="this.style.opacity=0">'+x[1]+'</div>').join('')}
const need=()=>{if(!F.name||!F.phone){alert('Naam aur phone daalo');return 1}if(!/q=-?\d/.test(F.map||'')){alert('Location zaroori hai. GPS wala button dabao');return 1}};
function addon(sub){const items=[];let total=0;Object.entries(C).forEach(([k,q])=>{if(!Number.isInteger(q)||q<=0)return;const p=S.prod.find(x=>x.id===parseInt(k,10));if(!p||!p.s)return;const h=k.endsWith('h');if(h&&!p.h)return;const price=h?Math.round(p.p*0.6):p.p;const qq=clamp(q,1,99);items.push({n:p.n+(h?' (Half)':''),q:qq,p:price});total+=price*qq});if(!items.length)return 0;S.orders.push({id:Date.now(),ts:Date.now(),sid:sub.id,name:sub.name,phone:sub.phone,area:sub.area,addr:sub.addr,map:sub.map,items:items,total:total,pay:sub.pay,paid:0,dlv:0,t:new Date().toLocaleString()});C={};return total}
const mk=tr=>{if(need())return;const td=iso(D0());
const s={id:Date.now(),ts:Date.now(),name:String(F.name).slice(0,40),phone:cleanPh(F.phone),area:String(F.area||'Other').slice(0,40),addr:String(F.addr).slice(0,120),map:String(F.map).slice(0,200),type:F.type==='nv'?'nv':'veg',days:tr?1:clamp(+F.days||30,1,365),half:+F.half?1:0,start:F.start||iso(add(D0(),1)),price:0,pay:F.pay==='online'?'online':'cash',paid:tr?1:0,skip:[],trial:tr?1:0,lunch:F.lunch,dinner:F.dinner,extraRoti:clamp(F.extraRoti||0,0,4),ref:''};
let disc=0;
if(!tr&&elig(s.days)){const cred=credOf(s.phone);disc=Math.min(cred,pr());if(disc>0){S.cred[s.phone]=cred-disc}}
s.price=tr?0:(pr()-disc);
const ad=addon(s);S.subs.push(s);
const rc=(F.ref||'').trim().toUpperCase();
if(!tr&&refActive()&&elig(s.days)&&rc){const refSub=S.subs.find(x=>codeOf(x.phone)===rc&&x.phone!==s.phone);if(refSub){S.refs=S.refs||{};const log=S.refs[refSub.phone]=S.refs[refSub.phone]||[];if(!log.some(e=>e.p===s.phone)){log.push({p:s.phone,n:s.name,d:td,amt:100});S.cred[refSub.phone]=(S.cred[refSub.phone]||0)+100;s.ref=rc}}}
if(!tr)MY.push('s'+s.id);saveMY();save();
alert(tr?'1 din free trial shuru!':'Plan ban gaya: '+inr(s.price)+(disc>0?' (₹'+disc+' refer credit kata)':''));
if(!tr&&F.pay==='online')location.href=upi(s.price+ad)};
const A={
oview:v=>{OVIEW=v;DET=null;render()},
det:(v,k,id)=>{DET={t:v,id:id};render();window.scrollTo(0,0)},
detback:()=>{DET=null;render()},
kmeal:v=>{KMEAL=v;render()},
cust:()=>{CUST=CUST?0:1;render()},
focuslogin:()=>{const e=$('#logcard');if(e)e.scrollIntoView({behavior:'smooth'});const i=$('#lname');if(i)setTimeout(()=>i.focus(),400)},
imptoggle:()=>{if(!needOK())return;IMPON=IMPON?0:1;render()},
importp:()=>{if(!needOK())return;const el=$('#impbox');if(!el||!el.value.trim()){alert('Pehle Excel/CSV data paste karo');return}const list=parseImport(el.value);if(!list.length){alert('Koi valid row nahi mili.\nFormat: Name, Price, MRP, Category');return}let added=0,upd=0;list.forEach(r=>{const ex=S.prod.find(p=>p.n.toLowerCase()===r.n.toLowerCase());if(ex){ex.p=r.p;ex.mrp=r.mrp;ex.c=r.c;upd++}else{S.prod.push({id:Date.now()+added,n:r.n,p:r.p,c:r.c,s:1,h:0,img:CIM[r.c]||IM.grocery,mrp:r.mrp,brand:null});added++}});logAdd('Excel import: +'+added+', upd '+upd);PED=null;IMPON=0;save();alert('Import ho gaya: '+added+' naye, '+upd+' update ✅')},
expp:()=>{if(!needOK())return;const rows=[['Name','Price','MRP','Category']].concat(S.prod.map(p=>[p.n,p.p,p.mrp||'',p.c]));const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='namaste-udala-products.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
editp:(v,k,id)=>{if(!needOK())return;PED=id||null;render()},
savep:()=>{if(!needOK())return;const ep=S.prod.find(p=>p.id==PED);if(!ep){PED=null;render();return}
const n=($('#epn')||{}).value||'';const p=+($('#epp')||{}).value;const m=+($('#epm')||{}).value||0;const c=($('#epc')||{}).value||'Other';
const nn=n.trim().slice(0,40);if(!nn){alert('Naam daalo');return}if(!(p>0)||p>100000){alert('Sahi price daalo (1-100000)');return}if(m&&(m<0||m>100000)){alert('Sahi MRP daalo');return}
const old=ep.p;ep.n=nn;ep.p=Math.round(p);ep.mrp=m?Math.round(m):null;ep.c=c.trim().slice(0,30);
S.plog=S.plog||[];S.plog.push({d:iso(D0()),n:nn,old:old,new:ep.p});if(S.plog.length>60)S.plog=S.plog.slice(-60);
logAdd('Price edit: '+nn+' ₹'+old+'→₹'+ep.p);PED=null;save();alert('Product update ✅')},
shareRef:()=>{if(!ME)return;const c=codeOf(ME.phone);const t='🪔 Namaste Udala Diwali Offer! Mera refer code '+c+' hai. 15/30 din ka plan banao — mujhe ₹100 credit. Ghar jaisa khana! Offer '+refEnd()+' tak. 🍱';window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')},
setrefend:()=>{if(!needOK())return;const el=$('#refend');if(el&&el.value){S.refEnd=el.value;logAdd('Refer end: '+el.value);save();alert('Offer end date set: '+el.value)}},
setk:()=>{if(!needOK())return;if(!navigator.geolocation){alert('GPS nahi hai');return}navigator.geolocation.getCurrentPosition(p=>{S.kll=p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);logAdd('Kitchen point set');save();alert('Kitchen start point set ✅')},e=>alert('Location nahi mili. GPS ON karo.'),{enableHighAccuracy:true,timeout:15000})},
setmenu:()=>{if(!needOK())return;const a=$('#mveg'),b=$('#mnv');const k=iso(add(D0(),1));S.mset=S.mset||{};S.mset[k]={veg:a?String(a.value).slice(0,60).trim():'',nv:b?String(b.value).slice(0,60).trim():''};logAdd('Menu set '+k);save();alert('Kal ka menu set ✅')},
login:()=>{const ne=$('#lname'),pe2=$('#lphone');const n=ne?ne.value.trim().slice(0,40):'';const p=pe2?cleanPh(pe2.value):'';if(!n||p.length<10){alert('Naam aur 10 digit phone daalo');return}ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();alert('Login ho gaya! 🙏')},
logout:()=>{ME=null;DET=null;saveME();render();alert('Logout ho gaya')},
cat:v=>{SCAT=v;render()},
goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
vo:()=>{VO=VO?0:1;render()},
utr:(v,k,id)=>{const el=$('#u'+id);const c=el?el.value.replace(/\s/g,'').slice(0,14):'';if(!/^\d{12}$/.test(c)){alert('12 digit UTR daalo');return}const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(!s)return;s.utr=c;S.orders.forEach(o=>{if(o.sid===s.id)o.utr=c})}else{const o=S.orders.find(x=>x.id==n);if(!o)return;o.utr=c}save();alert('UTR mil gaya ✓')},
badu:(v,k,id)=>{if(!needOK())return;const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(s){s.utr='';S.orders.forEach(o=>{if(o.sid===s.id)o.utr=''})}}else{const o=S.orders.find(x=>x.id==n);if(o)o.utr=''}save()},
paidS:(v,k,id)=>{if(!needOK())return;const s=S.subs.find(x=>x.id==id);if(!s)return;const lo=S.orders.filter(o=>o.sid===s.id&&!o.paid);const amt=s.price+lo.reduce((a,o)=>a+o.total,0);if(!confirm(s.name+': '+inr(amt)+' mil gaye?'))return;s.paid=1;lo.forEach(o=>{o.paid=1});S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:s.name,amt:amt,mode:s.pay,utr:s.utr||'',kind:'Plan'});logAdd('Paid: '+s.name);save()},
paidO:(v,k,id)=>{if(!needOK())return;const o=S.orders.find(x=>x.id==id);if(!o)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:o.name,amt:o.total,mode:o.pay,utr:o.utr||'',kind:'Shop'});logAdd('Paid: '+o.name);save()},
remS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s)wa(s.phone,'Namaste '+s.name+'! 🙏\nAapka '+inr(due(s))+' pending hai.\nUPI: '+UPI)},
remO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o)wa(o.phone,'Namaste '+o.name+'! 🙏\nAapke order ka '+inr(o.total)+' pending hai.\nUPI: '+UPI)},
tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const dv=v==='delivery';const x=prompt(dv?'Delivery PIN daalo':'Owner PIN daalo');if(x===null)return;const ok=dv?(x===DPIN||x===OPIN):(x===OPIN);if(!ok){pinWrong();alert('Galat PIN');return}pinClear();OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}}if(v==='owner'){OVIEW='deliv';DET=null}tab=v;render()},
gps:()=>{if(!navigator.geolocation){alert('GPS nahi hai');return}navigator.geolocation.getCurrentPosition(p=>{F.map='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);render();alert('Location mil gayi ✓')},e=>alert('Location nahi mili. Phone ka Location ON karo.'),{enableHighAccuracy:true,timeout:15000})},
set:(v,k)=>{F[k]=v;render()},
join:()=>mk(0),trial:()=>mk(1),
inc:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)+1,0,4);render()}else{C[id]=clamp((C[id]||0)+1,0,99);render()}},
dec:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)-1,0,4);render()}else{C[id]=clamp((C[id]||0)-1,0,99);render()}},
order:()=>{if(need())return;const it=[];let total=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k,10));if(!p||q<1)return;const h=k.endsWith('h');const pp=h?Math.round(p.p*.6):p.p;const qq=clamp(q,1,99);it.push({n:p.n+(h?' (Half)':''),q:qq,p:pp});total+=pp*qq});if(!it.length){alert('Cart khali hai');return}S.orders.push({id:Date.now(),ts:Date.now(),name:String(F.name).slice(0,40),phone:cleanPh(F.phone),area:String(F.area||'Other').slice(0,40),addr:String(F.addr).slice(0,120),map:String(F.map).slice(0,200),items:it,total:total,pay:F.pay==='online'?'online':'cash',paid:0,dlv:0,t:new Date().toLocaleString()});MY.push('o'+S.orders[S.orders.length-1].id);saveMY();C={};save();alert('Order ho gaya: '+inr(total));if(F.pay==='online')location.href=upi(total)},
skip:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const d=iso(add(D0(),1));const i=s.skip.indexOf(d);if(i>=0)s.skip.splice(i,1);else s.skip.push(d);save()},
done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save()},
odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.dlv=1;save()}},
addp:()=>{if(!needOK())return;const n=($('#pn')||{}).value||'';const p=+($('#pp')||{}).value;const c=($('#pc')||{}).value||'Other';const nn=n.trim().slice(0,40);if(!nn||!(p>0)||p>100000){alert('Sahi naam aur price daalo');return}S.prod.push({id:Date.now(),n:nn,p:Math.round(p),c:String(c).trim().slice(0,30),s:1,h:0,img:CIM[c]||IM.grocery,mrp:Math.round(p*1.2),brand:null});logAdd('Product add: '+nn);save()},
stock:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s?0:1;save()}},
delp:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);logAdd('Product delete: '+p.n);save()}},
out:()=>{OK=0;DET=null;PED=null;IMPON=0;try{sessionStorage.removeItem('udok')}catch(e){}tab='plan';render()},
reset:()=>{if(!needOK())return;if(confirm('Sab data delete? Pakka?')){S={prod:SEED,subs:[],orders:[],done:{},pays:[],mset:{},kll:'',cred:{},refs:{},plog:[],log:[]};logAdd('FULL RESET');save()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){alert('Error: '+x.message)}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPh(F.phone);if(f==='extraRoti')F.extraRoti=clamp(+F.extraRoti||0,0,4)}if(e.target.id==='sq'){SQ=e.target.value;const el=$('#pl');if(el)el.innerHTML=shopList()}if(e.target.id==='dsel'){DSEL=e.target.value||iso(D0());render()}});
function ologin(){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const x=prompt('Owner PIN daalo');if(x===null)return;if(x===OPIN){pinClear();OK=1;DET=null;try{sessionStorage.setItem('udok','1')}catch(e){}tab='owner';render()}else{pinWrong();alert('Galat PIN')}}
let hc=0;document.querySelector('header').addEventListener('click',()=>{hc++;if(hc>=5){hc=0;ologin()}});
render();
if(location.hash==='#owner')ologin();
if(location.hash==='#delivery'){tab='delivery';A.tab('delivery')}
</script></body></html>
