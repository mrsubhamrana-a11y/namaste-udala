<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Namaste Udala - Super App</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e5c3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NamasteUdala">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--o:#ff5a1f;--o2:#ff8a3d;--g:#0e5c3f;--g2:#127a52;--bg:#f6f3ec;--ink:#1c1917;--muted:#7d7468;--card:#fffdf9;--line:#ece2d0;--gold:#f5b301;--r:22px;--shadow:0 4px 12px rgba(0,0,0,.08)}
*{box-sizing:border-box;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:#ffd9c2}
html{scroll-behavior:smooth}
img{object-fit:cover;background:#f3ede3}
body{background:var(--bg);color:var(--ink);padding-bottom:104px;font-weight:500;-webkit-font-smoothing:antialiased}
/* --- HEADER --- */
header{background:linear-gradient(135deg,#0b3d2c,#0e5c3f 55%,#127a52);color:#fff;padding:16px;border-radius:0 0 24px 24px;box-shadow:0 8px 24px rgba(11,61,44,.3);position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 210deg,#f5b301,#ff5a1f,#f5b301);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 4px 10px rgba(255,90,31,.4)}
header h1{font-size:18px;font-weight:800;line-height:1.2}
header .s{font-size:10px;opacity:.8}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;border:0;color:#fff;cursor:pointer;transition:.2s}
.icon-btn:active{transform:scale(.9)}
.badge{position:absolute;top:-2px;right:-2px;background:#dc2626;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;border:2px solid #0e5c3f}
/* --- NAV --- */
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,249,.95);backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,.05);border-radius:20px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:100}
.nav div{flex:1;text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:8px 2px;border-radius:14px;transition:.2s;cursor:pointer}
.nav div.on{color:var(--o);background:#fff1e6;font-weight:800}
.nimg{width:24px;height:24px;border-radius:50%;margin-bottom:4px;border:2px solid transparent}
.nav div.on .nimg{border-color:var(--o)}
/* --- CARDS & LAYOUT --- */
.container{padding:16px}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.03)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:#f3f4f6;font-size:12px;font-weight:700;color:#555;border:1px solid #eee;white-space:nowrap}
.chip.on{background:var(--o);color:#fff;border-color:var(--o)}
/* --- PRODUCT CARD (FLIPKART STYLE) --- */
.prod-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative;transition:.2s;display:flex;flex-direction:column}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.1)}
.prod-img{height:140px;width:100%;background:#f9fafb;position:relative}
.prod-img img{width:100%;height:100%;object-fit:cover}
.wish-btn{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:16px;color:#ccc;box-shadow:0 2px 6px rgba(0,0,0,.1);cursor:pointer;z-index:2}
.wish-btn.active{color:#dc2626}
.discount-tag{position:absolute;top:8px;left:8px;background:#16a34a;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}
.prod-body{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.prod-name{font-size:13px;font-weight:700;color:#1c1917;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.prod-price-row{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.price-main{font-size:16px;font-weight:800;color:var(--ink)}
.price-old{font-size:11px;color:#9ca3af;text-decoration:line-through}
.add-cart-btn{width:100%;padding:10px;border:0;border-radius:10px;background:var(--o);color:#fff;font-weight:800;font-size:12px;margin-top:8px;cursor:pointer;transition:.2s;display:flex;justify-content:center;align-items:center;gap:6px}
.add-cart-btn:active{transform:scale(.95)}
.add-cart-btn.in-cart{background:#16a34a}
/* --- BUTTONS --- */
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--o);color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(255,90,31,.3);cursor:pointer;transition:.2s;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.g{background:#16a34a;box-shadow:0 4px 12px rgba(22,163,74,.3)}
.btn.b{background:#2563eb;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn.r{background:#dc2626;box-shadow:0 4px 12px rgba(220,38,38,.3)}
.btn.outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);box-shadow:none}
.btn.sm{width:auto;padding:8px 16px;font-size:12px;border-radius:10px}
/* --- INPUTS --- */
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;font-weight:600;background:#fff;color:var(--ink);outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px rgba(255,90,31,.1)}
.form-group{margin-bottom:12px}
.label{font-size:12px;font-weight:700;color:#555;margin-bottom:4px;display:block}
/* --- MODAL --- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-content{background:#fff;width:100%;max-width:500px;border-radius:24px 24px 0 0;padding:24px;transform:translateY(100%);transition:.3s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal-content{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
/* --- CART BAR --- */
.cart-bar{position:fixed;bottom:90px;left:16px;right:16px;background:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:90;transform:translateY(150%);transition:.3s}
.cart-bar.show{transform:translateY(0)}
.cart-info{display:flex;flex-direction:column}
.cart-count{font-size:12px;color:var(--muted);font-weight:600}
.cart-total{font-size:18px;font-weight:800;color:var(--ink)}
.checkout-btn{background:var(--o);color:#fff;padding:10px 20px;border-radius:10px;font-weight:800;font-size:13px;border:0;cursor:pointer}
/* --- PROFILE --- */
.profile-header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:24px;border-radius:0 0 24px 24px;text-align:center;margin-bottom:16px}
.avatar{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--g);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 12px;border:3px solid rgba(255,255,255,.3)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat-item{background:rgba(255,255,255,.1);padding:8px;border-radius:12px;text-align:center}
.stat-val{font-size:16px;font-weight:800;display:block}
.stat-lbl{font-size:10px;opacity:.8}
.order-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6}
.order-date{font-size:11px;color:var(--muted)}
.order-amt{font-weight:800;color:var(--ink)}
.status-pill{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:700}
.status-delivered{background:#dcfce7;color:#166534}
.status-pending{background:#fef3c7;color:#92400e}
/* --- DARK MODE --- */
[data-theme=dark]{--bg:#0f172a;--ink:#f1f5f9;--muted:#94a3b8;--card:#1e293b;--line:#334155}
[data-theme=dark] body{background:var(--bg);color:var(--ink)}
[data-theme=dark] header{background:linear-gradient(135deg,#0f172a,#1e293b)}
[data-theme=dark] .nav{background:rgba(30,41,59,.95);border-color:#334155}
[data-theme=dark] .card,[data-theme=dark] .prod-card,[data-theme=dark] .modal-content{background:var(--card);border-color:#334155}
[data-theme=dark] input,[data-theme=dark] select{background:#0f172a;border-color:#334155;color:#f1f5f9}
[data-theme=dark] .chip{background:#334155;color:#cbd5e1;border-color:#475569}
[data-theme=dark] .chip.on{background:var(--o);color:#fff;border-color:var(--o)}
[data-theme=dark] .prod-name{color:#f1f5f9}
[data-theme=dark] .price-main{color:#fff}
[data-theme=dark] .cart-bar{background:var(--card);border-color:#334155}
@media(max-width:400px){.grid-2{gap:8px}.prod-img{height:120px}}
</style></head>
<body>
<header>
<div class="logo-wrap">
<div class="logo">NU</div>
<div><h1 id="ht">Namaste Udala</h1><div class="s">Super App for Udala</div></div>
</div>
<div style="display:flex;gap:10px;position:relative">
<button class="icon-btn" data-a="search">🔍</button>
<button class="icon-btn" data-a="profile">👤</button>
<button class="icon-btn" data-a="theme">🌙</button>
</div>
</header>

<div id="v" class="container"></div>

<!-- Bottom Nav -->
<div class="nav" id="nav">
<div class="on" data-a="tab" data-v="home"><img class="nimg" src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100&q=80">Home</div>
<div data-a="tab" data-v="shop"><img class="nimg" src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=100&q=80">Shop</div>
<div data-a="tab" data-v="services"><img class="nimg" src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=100&q=80">Services</div>
<div data-a="tab" data-v="owner"><img class="nimg" src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=100&q=80">Owner</div>
</div>

<!-- Floating Cart Bar -->
<div class="cart-bar" id="cartBar">
<div class="cart-info">
<span class="cart-count" id="cbCount">0 Items</span>
<span class="cart-total" id="cbTotal">₹0</span>
</div>
<button class="checkout-btn" data-a="goCheckout">Checkout ➜</button>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal-content" id="modalBody">
<div class="modal-handle"></div>
<div id="modalInner"></div>
</div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

// === CONFIG ===
const firebaseConfig={apiKey:"AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",authDomain:"namaste-udala.firebaseapp.com",projectId:"namaste-udala",storageBucket:"namaste-udala.firebasestorage.app",messagingSenderId:"998684348165",appId:"1:998684348165:web:4bb0d2f5335a90a394716c",databaseURL:"https://namaste-udala-default-rtdb.firebaseio.com"};
const UPI='9583937047@jio';
const OPIN='4821'; // Owner PIN

// Initial Products (Flipkart Style Data Structure)
let PRODUCTS=[
{id:1,n:'Veg Special Thali',p:120,mrp:150,c:'Food',img:'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&q=80',disc:20,rating:4.5},
{id:2,n:'Chicken Curry Pack',p:180,mrp:220,c:'Food',img:'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400&q=80',disc:18,rating:4.7},
{id:3,n:'Paneer Butter Masala',p:140,mrp:160,c:'Food',img:'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400&q=80',disc:12,rating:4.6},
{id:4,n:'Fresh Milk 500ml',p:30,mrp:35,c:'Grocery',img:'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=80',disc:14,rating:4.8},
{id:5,n:'Atta 1kg Bag',p:50,mrp:60,c:'Grocery',img:'https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400&q=80',disc:16,rating:4.5},
{id:6,n:'Wedding Photography',p:15000,mrp:20000,c:'Services',img:'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=400&q=80',disc:25,rating:4.9},
{id:7,n:'Maths Tuition (Month)',p:800,mrp:1000,c:'Education',img:'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=400&q=80',disc:20,rating:4.7},
{id:8,n:'Birthday Decor Kit',p:3500,mrp:4500,c:'Events',img:'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400&q=80',disc:22,rating:4.6}
];

// State Management
let STATE={
user:null, // {name, phone, addr, pincode, wishlist:[], orders:[]}
cart:{},   // {productId: qty}
view:'home',
searchQuery:'',
category:'All',
ownerMode:false,
allOrders:[], // For owner view
db:null
};

// Load from LocalStorage
try{
const savedUser=localStorage.getItem('nu_user');
if(savedUser)STATE.user=JSON.parse(savedUser);
}catch(e){}

// Helpers
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const uid=()=>Date.now()+'_'+Math.random().toString(36).slice(2,6);
const cleanPh=s=>String(s||'').replace(/\D/g,'').slice(-10);

// Firebase Init
try{
const app=initializeApp(firebaseConfig);
STATE.db=getDatabase(app);
// Listen for global order updates (for Owner)
onValue(ref(STATE.db,'orders'),snap=>{
const val=snap.val();
STATE.allOrders=val?Object.values(val):[];
if(STATE.ownerMode)render();
});
}catch(e){console.log('Cloud off',e)}

function saveState(){
if(STATE.user)localStorage.setItem('nu_user',JSON.stringify(STATE.user));
// Push order to Firebase if exists
if(STATE.db && STATE.user && STATE.user.lastOrder){
set(ref(STATE.db,'orders/'+STATE.user.lastOrder.id),STATE.user.lastOrder);
delete STATE.user.lastOrder;
}
render();
}

// === CORE FUNCTIONS ===

function init(){
checkTheme();
render();
setupListeners();
}

function checkTheme(){
if(localStorage.getItem('nu_theme')==='dark'){
document.documentElement.setAttribute('data-theme','dark');
$('.icon-btn[data-a="theme"]').textContent='☀️';
}
}

function toggleTheme(){
const isDark=document.documentElement.getAttribute('data-theme')==='dark';
if(isDark){
document.documentElement.removeAttribute('data-theme');
localStorage.setItem('nu_theme','light');
$('.icon-btn[data-a="theme"]').textContent='🌙';
}else{
document.documentElement.setAttribute('data-theme','dark');
localStorage.setItem('nu_theme','dark');
$('.icon-btn[data-a="theme"]').textContent='☀️';
}
}

// === RENDER ENGINE ===

function render(){
const v=$('#v');
let html='';

switch(STATE.view){
case 'home': html=renderHome(); break;
case 'shop': html=renderShop(); break;
case 'services': html=renderServices(); break;
case 'profile': html=renderProfile(); break;
case 'owner': html=renderOwner(); break;
default: html=renderHome();
}

v.innerHTML=html;
updateNav();
updateCartBar();
}

function updateNav(){
const tabs=['home','shop','services'];
if(STATE.ownerMode)tabs.push('owner');
$('#nav').innerHTML=tabs.map(t=>{
const icons={home:'🏠',shop:'🛒',services:'🎪',owner:'📊'};
return `<div class="${STATE.view===t?'on':''}" data-a="tab" data-v="${t}">${icons[t]} ${t.charAt(0).toUpperCase()+t.slice(1)}</div>`;
}).join('');
}

function updateCartBar(){
const bar=$('#cartBar');
const count=Object.values(STATE.cart).reduce((a,b)=>a+b,0);
if(count>0 && STATE.view!=='checkout'){
bar.classList.add('show');
$('#cbCount').textContent=count+' Item(s)';
$('#cbTotal').textContent=inr(getCartTotal());
}else{
bar.classList.remove('show');
}
}

function getCartTotal(){
let total=0;
for(const [id,qty] of Object.entries(STATE.cart)){
const p=PRODUCTS.find(x=>x.id==id);
if(p)total+=p.p*qty;
}
return total;
}

// === VIEW: HOME ===
function renderHome(){
const greeting=STATE.user?`Hello, ${STATE.user.name.split(' ')[0]}!`:'Welcome to Udala';
return `
<div class="card" style="background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0">
<h2 style="font-size:20px;margin-bottom:8px">${greeting}</h2>
<p style="opacity:.9;font-size:13px">Ghar jaisa khana, roz time pe.</p>
<div style="margin-top:16px;display:flex;gap:10px">
<input placeholder="Search products..." style="flex:1;border-radius:10px;padding:10px" data-a="searchInput">
<button class="btn sm" style="background:#fff;color:var(--g)" data-a="doSearch">Go</button>
</div>
</div>

<div class="chip-row">
${['All','Food','Grocery','Services'].map(c=>`<div class="chip ${STATE.category===c?'on':''}" data-a="filterCat" data-v="${c}">${c}</div>`).join('')}
</div>

<h3 style="margin:16px 0 12px;font-size:16px;font-weight:800">Featured Deals 🔥</h3>
<div class="grid-2">
${PRODUCTS.filter(p=>p.disc>15).slice(0,4).map(p=>productCard(p)).join('')}
</div>

<h3 style="margin:24px 0 12px;font-size:16px;font-weight:800">Popular Categories</h3>
<div class="grid-3">
${[{n:'Tiffin',i:'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=100&q=80'},{n:'Kirana',i:'https://images.unsplash.com/photo-1542838132-92c53300491e?w=100&q=80'},{n:'Photo',i:'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=100&q=80'},{n:'Decor',i:'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=100&q=80'},{n:'Books',i:'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=100&q=80'},{n:'More',i:'➕'}].map(c=>`
<div class="card" style="text-align:center;padding:12px;cursor:pointer" data-a="quickNav" data-v="${c.n.toLowerCase()}">
<img src="${c.i}" style="width:100%;height:60px;border-radius:8px;margin-bottom:8px">
<div style="font-size:12px;font-weight:700">${c.n}</div>
</div>
`).join('')}
</div>
`;
}

// === VIEW: SHOP (GRID) ===
function renderShop(){
let filtered=PRODUCTS;
if(STATE.searchQuery){
filtered=filtered.filter(p=>p.n.toLowerCase().includes(STATE.searchQuery.toLowerCase()));
}
if(STATE.category!=='All'){
filtered=filtered.filter(p=>p.c===STATE.category || (STATE.category==='Food'&&p.c==='Food'));
}

return `
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
<h2 style="font-size:20px;font-weight:800">Shop</h2>
<div style="font-size:12px;color:var(--muted)">${filtered.length} items found</div>
</div>
<div class="grid-2">
${filtered.map(p=>productCard(p)).join('')||'<div class="card" style="grid-column:span 2;text-align:center">No items found</div>'}
</div>
`;
}

function productCard(p){
const isInCart=STATE.cart[p.id]>0;
return `
<div class="prod-card">
<div class="prod-img">
<img src="${p.img}" alt="${esc(p.n)}" loading="lazy">
${p.disc?`<span class="discount-tag">${p.disc}% OFF</span>`:''}
<div class="wish-btn ${isWished(p.id)?'active':''}" data-a="toggleWish" data-id="${p.id}">❤</div>
</div>
<div class="prod-body">
<div class="prod-name">${esc(p.n)}</div>
<div style="font-size:11px;color:#16a34a;font-weight:700;margin-top:4px">⭐ ${p.rating} Rating</div>
<div class="prod-price-row">
<span class="price-main">${inr(p.p)}</span>

${isInCart?`✓ In Cart (${STATE.cart[p.id]})`:'Add to Cart 🛒'}
</button>
</div>
</div>
`;
}

function isWished(id){
return STATE.user&&STATE.user.wishlist&&STATE.user.wishlist.includes(id);
}

// === ACTIONS & HANDLERS ===

const ACTIONS={
tab:v=>{STATE.view=v;render()},
theme:toggleTheme,
searchInput:e=>{STATE.searchQuery=e.target.value},
doSearch:()=>{STATE.view='shop';render()},
filterCat:v=>{STATE.category=v;render()},
quickNav:v=>{
if(v==='more')STATE.view='shop';
else{STATE.category=v.charAt(0).toUpperCase()+v.slice(1);STATE.view='shop'}
render();
},
addToCart:id=>{
const pid=parseInt(id);
STATE.cart[pid]=(STATE.cart[pid]||0)+1;
saveState();
alert('Added to cart!');
},
toggleWish:id=>{
if(!STATE.user){alert('Please login to use Wishlist');return}
const pid=parseInt(id);
STATE.user.wishlist=STATE.user.wishlist||[];
const idx=STATE.user.wishlist.indexOf(pid);
if(idx>-1)STATE.user.wishlist.splice(idx,1);
else STATE.user.wishlist.push(pid);
saveState();
},
goCheckout:()=>{
if(Object.keys(STATE.cart).length===0)return alert('Cart empty');
openCheckoutModal();
},
openLoginModal:()=>openModal(loginForm()),
editAddr:()=>openModal(addressForm()),
logout:()=>{STATE.user=null;localStorage.removeItem('nu_user');render()},
ownerLogin:()=>{
const pin=$('#opin').value;
if(pin===OPIN){STATE.ownerMode=true;render()}
else alert('Wrong PIN');
},
ownerLogout:()=>{STATE.ownerMode=false;STATE.view='home';render()},
updateStatus:(id,status)=>{
if(!STATE.ownerMode)return;
const order=STATE.allOrders.find(o=>o.id==id);
if(order){
order.status=status;
if(STATE.db)set(ref(STATE.db,'orders/'+id),order);
render();
}
}
};

// === MODALS ===

function openModal(content){
$('#modalInner').innerHTML=content;
$('#modalOverlay').classList.add('open');
}
function closeModal(){
$('#modalOverlay').classList.remove('open');
}

function loginForm(){
return `
<h3 style="margin-bottom:16px">Login / Register</h3>
<div class="form-group"><label>Name</label><input id="lname" placeholder="Your Name"></div>
<div class="form-group"><label>Phone</label><input id="lphone" type="tel" placeholder="10 Digit Number"></div>
<div class="form-group"><label>Address</label><textarea id="laddr" placeholder="House No, Street, Area"></textarea></div>
<button class="btn" onclick="submitLogin()">Save & Continue</button>
<button class="btn outline" onclick="closeModal()" style="margin-top:8px">Cancel</button>
`;
}

window.submitLogin=()=>{
const n=$('#lname').value.trim();
const p=$('#lphone').value.replace(/\D/g,'');
const a=$('#laddr').value.trim();
if(!n||p.length!==10){alert('Valid Name & 10-digit Phone required');return}
STATE.user={name:n,phone:p,addr:a,wishlist:[],orders:[]};
saveState();
closeModal();
alert('Welcome '+n+'!');
};

function addressForm(){
return `
<h3 style="margin-bottom:16px">Update Address</h3>
<div class="form-group"><label>New Address</label><textarea id="eaddr">${STATE.user?STATE.user.addr:''}</textarea></div>
<button class="btn" onclick="submitAddr()">Update</button>
<button class="btn outline" onclick="closeModal()" style="margin-top:8px">Close</button>
`;
}
window.submitAddr=()=>{
if(STATE.user){STATE.user.addr=$('#eaddr').value.trim();saveState();closeModal();alert('Address Updated')}
};

function openCheckoutModal(){
if(!STATE.user){alert('Please login first');openModal(loginForm());return}
const total=getCartTotal();
const itemsHtml=Object.entries(STATE.cart).map(([id,qty])=>{
const p=PRODUCTS.find(x=>x.id==id);
return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px">
<span>${p.n} x ${qty}</span><b>${inr(p.p*qty)}</b>
</div>`;
}).join('');

const content=`
<h3 style="margin-bottom:16px">Confirm Order</h3>
<div style="background:#f9fafb;padding:12px;border-radius:12px;margin-bottom:16px">
${itemsHtml}
<div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:800;font-size:16px">
<span>Total:</span><span>${inr(total)}</span>
</div>
</div>
<div class="form-group"><label>Delivery Address</label><div style="font-size:13px;color:#555">${STATE.user.addr}</div></div>
<div class="form-group"><label>Payment Method</label>
<select id="payMethod"><option value="upi">UPI (GPay/PhonePe)</option><option value="card">Credit/Debit Card</option></select>
</div>
<button class="btn g" onclick="placeOrder()">Pay & Place Order 💳</button>
<button class="btn outline" onclick="closeModal()" style="margin-top:8px">Back</button>
`;
openModal(content);
}

window.placeOrder=()=>{
const method=$('#payMethod').value;
const total=getCartTotal();
const orderId=uid();
const newOrder={
id:orderId,ts:Date.now(),total:total,status:'pending',method:method,userName:STATE.user.name,userPhone:STATE.user.phone,items:Object.entries(STATE.cart).map(([id,q])=>({id:+id,q}))
};
STATE.user.orders=STATE.user.orders||[];
STATE.user.orders.push(newOrder);
STATE.user.lastOrder=newOrder; // Temp hold for Firebase push
STATE.cart={}; // Empty cart
saveState();
closeModal();

// Redirect to UPI or simulate success
if(method==='upi'){
const note=`Order#${orderId}`;
window.location.href=`upi://pay?pa=${UPI}&pn=NamasteUdala&cu=INR&am=${total}&tn=${encodeURIComponent(note)}`;
}else{
alert('Order Placed Successfully! We will call you shortly.');
}
};

// === EVENT LISTENERS ===
function setupListeners(){
document.body.addEventListener('click',e=>{
const btn=e.target.closest('[data-a]');
if(btn){
e.preventDefault();
const action=ACTIONS[btn.dataset.a];
if(action)action(btn.dataset.v,btn.dataset.id,e);
}
});
document.getElementById('modalOverlay').addEventListener('click',e=>{
if(e.target.id==='modalOverlay')closeModal();
});
}

// Init
init();

</script>
</body></html>
