try { const l = JSON.parse(localStorage.getItem('nu5')); if (l && l.prod) S = { ...seed(), ...l }; } catch (e) {}

let db = null;
try {
  const app = initializeApp(FB); db = getDatabase(app);
  onValue(ref(db, NODE), sn => { const v = sn.val(); if (v && v.prod && (+v.rev || 0) > (+S.rev || 0)) { S = { ...seed(), ...v }; render(); } });
} catch (e) {}

function save() {
  S.rev = Date.now();
  try { localStorage.setItem('nu5', JSON.stringify(S)); } catch (e) {}
  if (db) set(ref(db, NODE), S).catch(() => {});
  render();
}

let tab = 'plan', OK = sessionStorage.getItem('nu5ok') ? 1 : 0, SCAT = 'all', SQ = '', TRK = null, SVB = null;
let C = {}; try { C = JSON.parse(localStorage.getItem('nu5c')) || {}; } catch (e) {}
let MY = []; try { MY = JSON.parse(localStorage.getItem('nu5my')) || []; } catch (e) {}
const F = { type: 'veg', days: 30, meal: 'both', name: localStorage.getItem('nu_n') || '', phone: localStorage.getItem('nu_p') || '', addr: localStorage.getItem('nu_a') || '' };

const saveUser = () => { localStorage.setItem('nu_n', F.name); localStorage.setItem('nu_p', F.phone); localStorage.setItem('nu_a', F.addr); };
const cc = () => Object.values(C).reduce((a, b) => a + (+b || 0), 0);
const ct = () => Object.entries(C).reduce((a, [k, q]) => { const p = S.prod.find(x => x.id === +k); return a + (p ? p.p * q : 0); }, 0);
const menu = (d, t) => { const o = (S.mset || {})[iso(d)]; if (o && o[t]) return o[t]; return t === 'nv' ? 'Chicken / Egg Curry + Rice + Roti' : 'Paneer / Dal Tadka + Rice + 4 Roti'; };

function render() {
  const V = { plan: vPlan, shop: vShop, services: vServices, owner: vOwner };
  $('#v').innerHTML = (V[tab] || vPlan)();
  $('#sheet').innerHTML = sheet();
  const TABS = [['plan', '🍱', 'Tiffin'], ['shop', '🛒', 'Shop'], ['services', '🎪', 'Services']];
  if (OK) TABS.push(['owner', '📊', 'Owner']);
  const n = cc();
  $('#nav').innerHTML = TABS.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-a="tab" data-v="${x[0]}"><span class="ni">${x[1]}</span><span class="nl">${x[2]}</span>${x[0] === 'shop' && n ? `<span class="nb">${n}</span>` : ''}</button>`).join('');
}

function need() {
  if (!F.name.trim() || ph(F.phone).length !== 10 || !F.addr.trim()) {
    toast('⚠️ Naam, 10-digit Phone aur Address bharein');
    return false;
  }
  saveUser();
  return true;
}

const A = {
  tab: v => { tab = v; TRK = SVB = null; render(); scrollTo({ top: 0, behavior: 'smooth' }); },
  fset: (v, k) => { F[k] = k === 'days' ? +v : v; render(); },
  cat: v => { SCAT = v; render(); },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  goco: () => { const e = $('#co'); if (e) e.scrollIntoView({ behavior: 'smooth' }); },
  close: () => { TRK = SVB = null; render(); },
  trk: (v, k, id) => { TRK = id; render(); },
  svb: (v, k, id) => { SVB = id; render(); },
  svok: () => {
    const s = SVC.find(x => x.id === SVB); if (!s) return;
    if (!F.name.trim() || ph(F.phone).length !== 10) { toast('⚠️ Naam aur Phone daalein'); return; }
    saveUser();
    S.sv.push({ id: uid('v'), svname: s.n, date: $('#sv_d').value, name: F.name.trim(), phone: ph(F.phone) });
    SVB = null; save(); toast('🎉 Booking request bhej di gayi!');
  },
  sub: () => {
    if (!need()) return;
    const pr = PL[F.type][F.days] + (F.meal === 'both' ? F.days * 15 : 0);
    const id = uid('s');
    S.subs.push({ id, name: F.name.trim(), phone: ph(F.phone), addr: F.addr.trim(), type: F.type, days: F.days, meal: F.meal, start: iso(addD(D0(), 1)), price: pr, paid: 0 });
    MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
    save(); toast('🎉 Tiffin Plan Book Ho Gaya!');
    location.href = upi(pr, 'Tiffin ' + F.name);
  },
  trial: () => {
    if (!need()) return;
    const id = uid('s');
    S.subs.push({ id, name: F.name.trim(), phone: ph(F.phone), addr: F.addr.trim(), type: F.type, days: 1, meal: F.meal, start: iso(D0()), price: 0, paid: 1 });
    MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
    save(); toast('🎁 1 Din Free Trial Book Ho Gaya!');
  },
  order: () => {
    if (!need()) return;
    const items = []; let tot = 0;
    Object.entries(C).forEach(([id, q]) => { const p = S.prod.find(x => x.id === +id); if (p && q > 0 && p.s) { items.push({ n: p.n, q, p: p.p }); tot += p.p * q; } });
    if (tot < S.cfg.min) { toast('Minimum order ' + inr(S.cfg.min)); return; }
    const id = uid('o');
    S.orders.push({ id, ts: Date.now(), date: iso(D0()), name: F.name.trim(), phone: ph(F.phone), addr: F.addr.trim(), items, total: tot, paid: 0, dlv: 0 });
    MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
    C = {}; localStorage.setItem('nu5c', '{}'); TRK = id; save(); toast('🎉 Order Place Ho Gaya!');
  },
  savem: () => {
    S.mset[iso(D0())] = { veg: $('#m_veg').value.trim(), nv: $('#m_nv').value.trim() };
    save(); toast('✅ Aaj ka menu update ho gaya');
  },
  opaid: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.paid = 1; save(); toast('✅ Paid'); } },
  odlv: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.dlv = 1; save(); toast('🛵 Delivered'); } },
  spaid: (v, k, id) => { const s = S.subs.find(x => x.id === id); if (s) { s.paid = 1; save(); toast('✅ Plan Paid'); } },
  stk: (v, k, id) => { const p = S.prod.find(x => x.id === +id); if (p) { p.s = p.s ? 0 : 1; save(); } },
  prt: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    $('#printArea').innerHTML = `<h2>NAMASTE UDALA</h2><p>Order #${String(o.id).slice(-5)} · ${o.date} ${tm(o.ts)}</p><p>${esc(o.name)} (${esc(o.phone)})<br>${esc(o.addr)}</p><hr>${o.items.map(i => `<div>${esc(i.n)} x ${i.q} = ${inr(i.p * i.q)}</div>`).join('')}<hr><h3>Total: ${inr(o.total)} (${o.paid ? 'PAID' : 'DUE'})</h3>`;
    window.print();
  },
  theme: () => {
    const d = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = d ? 'dark' : '';
    $('#thm').textContent = d ? '☀️' : '🌙';
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset.v, b.dataset.k, b.dataset.id); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.id === 'sq') { SQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#sq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

let taps = 0, tapT;
$('#mark').addEventListener('click', () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1800);
  if (taps >= 5) {
    taps = 0;
    const pin = prompt('Owner PIN daalein:');
