<style>
:root {
  --bg: #eef2f6; --sf: #ffffff; --sf2: #f4f7fb; --ink: #0f172a; --mu: #64748b; --ln: #dce4ee;
  --o: #ff5500; --g: #0b6e46; --gold: #f59e0b; --bad: #dc2626;
  --sh-card: 0 16px 32px -8px rgba(15,23,42,0.12), 0 4px 10px rgba(15,23,42,0.05), inset 0 2px 0 #fff;
  --sh-3d-o: 0 5px 0 #b33600, 0 12px 22px rgba(255,85,0,0.35), inset 0 2px 1px rgba(255,255,255,0.45);
  --sh-3d-g: 0 5px 0 #053b25, 0 12px 22px rgba(11,110,70,0.32), inset 0 2px 1px rgba(255,255,255,0.35);
  --sh-3d-w: 0 4px 0 #cbd5e1, 0 6px 12px rgba(15,23,42,0.06), inset 0 2px 0 #fff;
  --sh-in: inset 0 3px 6px rgba(15,23,42,0.08), 0 1px 0 #fff;
}
[data-theme=dark] {
  --bg: #080d12; --sf: #121b24; --sf2: #0d141c; --ink: #f1f5f9; --mu: #94a3b8; --ln: #1f2e3d;
  --sh-card: 0 20px 38px -10px rgba(0,0,0,0.7), inset 0 1.5px 0 rgba(255,255,255,0.08);
  --sh-3d-w: 0 4px 0 #06090d, 0 8px 16px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  --sh-in: inset 0 3px 7px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: radial-gradient(circle at 12% 4%, rgba(255,120,40,0.14), transparent 40%), var(--bg); color: var(--ink); padding-bottom: 148px; min-height: 100vh; }
img { display: block; object-fit: cover; }
button, input, select { font: inherit; color: inherit; }
svg.ic { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; flex: none; }

/* 3D Header */
header {
  position: sticky; top: 0; z-index: 60;
  background: linear-gradient(145deg, #0f6843, #062b1c);
  color: #fff; padding: 12px 16px; border-radius: 0 0 24px 24px;
  box-shadow: 0 6px 0 #031910, 0 14px 26px rgba(6,43,28,0.4);
  display: flex; align-items: center; gap: 12px;
}
.logo {
  width: 44px; height: 44px; border-radius: 14px;
  background: linear-gradient(145deg, #ff9436, #ff4500);
  display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff;
  box-shadow: 0 4px 0 #992600, inset 0 2px 2px rgba(255,255,255,0.6); cursor: pointer; user-select: none;
}
.logo:active { transform: translateY(3px); box-shadow: 0 1px 0 #992600; }
.brand { flex: 1; }
.brand small { display: block; color: #fde047; font-size: 9.5px; letter-spacing: 1.5px; font-weight: 800; }
.brand h1 { font-size: 18px; font-weight: 800; }

main { padding: 16px 14px 0; max-width: 650px; margin: 0 auto; }

/* 3D Hero with Real Floating Plate & Steam */
.hero3d {
  position: relative; border-radius: 24px; padding: 20px 18px; margin-bottom: 18px; color: #fff;
  background: linear-gradient(130deg, #1f110b 0%, #682107 55%, #c23b00 100%);
  box-shadow: 0 7px 0 #471402, 0 18px 34px rgba(184,55,0,0.32);
  min-height: 148px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; overflow: visible;
}
.hero3d.green {
  background: linear-gradient(130deg, #062619 0%, #0b5c3b 55%, #149962 100%);
  box-shadow: 0 7px 0 #042115, 0 18px 34px rgba(11,92,59,0.32);
}
.hero3d h2 { font-size: 20px; font-weight: 800; max-width: 63%; line-height: 1.2; margin-bottom: 5px; }
.hero3d p { font-size: 12px; opacity: .92; max-width: 63%; font-weight: 600; }
.hero-plate {
  position: absolute; right: 12px; bottom: -8px; width: 114px; height: 114px;
  border-radius: 50%; border: 4px solid #fff; background: #1e293b;
  box-shadow: 0 16px 26px rgba(0,0,0,0.55), 0 0 20px rgba(255,110,30,0.4);
  animation: floatPlate 3.4s ease-in-out infinite; z-index: 3;
}
@keyframes floatPlate { 50% { transform: translateY(-8px) scale(1.04); } }

/* Rising Hot Steam (Dhua) */
.steam-wrap { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: visible; }
.steam-wrap i {
  position: absolute; bottom: 28%; width: 26px; height: 26px;
  background: radial-gradient(circle, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%; filter: blur(5px); opacity: 0; animation: steamRise 2.4s infinite ease-out;
}
.steam-wrap i:nth-child(1) { left: 28%; animation-delay: 0s; }
.steam-wrap i:nth-child(2) { left: 48%; width: 34px; height: 34px; animation-delay: 0.7s; }
.steam-wrap i:nth-child(3) { left: 62%; animation-delay: 1.4s; }
@keyframes steamRise {
  0% { transform: translateY(8px) scale(0.5); opacity: 0; }
  35% { opacity: 0.8; }
  100% { transform: translateY(-70px) scale(2.5) translateX(10px); opacity: 0; }
}

/* FRONT FOCUS: 3D PLAN SHOWCASE CARDS (Monthly / 15-Day / 7-Day) */
.plan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 16px; }
.p-tier {
  position: relative; border-radius: 20px; padding: 14px 8px 12px; text-align: center;
  background: linear-gradient(180deg, var(--sf), var(--sf2));
  border: 2px solid var(--ln); box-shadow: var(--sh-3d-w);
  cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s;
}
.p-tier.on {
  background: linear-gradient(180deg, #fff7f2, #ffe4d4);
  border-color: var(--o);
  box-shadow: 0 6px 0 #b33600, 0 14px 26px rgba(255,85,0,0.28);
  transform: translateY(-5px);
}
[data-theme=dark] .p-tier.on { background: linear-gradient(180deg, #2a160d, #1a0f0a); }
.p-tier .p-badge {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(90deg, #ff5500, #ff8800); color: #fff;
  font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 99px; white-space: nowrap;
  box-shadow: 0 3px 6px rgba(0,0,0,0.2);
}
.p-tier .p-days { font-size: 16px; font-weight: 800; color: var(--ink); display: block; }
.p-tier .p-sub { font-size: 10px; font-weight: 800; color: var(--mu); text-transform: uppercase; margin-bottom: 6px; display: block; }
.p-tier .p-amt { font-size: 20px; font-weight: 800; color: var(--o); display: block; letter-spacing: -.5px; }
.p-tier .p-per { font-size: 10px; font-weight: 700; color: #16a34a; margin-top: 3px; display: block; }

.card {
  background: linear-gradient(180deg, var(--sf), var(--sf2));
  border: 1px solid var(--ln); border-radius: 22px; padding: 16px; margin-bottom: 16px;
  box-shadow: var(--sh-card);
}
.card h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.kpi div { background: var(--sf); border: 1px solid var(--ln); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: var(--sh-card); }
.kpi b { display: block; font-size: 17px; font-weight: 800; color: var(--o); }
.kpi span { font-size: 10px; font-weight: 800; color: var(--mu); text-transform: uppercase; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 13px 16px; border: 0; border-radius: 15px;
  background: linear-gradient(180deg, #ff7a33, #ff4800);
  color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; text-decoration: none;
  box-shadow: var(--sh-3d-o); transition: transform .1s, box-shadow .1s; margin-top: 8px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #b33600; }
.btn.g { background: linear-gradient(180deg, #19b374, #0b6e46); box-shadow: var(--sh-3d-g); }
.btn.g:active { box-shadow: 0 1px 0 #053b25; }
.btn.w { background: var(--sf); color: var(--ink); border: 1px solid var(--ln); box-shadow: var(--sh-3d-w); }
.btn.sm { width: auto; display: inline-flex; padding: 8px 12px; font-size: 11.5px; border-radius: 11px; margin: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > * { flex: 1; }

.inp {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--ln); border-radius: 13px;
  background: var(--sf2); color: var(--ink); font-weight: 700; font-size: 13.5px;
  box-shadow: var(--sh-in); margin: 5px 0; outline: none;

.inp:focus { border-color: var(--o); background: var(--sf); }
.lbl { display: block; font-size: 11px; font-weight: 800; color: var(--mu); margin: 10px 0 4px; text-transform: uppercase; }

.seg { display: flex; gap: 5px; background: var(--sf2); padding: 5px; border-radius: 14px; box-shadow: var(--sh-in); margin: 5px 0; }
.seg button { flex: 1; padding: 9px 4px; border: 0; border-radius: 10px; background: transparent; font-weight: 800; font-size: 11.5px; color: var(--mu); cursor: pointer; }
.seg button.on { background: linear-gradient(180deg, #ff7a33, #ff4800); color: #fff; box-shadow: 0 3px 0 #b33600; }

.sym { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 2px solid #16a34a; border-radius: 3px; background: #fff; flex: none; }
.sym i { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; }
.sym.nv { border-color: #dc2626; }
.sym.nv i { background: #dc2626; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px 6px 6px; border-radius: 99px; border: 1px solid var(--ln);
  background: var(--sf); font-weight: 800; font-size: 12px; box-shadow: var(--sh-3d-w); cursor: pointer;
}
.chips button img { width: 25px; height: 25px; border-radius: 50%; }
.chips button.on { background: linear-gradient(180deg, #ff7a33, #ff4800); color: #fff; border-color: transparent; box-shadow: 0 3px 0 #b33600; }

.area-chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
.area-chips::-webkit-scrollbar { display: none; }
.area-chips span { flex: none; padding: 6px 11px; border-radius: 10px; font-size: 11px; font-weight: 800; background: var(--sf2); border: 1px solid var(--ln); color: var(--mu); cursor: pointer; }
.area-chips span.on { background: rgba(255,85,0,0.12); color: var(--o); border-color: var(--o); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.pcard {
  background: linear-gradient(180deg, var(--sf), var(--sf2));
  border: 1px solid var(--ln); border-radius: 20px; padding: 9px;
  box-shadow: var(--sh-card); display: flex; flex-direction: column; position: relative;
}
.pimg {
  height: 126px; border-radius: 14px; position: relative; cursor: pointer;
  box-shadow: 0 8px 18px rgba(0,0,0,0.16); background: #1e293b; margin-bottom: 8px; overflow: hidden;
}
.pimg img { width: 100%; height: 100%; transition: transform .3s; }
.pimg:active img { transform: scale(1.08); }
.badge { position: absolute; top: 7px; left: 7px; background: #16a34a; color: #fff; font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 6px; z-index: 6; }
.hot-tag { position: absolute; bottom: 6px; right: 6px; background: rgba(15,23,42,0.86); color: #fde047; font-size: 8.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; z-index: 6; }
.half-tag { position: absolute; bottom: 6px; left: 6px; background: #f59e0b; color: #fff; font-size: 8.5px; font-weight: 800; padding: 3px 6px; border-radius: 6px; z-index: 6; }
.pname { font-size: 12.5px; font-weight: 800; line-height: 1.3; height: 33px; overflow: hidden; display: flex; align-items: flex-start; gap: 5px; cursor: pointer; }
.pprice { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 0 8px; }
.pprice b { font-size: 16px; font-weight: 800; color: var(--o); }
.pprice s { font-size: 11px; color: var(--mu); margin-left: 4px; }

.qty { display: flex; align-items: center; justify-content: space-between; background: var(--sf2); padding: 3px; border-radius: 12px; box-shadow: var(--sh-in); margin-top: auto; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--ln); }
.row:last-child { border-bottom: 0; }
.tot { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; margin-top: 6px; border-top: 2px solid var(--ln); }
.tot b { font-size: 22px; font-weight: 800; color: var(--o); }

.ov { position: fixed; inset: 0; z-index: 200; background: rgba(8,14,22,0.82); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; }
.sh {
  background: var(--sf); width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
  border-radius: 28px 28px 0 0; padding: 18px; box-shadow: 0 -10px 40px rgba(0,0,0,0.45);
  animation: slideUp .24s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } }

.pop-stage {
  position: relative; height: 215px; margin: 4px 0 14px; border-radius: 22px;
  background: radial-gradient(circle at 50% 60%, #3b1708, #090e17 75%);
  display: flex; align-items: center; justify-content: center; overflow: visible;
}
.pop-plate {
  width: 188px; height: 188px; border-radius: 50%; object-fit: cover; border: 4px solid #fff;
  box-shadow: 0 22px 38px rgba(0,0,0,0.7), 0 0 28px rgba(255,85,0,0.45);
  animation: popOut3D .45s cubic-bezier(.18,1.25,.4,1) forwards; z-index: 2;
}
@keyframes popOut3D {
  0% { transform: scale(0.3) translateY(50px); opacity: 0; }
  100% { transform: scale(1.04) translateY(-6px); opacity: 1; }
}
.pop-steam { position: absolute; top: -18px; left: 0; right: 0; height: 140px; pointer-events: none; z-index: 4; }
.pop-steam span {
  position: absolute; bottom: 8px; width: 48px; height: 48px;
  background: radial-gradient(circle, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 70%);
  border-radius: 50%; filter: blur(6px); opacity: 0; animation: bigSteam 2s infinite ease-out;
}
.pop-steam span:nth-child(1) { left: 32%; animation-delay: 0s; }
.pop-steam span:nth-child(2) { left: 46%; width: 60px; height: 60px; animation-delay: 0.6s; }
.pop-steam span:nth-child(3) { left: 56%; animation-delay: 1.2s; }
@keyframes bigSteam {
  0% { transform: translateY(25px) scale(0.4); opacity: 0; }
  35% { opacity: 0.9; }
  100% { transform: translateY(-90px) scale(2.6) translateX(12px); opacity: 0; }
}

.cbar-fixed {
  position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom));
  z-index: 75; max-width: 620px; margin: 0 auto;
  background: linear-gradient(145deg, #16a34a, #074729); color: #fff;
  border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 5px 0 #042b18, 0 14px 28px rgba(6,43,28,0.5); cursor: pointer; font-weight: 800; font-size: 13.5px;
}

nav {
  position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
  z-index: 80; max-width: 620px; margin: 0 auto;
  background: var(--sf); border: 1px solid var(--ln); border-radius: 20px;
  display: flex; gap: 6px; padding: 6px;
  box-shadow: 0 7px 0 rgba(15,23,42,0.12), 0 18px 38px rgba(15,23,42,0.25);
}
nav button {
  flex: 1; border: 0; background: transparent; border-radius: 14px; padding: 8px 4px;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--mu); font-weight: 800; position: relative; transition: .15s;
}
nav button.on {
  background: linear-gradient(180deg, #ff7a33, #ff4800); color: #fff;
  box-shadow: 0 4px 0 #b33600; transform: translateY(-3px);
}
nav .nl { font-size: 10px; }
nav .nb { position: absolute; top: 2px; right: 18%; background: #16a34a; color: #fff; font-size: 9px; padding: 1px 5px; border-radius: 99px; border: 1.5px solid #fff; }

#toast {
  position: fixed; left: 50%; bottom: 142px; transform: translateX(-50%) translateY(20px);
  background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 99px;
  font-size: 13px; font-weight: 800; z-index: 900; opacity: 0; pointer-events: none; transition: .25s; text-align: center;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

          <b style="color:var(--o);font-size:15.5px">${inr(s.p)}<span style="font-size:11px;color:var(--mu)">${s.u}</span></b>
          <a class="btn sm" href="https://wa.me/919583937047?text=${encodeURIComponent('Namaste! Mujhe ' + s.n + ' book karna hai.')}" target="_blank">Book on WhatsApp</a>
        </div>
      </div>
    </div>
  `).join('')}`;
}

/* --- 4. KITCHEN VIEW --- */
function vKitchen() {
  const k = iso(D0()), subs = S.subs || [];
  const veg = subs.filter(s => s.type === 'veg').length, nv = subs.length - veg;
  const roti = subs.length * 4 + subs.reduce((a, s) => a + (+s.extraRoti || 0), 0);
  const pendOrds = (S.orders || []).filter(o => !o.dlv);

  return `
  <div class="hero3d green">
    ${steamHTML()}
    <h2>Kitchen Production Counter</h2>
    <p>Aaj (${k}) kitne dabbe aur roti banani hai</p>
    <img class="hero-plate" src="${IMG.thali}" alt="Kitchen">
  </div>

  <div class="kpi">
    <div><b>${subs.length}</b><span>Kul Dabbe</span></div>
    <div><b>${veg} / ${nv}</b><span>Veg / NV</span></div>
    <div><b>${roti}</b><span>Kul Roti</span></div>
  </div>

  <div class="card">
    <h3>Active Tiffin List (${subs.length})</h3>
    ${subs.map(s => `<div class="row">
      <div><b>${esc(s.name)} (${s.days}d ${s.type === 'nv' ? 'Non-Veg' : 'Veg'})</b><div style="font-size:12px;color:var(--mu)">Lunch: ${s.lunch || 'chawal'} · Dinner: ${s.dinner || 'roti'}</div></div>
      <span style="font-weight:800;font-size:12px;color:#16a34a">${s.days} Days</span>
    </div>`).join('')}
  </div>

  <div class="card">
    <h3>Shop Orders to Pack (${pendOrds.length})</h3>
    ${pendOrds.map(o => `<div class="row">
      <div><b>${esc(o.name)}</b><div style="font-size:12.5px;color:var(--o);font-weight:800">${o.items.map(i => i.n + ' ×' + i.q).join(', ')}</div></div>
      <button class="btn g sm" data-a="odlv" data-id="${o.id}">Ready ✓</button>
    </div>`).join('')}
  </div>`;
}

/* --- 5. DELIVERY ROUTE VIEW --- */
function vRoute() {
  const k = iso(D0());
  const subs = S.subs || [];
  const ords = (S.orders || []).filter(o => !o.dlv);

  return `
  <div class="card" style="background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center">
    <div><small style="color:#fde047;font-weight:800">DELIVERY ROUTE</small><h2 style="font-size:17px">Tiffin & Shop Drops</h2></div>
    <button class="btn w sm" data-a="logout_staff">Exit</button>
  </div>

  <div class="card">
    <h3>Tiffin Deliveries (${subs.length})</h3>
    ${subs.map(s => {
      const done = S.done[k + '_' + s.id];
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.addr + ' ' + (s.area || 'Udala'))}`;
      return `<div class="row" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;justify-content:space-between">
          <b>${esc(s.name)} (${s.days}d ${s.type === 'nv' ? 'Non-Veg' : 'Veg'})</b>
          <span style="font-size:11.5px;font-weight:800;color:var(--o)">${esc(s.area)}</span>
        </div>
        <div style="font-size:12px;color:var(--mu);margin:3px 0 8px">${esc(s.addr)}</div>
        <div class="btn-row">
          <a class="btn w sm" href="${mapUrl}" target="_blank">GPS Map</a>
          <a class="btn w sm" href="tel:+91${esc(s.phone)}">Call</a>
          <button class="btn sm ${done ? 'w' : 'g'}" data-a="sdone" data-id="${s.id}">${done ? 'Delivered Today ✓' : 'Mark Delivered ✓'}</button>
        </div>
      </div>`;
    }).join('')}
  </div>

  <div class="card">
    <h3>Shop Order Drops (${ords.length})</h3>
    ${ords.map(o => {
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.addr + ' ' + (o.area || 'Udala'))}`;
      return `<div class="row" style="flex-direction:column;align-items:stretch">
        <div style="display:flex;justify-content:space-between">
          <b>${esc(o.name)} — ${inr(o.total)}</b>
          <span style="font-size:11.5px;font-weight:800;color:${o.paid ? '#16a34a' : '#dc2626'}">${o.paid ? 'PAID' : 'COLLECT CASH/UPI'}</span>
        </div>
        <div style="font-size:12px;color:var(--mu);margin:3px 0 8px">${esc(o.addr)} · ${o.items.map(i => i.n + '×' + i.q).join(', ')}</div>
        <div class="btn-row">
          <a class="btn w sm" href="${mapUrl}" target="_blank">GPS Map</a>
          <a class="btn w sm" href="tel:+91${esc(o.phone)}">Call</a>
          <button class="btn g sm" data-a="odlv" data-id="${o.id}">Delivered ✓</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* --- 6. CLEAN OWNER PANEL --- */
function vOwner() {
  const subs = (S.subs || []).slice().reverse();
  const ords = (S.orders || []).slice().reverse();
  const totIn = ords.reduce((a, o) => a + (o.paid ? o.total : 0), 0) + subs.reduce((a, s) => a + (s.paid ? s.price : 0), 0);

  return `
  <div class="card" style="background:#0f172a;color:#fff;display:flex;justify-content:space-between;align-items:center">
    <div><small style="color:#fde047;font-weight:800">OWNER CONSOLE</small><h2 style="font-size:17px">Orders · Plans · Menu · Stock</h2></div>
    <button class="btn w sm" data-a="logout_staff">Exit</button>
  </div>

  <div class="kpi">
    <div><b>${inr(totIn)}</b><span>Total Sales</span></div>
    <div><b>${subs.length}</b><span>Active Plans</span></div>
    <div><b>${ords.length}</b><span>Shop Orders</span></div>
  </div>

  <div class="card">
    <h3>Aaj Ka Menu Badlein</h3>
    <span class="lbl">Subah Nashta</span>
    <input class="inp" id="m_bf" value="${esc(menu('bf'))}">
    <span class="lbl">Pure Veg Menu</span>
    <input class="inp" id="m_veg" value="${esc(menu('veg'))}">
    <span class="lbl">Non-Veg Menu</span>
    <input class="inp" id="m_nv" value="${esc(menu('nv'))}">
    <button class="btn g" data-a="savem">Save Menu</button>
  </div>

  <div class="card">
    <h3>Tiffin Subscriptions (${subs.length})</h3>
    ${subs.map(s => `<div class="row">
      <div><b>${esc(s.name)} (${s.days} Din ${s.type === 'nv' ? 'Non-Veg' : 'Veg'})</b><div style="font-size:11.5px;color:var(--mu)">${esc(s.phone)} · ${esc(s.area)} · ${inr(s.price)}</div></div>
      <span style="color:#16a34a;font-weight:800;font-size:12px">Active</span>
    </div>`).join('')}
  </div>

  <div class="card">
    <h3>Shop Orders (${ords.length})</h3>
    ${ords.map(o => `<div class="row">
      <div><b>${esc(o.name)} (${esc(o.phone)}) — ${inr(o.total)}</b><div style="font-size:11.5px;color:var(--mu)">${o.items.map(i => i.n + '×' + i.q).join(', ')}</div></div>
      ${!o.dlv ? `<button class="btn g sm" data-a="odlv" data-id="${o.id}">Deliver ✓</button>` : '<span style="color:#16a34a;font-weight:800">Done ✓</span>'}
    </div>`).join('')}
  </div>

  <div class="card">
    <h3>Stock On / Off (${S.prod.length} Items)</h3>
    ${S.prod.map(p => `<div class="row"><b>${esc(p.n)} (${inr(p.p)})</b><button class="btn sm ${p.s ? 'g' : 'w'}" data-a="stk" data-id="${p.id}">${p.s ? 'In Stock' : 'Out'}</button></div>`).join('')}
  </div>`;
}

/* --- MODALS: 3D PLATE VIEW, POPUP CART & SIMPLE PAYMENT --- */
function sheet() {
  if (PAY_BOX) {
    const g = PAY_BOX, uLink = upi(g.amt, g.title);
    return `<div class="ov" data-a="close_bg"><div class="sh" style="text-align:center">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <b style="color:#16a34a;font-size:13px">UPI Payment Step</b>
        <button class="btn w sm" data-a="close">Back</button>
      </div>
      <h2 style="font-size:19px;font-weight:800">${esc(g.title)}</h2>
      <div style="font-size:26px;font-weight:800;color:var(--o);margin:6px 0">${inr(g.amt)}</div>

      <div style="background:#fff;padding:12px;border-radius:18px;width:fit-content;margin:8px auto;border:2px solid var(--ln)">
        <img src="${qrUrl(uLink)}" style="width:165px;height:165px" alt="QR">
        <div style="font-size:11px;color:var(--mu);font-weight:700;margin-top:4px">UPI ID: ${UPI}</div>
      </div>

      <div class="btn-row">
        <a class="btn" href="${esc(uLink)}">Open UPI App</a>
        <button class="btn w" data-a="copy_upi">Copy UPI ID</button>
      </div>

      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--ln);text-align:left">
        <input class="inp" id="utr_inp" placeholder="Optional: UPI Ref / Last 4 Digits daalein">
        <button class="btn g" data-a="confirm_paid">Confirm & Place Order</button>
      </div>
    </div></div>`;
  }

  if (CART_OPEN) {
    const n = cc(), st = subTot(), df = dlvFee(), tot = ct();
    return `<div class="ov" data-a="close_bg"><div class="sh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3>Aapka Cart (${n} Items)</h3>
        <button class="btn w sm" data-a="close">Close</button>
      </div>
      <div style="max-height:200px;overflow-y:auto">
        ${Object.entries(C).filter(x => x[1] > 0).map(([k, q]) => {
          const p = S.prod.find(x => x.id === parseInt(k)); if (!p) return '';
          const isH = k.endsWith('h'), pr = isH ? Math.round(p.p * 0.6) : p.p;
          return `<div class="row">
            <div><b>${esc(p.n)}${isH ? ' (1/2 Half)' : ''}</b><div style="font-size:11.5px;color:var(--mu)">${inr(pr)} × ${q}</div></div>
            <div class="qty" style="width:105px;margin:0"><button data-a="${isH ? 'dh' : 'dec'}" data-id="${p.id}">−</button><b>${q}</b><button data-a="${isH ? 'ih' : 'inc'}" data-id="${p.id}">+</button></div>
          </div>`;
        }).join('')}
      </div>
      <div style="font-size:12px;color:var(--mu);padding-top:8px;display:flex;justify-content:space-between">
        <span>Items: ${inr(st)}</span>
        <span>Delivery: <b>${df ? '₹25 (₹300+ par Free)' : 'FREE'}</b></span>
      </div>
      <div class="tot"><span>Kul Bill</span><b>${inr(tot)}</b></div>
      ${userFormHTML()}
      <button class="btn" data-a="pay_ord">Proceed to Pay · ${inr(tot)}</button>
    </div></div>`;
  }

  if (PQ) {
    const p = S.prod.find(x => x.id === +PQ); if (!p) return '';
    const qf = C[p.id] || 0, qh = C[p.id + 'h'] || 0;
    return `<div class="ov" data-a="close_bg"><div class="sh">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <b style="color:var(--o);font-size:12px">3D REAL STEAM VIEW</b>
        <button class="btn w sm" data-a="close">Close</button>
      </div>
      <div class="pop-stage">
        ${p.hot ? `<div class="pop-steam"><span></span><span></span><span></span></div>` : ''}
        <img class="pop-plate" src="${p.img}" alt="${esc(p.n)}">
      </div>
      <h2 style="font-size:19px;font-weight:800;text-align:center">${esc(p.n)}</h2>
      <div class="row" style="margin-top:10px">
        <div><b>Full Plate / Pack</b><div style="font-size:12px;color:var(--mu)">${inr(p.p)}</div></div>
        <div class="qty" style="width:115px;margin:0"><button data-a="dec" data-id="${p.id}">−</button><b>${qf}</b><button data-a="inc" data-id="${p.id}">+</button></div>
      </div>
      ${p.h ? `<div class="row">
        <div><b>1/2 Half Plate</b><div style="font-size:12px;color:var(--mu)">${inr(Math.round(p.p * 0.6))}</div></div>
        <div class="qty" style="width:115px;margin:0"><button data-a="dh" data-id="${p.id}">−</button><b>${qh}</b><button data-a="ih" data-id="${p.id}">+</button></div>
      </div>` : ''}
      <button class="btn g" data-a="add_open_cart" data-id="${p.id}">Open Cart & Checkout</button>
    </div></div>`;
  }
  return '';
}

function render() {
  const V = { plan: vPlan, shop: vShop, services: vServices, kitchen: vKitchen, route: vRoute, owner: vOwner };
  $('#v').innerHTML = (V[tab] || vPlan)();
  $('#sheet').innerHTML = sheet();

  const n = cc(), tot = ct();
  $('#cbar').innerHTML = (n > 0 && !CART_OPEN && !PAY_BOX) ? `
    <div class="cbar-fixed" data-a="open_cart">
      <span>${n} Item · ${inr(tot)}</span>
      <span>View Cart & Order →</span>
    </div>` : '';

  const TABS = [
    ['plan', IC.tiffin, 'Plans'],
    ['shop', IC.shop, 'Shop'],
    ['services', IC.svc, 'Services']
  ];
  if (ROLE === 'staff' || ROLE === 'owner') {
    TABS.push(['kitchen', IC.kitchen, 'Kitchen'], ['route', IC.route, 'Route']);
  }
  if (ROLE === 'owner') TABS.push(['owner', IC.owner, 'Owner']);

  $('#nav').innerHTML = TABS.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-a="tab" data-v="${x[0]}">${x[1]}<span class="nl">${x[2]}</span>${x[0] === 'shop' && n ? `<span class="nb">${n}</span>` : ''}</button>`).join('');
}

function checkUser() {
  if (!F.name.trim() || ph(F.phone).length !== 10 || !F.addr.trim()) {
    toast('Naam, 10-digit Mobile Number aur Address bharein');
    return false;
  }
  saveUser();
  return true;
}

const A = {
  tab: v => { tab = v; PQ = null; CART_OPEN = false; PAY_BOX = null; render(); scrollTo({ top: 0, behavior: 'smooth' }); },
  fset: (v, k) => { F[k] = (k === 'days' || k === 'times') ? +v : v; render(); },
  set_area: v => { F.area = v; saveUser(); render(); },
  cat: v => { SCAT = v; render(); },
  pq: (v, k, id) => { PQ = +id; render(); },
  open_cart: () => { PQ = null; CART_OPEN = true; render(); },
  add_open_cart: (v, k, id) => { if (!C[id] && !C[id + 'h']) C[id] = 1; localStorage.setItem('nu5c', JSON.stringify(C)); PQ = null; CART_OPEN = true; render(); },
  close: () => { PQ = null; CART_OPEN = false; PAY_BOX = null; render(); },
  close_bg: (v, k, id, e) => { if (e && e.target.classList.contains('ov')) { PQ = null; CART_OPEN = false; PAY_BOX = null; render(); } },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  ih: (v, k, id) => { C[id + 'h'] = (C[id + 'h'] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dh: (v, k, id) => { C[id + 'h'] = Math.max(0, (C[id + 'h'] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },

  getgps: () => {
    if (!navigator.geolocation) { F.lat = 21.5742; F.lng = 86.5681; saveUser(); render(); toast('GPS Saved'); return; }
    toast('Detecting GPS...');
    navigator.geolocation.getCurrentPosition(pos => {
      F.lat = pos.coords.latitude; F.lng = pos.coords.longitude;
      saveUser(); render(); toast('GPS Location Saved!');
    }, () => {
      F.lat = 21.5742; F.lng = 86.5681; saveUser(); render(); toast('Udala GPS Pin Saved');
    }, { enableHighAccuracy: true, timeout: 6000 });
  },

  pay_sub: () => {
    if (!checkUser()) return;
    PAY_BOX = { kind: 'sub', amt: tierPrice(+F.days), days: +F.days, title: `${F.days} Din Tiffin (${F.times} Time)` };
    render();
  },
  pay_trial: () => {
    if (!checkUser()) return;
    PAY_BOX = { kind: 'sub', amt: 49, days: 1, title: `1 Din Trial Tiffin (${F.times} Time)` };
    render();
  },
  pay_ord: () => {
    if (!checkUser()) return;
    CART_OPEN = false;
    PAY_BOX = { kind: 'ord', amt: ct(), title: `Shop Order (${cc()} Items)` };
    render();
  },

  copy_upi: () => { navigator.clipboard.writeText(UPI).catch(() => {}); toast('UPI ID Copied: ' + UPI); },

  confirm_paid: () => {
    if (!PAY_BOX) return;
    const refNo = ($('#utr_inp') ? $('#utr_inp').value.trim() : '') || 'PAID';
    if (PAY_BOX.kind === 'sub') {
      const id = uid('s');
      S.subs.push({ id, name: F.name.trim(), phone: ph(F.phone), area: F.area, addr: F.addr.trim(), lat: F.lat, lng: F.lng, type: F.type, days: PAY_BOX.days, times: F.times, lunch: F.lunch, dinner: F.dinner, start: iso(D0()), price: PAY_BOX.amt, paid: 1, utr: refNo });
      MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
      PAY_BOX = null; save(); toast('Tiffin Plan Book Ho Gaya!');
    } else {
      const items = [];
      Object.entries(C).forEach(([k, q]) => {
        const p = S.prod.find(x => x.id === parseInt(k)); if (!p || q < 1) return;
        const isH = k.endsWith('h'), pr = isH ? Math.round(p.p * 0.6) : p.p;
        items.push({ n: p.n + (isH ? ' (Half)' : ''), q, p: pr });
      });
      const id = uid('o');
      S.orders.push({ id, ts: Date.now(), date: iso(D0()), name: F.name.trim(), phone: ph(F.phone), area: F.area, addr: F.addr.trim(), lat: F.lat, lng: F.lng, items, total: PAY_BOX.amt, paid: 1, dlv: 0, utr: refNo });
      MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
      C = {}; localStorage.setItem('nu5c', '{}');
      PAY_BOX = null; save(); toast('Order Confirm Ho Gaya!');
    }
  },

  odlv: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.dlv = 1; o.paid = 1; save(); toast('Order Delivered ✓'); } },
  sdone: (v, k, id) => { const key = iso(D0()) + '_' + id; S.done[key] = S.done[key] ? 0 : 1; save(); toast('Tiffin Status Updated ✓'); },
  savem: () => { S.mset[iso(D0())] = { bf: $('#m_bf').value.trim(), veg: $('#m_veg').value.trim(), nv: $('#m_nv').value.trim() }; save(); toast('Menu Saved'); },
  stk: (v, k, id) => { const p = S.prod.find(x => x.id === +id); if (p) { p.s = p.s ? 0 : 1; save(); } },
  theme: () => {
    const d = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = d ? 'dark' : '';
    $('#thm').textContent = d ? '☀️' : '🌙';
  },
  logout_staff: () => { ROLE = ''; sessionStorage.removeItem('nu_role'); tab = 'plan'; render(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset.v, b.dataset.k, b.dataset.id, e); }
});

document.addEventListener('input', e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.id === 'sq') { SQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#sq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

let taps = 0, tapT;
$('#mark').addEventListener('click', () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1800);
  if (taps >= 5) {
    taps = 0;
    const pin = prompt('Owner PIN (4827) ya Kitchen/Delivery PIN (7788) daalein:');
    if (pin === OPIN) { ROLE = 'owner'; sessionStorage.setItem('nu_role', 'owner'); tab = 'owner'; render(); toast('Owner Mode On'); }
    else if (pin === DPIN) { ROLE = 'staff'; sessionStorage.setItem('nu_role', 'staff'); tab = 'kitchen'; render(); toast('Staff Mode On'); }
    else if (pin !== null) toast('Galat PIN');
  }
});

render();
</script>
</body>
</html>
