--ac-s:#2A1A12;--gr-s:#12241C;--rd-s:#2A1618;--bl-s:#141C2E;--pu-s:#1B1730;--am-s:#241D10;

.wrap{max-width:720px;margin:0 auto;padding:20px 20px 0}

.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi div{background:var(--sf2);border-radius:14px;padding:14px 10px;text-align:center}

.kpi span{font-size:10.5px;color:var(--mu);font-weight:600}
.bar{height:6px;background:var(--sf2);border-radius:9px;overflow:hidden;margin:10px 0 6px}

buy:(v,k,id)=>{const p=S.prod.find(x=>x.id===+id);if(!p||!p.s)return;C[id]=cl((C[id]||0)+1,0,99);sC();track('add_cart',{n:p.n,q:1});PQ=null;tab='shop';render();setTimeout(()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},140)},

order:mkOrder,join:()=>mkPlan(0),trial:()=>mkPlan(1),
trk:(v,k,id)=>{PQ=PSUC=null;SUC=null;TRK=id;track('track_view',{id});render()},
utro:(v,k,id)=>{const o=S.orders.find(x=>x.id===id);if(!o)return;const el=$('#u_'+id),c=(el?el.value:'').replace(/\D/g,'');if(c.length!==12){toast('12-digit UTR daalo');return}o.utr=c;track('utr_submit',{id});save();toast('UTR mil gaya')},
utrp:(v,k,id)=>{const s=S.subs.find(x=>x.id===id);if(!s)return;const el=$('#u_'+id),c=(el?el.value:'').replace(/\D/g,'');if(c.length!==12){toast('12-digit UTR daalo');return}s.utr=c;save();toast('UTR mil gaya')},
again:(v,k,id)=>{const o=S.orders.find(x=>x.id===id);if(!o)return;let n=0;o.items.forEach(i=>{const h=i.n.includes('(½)'),b=i.n.replace(' (½)','');const p=S.prod.find(x=>x.n===b&&x.s);if(p){const key=h?p.id+'h':p.id;C[key]=cl((C[key]||0)+i.q,0,99);n++}});if(!n){toast('Stock mein nahi');return}sC();track('reorder',{id});TRK=PSUC=null;tab='shop';render();setTimeout(()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},140);toast('Cart mein daal diya')},
sup:(v,k,id)=>wa('9583937047','Namaste! Order #'+String(id).slice(-6)+' ka status jaanna hai'),
login:()=>{const n=$('#ln')?$('#ln').value.trim():'',p=ph($('#lp')?$('#lp').value:'');if(!n||p.length!==10){toast('Naam + 10-digit phone');return}ME={name:n,phone:p};sME();F.name=n;F.phone=p;let w='';if(!S.pts[p]){S.pts[p]=50;w=' · +50 points'}track('login',{phone:p});save();toast('Login ho gaya'+w)},
logout:()=>{if(!confirm('Logout karein?'))return;ME=null;sME();render();toast('Logout')},
skip:(v,k,id)=>{const s=S.subs.find(x=>x.id===id);if(!s)return;s.skip=s.skip||[];const d=iso(D0()),i=s.skip.indexOf(d);if(i>=0)s.skip.splice(i,1);else s.skip.push(d);save();toast(i>=0?'Wapas':'Aaj skip')},
done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save();toast(S.done[key]?'Delivered':'Undo')},
odone:(v,k,id)=>{const o=S.orders.find(x=>x.id===id);if(!o)return;UNDO={t:'ord',o:{...o}};o.dlv=1;o.status='delivered';o.dlvTs=Date.now();track('delivered',{id});save();toast('Delivered',true)},
outO:(v,k,id)=>{const o=S.orders.find(x=>x.id===id);if(!o||!o.paid)return;o.status='out';o.outTs=Date.now();track('out',{id});save();toast('On the way')},
paidO:(v,k,id)=>{if(!OK){toast('Owner login chahiye');return}const o=S.orders.find(x=>x.id===id);if(!o||o.paid)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;o.status='packing';o.paidTs=Date.now();S.pays.push({id:uid('p'),d:iso(D0()),name:o.name,phone:o.phone,amt:o.total,kind:'Shop'});S.pts[o.phone]=(S.pts[o.phone]||0)+Math.round(o.total/10);track('paid',{id});save();toast('Payment confirm')},
allsub:()=>{if(!OK&&!ST){toast('Login chahiye');return}const k=iso(D0()),l=S.subs.filter(s=>act(s,D0())&&!S.done[k+'_'+s.id]);if(!l.length||!confirm(l.length+' dabbe delivered?'))return;l.forEach(s=>S.done[k+'_'+s.id]=1);save();toast(l.length+' delivered')},
allord:()=>{if(!OK&&!ST){toast('Login chahiye');return}const l=S.orders.filter(o=>!o.dlv);if(!l.length||!confirm(l.length+' order delivered?'))return;UNDO={t:'ords',os:l.map(o=>({...o}))};l.forEach(o=>{o.dlv=1;o.status='delivered';o.dlvTs=Date.now()});save();toast(l.length+' delivered',true)},
sel:(v,k,id)=>{if(SEL.has(id))SEL.delete(id);else SEL.add(id);render()},
sclr:()=>{SEL.clear();render()},
bdone:()=>{if(!OK)return;const l=S.orders.filter(o=>SEL.has(o.id)&&!o.dlv);if(!l.length||!confirm(l.length+' delivered?'))return;UNDO={t:'ords',os:l.map(o=>({...o}))};l.forEach(o=>{o.dlv=1;o.status='delivered';o.dlvTs=Date.now()});SEL.clear();save();toast('Done',true)},
bpaid2:()=>{if(!OK)return;const l=S.orders.filter(o=>SEL.has(o.id)&&!o.paid);if(!l.length||!confirm(l.length+' paid?'))return;l.forEach(o=>{o.paid=1;o.status='packing';o.paidTs=Date.now();S.pays.push({id:uid('p'),d:iso(D0()),name:o.name,phone:o.phone,amt:o.total,kind:'Shop'})});SEL.clear();save();toast('Paid')},
ov:v=>{OV=v;SEL.clear();render()},of:v=>{OF=v;render()},
newp:()=>{OV='prod';ED='new';render()},
editp:(v,k,id)=>{OV='prod';ED=+id;render();setTimeout(()=>{const p=S.prod.find(x=>x.id===+id);if(!p)return;$('#en').value=p.n;$('#ep').value=p.p;$('#em').value=p.mrp||'';$('#ec').value=p.c},60)},
canp:()=>{ED=null;render()},
savep:(v,k,id)=>{if(!OK)return;const n=$('#en').value.trim(),p=+$('#ep').value,m=+$('#em').value||0,c=$('#ec').value;
if(!n||!(p>0)){toast('Naam + price daalo');return}
const img=(CATS.find(x=>x[0]===c)||['','',IMG.groc])[2];
if(id==='new'){S.prod.push({id:Date.now(),n,p:Math.round(p),mrp:m?Math.round(m):null,c,img,h:0,nv:0,s:1,r:4.5});logAdd('Product add '+n)}
else{const x=S.prod.find(y=>y.id===+id);if(x){x.n=n;x.p=Math.round(p);x.mrp=m?Math.round(m):null;x.c=c;x.img=img;logAdd('Product edit '+n)}}
ED=null;save();toast('Save ho gaya')},
delp:(v,k,id)=>{if(!OK)return;const p=S.prod.find(x=>x.id===+id);if(!p||!confirm('Delete '+p.n+'?'))return;UNDO={t:'prod',p:{...p},i:S.prod.indexOf(p)};S.prod=S.prod.filter(x=>x.id!==+id);save();toast('Delete',true)},
stock:(v,k,id)=>{if(!OK)return;const p=S.prod.find(x=>x.id===+id);if(p){p.s=p.s?0:1;save();toast(p.s?'Stock mein':'Khatam')}},
undo:()=>{if(!UNDO)return;if(UNDO.t==='cart'){C=UNDO.c;sC()}else if(UNDO.t==='prod'){S.prod.splice(UNDO.i,0,UNDO.p)}else if(UNDO.t==='ord'){const o=S.orders.find(x=>x.id===UNDO.o.id);if(o)Object.assign(o,UNDO.o)}else if(UNDO.t==='ords'){UNDO.os.forEach(s=>{const o=S.orders.find(x=>x.id===s.id);if(o)Object.assign(o,s)})}UNDO=null;save();toast('Undo ho gaya')},
svb:(v,k,id)=>{SVB=id;const s=SVC.find(x=>x.id===id);track('service_view',{n:s?s.n:''});SVF.name=ME?ME.name:F.name;SVF.phone=ME?ME.phone:F.phone;render();setTimeout(()=>{const e=$('#svf');if(e)e.scrollIntoView({behavior:'smooth'})},140)},
svx:()=>{SVB=null;render()},
svok:()=>{if(BUSY)return;const b=SVC.find(x=>x.id===SVB);if(!b)return;const n=SVF.name.trim(),p=ph(SVF.phone);if(n.length<2||p.length!==10||!SVF.date){toast('Naam, phone, date daalo');return}BUSY=1;setTimeout(()=>BUSY=0,3000);S.sv.push({id:uid('v'),ts:Date.now(),svname:b.n,cat:b.c,date:SVF.date,time:SVF.time,opt:SVF.opt,name:n,phone:p,amt:b.p,status:'pending',paid:0});track('service_book',{n:b.n});SVB=null;save();toast('Request gayi — owner call karega')},
svc1:(v,k,id)=>{if(!OK)return;const x=S.sv.find(y=>y.id===id);if(x){x.status='confirmed';save();toast('Confirmed')}},
svc2:(v,k,id)=>{if(!OK)return;const x=S.sv.find(y=>y.id===id);if(x){x.status='done';save();toast('Done')}},
svc3:(v,k,id)=>{if(!OK)return;const x=S.sv.find(y=>y.id===id);if(!x||x.paid)return;if(!confirm(x.name+': '+inr(x.amt)+' mil gaye?'))return;x.paid=1;S.pays.push({id:uid('p'),d:iso(D0()),name:x.name,phone:x.phone,amt:x.amt,kind:'Service'});save();toast('Paid')},
bp:v=>{BF.pkg=v;render()},
bi:()=>{BF.plates=cl(BF.plates+(BF.plates<100?10:50),20,2000);render()},
bd:()=>{BF.plates=cl(BF.plates-(BF.plates<=100?10:50),20,2000);render()},
bok:()=>{if(BUSY)return;const c=bRate(),n=BF.name.trim(),p=ph(BF.phone);if(n.length<2||p.length!==10||!BF.event||!BF.venue){toast('Event, venue, naam, phone daalo');return}if(loadOn(BF.date)+BF.plates>S.cap){toast(BF.date+' capacity full');return}BUSY=1;setTimeout(()=>BUSY=0,3000);const pk=BPKG.find(x=>x.id===BF.pkg);S.bulk.push({id:uid('b'),ts:Date.now(),pkgName:pk.n,plates:BF.plates,event:BF.event,date:BF.date,venue:BF.venue,name:n,phone:p,amt:c.total,status:'pending',paid:0});track('bulk_request',{plates:BF.plates});save();toast('Bulk request gayi')},
bk1:(v,k,id)=>{if(!OK)return;const b=S.bulk.find(y=>y.id===id);if(b){b.status='confirmed';save();toast('Confirmed')}},
bk2:(v,k,id)=>{if(!OK)return;const b=S.bulk.find(y=>y.id===id);if(!b||b.paid)return;if(!confirm(b.event+': '+inr(b.amt)+' mil gaye?'))return;b.paid=1;b.status='done';S.pays.push({id:uid('p'),d:iso(D0()),name:b.name,phone:b.phone,amt:b.amt,kind:'Bulk'});save();toast('Paid')},
setcap:()=>{if(!OK)return;const v=+$('#cv').value;if(!(v>=20&&v<=2000)){toast('20–2000');return}S.cap=v;save();toast('Capacity '+v)},
setmin:()=>{if(!OK)return;const v=+$('#mv').value;if(!(v>=0&&v<=2000)){toast('0–2000');return}S.cfg.min=v;save();toast('Min '+inr(v))},
addx:()=>{if(!OK)return;const n=$('#xn').value.trim(),a=+$('#xa').value;if(!n||!(a>0)){toast('Naam + amount');return}S.exp.push({d:iso(D0()),n:n.slice(0,40),amt:Math.round(a)});save();toast('Kharcha add')},
expl:()=>{if(!OK)return;const r=[['Type','Date','Name','Phone','Amount','Kind']];S.pays.forEach(p=>r.push(['IN',p.d,p.name,p.phone||'',p.amt,p.kind]));S.exp.forEach(x=>r.push(['OUT',x.d,x.n,'',x.amt,'Expense']));csv('ledger.csv',r);toast('Ledger CSV')},
expc:()=>{if(!OK)return;const m={};S.subs.forEach(s=>{const c=m[s.phone]=m[s.phone]||{name:s.name,phone:s.phone,area:s.area,pl:0,or:0,sp:0};c.pl++;c.sp+=s.paid?s.price:0});S.orders.forEach(o=>{if(!o.phone)return;const c=m[o.phone]=m[o.phone]||{name:o.name,phone:o.phone,area:o.area,pl:0,or:0,sp:0};c.or++;c.sp+=o.paid?o.total:0});csv('customers.csv',[['Name','Phone','Area','Plans','Orders','Spend']].concat(Object.values(m).map(c=>[c.name,c.phone,c.area,c.pl,c.or,c.sp])));toast('Customers CSV')},
expp:()=>{if(!OK)return;csv('products.csv',[['Name','Price','MRP','Category','Stock']].concat(S.prod.map(p=>[p.n,p.p,p.mrp||'',p.c,p.s])));toast('Products CSV')},
expe:()=>{if(!OK)return;csv('events.csv',[['Time','Session','Name','Phone','Tab','Event','Detail']].concat(S.events.map(e=>[new Date(e.ts).toISOString(),e.sess,e.name,e.phone,e.tab,e.ev,JSON.stringify(e.data)])));toast('Events CSV')},
clre:()=>{if(!OK||!confirm('Events clear?'))return;S.events=[];save();toast('Clear')},
rem:(v,k,id)=>{track('cart_remind',{phone:id});wa(id,'Namaste! Aapne Namaste Udala app mein cart mein items chhode the. Order karna ho toh reply karo — free delivery, min '+inr(S.cfg.min))},
voice:()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Chrome use karo');return}const r=new SR();r.lang='hi-IN';toast('Bolo…');r.onresult=e=>{const t=e.results[0][0].transcript;SQ=t;SCAT='all';track('search',{q:t,voice:1});render();toast('"'+t+'"')};r.onerror=()=>toast('Mic permission do');r.start()},
theme:()=>{const d=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=d?'dark':'';localStorage.setItem('nu4t',d?'dark':'');$('#thm').textContent=d?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=d?'#0C100E':'#ffffff'},
out:()=>{OK=0;ST=0;sessionStorage.removeItem('nu4ok');sessionStorage.removeItem('nu4st');tab='shop';render();toast('Bahar')},
reset:()=>{if(!OK)return;if(!confirm('SAB DATA DELETE!'+NL+'Backup liya?'))return;if(prompt('Type DELETE')!=='DELETE'){toast('Cancel');return}S=seed();S.subs=[];S.orders=[];S.sv=[];S.bulk=[];S.pays=[];S.exp=[];S.events=[];S.log=[];S.pts={};C={};MY=[];sC();sMY();save();toast('Reset')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const f=A[b.dataset.a];if(!f)return;e.preventDefault();try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){console.error(x);toast(x.message)}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-a="sel"]');if(b)A.sel(null,null,b.dataset.id)});
let st;document.addEventListener('input',e=>{const d=e.target.dataset||{};
if(d.f){F[d.f]=e.target.value;if(d.f==='phone')F.phone=ph(F.phone)}
if(d.sv){SVF[d.sv]=e.target.value;if(d.sv==='phone')SVF.phone=ph(SVF.phone)}
if(d.b){BF[d.b]=e.target.value;if(d.b==='phone')BF.phone=ph(BF.phone)}
if(e.target.id==='sq'){SQ=e.target.value;SCAT='all';clearTimeout(st);st=setTimeout(()=>{if(SQ.trim())track('search',{q:SQ.trim()});const p=e.target.selectionStart;render();const i=$('#sq');if(i){i.focus();i.setSelectionRange(p,p)}},350)}
if(e.target.id==='oq'){OQ=e.target.value;clearTimeout(st);st=setTimeout(()=>{const p=e.target.selectionStart;render();const i=$('#oq');if(i){i.focus();i.setSelectionRange(p,p)}},350)}});
document.addEventListener('keydown',e=>{const t=e.target;
if((e.key==='Enter'||e.key===' ')&&t&&t.dataset&&t.dataset.a&&!['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(t.tagName)){e.preventDefault();const f=A[t.dataset.a];if(f)f(t.dataset.v,t.dataset.k,t.dataset.id);return}
if(!(PQ||TRK||PSUC))return;
if(e.key==='Escape'){A.close();return}
if(e.key==='Tab'){const sh=document.querySelector('.sh');if(!sh)return;const f=[...sh.querySelectorAll('button,[href],input')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
let hc=0,hT,lT,lF=false;const mk=$('#mark');
mk.addEventListener('pointerdown',()=>{lF=false;clearTimeout(lT);lT=setTimeout(()=>{lF=true;hc=0;A.tab('owner')},700)});
['pointerup','pointerleave','pointercancel'].forEach(v=>mk.addEventListener(v,()=>clearTimeout(lT)));
mk.addEventListener('click',()=>{if(lF){lF=false;return}hc++;clearTimeout(hT);hT=setTimeout(()=>hc=0,1800);if(hc===3)toast('Owner: 2 aur tap');if(hc>=5){hc=0;A.tab('owner')}});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(localStorage.getItem('nu4t')==='dark'){document.documentElement.dataset.theme='dark';$('#thm').textContent='☀️';document.querySelector('meta[name=theme-color]').content='#0C100E'}
setInterval(()=>{if(TRK&&!typing())render()},20000);
render();
if(location.hash==='#owner')A.tab('owner');
