<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Namaste Udala - Simple Tiffin App</title>
    
    <!-- PWA Essentials -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0e5c3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NamasteUdala">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ff5a1f;
            --secondary: #0e5c3f;
            --bg: #f6f3ec;
            --surface: #ffffff;
            --text: #1c1917;
            --muted: #7d7468;
            --border: #ece2d0;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* Header */
        header {
            background: var(--secondary); color: white; padding: 16px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-weight: 800; font-size: 18px; }
        .cart-icon { position: relative; cursor: pointer; font-size: 20px; }
        .badge {
            position: absolute; top: -5px; right: -5px; background: var(--primary);
            color: white; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 10px;
        }

        /* Container */
        .container { padding: 16px; max-width: 500px; margin: 0 auto; }
        
        /* Cards */
        .card {
            background: var(--surface); border-radius: var(--radius); padding: 16px;
            margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 { font-size: 18px; margin-bottom: 12px; color: var(--secondary); }
        h3 { font-size: 16px; margin-bottom: 8px; }
        p { font-size: 14px; color: var(--muted); line-height: 1.5; }

        /* Buttons */
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px;
            transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #f0f0f0; color: var(--text); }
        .btn:active { transform: scale(0.98); }

        /* Segmented Control */
        .seg-control { display: flex; gap: 8px; margin-bottom: 12px; }
        .seg-btn {
            flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 10px;
            background: white; font-weight: 600; cursor: pointer; text-align: center;
        }
        .seg-btn.active { border-color: var(--primary); color: var(--primary); background: #fff5f0; }

        /* Shop Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .item-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .item-img { height: 100px; width: 100%; object-fit: cover; background: #eee; }
        .item-info { padding: 10px; }
        .item-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .item-price { font-size: 14px; color: var(--primary); font-weight: 800; }
        .add-btn {
            width: 100%; padding: 8px; border: none; background: var(--secondary);
            color: white; font-weight: 600; font-size: 12px; margin-top: 6px; border-radius: 6px;
        }

        /* Bottom Nav */
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            display: flex; justify-content: space-around; padding: 10px 0;
            border-top: 1px solid var(--border); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; color: var(--muted); cursor: pointer;
        }
        .nav-item.active { color: var(--primary); font-weight: 700; }
        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        /* Modal */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 200; align-items: flex-end; justify-content: center;
        }
        .modal.open { display: flex; }
        .sheet {
            background: white; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0;
            padding: 20px; max-height: 80vh; overflow-y: auto;
        }
        .close-modal { float: right; font-size: 20px; cursor: pointer; color: var(--muted); }

        /* Forms */
        input, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 10px; font-size: 14px;
        }
        
        /* Owner Stats */
        .stat-box {
            background: #f8f9fa; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 10px;
        }
        .stat-val { font-size: 20px; font-weight: 800; color: var(--secondary); }
        .stat-lbl { font-size: 12px; color: var(--muted); }

        /* Order Item */
        .order-row {
            display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee;
        }
        .status-select { padding: 4px; border-radius: 4px; border: 1px solid #ddd; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="logo">🍱 Namaste Udala</div>
    <div class="cart-icon" onclick="openCart()">
        🛒 <span class="badge" id="cartCount" style="display:none;">0</span>
    </div>
</header>

<div class="container" id="appView">
    <!-- Content injected by JS -->
</div>

<nav class="nav">
    <div class="nav-item active" onclick="switchTab('home')">
        <span class="nav-icon">🏠</span> Home
    </div>
    <div class="nav-item" onclick="switchTab('shop')">
        <span class="nav-icon">🛒</span> Shop
    </div>
    <div class="nav-item" onclick="switchTab('profile')">
        <span class="nav-icon">👤</span> Profile
    </div>
    <div class="nav-item" onclick="switchTab('owner')">
        <span class="nav-icon">📊</span> Owner
    </div>
</nav>

<!-- Cart Modal -->
<div class="modal" id="cartModal">
    <div class="sheet">
        <span class="close-modal" onclick="closeModal('cartModal')">&times;</span>
        <h2>Your Cart</h2>
        <div id="cartItems"></div>
        <div style="margin-top:16px; font-weight:bold; font-size:18px; text-align:right;" id="cartTotal">Total: ₹0</div>
        <button class="btn btn-primary" onclick="checkout()">Pay via UPI 💳</button>
    </div>
</div>

<!-- Login Modal -->
<div class="modal" id="loginModal">
    <div class="sheet">
        <span class="close-modal" onclick="closeModal('loginModal')">&times;</span>
        <h2>Login / Register</h2>
        <input type="text" id="userName" placeholder="Your Name">
        <input type="tel" id="userPhone" placeholder="Phone Number">
        <textarea id="userAddr" rows="3" placeholder="Delivery Address"></textarea>
        <button class="btn btn-primary" onclick="saveLogin()">Save & Continue</button>
    </div>
</div>

<!-- Owner PIN Modal -->
<div class="modal" id="pinModal">
    <div class="sheet">
        <span class="close-modal" onclick="closeModal('pinModal')">&times;</span>
        <h2>Owner Access</h2>
        <input type="password" id="ownerPin" placeholder="Enter PIN">
        <button class="btn btn-primary" onclick="checkPin()">Unlock</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

// Config
const firebaseConfig = {
    apiKey: "AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",
    authDomain: "namaste-udala.firebaseapp.com",
    projectId: "namaste-udala",
    storageBucket: "namaste-udala.firebasestorage.app",
    messagingSenderId: "998684348165",
    appId: "1:998684348165:web:4bb0d2f5335a90a394716c",
    databaseURL: "https://namaste-udala-default-rtdb.firebaseio.com"
};
const UPI_ID = '9583937047@jio';
const OWNER_PIN = '4821';

// Data
const PRICES = { veg: {7:749, 15:1499, 30:2899}, nv: {7:949, 15:1849, 30:3599} };
const PRODUCTS = [
    {id:1, name:"Veg Thali", price:120, img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?w=200&q=80"},
    {id:2, name:"Chicken Pack", price:180, img:"https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=200&q=80"},
    {id:3, name:"Milk 500ml", price:30, img:"https://images.unsplash.com/photo-1550583724-b2692b85b150?w=200&q=80"},
    {id:4, name:"Atta 1kg", price:50, img:"https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=200&q=80"},
    {id:5, name:"Photo Service", price:5000, img:"https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=200&q=80"},
    {id:6, name:"Tuition Fee", price:800, img:"https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=200&q=80"}
];

// State
let state = {
    user: JSON.parse(localStorage.getItem('nu_user')) || null,
    cart: {},
    view: 'home',
    plan: { type: 'veg', days: 30 },
    orders: JSON.parse(localStorage.getItem('nu_orders')) || [],
    ownerMode: false,
    db: null
};

// Init Firebase
try {
    const app = initializeApp(firebaseConfig);
    state.db = getDatabase(app);
    onValue(ref(state.db, 'orders'), snap => {
        const val = snap.val();
        if(val) {
            state.orders = Object.values(val);
            localStorage.setItem('nu_orders', JSON.stringify(state.orders));
            if(state.view === 'owner') render();
        }
    });
} catch(e) { console.log('Offline mode'); }

// Helpers
const $ = s => document.querySelector(s);
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');

function saveState() {
    localStorage.setItem('nu_user', JSON.stringify(state.user));
    localStorage.setItem('nu_orders', JSON.stringify(state.orders));
    render();
}

// Render Engine
function render() {
    const view = $('#appView');
    let html = '';

    if(state.view === 'home') html = renderHome();
    else if(state.view === 'shop') html = renderShop();
    else if(state.view === 'profile') html = renderProfile();
    else if(state.view === 'owner') html = renderOwner();

    view.innerHTML = html;
    updateNav();
    updateCartBadge();
}

function updateNav() {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const idx = {home:0, shop:1, profile:2, owner:3}[state.view];
    document.querySelectorAll('.nav-item')[idx].classList.add('active');
}

function updateCartBadge() {
    const count = Object.values(state.cart).reduce((a,b)=>a+b, 0);
    const badge = $('#cartCount');
    badge.innerText = count;
    badge.style.display = count > 0 ? 'inline' : 'none';
}

// --- VIEWS ---

function renderHome() {
    const p = state.plan;
    const price = PRICES[p.type][p.days];
    return `
        <div class="card">
            <h2>🍱 Monthly Tiffin Plan</h2>
            <p>Ghar jaisa khana, roz time pe.</p>
            
            <div style="margin-top:16px;">
                <label style="font-size:12px;font-weight:bold;color:var(--muted);">Food Type</label>
                <div class="seg-control">
                    <div class="seg-btn ${p.type==='veg'?'active':''}" onclick="setPlan('type','veg')">🟢 Veg</div>
                    <div class="seg-btn ${p.type==='nv'?'active':''}" onclick="setPlan('type','nv')">🔴 Non-Veg</div>
                </div>
            </div>

            <div>
                <label style="font-size:12px;font-weight:bold;color:var(--muted);">Duration</label>
                <div class="seg-control">
                    <div class="seg-btn ${p.days===7?'active':''}" onclick="setPlan('days',7)">7 Days</div>
                    <div class="seg-btn ${p.days===15?'active':''}" onclick="setPlan('days',15)">15 Days</div>
                    <div class="seg-btn ${p.days===30?'active':''}" onclick="setPlan('days',30)">30 Days</div>
                </div>
            </div>

            <div style="text-align:center; margin:20px 0;">
                <div style="font-size:32px; font-weight:800; color:var(--primary);">${fmt(price)}</div>
                <div style="font-size:12px; color:var(--muted);">(~${fmt(Math.round(price/p.days))}/day)</div>
            </div>

            <button class="btn btn-primary" onclick="joinPlan()">Join Now & Pay 💳</button>
        </div>
    `;
}

function renderShop() {
    return `
        <h2>🛒 Shop & Services</h2>
        <div class="grid">
            ${PRODUCTS.map(p => `
                <div class="item-card">
                    <img src="${p.img}" class="item-img" alt="${p.name}">
                    <div class="item-info">
                        <div class="item-name">${p.name}</div>
                        <div class="item-price">${fmt(p.price)}</div>
                        <button class="add-btn" onclick="addToCart(${p.id})">Add +</button>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function renderProfile() {
    if(!state.user) {
        return `<div class="card" style="text-align:center;"><h2>Login Required</h2><button class="btn btn-primary" onclick="openModal('loginModal')">Login / Register</button></div>`;
    }
    const myOrders = state.orders.filter(o => o.userId === state.user.phone);
    return `
        <div class="card">
            <h2>👤 ${state.user.name}</h2>
            <p>${state.user.phone}</p>
            <p style="margin-top:8px;">${state.user.addr}</p>
            <button class="btn btn-secondary" style="margin-top:12px;" onclick="logout()">Logout</button>
        </div>
        <div class="card">
            <h3>My Orders</h3>
            ${myOrders.length ? myOrders.slice().reverse().map(o => `
                <div class="order-row">
                    <div>
                        <div style="font-weight:bold;">#${o.id.toString().slice(-4)}</div>
                        <div style="font-size:12px;color:var(--muted);">${new Date(o.ts).toLocaleDateString()}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:bold;">${fmt(o.total)}</div>
                        <div style="font-size:11px;color:${o.status==='delivered'?'green':'orange'};">${o.status.toUpperCase()}</div>
                    </div>
                </div>
            `).join('') : '<p>No orders yet.</p>'}
        </div>
    `;
}

function renderOwner() {
    if(!state.ownerMode) {
        return `<div class="card" style="text-align:center;"><h2>Owner Access</h2><button class="btn btn-primary" onclick="openModal('pinModal')">Enter PIN</button></div>`;
    }
    const totalSales = state.orders.reduce((a,o)=>a+o.total, 0);
    const pending = state.orders.filter(o=>o.status==='pending').length;
    
    return `
        <div class="card">
            <h2>📊 Dashboard</h2>
            <div style="display:flex;gap:10px;">
                <div class="stat-box" style="flex:1;"><div class="stat-val">${fmt(totalSales)}</div><div class="stat-lbl">Total Sales</div></div>
                <div class="stat-box" style="flex:1;"><div class="stat-val">${pending}</div><div class="stat-lbl">Pending</div></div>
            </div>
        </div>
        <div class="card">
            <h3>Live Orders</h3>
            ${state.orders.slice().reverse().map(o => `
                <div class="order-row">
                    <div>
                        <div style="font-weight:bold;">${o.userName}</div>
                        <div style="font-size:12px;color:var(--muted);">${fmt(o.total)} · ${new Date(o.ts).toLocaleTimeString()}</div>
                    </div>
                    <select class="status-select" onchange="updateStatus('${o.id}', this.value)">
                        <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                        <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
                    </select>
                </div>
            `).join('')}
        </div>
        <button class="btn btn-secondary" onclick="lockOwner()">Lock Dashboard</button>
    `;
}

// --- ACTIONS ---

window.switchTab = (tab) => { state.view = tab; render(); };
window.setPlan = (key, val) => { state.plan[key] = val; render(); };

window.joinPlan = () => {
    if(!state.user) { openModal('loginModal'); return; }
    const price = PRICES[state.plan.type][state.plan.days];
    const order = {
        id: Date.now(), ts: Date.now(), type: 'plan',
        details: {...state.plan}, total: price, status: 'pending',
        userId: state.user.phone, userName: state.user.name
    };
    state.orders.push(order);
    if(state.db) set(ref(state.db, 'orders/'+order.id), order);
    saveState();
    
    const upi = `upi://pay?pa=${UPI_ID}&pn=NamasteUdala&cu=INR&am=${price}&tn=Plan#${order.id}`;
    window.location.href = upi;
};

window.addToCart = (id) => {
    state.cart[id] = (state.cart[id]||0) + 1;
    render();
    alert('Added to cart!');
};

window.openCart = () => {
    if(!state.user) { openModal('loginModal'); return; }
    let html = '', total = 0;
    for(let [id, qty] of Object.entries(state.cart)) {
        const p = PRODUCTS.find(x=>x.id==id);
        if(p) {
            total += p.price * qty;
            html += `<div class="order-row"><span>${p.name} x${qty}</span><span>${fmt(p.price*qty)}</span></div>`;
        }
    }
    $('#cartItems').innerHTML = html || '<p>Cart empty</p>';
    $('#cartTotal').innerText = 'Total: ' + fmt(total);
    openModal('cartModal');
};

window.checkout = () => {
    const total = Object.entries(state.cart).reduce((a,[id,q])=>{
        const p=PRODUCTS.find(x=>x.id==id); return a+(p?p.price*q:0);
    },0);
    if(total===0) return;
    
    const order = {
        id: Date.now(), ts: Date.now(), type: 'shop',
        items: {...state.cart}, total: total, status: 'pending',
        userId: state.user.phone, userName: state.user.name
    };
    state.orders.push(order);
    if(state.db) set(ref(state.db, 'orders/'+order.id), order);
    state.cart = {};
    saveState();
    closeModal('cartModal');
    
    const upi = `upi://pay?pa=${UPI_ID}&pn=NamasteUdala&cu=INR&am=${total}&tn=Order#${order.id}`;
    window.location.href = upi;
};

window.saveLogin = () => {
    const name = $('#userName').value.trim();
    const phone = $('#userPhone').value.trim();
    const addr = $('#userAddr').value.trim();
    if(!name || !phone || !addr) return alert('Fill all fields');
    state.user = {name, phone, addr};
    saveState();
    closeModal('loginModal');
};

window.logout = () => { state.user = null; saveState(); };

window.checkPin = () => {
    if($('#ownerPin').value === OWNER_PIN) {
        state.ownerMode = true;
        closeModal('pinModal');
        render();
    } else alert('Wrong PIN');
};

window.lockOwner = () => { state.ownerMode = false; render(); };

window.updateStatus = (id, status) => {
    const o = state.orders.find(x=>x.id==id);
    if(o) {
        o.status = status;
        if(state.db) set(ref(state.db, 'orders/'+id), o);
        saveState();
    }
};

window.openModal = (id) => $('#'+id).classList.add('open');
window.closeModal = (id) => $('#'+id).classList.remove('open');

// Init
render();
</script>
</body>
</html>
