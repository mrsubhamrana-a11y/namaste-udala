  --line: #F3F4F6;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;

  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.08);
  --glass: rgba(255, 255, 255, 0.85);
}

[data-theme="dark"] {
  --bg: #0F0F0F;
  --text: #F9FAFB;
  --muted: #9CA3AF;
  --card: #1A1A1A;
  --line: #2D2D2D;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);

  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  --glass: rgba(26, 26, 26, 0.85);
}

* {

  font-family: 'Poppins', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg);
  color: var(--text);
  padding-bottom: 90px;
  font-weight: 500;

  transition: background 0.3s ease, color 0.3s ease;

/* --- Loading Screen --- */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.loading-screen.hide { opacity: 0; pointer-events: none; }
.loader {
  width: 60px;
  height: 60px;
  border: 4px solid var(--line);
  border-top: 4px solid var(--o);
  border-radius: 50%;
  animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* --- Animations --- */
@keyframes rise {
  from { opacity: 0; transform: translateY(30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes shimmer {
  0% { background-position: -1000px 0; }
  100% { background-position: 1000px 0; }
}

/* --- Premium Header with Video & 3D --- */
header {
  background: linear-gradient(135deg, var(--g) 0%, #0F2C21 100%);
  color: #fff;
  padding: 24px 20px 60px 20px;
  border-radius: 0 0 32px 32px;
  position: relative;
  overflow: hidden;
  z-index: 2;
  box-shadow: var(--shadow-lg);
}

header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(255,107,53,0.25), transparent 60%);
  pointer-events: none;
  z-index: 1;
}

header .logo {
  font-size: 11px;
  letter-spacing: 2.5px;
  font-weight: 700;
  color: #FCD34D;
  margin-bottom: 6px;

  z-index: 3;

header h1 {

header .tagline {

}

  width: 120px;
  height: 120px;
  z-index: 2;
  pointer-events: none;
}

.header-wave {

  left: 0;

  height: 40px;
  fill: var(--bg);
  z-index: 3;
}

/* --- Main Container --- */
#v {

.card-3d {

}
.card-3d .card-content {
  transform: translateZ(20px);
}
.card-3d::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.2), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 2;
}
.card-3d:hover::before { opacity: 1; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
  box-shadow: var(--shadow-md);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.card h3 {
  color: var(--g);

  font-weight: 700;

.btn::after {

.btn.g {

.btn.b {

  border: 1px solid #BFDBFE;
}
.btn.sm {

}

/* --- Inputs & Forms --- */
input, textarea, select {

}

.seg {

  padding: 4px;

/* --- Glassmorphism Navigation --- */
.nav {

  display: flex;

  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}
.nav div {

  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  flex: 1;
  cursor: pointer;
  transition: all 0.2s ease;
  padding: 6px 4px;
  border-radius: 12px;
}
.nav div.on {

  background: rgba(255, 107, 53, 0.08);
}
.nav img {

  height: 26px;
  border-radius: 8px;

  border: 2px solid transparent;
}
.nav div.on img {

}

/* --- Toast --- */
.toast {

  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1F2937;
  color: #fff;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  z-index: 1000;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 90%;
  text-align: center;
  backdrop-filter: blur(10px);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }
.toast.success { background: var(--success); }

/* --- Quantity Control --- */
.qty-ctrl {

.stat-card .label { font-size: 12px; opacity: 0.9; font-weight: 500; }

/* --- Product Item --- */
.item {

.mrp { text-decoration: line-through; color: var(--muted); font-size: 12px; margin-right: 6px; font-weight: 500; }

/* --- Chips --- */

  color: var(--text);

  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.chips button.on {
  background: var(--o);
  color: #fff;
  border-color: var(--o);
  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
}

/* --- FAB --- */
.fab {
  position: fixed;
  right: 16px;
  bottom: 96px;
  width: 56px;

  border-radius: 50%;
  background: linear-gradient(135deg, #25d366, #128c7e);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);

  transition: all 0.3s ease;
  text-decoration: none;
  animation: float 3s ease-in-out infinite;
}
.fab:hover { transform: scale(1.1); }

/* --- Responsive --- */
@media (max-width: 480px) {
  header h1 { font-size: 24px; }
  .card { padding: 18px; border-radius: 20px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr 1fr; }
}
</style>

const iso = d => { const date = new Date(d); return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0'); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cleanPhone = s => String(s || '').replace(/\D/g, '').slice(-10);
const debounce = (fn, delay) => { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); }; };

const showToast = (message, type = 'success', duration = 3000) => {
  const toast = $('#toast');
  toast.textContent = message;
  toast.className = `toast ${type} show`;
  setTimeout(() => toast.classList.remove('show'), duration);
};

const vibrate = () => { if (navigator.vibrate) navigator.vibrate(15); };

// THREE.JS 3D SETUP (Futuristic Tiffin Core)
// ============================================================
let scene, camera, renderer, mesh;
const init3D = () => {
  const container = $('#canvas-container');
  if (!container) return;
  
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.z = 3;
  
  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(120, 120);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);
  
  // Futuristic glowing torus knot (represents a stylized tiffin/food core)
  const geometry = new THREE.TorusKnotGeometry(0.8, 0.25, 64, 8);
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xFF6B35,
    metalness: 0.1,
    roughness: 0.2,
    transmission: 0.6, // Glass-like
    thickness: 1.0,
    emissive: 0xE85D04,
    emissiveIntensity: 0.2
  });
  mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);
  
  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xFCD34D, 1, 10);
  pointLight.position.set(2, 2, 2);
  scene.add(pointLight);
  
  const animate = () => {
    requestAnimationFrame(animate);
    if (mesh) {
      mesh.rotation.x += 0.01;
      mesh.rotation.y += 0.015;
    }
    renderer.render(scene, camera);
  };
  animate();
};

const basePrice = (type, days) => PRICING[type][days] || Math.round(PRICING[type][30] / 30 * days);
const calculatePrice = () => {
  const dd = clamp(+F.days || 30, 1, 365);
  let b = basePrice(F.type, dd);
  let x = 0;
  if (F.lunch === 'both') x += 10 * dd;
  if (F.dinner === 'both') x += 10 * dd;
  x += clamp(F.extraRoti || 0, 0, 4) * 5 * dd;
  return +F.half ? Math.round((b + x) * 0.6) : (b + x);
};
const getCredit = phone => (S.cred && S.cred[phone]) || 0;
const isEligible = days => (+days === 15 || +days === 30);
const isActive = (sub, date) => {
  const k = iso(date);
  const endDate = iso(addDays(new Date(sub.start + 'T12:00:00'), sub.days - 1));
  return k >= sub.start && k <= endDate;
};

const getMenu = (date, type) => {
  const w = date.getDay();
  if (type === 'nv') {
    if (w === 0) return '🍗 Chicken curry, roti, chawal';
    if (w === 5) return '🥚 Egg curry, roti, chawal';
  } else {
    if (w === 0) return '🧀 Paneer butter masala, roti, chawal';
    if (w === 5) return '🍮 Special veg thali + meetha';
  }
  return '🥘 Dal, sabzi, roti, chawal';
};

// ============================================================
// 3D TILT EFFECT LOGIC
// ============================================================
const attachTiltListeners = () => {
  document.querySelectorAll('.card-3d').forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -4;
      const rotateY = ((x - centerX) / centerX) * 4;
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
    });
  });
};

  dec: (v, k, id) => { vibrate(); C[id] = clamp((C[id] || 0) - 1, 0, 99); if (C[id] === 0) delete C[id]; render(); },
  cat: v => { SCAT = v; render(); },
  vo: () => { VO = VO ? 0 : 1; render(); },
  cust: () => { CUST = CUST ? 0 : 1; render(); },
  
  voice: () => {
    vibrate();
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'hi-IN'; // Supports Hindi and English
      recognition.start();
      
      const btn = $('#voiceBtn');
      if (btn) btn.classList.add('listening');
      showToast('🎤 Bol rahe hain... (e.g., "Doodh")');
      
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        SQ = transcript;
        const input = $('#sq');
        if (input) input.value = transcript;
        render();
        showToast(`🔍 Search: ${transcript}`);
      };
      
      recognition.onerror = () => {
        showToast('❌ Awaaz samajh nahi aayi', 'error');
        if (btn) btn.classList.remove('listening');
      };
      
      recognition.onend = () => {
        if (btn) btn.classList.remove('listening');
      };

      showToast('❌ Voice search is not supported in this browser', 'error');
    }

// EVENT LISTENERS
// ============================================================
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  vibrate(); // Haptic feedback on all button clicks
  const action = ACTIONS[btn.dataset.a];
  if (action) {
    try { action(btn.dataset.v, btn.dataset.k, btn.dataset.id); } 
    catch (err) { showToast('❌ Error: ' + err.message, 'error'); }
  }
});

const handleSearch = debounce(e => {
  if (e.target.id === 'sq') {
    SQ = e.target.value;
    // Re-render shop view to filter (simplified for performance)
    if (tab === 'shop') render();
  }
}, 400);

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) {
    F[field] = e.target.value;
    if (field === 'phone') F.phone = cleanPhone(F.phone);
  }
  handleSearch(e);
});

// Header tap for owner access
let tapCount = 0;
$('#mainHeader').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN:');
    if (pin === CONFIG.ownerPin) {
      OK = 1; sessionStorage.setItem('udok', '1'); tab = 'owner'; render(); showToast('🔓 Owner access granted!');
    } else if (pin !== null) {
      showToast('❌ Galat PIN!', 'error');
    }
  }
});

// ============================================================
// INIT
// ============================================================
const initTheme = () => {
  const saved = localStorage.getItem('ud_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('#themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
};

$('#themeToggle').addEventListener('click', () => {
  vibrate();
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ud_theme', next);
  $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  showToast(next === 'dark' ? '🌙 Dark mode ON' : '☀️ Light mode ON');
});

initTheme();
init3D(); // Start 3D animation
render();

console.log('🍱 Namaste Udala 3.0 Futuristic Edition loaded!');
</script>
</body>
