<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1B4332">
<title>🍱 Namaste Udala - Business Logic Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --o: #FF6B35; --g: #1B4332; --bg: #FAFAFA; --text: #1A1A1A; --muted: #6B7280; --card: #FFFFFF; --line: #F3F4F6; --success: #10B981; --danger: #EF4444; --warning: #F59E0B; }
* { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); padding-bottom: 90px; min-height: 100vh; }
header { background: linear-gradient(135deg, var(--g) 0%, #0F2C21 100%); color: #fff; padding: 24px 20px 40px; border-radius: 0 0 32px 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
header .logo { font-size: 11px; letter-spacing: 3px; font-weight: 800; color: #FCD34D; text-transform: uppercase; }
header h1 { font-size: 24px; font-weight: 900; margin-top: 6px; }
header .tagline { font-size: 13px; opacity: 0.9; margin-top: 4px; }
#v { padding: 0 16px; margin-top: -20px; position: relative; z-index: 1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); animation: rise 0.4s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.card h3 { color: var(--g); font-size: 17px; font-weight: 800; margin-bottom: 14px; }
.s { font-size: 13px; color: var(--muted); line-height: 1.5; }
.btn { padding: 14px; border-radius: 14px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 10px; background: var(--o); color: #fff; transition: transform 0.1s; }
.btn:active { transform: scale(0.97); }
.btn.g { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
.btn.r { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
.btn.b { background: #3B82F6; color: #fff; }
.btn.sm { padding: 8px 14px; font-size: 12px; width: auto; margin: 0; border-radius: 10px; }
input, select, textarea { width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; margin: 6px 0 12px; font-size: 15px; background: var(--bg); color: var(--text); font-family: inherit; }
input:focus, textarea:focus { outline: none; border-color: var(--o); }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 15px; z-index: 100; }
.nav div { text-align: center; font-size: 10px; font-weight: 700; color: var(--muted); flex: 1; cursor: pointer; }
.nav div.on { color: var(--o); }
.nav div span { font-size: 22px; display: block; margin-bottom: 2px; }
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge.pending { background: #FEF3C7; color: #92400E; }
.badge.active { background: #D1FAE5; color: #065F46; }
.badge.trial { background: #DBEAFE; color: #1E40AF; }
.badge.expired { background: #F3F4F6; color: #4B5563; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1F2937; color: #fff; padding: 12px 24px; border-radius: 50px; font-weight: 700; font-size: 14px; z-index: 1000; opacity: 0; transition: all 0.3s; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }
.progress-bar { width: 100%; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 10px 0; }
.progress-fill { height: 100%; background: var(--success); transition: width 0.5s ease; }
.fab { position: fixed; right: 16px; bottom: 90px; width: 50px; height: 50px; border-radius: 50%; background: #25d366; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; text-decoration: none; box-shadow: 0 4px 15px rgba(37,211,102,0.4); }
</style>
</head>
<body>

<header id="mainHeader">
  <div class="logo">NAMASTE UDALA</div>
  <h1 id="ht">Aaj ka Plan</h1>
  <div class="tagline">Ghar jaisa khana · Roz time pe</div>
</header>

<div id="v"></div>
<a class="fab" href="https://wa.me/919583937047" target="_blank">💬</a>
<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>

<script type="module">
const CONFIG = { whatsapp: '919583937047', ownerPin: '4821' };
const PRICING = { veg: { 7: 749, 15: 1499, 30: 2899 }, nv: { 7: 949, 15: 1849, 30: 3599 } };

let S = { prod: [], subs: [], orders: [], expenses: [] };
try { const saved = localStorage.getItem('udala_logic'); if (saved) S = { ...S, ...JSON.parse(saved) }; } catch (e) {}

let tab = 'plan', C = {}, OK = 0;
try { OK = sessionStorage.getItem('udok') ? 1 : 0; } catch (e) {}
const F = { type: 'veg', days: '30', name: '', phone: '', area: '', utr: '' };

if (!S.prod || S.prod.length === 0) {
  S.prod = [
    { id: 1, n: 'Doodh 500 ml', p: 30, c: 'Dairy', nv: 0 },
    { id: 2, n: 'Paneer 200 g', p: 80, c: 'Dairy', nv: 0 },
    { id: 3, n: 'Chicken piece', p: 40, c: 'Non-Veg', nv: 1 },
    { id: 4, n: 'Atta 1 kg', p: 50, c: 'Kirana', nv: 0 }
  ];
}

const save = () => { localStorage.setItem('udala_logic', JSON.stringify(S)); render(); };
const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const todayStr = () => iso(new Date());
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const cleanPhone = s => String(s || '').replace(/\D/g, '').slice(-10);
const showToast = (msg, type = 'success') => { const t = $('#toast'); t.textContent = msg; t.className = `toast ${type} show`; setTimeout(() => t.classList.remove('show'), 3000); };

// --- CORE LOGIC HELPERS ---
const getSubStatus = (sub) => {
  if (!sub) return 'expired';
  const start = new Date(sub.start + 'T12:00:00');
  const end = new Date(start); end.setDate(end.getDate() + sub.days);
  const today = new Date(); today.setHours(12,0,0,0);
  
  if (sub.status === 'pending') return 'pending';
  if (today >= end) return 'expired';
  if (sub.status === 'trial') return 'trial';
  if (sub.status === 'paused') return 'paused';
  return 'active';
};

const VIEWS = {
  plan: () => {
    const price = PRICING[F.type][F.days] || 2899;
    let h = `<div class="card" style="background:linear-gradient(135deg, var(--g), #0F2C21); color:#fff; border:none;">
      <h3 style="color:#fff">🍱 Namaste Udala</h3>
      <p style="font-size:20px;font-weight:900;line-height:1.3">Ghar jaisa khana,<br>Roz time pe 🍱</p>
    </div>`;

    // Customer Tracking Section
    if (F.phone && F.phone.length === 10) {
      const mySubs = (S.subs || []).filter(s => s.phone === cleanPhone(F.phone)).sort((a,b) => b.id - a.id);
      if (mySubs.length > 0) {
        const latest = mySubs[0];
        const status = getSubStatus(latest);
        const start = new Date(latest.start + 'T12:00:00');
        const end = new Date(start); end.setDate(end.getDate() + latest.days);
        const today = new Date(); today.setHours(12,0,0,0);
        const totalDays = latest.days;
        const daysPassed = Math.floor((today - start) / 86400000);
        const daysLeft = Math.max(0, totalDays - daysPassed);
        const progress = Math.min(100, (daysPassed / totalDays) * 100);

        let statusBadge = '';
        if (status === 'pending') statusBadge = `<span class="badge pending">⏳ Payment Pending</span>`;
        else if (status === 'trial') statusBadge = `<span class="badge trial"> Free Trial</span>`;
        else if (status === 'active') statusBadge = `<span class="badge active">✅ Active</span>`;
        else statusBadge = `<span class="badge expired">❌ Expired</span>`;

        h += `<div class="card" style="border-left: 4px solid ${status === 'active' ? 'var(--success)' : status === 'pending' ? 'var(--warning)' : 'var(--danger)'}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0"> Mera Plan Tracker</h3>
            ${statusBadge}
          </div>
          <div class="s"><b>${latest.type === 'veg' ? ' Veg' : '🔴 Non-Veg'} Plan</b> · ${latest.days} Din</div>
          <div class="s" style="margin-top:8px">📅 Start: ${latest.start} | End: ${iso(end)}</div>
          <div class="s">⏳ Bache hue din: <b style="color:var(--o)">${daysLeft} din</b></div>
          <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
          ${status === 'pending' ? `<div class="s" style="color:var(--warning);font-weight:700;margin-top:10px">⚠️ Aapka plan abhi active nahi hai. Owner payment verify karega. UTR: ${latest.utr || 'N/A'}</div>` : ''}
          ${status === 'trial' ? `<div class="s" style="color:var(--info);font-weight:700;margin-top:10px">🎁 Ye 1 din ka free trial hai. Kal expire ho jayega!</div>` : ''}
        </div>`;
      }
    }

    // Plan Form
    h += `<div class="card">
      <h3>️ Naya Plan Chunein</h3>
      <div class="s">Khana type:</div>
      <div style="display:flex;gap:8px;margin:8px 0">
        <button class="btn sm ${F.type==='veg'?'g':''}" data-a="set" data-k="type" data-v="veg">🟢 Veg</button>
        <button class="btn sm ${F.type==='nv'?'r':''}" data-a="set" data-k="type" data-v="nv">🔴 Non-veg</button>
      </div>
      <div class="s">Kitne din:</div>
      <div style="display:flex;gap:8px;margin:8px 0">
        <button class="btn sm ${F.days==7?'g':''}" data-a="set" data-k="days" data-v="7">7 din</button>
        <button class="btn sm ${F.days==15?'g':''}" data-a="set" data-k="days" data-v="15">15 din</button>
        <button class="btn sm ${F.days==30?'g':''}" data-a="set" data-k="days" data-v="30">30 din</button>
      </div>
      <input data-f="name" placeholder="Aapka Naam" value="${esc(F.name)}">
      <input data-f="phone" type="tel" maxlength="10" placeholder="10 digit Mobile" value="${esc(F.phone)}">
      <input data-f="area" placeholder="Area / Locality" value="${esc(F.area)}">
      
      <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin:16px 0">
        <span>Total</span><span style="color:var(--o)">${inr(price)}</span>
      </div>
      
      <button class="btn" data-a="joinPaid">💳 Pay & Join Plan</button>
      <button class="btn g" data-a="joinTrial">🎁 Start 1 Din Free Trial</button>
    </div>`;
    return h;
  },

  shop: () => {
    let total = 0, count = 0;
    Object.entries(C).forEach(([k, q]) => { const p = S.prod.find(x => x.id == k); if (p && q > 0) { total += p.p * q; count += q; } });
    let h = `<div class="card" style="background:linear-gradient(135deg,#F59E0B,#E85D04);color:#fff;border:none"><h3 style="color:#fff">🛒 Ghar ka Saaman</h3></div>
      <div class="card">`;
    (S.prod || []).forEach(p => {
      const q = C[p.id] || 0;
      h += `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div style="flex:1"><b>${esc(p.n)}</b><div class="s">${esc(p.c)} ${p.nv ? '· 🔴' : ''}</div><div style="color:var(--o);font-weight:800">${inr(p.p)}</div></div>
        ${q > 0 ? `<div style="display:flex;align-items:center;gap:8px;border:2px solid var(--o);border-radius:10px;padding:4px"><button data-a="dec" data-id="${p.id}" style="width:28px;height:28px;border:0;border-radius:8px;background:var(--o);color:#fff;font-size:16px">−</button><b>${q}</b><button data-a="inc" data-id="${p.id}" style="width:28px;height:28px;border:0;border-radius:8px;background:var(--o);color:#fff;font-size:16px">+</button></div>` : `<button class="btn sm" data-a="inc" data-id="${p.id}">ADD</button>`}
      </div>`;
    });
    h += `</div>`;
    if (count > 0) {
      h += `<div style="position:fixed;bottom:80px;left:16px;right:16px;background:var(--card);border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,0.1);z-index:99">
        <div><div style="font-size:13px;font-weight:700"> ${count} items</div><div style="font-size:20px;font-weight:900;color:var(--o)">${inr(total)}</div></div>
        <button class="btn g" data-a="order" style="margin:0;width:auto">Checkout</button>
      </div>`;
    }
    return h;
  },

  kitchen: () => {
    if (!OK) return `<div class="card"><h3>🔒 Locked</h3><p class="s">Header par 5 baar tap karo (PIN: 4821)</p></div>`;
    const tStr = todayStr(); let veg = 0, nv = 0;
    // Sirf Active aur Trial ko hi count karo
    (S.subs || []).forEach(sub => {
      const status = getSubStatus(sub);
      if ((status === 'active' || status === 'trial') && sub.start <= tStr) {
        if (sub.type === 'veg') veg++; else nv++;
      }
    });
    return `<div class="card"><h3>👨‍ Aaj ki Kitchen List</h3><div class="s" style="margin-bottom:16px">📅 Date: ${tStr}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div style="background:var(--g);color:#fff;border-radius:16px;padding:16px;text-align:center"><div style="font-size:28px;font-weight:900">${veg}</div><div style="font-size:11px;opacity:0.9">Veg Thali</div></div>
        <div style="background:var(--o);color:#fff;border-radius:16px;padding:16px;text-align:center"><div style="font-size:28px;font-weight:900">${nv}</div><div style="font-size:11px;opacity:0.9">Non-Veg Thali</div></div>
      </div></div>`;
  },

  owner: () => {
    if (!OK) return `<div class="card"><h3>🔒 Owner Access</h3><p class="s">Header par 5 baar tap karo (PIN: 4821)</p></div>`;
    
    const pendingPayments = (S.subs || []).filter(s => s.status === 'pending');
    const activeSubs = (S.subs || []).filter(s => getSubStatus(s) === 'active' || getSubStatus(s) === 'trial').length;
    const revenue = (S.subs || []).filter(s => s.status === 'active').reduce((sum, s) => sum + (s.price || 0), 0);

    let h = `<div class="card"><h3>📊 Owner Dashboard</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div style="background:var(--g);color:#fff;border-radius:16px;padding:16px;text-align:center"><div style="font-size:22px;font-weight:900">${activeSubs}</div><div style="font-size:11px;opacity:0.9">Active Plans</div></div>
        <div style="background:var(--o);color:#fff;border-radius:16px;padding:16px;text-align:center"><div style="font-size:22px;font-weight:900">${inr(revenue)}</div><div style="font-size:11px;opacity:0.9">Revenue</div></div>
      </div></div>`;

    if (pendingPayments.length > 0) {
      h += `<div class="card" style="border:2px solid var(--warning)"><h3>⏳ Payment Verify Karein (${pendingPayments.length})</h3>`;
      pendingPayments.forEach(sub => {
        h += `<div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between"><b>${esc(sub.name)}</b><span class="badge pending">Pending</span></div>
          <div class="s">📱 ${sub.phone} | 🍽️ ${sub.type} ${sub.days} din</div>
          <div class="s" style="font-weight:800;color:var(--o)">💰 Amount: ${inr(sub.price)} | UTR: ${sub.utr || 'Nahi diya'}</div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn g" data-a="verifyPayment" data-id="${sub.id}" style="flex:1">✅ Verify & Active Karo</button>
            <button class="btn r" data-a="rejectPayment" data-id="${sub.id}" style="flex:1">❌ Reject</button>
          </div>
        </div>`;
      });
      h += `</div>`;
    } else {
      h += `<div class="card"><h3>✅ Sab Clear Hai</h3><p class="s">Koi payment pending nahi hai.</p></div>`;
    }

    h += `<div class="card"><h3>📋 Sabhi Subscriptions</h3>`;
    (S.subs || []).slice().reverse().forEach(sub => {
      const status = getSubStatus(sub);
      h += `<div style="padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center">
        <div><b>${esc(sub.name)}</b><div class="s">${sub.phone} · ${inr(sub.price)}</div></div>
        <span class="badge ${status}">${status}</span>
      </div>`;
    });
    h += `</div><button class="btn r" data-a="out">🚪 Logout Owner</button>`;
    return h;
  }
};

const render = () => {
  if (!OK && !['plan', 'shop'].includes(tab)) tab = 'plan';
  $('#v').innerHTML = VIEWS[tab]();
  $('#ht').textContent = { plan: 'Aaj ka Plan', shop: 'Shop', kitchen: 'Kitchen', owner: 'Owner Panel' }[tab];
  $('#nav').innerHTML = [['plan','','Plan'],['shop','🛒','Shop'],['kitchen','👨‍🍳','Kitchen'],['owner','👤','Owner']].filter(x => OK || x[0] === 'plan' || x[0] === 'shop').map(x => `<div class="${x[0] === tab ? 'on' : ''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
};

const ACTIONS = {
  tab: v => {
    if (['kitchen', 'owner'].includes(v) && !OK) {
      const pin = prompt('Owner PIN:');
      if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); showToast('🔓 Admin Access Granted'); }
      else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); return; }
    }
    tab = v; render();
  },
  set: (v, k) => { F[k] = v; render(); },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); if (C[id] === 0) delete C[id]; render(); },

  joinTrial: () => {
    const name = (F.name || '').trim(), phone = cleanPhone(F.phone);
    if (name.length < 2 || phone.length !== 10) { showToast('❌ Naam aur 10 digit phone daalo', 'error'); return; }
    
    // Check if already has active trial
    const existing = (S.subs || []).find(s => s.phone === phone && getSubStatus(s) !== 'expired');
    if (existing) { showToast('❌ Aapka pehle se ek active plan/trial hai', 'error'); return; }

    S.subs.push({ 
      id: Date.now(), name, phone, area: (F.area || '').trim() || 'Udala', 
      type: F.type, days: 1, start: todayStr(), price: 0, 
      status: 'trial', utr: 'FREE_TRIAL' 
    });
    save(); showToast('🎁 1 Din Free Trial Active Ho Gaya!');
    F.name = ''; F.phone = ''; F.area = '';
  },

  joinPaid: () => {
    const name = (F.name || '').trim(), phone = cleanPhone(F.phone);
    if (name.length < 2 || phone.length !== 10) { showToast('❌ Naam aur 10 digit phone daalo', 'error'); return; }
    
    const utr = prompt('Payment kar diya? Apna UTR / Transaction ID yahan likhein:');
    if (!utr || utr.length < 5) { showToast('❌ Bina UTR ke plan nahi banega', 'error'); return; }

    const price = PRICING[F.type][F.days] || 2899;
    S.subs.push({ 
      id: Date.now(), name, phone, area: (F.area || '').trim() || 'Udala', 
      type: F.type, days: +F.days, start: todayStr(), price: price, 
      status: 'pending', utr: utr 
    });
    save(); showToast('⏳ Plan ban gaya! Owner payment verify karega.');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text= *Naya Plan (Payment Pending)*%0A👤 ${name}%0A📱 ${phone}%0A🍽️ ${F.type} · ${F.days} din%0A💰 ₹${price}%0A UTR: ${utr}`, '_blank');
    F.name = ''; F.phone = ''; F.area = ''; F.utr = '';
  },

  verifyPayment: (v, k, id) => {
    const sub = (S.subs || []).find(s => s.id == id);
    if (sub) { sub.status = 'active'; save(); showToast('✅ Payment Verified! Plan Active ho gaya.'); }
  },

  rejectPayment: (v, k, id) => {
    const sub = (S.subs || []).find(s => s.id == id);
    if (sub) { sub.status = 'rejected'; save(); showToast('❌ Payment Reject kar diya.'); }
  },

  order: () => {
    const name = (F.name || '').trim(), phone = cleanPhone(F.phone);
    if (name.length < 2 || phone.length !== 10) { showToast('❌ Naam aur phone daalo', 'error'); return; }
    const items = []; let total = 0;
    Object.entries(C).forEach(([k, q]) => { const p = S.prod.find(x => x.id == k); if (p && q > 0) { items.push({ n: p.n, q, p: p.p }); total += p.p * q; } });
    if (!items.length) { showToast('❌ Cart khali hai', 'error'); return; }
    S.orders.push({ id: Date.now(), name, phone, area: (F.area || '').trim() || 'Udala', items, total, status: 'pending', date: todayStr() });
    C = {}; save(); showToast('✅ Order ho gaya!');
  },

  out: () => { OK = 0; sessionStorage.removeItem('udok'); tab = 'plan'; render(); showToast('🚪 Logged out'); }
};

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]'); if (!btn) return;
  const action = ACTIONS[btn.dataset.a];
  if (action) { try { action(btn.dataset.v, btn.dataset.k, btn.dataset.id); } catch (err) { console.error(err); showToast('❌ Error', 'error'); } }
});

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) { F[field] = e.target.value; if (field === 'phone') F.phone = cleanPhone(F.phone); }
});

let tapCount = 0;
$('#mainHeader').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN:');
    if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); tab = 'owner'; render(); showToast('🔓 Admin Access Granted'); }
    else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); }
  }
});

render();
console.log('🍱 Namaste Udala Logic Fixed!');
</script>
