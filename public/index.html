}
[data-theme=dark] {

function render() {
  const V = { plan: vPlan, shop: vShop, services: vServices, profile: vProfile, kitchen: vKitchen, route: vRoute, owner: vOwner };
  $('#v').innerHTML = (V[tab] || vPlan)();
  $('#sheet').innerHTML = sheet();

  const n = cc(), tot = ct();
  $('#cbar').innerHTML = (n > 0 && !CART_OPEN && !PAY_BOX) ? `
    <div class="cbar-fixed" data-a="open_cart">
      <span>${n} Item · ${inr(tot)}</span>
      <span>View Cart & Order →</span>
    </div>` : '';

  const TABS = [
    ['plan', IC.tiffin, 'Plans'],
    ['shop', IC.shop, 'Shop'],
    ['services', IC.svc, 'Services'],
    ['profile', IC.user, 'Profile']
  ];
  if (ROLE === 'staff' || ROLE === 'owner') {
    TABS.push(['kitchen', IC.kitchen, 'Kitchen'], ['route', IC.route, 'Route']);
  }
  if (ROLE === 'owner') TABS.push(['owner', IC.owner, 'Owner']);

  $('#nav').innerHTML = TABS.map(x => `<button class="${tab === x[0] ? 'on' : ''}" data-a="tab" data-v="${x[0]}">${x[1]}<span class="nl">${x[2]}</span>${x[0] === 'shop' && n ? `<span class="nb">${n}</span>` : ''}</button>`).join('');
}

function checkUser() {
  if (!F.name.trim() || ph(F.phone).length !== 10 || !F.addr.trim()) {
    toast('Naam, 10-digit Mobile Number aur Address bharein');
    return false;
  }
  syncCustomerProfile();
  return true;
}

const A = {
  tab: v => { tab = v; PQ = null; CART_OPEN = false; PAY_BOX = null; render(); scrollTo({ top: 0, behavior: 'smooth' }); },
  otab: v => { O_TAB = v; ED_P = null; ED_SV = null; ED_CUST = null; render(); },
  pmode: v => { PAY_MODE = v; render(); },
  fset: (v, k) => { F[k] = (k === 'days' || k === 'times') ? +v : v; render(); },
  set_area: v => { F.area = v; syncCustomerProfile(); render(); },
  cat: v => { SCAT = v; render(); },
  pq: (v, k, id) => { PQ = +id; render(); },
  open_cart: () => { PQ = null; CART_OPEN = true; render(); },
  add_open_cart: (v, k, id) => { if (!C[id] && !C[id + 'h']) C[id] = 1; localStorage.setItem('nu5c', JSON.stringify(C)); PQ = null; CART_OPEN = true; render(); },
  close: () => { PQ = null; CART_OPEN = false; PAY_BOX = null; PROOF_IMG = null; render(); },
  close_bg: (v, k, id, e) => { if (e && e.target.classList.contains('ov')) { PQ = null; CART_OPEN = false; PAY_BOX = null; PROOF_IMG = null; render(); } },
  inc: (v, k, id) => { C[id] = (C[id] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dec: (v, k, id) => { C[id] = Math.max(0, (C[id] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  ih: (v, k, id) => { C[id + 'h'] = (C[id + 'h'] || 0) + 1; localStorage.setItem('nu5c', JSON.stringify(C)); render(); },
  dh: (v, k, id) => { C[id + 'h'] = Math.max(0, (C[id + 'h'] || 0) - 1); localStorage.setItem('nu5c', JSON.stringify(C)); render(); },

  save_prof: () => {
    if (!checkUser()) return;
    save(); toast('Aapka Complete Profile Save Ho Gaya ✓');
  },

  reorder: (v, k, id) => {
    const o = S.orders.find(x => x.id === id); if (!o) return;
    o.items.forEach(i => {
      const p = S.prod.find(x => i.n.startsWith(x.n));
      if (p && p.s) C[p.id] = (C[p.id] || 0) + i.q;
    });
    localStorage.setItem('nu5c', JSON.stringify(C));
    CART_OPEN = true; render(); toast('Items Cart MeinJud Gaye!');
  },

  cust_skip: (v, k, id) => {
    const s = S.subs.find(x => x.id === id); if (!s) return;
    s.skip = s.skip || [];
    const td = iso(D0());
    if (!s.skip.includes(td)) { s.skip.push(td); s.days = (+s.days || 30) + 1; save(); toast('Aaj ka Tiffin Paused & +1 Extra Day Added!'); }
  },

  getgps: () => {
    if (!navigator.geolocation) { F.lat = 21.5742; F.lng = 86.5681; syncCustomerProfile(); save(); toast('GPS Saved'); return; }
    toast('Detecting GPS...');
    navigator.geolocation.getCurrentPosition(pos => {
      F.lat = pos.coords.latitude; F.lng = pos.coords.longitude;
      syncCustomerProfile(); save(); toast('Exact Doorstep GPS Saved!');
    }, () => {
      F.lat = 21.5742; F.lng = 86.5681; syncCustomerProfile(); save(); toast('Udala GPS Pin Saved');
    }, { enableHighAccuracy: true, timeout: 6000 });
  },

  pay_sub: () => {
    if (!checkUser()) return;
    const base = tierPrice(+F.days);
    const paise = +(Math.floor(11 + Math.random() * 78) / 100).toFixed(2);
    PAY_MODE = 'upi'; PROOF_IMG = null;
    PAY_BOX = { kind: 'sub', amt: base, exactAmt: +(base + paise).toFixed(2), days: +F.days, title: `${F.days} Din Tiffin (${F.times} Time)` };
    render();
  },
  pay_trial: () => {
    if (!checkUser()) return;
    const base = +S.cfg.trialPrice || 49;
    const paise = +(Math.floor(11 + Math.random() * 78) / 100).toFixed(2);
    PAY_MODE = 'upi'; PROOF_IMG = null;
    PAY_BOX = { kind: 'sub', amt: base, exactAmt: +(base + paise).toFixed(2), days: 1, title: `1 Din Trial Tiffin (${F.times} Time)` };
    render();
  },
  pay_ord: () => {
    if (!checkUser()) return;
    CART_OPEN = false;
    const base = ct();
    const paise = +(Math.floor(11 + Math.random() * 78) / 100).toFixed(2);
    PAY_MODE = 'upi'; PROOF_IMG = null;
    PAY_BOX = { kind: 'ord', amt: base, exactAmt: +(base + paise).toFixed(2), title: `Shop Order (${cc()} Items)` };
    render();
  },

  copy_upi: () => { navigator.clipboard.writeText(S.cfg.upi || '9583937047@jio').catch(() => {}); toast('UPI ID Copied!'); },
  copy_amt: () => { if (PAY_BOX) { navigator.clipboard.writeText(String(PAY_BOX.exactAmt)).catch(() => {}); toast('Exact Amount Copied: ₹' + PAY_BOX.exactAmt); } },

  confirm_paid: () => {
    if (!PAY_BOX) return;
    const rawRef = ($('#utr_inp') ? $('#utr_inp').value.trim() : '');
    if (PAY_MODE === 'upi' && rawRef.length < 4) { toast('UPI Ref ke last 4 digits daalein (ya Screenshot/Pay at Door chunein)'); return; }
    if (PAY_MODE === 'proof' && !PROOF_IMG && rawRef.length < 4) { toast('Payment Screenshot select karein'); return; }

    const isPaid = PAY_MODE === 'cod' ? 0 : 1;
    const modeLabel = PAY_MODE === 'upi' ? 'UPI Verified' : PAY_MODE === 'proof' ? 'Screenshot Proof' : 'Pay on Delivery';
    const refNo = rawRef || (PAY_MODE === 'cod' ? 'Doorstep Due' : 'Screenshot');
    const finalPrice = PAY_MODE === 'upi' ? PAY_BOX.exactAmt : PAY_BOX.amt;

    syncCustomerProfile();

    if (PAY_BOX.kind === 'sub') {
      const id = uid('s');
      S.subs.push({
        id, ts: Date.now(), name: F.name.trim(), phone: ph(F.phone), area: F.area, addr: F.addr.trim(),
        lat: F.lat, lng: F.lng, type: F.type, days: PAY_BOX.days, times: F.times, lunch: F.lunch, dinner: F.dinner,
        start: iso(D0()), price: finalPrice, paid: isPaid, pMode: modeLabel, utr: refNo, proof: PROOF_IMG || '', skip: []
      });
      MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
      PAY_BOX = null; PROOF_IMG = null; save(); toast('Tiffin Plan Book Ho Gaya!');
    } else {
      const items = [];
      Object.entries(C).forEach(([k, q]) => {
        const p = S.prod.find(x => x.id === parseInt(k)); if (!p || q < 1) return;
        const isH = k.endsWith('h'), pr = isH ? Math.round(p.p * 0.6) : p.p;
        items.push({ n: p.n + (isH ? ' (Half)' : ''), q, p: pr });
      });
      const id = uid('o');
      S.orders.push({
        id, ts: Date.now(), date: iso(D0()), name: F.name.trim(), phone: ph(F.phone), area: F.area, addr: F.addr.trim(),
        lat: F.lat, lng: F.lng, items, total: finalPrice, paid: isPaid, dlv: 0, pMode: modeLabel, utr: refNo, proof: PROOF_IMG || ''
      });
      MY.push(id); localStorage.setItem('nu5my', JSON.stringify(MY));
      C = {}; localStorage.setItem('nu5c', '{}');
      PAY_BOX = null; PROOF_IMG = null; save(); toast('Order Confirm Ho Gaya!');
    }
  },

  view_proof: (v, k, id) => {
    const item = (k === 'sub' ? S.subs : S.orders).find(x => x.id === id);
    if (!item || !item.proof) { toast('No screenshot attached'); return; }
    const w = window.open(''); if (w) w.document.write(`<title>Payment Proof</title><img src="${item.proof}" style="max-width:100%;border-radius:12px">`);
  },

  // OWNER FULL CONTROL ACTIONS
  o_paid: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.paid = o.paid ? 0 : 1; save(); toast('Payment Status Updated'); } },
  odlv: (v, k, id) => { const o = S.orders.find(x => x.id === id); if (o) { o.dlv = o.dlv ? 0 : 1; if (o.dlv) o.paid = 1; save(); toast('Delivery Status Updated'); } },
  o_del: (v, k, id) => { if (!confirm('Delete this order?')) return; S.orders = S.orders.filter(x => x.id !== id); save(); toast('Order Deleted'); },

  s_paid: (v, k, id) => { const s = S.subs.find(x => x.id === id); if (s) { s.paid = s.paid ? 0 : 1; save(); toast('Plan Payment Updated'); } },
  s_add_day: (v, k, id) => { const s = S.subs.find(x => x.id === id); if (s) { s.days = (+s.days || 30) + 1; save(); toast('+1 Day Added to Plan'); } },
  s_del: (v, k, id) => { if (!confirm('Delete this tiffin subscription?')) return; S.subs = S.subs.filter(x => x.id !== id); save(); toast('Subscription Deleted'); },
  sdone: (v, k, id) => { const key = iso(D0()) + '_' + id; S.done[key] = S.done[key] ? 0 : 1; save(); toast('Tiffin Status Updated ✓'); },

  // OWNER CUSTOMER CRM EDIT / DELETE
  edit_cust: (v, k, id) => {
    ED_CUST = id;
    const c = S.profiles[id] || {};
    render();
    setTimeout(() => {
      $('#ec_name').value = c.name || '';
      $('#ec_phone').value = c.phone || id;
      $('#ec_alt').value = c.altPhone || '';
      $('#ec_area').value = c.area || 'Udala Bus Stand';
      $('#ec_addr').value = c.addr || '';
      $('#ec_diet').value = c.diet || 'veg';
      $('#ec_spice').value = c.spice || 'Medium';
      $('#ec_dues').value = c.dues || 0;
      $('#ec_notes').value = c.notes || '';
      $('#cust_form').scrollIntoView({ behavior: 'smooth' });
    }, 50);
  },
  cancel_edcust: () => { ED_CUST = null; render(); },
  save_cust: () => {
    const p = ph($('#ec_phone').value), n = $('#ec_name').value.trim();
    if (p.length !== 10 || !n) { toast('Enter Valid Name & 10-Digit Mobile'); return; }
    S.profiles[p] = {
      ...(S.profiles[p] || { joined: iso(D0()) }),
      phone: p,
      name: n,
      altPhone: ph($('#ec_alt').value),
      area: $('#ec_area').value,
      addr: $('#ec_addr').value.trim(),
      diet: $('#ec_diet').value,
      spice: $('#ec_spice').value,
      dues: +$('#ec_dues').value || 0,
      notes: $('#ec_notes').value.trim()
    };
    ED_CUST = null; save(); toast('Customer Profile Saved ✓');
  },
  del_cust: (v, k, id) => {
    if (!confirm('Delete customer profile?')) return;
    delete S.profiles[id]; save(); toast('Customer Profile Deleted');
  },

  save_rates: () => {
    S.cfg.pl.veg = { 7: +$('#vp_7').value || 749, 15: +$('#vp_15').value || 1499, 30: +$('#vp_30').value || 2899 };
    S.cfg.pl.nv = { 7: +$('#nvp_7').value || 949, 15: +$('#nvp_15').value || 1849, 30: +$('#nvp_30').value || 3599 };
    S.cfg.trialPrice = +$('#cfg_trial').value || 49;
    S.cfg.bfAddon = +$('#cfg_bf').value || 20;
    S.cfg.freeMin = +$('#cfg_fmin').value || 300;
    S.cfg.dlvFee = +$('#cfg_dfee').value || 25;
    save(); toast('All Plan Rates & Fees Saved!');
  },
  savem: () => { S.mset[iso(D0())] = { bf: $('#m_bf').value.trim(), veg: $('#m_veg').value.trim(), nv: $('#m_nv').value.trim() }; save(); toast('Menu Saved'); },

  stk: (v, k, id) => { const p = S.prod.find(x => x.id === +id); if (p) { p.s = p.s ? 0 : 1; save(); } },
  edit_prod: (v, k, id) => {
    ED_P = +id; const p = S.prod.find(x => x.id === ED_P); if (!p) return;
    render();
    setTimeout(() => {
      $('#ep_n').value = p.n; $('#ep_p').value = p.p; $('#ep_m').value = p.mrp || '';
      $('#ep_c').value = p.c; $('#ep_nv').value = p.nv ? '1' : '0';
      $('#ep_h').value = p.h ? '1' : '0'; $('#ep_hot').value = p.hot ? '1' : '0';
      $('#ep_img').value = p.img || '';
      $('#prod_form').scrollIntoView({ behavior: 'smooth' });
    }, 50);
  },
  cancel_edp: () => { ED_P = null; render(); },
  save_prod: () => {
    const n = $('#ep_n').value.trim(), p = +$('#ep_p').value, mrp = +$('#ep_m').value || null;
    const c = $('#ep_c').value, nv = +$('#ep_nv').value, h = +$('#ep_h').value, hot = +$('#ep_hot').value;
    const defImg = (CATS.find(x => x[0] === c) || ['', '', IMG.groc])[2];
    const img = $('#ep_img').value.trim() || defImg;
    if (!n || !(p > 0)) { toast('Enter Name & Selling Price'); return; }
    if (ED_P) {
      const idx = S.prod.findIndex(x => x.id === ED_P);
      if (idx >= 0) S.prod[idx] = { ...S.prod[idx], n, p, mrp, c, nv, h, hot, img };
      ED_P = null;
    } else {
      S.prod.unshift({ id: Date.now(), n, p, mrp, c, nv, h, hot, img, s: 1 });
    }
    save(); toast('Product Saved!');
  },
  del_prod: (v, k, id) => { if (!confirm('Delete product?')) return; S.prod = S.prod.filter(x => x.id !== +id); save(); toast('Product Deleted'); },

  edit_svc: (v, k, id) => {
    ED_SV = id; const s = S.svcList.find(x => x.id === id); if (!s) return;
    render();
    setTimeout(() => {
      $('#es_n').value = s.n; $('#es_p').value = s.p; $('#es_u').value = s.u || '/month';
      $('#es_d').value = s.d || ''; $('#es_img').value = s.img || '';
      $('#svc_form').scrollIntoView({ behavior: 'smooth' });
    }, 50);
  },
  cancel_edsv: () => { ED_SV = null; render(); },
  save_svc: () => {
    const n = $('#es_n').value.trim(), p = +$('#es_p').value, u = $('#es_u').value.trim() || '/event';
    const d = $('#es_d').value.trim(), img = $('#es_img').value.trim() || IMG.cam;
    if (!n || !(p > 0)) { toast('Enter Service Name & Price'); return; }
    if (ED_SV) {
      const idx = S.svcList.findIndex(x => x.id === ED_SV);
      if (idx >= 0) S.svcList[idx] = { ...S.svcList[idx], n, p, u, d, img };
      ED_SV = null;
    } else {
      S.svcList.push({ id: uid('sv'), n, p, u, d, img });
    }
    save(); toast('Service Saved!');
  },
  del_svc: (v, k, id) => { if (!confirm('Delete service?')) return; S.svcList = S.svcList.filter(x => x.id !== id); save(); toast('Service Deleted'); },

  save_app_cfg: () => {
    S.cfg.upi = $('#cfg_upi').value.trim() || '9583937047@jio';
    S.cfg.wa = ph($('#cfg_wa').value) || '9583937047';
    save(); toast('UPI & WhatsApp Updated!');
  },

  theme: () => {
    const d = document.documentElement.dataset.theme !== 'dark';
    document.documentElement.dataset.theme = d ? 'dark' : '';
    $('#thm').textContent = d ? '☀️' : '🌙';
  },
  logout_staff: () => { ROLE = ''; sessionStorage.removeItem('nu_role'); tab = 'plan'; render(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset.v, b.dataset.k, b.dataset.id, e); }
});

document.addEventListener('change', e => {
  if (e.target && e.target.id === 'proof_file' && e.target.files[0]) {
    const r = new FileReader();
    r.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas'), max = 480;
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        c.width = img.width * sc; c.height = img.height * sc;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        PROOF_IMG = c.toDataURL('image/jpeg', 0.65);
        render(); toast('Payment Screenshot Attached ✓');
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(e.target.files[0]);
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.f) F[e.target.dataset.f] = e.target.value;
  if (e.target.id === 'sq') { SQ = e.target.value; const pos = e.target.selectionStart; render(); const el = $('#sq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

let taps = 0, tapT;
$('#mark').addEventListener('click', () => {
  taps++; clearTimeout(tapT); tapT = setTimeout(() => taps = 0, 1800);
  if (taps >= 5) {
    taps = 0;
    const pin = prompt('Owner PIN (4827) ya Kitchen/Delivery PIN (7788) daalein:');
    if (pin === OPIN) { ROLE = 'owner'; sessionStorage.setItem('nu_role', 'owner'); tab = 'owner'; render(); toast('Owner Master Control Unlocked'); }
    else if (pin === DPIN) { ROLE = 'staff'; sessionStorage.setItem('nu_role', 'staff'); tab = 'kitchen'; render(); toast('Staff Mode Unlocked'); }
    else if (pin !== null) toast('Galat PIN');
  }
});

render();
</script>
</body>
</html>
