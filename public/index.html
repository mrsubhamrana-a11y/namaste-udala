<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Namaste Udala - Premium Tiffin Service & Grocery Delivery">
<meta name="theme-color" content="#1B4332">
<title>🍱 Namaste Udala - Tiffin & Grocery</title>
<link rel="manifest" href="manifest.json">

<!-- Premium Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --o: #FF6B35;
  --o-dark: #E85D04;
  --g: #1B4332;
  --g-light: #2D6A4F;
  --bg: #FAFAFA;
  --text: #1A1A1A;
  --muted: #6B7280;
  --card: #FFFFFF;
  --line: #F3F4F6;
  --success: #10B981;
  --danger: #EF4444;
  --warning: #F59E0B;
  --info: #3B82F6;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.08);
  --glass: rgba(255, 255, 255, 0.85);
}

[data-theme="dark"] {
  --bg: #0F0F0F;
  --text: #F9FAFB;
  --muted: #9CA3AF;
  --card: #1A1A1A;
  --line: #2D2D2D;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  --glass: rgba(26, 26, 26, 0.85);
}

* {
  box-sizing: border-box;
  font-family: 'Poppins', 'Noto Sans Devanagari', -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg);
  color: var(--text);
  padding-bottom: 90px;
  font-weight: 500;
  position: relative;
  min-height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Loading Screen --- */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.4s ease;
}
.loading-screen.hide { opacity: 0; pointer-events: none; }
.loader {
  width: 50px;
  height: 50px;
  border: 4px solid var(--line);
  border-top: 4px solid var(--o);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* --- Animations --- */
@keyframes rise {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes shimmer {
  0% { background-position: -1000px 0; }
  100% { background-position: 1000px 0; }
}
@keyframes foodPop {
  0% { transform: translateY(0) scale(1) rotate(0deg); }
  25% { transform: translateY(-40px) scale(1.2) rotate(20deg); }
  50% { transform: translateY(-28px) scale(0.95) rotate(-15deg); }
  75% { transform: translateY(-8px) scale(1.05) rotate(8deg); }
  100% { transform: translateY(0) scale(1) rotate(0deg); }
}
@keyframes splash {
  0% { transform: translate(0,0) scale(0.8); opacity: 1; }
  100% { transform: translate(var(--tx),var(--ty)) scale(0); opacity: 0; }
}
@keyframes steam {
  0% { opacity: 0; transform: translateY(8px) scaleY(.6); }
  40% { opacity: .85; }
  100% { opacity: 0; transform: translateY(-25px) scaleY(1.5); }
}

/* --- Premium Header with Wave --- */
header {
  background: linear-gradient(135deg, var(--g) 0%, #0F2C21 100%);
  color: #fff;
  padding: 24px 20px 60px 20px;
  border-radius: 0 0 32px 32px;
  position: relative;
  overflow: hidden;
  z-index: 2;
  box-shadow: var(--shadow-lg);
}

header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(255,107,53,0.2), transparent 60%);
  pointer-events: none;
}

header::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -20%;
  width: 60%;
  height: 200%;
  background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: shimmer 4s infinite;
}

header .logo {
  font-size: 11px;
  letter-spacing: 2.5px;
  font-weight: 700;
  color: #FCD34D;
  margin-bottom: 6px;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

header h1 {
  font-size: 28px;
  font-weight: 800;
  text-shadow: 0 4px 12px rgba(0,0,0,0.25);
  position: relative;
  z-index: 1;
  line-height: 1.2;
}

header .tagline {
  font-size: 14px;
  opacity: 0.9;
  margin-top: 6px;
  font-weight: 500;
  position: relative;
  z-index: 1;
}

header .emoji {
  position: absolute;
  right: 20px;
  top: 24px;
  font-size: 56px;
  opacity: 0.25;
  animation: float 4s ease-in-out infinite;
  z-index: 1;
}

.header-wave {
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 100%;
  height: 40px;
  fill: var(--bg);
  z-index: 3;
}

/* --- Main Container --- */
#v {
  padding: 0 16px;
  margin-top: -20px;
  position: relative;
  z-index: 1;
}

/* --- Premium Cards --- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
  box-shadow: var(--shadow-md);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}

.card h3 {
  color: var(--g);
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

[data-theme="dark"] .card h3 { color: #4ADE80; }

.s {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}

/* --- Premium Buttons --- */
.btn {
  padding: 14px 24px;
  border-radius: 16px;
  border: none;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  width: 100%;
  margin-top: 10px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--o) 0%, var(--o-dark) 100%);
  color: #fff;
  box-shadow: 0 4px 12px rgba(232, 93, 4, 0.3);
  letter-spacing: 0.3px;
}

.btn:active {
  transform: scale(0.97);
  box-shadow: 0 2px 6px rgba(232, 93, 4, 0.2);
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.6s;
}

.btn:hover::after { transform: translateX(100%); }

.btn.g {
  background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
  color: #065F46;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
  border: 1px solid #A7F3D0;
}

.btn.r {
  background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
  color: #991B1B;
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.15);
  border: 1px solid #FECACA;
}

.btn.b {
  background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
  color: #1E40AF;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
  border: 1px solid #BFDBFE;
}

.btn.sm {
  padding: 8px 16px;
  font-size: 13px;
  width: auto;
  margin: 0;
  border-radius: 12px;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* --- Inputs & Forms --- */
input, textarea, select {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  margin: 6px 0 12px 0;
  font-size: 15px;
  background: var(--bg);
  color: var(--text);
  transition: all 0.2s ease;
  font-family: inherit;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--o);
  box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
  background: var(--card);
}

textarea { min-height: 100px; font-family: monospace; resize: vertical; }

/* --- Segmented Control --- */
.seg {
  display: flex;
  gap: 6px;
  margin: 8px 0 16px 0;
  background: var(--bg);
  padding: 4px;
  border-radius: 16px;
  border: 1px solid var(--line);
}

.seg button {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: none;
  background: transparent;
  font-weight: 600;
  font-size: 13px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.seg button.on {
  background: var(--card);
  color: var(--o);
  box-shadow: var(--shadow-sm);
  transform: scale(1.02);
}

/* --- Glassmorphism Navigation --- */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  justify-content: space-around;
  padding: 10px 0 max(12px, env(safe-area-inset-bottom));
  z-index: 100;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}

.nav div {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  flex: 1;
  cursor: pointer;
  transition: all 0.2s ease;
  padding: 6px 4px;
  border-radius: 12px;
}

.nav div.on {
  color: var(--o);
  background: rgba(255, 107, 53, 0.08);
}

.nav img {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  object-fit: cover;
  display: block;
  margin: 0 auto 4px;
  transition: transform 0.2s ease;
  border: 2px solid transparent;
}

.nav div.on img {
  transform: scale(1.1);
  border-color: var(--o);
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* --- Toast --- */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1F2937;
  color: #fff;
  padding: 14px 28px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  z-index: 1000;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  max-width: 90%;
  text-align: center;
}

.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }
.toast.success { background: var(--success); }

/* --- Badge --- */
.badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
  animation: pulse 1s infinite;
}

/* --- Progress Bar --- */
.progress {
  height: 8px;
  background: var(--line);
  border-radius: 6px;
  overflow: hidden;
  margin: 12px 0;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--o), #FCD34D);
  transition: width 0.5s ease;
  position: relative;
}

.progress-bar::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 1.5s infinite;
}

/* --- Status Indicators --- */
.status {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 6px;
}

.status.online {
  background: var(--success);
  box-shadow: 0 0 10px var(--success);
  animation: pulse 2s infinite;
}

.status.offline { background: var(--muted); }

/* --- Veg/Non-Veg Indicators --- */
.vi {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border: 2px solid #10B981;
  border-radius: 4px;
  position: relative;
  vertical-align: -2px;
  background: #fff;
}

.vi::after {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10B981;
}

.vi.nv { border-color: #EF4444; }
.vi.nv::after { background: #EF4444; }

/* --- Grid Layouts --- */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

/* --- Stats Cards --- */
.stat-card {
  background: linear-gradient(135deg, var(--g) 0%, var(--g-light) 100%);
  color: #fff;
  border-radius: 20px;
  padding: 18px;
  text-align: center;
  box-shadow: var(--shadow-md);
  transition: transform 0.2s ease;
}

.stat-card:hover { transform: translateY(-4px); }
.stat-card .value { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
.stat-card .label { font-size: 12px; opacity: 0.9; font-weight: 500; }

/* --- Product Item --- */
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  transition: background 0.2s ease;
}

.item:last-child { border-bottom: 0; }

.item-img {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  object-fit: cover;
  background: var(--line);
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s ease;
}

.item:hover .item-img { transform: scale(1.05); }

.item-info { flex: 1; min-width: 0; }

.item-info b {
  font-size: 15px;
  font-weight: 600;
  display: block;
  margin-bottom: 4px;
  color: var(--text);
}

.price {
  color: var(--o);
  font-weight: 700;
  font-size: 16px;
}

.mrp {
  text-decoration: line-through;
  color: var(--muted);
  font-size: 12px;
  margin-right: 6px;
  font-weight: 500;
}

/* --- Quantity Control --- */
.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1.5px solid var(--o);
  border-radius: 14px;
  padding: 4px;
  background: rgba(255, 107, 53, 0.04);
}

.qty-ctrl button {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 10px;
  background: var(--o);
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qty-ctrl button:active {
  transform: scale(0.9);
  background: var(--o-dark);
}

.qty-ctrl b {
  min-width: 24px;
  text-align: center;
  color: var(--text);
  font-weight: 700;
  font-size: 15px;
}

/* --- Cart Bar (Glass) --- */
.cart-bar {
  position: fixed;
  bottom: 84px;
  left: 16px;
  right: 16px;
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.2);
  color: var(--text);
  border-radius: 20px;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 99;
  box-shadow: var(--shadow-lg);
  animation: rise 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* --- Kadhai Animation --- */
.kd {
  position: relative;
  width: 130px;
  height: 120px;
  margin: 0 auto;
}

.kd .food-chunk {
  position: absolute;
  left: 50%;
  top: 15px;
  width: 50px;
  height: 50px;
  margin-left: -25px;
  border-radius: 50%;
  overflow: hidden;
  z-index: 5;
  animation: foodPop 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  box-shadow: 0 8px 16px rgba(0,0,0,0.5), 0 0 20px rgba(232,100,28,0.4);
  border: 2px solid rgba(255,255,255,0.3);
}

.kd .food-chunk img { width: 100%; height: 100%; object-fit: cover; }

.kd .splash {
  position: absolute;
  width: 8px;
  height: 8px;
  background: #e8641c;
  border-radius: 50%;
  z-index: 6;
  opacity: 0;
}

.kd .splash.s1 { left: 40%; top: 35px; --tx: -20px; --ty: -30px; animation: splash 2s ease-out infinite .2s; }
.kd .splash.s2 { left: 58%; top: 35px; --tx: 22px; --ty: -25px; animation: splash 2s ease-out infinite .3s; }
.kd .splash.s3 { left: 50%; top: 30px; --tx: 0; --ty: -35px; animation: splash 2s ease-out infinite .4s; }

.kd .steam {
  position: absolute;
  left: 46%;
  top: 0;
  width: 7px;
  height: 22px;
  border-radius: 7px;
  background: linear-gradient(180deg, transparent, #ffffffd8);
  filter: blur(3px);
  opacity: 0;
  animation: steam 2s ease-in-out infinite;
  z-index: 7;
}

.kd .steam.s2 { left: 34%; animation-delay: .6s; }
.kd .steam.s3 { left: 60%; animation-delay: 1.2s; }

/* --- Modal (Bottom Sheet on Mobile) --- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  padding: 0;
}

@media (min-width: 640px) {
  .modal { align-items: center; padding: 20px; }
}

.modal.show { opacity: 1; pointer-events: all; }

.modal-content {
  background: var(--card);
  border-radius: 24px 24px 0 0;
  padding: 24px;
  max-width: 500px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
}

@media (min-width: 640px) {
  .modal-content { border-radius: 24px; transform: scale(0.9); }
}

.modal.show .modal-content { transform: translateY(0) scale(1); }

/* --- Chips --- */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 4px 12px 4px;
  scrollbar-width: none;
  margin: 0 -4px;
}
.chips::-webkit-scrollbar { display: none; }

.chips button {
  flex: none;
  border: 1.5px solid var(--line);
  background: var(--card);
  border-radius: 50px;
  padding: 8px 16px;
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.chips button.on {
  background: var(--o);
  color: #fff;
  border-color: var(--o);
  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
}

/* --- Theme Toggle --- */
.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--glass);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
  z-index: 101;
  box-shadow: var(--shadow-md);
  transition: all 0.3s ease;
}

.theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

/* --- Save Indicator --- */
.save-indicator {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--success);
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 1001;
  pointer-events: none;
  box-shadow: var(--shadow-md);
}

.save-indicator.show { opacity: 1; }

/* --- Empty State --- */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}

.empty-state .icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.5;
}

.empty-state h4 {
  font-size: 18px;

  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#x27;');

  const date = new Date(d);
  return date.getFullYear() + '-' + 
    String(date.getMonth() + 1).padStart(2, '0') + '-' + 
    String(date.getDate()).padStart(2, '0');
};

  const x = new Date(d);

};

  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
};

const basePrice = (type, days) => {
  return PRICING[type][days] || Math.round(PRICING[type][30] / 30 * days);
};

const calculatePrice = () => {
  const dd = clamp(+F.days || 30, 1, 365);
  let b = basePrice(F.type, dd);
  let x = 0;
  
  if (F.lunch === 'both') x += 10 * dd;
  if (F.dinner === 'both') x += 10 * dd;
  x += clamp(F.extraRoti || 0, 0, 4) * 5 * dd;
  
  return +F.half ? Math.round((b + x) * 0.6) : (b + x);
};

const upiLink = amount => {
  return `upi://pay?pa=${CONFIG.upi}&pn=Namaste%20Udala&cu=INR&am=${Math.round(amount)}`;
};

const waLink = (phone, text) => {

};

const getCredit = phone => (S.cred && S.cred[phone]) || 0;

const isRefActive = () => iso(today()) <= (S.refEnd || CONFIG.referralEnd);

const isEligible = days => (+days === 15 || +days === 30);

const isActive = (sub, date) => {
  const k = iso(date);
  const endDate = iso(addDays(new Date(sub.start + 'T12:00:00'), sub.days - 1));
  return k >= sub.start && k <= endDate;
};

const getDue = sub => {
  return sub.price + S.orders
    .filter(o => o.sid === sub.id && !o.paid)
    .reduce((a, o) => a + o.total, 0);
};

  const k = iso(date);
  const override = (S.mset || {})[k];
  
  if (override) {
    if (type === 'nv' && override.nv) return override.nv;
    if (type !== 'nv' && override.veg) return override.veg;
  }
  
  const w = date.getDay();
  
  if (type === 'nv') {
    if (w === 0) return '🍗 Chicken curry, roti, chawal';
    if (w === 3) return '🐟 Fish curry, roti, chawal';
    if (w === 5) return '🥚 Egg curry, roti, chawal';
    if (w === 6) return '🍗 Mutton special, roti, chawal';
  } else {
    if (w === 0) return '🧀 Paneer butter masala, roti, chawal';
    if (w === 3) return '🍄 Mushroom curry, roti, chawal';
    if (w === 5) return '🍮 Special veg thali + meetha';
    if (w === 6) return '🥘 Dal makhani + paneer, roti, chawal';
  }
  
  return '🥘 Dal, sabzi, roti, chawal';
};

          <button class="btn b" data-a="oview" data-v="ref">🎁 Referrals</button>
          <button class="btn b" data-a="oview" data-v="set">⚙️ Settings</button>
        </div>
      </div>
      
      <div class="card">
        <h3>📈 Revenue</h3>
        <div class="grid-3">
          <div class="stat-card"><div class="value">${inr(todayEarn)}</div><div class="label">Aaj</div></div>
          <div class="stat-card"><div class="value">${inr(monthEarn)}</div><div class="label">Month</div></div>
          <div class="stat-card"><div class="value">${inr(totalEarn)}</div><div class="label">Total</div></div>
        </div>
      </div>
      
      <div class="card">
        <h3>💾 Data Management</h3>
        <div class="grid-2">
          <button class="btn b" data-a="exportSubs">📥 Plans</button>
          <button class="btn b" data-a="exportOrders">📥 Orders</button>
          <button class="btn b" data-a="exportPays">📥 Payments</button>
          <button class="btn g" data-a="backup">💾 Full Backup</button>
        </div>
      </div>
      
      <button class="btn r" data-a="out">🚪 Owner se bahar</button>
    `;
  }
};

// ============================================================
// RENDER
// ============================================================
const render = () => {
  if (!OK && !['plan', 'shop'].includes(tab)) tab = 'plan';
  
  try {
    $('#v').innerHTML = VIEWS[tab]();
    $('#ht').textContent = {
      plan: 'Aaj ka Plan',
      shop: 'Shop',
      kitchen: 'Kitchen',
      delivery: 'Delivery',
      owner: 'Owner Dashboard'
    }[tab];
    
    const navItems = [
      ['plan', '🍱 Plan', IMAGES.thali],
      ['shop', '🛒 Shop', IMAGES.grocery],
      ['kitchen', '👨‍🍳 Kitchen', IMAGES.kitchen],
      ['delivery', '🛵 Delivery', IMAGES.scooter],
      ['owner', '👤 Owner', IMAGES.money]
    ];
    
    $('#nav').innerHTML = navItems
      .filter(x => OK || x[0] === 'plan' || x[0] === 'shop')
      .map(x => `
        <div class="${x[0] === tab ? 'on' : ''}" data-a="tab" data-v="${x[0]}">
          <img src="${x[2]}" alt="${x[1]}" onerror="this.style.opacity=0">
          ${x[1]}
        </div>
      `).join('');
  } catch (e) {
    console.error('Render error:', e);
    $('#v').innerHTML = `<div class="card"><h3>⚠️ Error</h3><p class="s">${esc(e.message)}</p></div>`;
  }
  
  setTimeout(() => {
    $('#loadingScreen').classList.add('hide');
  }, 500);
};

// ============================================================
// ACTIONS
// ============================================================
const ACTIONS = {
  tab: v => {
    if (['kitchen', 'delivery', 'owner'].includes(v) && !OK) {
      const pin = prompt(v === 'delivery' ? 'Delivery PIN:' : 'Owner PIN:');
      if (pin === null) return;
      
      const valid = v === 'delivery' 
        ? (pin === CONFIG.deliveryPin || pin === CONFIG.ownerPin)
        : (pin === CONFIG.ownerPin);
      
      if (!valid) {
        showToast('❌ Galat PIN!', 'error');
        return;
      }
      
      OK = 1;
      try { sessionStorage.setItem('udok', '1'); } catch (e) {}
    }
    
    tab = v;
    render();
    window.scrollTo(0, 0);
  },
  
  set: (v, k) => {
    F[k] = v;
    render();
  },
  
  inc: (v, k, id) => {
    if (id === 'extraRoti') {
      F.extraRoti = clamp((F.extraRoti || 0) + 1, 0, 4);
    } else {
      C[id] = clamp((C[id] || 0) + 1, 0, 99);
    }
    render();
  },
  
  dec: (v, k, id) => {
    if (id === 'extraRoti') {
      F.extraRoti = clamp((F.extraRoti || 0) - 1, 0, 4);
    } else {
      C[id] = clamp((C[id] || 0) - 1, 0, 99);
      if (C[id] === 0) delete C[id];
    }
    render();
  },
  
  cat: v => {
    SCAT = v;
    render();
  },
  
  vo: () => {
    VO = VO ? 0 : 1;
    render();
  },
  
  kmeal: v => {
    KMEAL = v;
    render();
  },
  
  oview: v => {
    OVIEW = v;
    render();
  },
  
  cust: () => {
    CUST = CUST ? 0 : 1;
    render();
  },
  
  goc: () => {
    const el = $('#co');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  },
  
  gps: () => {
    if (!navigator.geolocation) {
      showToast('❌ GPS nahi hai', 'error');
      return;
    }
    
    showToast('📍 Location le rahe hain...');
    
    navigator.geolocation.getCurrentPosition(
      pos => {
        F.map = `https://www.google.com/maps?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        showToast('✅ Location mil gayi!');
        render();
      },
      err => {
        showToast('❌ Location nahi mili. GPS ON karo.', 'error');
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  },
  
  clearCart: () => {
    if (confirm('Cart aur details khali karein?')) {
      C = {};
      F.name = ''; F.phone = ''; F.addr = ''; F.area = ''; F.map = '';
      render();
      showToast('🗑️ Sab khali ho gaya');
    }
  },
  
  join: () => {
    if (!F.name || !F.phone) {
      showToast('❌ Naam aur phone daalo', 'error');
      return;
    }
    
    if (F.phone.length !== 10) {
      showToast('❌ 10 digit phone daalo', 'error');
      return;
    }
    
    const td = iso(today());
    const price = calculatePrice();
    const credit = getCredit(F.phone);
    const discount = (isEligible(F.days) && credit > 0) ? Math.min(credit, price) : 0;
    
    const sub = {
      id: Date.now(),
      ts: Date.now(),
      name: String(F.name).slice(0, 40),
      phone: cleanPhone(F.phone),
      area: String(F.area || 'Other').slice(0, 40),
      addr: String(F.addr).slice(0, 120),
      map: String(F.map).slice(0, 200),
      type: F.type === 'nv' ? 'nv' : 'veg',
      days: clamp(+F.days || 30, 1, 365),
      half: +F.half ? 1 : 0,
      start: F.start || iso(addDays(today(), 1)),
      price: price - discount,
      pay: F.pay === 'online' ? 'online' : 'cash',
      paid: 0,
      skip: [],
      lunch: F.lunch,
      dinner: F.dinner,
      extraRoti: clamp(F.extraRoti || 0, 0, 4),
      ref: ''
    };
    
    if (discount > 0) {
      S.cred[F.phone] = credit - discount;
    }
    
    const refCode = (F.ref || '').trim().toUpperCase();
    if (refCode && isRefActive() && isEligible(sub.days)) {
      const referrer = S.subs.find(x => getRefCode(x.phone) === refCode && x.phone !== sub.phone);
      if (referrer) {
        S.refs = S.refs || {};
        S.refs[referrer.phone] = S.refs[referrer.phone] || [];
        
        if (!S.refs[referrer.phone].some(e => e.p === sub.phone)) {
          S.refs[referrer.phone].push({
            p: sub.phone,
            n: sub.name,
            d: td,
            amt: 100
          });
          S.cred[referrer.phone] = (S.cred[referrer.phone] || 0) + 100;
          sub.ref = refCode;
          showToast('🎁 Refer credit diya: ₹100');
        }
      }
    }
    
    S.subs.push(sub);
    MY.push('s' + sub.id);
    saveMY();
    addLog('New plan: ' + sub.name);
    save();
    
    showToast('✅ Plan ban gaya: ' + inr(sub.price));
    
    // WhatsApp notification to owner
    const waText = `🍱 *नया Tiffin Plan*%0A%0A👤 ${sub.name}%0A📱 ${sub.phone}%0A📍 ${sub.addr || sub.area}%0A🍽️ ${sub.type === 'veg' ? 'Veg' : 'Non-veg'} · ${sub.days} दिन%0A🥣 ${sub.half ? 'Half' : 'Full'} portion%0A🫓 Lunch: ${sub.lunch} · Dinner: ${sub.dinner}%0A💰 ₹${sub.price}%0A💳 ${sub.pay}%0A📅 Start: ${sub.start}`;
    setTimeout(() => {
      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${waText}`, '_blank');
      if (F.pay === 'online') {
        setTimeout(() => location.href = upiLink(sub.price), 500);
      }
    }, 800);
    
    F.name = '';
    F.phone = '';
    F.area = '';
    F.addr = '';
    F.map = '';
    F.ref = '';
    F.extraRoti = 0;
    C = {};
  },
  
  trial: () => {
    if (!F.name || !F.phone) {
      showToast('❌ Naam aur phone daalo', 'error');
      return;
    }
    
    const sub = {
      id: Date.now(),
      ts: Date.now(),
      name: String(F.name).slice(0, 40),
      phone: cleanPhone(F.phone),
      area: String(F.area || 'Other').slice(0, 40),
      addr: String(F.addr).slice(0, 120),
      map: String(F.map).slice(0, 200),
      type: F.type === 'nv' ? 'nv' : 'veg',
      days: 1,
      half: 0,
      start: iso(today()),
      price: 0,
      pay: 'cash',
      paid: 1,
      skip: [],
      trial: 1,
      lunch: F.lunch,
      dinner: F.dinner,
      extraRoti: clamp(F.extraRoti || 0, 0, 4),
      ref: ''
    };
    
    S.subs.push(sub);
    MY.push('s' + sub.id);
    saveMY();
    addLog('Trial: ' + sub.name);
    save();
    
    showToast('🎁 1 din FREE trial shuru!');
    
    const waText = `🎁 *FREE Trial*%0A%0A👤 ${sub.name}%0A📱 ${sub.phone}%0A📍 ${sub.addr || sub.area}%0A🍽️ ${sub.type === 'veg' ? 'Veg' : 'Non-veg'}`;
    setTimeout(() => {
      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${waText}`, '_blank');
    }, 500);
    
    F.name = '';
    F.phone = '';
    F.extraRoti = 0;
  },
  
  order: () => {
    if (!F.name || !F.phone) {
      showToast('❌ Naam aur phone daalo', 'error');
      return;
    }
    
    const items = [];
    let total = 0;
    
    Object.entries(C).forEach(([k, q]) => {
      const p = S.prod.find(x => x.id === parseInt(k, 10));
      if (!p || q < 1) return;
      
      items.push({
        n: p.n,
        q: clamp(q, 1, 99),
        p: p.p
      });
      total += p.p * q;
    });
    
    if (!items.length) {
      showToast('❌ Cart khali hai', 'error');
      return;
    }
    
    const order = {
      id: Date.now(),
      ts: Date.now(),
      name: String(F.name).slice(0, 40),
      phone: cleanPhone(F.phone),
      area: String(F.area || 'Other').slice(0, 40),
      addr: String(F.addr).slice(0, 120),
      map: String(F.map).slice(0, 200),
      items: items,
      total: total,
      pay: F.pay === 'online' ? 'online' : 'cash',
      paid: 0,
      dlv: 0,
      t: new Date().toLocaleString()
    };
    
    S.orders.push(order);
    MY.push('o' + order.id);
    saveMY();
    addLog('Order: ' + order.name);
    C = {};
    save();
    
    showToast('✅ Order ho gaya: ' + inr(total));
    
    // WhatsApp notification
    const waText = `🛒 *नया Grocery Order*%0A%0A👤 ${order.name}%0A📱 ${order.phone}%0A📍 ${order.addr || order.area}%0A%0A📦 *Items:*%0A${items.map(i => `• ${i.n} x${i.q} = ₹${i.p * i.q}`).join('%0A')}%0A%0A💰 *Total: ₹${total}*%0A💳 ${order.pay}`;
    setTimeout(() => {
      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${waText}`, '_blank');
      if (F.pay === 'online') {
        setTimeout(() => location.href = upiLink(total), 500);
      }
    }, 800);
    
    F.name = '';
    F.phone = '';
    F.addr = '';
    F.area = '';
    F.map = '';
  },
  
  done: (v, k, id) => {
    const key = iso(today()) + '_' + id;
    S.done[key] = S.done[key] ? 0 : 1;
    save();
    showToast(S.done[key] ? '✅ Delivered!' : '↩️ Undo');
  },
  
  odone: (v, k, id) => {
    const o = S.orders.find(x => x.id == id);
    if (o) {
      o.dlv = 1;
      save();
      showToast('✅ Shop order delivered!');
    }
  },
  
  skip: (v, k, id) => {
    const s = S.subs.find(x => x.id == id);
    if (!s) return;
    
    const d = iso(addDays(today(), 1));
    const i = s.skip.indexOf(d);
    
    if (i >= 0) {
      s.skip.splice(i, 1);
      showToast('↩️ Skip hataya');
    } else {
      s.skip.push(d);
      showToast('⏭️ Kal skip kiya');
    }
    
    save();
  },
  
  out: () => {
    OK = 0;
    try { sessionStorage.removeItem('udok'); } catch (e) {}
    tab = 'plan';
    render();
    showToast('🚪 Owner se bahar aa gaye');
  },
  
  copyKitchen: () => {
    const t = today();
    const k = iso(t);
    const active = S.subs.filter(s => isActive(s, t) && !s.skip.includes(k));
    
    const vegCount = active.filter(s => s.type === 'veg').length;
    const nvCount = active.filter(s => s.type === 'nv').length;
    const extraRoti = active.reduce((a, s) => a + (s.extraRoti || 0), 0);
    
    const text = `🍱 Namaste Udala - Kitchen Summary
📅 Date: ${k}

📊 Total Dabbe: ${active.length}
🟢 Veg: ${vegCount}
🔴 Non-Veg: ${nvCount}
🫓 Extra Roti: ${extraRoti}

✅ Ready to cook!`;
    
    navigator.clipboard.writeText(text).then(() => {
      showToast('📋 Copy ho gaya! WhatsApp mein paste karo.');
    }).catch(() => {
      showToast('❌ Copy nahi hui', 'error');
    });
  },
  
  backup: () => {
    const data = JSON.stringify(S, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `namaste-udala-backup-${iso(today())}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('💾 Backup download ho gaya!');
  },
  
  exportSubs: () => {
    const data = S.subs.map(s => ({
      Name: s.name,
      Phone: s.phone,
      Type: s.type,
      Days: s.days,
      Price: s.price,
      Paid: s.paid ? 'Yes' : 'No',
      Start: s.start,
      Area: s.area
    }));
    
    exportCSV(data, 'namaste-udala-plans.csv');
  },
  
  exportOrders: () => {
    const data = S.orders.map(o => ({
      Name: o.name,
      Phone: o.phone,
      Items: o.items.map(i => `${i.n}x${i.q}`).join(', '),
      Total: o.total,
      Paid: o.paid ? 'Yes' : 'No',
      Delivered: o.dlv ? 'Yes' : 'No',
      Date: new Date(o.ts).toLocaleDateString()
    }));
    
    exportCSV(data, 'namaste-udala-orders.csv');
  },
  
  exportPays: () => {
    const data = S.pays.map(p => ({
      Name: p.name,
      Amount: p.amt,
      Mode: p.mode,
      Date: p.d,
      Type: p.kind
    }));
    
    exportCSV(data, 'namaste-udala-payments.csv');
  }
};

const exportCSV = (data, filename) => {
  if (!data || !data.length) {
    showToast('❌ Data khali hai', 'error');
    return;
  }
  
  const keys = Object.keys(data[0]);
  const csv = [
    keys.join(','),
    ...data.map(row => keys.map(k => `"${String(row[k] || '').replace(/"/g, '""')}"`).join(','))
  ].join('\n');
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('✅ Export ho gaya!');
};

// ============================================================
// EVENT LISTENERS
// ============================================================
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  
  const action = ACTIONS[btn.dataset.a];
  if (!action) return;
  
  try {
    action(btn.dataset.v, btn.dataset.k, btn.dataset.id);
  } catch (err) {
    console.error('Action error:', err);
    showToast('❌ Error: ' + err.message, 'error');
  }
});

const handleSearch = debounce(e => {
  if (e.target.id === 'sq') {
    SQ = e.target.value;
    const el = $('#pl');
    if (el && tab === 'shop') {
      let filtered = S.prod.filter(p => p.s);
      if (VO) filtered = filtered.filter(p => !p.nv);
      if (SCAT !== 'all') filtered = filtered.filter(p => p.c === SCAT);
      if (SQ) {
        const q = SQ.toLowerCase();
        filtered = filtered.filter(p => p.n.toLowerCase().includes(q));
      }
      
      const grouped = {};
      filtered.forEach(p => {
        grouped[p.c] = grouped[p.c] || [];
        grouped[p.c].push(p);
      });
      
      el.innerHTML = Object.entries(grouped).map(([cat, prods]) => `
        <div class="card">
          <h3>${esc(cat)}</h3>
          ${prods.map(renderProduct).join('')}
        </div>
      `).join('') || '<div class="empty-state"><div class="icon">🔍</div><h4>Kuch nahi mila</h4></div>';
    }
  }
}, 300);

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) {
    F[field] = e.target.value;
    if (field === 'phone') F.phone = cleanPhone(F.phone);
    if (field === 'extraRoti') F.extraRoti = clamp(+F.extraRoti || 0, 0, 4);
  }
  
  handleSearch(e);
});

let tapCount = 0;
document.querySelector('header').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN:');
    if (pin === CONFIG.ownerPin) {
      OK = 1;
      try { sessionStorage.setItem('udok', '1'); } catch (e) {}
      tab = 'owner';
      render();
      showToast('🔓 Owner access granted!');
    } else if (pin !== null) {
      showToast('❌ Galat PIN!', 'error');
    }
  }
});

$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') hideModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideModal();
});

// ============================================================
// INIT
// ============================================================
initTheme();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

console.log('🍱 Namaste Udala v2.1 Premium loaded!');
</script>
