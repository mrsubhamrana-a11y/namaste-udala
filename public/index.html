<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Namaste Udala - Stable</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --primary: #f97316; --success: #22c55e; --danger: #ef4444; --border: #334155; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }
  header { background: var(--card); padding: 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 20px; color: var(--primary); }
  .container { padding: 16px; max-width: 600px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
  .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; text-align: center; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; }
  .nav-item { flex: 1; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; }
  .nav-item.active { color: var(--primary); font-weight: bold; }
  .input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-bottom: 12px; font-size: 16px; }
  .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
  .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--success); }
  .badge-pending { background: rgba(249, 115, 22, 0.2); color: var(--primary); }
  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--card); color: var(--text); padding: 12px 24px; border-radius: 24px; border: 1px solid var(--border); z-index: 100; display: none; }
  .toast.show { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
  .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .order-item:last-child { border-bottom: none; }
</style>
</head>
<body>

<header>
  <h1>🍱 Namaste Udala</h1>
  <p style="font-size: 12px; color: var(--muted);">Ghar jaisa khana</p>
</header>

<div class="container" id="app">
  <div class="loading">
    <p>☁️ Data load ho raha hai...</p>
    <p style="font-size: 12px; margin-top: 8px;">Thoda wait karein</p>
  </div>
</div>

<div class="nav">
  <div class="nav-item active" onclick="switchTab('plan')">🍱 Plan</div>
  <div class="nav-item" onclick="switchTab('shop')">🛍️ Shop</div>
  <div class="nav-item" onclick="switchTab('owner')">👤 Owner</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://namaste-udala-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'udala_data');

  // State
  let S = { subs: [], orders: [], products: [], meals: {} };
  let currentTab = 'plan';
  let user = JSON.parse(localStorage.getItem('ud_user') || 'null');
  let cart = {};
  let lastOrderTime = 0;

  // --- Core Functions ---
  const $ = id => document.getElementById(id);
  const showToast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); };
  const inr = n => '₹' + Math.round(n);
  const today = () => new Date().toISOString().split('T')[0];

  // --- Data Sync (Feature 1: Real-Time Sync) ---
  onValue(dbRef, (snapshot) => {
    if (snapshot.exists()) {
      S = snapshot.val();
      // Ensure arrays exist to prevent errors
      if (!S.subs) S.subs = [];
      if (!S.orders) S.orders = [];
      if (!S.products) S.products = [];
      if (!S.meals) S.meals = {};
    }
    render();
  }, (error) => {
    console.error(error);
    $('app').innerHTML = '<div class="card" style="text-align:center"><h3>⚠️ Connection Error</h3><p>Internet check karein</p></div>';
  });

  const save = () => set(dbRef, S);

  // --- Views ---
  function render() {
    const app = $('app');
    if (currentTab === 'plan') app.innerHTML = viewPlan();
    else if (currentTab === 'shop') app.innerHTML = viewShop();
    else if (currentTab === 'owner') app.innerHTML = viewOwner();
  }

  function viewPlan() {
    let html = '<div class="card"><h3>👤 Login</h3>';
    if (user) {
      html += `<p>Welcome, <b>${user.name}</b></p><button class="btn btn-outline" onclick="logout()">Logout</button>`;
      
      // Feature 4: Order History
      const myOrders = S.orders.filter(o => o.phone === user.phone).reverse();
      if (myOrders.length > 0) {
        html += `<h3 style="margin-top:20px">📜 Order History</h3>`;
        myOrders.forEach(o => {
          html += `<div class="card" style="margin-top:10px">
            <div style="display:flex;justify-content:space-between"><b>#${o.id.slice(-4)}</b><span class="badge ${o.status==='delivered'?'badge-active':'badge-pending'}">${o.status}</span></div>
            <p style="font-size:12px;color:var(--muted)">${o.date} · ${o.items.map(i=>i.n).join(', ')}</p>
            <p style="font-weight:bold;color:var(--primary)">${inr(o.total)}</p>
            ${o.status === 'delivered' ? `<button class="btn btn-outline" onclick="reorder('${o.id}')">🔁 Reorder</button>` : ''}
          </div>`;
        });
      }
    } else {
      html += `<input class="input" id="loginName" placeholder="Naam"><input class="input" id="loginPhone" placeholder="Phone (10 digit)"><button class="btn btn-primary" onclick="login()">Login</button>`;
    }
    html += '</div>';
    return html;
  }

  function viewShop() {
    let html = '<div class="card"><h3>🛍️ Shop</h3>';
    const foods = S.products.filter(p => p.kind === 'food');
    foods.forEach(p => {
      const qty = cart[p.id] || 0;
      html += `<div class="order-item">
        <div><b>${p.n}</b><br><small>${inr(p.p)}</small></div>
        <div>
          ${qty > 0 ? `<button class="btn btn-outline" style="width:auto;padding:4px 10px" onclick="updateCart('${p.id}', -1)">-</button> <b>${qty}</b> <button class="btn btn-outline" style="width:auto;padding:4px 10px" onclick="updateCart('${p.id}', 1)">+</button>` : `<button class="btn btn-primary" style="width:auto;padding:6px 12px;margin:0" onclick="updateCart('${p.id}', 1)">Add</button>`}
        </div>
      </div>`;
    });
    
    const total = Object.keys(cart).reduce((sum, id) => {
      const p = S.products.find(x => x.id === id);
      return sum + (p ? p.p * cart[id] : 0);
    }, 0);

    if (total > 0) {
      html += `<div style="margin-top:20px;border-top:1px solid var(--border);padding-top:10px"><b>Total: ${inr(total)}</b><button class="btn btn-success" onclick="placeOrder()">✅ Place Order</button></div>`;
    }
    html += '</div>';
    return html;
  }

  function viewOwner() {
    let html = '<div class="card"><h3>🔒 Owner Login</h3><input class="input" id="ownerPin" type="password" placeholder="PIN"><button class="btn btn-primary" onclick="ownerLogin()">Unlock</button></div>';
    if (sessionStorage.getItem('isOwner') === 'true') {
      html = '<div class="card"><h3>📊 Dashboard</h3>';
      const pending = S.orders.filter(o => o.status === 'pending');
      if (pending.length === 0) html += '<p>Koi pending order nahi</p>';
      pending.forEach(o => {
        html += `<div class="card" style="margin-top:10px;border-left:4px solid var(--primary)">
          <b>${o.name}</b> (${o.phone})<br>
          <small>${o.items.map(i=>`${i.n} x${i.q}`).join(', ')}</small><br>
          <b>${inr(o.total)}</b>
          <button class="btn btn-success" onclick="verifyOrder('${o.id}', '${o.phone}', ${o.total})">✅ Verify & WhatsApp</button>
        </div>`;
      });
      html += '</div>';
    }
    return html;
  }

  // --- Actions ---
  window.switchTab = tab => { currentTab = tab; document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', ['plan','shop','owner'][i] === tab)); render(); };
  window.login = () => {
    const name = $('loginName').value, phone = $('loginPhone').value;
    if (name.length < 2 || phone.length !== 10) return showToast('Sahi naam aur phone daalein');
    user = { name, phone };
    localStorage.setItem('ud_user', JSON.stringify(user));
    render();
  };
  window.logout = () => { user = null; localStorage.removeItem('ud_user'); render(); };
  window.updateCart = (id, change) => {
    cart[id] = (cart[id] || 0) + change;
    if (cart[id] <= 0) delete cart[id];
    render();
  };
  
  // Feature 2: Duplicate Order Prevention
  window.placeOrder = () => {
    if (!user) return showToast('Pehle Plan tab mein login karein');
    const now = Date.now();
    if (now - lastOrderTime < 60000) return showToast('⏳ 1 minute wait karein');
    
    const items = Object.keys(cart).map(id => {
      const p = S.products.find(x => x.id === id);
      return { n: p.n, q: cart[id], p: p.p };
    });
    const total = items.reduce((s, i) => s + i.p * i.q, 0);
    
    const newOrder = { id: now.toString(), name: user.name, phone: user.phone, items, total, status: 'pending', date: today() };
    S.orders.push(newOrder);
    save();
    lastOrderTime = now;
    cart = {};
    showToast('✅ Order placed!');
    switchTab('plan');
  };

  // Feature 5: Reorder
  window.reorder = (orderId) => {
    const order = S.orders.find(o => o.id === orderId);
    if (!order) return;
    order.items.forEach(i => {
      const p = S.products.find(x => x.n === i.n);
      if (p) cart[p.id] = (cart[p.id] || 0) + i.q;
    });
    showToast('🔁 Items cart mein add ho gaye');
    switchTab('shop');
  };

  window.ownerLogin = () => {
    if ($('ownerPin').value === '4821') {
      sessionStorage.setItem('isOwner', 'true');
      render();
    } else showToast('Galat PIN');
  };

  // Feature 3: Auto WhatsApp Notifications
  window.verifyOrder = (id, phone, amount) => {
    const order = S.orders.find(o => o.id === id);
    if (order) {
      order.status = 'delivered';
      save();
      const msg = `✅ Namaste ${order.name}! Aapka order ${inr(amount)} ka confirm ho gaya hai. Dhanyavad!`;
      window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`, '_blank');
      showToast('✅ Verified & WhatsApp sent');
      render();
    }
  };

  // Initial render
  render();
</script>
</body>
</html>
