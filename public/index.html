<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste Udala</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14452a">
<style>
:root{--o:#e8590c;--g:#15543b;--bg:#fff9f0;--text:#2b1d12;--muted:#8a7561;--card:#fff;--line:#f0e3d3}
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:84px;font-weight:500}
header{background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff;padding:22px 20px 30px;border-radius:0 0 32px 32px;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative;overflow:hidden}
header::after{content:'🍱';position:absolute;right:20px;top:15px;font-size:50px;opacity:.3;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
header b{color:#fcc419;font-size:11px;letter-spacing:3px;font-weight:900}
header h1{font-size:26px;font-weight:900;margin-top:4px}
header .s{color:rgba(255,255,255,.9)!important;font-weight:500}
#v{padding:0 14px;margin-top:-16px;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(0,0,0,.06)}
.card h3{color:var(--g);font-size:17px;font-weight:800;margin-bottom:10px}
.s{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button,.btn{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--text)}
.seg .on{background:var(--o);color:#fff;border-color:var(--o)}
.btn{background:var(--o);color:#fff;border:0;width:100%;margin-top:8px;font-size:15px}
.btn.g{background:#e3f4e8;color:#1f7a3f}
.btn.r{background:#fde8e8;color:#c92a2a}
.btn.sm{padding:6px 12px;flex:none;width:auto;margin:0 0 0 4px;font-size:11px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:5px 0;font-size:14px;background:#fffdf9;color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:6px}
.big{background:linear-gradient(135deg,#f59f00,#e8590c);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}
.big .n{font-size:48px;font-weight:900}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.gr div{background:rgba(255,255,255,.2);border-radius:14px;padding:10px;text-align:center;font-size:11px}
.gr b{font-size:18px;display:block;font-weight:900}
.ban{background:#fff4d6;border:1px solid var(--line);color:var(--text);font-size:13px;border-radius:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 max(12px,env(safe-area-inset-bottom));z-index:100}
.nav div{text-align:center;font-size:11px;font-weight:700;color:var(--muted);flex:1}
.nav div.on{color:var(--o)}
.nav i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
a{color:var(--o);font-weight:700;font-size:12px}
.hero{background:linear-gradient(135deg,#f59f00,#e8590c);border-radius:28px;padding:24px 20px;margin:14px 0 16px;position:relative;overflow:hidden;color:#fff}
.hero .em{font-size:60px;position:absolute;right:14px;top:10px;z-index:2}
.hero h2{font-size:26px;line-height:1.2;margin-bottom:8px;font-weight:900}
.hero p{font-size:13px;opacity:.95}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{background:rgba(255,255,255,.25);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700}
.pc{flex:1;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--card);text-align:center}
.pc.on{background:#fff1e6;border-color:var(--o)}
.sps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp{background:#fff1e6;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px}
.vi{display:inline-block;width:16px;height:16px;border:2px solid #16a34a;border-radius:4px;position:relative;vertical-align:-3px;background:#fff}
.vi::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#16a34a}
.vi.nv{border-color:#dc2626}.vi.nv::after{background:#dc2626}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:24px;padding:8px 14px;font-weight:700;font-size:12px}
.chips2 button.on{background:var(--o);color:#fff;border-color:var(--o)}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(128,128,128,.15)}
.it:last-child{border-bottom:0}
.ie{width:50px;height:50px;border-radius:14px;background:rgba(232,89,12,.1);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.in{flex:1;min-width:0;font-size:14px}
.stp2{display:flex;align-items:center;gap:8px;border:1.5px solid var(--o);border-radius:12px;padding:4px;flex:none}
.stp2 button{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:var(--o);font-size:20px;font-weight:900}
.stp2 b{min-width:20px;text-align:center;color:var(--o)}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pm div{background:rgba(128,128,128,.1);border-radius:14px;padding:12px 6px;text-align:center}
.pm b{font-size:18px;display:block;color:var(--o);font-weight:900}
.cbar{position:sticky;bottom:80px;background:#14452a;color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.shc{background:linear-gradient(135deg,#15543b,#23734f)!important;color:#fff!important;border-radius:20px!important;padding:18px!important;margin-bottom:14px!important}
.shc h3{color:#fff!important}
.shc .s{color:#dbe9e1!important}
.shc .row{border-bottom:1px solid rgba(255,255,255,.15)!important}
.shc .pm div{background:rgba(255,255,255,.18)!important}
.shc .pm b{color:#fff!important}
</style></head>
<body>
<header><b>NAMASTE UDALA</b><h1 id="ht">Plan</h1><div class="s">Ghar jaisa khana · roz time pe</div></header>
<div id="v"></div>
<div class="nav" id="nav"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",authDomain:"namaste-udala.firebaseapp.com",projectId:"namaste-udala",storageBucket:"namaste-udala.firebasestorage.app",messagingSenderId:"998684348165",appId:"1:998684348165:web:4bb0d2f5335a90a394716c"};
const UPI='9583937047@jio';
const PL={veg:{7:749,15:1499,30:2899},nv:{7:949,15:1849,30:3599}};
const SL='Subah 7:30-8:15 · Lunch 1:30-2:15 · Dinner 8:00-9:00';
const KITCHEN='https://maps.app.goo.gl/GMQd32b6YdPpQ1eX8';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const D0=()=>{const d=new Date();d.setHours(12,0,0,0);return d};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const SEED=[['Doodh 500 ml',30,'Doodh aur dairy'],['Dahi 400 g',40,'Doodh aur dairy'],['Paneer 200 g',80,'Doodh aur dairy'],['Chai patti 250 g',130,'Chai aur nashta'],['Coffee 50 g',140,'Chai aur nashta'],['Bread',40,'Chai aur nashta'],['Ande (6)',72,'Chai aur nashta'],['Detergent 1 kg',130,'Ghar ki safai'],['Bartan gel 500 ml',110,'Ghar ki safai'],['Sabun',30,'Body care'],['Shampoo 340 ml',180,'Body care'],['Toothpaste 150 g',95,'Body care'],['Atta 1 kg',50,'Kirana'],['Chawal 1 kg',70,'Kirana'],['Dal 1 kg',150,'Kirana'],['Tel 1 L',150,'Kirana'],['Roti',5,'Extra khana',1],['Chawal plate',20,'Extra khana',1],['Paneer sabzi',50,'Extra khana',1],['Egg',12,'Extra khana'],['Chicken piece',40,'Extra khana'],['Mushroom curry',60,'Extra khana']].map((a,i)=>({id:i+1,n:a[0],p:a[1],c:a[2],s:1,h:a[3]||0}));
let S={prod:SEED,subs:[],orders:[],done:{}};
try{const l=JSON.parse(localStorage.getItem('udala2'));if(l)S=l}catch(e){}
const fix=()=>{S.prod=S.prod||[];S.subs=S.subs||[];S.orders=S.orders||[];S.done=S.done||{};S.pays=S.pays||[];S.subs.forEach(s=>{s.skip=s.skip||[]})};fix();
let db=null,tab='plan',C={},OVIEW='dash';
const F={type:'veg',days:'30',half:'0',pay:'cash',name:'',phone:'',area:'',addr:'',map:'',start:iso(add(D0(),1)),lunch:'roti',dinner:'roti',extraRoti:0};
let ME=null;try{ME=JSON.parse(localStorage.getItem('udme'))||null}catch(e){}
const saveME=()=>{try{localStorage.setItem('udme',JSON.stringify(ME))}catch(e){}};
if(ME){F.name=ME.name;F.phone=ME.phone}
try{const app=initializeApp(firebaseConfig);db=getDatabase(app);onValue(ref(db,'udala2'),sn=>{const v=sn.val();if(v){S=v;fix();render()}})}catch(e){console.log('Cloud off',e)}
const save=()=>{try{localStorage.setItem('udala2',JSON.stringify(S))}catch(e){}try{db&&set(ref(db,'udala2'),S)}catch(e){}render()};
const pr=()=>{let b=PL[F.type][F.days];let x=0;if(F.lunch==='both')x+=10*F.days;if(F.dinner==='both')x+=10*F.days;x+=F.extraRoti*5*F.days;return +F.half?Math.round((b+x)*.6):(b+x)};
const upi=a=>'upi://pay?pa='+UPI+'&pn=Namaste%20Udala&cu=INR&am='+Math.round(a);
const wa=(ph,t)=>window.open('https://wa.me/91'+ph+'?text='+encodeURIComponent(t),'_blank');
const mf=(d,t)=>{const w=d.getDay();if(t==='nv'){if(w===3)return'Fish curry, roti, chawal';if(w===5)return'2 egg curry, roti, chawal';if(w===0)return'Chicken, roti, chawal'}else{if(w===3)return'Paneer sabzi, roti, chawal';if(w===5)return'Special veg thali + meetha';if(w===0)return'Mushroom curry, roti, chawal'}return'Dal, sabzi, roti, chawal'};
const act=(s,dt)=>{const k=iso(dt);return k>=s.start&&k<=iso(add(new Date(s.start+'T12:00:00'),s.days-1))};
const vi=t=>'<span class="vi '+(t==='nv'?'nv':'')+'"></span>';
const seg=(k,o)=>'<div class="seg">'+o.map(a=>'<button class="'+(String(F[k])===String(a[0])?'on':'')+'" data-a="set" data-k="'+k+'" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
const mealBtn=(k,v,l)=>'<button class="btn sm '+(F[k]===v?'on':'')+'" data-a="set" data-k="'+k+'" data-v="'+v+'" style="flex:1">'+l+'</button>';
const sp=(en,ev,d,a,b)=>'<div class="sp"><div style="font-size:24px">'+(F.type==='nv'?en:ev)+'</div><b>'+d+'</b><div class="s">'+(F.type==='nv'?a:b)+'</div></div>';
const contact=()=>'<input data-f="name" placeholder="Naam" value="'+esc(F.name)+'"><input data-f="phone" type="tel" placeholder="Phone number" value="'+esc(F.phone)+'"><input data-f="area" placeholder="Area / Sector" value="'+esc(F.area)+'"><input data-f="addr" placeholder="Pura address" value="'+esc(F.addr)+'"><input data-f="map" placeholder="Google Maps location link" value="'+esc(F.map)+'"><button class="btn g" data-a="gps">📍 Meri asli location lo (GPS)</button>';
const banner=()=>{const t=D0();return '<div class="card ban"><b>🍽️ Aaj ka menu ('+t.getDate()+'/'+(t.getMonth()+1)+')</b><br>Veg: '+mf(t,'veg')+'<br>Non-veg: '+mf(t,'nv')+'</div>'};
const rt=l=>{const pt=l.map(s=>{const m=(s.map||'').match(/q=(-?\d+\.\d+),(-?\d+\.\d+)/);return m?m[1]+','+m[2]:(s.addr+' '+s.area)}).slice(0,10);const d=pt.pop();return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(KITCHEN)+'&destination='+encodeURIComponent(d)+(pt.length?'&waypoints='+encodeURIComponent(pt.join('|')):'')+'&travelmode=driving'};
const OPIN="4821",DPIN="7788";let OK=0;try{OK=sessionStorage.getItem('udok')?1:0}catch(e){}
let SCAT='all',SQ='',VO=0;
const EM=[[/doodh/,'🥛'],[/dahi/,'🥣'],[/paneer/,'🧀'],[/chai|coffee/,'☕'],[/bread/,'🍞'],[/ande|egg/,'🥚'],[/sabun/,'🧼'],[/shampoo/,'🧴'],[/atta/,'🌾'],[/chawal/,'🍚'],[/dal/,'🫘'],[/tel/,'🛢️'],[/roti/,'🫓'],[/chicken/,'🍗'],[/mushroom/,'🍄'],[/fish/,'🐟']];
const CE={'Doodh aur dairy':'🥛','Chai aur nashta':'☕','Ghar ki safai':'🧽','Body care':'🧴','Kirana':'🌾','Extra khana':'🍛'};
const ce=c=>CE[c]||'🛍️';
const pe=p=>{const n=p.n.toLowerCase();for(const x of EM){if(x[0].test(n))return x[1]}return ce(p.c)};
const FOOD=['Extra khana'];
const isF=p=>FOOD.includes(p.c);
const item=p=>{const q=C[p.id]||0,qh=C[p.id+'h']||0;
const ctl=(k,n)=>n?('<div class="stp2"><button data-a="dec" data-id="'+k+'">−</button><b>'+n+'</b><button data-a="inc" data-id="'+k+'">+</button></div>'):('<button class="btn sm" data-a="inc" data-id="'+k+'">ADD +</button>');
let h='<div class="it"><div class="ie">'+pe(p)+'</div><div class="in"><b>'+(isF(p)?vi(p.nv?'nv':'veg')+' ':'')+esc(p.n)+'</b><div class="s">'+inr(p.p)+(p.h?' · Full':'')+'</div></div>'+ctl(p.id,q)+'</div>';
if(p.h){h+='<div class="it" style="padding:0 0 12px 60px"><div class="in s">½ Half · <b>'+inr(Math.round(p.p*.6))+'</b></div>'+ctl(p.id+'h',qh)+'</div>'}
return h};
const shopList=()=>{const q=SQ.trim().toLowerCase();let l=S.prod.filter(p=>p.s);if(VO)l=l.filter(p=>!p.nv);if(SCAT!=='all')l=l.filter(p=>p.c===SCAT);if(q)l=l.filter(p=>p.n.toLowerCase().includes(q));const g={};l.forEach(p=>{(g[p.c]=g[p.c]||[]).push(p)});return Object.keys(g).map(c=>'<div class="card"><h3>'+ce(c)+' '+esc(c)+'</h3>'+g[c].map(item).join('')+'</div>').join('')||'<div class="card">Kuch nahi mila 🔍</div>'};
const due=s=>s.price+S.orders.filter(o=>o.sid===s.id&&!o.paid).reduce((a,o)=>a+o.total,0);
const PY=()=>S.pays||[];
let MY=[];try{MY=JSON.parse(localStorage.getItem('udmine'))||[]}catch(e){}
const saveMY=()=>{try{localStorage.setItem('udmine',JSON.stringify(MY))}catch(e){}};
const utrCard=()=>{const L=[];S.subs.forEach(s=>{if(MY.includes('s'+s.id)&&!s.paid&&s.pay==='online')L.push({k:'s'+s.id,n:s.name,a:due(s),u:s.utr})});S.orders.forEach(o=>{if(MY.includes('o'+o.id)&&!o.paid&&o.pay==='online')L.push({k:'o'+o.id,n:o.name,a:o.total,u:o.utr})});return L.map(e=>'<div class="card" style="border:2px solid var(--o)"><h3>💳 Payment confirm karo</h3><div class="s">'+esc(e.n)+' · <b>'+inr(e.a)+'</b></div>'+(e.u?'<div class="s">✅ UTR <b>'+esc(e.u)+'</b> mil gaya.</div>':'<a href="'+esc(upi(e.a))+'">📲 UPI app kholo</a><input id="u'+e.k+'" inputmode="numeric" maxlength="14" placeholder="12 digit UTR"><button class="btn" data-a="utr" data-id="'+e.k+'">UTR bhejo</button>')+'</div>').join('')};
const prefOf=s=>(s.lunch==='both'?'L:Dono':s.lunch==='chawal'?'L:Chawal':'L:Roti')+' | '+(s.dinner==='both'?'D:Dono':s.dinner==='chawal'?'D:Chawal':'D:Roti')+(s.extraRoti>0?' +'+s.extraRoti+'R':'');
const pRow=(e,v)=>'<div class="row"><div><b>'+esc(e.n)+'</b>'+(e.it?'<div class="s" style="color:var(--o);font-weight:600">🍛 '+esc(e.it)+'</div>':'')+'<div class="s">'+esc(e.d)+' · '+inr(e.a)+' · '+(e.pay==='online'?'UPI':'Cash')+'</div>'+(e.u?'<div class="s">UTR: <b>'+esc(e.u)+'</b></div>':'')+'</div><div>'+(v?'<button class="btn sm r" data-a="badu" data-id="'+e.k+'">Galat</button>':'<button class="btn sm g" data-a="'+e.rem+'" data-id="'+e.id+'">WhatsApp</button>')+'<button class="btn sm" data-a="'+e.paid+'" data-id="'+e.id+'">Paid ✓</button></div></div>';
const V={
plan:()=>{
const t=D0();let at=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k));if(p&&q>0)at+=(k.endsWith('h')?Math.round(p.p*.6):p.p)*q});
const acct=ME?('<div class="card" style="border-left:4px solid var(--g)"><div class="row" style="border:0"><div><b>👤 '+esc(ME.name)+'</b><div class="s">📞 '+esc(ME.phone)+' · Logged in ✅</div></div><button class="btn sm r" data-a="logout">Logout</button></div></div>'):('<div class="card"><h3>👤 Customer Login</h3><div class="s">Login karo — details auto-fill hongi.</div><input id="lname" placeholder="Naam"><input id="lphone" type="tel" maxlength="10" placeholder="10 digit phone"><button class="btn g" data-a="login">Login karo</button></div>');

return '<div style="height:14px"></div>'+dash+grid+conf+sheet+verf+pend+'<div class="card"><h3>🛍 Products</h3><input id="pn" placeholder="Naam"><input id="pp" type="number" placeholder="Price"><input id="pc" placeholder="Category"><button class="btn" data-a="addp">Product jodo</button>'+S.prod.map(p=>'<div class="row"><div>'+esc(p.n)+'<div class="s">'+inr(p.p)+' · '+esc(p.c)+'</div></div><div><button class="btn sm '+(p.s?'g':'r')+'" data-a="stock" data-id="'+p.id+'">'+(p.s?'Stock':'Khatam')+'</button><button class="btn sm r" data-a="delp" data-id="'+p.id+'">✕</button></div></div>').join('')+'</div><button class="btn" data-a="out">Owner se bahar</button><button class="btn r" data-a="reset">Reset sab data</button>'}
};
const T=[['plan','📱','Plan'],['shop','🛒','Shop'],['kitchen','🧑‍','Kitchen'],['delivery','🛵','Delivery'],['owner','💼','Owner']];
function render(){if(!OK&&tab!=='plan'&&tab!=='shop')tab='plan';$('#v').innerHTML=V[tab]();$('#ht').textContent=({plan:'Aaj ka Plan',shop:'Shop',kitchen:'Aaj Ka Khana',delivery:'Aaj Ka Route',owner:'Owner Dashboard'})[tab];$('#nav').innerHTML=T.filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>'<div class="'+(x[0]===tab?'on':'')+'" data-a="tab" data-v="'+x[0]+'"><i>'+x[1]+'</i>'+x[2]+'</div>').join('')}
const need=()=>{if(!F.name||!F.phone){alert('Naam aur phone daalo');return 1}if(!/q=-?\d/.test(F.map||'')){alert('Location zaroori hai. GPS wala button dabao');return 1}};
function addon(sub){const items=[];let total=0;Object.entries(C).forEach(([k,q])=>{if(!Number.isInteger(q)||q<=0)return;const p=S.prod.find(x=>x.id===parseInt(k,10));if(!p||!p.s)return;const h=k.endsWith('h');if(h&&!p.h)return;const price=h?Math.round(p.p*0.6):p.p;items.push({n:p.n+(h?' (Half)':''),q:q,p:price});total+=price*q});if(!items.length)return 0;S.orders.push({id:Date.now(),sid:sub.id,name:sub.name,phone:sub.phone,area:sub.area,addr:sub.addr,map:sub.map,items:items,total:total,pay:sub.pay,paid:0,dlv:0,t:new Date().toLocaleString()});C={};return total}
const mk=tr=>{if(need())return;const s={id:Date.now(),name:F.name,phone:F.phone.replace(/\D/g,'').slice(-10),area:F.area||'Other',addr:F.addr,map:F.map,type:F.type,days:tr?1:+F.days,half:+F.half,start:F.start,price:tr?0:pr(),pay:F.pay,paid:tr?1:0,skip:[],trial:tr?1:0,lunch:F.lunch,dinner:F.dinner,extraRoti:F.extraRoti};const ad=addon(s);S.subs.push(s);if(!tr)MY.push('s'+s.id);saveMY();save();alert(tr?'1 din free trial shuru!':'Plan ban gaya: '+inr(s.price));if(!tr&&F.pay==='online')location.href=upi(s.price+ad)};
const A={
oview:v=>{OVIEW=v;render()},
login:()=>{const ne=$('#lname'),pe2=$('#lphone');const n=ne?ne.value.trim():'';const p=pe2?pe2.value.replace(/\D/g,'').slice(-10):'';if(!n||p.length<10){alert('Naam aur 10 digit phone daalo');return}ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();alert('Login ho gaya! Namaste '+n+' 🙏')},
logout:()=>{ME=null;saveME();render();alert('Logout ho gaya')},
cat:v=>{SCAT=v;render()},
goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
vo:()=>{VO=VO?0:1;render()},
utr:(v,k,id)=>{const el=$('#u'+id);const c=el?el.value.replace(/\s/g,''):'';if(!/^\d{12}$/.test(c)){alert('12 digit UTR daalo');return}const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(!s)return;s.utr=c;S.orders.forEach(o=>{if(o.sid===s.id)o.utr=c})}else{const o=S.orders.find(x=>x.id==n);if(!o)return;o.utr=c}save();alert('UTR mil gaya ✓')},
badu:(v,k,id)=>{const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(s){s.utr='';S.orders.forEach(o=>{if(o.sid===s.id)o.utr=''})}}else{const o=S.orders.find(x=>x.id==n);if(o)o.utr=''}save()},
paidS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const lo=S.orders.filter(o=>o.sid===s.id&&!o.paid);const amt=s.price+lo.reduce((a,o)=>a+o.total,0);if(!confirm(s.name+': '+inr(amt)+' mil gaye?'))return;s.paid=1;lo.forEach(o=>{o.paid=1});S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:s.name,amt:amt,mode:s.pay,utr:s.utr||'',kind:'Plan'});save()},
paidO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(!o)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:o.name,amt:o.total,mode:o.pay,utr:o.utr||'',kind:'Shop'});save()},
remS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s)wa(s.phone,'Namaste '+s.name+'! 🙏\nAapka '+inr(due(s))+' pending hai.\nUPI: '+UPI)},
remO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o)wa(o.phone,'Namaste '+o.name+'! 🙏\nAapke order ka '+inr(o.total)+' pending hai.\nUPI: '+UPI)},
tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const dv=v==='delivery';const x=prompt(dv?'Delivery PIN daalo':'Owner PIN daalo');if(dv?(!x||(x!==DPIN&&x!==OPIN)):(x!==OPIN)){if(x!==null)alert('Galat PIN');return}OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}}if(v==='owner')OVIEW='dash';tab=v;render()},
gps:()=>{if(!navigator.geolocation){alert('GPS nahi hai');return}navigator.geolocation.getCurrentPosition(p=>{F.map='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);render();alert('Location mil gayi ✓')},e=>alert('Location nahi mili. Phone ka Location ON karo.'),{enableHighAccuracy:true,timeout:15000})},
set:(v,k)=>{F[k]=v;render()},
join:()=>mk(0),trial:()=>mk(1),
inc:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=Math.min(4,(F.extraRoti||0)+1);render()}else{C[id]=(C[id]||0)+1;render()}},
dec:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=Math.max(0,(F.extraRoti||0)-1);render()}else{C[id]=Math.max(0,(C[id]||0)-1);render()}},
order:()=>{if(need())return;const it=[];let total=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k));if(!p||q<1)return;const h=k.endsWith('h');const pp=h?Math.round(p.p*.6):p.p;it.push({n:p.n+(h?' (Half)':''),q:q,p:pp});total+=pp*q});if(!it.length){alert('Cart khali hai');return}S.orders.push({id:Date.now(),name:F.name,phone:F.phone.replace(/\D/g,'').slice(-10),area:F.area||'Other',addr:F.addr,map:F.map,items:it,total:total,pay:F.pay,paid:0,dlv:0,t:new Date().toLocaleString()});MY.push('o'+S.orders[S.orders.length-1].id);saveMY();C={};save();alert('Order ho gaya: '+inr(total));if(F.pay==='online')location.href=upi(total)},
skip:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const d=iso(add(D0(),1));const i=s.skip.indexOf(d);if(i>=0)s.skip.splice(i,1);else s.skip.push(d);save()},
done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save()},
odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.dlv=1;save()}},
menu:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const t=add(D0(),1);wa(s.phone,'Namaste '+s.name+'! 🙏\nKal ka menu: '+mf(t,s.type))},
addp:()=>{const n=$('#pn').value.trim(),p=+$('#pp').value,c=$('#pc').value.trim()||'Other';if(!n||!p){alert('Naam aur price daalo');return}S.prod.push({id:Date.now(),n:n,p:p,c:c,s:1,h:0});save()},
stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s?0:1;save()}},
delp:(v,k,id)=>{if(confirm('Delete?')){S.prod=S.prod.filter(x=>x.id!=id);save()}},
out:()=>{OK=0;try{sessionStorage.removeItem('udok')}catch(e){}tab='plan';render()},
reset:()=>{if(confirm('Sab data delete? Pakka?')){S={prod:SEED,subs:[],orders:[],done:{},pays:[]};save()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){alert('Error: '+x.message)}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f)F[f]=e.target.value;if(e.target.id==='sq'){SQ=e.target.value;const el=$('#pl');if(el)el.innerHTML=shopList()}});
function ologin(){const x=prompt('Owner PIN daalo');if(x===OPIN){OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}tab='owner';render()}else if(x!==null)alert('Galat PIN')}
let hc=0;document.querySelector('header').addEventListener('click',()=>{hc++;if(hc>=5){hc=0;ologin()}});
render();
if(location.hash==='#owner')ologin();
if(location.hash==='#delivery'){tab='delivery';A.tab('delivery')}
</script></body></html>
