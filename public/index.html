  --bg: #FAFAFA; --text: #1A1A1A; --muted: #6B7280; --card: #FFFFFF;
  --line: #F3F4F6; --success: #10B981; --danger: #EF4444; --warning: #F59E0B; --info: #3B82F6;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.08); --shadow-xl: 0 24px 48px rgba(0,0,0,0.12);
  --glass: rgba(255, 255, 255, 0.85); --glass-dark: rgba(255, 255, 255, 0.1);
}

[data-theme="dark"] {
  --bg: #0A0A0A; --text: #F9FAFB; --muted: #9CA3AF; --card: #161616;
  --line: #2A2A2A; --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4); --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
  --shadow-xl: 0 24px 48px rgba(0,0,0,0.6); --glass: rgba(22, 22, 22, 0.85);
}

* {

  margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg); color: var(--text); padding-bottom: 90px; font-weight: 500;
  min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s;
  background-image: linear-gradient(rgba(255, 107, 53, 0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 107, 53, 0.02) 1px, transparent 1px);
  background-size: 50px 50px; background-attachment: fixed;
}

/* Loading Screen */
.loading-screen {
  position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.6s ease;
}
.loading-screen.hide { opacity: 0; pointer-events: none; }
.loader {
  width: 60px; height: 60px; border: 4px solid var(--line); border-top: 4px solid var(--o);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(40px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

/* Header */
header {
  background: linear-gradient(135deg, var(--g) 0%, var(--g-dark) 100%); color: #fff;
  padding: 28px 20px 70px; border-radius: 0 0 40px 40px; position: relative;
  overflow: hidden; box-shadow: var(--shadow-xl);
}
header::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, rgba(255,107,53,0.3), transparent 60%);
  pointer-events: none; z-index: 1;
}
header .logo {
  font-size: 11px; letter-spacing: 3px; font-weight: 800; color: #FCD34D;
  text-transform: uppercase; position: relative; z-index: 3;
}
header h1 {
  font-size: 30px; font-weight: 900; margin-top: 6px; position: relative; z-index: 3;
  text-shadow: 0 4px 12px rgba(0,0,0,0.4);
}
header .tagline {
  font-size: 14px; opacity: 0.9; margin-top: 6px; position: relative; z-index: 3;
}
#canvas-container {
  position: absolute; right: 10px; top: 15px; width: 130px; height: 130px;
  z-index: 2; pointer-events: none;
}
.header-wave {
  position: absolute; bottom: -1px; left: 0; width: 100%; height: 50px; fill: var(--bg);
  z-index: 3;
}

/* Main Container */
#v { padding: 0 16px; margin-top: -30px; position: relative; z-index: 1; perspective: 1200px; }

/* Cards */
.card-3d { transform-style: preserve-3d; transition: transform 0.15s ease-out, box-shadow 0.3s ease; will-change: transform; }
.card-3d .card-content { transform: translateZ(25px); }
.card-3d::before {
  content: ''; position: absolute; inset: 0; border-radius: 24px;
  background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.2), transparent 60%);
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2;
}
.card-3d:hover::before { opacity: 1; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 28px;
  padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow-md);
  animation: rise 0.6s ease both; position: relative; overflow: hidden;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
}
.card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.card h3 {
  color: var(--g); font-size: 20px; font-weight: 800; margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
[data-theme="dark"] .card h3 { color: #4ADE80; }
.s { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-box {
  background: linear-gradient(135deg, var(--g) 0%, var(--g-light) 100%); color: #fff;
  border-radius: 20px; padding: 18px; text-align: center; box-shadow: var(--shadow-md);
  transition: transform 0.3s ease;
}
.stat-box:hover { transform: translateY(-4px) scale(1.02); }
.stat-box.orange { background: linear-gradient(135deg, var(--o) 0%, var(--o-dark) 100%); }
.stat-box.purple { background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%); }
.stat-box.blue { background: linear-gradient(135deg, #3B82F6 0%, #1E40AF 100%); }
.stat-box .val { font-size: 26px; font-weight: 900; margin-bottom: 4px; }
.stat-box .lbl { font-size: 11px; opacity: 0.9; font-weight: 600; }

/* Buttons */
.btn {
  padding: 16px 24px; border-radius: 18px; border: none; font-weight: 700;
  font-size: 16px; cursor: pointer; width: 100%; margin-top: 12px;
  background: linear-gradient(135deg, var(--o) 0%, var(--o-dark) 100%); color: #fff;
  box-shadow: 0 6px 20px rgba(232, 93, 4, 0.4); transition: all 0.2s;
  position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.96); }
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
  transform: translateX(-100%); transition: transform 0.6s;
}
.btn:hover::after { transform: translateX(100%); }
.btn.g { background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%); color: #065F46; border: 1px solid #A7F3D0; }
.btn.r { background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%); color: #991B1B; border: 1px solid #FECACA; }
.btn.b { background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%); color: #1E40AF; border: 1px solid #BFDBFE; }
.btn.sm { padding: 10px 18px; font-size: 14px; width: auto; margin: 0; border-radius: 14px; }

/* Inputs */
input, select, textarea {
  width: 100%; padding: 16px 18px; border: 2px solid var(--line); border-radius: 18px;
  margin: 8px 0 14px; font-size: 15px; background: var(--bg); color: var(--text);
  font-family: inherit; transition: all 0.2s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--o); box-shadow: 0 0 0 6px rgba(255, 107, 53, 0.15);
}

/* Navigation */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass);
  backdrop-filter: blur(20px) saturate(200%); border-top: 1px solid rgba(255,255,255,0.15);
  display: flex; justify-content: space-around; padding: 12px 0 max(16px, env(safe-area-inset-bottom));
  z-index: 100; box-shadow: 0 -8px 32px rgba(0,0,0,0.1);
}
.nav div {
  text-align: center; font-size: 10px; font-weight: 700; color: var(--muted);
  flex: 1; cursor: pointer; padding: 8px 4px; border-radius: 16px; transition: all 0.3s;

.nav div.on { color: var(--o); background: rgba(255, 107, 53, 0.1); transform: translateY(-8px); }
.nav img {
  width: 26px; height: 26px; border-radius: 8px; object-fit: cover;
  margin: 0 auto 6px; display: block; border: 2px solid transparent;

.nav div.on img { transform: scale(1.15); border-color: var(--o); }

/* Items */
.item {

}
.item:last-child { border-bottom: 0; }
.item-img {

}
.item:hover .item-img { transform: scale(1.08); }
.item-info { flex: 1; min-width: 0; }
.item-info b { font-size: 16px; font-weight: 700; display: block; margin-bottom: 4px; }
.price { color: var(--o); font-weight: 800; font-size: 17px; }

.qty-ctrl {

  border-radius: 16px; padding: 6px; background: rgba(255, 107, 53, 0.05);

.qty-ctrl button {

}
.qty-ctrl button:active { transform: scale(0.9); background: var(--o-dark); }
.qty-ctrl b { min-width: 28px; text-align: center; font-weight: 800; font-size: 16px; }

/* Cart Bar */
.cart-bar {
  position: fixed; bottom: 90px; left: 16px; right: 16px; background: var(--glass);
  backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px; padding: 18px 24px; display: flex; justify-content: space-between;
  align-items: center; z-index: 99; box-shadow: var(--shadow-lg); animation: rise 0.4s ease;
}

/* Toast */
.toast {
  position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #1F2937; color: #fff; padding: 16px 32px; border-radius: 50px;
  font-weight: 700; font-size: 15px; box-shadow: 0 16px 48px rgba(0,0,0,0.3);
  z-index: 1000; opacity: 0; transition: all 0.4s; max-width: 90%; text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }
.toast.success { background: var(--success); }

/* Badge */
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge.pending { background: #FEF3C7; color: #92400E; }
.badge.delivered { background: #D1FAE5; color: #065F46; }
.badge.active { background: #DBEAFE; color: #1E40AF; }
.badge.cancelled { background: #FEE2E2; color: #991B1B; }

/* Theme Toggle */
.theme-toggle {
  position: fixed; top: 20px; right: 20px; width: 48px; height: 48px;
  border-radius: 50%; background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center;
  justify-content: center; font-size: 22px; cursor: pointer; z-index: 101;
  box-shadow: var(--shadow-md); transition: all 0.3s;
}
.theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

/* FAB */
.fab {
  position: fixed; right: 20px; bottom: 100px; width: 60px; height: 60px;
  border-radius: 50%; background: linear-gradient(135deg, #25d366, #128c7e); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 30px;
  box-shadow: 0 12px 32px rgba(37, 211, 102, 0.5); z-index: 99;
  text-decoration: none; animation: float 3s ease-in-out infinite;
}
.fab:hover { transform: scale(1.1); }

/* Chips */
.chips {
  display: flex; gap: 10px; overflow-x: auto; padding: 6px 6px 16px;
  scrollbar-width: none; margin: 0 -6px;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex: none; border: 2px solid var(--line); background: var(--card);
  border-radius: 50px; padding: 10px 20px; font-weight: 700; font-size: 14px;
  color: var(--text); cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.chips button.on {
  background: var(--o); color: #fff; border-color: var(--o);
  box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
}

/* Voice Button */
.voice-btn {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: var(--o); color: white; border: none; border-radius: 14px;
  width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 20px; z-index: 10;
}
.voice-btn.listening { animation: pulse 1s infinite; background: var(--danger); }

/* Responsive */
@media (max-width: 480px) {
  header h1 { font-size: 26px; }
  .card { padding: 20px; border-radius: 24px; }
  #canvas-container { width: 110px; height: 110px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const pl1 = new THREE.PointLight(0xFCD34D, 1.5, 10);
  pl1.position.set(3, 3, 3);
  scene.add(pl1);
  const pl2 = new THREE.PointLight(0xFF6B35, 1, 10);
  pl2.position.set(-3, 2, 2);
  scene.add(pl2);
  
  const animate = () => {
    requestAnimationFrame(animate);
    if (currentModel) {
      currentModel.rotation.y += 0.015;
      currentModel.position.y = Math.sin(Date.now() * 0.002) * 0.1;
    }
    renderer.render(scene, camera);
  };
  animate();
};

const switch3DModel = (type) => {
  if (!scene || !currentModel) return;
  scene.remove(currentModel);
  currentModel = type === 'nv' ? nvModel : vegModel;
  scene.add(currentModel);
};

const render = () => {
  if (!OK && !['plan', 'shop'].includes(tab)) tab = 'plan';
  $('#v').innerHTML = VIEWS[tab]();
  $('#ht').textContent = { plan: 'Aaj ka Plan', shop: 'Shop', kitchen: 'Kitchen', delivery: 'Delivery', owner: 'Admin Panel' }[tab];
  
  const navItems = [
    ['plan', '🍱 Plan', IMAGES.thali],
    ['shop', '🛒 Shop', IMAGES.grocery],
    ['kitchen', '👨‍🍳 Kitchen', IMAGES.kitchen],
    ['delivery', '🛵 Delivery', IMAGES.scooter],
    ['owner', '👤 Admin', IMAGES.money]
  ];
  
  $('#nav').innerHTML = navItems.filter(x => OK || x[0] === 'plan' || x[0] === 'shop')
    .map(x => `<div class="${x[0] === tab ? 'on' : ''}" data-a="tab" data-v="${x[0]}"><img src="${x[2]}" onerror="this.style.opacity=0">${x[1]}</div>`).join('');
    
  // 3D Tilt Effect
  $$('.card-3d').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);
      const cx = r.width / 2, cy = r.height / 2;
      const rx = ((y - cy) / cy) * -5, ry = ((x - cx) / cx) * 5;
      card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.02, 1.02, 1.02)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
    });
  });
  
  setTimeout(() => $('#loadingScreen').classList.add('hide'), 600);
};

// ============================================================
// 8. ACTIONS
// ============================================================
const ACTIONS = {
  tab: v => {
    if (['kitchen', 'delivery', 'owner'].includes(v) && !OK) {
      const pin = prompt('Owner PIN:');
      if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); showToast('🔓 Admin Access Granted'); }
      else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); return; }
    }
    tab = v; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  set: (v, k) => { F[k] = v; render(); },
  inc: (v, k, id) => { vibrate(); C[id] = (C[id] || 0) + 1; render(); },
  dec: (v, k, id) => { vibrate(); C[id] = Math.max(0, (C[id] || 0) - 1); if (C[id] === 0) delete C[id]; render(); },
  cat: v => { SCAT = v; render(); },
  
  voice: () => {
    vibrate();
    if ('webkitSpeechRecognition' in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.start();
      const btn = $('#voiceBtn');
      if (btn) btn.classList.add('listening');
      showToast('🎤 Bol rahe hain...');
      recognition.onresult = (e) => {
        SQ = e.results[0][0].transcript;
        render();
        showToast(`🔍 Search: ${SQ}`);
      };
      recognition.onerror = () => { showToast('❌ Awaaz nahi suni', 'error'); if (btn) btn.classList.remove('listening'); };
      recognition.onend = () => { if (btn) btn.classList.remove('listening'); };
    } else { showToast('❌ Voice not supported', 'error'); }
  },
  
  join: () => {
    vibrate();
    if (!F.name || F.phone.length !== 10) { showToast('❌ Naam aur 10 digit phone daalo', 'error'); return; }
    const price = PRICING[F.type][F.days] || 2899;
    S.subs.push({ id: Date.now(), name: F.name, phone: cleanPhone(F.phone), area: F.area, type: F.type, days: +F.days, startDate: todayStr(), price: price, status: 'active', extraRoti: 0 });
    save(); showToast('✅ Plan ban gaya!');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=🍱 *Naya Plan*%0A👤 ${F.name}%0A📱 ${F.phone}%0A🍽️ ${F.type} · ${F.days} din%0A💰 ₹${price}`, '_blank');
    F.name = ''; F.phone = ''; F.area = '';
  },
  
  order: () => {
    vibrate();
    if (!F.name || F.phone.length !== 10) { showToast('❌ Naam aur phone daalo', 'error'); return; }
    const items = []; let total = 0;
    Object.entries(C).forEach(([k, q]) => { const p = S.prod.find(x => x.id == k); if (p && q > 0) { items.push({ n: p.n, q, p: p.p }); total += p.p * q; } });
    if (!items.length) { showToast('❌ Cart khali hai', 'error'); return; }
    S.orders.push({ id: Date.now(), name: F.name, phone: cleanPhone(F.phone), area: F.area, items, total, status: 'pending', date: todayStr() });
    C = {}; save(); showToast('✅ Order ho gaya!');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *Naya Order*%0A👤 ${F.name}%0A📱 ${F.phone}%0A📦 ${items.map(i=>`${i.n} x${i.q}`).join(', ')}%0A💰 ₹${total}`, '_blank');
  },

  addProduct: () => {
    vibrate();
    const name = $('#newPName')?.value, price = parseInt($('#newPPrice')?.value), cat = $('#newPCat')?.value || 'General', nv = parseInt($('#newPType')?.value) || 0;
    if (!name || !price) { showToast('❌ Name aur Price daalo', 'error'); return; }
    S.prod.push({ id: Date.now(), n: name, p: price, c: cat, img: IMAGES.grocery, nv: nv });
    save(); showToast('✅ Product added!');
  },
  
  delProd: (v, k, id) => {
    vibrate();
    if (confirm('Delete this product?')) { S.prod = S.prod.filter(p => p.id != id); save(); showToast('🗑️ Deleted'); }
  },

  addExpense: () => {
    vibrate();
    const name = $('#expName')?.value, amount = parseInt($('#expAmount')?.value);
    if (!name || !amount) { showToast('❌ Name aur Amount daalo', 'error'); return; }
    S.expenses.push({ id: Date.now(), name: name, amount: amount, date: todayStr() });
    save(); showToast('✅ Expense added!');
  },

  markDelivered: (v, k, id) => {
    vibrate();
    const order = S.orders.find(o => o.id == id);
    if (order) { order.status = 'delivered'; save(); showToast('✅ Delivered!'); }
  },
  
  out: () => { OK = 0; sessionStorage.removeItem('udok'); tab = 'plan'; render(); showToast('🚪 Logged out'); }
};

// ============================================================
// 9. EVENT LISTENERS
// ============================================================
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  vibrate();
  const action = ACTIONS[btn.dataset.a];
  if (action) { try { action(btn.dataset.v, btn.dataset.k, btn.dataset.id); } catch (err) { showToast('❌ Error', 'error'); } }
});

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) { F[field] = e.target.value; if (field === 'phone') F.phone = cleanPhone(F.phone); }
  if (e.target.id === 'sq') { SQ = e.target.value; if (tab === 'shop') render(); }
});

let tapCount = 0;
$('#mainHeader').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN:');
    if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); tab = 'owner'; render(); showToast('🔓 Admin Access Granted'); }
    else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); }
  }
});

// Theme Toggle
const initTheme = () => {
  const saved = localStorage.getItem('ud_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('#themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
};
$('#themeToggle').addEventListener('click', () => {
  vibrate();
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ud_theme', next);
  $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});

// ============================================================
// 10. INITIALIZATION
// ============================================================
initTheme();
init3D();
render();
console.log('🍱 Namaste Udala 6.0 Ultimate Suite Loaded!');
