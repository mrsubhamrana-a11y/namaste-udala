<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Namaste Udala - Premium Tiffin Service & Grocery Delivery">
<meta name="theme-color" content="#14452a">
<title>🍱 Namaste Udala - Tiffin & Grocery</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --o:#e8590c;
  --g:#15543b;
  --bg:#fff9f0;
  --text:#2b1d12;
  --muted:#8a7561;
  --card:#fff;
  --line:#f0e3d3;
  --success:#06d6a0;
  --danger:#ef476f;
  --warning:#ffd166;
  --info:#118ab2;
  --shadow:rgba(0,0,0,.1);
}

[data-theme="dark"]{
  --bg:#1a1a1a;
  --text:#f5f5f5;
  --muted:#a0a0a0;
  --card:#2d2d2d;
  --line:#404040;
  --shadow:rgba(0,0,0,.3);
}

*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:var(--bg);
  color:var(--text);
  padding-bottom:84px;
  font-weight:500;
  position:relative;
  min-height:100vh;
  transition:background .3s,color .3s;
  overflow-x:hidden;
}

/* Loading Screen */
.loading-screen{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:9999;
  transition:opacity .3s;
}

.loading-screen.hide{
  opacity:0;
  pointer-events:none;
}

.loader{
  width:60px;
  height:60px;
  border:4px solid var(--line);
  border-top:4px solid var(--o);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

/* Animations */
@keyframes blob{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(10px,-20px) scale(1.1)}
}

@keyframes rise{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

@keyframes slideIn{
  from{transform:translateX(-100%);opacity:0}
  to{transform:translateX(0);opacity:1}
}

@keyframes shimmer{
  0%{background-position:-1000px 0}
  100%{background-position:1000px 0}
}

@keyframes foodPop{
  0%{transform:translateY(0) scale(1) rotate(0deg)}
  25%{transform:translateY(-40px) scale(1.2) rotate(20deg)}
  50%{transform:translateY(-28px) scale(0.95) rotate(-15deg)}
  75%{transform:translateY(-8px) scale(1.05) rotate(8deg)}
  100%{transform:translateY(0) scale(1) rotate(0deg)}
}

@keyframes splash{
  0%{transform:translate(0,0) scale(0.8);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}

@keyframes steam{
  0%{opacity:0;transform:translateY(8px) scaleY(.6)}
  40%{opacity:.85}
  100%{opacity:0;transform:translateY(-25px) scaleY(1.5)}
}

/* Background Decorations */
body::before,body::after{
  content:'';
  position:fixed;
  width:300px;
  height:300px;
  background:radial-gradient(circle,rgba(232,89,12,.1),transparent 70%);
  border-radius:50%;
  z-index:0;
  pointer-events:none;
  animation:blob 15s ease-in-out infinite;
}

body::before{
  left:-100px;
  top:20%;
}

body::after{
  right:-100px;
  bottom:20%;
  animation-delay:7s;
  background:radial-gradient(circle,rgba(21,84,59,.1),transparent 70%);
}

/* Header */
header{
  background:linear-gradient(135deg,#1f5f3a,#14452a);
  color:#fff;
  padding:20px;
  border-radius:0 0 32px 32px;
  box-shadow:0 10px 40px rgba(0,0,0,.2);
  position:relative;
  overflow:hidden;
  z-index:2;
}

header::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);
  transform:translateX(-100%);
  animation:shimmer 3s infinite;
}

header .logo{
  font-size:11px;
  letter-spacing:3px;
  font-weight:900;
  color:#fcc419;
  margin-bottom:4px;
}

header h1{
  font-size:26px;
  font-weight:900;
  text-shadow:0 3px 8px rgba(0,0,0,.35);
  position:relative;
  z-index:1;
}

header .tagline{
  font-size:13px;
  opacity:.9;
  margin-top:4px;
}

header .emoji{
  position:absolute;
  right:20px;
  top:20px;
  font-size:50px;
  opacity:.3;
  animation:float 3s ease-in-out infinite;
}

/* Main Container */
#v{
  padding:0 14px;
  margin-top:-16px;
  position:relative;
  z-index:1;
}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  position:relative;
  box-shadow:0 2px 4px var(--shadow),0 10px 20px rgba(0,0,0,.05);
  transition:transform .3s,box-shadow .3s;
  animation:rise .4s ease both;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 8px var(--shadow),0 15px 30px rgba(0,0,0,.1);
}

.card h3{
  color:var(--g);
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.s{
  font-size:12px;
  color:var(--muted);
}

/* Buttons */
.btn{
  padding:12px 20px;
  border-radius:14px;
  border:none;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:all .2s;
  width:100%;
  margin-top:8px;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#f0703a,#e8590c);
  color:#fff;
  box-shadow:0 4px 0 #b3400f,0 12px 22px rgba(232,89,12,.35);
}

.btn:active{
  transform:translateY(3px);
  box-shadow:0 1px 0 #b3400f,0 6px 12px rgba(232,89,12,.3);
}

.btn::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.3) 50%,transparent 60%);
  transform:translateX(-100%);
  transition:transform .5s;
}

.btn:hover::after{
  transform:translateX(100%);
}

.btn.g{
  background:linear-gradient(180deg,#eef7ee,#dcefdc);
  color:#1f7a3f;
  box-shadow:0 3px 0 #b7d4b7,0 8px 16px rgba(31,122,63,.18);
}

.btn.r{
  background:linear-gradient(180deg,#fdeeee,#fbdcdc);
  color:#c92a2a;
  box-shadow:0 3px 0 #e5bcbc,0 8px 16px rgba(201,42,42,.18);
}

.btn.b{
  background:linear-gradient(180deg,#4b9bff,#2563eb);
  color:#fff;
  box-shadow:0 3px 0 #1d4ed8,0 8px 16px rgba(37,99,235,.25);
}

.btn.sm{
  padding:8px 14px;
  font-size:12px;
  width:auto;
  margin:0 0 0 4px;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* Inputs */
input,textarea,select{
  width:100%;
  padding:12px;
  border:1.5px solid var(--line);
  border-radius:12px;
  margin:5px 0;
  font-size:14px;
  background:var(--card);
  color:var(--text);
  transition:border .2s,box-shadow .2s;
}

input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--o);
  box-shadow:0 0 0 3px rgba(232,89,12,.1);
}

textarea{
  min-height:100px;
  font-family:monospace;
  resize:vertical;
}

/* Segmented Control */
.seg{
  display:flex;
  gap:6px;
  margin:6px 0;
}

.seg button{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1.5px solid var(--line);
  background:var(--card);
  font-weight:700;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
  transition:all .2s;
}

.seg button.on{
  background:var(--o);
  color:#fff;
  border-color:var(--o);
  transform:scale(1.05);
}

/* Navigation */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  padding:8px 0 max(10px,env(safe-area-inset-bottom));
  z-index:100;
  box-shadow:0 -10px 30px rgba(0,0,0,.1);
}

[data-theme="dark"] .nav{
  background:rgba(45,45,45,.95);
}

.nav div{
  text-align:center;
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  flex:1;
  cursor:pointer;
  transition:all .2s;
  padding:4px;
}

.nav div.on{
  color:var(--o);
  transform:scale(1.1);
}

.nav img{
  width:26px;
  height:26px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 2px;
  border:2px solid #fff;
  box-shadow:0 3px 6px rgba(0,0,0,.2);
}

.nav div.on img{
  border-color:var(--o);
}

/* Toast Notifications */
.toast{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--g);
  color:#fff;
  padding:12px 24px;
  border-radius:30px;
  font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
  z-index:1000;
  opacity:0;
  transition:all .3s;
  max-width:90%;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

.toast.error{
  background:var(--danger);
}

.toast.success{
  background:var(--success);
}

/* Badge */
.badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:var(--danger);
  color:#fff;
  font-size:10px;
  font-weight:900;
  padding:2px 6px;
  border-radius:10px;
  min-width:18px;
  text-align:center;
  animation:pulse 1s infinite;
}

/* Progress Bar */
.progress{
  height:8px;
  background:var(--line);
  border-radius:6px;
  overflow:hidden;
  margin:12px 0;
}

.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--o),#f59f00);
  transition:width .5s;
  position:relative;
}

.progress-bar::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shimmer 1.5s infinite;
}

/* Status Indicators */
.status{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:6px;
}

.status.online{
  background:var(--success);
  box-shadow:0 0 10px var(--success);
  animation:pulse 2s infinite;
}

.status.offline{
  background:var(--muted);
}

/* Veg/Non-veg indicators */
.vi{
  display:inline-block;
  width:16px;
  height:16px;
  border:2px solid #16a34a;
  border-radius:4px;
  position:relative;
  vertical-align:-3px;
  background:#fff;
}

.vi::after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:50%;
  background:#16a34a;
}

.vi.nv{
  border-color:#dc2626;
}

.vi.nv::after{
  background:#dc2626;
}

/* Grid Layouts */
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

/* Stats Cards */
.stat-card{
  background:linear-gradient(135deg,var(--g),#1f5f3a);
  color:#fff;
  border-radius:16px;
  padding:16px;
  text-align:center;
  box-shadow:0 8px 16px rgba(21,84,59,.3);
  transition:transform .2s;
}

.stat-card:hover{
  transform:translateY(-4px);
}

.stat-card .value{
  font-size:28px;
  font-weight:900;
  margin-bottom:4px;
}

.stat-card .label{
  font-size:11px;
  opacity:.9;
}

/* Product Item */
.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--line);
  transition:background .2s;
}

.item:hover{
  background:rgba(232,89,12,.05);
}

.item:last-child{
  border-bottom:0;
}

.item-img{
  width:60px;
  height:60px;
  border-radius:12px;
  object-fit:cover;
  background:var(--line);
  flex-shrink:0;
}

.item-info{
  flex:1;
  min-width:0;
}

.item-info b{
  font-size:14px;
  display:block;
  margin-bottom:4px;
}

.price{
  color:var(--o);
  font-weight:900;
  font-size:15px;
}

.mrp{
  text-decoration:line-through;
  color:var(--muted);
  font-size:11px;
  margin-right:6px;
}

/* Quantity Control */
.qty-ctrl{
  display:flex;
  align-items:center;
  gap:8px;
  border:1.5px solid var(--o);
  border-radius:12px;
  padding:4px;
  background:rgba(232,89,12,.05);
}

.qty-ctrl button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:var(--o);
  color:#fff;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  transition:all .2s;
}

.qty-ctrl button:active{
  transform:scale(.9);
}

.qty-ctrl b{
  min-width:24px;
  text-align:center;
  color:var(--o);
  font-weight:900;
}

/* Cart Bar */
.cart-bar{
  position:fixed;
  bottom:80px;
  left:14px;
  right:14px;
  background:linear-gradient(135deg,var(--g),#1f5f3a);
  color:#fff;
  border-radius:20px;
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:99;
  box-shadow:0 14px 30px rgba(20,69,42,.4);
  animation:rise .3s;
}

/* Kadhai Animation */
.kd{
  position:relative;
  width:130px;
  height:120px;
  margin:0 auto;
}

.kd .food-chunk{
  position:absolute;
  left:50%;
  top:15px;
  width:50px;
  height:50px;
  margin-left:-25px;
  border-radius:50%;
  overflow:hidden;
  z-index:5;
  animation:foodPop 2s cubic-bezier(0.34,1.56,0.64,1) infinite;
  box-shadow:0 8px 16px rgba(0,0,0,.5),0 0 20px rgba(232,100,28,.4);
  border:2px solid rgba(255,255,255,.3);
}

.kd .food-chunk img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.kd .splash{
  position:absolute;
  width:8px;
  height:8px;
  background:#e8641c;
  border-radius:50%;
  z-index:6;
  opacity:0;
}

.kd .splash.s1{left:40%;top:35px;--tx:-20px;--ty:-30px;animation:splash 2s ease-out infinite .2s}
.kd .splash.s2{left:58%;top:35px;--tx:22px;--ty:-25px;animation:splash 2s ease-out infinite .3s}
.kd .splash.s3{left:50%;top:30px;--tx:0;--ty:-35px;animation:splash 2s ease-out infinite .4s}

.kd .steam{
  position:absolute;
  left:46%;
  top:0;
  width:7px;
  height:22px;
  border-radius:7px;
  background:linear-gradient(180deg,transparent,#ffffffd8);
  filter:blur(3px);
  opacity:0;
  animation:steam 2s ease-in-out infinite;
  z-index:7;
}

.kd .steam.s2{left:34%;animation-delay:.6s}
.kd .steam.s3{left:60%;animation-delay:1.2s}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
  padding:20px;
}

.modal.show{
  opacity:1;
  pointer-events:all;
}

.modal-content{
  background:var(--card);
  border-radius:20px;
  padding:24px;
  max-width:500px;
  width:100%;
  max-height:90vh;
  overflow-y:auto;
  transform:scale(.9);
  transition:transform .3s;
}

.modal.show .modal-content{
  transform:scale(1);
}

/* Chips */
.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 12px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chips button{
  flex:none;
  border:1.5px solid var(--line);
  background:var(--card);
  border-radius:24px;
  padding:8px 14px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  gap:6px;
}

.chips button.on{
  background:var(--o);
  color:#fff;
  border-color:var(--o);
}

/* Responsive */
@media(max-width:480px){
  .grid-2,.grid-3,.grid-4{
    grid-template-columns:1fr;
  }
  
  header h1{
    font-size:22px;
  }
  
  .card{
    padding:14px;
  }
}

@media(max-width:380px){
  .btn{
    font-size:13px;
    padding:10px 16px;
  }
}

/* Print Styles */
@media print{
  .nav,.toast,.loading-screen{
    display:none!important;
  }
  
  body{
    padding:0;
  }
}

/* Accessibility */
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

:focus-visible{
  outline:3px solid var(--o);
  outline-offset:2px;
}

/* Skeleton Loading */
.skeleton{
  background:linear-gradient(90deg,var(--line) 25%,rgba(240,227,211,.5) 50%,var(--line) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:8px;
}

/* Dark Mode Toggle */
.theme-toggle{
  position:fixed;
  top:20px;
  right:20px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--card);
  border:2px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  z-index:101;
  box-shadow:0 4px 12px var(--shadow);
  transition:all .3s;
}

.theme-toggle:hover{
  transform:scale(1.1);
}

/* Floating Action Button */
.fab{
  position:fixed;
  right:14px;
  bottom:96px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#25d366,#128c7e);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 8px 24px rgba(37,211,102,.4);
  z-index:99;
  cursor:pointer;
  transition:all .3s;
  animation:float 3s ease-in-out infinite;
}

.fab:hover{
  transform:scale(1.1);
}

/* Save Indicator */
.save-indicator{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--success);
  color:#fff;
  padding:8px 16px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  transition:opacity .3s;
  z-index:1001;
  pointer-events:none;
}

.save-indicator.show{
  opacity:1;
}

/* Chart Container */
.chart-container{
  position:relative;
  height:250px;
  margin:16px 0;
}

/* Empty State */
.empty-state{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

.empty-state .icon{
  font-size:64px;
  margin-bottom:16px;
  opacity:.5;
}

.empty-state h4{
  font-size:18px;
  margin-bottom:8px;
  color:var(--text);
}

/* Scrollbar */
::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-track{
  background:var(--line);
}

::-webkit-scrollbar-thumb{
  background:var(--o);
  border-radius:4px;
}

::-webkit-scrollbar-thumb:hover{
  background:#d94f0a;
}
</style>
</head>

<!-- Loading Screen -->

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#x27;');

const iso = d => {
  const date = new Date(d);
  return date.getFullYear() + '-' + 
    String(date.getMonth() + 1).padStart(2, '0') + '-' + 
    String(date.getDate()).padStart(2, '0');
};

const addDays = (d, n) => {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
};

const today = () => {

const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const cleanPhone = s => String(s || '').replace(/\D/g, '').slice(-10);

const debounce = (fn, delay) => {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), delay);
  };
};

const throttle = (fn, limit) => {
  let inThrottle;
  return (...args) => {
    if (!inThrottle) {
      fn(...args);
      inThrottle = true;
      setTimeout(() => inThrottle = false, limit);
    }
  };
};

const normalize = () => {
  S.prod = Array.isArray(S.prod) ? S.prod : [];
  S.subs = Array.isArray(S.subs) ? S.subs : [];
  S.orders = Array.isArray(S.orders) ? S.orders : [];
  S.done = S.done || {};
  S.pays = Array.isArray(S.pays) ? S.pays : [];
  S.mset = S.mset || {};
  S.kll = S.kll || '';
  S.cred = S.cred || {};
  S.refs = S.refs || {};
  S.plog = Array.isArray(S.plog) ? S.plog : [];
  S.log = Array.isArray(S.log) ? S.log : [];
  
  // Normalize products
  S.prod = S.prod.filter(p => p && p.id && p.n).map(p => ({
    ...p,
    n: String(p.n),
    p: clamp(+p.p || 0, 0, 100000),
    mrp: p.mrp ? clamp(+p.mrp || 0, 0, 100000) : null,
    s: p.s ? 1 : 0,
    h: p.h ? 1 : 0
  }));
  
  // Normalize subscriptions
  S.subs = S.subs.filter(s => s && s.id && s.name).map(s => ({
    ...s,
    name: String(s.name),
    phone: cleanPhone(s.phone),
    days: clamp(+s.days || 30, 1, 365),
    price: Math.max(0, +s.price || 0),
    type: s.type === 'nv' ? 'nv' : 'veg',
    half: s.half ? 1 : 0,
    skip: Array.isArray(s.skip) ? s.skip : [],
    lunch: ['roti', 'chawal', 'both'].includes(s.lunch) ? s.lunch : 'chawal',
    dinner: ['roti', 'chawal', 'both'].includes(s.dinner) ? s.dinner : 'roti',
    extraRoti: clamp(+s.extraRoti || 0, 0, 4),
    ts: s.ts || 0,
    start: s.start || iso(today())
  }));
  
  // Normalize orders
  S.orders = S.orders.filter(o => o && o.id && Array.isArray(o.items)).map(o => ({
    ...o,
    name: String(o.name || ''),
    phone: cleanPhone(o.phone),
    total: Math.max(0, +o.total || 0),
    items: o.items.filter(i => i && i.n).map(i => ({
      n: String(i.n),
      q: clamp(+i.q || 1, 1, 99),
      p: Math.max(0, +i.p || 0)
    })),
    ts: o.ts || 0,
    paid: o.paid ? 1 : 0,
    dlv: o.dlv ? 1 : 0
  }));
  
  // Normalize payments
  S.pays = S.pays.filter(p => p && p.name).map(p => ({
    ...p,
    amt: Math.max(0, +p.amt || 0),
    d: p.d || iso(today())
  }));
  
  // Normalize credits
  Object.keys(S.cred).forEach(k => {
    S.cred[k] = Math.max(0, +S.cred[k] || 0);
  });
};

const basePrice = (type, days) => {
  return PRICING[type][days] || Math.round(PRICING[type][30] / 30 * days);
};

const calculatePrice = () => {
  const dd = clamp(+F.days || 30, 1, 365);
  let b = basePrice(F.type, dd);
  let x = 0;
  
  if (F.lunch === 'both') x += 10 * dd;
  if (F.dinner === 'both') x += 10 * dd;
  x += clamp(F.extraRoti || 0, 0, 4) * 5 * dd;
  
  return +F.half ? Math.round((b + x) * 0.6) : (b + x);
};

const upiLink = amount => {
  return `upi://pay?pa=${CONFIG.upi}&pn=Namaste%20Udala&cu=INR&am=${Math.round(amount)}`;

const getRefCode = phone => 'NU' + (phone || '').slice(-4);

const getCredit = phone => (S.cred && S.cred[phone]) || 0;

const isRefActive = () => iso(today()) <= (S.refEnd || CONFIG.referralEnd);

const isEligible = days => (+days === 15 || +days === 30);

const isActive = (sub, date) => {
  const k = iso(date);
  const endDate = iso(addDays(new Date(sub.start + 'T12:00:00'), sub.days - 1));
  return k >= sub.start && k <= endDate;
};

const getDue = sub => {
  return sub.price + S.orders
    .filter(o => o.sid === sub.id && !o.paid)
    .reduce((a, o) => a + o.total, 0);
};

const getMenu = (date, type) => {
  const k = iso(date);
  const override = (S.mset || {})[k];
  
  if (override) {
    if (type === 'nv' && override.nv) return override.nv;
    if (type !== 'nv' && override.veg) return override.veg;
  }
  
  const w = date.getDay();
  
  if (type === 'nv') {
    if (w === 0) return '🍗 Chicken curry, roti, chawal';
    if (w === 3) return '🐟 Fish curry, roti, chawal';
    if (w === 5) return '🥚 Egg curry, roti, chawal';
    if (w === 6) return '🍗 Mutton special, roti, chawal';
  } else {
    if (w === 0) return '🧀 Paneer butter masala, roti, chawal';
    if (w === 3) return '🍄 Mushroom curry, roti, chawal';
    if (w === 5) return '🍮 Special veg thali + meetha';
    if (w === 6) return '🥘 Dal makhani + paneer, roti, chawal';
  }
  
  return '🥘 Dal, sabzi, roti, chawal';
};

  shop: () => {

    Object.entries(C).forEach(([k, q]) => {
      const p = S.prod.find(x => x.id === parseInt(k, 10));
      if (p && q > 0) {
        total += p.p * q;
        count += q;
        items.push(`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
          <span>${esc(p.n)} × ${q}</span>
          <b>${inr(p.p * q)}</b>
        </div>`);
      }
    });
    
    const categories = [...new Set(S.prod.filter(p => p.s).map(p => p.c))];
    
    // Filter products
    let filtered = S.prod.filter(p => p.s);
    if (VO) filtered = filtered.filter(p => !p.nv);
    if (SCAT !== 'all') filtered = filtered.filter(p => p.c === SCAT);
    if (SQ) {
      const q = SQ.toLowerCase();
      filtered = filtered.filter(p => p.n.toLowerCase().includes(q));
    }
    
    // Group by category
    const grouped = {};
    filtered.forEach(p => {
      grouped[p.c] = grouped[p.c] || [];
      grouped[p.c].push(p);
    });
    
    const productList = Object.entries(grouped).map(([cat, prods]) => `
      <div class="card">
        <h3>${esc(cat)}</h3>
        ${prods.map(renderProduct).join('')}

    `).join('') || `<div class="empty-state">
      <div class="icon">🔍</div>
      <h4>Kuch nahi mila</h4>
      <p class="s">Try different search or category</p>

    return `

          ${items.join('')}

            <span>Total</span>
            <span style="color:var(--o)">${inr(total)}</span>

          <button class="btn g" data-a="gps">📍 GPS Location lo</button>

  kitchen: () => {
    const t = today();
    const k = iso(t);
    const all = S.subs.filter(s => isActive(s, t));
    const active = all.filter(s => !s.skip.includes(k));
    
    const vegCount = active.filter(s => s.type === 'veg').length;
    const nvCount = active.filter(s => s.type === 'nv').length;
    const extraRoti = active.reduce((a, s) => a + (s.extraRoti || 0), 0);
    
    const countLunch = m => active.filter(s => (s.lunch || 'chawal') === m).length;
    const countDinner = m => active.filter(s => (s.dinner || 'roti') === m).length;
    
    let stats = '', list = [];
    
    if (KMEAL === 'subah') {
      stats = `<div class="grid-3">
        <div class="stat-card"><div class="value">${active.length}</div><div class="label">☕ Chai</div></div>
        <div class="stat-card"><div class="value">${active.length}</div><div class="label">🍞 Nashta</div></div>
        <div class="stat-card"><div class="value">${active.length}</div><div class="label">📦 Dabbe</div></div>
      </div>`;
      list = active.map(s => ({ sub: s, text: '🌅 Chai + nashta' }));
    } else if (KMEAL === 'lunch') {
      const rotiPcs = (countLunch('roti') + countLunch('both')) * 4;
      const chawalPlates = countLunch('chawal') + countLunch('both');
      stats = `<div class="grid-3">

        <div class="stat-card"><div class="value">${chawalPlates}</div><div class="label">🍚 Chawal</div></div>
        <div class="stat-card"><div class="value">${vegCount}/${nvCount}</div><div class="label">🥘 Curry</div></div>

      list = active.map(s => ({
        sub: s,
        text: `${s.lunch === 'both' ? '🫓🍚' : s.lunch === 'chawal' ? '🍚' : '🫓'} ${s.type === 'nv' ? '🍗' : '🥘'}`
      }));
    } else if (KMEAL === 'dinner') {

        <div class="stat-card"><div class="value">${rotiPcs}</div><div class="label">🫓 Roti</div></div>
        <div class="stat-card"><div class="value">${chawalPlates}</div><div class="label">🍚 Chawal</div></div>
        <div class="stat-card"><div class="value">${extraRoti}</div><div class="label">+Extra</div></div>
      </div>`;
      list = active.map(s => ({
        sub: s,
        text: `${s.dinner === 'both' ? '🫓🍚' : s.dinner === 'chawal' ? '🍚' : '🫓'} ${s.type === 'nv' ? '🍗' : '🥘'}${s.extraRoti ? ` +${s.extraRoti}🫓` : ''}`
      }));
    } else {
      stats = `<div class="grid-3">
        <div class="stat-card"><div class="value">${vegCount}</div><div class="label">🟢 Veg</div></div>
        <div class="stat-card"><div class="value">${nvCount}</div><div class="label">🔴 Non-veg</div></div>
        <div class="stat-card"><div class="value">${extraRoti}</div><div class="label">🫓 Extra</div></div>
      </div>`;
      list = active.map(s => ({ sub: s, text: '📦 Full dabba' }));

    const rows = list.map(x => `
      <div class="item" data-a="det" data-v="kitch" data-id="${x.sub.id}" style="cursor:pointer">

          ${x.sub.skip.includes(k) ? '↩️ Wapas' : '⏭️ Skip'}
        </button>
      </div>
    `).join('');
    
    return `
      <div class="card" style="background:linear-gradient(135deg,#f59f00,#e8590c);color:#fff;border:none">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="s" style="color:#fff;opacity:.9">AAJ · ${KMEAL.toUpperCase()}</div>
            <div style="font-size:44px;font-weight:900">${active.length}</div>
            <div class="s" style="color:#fff">🟢 ${vegCount} · 🔴 ${nvCount} · 🫓 +${extraRoti}</div>
          </div>
          ${kadhai()}
        </div>

      <div class="card">

          <button class="${KMEAL === 'subah' ? 'on' : ''}" data-a="kmeal" data-v="subah">🌅 Subah</button>
          <button class="${KMEAL === 'lunch' ? 'on' : ''}" data-a="kmeal" data-v="lunch">☀️ Lunch</button>
          <button class="${KMEAL === 'dinner' ? 'on' : ''}" data-a="kmeal" data-v="dinner">🌙 Dinner</button>
          <button class="${KMEAL === 'all' ? 'on' : ''}" data-a="kmeal" data-v="all">📦 Full</button>
        </div>
        ${stats}
        <button class="btn g" data-a="copyKitchen" style="margin-top:12px">📋 WhatsApp Summary Copy</button>
      </div>
      
      <div class="card">
        <h3>👥 Kis ko kya (${active.length})</h3>
        ${rows || '<div class="empty-state"><div class="icon">👥</div><h4>Koi nahi</h4></div>'}
      </div>
    `;
  },
  
  delivery: () => {
    const t = today();
    const k = iso(t);
    const active = S.subs.filter(s => isActive(s, t) && !s.skip.includes(k));
    const pending = active.filter(s => !S.done[k + '_' + s.id]);
    const done = active.filter(s => S.done[k + '_' + s.id]);
    const shopOrders = S.orders.filter(o => !o.dlv);
    
    const renderCard = (x, tagline, idx, action) => `
      <div class="card" style="border-left:5px solid var(--o)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1">
            <b style="font-size:16px">${esc(x.name)}</b>
            <div class="s" style="margin:4px 0">📍 ${esc(x.addr || x.area || '')}</div>
            <div class="s" style="color:var(--o);font-weight:700">${tagline}</div>
          </div>
          <div style="font-size:20px;font-weight:900;color:var(--muted)">#${idx}</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px">

          <a class="btn b" style="flex:1;margin:0;text-align:center;text-decoration:none" href="tel:+91${esc(x.phone)}">📞 Call</a>
          <button class="btn" style="flex:1.2;margin:0" data-a="${action}" data-id="${x.id}">✅ Done</button>
        </div>
      </div>
    `;
    
    return `
      <div class="card" style="background:linear-gradient(135deg,var(--g),#1f5f3a);color:#fff;border:none;text-align:center">
        <div class="s" style="color:#fff;opacity:.9">AAJ KI DELIVERY</div>
        <div style="font-size:44px;font-weight:900;margin:8px 0">${done.length} / ${active.length}</div>
        <div class="progress" style="background:rgba(255,255,255,.2)">
          <div class="progress-bar" style="width:${active.length ? Math.round(done.length / active.length * 100) : 0}%"></div>
        </div>
      </div>
      
      <div class="card">
        <h3>⏳ Pending (${pending.length})</h3>
        ${pending.map((s, i) => renderCard(s, `${vegIcon(s.type)} ${s.type === 'veg' ? 'Veg' : 'Non-veg'} · ${s.days} din`, i + 1, 'done')).join('') || 
          '<div class="empty-state"><div class="icon">🎉</div><h4>Sab ho gaya!</h4></div>'}
      </div>
      
      ${shopOrders.length ? `
        <div class="card">
          <h3>🛒 Shop Orders (${shopOrders.length})</h3>
          ${shopOrders.map((o, i) => renderCard(o, `🛍️ ${o.items.length} items · ${inr(o.total)}`, i + 1, 'odone')).join('')}
        </div>

      ${done.length ? `
        <div class="card">
          <h3>✅ Completed (${done.length})</h3>
          ${done.map(s => `
            <div class="item">
              <div class="item-info">
                <b>${esc(s.name)}</b>
                <div class="s">${esc(s.area || '')}</div>
              </div>
              <span style="color:var(--success);font-size:24px">✓</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
    `;
  },

    const pending = S.subs.filter(s => !s.paid).reduce((a, s) => a + getDue(s), 0) + 
                    S.orders.filter(o => !o.paid).reduce((a, o) => a + o.total, 0);
    
    return `

          </div>
          <div style="background:rgba(6,214,160,.25);border-radius:14px;padding:12px;text-align:center">
            <div style="font-size:24px;font-weight:900;color:#7ef0c0">${doneCount}/${todayDel.length}</div>
            <div class="s" style="color:#7ef0c0">🛵 Delivered</div>
          </div>
        </div>

      <div class="card">

          <button class="btn" data-a="oview" data-v="deliv">🛵 Today Delivery</button>

      ['kitchen', '👨‍🍳 Kitchen', IMAGES.kitchen],
      ['delivery', '🛵 Delivery', IMAGES.scooter],
      ['owner', '👤 Owner', IMAGES.money]
    ];
    
    $('#nav').innerHTML = navItems
      .filter(x => OK || x[0] === 'plan' || x[0] === 'shop')
      .map(x => `
        <div class="${x[0] === tab ? 'on' : ''}" data-a="tab" data-v="${x[0]}">
          <img src="${x[2]}" alt="${x[1]}" onerror="this.style.opacity=0">
          ${x[1]}
        </div>
      `).join('');
  } catch (e) {
    console.error('Render error:', e);
    $('#v').innerHTML = `<div class="card"><h3>⚠️ Error</h3><p class="s">${esc(e.message)}</p></div>`;
  }
  
  // Hide loading screen
  setTimeout(() => {
    $('#loadingScreen').classList.add('hide');
  }, 500);
};

// ============================================================
// ACTIONS
// ============================================================
const ACTIONS = {
  tab: v => {
    if (['kitchen', 'delivery', 'owner'].includes(v) && !OK) {
      const pin = prompt(v === 'delivery' ? 'Delivery PIN:' : 'Owner PIN:');
      if (pin === null) return;
      
      const valid = v === 'delivery' 
        ? (pin === CONFIG.deliveryPin || pin === CONFIG.ownerPin)
        : (pin === CONFIG.ownerPin);
      
      if (!valid) {
        showToast('❌ Galat PIN!', 'error');
        return;
      }
      
      OK = 1;
      try { sessionStorage.setItem('udok', '1'); } catch (e) {}
    }
    
    tab = v;
    render();
    window.scrollTo(0, 0);
  },
  
  set: (v, k) => {
    F[k] = v;
    render();
  },
  
  inc: (v, k, id) => {
    if (id === 'extraRoti') {
      F.extraRoti = clamp((F.extraRoti || 0) + 1, 0, 4);
    } else {
      C[id] = clamp((C[id] || 0) + 1, 0, 99);
    }
    render();
  },
  
  dec: (v, k, id) => {
    if (id === 'extraRoti') {
      F.extraRoti = clamp((F.extraRoti || 0) - 1, 0, 4);
    } else {
      C[id] = clamp((C[id] || 0) - 1, 0, 99);
      if (C[id] === 0) delete C[id];
    }
    render();
  },
  
  cat: v => {
    SCAT = v;
    render();
  },
  
  vo: () => {
    VO = VO ? 0 : 1;
    render();
  },
  
  kmeal: v => {
    KMEAL = v;
    render();
  },
  
  oview: v => {
    OVIEW = v;
    render();
  },
  
  cust: () => {
    CUST = CUST ? 0 : 1;
    render();
  },
  
  goc: () => {
    const el = $('#co');
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  },
  
  gps: () => {
    if (!navigator.geolocation) {
      showToast('❌ GPS nahi hai', 'error');
      return;
    }
    
    showToast('📍 Location le rahe hain...');
    
    navigator.geolocation.getCurrentPosition(
      pos => {
        F.map = `https://www.google.com/maps?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
        showToast('✅ Location mil gayi!');
        render();
      },
      err => {
        showToast('❌ Location nahi mili. GPS ON karo.', 'error');
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  },
  
  clearCart: () => {
    if (confirm('Cart khali karein?')) {
      C = {};
      render();
      showToast('🗑️ Cart khali ho gaya');
    }
  },
  
  join: () => {
    if (!F.name || !F.phone) {
      showToast('❌ Naam aur phone daalo', 'error');
      return;
    }
    
    if (F.phone.length !== 10) {
      showToast('❌ 10 digit phone daalo', 'error');
      return;
    }
    
    const td = iso(today());
    const price = calculatePrice();
    const credit = getCredit(F.phone);
    const discount = (isEligible(F.days) && credit > 0) ? Math.min(credit, price) : 0;
    
    const sub = {
      id: Date.now(),
      ts: Date.now(),
      name: String(F.name).slice(0, 40),
      phone: cleanPhone(F.phone),
      area: String(F.area || 'Other').slice(0, 40),
      addr: String(F.addr).slice(0, 120),
      map: String(F.map).slice(0, 200),
      type: F.type === 'nv' ? 'nv' : 'veg',
      days: clamp(+F.days || 30, 1, 365),
      half: +F.half ? 1 : 0,
      start: F.start || iso(addDays(today(), 1)),
      price: price - discount,
      pay: F.pay === 'online' ? 'online' : 'cash',
      paid: 0,
      skip: [],
      lunch: F.lunch,
      dinner: F.dinner,
      extraRoti: clamp(F.extraRoti || 0, 0, 4),
      ref: ''
    };
    
    // Apply referral discount
    if (discount > 0) {
      S.cred[F.phone] = credit - discount;
    }
    
    // Apply referral credit to referrer
    const refCode = (F.ref || '').trim().toUpperCase();
    if (refCode && isRefActive() && isEligible(sub.days)) {
      const referrer = S.subs.find(x => getRefCode(x.phone) === refCode && x.phone !== sub.phone);
      if (referrer) {
        S.refs = S.refs || {};
        S.refs[referrer.phone] = S.refs[referrer.phone] || [];
        
        if (!S.refs[referrer.phone].some(e => e.p === sub.phone)) {
          S.refs[referrer.phone].push({
            p: sub.phone,
            n: sub.name,
            d: td,
            amt: 100
          });
          S.cred[referrer.phone] = (S.cred[referrer.phone] || 0) + 100;
          sub.ref = refCode;
          showToast('🎁 Refer credit diya: ₹100');
        }
      }
    }
    
    S.subs.push(sub);
    MY.push('s' + sub.id);
    saveMY();
    addLog('New plan: ' + sub.name);
    save();
    
    showToast('✅ Plan ban gaya: ' + inr(sub.price));
    
    if (F.pay === 'online') {
      setTimeout(() => {
        location.href = upiLink(sub.price);
      }, 1000);
    }
    
    // Reset form
    F.name = '';
    F.phone = '';
    F.area = '';
    F.addr = '';
    F.map = '';
    F.ref = '';
    F.extraRoti = 0;
    C = {};
  },
  
  trial: () => {
    if (!F.name || !F.phone) {
      showToast('❌ Naam aur phone daalo', 'error');
      return;
    }
    
    const sub = {
      id: Date.now(),
      ts: Date.now(),
      name: String(F.name).slice(0, 40),
      phone: cleanPhone(F.phone),
      area: String(F.area || 'Other').slice(0, 40),
      addr: String(F.addr).slice(0, 120),
      map: String(F.map).slice(0, 200),
      type: F.type === 'nv' ? 'nv' : 'veg',
      days: 1,
      half: 0,
      start: iso(today()),
      price: 0,
      pay: 'cash',
      paid: 1,
      skip: [],
      trial: 1,
      lunch: F.lunch,
      dinner: F.dinner,
      extraRoti: clamp(F.extraRoti || 0, 0, 4),
      ref: ''
    };
    
    S.subs.push(sub);
    MY.push('s' + sub.id);
    saveMY();
    addLog('Trial: ' + sub.name);
    save();
    
    showToast('🎁 1 din FREE trial shuru!');
    
    F.name = '';
    F.phone = '';
    F.extraRoti = 0;
  },
  
  order: () => {
    if (!F.name || !F.phone) {
      showToast('❌ Naam aur phone daalo', 'error');
      return;
    }
    
    const items = [];
    let total = 0;
    
    Object.entries(C).forEach(([k, q]) => {
      const p = S.prod.find(x => x.id === parseInt(k, 10));
      if (!p || q < 1) return;
      
      items.push({
        n: p.n,
        q: clamp(q, 1, 99),
        p: p.p
      });
      total += p.p * q;
    });
    
    if (!items.length) {
      showToast('❌ Cart khali hai', 'error');
      return;
    }
    
    const order = {
      id: Date.now(),
      ts: Date.now(),
      name: String(F.name).slice(0, 40),
      phone: cleanPhone(F.phone),
      area: String(F.area || 'Other').slice(0, 40),
      addr: String(F.addr).slice(0, 120),
      map: String(F.map).slice(0, 200),
      items: items,
      total: total,
      pay: F.pay === 'online' ? 'online' : 'cash',
      paid: 0,
      dlv: 0,
      t: new Date().toLocaleString()
    };
    
    S.orders.push(order);
    MY.push('o' + order.id);
    saveMY();
    addLog('Order: ' + order.name);
    C = {};
    save();
    
    showToast('✅ Order ho gaya: ' + inr(total));
    
    if (F.pay === 'online') {
      setTimeout(() => {
        location.href = upiLink(total);
      }, 1000);
    }
  },
  
  done: (v, k, id) => {
    const key = iso(today()) + '_' + id;
    S.done[key] = S.done[key] ? 0 : 1;
    save();
    showToast(S.done[key] ? '✅ Delivered!' : '↩️ Undo');
  },
  
  odone: (v, k, id) => {
    const o = S.orders.find(x => x.id == id);
    if (o) {
      o.dlv = 1;
      save();
      showToast('✅ Shop order delivered!');
    }
  },
  
  skip: (v, k, id) => {
    const s = S.subs.find(x => x.id == id);
    if (!s) return;
    
    const d = iso(addDays(today(), 1));
    const i = s.skip.indexOf(d);
    
    if (i >= 0) {
      s.skip.splice(i, 1);
      showToast('↩️ Skip hataya');
    } else {
      s.skip.push(d);
      showToast('⏭️ Kal skip kiya');
    }
    
    save();
  },
  
  out: () => {
    OK = 0;
    try { sessionStorage.removeItem('udok'); } catch (e) {}
    tab = 'plan';
    render();
    showToast('🚪 Owner se bahar aa gaye');
  },
  
  copyKitchen: () => {
    const t = today();
    const k = iso(t);
    const active = S.subs.filter(s => isActive(s, t) && !s.skip.includes(k));
    
    const vegCount = active.filter(s => s.type === 'veg').length;
    const nvCount = active.filter(s => s.type === 'nv').length;
    const extraRoti = active.reduce((a, s) => a + (s.extraRoti || 0), 0);
    
    const text = `🍱 Namaste Udala - Kitchen Summary
📅 Date: ${k}

📊 Total Dabbe: ${active.length}
🟢 Veg: ${vegCount}
🔴 Non-Veg: ${nvCount}
🫓 Extra Roti: ${extraRoti}

✅ Ready to cook!`;
    
    navigator.clipboard.writeText(text).then(() => {
      showToast('📋 Copy ho gaya! WhatsApp mein paste karo.');
    }).catch(() => {
      showToast('❌ Copy nahi hui', 'error');
    });
  },
  
  backup: () => {
    const data = JSON.stringify(S, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `namaste-udala-backup-${iso(today())}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('💾 Backup download ho gaya!');
  },
  
  exportSubs: () => {
    const data = S.subs.map(s => ({
      Name: s.name,
      Phone: s.phone,
      Type: s.type,
      Days: s.days,
      Price: s.price,
      Paid: s.paid ? 'Yes' : 'No',
      Start: s.start,
      Area: s.area
    }));
    
    exportCSV(data, 'namaste-udala-plans.csv');
  },
  
  exportOrders: () => {
    const data = S.orders.map(o => ({
      Name: o.name,
      Phone: o.phone,
      Items: o.items.map(i => `${i.n}x${i.q}`).join(', '),
      Total: o.total,
      Paid: o.paid ? 'Yes' : 'No',
      Delivered: o.dlv ? 'Yes' : 'No',
      Date: new Date(o.ts).toLocaleDateString()
    }));
    
    exportCSV(data, 'namaste-udala-orders.csv');
  },
  
  exportPays: () => {
    const data = S.pays.map(p => ({
      Name: p.name,
      Amount: p.amt,
      Mode: p.mode,
      Date: p.d,
      Type: p.kind
    }));
    
    exportCSV(data, 'namaste-udala-payments.csv');
  }
};

const exportCSV = (data, filename) => {
  if (!data || !data.length) {
    showToast('❌ Data khali hai', 'error');
    return;
  }
  
  const keys = Object.keys(data[0]);
  const csv = [
    keys.join(','),
    ...data.map(row => keys.map(k => `"${String(row[k] || '').replace(/"/g, '""')}"`).join(','))
  ].join('\n');
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('✅ Export ho gaya!');
};

// ============================================================
// EVENT LISTENERS
// ============================================================
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  
  const action = ACTIONS[btn.dataset.a];
  if (!action) return;
  
  try {
    action(btn.dataset.v, btn.dataset.k, btn.dataset.id);
  } catch (err) {
    console.error('Action error:', err);
    showToast('❌ Error: ' + err.message, 'error');
  }
});

// Debounced search
const handleSearch = debounce(e => {
  if (e.target.id === 'sq') {
    SQ = e.target.value;
    const el = $('#pl');
    if (el && tab === 'shop') {
      // Re-render only product list
      let filtered = S.prod.filter(p => p.s);
      if (VO) filtered = filtered.filter(p => !p.nv);
      if (SCAT !== 'all') filtered = filtered.filter(p => p.c === SCAT);
      if (SQ) {
        const q = SQ.toLowerCase();
        filtered = filtered.filter(p => p.n.toLowerCase().includes(q));
      }
      
      const grouped = {};
      filtered.forEach(p => {
        grouped[p.c] = grouped[p.c] || [];
        grouped[p.c].push(p);
      });
      
      el.innerHTML = Object.entries(grouped).map(([cat, prods]) => `
        <div class="card">
          <h3>${esc(cat)}</h3>
          ${prods.map(renderProduct).join('')}
        </div>
      `).join('') || '<div class="empty-state"><div class="icon">🔍</div><h4>Kuch nahi mila</h4></div>';
    }
  }
}, 300);

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) {
    F[field] = e.target.value;
    if (field === 'phone') F.phone = cleanPhone(F.phone);
    if (field === 'extraRoti') F.extraRoti = clamp(+F.extraRoti || 0, 0, 4);
  }
  
  handleSearch(e);
});

// Owner login (5 taps on header)
let tapCount = 0;
document.querySelector('header').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN (default: 4821):');
    if (pin === CONFIG.ownerPin) {
      OK = 1;
      try { sessionStorage.setItem('udok', '1'); } catch (e) {}
      tab = 'owner';
      render();
      showToast('🔓 Owner access granted!');
    } else if (pin !== null) {
      showToast('❌ Galat PIN!', 'error');
    }
  }
});

// Close modal on backdrop click
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') hideModal();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideModal();
});

// ============================================================
// INIT
// ============================================================
initTheme();
render();

// Service Worker for PWA (optional)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

console.log('🍱 Namaste Udala v2.0 loaded successfully!');
console.log('📱 Ready for production');
</script>
