<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Namaste Udala — Ghar Jaisa Khana · Daily Shop · Services</title>
<meta name="theme-color" content="#113221">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9f5ec;--sf:#fffdf8;--sf2:#f1eadc;--ink:#16241c;--mu:#626d65;--ln:#e2d9c5;--o:#d94e1f;--g:#113221;--g2:#1b5e3a;--bad:#dc2626;--serif:'Fraunces',Georgia,serif;--sh-card:0 16px 32px -10px rgba(22,36,28,.12),inset 0 2px 0 #fff;--sh-3d-o:0 5px 0 #8f2d0b,0 10px 20px rgba(217,78,31,.3);--sh-3d-g:0 5px 0 #081c11,0 10px 20px rgba(17,50,33,.28);--sh-3d-w:0 4px 0 #d5cbb4;--sh-in:inset 0 3px 6px rgba(22,36,28,.08)}
[data-theme=dark]{--bg:#0c130f;--sf:#142019;--sf2:#0f1813;--ink:#f4f1ea;--mu:#9ca89f;--ln:#233329;--sh-card:0 20px 36px -10px rgba(0,0,0,.7);--sh-3d-w:0 4px 0 #070b09;--sh-in:inset 0 3px 7px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 15% 4%,rgba(217,78,31,.1),transparent 40%),var(--bg);color:var(--ink);padding-bottom:175px;min-height:100vh}
body.modal-open{overflow:hidden}
img{display:block;object-fit:cover;pointer-events:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;user-select:none;position:relative}
button *{pointer-events:none}
svg.ic{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none;pointer-events:none}
header{position:sticky;top:0;z-index:100;background:linear-gradient(145deg,#163f2a,#0b2216);color:#f9f5ec;padding:12px 16px;box-shadow:0 6px 20px rgba(11,34,22,.35);display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#f06434,#c43c10);display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:16px;color:#fff;box-shadow:0 4px 0 #7a2205;cursor:pointer;user-select:none;border:0;flex:none}
.brand{flex:1;min-width:0}
.brand small{display:block;color:#fbbf24;font-size:9px;letter-spacing:1.8px;font-weight:800}
.brand h1{font-family:var(--serif);font-size:18.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.install-banner{background:linear-gradient(135deg,#d94e1f,#a63510);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.2);box-shadow:0 4px 12px rgba(217,78,31,.3)}
.install-banner button{background:#fff;color:#d94e1f;border:0;padding:6px 12px;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer}
.marquee{background:#e9dfc8;color:#163f2a;overflow:hidden;white-space:nowrap;padding:6px 0;border-bottom:1px solid var(--ln);font-size:10px;font-weight:800;letter-spacing:1.3px}
[data-theme=dark] .marquee{background:#18271e;color:#fbbf24}
.marquee-track{display:inline-block;animation:mRoll 24s linear infinite}
@keyframes mRoll{to{transform:translateX(-50%)}}
main{padding:15px 14px 0;max-width:650px;margin:0 auto}
.hero3d{position:relative;border-radius:26px;padding:20px 18px;margin-bottom:18px;color:#fffdf8;background:linear-gradient(132deg,#113221 0%,#1d4d34 58%,#2a6a48 100%);box-shadow:0 7px 0 #091c12,0 18px 34px rgba(17,50,33,.3);min-height:148px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.hero3d.terracotta{background:linear-gradient(132deg,#2b1208 0%,#7c280d 55%,#d94e1f 100%);box-shadow:0 7px 0 #421304,0 18px 34px rgba(217,78,31,.3)}
.hero-pill{display:inline-block;width:fit-content;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;border:1px solid rgba(255,255,255,.25)}
.hero3d h2{font-family:var(--serif);font-size:20px;font-weight:800;max-width:65%;line-height:1.15;margin-bottom:5px}
.hero3d p{font-size:12px;opacity:.92;max-width:65%;font-weight:600}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 16px}
.p-tier{position:relative;border-radius:20px;padding:16px 6px 12px;text-align:center;background:linear-gradient(180deg,var(--sf),var(--sf2));border:2px solid var(--ln);box-shadow:0 4px 0 #d5cbb4;cursor:pointer;transition:.15s;display:block;width:100%}
.p-tier.on{background:linear-gradient(180deg,#fff9f2,#fde6d2);border-color:var(--o);box-shadow:0 5px 0 #8f2d0b,0 14px 24px rgba(217,78,31,.25);transform:translateY(-3px)}
.p-tier .p-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--g);color:#fbbf24;font-size:8.5px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-tier.on .p-badge{background:var(--o);color:#fff}
.p-tier .p-days{font-family:var(--serif);font-size:17px;font-weight:800;display:block}
.p-tier .p-sub{font-size:9px;font-weight:800;color:var(--mu);text-transform:uppercase;margin-bottom:5px;display:block}
.p-tier .p-amt{font-family:var(--serif);font-size:18.5px;font-weight:800;color:var(--o);display:block}
.card{background:linear-gradient(180deg,var(--sf),var(--sf2));border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:15px;box-shadow:0 16px 32px -10px rgba(22,36,28,.12)}
.card h3{font-family:var(--serif);font-size:16px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 6px;text-align:center}
.kpi b{font-family:var(--serif);display:block;font-size:17px;font-weight:800;color:var(--o)}
.kpi span{font-size:9.5px;font-weight:800;color:var(--mu);text-transform:uppercase}
.prep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.prep-box{background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:8px 4px;text-align:center}
.prep-box b{display:block;font-size:14px;color:var(--g2);font-family:var(--serif)}
.prep-box span{font-size:9px;font-weight:800;color:var(--mu);text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 15px;border:0;border-radius:99px;background:linear-gradient(180deg,#eb5e2f,#c83e10);color:#fff;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 5px 0 #8f2d0b,0 10px 20px rgba(217,78,31,.3);margin-top:8px}
.btn.g{background:linear-gradient(180deg,#1f6942,#113221);box-shadow:0 5px 0 #081c11,0 10px 20px rgba(17,50,33,.28)}
.btn.w{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.btn.sm{width:auto;display:inline-flex;padding:7px 12px;font-size:11px;border-radius:99px;margin:0}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.btn-row>*{flex:1}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--ln);border-radius:13px;background:var(--sf2);color:var(--ink);font-weight:700;font-size:13px;margin:4px 0;outline:none}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;color:var(--mu);margin:9px 0 3px;text-transform:uppercase}
.seg{display:flex;gap:5px;background:var(--sf2);padding:4px;border-radius:99px;margin:4px 0}
.seg button{flex:1;padding:9px 6px;border:0;border-radius:99px;background:transparent;font-weight:800;font-size:11px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--ln)}
.row:last-child{border-bottom:0}
.tot{display:flex;justify-content:space-between;align-items:center;padding-top:11px;margin-top:5px;border-top:2px solid var(--ln)}
.tot b{font-family:var(--serif);font-size:22px;font-weight:800;color:var(--o)}
.ov{position:fixed;inset:0;z-index:300;background:rgba(11,22,16,.82);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--sf);width:100%;max-width:510px;max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 18px 30px}
.cbar-fixed{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom, 0px));z-index:190;max-width:620px;margin:0 auto;background:linear-gradient(145deg,#1b5e3a,#0d311d);color:#fff;border-radius:99px;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:800;font-size:13px;border:0;width:calc(100% - 24px);box-shadow:0 14px 28px rgba(11,34,22,.5)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:250;max-width:640px;margin:0 auto;background:var(--sf);border:1.5px solid var(--ln);border-radius:99px;display:flex;gap:4px;padding:5px 8px;box-shadow:0 16px 34px rgba(22,36,28,.28)}
nav button{flex:1;border:0;background:transparent;border-radius:99px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-weight:800;position:relative}
nav button.on{background:var(--g);color:#fbbf24}
nav .nl{font-size:9.5px}
nav .nb{position:absolute;top:2px;right:14%;background:var(--o);color:#fff;font-size:8.5px;padding:1px 5px;border-radius:99px;border:1.5px solid #fff}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%) translateY(-16px);background:var(--g);color:#fff;padding:11px 18px;border-radius:99px;font-size:12.5px;font-weight:800;z-index:900;opacity:0;transition:.25s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="installBanner" class="install-banner" style="display:none">
  <span>📱 Namaste Udala App phone par install karein (Bina Play Store ke!)</span>
  <button type="button" id="installBtn">Install App</button>
</div>

<header>
  <button type="button" class="logo" data-a="logo_tap" title="5 Tap for Owner">NU</button>
  <div class="brand">
    <small>NAMASTE UDALA · FULL MASTER CRM</small>
    <h1 id="ttl">Ghar Jaisa Khana · Roz Time Pe</h1>
  </div>
  <button type="button" class="btn w sm" id="thm" data-a="theme">🌙</button>
</header>

<main id="v"></main>
<div id="cbar"></div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>

<script>
let analytics = JSON.parse(localStorage.getItem('nu_behavior') || '{"visits":0, "orders":0}');
analytics.visits++;
localStorage.setItem('nu_behavior', JSON.stringify(analytics));

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('installBanner');
  if (b) b.style.display = 'flex';
});

document.addEventListener('click', async (e) => {
  if (e.target && e.target.id === 'installBtn' && deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') document.getElementById('installBanner').style.display = 'none';
    deferredPrompt = null;
  }
});

const UDALA_AREAS = ['Udala Bus Stand', 'Market Square', 'High School Rd', 'College Rd', 'Block Office', 'Hospital Rd', 'Ward 1–6', 'Bhanjpur'];
const AREA_COORDS = {
  'Udala Bus Stand': [21.5732, 86.5675],
  'Market Square': [21.5718, 86.5648],
  'High School Rd': [21.5755, 86.5630],
  'College Rd': [21.5790, 86.5612],
  'Block Office': [21.5702, 86.5695],
  'Hospital Rd': [21.5740, 86.5710],
  'Ward 1–6': [21.5768, 86.5688],
  'Bhanjpur': [21.5810, 86.5720]
};
const KITCHEN_HQ = [21.5732, 86.5675];

function pinHash(str) {
  let h = 2166136261;
  const s = 'nu_salt_' + String(str).trim();
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(16);
}
const OWNER_HASH = pinHash('4827');

const IC = {
  tiffin: `<svg class="ic" viewBox="0 0 24 24"><path d="M6 9h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9Z"/><path d="M5 9h14"/><path d="M8 5h8v4H8z"/></svg>`,
  shop: `<svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L23 7H6"/></svg>`,
  user: `<svg class="ic" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  kitchen: `<svg class="ic" viewBox="0 0 24 24"><path d="M12 2c1.5 2.5 2 4.5 0 7-2-2.5-1.5-4.5 0-7z"/><path d="M4 13h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-5z"/><path d="M2 13h20"/></svg>`,
  route: `<svg class="ic" viewBox="0 0 24 24"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6h3l3 6v5.5h-2"/><path d="M12 17.5H9v-7h6v7z"/></svg>`,
  owner: `<svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>`,
  gps: `<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="7"/></svg>`
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const inr = n => '₹' + (+n || 0).toLocaleString('en-IN', { minimumFractionDigits: (+n % 1 !== 0) ? 2 : 0, maximumFractionDigits: 2 });
const ph = s => String(s || '').replace(/\D/g, '').slice(-10);
const isValidPhone = s => /^[6-9]\d{9}$/.test(ph(s));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

if (localStorage.getItem('nu_theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark';
}

function seedData() {
  const today = iso(new Date());
  return {
    subs: [
      { id: 's1', name: 'Subham Rana', phone: '8073721357', area: 'Udala Bus Stand', addr: 'Near Bus Stand', type: 'veg', days: 30, times: 3, start: today, price: 2899, paid: 1, vStat: 'ok', lunch: 'chawal', dinner: 'roti', extraRoti: 0, skip: [] },
      { id: 's2', name: 'Priyanka Das', phone: '9437012345', area: 'Bhanjpur', addr: 'Ward 4', type: 'nv', days: 15, times: 3, start: today, price: 1849, paid: 1, vStat: 'ok', lunch: 'both', dinner: 'roti', extraRoti: 1, skip: [] }
    ],
    orders: [
      { id: 'o1', date: today, name: 'Subham Rana', phone: '8073721357', area: 'Udala Bus Stand', addr: 'Near Bus Stand', items: [{ n: 'Atta 5 kg', q: 1, p: 245 }], total: 245, paid: 1, vStat: 'ok', packed: 1, dlv: 0 },
      { id: 'o2', date: today, name: 'Priyanka Das', phone: '9437012345', area: 'Bhanjpur', addr: 'Ward 4', items: [{ n: 'Chicken curry 500g', q: 1, p: 260 }], total: 260, paid: 1, vStat: 'ok', packed: 0, dlv: 0 }
    ],
    prod: [
      { id: 1, n: 'Chicken Leg Masala', p: 160, c: 'Khana', s: 1, img: 'https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=400&q=70' },
      { id: 2, n: 'Paneer Sabzi', p: 110, c: 'Khana', s: 1, img: 'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400&q=70' },
      { id: 3, n: 'Doodh 500ml', p: 30, c: 'Dairy', s: 1, img: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=70' }
    ]
  };
}

let S = seedData();
try {
  const l = JSON.parse(localStorage.getItem('nu_master_v3'));
  if (l && l.subs) S = l;
} catch (e) {}

function saveAll() {
  localStorage.setItem('nu_master_v3', JSON.stringify(S));
  render();
}

let tab = 'plan', ROLE = sessionStorage.getItem('nu_role') || '';
let K_SLOT = 'lunch', CART_OPEN = false, PIN_OPEN = false;
let F = { name: localStorage.getItem('nu_n') || 'Subham Rana', phone: localStorage.getItem('nu_p') || '8073721357', addr: localStorage.getItem('nu_a') || 'Bus Stand Udala', area: localStorage.getItem('nu_area') || 'Udala Bus Stand', type: 'veg', days: 30, times: 3 };

function toast(m) {
  const t = $('#toast'); if (!t) return;
  t.textContent = m; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 3000);
}

function vPlan() {
  return `
  <div class="hero3d terracotta">
    <span class="hero-pill">ARTISANAL HOME KITCHEN</span>
    <h2>Monthly · 15 Days · 7 Days Tiffin Plan</h2>
    <p>3-Time Ghar Jaisa Khana · Free Delivery in Udala</p>
  </div>
  <div class="card">
    <h3>1. Apna Tiffin Plan Chunein</h3>
    <div class="seg" style="margin-bottom:12px">
      <button class="${F.type==='veg'?'on':''}" onclick="setF('type','veg')">🟢 Pure Veg</button>
      <button class="${F.type==='nv'?'on':''}" onclick="setF('type','nv')">🔴 Non-Veg</button>
    </div>
    <div class="plan-grid">
      <button class="p-tier ${F.days===30?'on':''}" onclick="setF('days',30)"><span class="p-badge">BEST</span><span class="p-days">30 Din</span><span class="p-amt">₹2,899</span></button>
      <button class="p-tier ${F.days===15?'on':''}" onclick="setF('days',15)"><span class="p-badge">POPULAR</span><span class="p-days">15 Din</span><span class="p-amt">₹1,499</span></button>
      <button class="p-tier ${F.days===7?'on':''}" onclick="setF('days',7)"><span class="p-badge">TRIAL</span><span class="p-days">7 Din</span><span class="p-amt">₹749</span></button>
    </div>
    <input class="inp" id="uName" placeholder="Aapka Naam" value="${esc(F.name)}">
    <input class="inp" id="uPhone" placeholder="Mobile Number" value="${esc(F.phone)}">
    <input class="inp" id="uAddr" placeholder="Address / Landmark" value="${esc(F.addr)}">
    <button class="btn" onclick="bookPlan()">Activate Plan Now ✓</button>
  </div>`;
}

function vShop() {
  return `
  <div class="hero3d">
    <span class="hero-pill">UDALA LOCAL STORE</span>
    <h2>Fresh Tiffin Items & Kirana</h2>
  </div>
  <div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    ${S.prod.map(p => `
      <div class="card" style="margin:0;padding:10px">
        <img src="${p.img}" style="height:100px;width:100%;border-radius:12px;object-fit:cover">
        <div style="font-weight:800;font-size:13px;margin:6px 0">${p.n}</div>
        <div style="font-family:var(--serif);font-weight:800;color:var(--o);font-size:15px">${inr(p.p)}</div>
        <button class="btn g sm" style="width:100%;margin-top:6px" onclick="addShop(${p.id})">+ ADD</button>
      </div>
    `).join('')}
  </div>`;
}

function vKitchen() {
  const activeSubs = S.subs.filter(s => s.vStat !== 'bad');
  const pendOrds = S.orders.filter(o => !o.dlv);
  return `
  <div class="hero3d">
    <h2>Kitchen Production & Prep AI</h2>
    <p>Live Active Tiffins & Orders Forecast</p>
  </div>
  <div class="seg" style="margin-bottom:12px">
    <button class="${K_SLOT==='bf'?'on':''}" onclick="setSlot('bf')">Nashta</button>
    <button class="${K_SLOT==='lunch'?'on':''}" onclick="setSlot('lunch')">Lunch</button>
    <button class="${K_SLOT==='dinner'?'on':''}" onclick="setSlot('dinner')">Dinner</button>
  </div>
  <div class="kpi">
    <div><b>${activeSubs.length}</b><span>Active Dabbe</span></div>
    <div><b>${pendOrds.length}</b><span>Shop Orders</span></div>
    <div><b>${activeSubs.length * 4}</b><span>Total Roti</span></div>
  </div>
  <div class="card">
    <h3>Active Tiffin Preps (${activeSubs.length})</h3>
    ${activeSubs.map(s => `<div class="row"><div><b>${esc(s.name)}</b><div style="font-size:11.5px;color:var(--mu)">${esc(s.area)} · ${s.type==='nv'?'Non-Veg':'Veg'}</div></div><span class="st-pill st-ok">Cooking</span></div>`).join('')}
  </div>`;
}

function vRoute() {
  return `
  <div class="hero3d" style="background:linear-gradient(132deg,#113221,#1b5e3a)">
    <h2>GPS Shortest-Path Route</h2>
    <p>Delivery Boy Navigation</p>
  </div>
  <div class="card">
    <h3>Today's Delivery Drops (${S.subs.length + S.orders.length})</h3>
    ${S.subs.map((s, i) => `<div class="row"><div><b>#${i+1} · ${esc(s.name)} (${s.type==='nv'?'NV':'Veg'})</b><div style="font-size:11px;color:var(--mu)">${esc(s.addr)} (${esc(s.area)})</div></div><a class="btn sm g" href="tel:+91${s.phone}">Call</a></div>`).join('')}
    ${S.orders.map((o, i) => `<div class="row"><div><b>Shop Drop · ${esc(o.name)}</b><div style="font-size:11px;color:var(--mu)">${esc(o.addr)} · ${o.items.map(x=>x.n).join(', ')}</div></div><a class="btn sm g" href="tel:+91${o.phone}">Call</a></div>`).join('')}
  </div>`;
}

function vOwner() {
  const totIn = S.orders.reduce((a,o)=>a+o.total,0) + S.subs.reduce((a,s)=>a+s.price,0);
  return `
  <div class="hero3d" style="background:linear-gradient(132deg,#2b1208,#7c280d)">
    <h2>Owner Master Control</h2>
    <p>Full CRM & Data Management</p>
  </div>
  <div class="kpi">
    <div><b>${inr(totIn)}</b><span>Collection</span></div>
    <div><b>${S.orders.length}</b><span>Orders</span></div>
    <div><b>${S.subs.length}</b><span>Subs</span></div>
  </div>
  <div class="card">
    <h3>Quick Data Controls</h3>
    <button class="btn g" onclick="resetDemoData()">↻ Reload / Reset Demo Data</button>
    <button class="btn r sm" style="background:#dc2626;margin-top:8px" onclick="logoutOwner()">Logout Owner Mode</button>
  </div>`;
}

function sheet() {
  if (PIN_OPEN) {
    return `<div class="ov"><div class="sh" style="text-align:center">
      <h3>🔒 Owner PIN Access</h3>
      <p style="font-size:12px;color:var(--mu);margin:8px 0">Enter 4-digit PIN (Default: 4827)</p>
      <input class="inp" id="pinBox" type="password" maxlength="4" style="text-align:center;font-size:22px;letter-spacing:6px;max-width:160px;margin:0 auto 12px" autofocus>
      <button class="btn g" onclick="verifyPin()">Unlock Owner Panel ✓</button>
      <button class="btn w sm" style="margin-top:8px" onclick="closePin()">Cancel</button>
    </div></div>`;
  }
  return '';
}

function render() {
  const V = { plan: vPlan, shop: vShop, kitchen: vKitchen, route: vRoute, owner: vOwner };
  $('#v').innerHTML = (V[tab] || vPlan)();
  $('#sheet').innerHTML = sheet();

  const TABS = [['plan', IC.tiffin, 'Plans'], ['shop', IC.shop, 'Shop']];
  if (ROLE === 'owner') {
    TABS.push(['kitchen', IC.kitchen, 'Kitchen'], ['route', IC.route, 'Route'], ['owner', IC.owner, 'Owner']);
  }
  $('#nav').innerHTML = TABS.map(x => `<button class="${tab === x[0] ? 'on' : ''}" onclick="setTab('${x[0]}')">${x[1]}<span class="nl">${x[2]}</span></button>`).join('');
}

function setTab(t) { tab = t; render(); window.scrollTo(0,0); }
function setF(k, v) { F[k] = v; render(); }
function setSlot(s) { K_SLOT = s; render(); }
function addShop(id) {
  const p = S.prod.find(x => x.id === id);
  if (p) {
    S.orders.push({ id: uid('o'), date: iso(new Date()), name: F.name, phone: F.phone, area: F.area, addr: F.addr, items: [{ n: p.n, q: 1, p: p.p }], total: p.p, paid: 1, vStat: 'ok', packed: 1, dlv: 0 });
    saveAll();
    toast('Item added to Shop Orders & Kitchen Queue!');
  }
}
function bookPlan() {
  F.name = $('#uName').value.trim() || F.name;
  F.phone = $('#uPhone').value.trim() || F.phone;
  F.addr = $('#uAddr').value.trim() || F.addr;
  if (!isValidPhone(F.phone)) { toast('Sahi 10-digit mobile number daalein!'); return; }
  
  const price = F.days === 30 ? 2899 : F.days === 15 ? 1499 : 749;
  S.subs.push({ id: uid('s'), name: F.name, phone: F.phone, area: F.area, addr: F.addr, type: F.type, days: F.days, times: F.times, start: iso(new Date()), price, paid: 1, vStat: 'ok', lunch: 'chawal', dinner: 'roti', extraRoti: 0, skip: [] });
  saveAll();
  toast('🎉 Tiffin Plan Activated & Synced to Kitchen!');
}

$('#thm').onclick = () => {
  const d = document.documentElement.dataset.theme === 'dark';
  document.documentElement.dataset.theme = d ? '' : 'dark';
  localStorage.setItem('nu_theme', d ? '' : 'dark');
};

document.querySelector('.logo').onclick = () => {
  if (ROLE === 'owner') { tab = 'owner'; render(); }
  else { PIN_OPEN = true; render(); setTimeout(() => $('#pinBox').focus(), 50); }
};

function verifyPin() {
  const val = $('#pinBox').value.trim();
  if (pinHash(val) === OWNER_HASH) {
    ROLE = 'owner'; sessionStorage.setItem('nu_role', 'owner');
    PIN_OPEN = false; tab = 'owner'; render();
    toast('🔓 Owner Master Control Unlocked!');
  } else {
    toast('⚠️ Galat PIN! (Default: 4827)');
  }
}
function closePin() { PIN_OPEN = false; render(); }
function logoutOwner() { ROLE = ''; sessionStorage.removeItem('nu_role'); tab = 'plan'; render(); toast('Logged out of Owner mode'); }
function resetDemoData() { S = seedData(); saveAll(); toast('Demo data reloaded successfully!'); }

render();
</script>
</body>
</html>
