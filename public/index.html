<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Namaste Udala - Super App</title>
    
    <!-- PWA Essentials -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0e5c3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NamasteUdala">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <!-- Fonts & Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* --- DESIGN SYSTEM VARIABLES --- */
        :root {
            --primary: #ff5a1f;       /* Appetite Orange */
            --primary-dark: #e8480c;
            --secondary: #0e5c3f;     /* Trustworthy Green */
            --bg-body: #f6f3ec;       
            --surface: #fffdf9;
            --text-main: #1c1917;
            --text-muted: #7d7468;
            --border: #ece2d0;
            --gold: #f5b301;
            --danger: #dc2626;
            --success: #16a34a;
            --info: #2563eb;
            --radius-lg: 22px;
            --nav-height: 70px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding-bottom: calc(var(--nav-height) + 20px); 
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Ambient Background Blobs */
        body::before, body::after {
            content:''; position:fixed; width:400px; height:400px; border-radius:50%; filter:blur(80px); opacity:.4; z-index:-1; pointer-events:none;
        }
        body::before { left:-100px; top:10%; background:#ffb37a; animation:blobMove 15s infinite alternate; }
        body::after { right:-100px; bottom:10%; background:#9ed8b5; animation:blobMove 18s infinite alternate-reverse; }
        @keyframes blobMove { 0%{transform:translate(0,0)} 100%{transform:translate(30px,-30px)} }

        /* --- HEADER --- */
        header {
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(135deg, #0b3d2c, var(--secondary));
            color: white; padding: 16px;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 8px 20px rgba(11,61,44,0.3);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-circle {
            width: 42px; height: 42px; border-radius: 12px;
            background: conic-gradient(from 210deg, var(--gold), var(--primary), var(--gold));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 15px; color: white;
            box-shadow: 0 4px 10px rgba(255,90,31,0.4);
        }
        .brand-text h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
        .brand-text p { font-size: 10px; opacity: 0.9; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .header-actions { display: flex; gap: 10px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: all 0.2s ease; position: relative;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
        .badge-dot {
            position: absolute; top: 6px; right: 6px;
            width: 8px; height: 8px; background: var(--primary);
            border-radius: 50%; border: 2px solid var(--secondary);
        }

        /* --- CONTAINER --- */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }

        /* --- CARDS --- */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255,255,255,0.8);
            animation: fadeInUp 0.4s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card h3 {
            color: var(--secondary); font-size: 16px; font-weight: 800;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .card h3::before {
            content: ''; width: 4px; height: 16px; border-radius: 4px;
            background: linear-gradient(180deg, var(--primary), var(--gold));
        }

        /* --- FILTER CHIPS --- */
        .filter-chips {
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none;
        }
        .filter-chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; padding: 8px 16px; border-radius: 99px;
            background: #f3ede2; font-size: 12px; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .chip.active {
            background: var(--primary); color: white; border-color: var(--primary);
        }

        /* --- UNIFIED SHOP GRID --- */
        .shop-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }
        .prod-card {
            background: white; border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            transition: 0.2s; position: relative; display: flex; flex-direction: column;
        }
        .prod-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .prod-img-wrap { height: 120px; background: #f1f5f9; position: relative; }
        .prod-img { width: 100%; height: 100%; object-fit: cover; }
        .discount-badge {
            position: absolute; top: 8px; left: 8px;
            background: var(--success); color: white;
            font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
        }
        .cat-badge {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.6); color: white;
            font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; backdrop-filter: blur(4px);
        }
        .wish-heart {
            position: absolute; bottom: 8px; right: 8px;
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #ccc; cursor: pointer; z-index: 2;
        }
        .wish-heart.active { color: var(--danger); }
        .prod-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .prod-name { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; height: 34px; overflow: hidden; }
        .prod-rating { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
        .prod-price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
        .curr-price { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .old-price { font-size: 11px; color: var(--text-muted); text-decoration: line-through; }
        .add-cart-btn {
            width: 100%; padding: 8px; border: none; border-radius: 8px;
            background: var(--secondary); color: white; font-weight: 700; font-size: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .add-cart-btn.in-cart { background: var(--primary); }
        .add-cart-btn.plan-btn { background: var(--info); }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 16px; left: 16px; right: 16px;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 200; border: 1px solid rgba(255,255,255,0.5);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 10px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; width: 60px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; transition: transform 0.2s; }
        .nav-item.active .nav-icon { transform: scale(1.1); }

        /* --- MODALS --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 300; display: none; align-items: flex-end; justify-content: center;
        }
        .overlay.open { display: flex; }
        .sheet {
            background: white; width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0; padding: 24px;
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 20px; }
        
        .form-group { margin-bottom: 16px; }
        .label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .input-field {
            width: 100%; padding: 14px; border: 1.5px solid var(--border);
            border-radius: 12px; font-size: 15px; outline: none; transition: border 0.2s;
        }
        .input-field:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(14,92,63,0.1); }
        
        .btn-primary {
            width: 100%; background: var(--primary); color: white;
            border: none; padding: 16px; border-radius: 14px;
            font-weight: 800; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 90, 31, 0.3);
            margin-top: 10px;
        }
        .btn-secondary {
            width: 100%; background: #f1f5f9; color: var(--text-main);
            border: none; padding: 14px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px;
        }

        /* --- TOAST --- */
        #toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: white;
            padding: 12px 24px; border-radius: 50px;
            font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 400; opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

        /* Dark Mode Support */
        [data-theme='dark'] {
            --bg-body: #0f172a; --surface: #1e293b; --text-main: #f1f5f9;
            --text-muted: #94a3b8; --border: #334155;
        }
        [data-theme='dark'] header { background: linear-gradient(135deg, #0f172a, #1e293b); }
        [data-theme='dark'] .bottom-nav { background: rgba(30, 41, 59, 0.95); border-color: #334155; }
        [data-theme='dark'] .sheet { background: #1e293b; }
        [data-theme='dark'] .input-field { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        [data-theme='dark'] .prod-card { background: #1e293b; border-color: #334155; }
        [data-theme='dark'] .chip { background: #334155; color: #cbd5e1; }
        [data-theme='dark'] .chip.active { background: var(--primary); color: white; }
    </style>
</head>
<body>

<!-- Header -->

        <div class="form-group">
            <label class="label">Full Name</label>
            <input type="text" id="regName" class="input-field" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label class="label">Phone Number</label>
            <input type="tel" id="regPhone" class="input-field" placeholder="10-digit mobile">
        </div>
        <div class="form-group">
            <label class="label">Delivery Address</label>
            <textarea id="regAddr" class="input-field" rows="3" placeholder="House No, Street, Area..."></textarea>
        </div>
        <button class="btn-primary" onclick="saveUser()">Save & Continue</button>

<!-- OWNER PIN MODAL -->

<!-- Toast Notification -->
<div id="toast">Message</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

// === 1. CONFIGURATION & CONSTANTS ===
const firebaseConfig = {
    apiKey: "AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",
    authDomain: "namaste-udala.firebaseapp.com",
    projectId: "namaste-udala",
    storageBucket: "namaste-udala.firebasestorage.app",
    messagingSenderId: "998684348165",
    appId: "1:998684348165:web:4bb0d2f5335a90a394716c",
    databaseURL: "https://namaste-udala-default-rtdb.firebaseio.com"
};

const UPI_ID = '9583937047@jio';
const OWNER_PIN = '4821';

// Pricing Engine Data
const BASE_PRICES = {
    veg: { 7: 749, 15: 1499, 30: 2899 },
    nv: { 7: 949, 15: 1849, 30: 3599 }
};
const ADD_ONS = {
    lunchBoth: 10, dinnerBoth: 10, extraRoti: 5
};

// Unified Catalog: Plans + Products + Services + Bulk
const CATALOG = [
    // --- PLANS (Rendered as special cards) ---
    { id: 'plan_veg_30', type: 'plan', name: 'Monthly Veg Plan', price: 2899, cat: 'Plans', img: 'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&q=80', rating: 4.9, desc: '30 Days • Lunch+Dinner' },
    { id: 'plan_nv_30', type: 'plan', name: 'Monthly Non-Veg Plan', price: 3599, cat: 'Plans', img: 'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400&q=80', rating: 4.8, desc: '30 Days • Chicken/Fish' },
    
    // --- GROCERY ---
    { id: 1, type: 'product', name: 'Fresh Milk 500ml', price: 30, mrp: 35, cat: 'Grocery', img: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=80', rating: 4.7 },
    { id: 2, type: 'product', name: 'Atta 1kg Bag', price: 50, mrp: 60, cat: 'Grocery', img: 'https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400&q=80', rating: 4.5 },
    { id: 3, type: 'product', name: 'Paneer 200g', price: 80, mrp: 95, cat: 'Grocery', img: 'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400&q=80', rating: 4.6 },
    
    // --- SERVICES ---
    { id: 4, type: 'service', name: 'Wedding Photography', price: 15000, cat: 'Services', img: 'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=400&q=80', rating: 5.0, desc: 'Full Day Coverage' },
    { id: 5, type: 'service', name: 'Birthday Decoration', price: 3500, cat: 'Services', img: 'https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=400&q=80', rating: 4.8, desc: 'Balloon + Lights' },
    { id: 6, type: 'service', name: 'Maths Tuition (Month)', price: 800, cat: 'Services', img: 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=400&q=80', rating: 4.7, desc: 'Class 6-10' },
    
    // --- BULK CATERING ---
    { id: 7, type: 'bulk', name: 'Bulk Veg Thali (50+)', price: 100, cat: 'Bulk', img: 'https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=400&q=80', rating: 4.9, desc: 'Per Plate • Min 50 Qty' },
    { id: 8, type: 'bulk', name: 'Bulk Chicken Curry', price: 140, cat: 'Bulk', img: 'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400&q=80', rating: 4.8, desc: 'Per Plate • Min 30 Qty' },
];

// === 2. STATE MANAGEMENT ===
let state = {
    user: JSON.parse(localStorage.getItem('nu_user')) || null,
    cart: {}, 
    view: 'home',
    ownerMode: false,
    db: null,
    allOrders: [],
    shopFilter: 'All', // All, Plans, Grocery, Services, Bulk
    planConfig: { type: 'veg', days: 30, lunch: 'rice', dinner: 'roti', extraRoti: 0 }
};

try { state.cart = JSON.parse(localStorage.getItem('nu_cart')) || {}; } catch(e){}

// === 3. FIREBASE INITIALIZATION ===
try {
    const app = initializeApp(firebaseConfig);
    state.db = getDatabase(app);
    onValue(ref(state.db, 'orders'), snap => {
        const val = snap.val();
        state.allOrders = val ? Object.values(val) : [];
        if(state.ownerMode && state.view === 'owner') renderOwner();
    });
} catch(e) { console.log('Cloud off', e); }

// === 4. HELPERS ===
const $ = s => document.querySelector(s);
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const getDisc = (mrp, p) => Math.round(((mrp - p) / mrp) * 100);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function saveState() {
    localStorage.setItem('nu_cart', JSON.stringify(state.cart));
    if(state.user) localStorage.setItem('nu_user', JSON.stringify(state.user));
    render();
}

// === 5. SMART ALGORITHMS ===
function calculatePlanPrice(cfg = state.planConfig) {
    const base = BASE_PRICES[cfg.type][cfg.days] || 0;
    const lunchCost = cfg.lunch === 'both' ? ADD_ONS.lunchBoth * cfg.days : 0;
    const dinnerCost = cfg.dinner === 'both' ? ADD_ONS.dinnerBoth * cfg.days : 0;
    const rotiCost = cfg.extraRoti * ADD_ONS.extraRoti * cfg.days;
    const total = base + lunchCost + dinnerCost + rotiCost;
    return { total, perDay: cfg.days > 0 ? Math.round(total / cfg.days) : 0, base, lunchCost, dinnerCost, rotiCost };
}

function optimizeRoute(stops) {
    if (!stops.length) return [];
    if (stops.length <= 2) return stops;
    let unvisited = [...stops], visited = [], current = unvisited.shift();
    visited.push(current);
    while (unvisited.length) {
        let nearestIdx = 0, minDist = Infinity;
        for (let i = 0; i < unvisited.length; i++) {
            const dist = havDistance(current.lat, current.lng, unvisited[i].lat, unvisited[i].lng);
            if (dist < minDist) { minDist = dist; nearestIdx = i; }
        }
        current = unvisited.splice(nearestIdx, 1)[0];
        visited.push(current);
    }
    return visited;
}

function havDistance(lat1, lon1, lat2, lon2) {
    const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getRevenueBreakdown() {
    const breakdown = { Plans: 0, Grocery: 0, Services: 0, Bulk: 0 };
    state.allOrders.forEach(o => {
        if (o.type === 'subscription') breakdown.Plans += o.total;
        else if (o.items) {
            o.items.forEach(item => {
                const prod = CATALOG.find(p => p.id == item.id);
                if (prod) {
                    const rev = prod.price * item.qty;
                    if (breakdown[prod.cat]) breakdown[prod.cat] += rev;
                }
            });
        }
    });
    return breakdown;
}

// === 6. GLOBAL FUNCTIONS ===
window.toggleTheme = () => {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) { root.removeAttribute('data-theme'); localStorage.setItem('nu_theme', 'light'); }
    else { root.setAttribute('data-theme', 'dark'); localStorage.setItem('nu_theme', 'dark'); }
};

window.switchTab = (tab) => { state.view = tab; render(); };

window.setShopFilter = (cat) => { state.shopFilter = cat; render(); };

window.openCart = () => {
    if (!state.user) { openModal('loginModal'); showToast("Please login first"); return; }
    renderCartItems(); openModal('cartModal');
};

window.saveUser = () => {
    const name = $('#regName').value.trim(), phone = $('#regPhone').value.replace(/\D/g,''), addr = $('#regAddr').value.trim();
    if (!name || phone.length !== 10 || !addr) { alert("Fill all fields correctly"); return; }
    state.user = { name, phone, addr, wishlist: [] };
    saveState(); closeModal('loginModal'); showToast("Welcome " + name.split(' ')[0] + "!");
};

window.verifyOwnerPin = () => {
    const pin = $('#ownerPinInput').value;
    if(pin === OWNER_PIN) { state.ownerMode = true; closeModal('ownerPinModal'); render(); }
    else alert("Wrong PIN");
};

window.showToast = (msg) => {
    const t = $('#toast'); t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
};

window.openModal = (id) => $('#' + id).classList.add('open');
window.closeModal = (id) => $('#' + id).classList.remove('open');

// === 7. RENDER ENGINE ===
function render() {
    const container = $('#mainView');
    let html = '';
    switch(state.view) {
        case 'home': html = renderHome(); break;
        case 'shop': html = renderShop(); break;
        case 'profile': html = renderProfile(); break;
        case 'owner': html = renderOwner(); break;
        default: html = renderHome();
    }
    container.innerHTML = html;
    updateNavActive();
    updateCartBadge();
}

function updateNavActive() {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const map = { home: 0, shop: 1, profile: 2, owner: 3 };
    if(map[state.view] !== undefined) document.querySelectorAll('.nav-item')[map[state.view]].classList.add('active');
    const titles = { home: ['Namaste Udala', 'Smart Tiffin Builder'], shop: ['Shop', 'All-in-One Marketplace'], profile: ['My Profile', 'Orders & Wishlist'], owner: ['Admin Panel', 'Analytics & Control'] };
    if(titles[state.view]) { $('#pageTitle').innerText = titles[state.view][0]; $('#pageSubtitle').innerText = titles[state.view][1]; }
}

function updateCartBadge() {
    const count = Object.values(state.cart).reduce((a, b) => a + b, 0);
    $('#cartBadge').style.display = count > 0 ? 'block' : 'none';
}

// --- VIEW: HOME (SMART PLAN BUILDER) ---

                        ${['rice','roti','both'].map(m => `<button style="flex:1;padding:8px;border-radius:8px;border:1px solid ${cfg.dinner===m?'var(--primary)':'var(--border)'};background:${cfg.dinner===m?'#fff7ed':'white'};color:${cfg.dinner===m?'var(--primary)':'var(--text-muted)'};font-size:11px;font-weight:700;cursor:pointer;" onclick="setPlanMeal('dinner','${m}')">${m==='rice'?'🍚 Rice':m==='roti'?'🫓 Roti':'🍱 Both (+₹10)'}</button>`).join('')}

                    </div>

            </div>
            <div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);">

                <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:4px;"><span>Lunch Upgrade</span><span>${fmt(pricing.lunchCost)}</span></div>
                <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:4px;"><span>Dinner Upgrade</span><span>${fmt(pricing.dinnerCost)}</span></div>
                <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:4px;"><span>Extra Roti (${cfg.extraRoti}x)</span><span>${fmt(pricing.rotiCost)}</span></div>
                <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:800;color:var(--text-main);margin-top:8px;"><span>Total Payable</span><span>${fmt(pricing.total)}</span></div>

            <p style="font-size:10px;color:var(--text-muted);text-align:center;margin-top:8px;">🔒 Secure UPI Payment • Free Delivery • Skip Facility</p>

window.setPlanType = (type) => { state.planConfig.type = type; render(); };
window.setPlanDays = (days) => { state.planConfig.days = days; render(); };
window.setPlanMeal = (slot, choice) => { state.planConfig[slot] = choice; render(); };
window.adjustPlanRoti = (delta) => { state.planConfig.extraRoti = Math.max(0, Math.min(4, state.planConfig.extraRoti + delta)); render(); };

window.startPlanCheckout = () => {
    if(!state.user) { openModal('loginModal'); showToast("Please login first"); return; }
    const pricing = calculatePlanPrice(state.planConfig);
    const orderId = Date.now();
    const newOrder = { id: orderId, ts: Date.now(), type: 'subscription', details: {...state.planConfig}, total: pricing.total, status: 'pending', userName: state.user.name, userPhone: state.user.phone, address: state.user.addr };
    let orders = JSON.parse(localStorage.getItem('nu_orders')) || [];
    orders.push(newOrder); localStorage.setItem('nu_orders', JSON.stringify(orders));
    if(state.db) set(ref(state.db, 'orders/' + orderId), newOrder);
    const upiLink = `upi://pay?pa=${UPI_ID}&pn=NamasteUdala&cu=INR&am=${Math.round(pricing.total)}&tn=Plan#${orderId}`;
    window.location.href = upiLink;
    setTimeout(() => { showToast("Redirecting to UPI..."); switchTab('profile'); }, 1000);
};

// --- VIEW: SHOP (UNIFIED GRID) ---
function renderShop() {
    const filtered = state.shopFilter === 'All' ? CATALOG : CATALOG.filter(p => p.cat === state.shopFilter);
    return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:20px;font-weight:800;">Shop</h2>
            <div style="font-size:12px;color:var(--text-muted);">${filtered.length} items</div>
        </div>
        <div class="filter-chips">
            ${['All','Plans','Grocery','Services','Bulk'].map(c => `<div class="chip ${state.shopFilter===c?'active':''}" onclick="setShopFilter('${c}')">${c}</div>`).join('')}
        </div>
        <div class="shop-grid">
            ${filtered.map(p => createProductCard(p)).join('')}
        </div>
    `;
}

function createProductCard(p) {
    const disc = p.mrp ? getDisc(p.mrp, p.price) : 0;
    const inCart = state.cart[p.id] > 0;
    const isWished = state.user?.wishlist?.includes(p.id);
    const isPlan = p.type === 'plan';
    
    return `
        <div class="prod-card">
            <div class="prod-img-wrap">
                ${disc > 0 ? `<span class="discount-badge">${disc}% OFF</span>` : ''}
                <span class="cat-badge">${p.cat}</span>
                <div class="wish-heart ${isWished ? 'active' : ''}" onclick="toggleWish('${p.id}')">❤</div>
                <img src="${p.img}" alt="${p.name}" class="prod-img" loading="lazy">
            </div>
            <div class="prod-body">
                <div class="prod-name">${p.name}</div>
                ${p.desc ? `<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px;">${p.desc}</div>` : ''}
                <div class="prod-rating">⭐ ${p.rating}</div>
                <div class="prod-price-row">
                    <span class="curr-price">${fmt(p.price)}</span>
                    ${p.mrp ? `<span class="old-price">${fmt(p.mrp)}</span>` : ''}
                </div>
                <button class="add-cart-btn ${inCart ? 'in-cart' : ''} ${isPlan ? 'plan-btn' : ''}" onclick="${isPlan ? `openPlanBuilder()` : `addToCart('${p.id}')`}">
                    ${isPlan ? 'Customize Plan' : (inCart ? `In Cart (${state.cart[p.id]})` : 'Add to Cart')}
                </button>
            </div>
        </div>
    `;
}

window.addToCart = (id) => {
    state.cart[id] = (state.cart[id] || 0) + 1;
    saveState(); showToast("Added to cart!");
};

window.toggleWish = (id) => {
    if(!state.user) { openModal('loginModal'); return; }
    state.user.wishlist = state.user.wishlist || [];
    const idx = state.user.wishlist.indexOf(id);
    if(idx > -1) state.user.wishlist.splice(idx, 1); else state.user.wishlist.push(id);
    saveState();
};

window.openPlanBuilder = () => { switchTab('home'); };

// --- VIEW: PROFILE ---
function renderProfile() {
    if(!state.user) return `<div class="card" style="text-align:center;padding:40px 20px;"><div style="width:64px;height:64px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;color:#9ca3af;">?</div><h3 style="margin-bottom:8px;">Login Required</h3><p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">Track orders, save wishlist, and get exclusive discounts.</p><button class="btn-primary" onclick="openModal('loginModal')">Login / Register</button></div>`;
    const u = state.user, myOrders = JSON.parse(localStorage.getItem('nu_orders')) || [];
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--secondary),#127a52);color:white;text-align:center;">
            <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 12px;">${u.name.charAt(0).toUpperCase()}</div>
            <h2 style="font-size:18px;font-weight:800;">${esc(u.name)}</h2>
            <p style="opacity:0.9;font-size:12px;">${esc(u.phone)}</p>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;">
                <div style="background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;"><b style="display:block;font-size:16px;">${myOrders.length}</b><span style="font-size:10px;opacity:0.8;">Orders</span></div>
                <div style="background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;"><b style="display:block;font-size:16px;">${u.wishlist?.length || 0}</b><span style="font-size:10px;opacity:0.8;">Wishlist</span></div>
                <div style="background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;"><b style="display:block;font-size:16px;">₹${Math.floor(myOrders.reduce((a,o)=>a+o.total,0)/10)}</b><span style="font-size:10px;opacity:0.8;">Points</span></div>
            </div>
        </div>
        <div class="card"><h3>Saved Address</h3><div style="background:#f8fafc;padding:12px;border-radius:12px;font-size:13px;color:var(--text-muted);">${esc(u.addr || 'No address saved')}</div><button class="btn-secondary" style="margin-top:10px;" onclick="editAddress()">Change Address</button></div>
        <div class="card"><h3>Recent Orders</h3>${myOrders.length ? myOrders.slice(-5).reverse().map(o => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;"><div><div style="font-weight:700;font-size:14px;">#${String(o.id).slice(-4)}</div><div style="font-size:11px;color:var(--text-muted);">${new Date(o.ts).toLocaleDateString()}</div></div><div style="text-align:right;"><div style="font-weight:800;">${fmt(o.total)}</div><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${o.status==='delivered'?'#dcfce7':'#fef3c7'};color:${o.status==='delivered'?'#166534':'#92400e'};">${o.status.toUpperCase()}</span></div></div>`).join('') : '<p style="color:var(--text-muted);font-size:13px;text-align:center;">No orders yet.</p>'}</div>
        <button class="btn-primary" style="background:var(--danger);" onclick="logout()">Logout</button>
    `;
}

window.editAddress = () => { const newAddr = prompt("Enter New Address:", state.user.addr); if(newAddr) { state.user.addr = newAddr; saveState(); showToast("Address Updated"); } };
window.logout = () => { state.user = null; localStorage.removeItem('nu_user'); render(); showToast("Logged Out"); };

// --- VIEW: OWNER DASHBOARD ---
function renderOwner() {
    if(!state.ownerMode) return `<div class="card" style="text-align:center;padding:40px 20px;"><h3 style="margin-bottom:16px;">Owner Access 🔐</h3><input type="password" id="opin" class="input-field" placeholder="Enter PIN" style="margin-bottom:12px;"><button class="btn-primary" onclick="verifyOwnerPinInline()">Unlock Dashboard</button></div>`;
    const sales = state.allOrders.reduce((a, o) => a + o.total, 0);
    const pending = state.allOrders.filter(o => o.status === 'pending').length;
    const breakdown = getRevenueBreakdown();
    const totalRev = Object.values(breakdown).reduce((a,b)=>a+b,0) || 1;
    const bars = Object.entries(breakdown).map(([cat, val]) => {
        const pct = Math.round((val / totalRev) * 100);
        const colors = { Plans:'#f5b301', Grocery:'#0e5c3f', Services:'#2563eb', Bulk:'#ff5a1f' };
        return `<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:4px;"><span>${cat}</span><span>${fmt(val)} (${pct}%)</span></div><div style="height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${colors[cat]||'#ccc'};"></div></div></div>`;
    }).join('');

    return `
        <div class="card" style="background:var(--secondary);color:white;">
            <h3 style="color:white;">Admin Dashboard</h3>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;">
                <div style="background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;text-align:center;"><b style="font-size:18px;display:block;">${fmt(sales)}</b><small>Total Sales</small></div>
                <div style="background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;text-align:center;"><b style="font-size:18px;display:block;">${pending}</b><small>Pending</small></div>
            </div>
        </div>
        <div class="card"><h3>📊 Revenue Breakdown (AI Analysis)</h3>${bars}</div>
        <div class="card"><h3>Live Orders</h3>${state.allOrders.length ? state.allOrders.slice().reverse().map(o => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;"><div><div style="font-weight:700;font-size:14px;">${esc(o.userName)}</div><div style="font-size:11px;color:var(--text-muted);">${new Date(o.ts).toLocaleTimeString()} · ${o.items?.length || 1} items</div></div><div style="text-align:right;"><div style="font-weight:800;">${fmt(o.total)}</div><select onchange="updateOrderStatus('${o.id}', this.value)" style="font-size:11px;padding:4px;border-radius:6px;border:1px solid #ddd;"><option value="pending" ${o.status==='pending'?'selected':''}>Pending</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option></select></div></div>`).join('') : '<p style="color:var(--text-muted);font-size:13px;text-align:center;">No orders yet.</p>'}</div>
        <button class="btn-primary" style="background:var(--danger);" onclick="lockOwner()">Lock Dashboard</button>
    `;
}

window.verifyOwnerPinInline = () => { const pin = $('#opin').value; if(pin === OWNER_PIN) { state.ownerMode = true; render(); } else alert("Wrong PIN"); };
window.lockOwner = () => { state.ownerMode = false; state.view = 'home'; render(); };
window.updateOrderStatus = (id, status) => { const order = state.allOrders.find(o => o.id == id); if(order) { order.status = status; if(state.db) set(ref(state.db, 'orders/' + id), order); renderOwner(); showToast("Status Updated"); } };

// === 8. CART LOGIC ===
function renderCartItems() {
    const container = $('#cartItemsList'); let total = 0, html = '';
    for (const [id, qty] of Object.entries(state.cart)) {
        const p = CATALOG.find(x => x.id == id);
        if (p) {
            const itemTotal = p.price * qty; total += itemTotal;
            html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;"><div><div style="font-weight:700;font-size:14px;">${p.name}</div><div style="font-size:12px;color:#666;">${qty} x ${fmt(p.price)}</div></div><div style="font-weight:800;">${fmt(itemTotal)}</div></div>`;
        }
    }
    container.innerHTML = html || '<p style="text-align:center;color:#999;">Cart is empty</p>';
    $('#cartTotalDisplay').innerText = fmt(total);
}

window.checkoutCart = () => {
    const total = Object.entries(state.cart).reduce((acc, [id, qty]) => { const p = CATALOG.find(x => x.id == id); return acc + (p ? p.price * qty : 0); }, 0);
    if (total === 0) return alert("Empty Cart");
    const orderId = Date.now();
    const newOrder = { id: orderId, ts: Date.now(), type: 'shop', items: Object.entries(state.cart).map(([id, q]) => ({ id, qty: q })), total, status: 'pending', userName: state.user.name, userPhone: state.user.phone, address: state.user.addr };
    let orders = JSON.parse(localStorage.getItem('nu_orders')) || [];
    orders.push(newOrder); localStorage.setItem('nu_orders', JSON.stringify(orders));
    if(state.db) set(ref(state.db, 'orders/' + orderId), newOrder);
    const upiLink = `upi://pay?pa=${UPI_ID}&pn=NamasteUdala&cu=INR&am=${Math.round(total)}&tn=Order#${orderId}`;
    window.location.href = upiLink;
    setTimeout(() => { state.cart = {}; saveState(); closeModal('cartModal'); showToast("Order Placed! Check Profile."); switchTab('profile'); }, 2000);
};

// === 9. INITIALIZATION ===
function init() {
    if (localStorage.getItem('nu_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    try { state.cart = JSON.parse(localStorage.getItem('nu_cart')) || {}; } catch(e){}
    render();
}

init();
</script>
</body>
</html>
