<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
import * as THREE from 'three';

// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  firebase: { apiKey: "AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y", authDomain: "namaste-udala.firebaseapp.com", projectId: "namaste-udala", storageBucket: "namaste-udala.firebasestorage.app", messagingSenderId: "998684348165", appId: "1:998684348165:web:4bb0d2f5335a90a394716c" },
  whatsapp: '919583937047', ownerPin: '4821'
};
const PRICING = { veg: { 7: 749, 15: 1499, 30: 2899 }, nv: { 7: 949, 15: 1849, 30: 3599 } };
const IMAGES = {
  thali: 'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&q=80',
  grocery: 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400&q=80',
  kitchen: 'https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=400&q=80',
  scooter: 'https://images.unsplash.com/photo-1558642452-9d2a7deb7f62?w=400&q=80',
  money: 'https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=400&q=80',
  doodh: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=80',
  paneer: 'https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400&q=80',
  chai: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?w=400&q=80',
  roti: 'https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400&q=80',
  chicken: 'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400&q=80',
  egg: 'https://images.unsplash.com/photo-1482049016688-2d3e1b311543?w=400&q=80'
};

// ============================================================
// STATE
// ============================================================
let S = { prod: [], subs: [], orders: [], expenses: [] };
try { const saved = localStorage.getItem('udalaFinal'); if (saved) S = JSON.parse(saved); } catch (e) {}

let db = null, tab = 'plan', C = {}, OK = 0, SCAT = 'all', SQ = '', ownerSubTab = 'dashboard';
try { OK = sessionStorage.getItem('udok') ? 1 : 0; } catch (e) {}

const F = { type: 'veg', days: '30', name: '', phone: '', area: '', addr: '', pay: 'cash' };

if (S.prod.length === 0) {
  S.prod = [
    { id: 1, n: 'Doodh 500 ml', p: 30, c: 'Dairy', img: IMAGES.doodh, nv: 0 },
    { id: 2, n: 'Paneer 200 g', p: 80, c: 'Dairy', img: IMAGES.paneer, nv: 0 },
    { id: 3, n: 'Chai patti 250 g', p: 130, c: 'Kirana', img: IMAGES.chai, nv: 0 },
    { id: 4, n: 'Atta 1 kg', p: 50, c: 'Kirana', img: IMAGES.roti, nv: 0 },
    { id: 5, n: 'Chicken piece', p: 40, c: 'Non-Veg', img: IMAGES.chicken, nv: 1 },
    { id: 6, n: 'Egg (6 pcs)', p: 48, c: 'Non-Veg', img: IMAGES.egg, nv: 1 }
  ];
}

// ============================================================
// FIREBASE
// ============================================================
try {
  const app = initializeApp(CONFIG.firebase);
  db = getDatabase(app);
  onValue(ref(db, 'udalaFinal'), snapshot => {
    const v = snapshot.val();
    if (v) { S = { ...S, ...v }; render(); }
  });
} catch (e) { console.log('Offline'); }

const save = () => {
  localStorage.setItem('udalaFinal', JSON.stringify(S));
  if (db) set(ref(db, 'udalaFinal'), S);
  render();
};

// ============================================================
// UTILITIES
// ============================================================
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayStr = () => iso(new Date());
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const cleanPhone = s => String(s || '').replace(/\D/g, '').slice(-10);
const showToast = (msg, type = 'success') => {
  const t = $('#toast'); t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
};
const vibrate = () => { if (navigator.vibrate) navigator.vibrate(20); };

// Helper: Check if subscription is active today
const isSubActive = (sub) => {
  const today = todayStr();
  const end = iso(addDays(new Date(sub.startDate), sub.days - 1));
  return today >= sub.startDate && today <= end && sub.status === 'active';
};

// Helper: Get subscription end date
const getSubEndDate = (sub) => iso(addDays(new Date(sub.startDate), sub.days - 1));

// Helper: Get subscription status
const getSubStatus = (sub) => {
  if (sub.status === 'cancelled') return 'cancelled';
  const today = todayStr();
  const end = getSubEndDate(sub);
  if (today > end) return 'expired';
  return 'active';
};

// ============================================================
// THREE.JS 3D
// ============================================================
let scene, camera, renderer, vegModel, nvModel, currentModel;
const init3D = () => {
  const container = $('#canvas-container');
  if (!container) return;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  camera.position.z = 4;
  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(120, 120);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);
  
  // Veg Thali
  vegModel = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.1, 32), new THREE.MeshPhysicalMaterial({ color: 0xC0C0C0, metalness: 0.9, roughness: 0.1 }));
  vegModel.add(plate);
  const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), new THREE.MeshPhysicalMaterial({ color: 0xFF6B35 }));
  b1.position.set(-0.4, 0.15, 0); vegModel.add(b1);
  const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16), new THREE.MeshPhysicalMaterial({ color: 0x10B981 }));
  b2.position.set(0.4, 0.15, 0); vegModel.add(b2);
  const roti = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.05, 16), new THREE.MeshPhysicalMaterial({ color: 0xD4A574 }));
  roti.position.set(0, 0.1, 0.4); vegModel.add(roti);
  
  // Chicken Leg
  nvModel = new THREE.Group();
  const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 8, 16), new THREE.MeshPhysicalMaterial({ color: 0x8B4513, roughness: 0.6 }));
  leg.rotation.z = Math.PI / 4; nvModel.add(leg);
  const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), new THREE.MeshPhysicalMaterial({ color: 0xFFFFFF }));
  bone.position.set(-0.3, -0.3, 0); bone.rotation.z = Math.PI / 4; nvModel.add(bone);
  
  currentModel = vegModel;
  scene.add(currentModel);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const pl = new THREE.PointLight(0xFCD34D, 1.5, 10); pl.position.set(3, 3, 3); scene.add(pl);
  
  const animate = () => {
    requestAnimationFrame(animate);
    if (currentModel) { currentModel.rotation.y += 0.015; currentModel.position.y = Math.sin(Date.now() * 0.002) * 0.1; }
    renderer.render(scene, camera);
  };
  animate();
};

const switch3DModel = (type) => {
  if (!scene || !currentModel) return;
  scene.remove(currentModel);
  currentModel = type === 'nv' ? nvModel : vegModel;
  scene.add(currentModel);
};

// ============================================================
// MODAL
// ============================================================
const showModal = (content) => {
  $('#modalContainer').innerHTML = `<div class="modal-overlay" data-a="closeModal"><div class="modal" onclick="event.stopPropagation()">${content}</div></div>`;
};
const closeModal = () => { $('#modalContainer').innerHTML = ''; };

// ============================================================
// VIEWS
// ============================================================
const VIEWS = {
  plan: () => {
    switch3DModel(F.type);
    const price = PRICING[F.type][F.days] || 2899;

    <div class="detail-row"><span class="label">⏳ Days Left</span><span class="value">${daysLeft} din</span></div>
    <div class="detail-row"><span class="label">💰 Price</span><span class="value" style="color:var(--o)">${inr(sub.price)}</span></div>
    <div class="detail-row"><span class="label">🫓 Extra Roti</span><span class="value">${sub.extraRoti || 0} per day</span></div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <a href="https://wa.me/91${sub.phone}" target="_blank" class="btn g" style="flex:1;text-decoration:none;text-align:center">💬 WhatsApp</a>
      <a href="tel:${sub.phone}" class="btn b" style="flex:1;text-decoration:none;text-align:center">📞 Call</a>
    </div>
    ${status === 'active' ? `<button class="btn r" data-a="cancelSub" data-id="${sub.id}">❌ Cancel Subscription</button>` : ''}
    <button class="btn" data-a="closeModal" style="background:var(--line);color:var(--text)">Close</button>
  `);
};

const viewOrder = (id) => {
  const order = S.orders.find(o => o.id == id);
  if (!order) return;
  
  showModal(`
    <h3>📦 Order Details</h3>
    <div style="text-align:center;margin-bottom:20px">
      <div style="width:80px;height:80px;border-radius:50%;background:${order.status==='pending'?'#FEF3C7':'#D1FAE5'};display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 12px">
        ${order.status === 'pending' ? '⏳' : '✅'}
      </div>
      <h2 style="margin-bottom:4px">${esc(order.name)}</h2>
      <span class="badge ${order.status}">${order.status.toUpperCase()}</span>
    </div>
    <div class="detail-row"><span class="label">📱 Phone</span><span class="value">${order.phone}</span></div>
    <div class="detail-row"><span class="label">📍 Area</span><span class="value">${esc(order.area || 'Udala')}</span></div>
    <div class="detail-row"><span class="label">📅 Date</span><span class="value">${order.date}</span></div>
    <h4 style="margin:16px 0 8px">🛒 Items:</h4>
    ${order.items.map(i => `<div class="detail-row"><span class="label">${esc(i.n)} × ${i.q}</span><span class="value">${inr(i.p * i.q)}</span></div>`).join('')}
    <div class="detail-row" style="background:var(--bg);padding:12px;border-radius:12px;margin-top:12px"><span class="label" style="font-weight:700">💰 Total</span><span class="value" style="color:var(--o);font-size:18px">${inr(order.total)}</span></div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <a href="https://wa.me/91${order.phone}" target="_blank" class="btn g" style="flex:1;text-decoration:none;text-align:center">💬 WhatsApp</a>
      <a href="tel:${order.phone}" class="btn b" style="flex:1;text-decoration:none;text-align:center">📞 Call</a>
    </div>
    ${order.status === 'pending' ? `<button class="btn" data-a="markDelivered" data-id="${order.id}">✅ Mark Delivered</button>` : ''}
    <button class="btn" data-a="closeModal" style="background:var(--line);color:var(--text)">Close</button>
  `);
};

const viewCustomer = (phone) => {
  const customerData = { name: '', phone, area: '', subs: [], orders: [], totalSpent: 0 };
  S.subs.forEach(s => { if (s.phone === phone) { customerData.name = s.name; customerData.area = s.area; customerData.subs.push(s); customerData.totalSpent += s.price; } });
  S.orders.forEach(o => { if (o.phone === phone) { customerData.name = o.name; customerData.area = o.area; customerData.orders.push(o); customerData.totalSpent += o.total; } });
  
  showModal(`
    <h3>👤 Customer Details</h3>
    <div style="text-align:center;margin-bottom:20px">
      <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg, var(--o), var(--o-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:32px;margin:0 auto 12px">
        ${customerData.name.charAt(0).toUpperCase()}
      </div>
      <h2 style="margin-bottom:4px">${esc(customerData.name)}</h2>
      <div class="s">📱 ${customerData.phone} · 📍 ${esc(customerData.area || 'Udala')}</div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="val">${customerData.subs.length}</div><div class="lbl">Subscriptions</div></div>
      <div class="stat-box orange"><div class="val">${customerData.orders.length}</div><div class="lbl">Orders</div></div>
    </div>
    <div class="detail-row" style="background:var(--bg);padding:12px;border-radius:12px"><span class="label" style="font-weight:700">💰 Total Spent</span><span class="value" style="color:var(--o);font-size:18px">${inr(customerData.totalSpent)}</span></div>
    
    ${customerData.subs.length > 0 ? `<h4 style="margin:16px 0 8px">🍱 Subscriptions:</h4>${customerData.subs.map(s => `<div class="detail-row"><span class="label">${s.type === 'veg' ? '🟢' : '🔴'} ${s.days} din · ${s.startDate}</span><span class="value">${inr(s.price)}</span></div>`).join('')}` : ''}
    
    ${customerData.orders.length > 0 ? `<h4 style="margin:16px 0 8px">📦 Orders:</h4>${customerData.orders.map(o => `<div class="detail-row"><span class="label">${o.date} · ${o.items.length} items</span><span class="value">${inr(o.total)}</span></div>`).join('')}` : ''}
    
    <div style="display:flex;gap:8px;margin-top:20px">
      <a href="https://wa.me/91${phone}" target="_blank" class="btn g" style="flex:1;text-decoration:none;text-align:center">💬 WhatsApp</a>
      <a href="tel:${phone}" class="btn b" style="flex:1;text-decoration:none;text-align:center">📞 Call</a>
    </div>
    <button class="btn" data-a="closeModal" style="background:var(--line);color:var(--text)">Close</button>
  `);
};

// ============================================================
// RENDER
// ============================================================
const render = () => {
  if (!OK && !['plan', 'shop'].includes(tab)) tab = 'plan';
  $('#v').innerHTML = VIEWS[tab]();
  $('#ht').textContent = { plan: 'Aaj ka Plan', shop: 'Shop', kitchen: 'Kitchen', delivery: 'Delivery', owner: 'Admin Panel' }[tab];
  
  const navItems = [
    ['plan', '🍱 Plan', IMAGES.thali],
    ['shop', '🛒 Shop', IMAGES.grocery],
    ['kitchen', '👨‍🍳 Kitchen', IMAGES.kitchen],
    ['delivery', '🛵 Delivery', IMAGES.scooter],
    ['owner', '👤 Admin', IMAGES.money]
  ];
  
  $('#nav').innerHTML = navItems.filter(x => OK || x[0] === 'plan' || x[0] === 'shop')
    .map(x => `<div class="${x[0] === tab ? 'on' : ''}" data-a="tab" data-v="${x[0]}"><img src="${x[2]}" onerror="this.style.opacity=0">${x[1]}</div>`).join('');
  
  setTimeout(() => $('#loadingScreen').classList.add('hide'), 600);
};

// ============================================================
// ACTIONS
// ============================================================
const ACTIONS = {
  tab: v => {
    if (['kitchen', 'delivery', 'owner'].includes(v) && !OK) {
      const pin = prompt('Owner PIN:');
      if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); showToast('🔓 Admin Access Granted'); }
      else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); return; }
    }
    tab = v; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  set: (v, k) => { F[k] = v; render(); },
  inc: (v, k, id) => { vibrate(); C[id] = (C[id] || 0) + 1; render(); },
  dec: (v, k, id) => { vibrate(); C[id] = Math.max(0, (C[id] || 0) - 1); if (C[id] === 0) delete C[id]; render(); },
  cat: v => { SCAT = v; render(); },
  ownerTab: v => { ownerSubTab = v; render(); },
  closeModal: () => closeModal(),
  
  viewSub: (v, k, id) => viewSubscription(id),
  viewOrder: (v, k, id) => viewOrder(id),
  viewCustomer: (v, k, id) => viewCustomer(id),
  
  voice: () => {
    vibrate();
    if ('webkitSpeechRecognition' in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'hi-IN';
      recognition.start();
      const btn = $('#voiceBtn');
      if (btn) btn.classList.add('listening');
      showToast('🎤 Bol rahe hain...');
      recognition.onresult = (e) => { SQ = e.results[0][0].transcript; render(); showToast(`🔍 ${SQ}`); };
      recognition.onerror = () => { showToast('❌ Awaaz nahi suni', 'error'); if (btn) btn.classList.remove('listening'); };
      recognition.onend = () => { if (btn) btn.classList.remove('listening'); };
    } else showToast('❌ Voice not supported', 'error');
  },
  
  join: () => {
    vibrate();
    if (!F.name || F.phone.length !== 10) { showToast('❌ Naam aur 10 digit phone daalo', 'error'); return; }
    const price = PRICING[F.type][F.days] || 2899;
    S.subs.push({ id: Date.now(), name: F.name, phone: cleanPhone(F.phone), area: F.area, type: F.type, days: +F.days, startDate: todayStr(), price: price, status: 'active', extraRoti: 0 });
    save(); showToast('✅ Plan ban gaya!');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=🍱 *Naya Plan*%0A👤 ${F.name}%0A📱 ${F.phone}%0A🍽️ ${F.type} · ${F.days} din%0A💰 ₹${price}`, '_blank');
    F.name = ''; F.phone = ''; F.area = '';
  },
  
  order: () => {
    vibrate();
    if (!F.name || F.phone.length !== 10) { showToast('❌ Naam aur phone daalo', 'error'); return; }
    const items = []; let total = 0;
    Object.entries(C).forEach(([k, q]) => { const p = S.prod.find(x => x.id == k); if (p && q > 0) { items.push({ n: p.n, q, p: p.p }); total += p.p * q; } });
    if (!items.length) { showToast('❌ Cart khali hai', 'error'); return; }
    S.orders.push({ id: Date.now(), name: F.name, phone: cleanPhone(F.phone), area: F.area, items, total, status: 'pending', date: todayStr() });
    C = {}; save(); showToast('✅ Order ho gaya!');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *Naya Order*%0A👤 ${F.name}%0A📱 ${F.phone}%0A📦 ${items.map(i=>`${i.n} x${i.q}`).join(', ')}%0A💰 ₹${total}`, '_blank');
  },

  addProduct: () => {
    vibrate();
    const name = $('#newPName')?.value, price = parseInt($('#newPPrice')?.value), cat = $('#newPCat')?.value || 'General', nv = parseInt($('#newPType')?.value) || 0;
    if (!name || !price) { showToast('❌ Name aur Price daalo', 'error'); return; }
    S.prod.push({ id: Date.now(), n: name, p: price, c: cat, img: IMAGES.grocery, nv: nv });
    save(); showToast('✅ Product added!');
  },
  
  delProd: (v, k, id) => {
    vibrate();
    if (confirm('Delete this product?')) { S.prod = S.prod.filter(p => p.id != id); save(); showToast('🗑️ Deleted'); }
  },

  addExpense: () => {
    vibrate();
    const name = $('#expName')?.value, amount = parseInt($('#expAmount')?.value);
    if (!name || !amount) { showToast('❌ Name aur Amount daalo', 'error'); return; }
    S.expenses.push({ id: Date.now(), name: name, amount: amount, date: todayStr() });
    save(); showToast('✅ Expense added!');
  },

  delExpense: (v, k, id) => {
    vibrate();
    if (confirm('Delete this expense?')) { S.expenses = S.expenses.filter(e => e.id != id); save(); showToast('🗑️ Deleted'); }
  },

  markDelivered: (v, k, id) => {
    vibrate();
    const order = S.orders.find(o => o.id == id);
    if (order) { order.status = 'delivered'; save(); showToast('✅ Delivered!'); closeModal(); }
  },

  cancelSub: (v, k, id) => {
    vibrate();
    if (confirm('Cancel this subscription?')) {
      const sub = S.subs.find(s => s.id == id);
      if (sub) { sub.status = 'cancelled'; save(); showToast('❌ Cancelled'); closeModal(); }
    }
  },
  
  out: () => { OK = 0; sessionStorage.removeItem('udok'); tab = 'plan'; ownerSubTab = 'dashboard'; render(); showToast('🚪 Logged out'); }
};

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  vibrate();
  const action = ACTIONS[btn.dataset.a];
  if (action) { try { action(btn.dataset.v, btn.dataset.k, btn.dataset.id); } catch (err) { console.error(err); showToast('❌ Error', 'error'); } }
});

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) { F[field] = e.target.value; if (field === 'phone') F.phone = cleanPhone(F.phone); }
  if (e.target.id === 'sq') { SQ = e.target.value; if (tab === 'shop') render(); }
});

let tapCount = 0;
$('#mainHeader').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN:');
    if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); tab = 'owner'; render(); showToast('🔓 Admin Access Granted'); }
    else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); }
  }
});

const initTheme = () => {
  const saved = localStorage.getItem('ud_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('#themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
};
$('#themeToggle').addEventListener('click', () => {
  vibrate();
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ud_theme', next);
  $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});

initTheme();
init3D();
render();
console.log('🍱 Namaste Udala Complete Suite Loaded!');
</script>
</body>
</html>
