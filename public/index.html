.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:var(--bad)}
.pbar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.pfill{height:100%;background:var(--ok);transition:width .5s}
.fab{position:fixed;right:16px;bottom:90px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;text-decoration:none;box-shadow:0 6px 18px rgba(37,211,102,.4)}

.seg button.on{background:var(--o);color:#fff;border-color:var(--o)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{border-radius:16px;padding:14px;text-align:center;color:#fff}

.gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}

</style>
</head>

kitchen:()=>{
 if(!OK)return `<div class="card"><h3>🔒 Locked</h3><p class="s">Header par 5 tap → PIN</p></div>`;

 const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k)&&!s.pause.includes(k));
 const veg=on.filter(s=>s.type==='veg').length,nv=on.filter(s=>s.type==='nv').length;
 const roti=on.reduce((a,s)=>a+((s.lunch!=='chawal'?4:0)+(s.dinner!=='chawal'?4:0)+s.extraRoti),0);
 const chawal=on.reduce((a,s)=>a+((s.lunch!=='roti'?1:0)+(s.dinner!=='roti'?1:0)),0);

 const rm=[['Atta',(roti*K.attaPerRoti/1000).toFixed(2)+' kg'],['Chawal',(chawal*K.ricePerPlate/1000).toFixed(2)+' kg'],['Dal',((veg+nv)*K.dalPerThali/1000).toFixed(2)+' kg'],['Sabzi',(vegCurry*K.sabziPerCurry/1000).toFixed(2)+' kg'],['Chicken',(nvCurry*K.chickenPerCurry/1000).toFixed(2)+' kg'],['Tel',(((roti/10)*K.oilPer10Roti+(vegCurry+nvCurry)*K.oilPerCurry)/1000).toFixed(2)+' L']];
 let consumed=0,skipped=0;on.forEach(s=>['subah','lunch','dinner'].forEach(m=>{const v=S.meals[k+'_'+s.id+'_'+m];if(v==='consumed')consumed++;if(v==='skipped')skipped++}));

 const tw=(S.waste||[]).filter(w=>w.d===k);

 if(tw.length)h+=`<div class="row"><b>Aaj ka total waste</b><b style="color:var(--bad)">${inr(tw.reduce((a,w)=>a+(+w.cost||0),0))}</b></div>`;

  if(!pendPay.length)h+=`<p class="s">Koi payment pending nahi 🎉</p>`;
  const unpaidOrd=(S.orders||[]).filter(o=>!o.paid);
  if(unpaidOrd.length){h+=`<b class="s" style="font-weight:800;margin-top:14px;display:block">🛒 SHOP BAAKI:</b>`;unpaidOrd.slice(-8).reverse().forEach(o=>{h+=`<div class="row"><div><b>${esc(o.name)}</b><div class="s">${inr(o.total)}</div></div><button class="btn sm g" data-a="orderPaid" data-id="${o.id}">Paid ✓</button></div>`})}
  h+=`<b class="s" style="font-weight:800;margin-top:14px;display:block">💰 HISTORY:</b>`;
  (S.pays||[]).slice(-8).reverse().forEach(p=>{h+=`<div class="row"><div><b>${esc(p.name)}</b><div class="s">${p.d}</div></div><b>${inr(p.amt)}</b></div>`});
 }
 else if(OSEC==='subs'){
  const expired=(S.subs||[]).filter(s=>getSubStatus(s)==='expired').slice(-10).reverse();
  if(expired.length)h+=`<button class="btn b" data-a="winbackAll">💌 Win-back sabko bhejo (${expired.length})</button>`;
  expired.forEach(s=>{const d=Math.floor((new Date()-subEnd(s))/86400000);
   h+=`<div class="row"><div><b>${esc(s.name)}</b><div class="s">${d} din pehle expire · ${s.phone}</div></div><button class="btn sm b" data-a="winback" data-id="${s.id}">💌</button></div>`});
  h+=`<b class="s" style="font-weight:800;margin-top:14px;display:block">🍱 SAB PLANS:</b>`;
  (S.subs||[]).slice().reverse().forEach(s=>{h+=`<div class="row"><div><b>${esc(s.name)}</b><div class="s">${s.phone} · ${inr(s.price)}</div></div><div style="display:flex;gap:6px;align-items:center">${badge(getSubStatus(s))}<button class="btn sm" data-a="ownerPause" data-id="${s.id}">⏸</button></div></div>`});
  if(!(S.subs||[]).length)h+=`<p class="s">Koi plan nahi.</p>`;
 }
 else if(OSEC==='prod'){
  h+=`<div style="background:var(--bg);border-radius:14px;padding:12px"><input id="pn" placeholder="Naam" style="margin:0 0 8px"><div style="display:flex;gap:8px"><input id="pp" type="number" placeholder="Price" style="margin:0"><input id="pc" placeholder="Category" style="margin:0"></div><button class="btn g" data-a="addProd">➕ Add</button></div>`;
  (S.prod||[]).forEach(p=>{h+=`<div class="row"><div style="flex:1"><b>${esc(p.n)}</b><div class="s">${esc(p.c)} · ${inr(p.p)}</div></div><button class="btn sm ${p.s===0?'r':'g'}" data-a="stock" data-id="${p.id}">${p.s===0?'Out':'Stock'}</button><button class="btn sm r" data-a="delProd" data-id="${p.id}">🗑️</button></div>`});
 }
 else{
  const K=KOPT();
  h+=`<div class="s">Kal ka menu:</div><input id="mveg" placeholder="Veg" value="${esc(mf(addDays(new Date(),1),'veg'))}"><input id="mnv" placeholder="Non-veg" value="${esc(mf(addDays(new Date(),1),'nv'))}"><button class="btn sm g" data-a="setMenu">💾 Menu</button>
   <div class="s" style="margin-top:12px;font-weight:700">🧺 Raw material factors (grams):</div>
   <div class="grid2"><input id="k1" type="number" value="${K.attaPerRoti}" placeholder="atta/roti" style="margin:0 0 6px"><input id="k2" type="number" value="${K.ricePerPlate}" placeholder="rice/plate" style="margin:0 0 6px"><input id="k3" type="number" value="${K.sabziPerCurry}" placeholder="sabzi/curry" style="margin:0 0 6px"><input id="k4" type="number" value="${K.chickenPerCurry}" placeholder="chicken/curry" style="margin:0 0 6px"></div>
   <button class="btn sm g" data-a="setKopt">💾 Factors Save</button>
   <div class="s" style="margin-top:12px">Partners:</div><input id="partners" value="${esc((S.partners||[]).join(', '))}">
   <div class="s">Boy PIN:</div><input id="boyPinSet" value="${esc(S.boyPin||'1234')}">
   <button class="btn sm g" data-a="setPartners">💾 Save</button>
   <button class="btn r" data-a="out" style="margin-top:16px">🚪 Logout</button>`;
 }
 return h+`</div>`}
};

const render=()=>{
 try{
  if(BOY)tab='delivery';
  if(!OK&&!BOY&&!['plan','shop'].includes(tab))tab='plan';
  $('#v').innerHTML=VIEWS[tab]();
  $('#ht').textContent={plan:'Aaj ka Plan',shop:'Shop',kitchen:'Kitchen',delivery:'Delivery',owner:'Owner Panel'}[tab];
  let items=[['plan','🍱','Plan'],['shop','🛒','Shop'],['kitchen','👨','Kitchen'],['delivery','🛵','Delivery'],['owner','👤','Owner']];
  if(BOY)items=[['delivery','🛵','Delivery']];
  else if(!OK)items=items.filter(x=>['plan','shop'].includes(x[0]));
  $('#nav').innerHTML=items.map(x=>`<div class="${x[0]===tab?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
 }catch(err){$('#v').innerHTML=`<div class="card"><h3>⚠️ Error</h3><p class="s">${esc(err.message)}</p><button class="btn g" onclick="location.reload()">🔄 Refresh</button></div>`}

const needGPS=()=>{if(!F.map){showToast('❌ Pehle GPS location lein','error');return false}return true};
const needUser=()=>{const n=(F.name||'').trim(),p=cleanPhone(F.phone);if(n.length<2){showToast('❌ Sahi naam likhein','error');return null}if(p.length!==10){showToast('❌ 10 digit phone daalein','error');return null}return {n,p}};

const ACTIONS={
 tab:v=>{
  if(v==='delivery'&&!OK&&!BOY){tab='delivery';render();return}
  if(['kitchen','owner'].includes(v)&&!OK){const x=prompt('Owner PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');showToast('🔓 Owner access')}else{showToast('❌ Galat PIN','error');return}}

 joinTrial:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}

 joinPaid:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}

  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr,skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0});
  if(!ME){ME={name:u.n,phone:u.p,verified:ME?ME.verified:0};saveME()}
  save();showToast('⏳ Plan bana — owner verify karega');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *NAYA PLAN*%0A👤 ${u.n}%0A📱 ${u.p}%0A🍽️ ${F.type} ${F.days} din%0A💰 ${inr(price)}%0A🔢 UTR: ${utr}%0A📍 ${F.map}`,'_blank')},
 order:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const items=[];let tot=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0){items.push({n:p.n,q,p:p.p});tot+=p.p*q}});

  C={};save();showToast('✅ Order mil gaya!');

 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;

 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm(s.name+' reject?')){s.status='rejected';save()}},
 sendReminders:()=>{const list=(S.subs||[]).filter(s=>s.status==='pending');
  blast(list,s=>`https://wa.me/91${s.phone}?text=`+encodeURIComponent(`Namaste ${s.name} ji! 🙏 Aapka plan payment (${inr(s.price)}) pending hai. UPI: ${CONFIG.upi}. Payment ke baad UTR bhejein. 🍱`))},
 orderPaid:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(!o)return;o.paid=1;o.status='delivered';
  S.pays.push({id:Date.now(),d:todayStr(),name:o.name,amt:o.total,mode:'cash',kind:'Shop'});save();showToast('✅ Paid & delivered')},
 winback:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;

 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save()},

 copyShopping:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));

 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim();

 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},

 setMenu:()=>{const k=iso(addDays(new Date(),1));S.mset[k]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save();showToast('💾 Menu save')},
 setKopt:()=>{S.kopt=Object.assign(KOPT(),{attaPerRoti:+($('#k1')?.value)||45,ricePerPlate:+($('#k2')?.value)||120,sabziPerCurry:+($('#k3')?.value)||150,chickenPerCurry:+($('#k4')?.value)||180});save();showToast('💾 Factors save')},
 setPartners:()=>{S.partners=($('#partners')?.value||'').split(',').map(x=>x.trim()).filter(Boolean);
  const bp=($('#boyPinSet')?.value||'').trim();if(bp)S.boyPin=bp;save();showToast('💾 Save')},
 backup:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup download')},
 restore:()=>{$('#restoreFile').click()},

 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render();showToast('🚪 Logout')}
};
