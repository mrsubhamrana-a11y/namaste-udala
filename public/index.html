a{color:var(--o);font-weight:700;font-size:12px;text-decoration:none}

.fv{position:relative;display:inline-block;perspective:900px;pointer-events:auto}
.fv .stage{position:relative;display:inline-block;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.3,1)}
.fv:hover .stage{transform:rotateY(-12deg) rotateX(8deg)}
.fv.tilt .stage{transition:none}

bpadv:(v,k,id)=>{if(!needOK())return;const x=(S.bulk||[]).find(y=>y.id==id);if(x&&!x.paidAdv){x.paidAdv=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:x.name,phone:x.phone,amt:x.adv,mode:x.utr?'online':'cash',kind:'Bulk Advance: '+x.event});logAdd('Bulk advance: '+x.event);save();notify('💰 Advance mil gaya')}},
bpaid:(v,k,id)=>{if(!needOK())return;const x=(S.bulk||[]).find(y=>y.id==id);if(!x||x.paid)return;const bal=x.amt-(x.paidAdv?x.adv:0);if(!confirm(x.event+': baaki '+inr(bal)+' mil gaye? (total '+inr(x.amt)+')'))return;x.paid=1;x.paidAdv=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:x.name,phone:x.phone,amt:bal,mode:x.utr?'online':'cash',kind:'Bulk: '+x.event});award(x.phone,Math.round(x.amt/10));logAdd('Bulk paid: '+x.event);save();notify('✅ Bulk full paid')},
svcat:v=>{SVCAT=v;SVB=null;render()},
svbook:(v,k,id)=>{SVB=id;SVF={date:iso(add(D0(),1)),time:'',opt:'',name:(ME&&ME.name)||F.name||'',phone:(ME&&ME.phone)||F.phone||'',notes:'',utr:''};render();setTimeout(()=>{const e=$('#svform');if(e)e.scrollIntoView({behavior:'smooth'})},120)},
svclose:()=>{SVB=null;render()},
svconfirm:()=>{if(BUSY){notify('⏳ Ruko...');return}const b=SVC.find(x=>x.id===SVB);if(!b)return;const n=(SVF.name||'').trim(),ph=cleanPh(SVF.phone);if(n.length<2||ph.length!==10){alert('Naam aur 10-digit phone daalo');return}if(!SVF.date){alert('Date chuno');return}BUSY=1;setTimeout(()=>{BUSY=0},4000);S.sv=S.sv||[];S.sv.push({id:Date.now(),ts:Date.now(),svid:b.id,svname:b.n,cat:b.cat,date:SVF.date,time:SVF.time,opt:SVF.opt,notes:SVF.notes,name:n,phone:ph,amt:b.from,utr:(SVF.utr||'').replace(/\D/g,'').slice(0,14),status:'pending',paid:0});logAdd('Service booking: '+b.n+' / '+n);SVB=null;save();notify('✅ Booking request gayi!')},
svconf:(v,k,id)=>{if(!needOK())return;const x=(S.sv||[]).find(y=>y.id==id);if(x){x.status='confirmed';logAdd('Service confirm: '+x.svname);save();notify('✅ Booking confirmed')}},
svdone:(v,k,id)=>{if(!needOK())return;const x=(S.sv||[]).find(y=>y.id==id);if(x){x.status='done';save();notify('🟢 Service done')}},
svpaid:(v,k,id)=>{if(!needOK())return;const x=(S.sv||[]).find(y=>y.id==id);if(!x||x.paid)return;if(!confirm(x.name+': '+inr(x.amt)+' mil gaye?'))return;x.paid=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:x.name,phone:x.phone,amt:x.amt,mode:x.utr?'online':'cash',kind:'Service: '+x.cat});award(x.phone,Math.round(x.amt/10));logAdd('Service paid: '+x.svname);save();notify('✅ Service paid')},
utrVerify:(v,k,id)=>{if(!needOK())return;if(k==='s')A.paidS(v,k,id);else if(k==='o')A.paidO(v,k,id);else if(k==='bulk')A.bpaid(v,k,id);else if(k==='svc')A.svpaid(v,k,id)},
utrClear:(v,k,id)=>{if(!needOK())return;const arr=k==='s'?S.subs:k==='o'?S.orders:k==='bulk'?(S.bulk||[]):(S.sv||[]);const r=arr.find(x=>x.id==id);if(r){r.utr='';save();notify('🗑️ UTR clear')}},
printInv:(v,k,id)=>printInvoice(id),
setmenu:()=>{if(!needOK())return;const a=$('#mveg'),b=$('#mnv');const k=iso(add(D0(),1));S.mset=S.mset||{};S.mset[k]={veg:a?String(a.value).slice(0,60).trim():'',nv:b?String(b.value).slice(0,60).trim():''};logAdd('Menu set '+k);save();notify('💾 Kal ka menu set ✅')},
login:()=>{const ne=$('#lname'),pe2=$('#lphone');const n=ne?ne.value.trim().slice(0,40):'';const p=pe2?cleanPh(pe2.value):'';if(!n||p.length<10){alert('Naam aur 10 digit phone daalo');return}ME={name:n,phone:p};saveME();F.name=n;F.phone=p;S.wel=S.wel||{};let wb='';if(!S.wel[p]){S.wel[p]=1;award(p,50);wb=' · 🎁 +50 welcome pts!'}save();notify('🙏 Login ho gaya!'+wb)},
logout:()=>{ME=null;DET=null;saveME();render();notify('👋 Logout ho gaya')},
goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
utr:(v,k,id)=>{const el=$('#u'+id);const c=el?el.value.replace(/\s/g,'').slice(0,14):'';if(!/^\d{12}$/.test(c)){alert('12 digit UTR daalo');return}const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(!s)return;s.utr=c;S.orders.forEach(o=>{if(o.sid===s.id)o.utr=c})}else{const o=S.orders.find(x=>x.id==n);if(!o)return;o.utr=c}logAdd('UTR submit: '+c);save();notify('✅ UTR mil gaya — owner verify karega')},
badu:(v,k,id)=>{if(!needOK())return;const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(s){s.utr='';S.orders.forEach(o=>{if(o.sid===s.id)o.utr=''})}}else{const o=S.orders.find(x=>x.id==n);if(o)o.utr=''}save();notify('🗑️ Galat UTR hataya')},
paidS:(v,k,id)=>{if(!needOK())return;const s=S.subs.find(x=>x.id==id);if(!s)return;const lo=S.orders.filter(o=>o.sid===s.id&&!o.paid);const amt=s.price+lo.reduce((a,o)=>a+o.total,0);if(!confirm(s.name+': '+inr(amt)+' mil gaye?'))return;s.paid=1;lo.forEach(o=>{o.paid=1});S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:s.name,phone:s.phone,amt:amt,mode:s.utr?'online':s.pay,utr:s.utr||'',kind:'Plan'});award(s.phone,Math.round(amt/10));logAdd('Paid: '+s.name);save();notify('✅ Payment confirm — '+inr(amt))},
paidO:(v,k,id)=>{if(!needOK())return;const o=S.orders.find(x=>x.id==id);if(!o)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:o.name,phone:o.phone,amt:o.total,mode:o.utr?'online':o.pay,utr:o.utr||'',kind:'Shop'});award(o.phone,Math.round(o.total/10));logAdd('Paid: '+o.name);save();notify('✅ Payment confirm — '+inr(o.total))},
remS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s)wa(s.phone,'Namaste '+s.name+'! 🙏'+NL+'Aapka '+inr(due(s))+' pending hai.'+NL+'UPI: '+UPI)},
remO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o)wa(o.phone,'Namaste '+o.name+'! 🙏'+NL+'Aapke order ka '+inr(o.total)+' pending hai.'+NL+'UPI: '+UPI)},
tab:v=>{if(['kitchen','delivery'].includes(v)&&!OK&&!STAFF){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const x=prompt('Staff PIN daalo (Kitchen/Delivery)');if(x===null)return;if(x===OPIN){pinClear();OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}}else if(x===DPIN){pinClear();STAFF=1;try{sessionStorage.setItem('udstaff','1')}catch(e){}}else{pinWrong();alert('Galat PIN');return}}
else if(v==='owner'&&!OK){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const x=prompt('Owner PIN daalo');if(x===null)return;if(x!==OPIN){pinWrong();alert('Galat PIN');return}pinClear();OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}}
if(v==='owner'){OVIEW='deliv';DET=null}tab=v;render()},
gps:()=>{if(!navigator.geolocation){alert('GPS nahi hai');return}notify('📍 Location le rahe hain...');navigator.geolocation.getCurrentPosition(p=>{F.map='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);if(!F.area)F.area='Udala (GPS)';render();notify('📍 Location mil gayi ✓')},e=>alert('Location nahi mili. Phone ka Location ON karo.'),{enableHighAccuracy:true,timeout:15000})},
set:(v,k)=>{F[k]=v;render()},
join:()=>mk(0),trial:()=>mk(1),
inc:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)+1,0,4)}else{C[id]=clamp((C[id]||0)+1,0,99);saveC()}render()},
dec:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=clamp((F.extraRoti||0)-1,0,4)}else{C[id]=clamp((C[id]||0)-1,0,99);saveC()}render()},
order:()=>{if(BUSY){notify('⏳ Ruko, order process ho raha hai');return}if(need())return;const it=[];let total=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k,10));if(!p||q<1)return;const h=k.endsWith('h');const pp=h?Math.round(p.p*.6):p.p;const qq=clamp(q,1,99);it.push({n:p.n+(h?' (Half)':''),q:qq,p:pp});total+=pp*qq});if(!it.length){alert('Cart khali hai');return}BUSY=1;setTimeout(()=>{BUSY=0},4000);
const oid=Date.now();S.orders.push({id:oid,ts:Date.now(),name:String(F.name).slice(0,40),phone:cleanPh(F.phone),area:String(F.area||'Udala').slice(0,40),addr:String(F.addr).slice(0,120),map:String(F.map).slice(0,200),items:it,total:total,pay:'online',paid:0,dlv:0,utr:'',t:new Date().toLocaleString()});MY.push('o'+oid);saveMY();C={};saveC();logAdd('Shop order: '+F.name+' '+inr(total));save();notify('🚀 Order ho gaya: '+inr(total));location.href=upi(total,'Shop order '+F.name,genUpiRef('shop',oid))},
skip:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const d=iso(D0());const i=s.skip.indexOf(d);if(i>=0)s.skip.splice(i,1);else s.skip.push(d);save();notify(i>=0?'🔄 Skip hataya':'⏭️ Aaj skip')},
done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save();notify(S.done[key]?'✅ Delivered mark':'↩️ Undo')},
odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.dlv=1;logAdd('Shop delivered: '+o.name);save();notify('🟢 Order delivered')}},
addp:()=>{if(!needOK())return;const n=($('#pn')||{}).value||'';const p=+($('#pp')||{}).value;const c=($('#pc')||{}).value||'Other';const nn=n.trim().slice(0,40);if(!nn||!(p>0)||p>100000){alert('Sahi naam aur price daalo');return}S.prod.push({id:Date.now(),n:nn,p:Math.round(p),c:String(c).trim().slice(0,30),s:1,h:0,img:CIM[c]||IM.grocery,mrp:Math.round(p*1.2),brand:null,cal:0,pro:0,nv:0,rating:4.5});logAdd('Product add: '+nn);save();notify('🛍 Product add ho gaya')},
stock:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s?0:1;save();notify(p.s?'✅ Stock mein':'🚫 Khatam mark')}},
delp:(v,k,id)=>{if(!needOK())return;const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);logAdd('Product delete: '+p.n);save();notify('🗑️ Product delete')}},
out:()=>{OK=0;STAFF=0;DET=null;PED=null;IMPON=0;PQ=null;try{sessionStorage.removeItem('udok')}catch(e){}try{sessionStorage.removeItem('udstaff')}catch(e){}tab='plan';render();notify('🔒 Owner/Staff se bahar')},
reset:()=>{if(!needOK())return;if(!confirm('⚠️ SAB DATA DELETE ho jayega — customers, orders, payments!'+NL+'Pehle Firebase se Export JSON backup le liya?'))return;const x=prompt('Pakka? Type karo: DELETE');if(x!=='DELETE'){notify('❌ Reset cancel');return}S={prod:SEED,subs:[],orders:[],done:{},pays:[],mset:{},kll:'',cred:{},refs:{},plog:[],log:[],pts:{},cpn2:[],cpnUsed:{},wx:null,digest:{},sv:[],bulk:[],wish:[],wel:{},exp:[],cap:0,smartCfg:S.smartCfg};C={};saveC();MY=[];saveMY();logAdd('FULL RESET');save();notify('🗑️ Reset ho gaya')}
};
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(b){const r=document.createElement('span');r.className='ripple';const rc=b.getBoundingClientRect();const sz=Math.max(rc.width,rc.height);r.style.width=r.style.height=sz+'px';r.style.left=(e.clientX-rc.left-sz/2)+'px';r.style.top=(e.clientY-rc.top-sz/2)+'px';b.appendChild(r);setTimeout(()=>r.remove(),650)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;e.preventDefault();try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){alert('Error: '+x.message)}});
document.addEventListener('input',e=>{const sf=e.target.dataset&&e.target.dataset.svf;if(sf){SVF[sf]=e.target.value;if(sf==='phone')SVF.phone=cleanPh(SVF.phone)}const bf=e.target.dataset&&e.target.dataset.bf;if(bf){BF[bf]=e.target.value;if(bf==='phone')BF.phone=cleanPh(BF.phone)}const f=e.target.dataset&&e.target.dataset.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPh(F.phone);if(f==='extraRoti')F.extraRoti=clamp(+F.extraRoti||0,0,4)}if(e.target.id==='sq'){SQ=e.target.value;const el=$('#pl');if(el)el.innerHTML=shopList()}if(e.target.id==='dsel'){DSEL=e.target.value||iso(D0());render()}});
document.addEventListener('change',e=>{if(e.target.id==='xlf'){handleFile(e.target.files&&e.target.files[0]);e.target.value=''}});
function ologin(){const lk=pinLockMin();if(lk){alert('Bahut galat attempts. '+lk+' min baad try karo.');return}const x=prompt('Owner PIN daalo');if(x===null)return;if(x===OPIN){pinClear();OK=1;DET=null;try{sessionStorage.setItem('udok','1')}catch(e){}tab='owner';OVIEW='deliv';render();notify('🔓 Owner panel khul gaya')}else{pinWrong();alert('Galat PIN')}}
let hc=0,hcT=null,lpT=null,lpFired=false;const logoEl=document.getElementById('logoTap');
logoEl.addEventListener('pointerdown',()=>{lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;hc=0;ologin()},700)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>logoEl.addEventListener(ev,()=>clearTimeout(lpT)));
logoEl.addEventListener('click',()=>{if(lpFired){lpFired=false;return}hc++;clearTimeout(hcT);hcT=setTimeout(()=>{hc=0},1800);if(hc===3)notify('🔐 Owner mode: 2 aur tap...');if(hc>=5){hc=0;clearTimeout(hcT);ologin()}});
window.addEventListener('scroll',()=>{const h=document.querySelector('header');if(h)h.classList.toggle('scrolled',(window.scrollY||0)>12)},{passive:true});
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW off',e))})}
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_deferredPrompt=e;const b=$('#installBtn');if(b&&!localStorage.getItem('nu_install_dismissed'))b.hidden=false});
(()=>{const b=$('#installBtn');if(b)b.addEventListener('click',async()=>{if(!_deferredPrompt){alert('📲 Install kaise kare:'+NL+'• Android Chrome: menu (⋮) → "Add to Home Screen" / "Install app"'+NL+'• iPhone Safari: Share → "Add to Home Screen"');return}_deferredPrompt.prompt();const r=await _deferredPrompt.userChoice;if(r&&r.outcome==='accepted'){b.hidden=true;localStorage.setItem('nu_install_dismissed','1')}_deferredPrompt=null})})();
window.addEventListener('appinstalled',()=>{const b=$('#installBtn');if(b)b.hidden=true;localStorage.setItem('nu_install_dismissed','1')});
setTimeout(()=>{const b=$('#installBtn');if(b&&!INSTALLED&&!localStorage.getItem('nu_install_dismissed'))b.hidden=false},2500);
const setOffline=()=>{const p=$('#offpill');if(p)p.hidden=navigator.onLine};
window.addEventListener('online',setOffline);window.addEventListener('offline',setOffline);setOffline();
const digestNotify=()=>{if(!OK||!digestDue())return;if(!('Notification' in window)||Notification.permission!=='granted')return;if(sessionStorage.getItem('nu_digest_notified')===iso(D0()))return;sessionStorage.setItem('nu_digest_notified',iso(D0()));try{new Notification('📬 Namaste Udala digest ready',{body:'Kal prep + aaj delivery + risk summary — Owner → 🧠 Smart se WhatsApp karo.',tag:'nu-digest'})}catch(e){}};
setInterval(digestNotify,60000);digestNotify();fetchWX();
if(localStorage.getItem('nu_theme')==='dark'){document.documentElement.dataset.theme='dark';const tb=$('#themeBtn');if(tb)tb.textContent='☀️'}
let tiltCurX=0,tiltCurY=0,tiltX=0,tiltY=0,tiltEl=null,rafOn=false;
const ensureRaf=()=>{if(!rafOn){rafOn=true;requestAnimationFrame(tiltLoop)}};
function tiltLoop(){rafOn=false;const s=document.querySelector('[data-3d="hero"] .stage');if(tiltEl){tiltCurX+=(tiltX-tiltCurX)*.12;tiltCurY+=(tiltY-tiltCurY)*.12;tiltEl.classList.add('tilt');tiltEl.style.transform='rotateY('+tiltCurX+'deg) rotateX('+tiltCurY+'deg)';ensureRaf()}else if(Math.abs(tiltCurX)>.05||Math.abs(tiltCurY)>.05){tiltCurX*=.85;tiltCurY*=.85;if(s)s.style.transform='rotateY('+tiltCurX+'deg) rotateX('+tiltCurY+'deg)';ensureRaf()}else{tiltCurX=tiltCurY=0;if(s){s.classList.remove('tilt');s.style.transform=''}}}
document.addEventListener('mousemove',e=>{const host=document.querySelector('[data-3d="hero"]');if(!host)return;const r=host.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const dx=(e.clientX-cx)/r.width,dy=(e.clientY-cy)/r.height;const dist=Math.sqrt(dx*dx+dy*dy);const st=host.querySelector('.stage');if(dist<1.6){tiltEl=st;tiltX=-dx*20;tiltY=dy*14;ensureRaf()}else if(tiltEl===st){tiltEl=null;tiltX=0;tiltY=0;ensureRaf()}});
document.addEventListener('mouseleave',()=>{tiltEl=null;tiltX=0;tiltY=0;ensureRaf()});
let spTick=false;
const spUpdate=()=>{const host=document.querySelector('[data-3d="hero"]');if(!host)return;const y=window.scrollY||0;const rot=Math.min(16,y*0.045);const ty=Math.min(34,y*0.09);host.style.transform='perspective(900px) rotateX('+rot+'deg) translateY('+ty+'px)';host.style.opacity=String(Math.max(.3,1-y/650))};
window.addEventListener('scroll',()=>{if(!spTick){spTick=true;requestAnimationFrame(()=>{spUpdate();spTick=false})}},{passive:true});
spUpdate();
render();
if(location.hash==='#owner')ologin();
if(location.hash==='#delivery'){tab='delivery';A.tab('delivery')}
</script></body></html>
