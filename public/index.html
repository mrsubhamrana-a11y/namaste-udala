<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Namaste Udala - Super App</title>
    
    <!-- PWA Essentials -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0e5c3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NamasteUdala">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">

    <!-- Fonts & Libraries -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --primary: #ff5a1f;       /* Appetite Orange */
            --primary-dark: #e8480c;
            --secondary: #0e5c3f;     /* Trustworthy Green */
            --bg-body: #f6f3ec;       
            --surface: #fffdf9;
            --text-main: #1c1917;
            --text-muted: #7d7468;
            --border: #ece2d0;
            --gold: #f5b301;
            --danger: #dc2626;
            --success: #16a34a;
            --radius-lg: 22px;
            --nav-height: 70px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding-bottom: calc(var(--nav-height) + 20px); 
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content:''; position:fixed; top:-10%; left:-10%; width:50vw; height:50vh;
            background: radial-gradient(circle, rgba(255,90,31,0.1) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* --- HEADER --- */
        header {
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(135deg, #0b3d2c, var(--secondary));
            color: white; padding: 16px;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 8px 20px rgba(11,61,44,0.3);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .logo-circle {
            width: 42px; height: 42px; border-radius: 12px;
            background: conic-gradient(from 210deg, var(--gold), var(--primary), var(--gold));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 15px; color: white;
            box-shadow: 0 4px 10px rgba(255,90,31,0.4);
        }
        .brand-text h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
        .brand-text p { font-size: 10px; opacity: 0.9; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        
        .header-actions { display: flex; gap: 10px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; transition: all 0.2s ease; position: relative;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
        .badge-dot {
            position: absolute; top: 6px; right: 6px;
            width: 8px; height: 8px; background: var(--primary);
            border-radius: 50%; border: 2px solid var(--secondary);
        }

        /* --- CONTAINER --- */
        .container { padding: 16px; max-width: 600px; margin: 0 auto; }

        /* --- CARDS --- */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255,255,255,0.8);
            animation: fadeInUp 0.4s ease-out;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card h3 {
            color: var(--secondary); font-size: 16px; font-weight: 800;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .card h3::before {
            content: ''; width: 4px; height: 16px; border-radius: 4px;
            background: linear-gradient(180deg, var(--primary), var(--gold));
        }

        /* --- HERO PLAN BUILDER (FRONT PAGE STAR) --- */
        .hero-plan {
            background: linear-gradient(135deg, #fff, #fffbeb);
            border: 2px solid var(--gold);
            position: relative; overflow: hidden;
        }
        .hero-tag {
            position: absolute; top: 12px; right: 12px;
            background: var(--primary); color: white;
            font-size: 10px; font-weight: 800; padding: 4px 8px;
            border-radius: 6px; transform: rotate(3deg);
        }
        
        .plan-controls {
            display: grid; gap: 12px; margin-top: 12px;
        }
        
        .control-group label {
            display: block; font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px;
        }
        
        .seg-control {
            display: flex; background: #f3ede2; padding: 4px; border-radius: 12px;
        }
        .seg-btn {
            flex: 1; border: none; background: transparent;
            padding: 10px 6px; border-radius: 8px;
            font-size: 12px; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: 0.2s;
        }
        .seg-btn.active {
            background: white; color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .stepper-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #f8fafc; padding: 10px 14px; border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stepper-label { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .stepper-val { font-size: 16px; font-weight: 800; color: var(--primary); min-width: 30px; text-align: center; }
        .step-btn {
            width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border);
            background: white; font-weight: 800; cursor: pointer; color: var(--text-main);
        }
        .step-btn:active { background: #eee; }

        .price-summary {
            margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border);
        }
        .sum-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-bottom: 4px; }
        .sum-total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; color: var(--text-main); margin-top: 8px; }

        .btn-pay {
            width: 100%; margin-top: 16px; padding: 14px;
            background: linear-gradient(180deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: 14px;
            font-weight: 800; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,90,31,0.3);
            transition: transform 0.1s;
        }
        .btn-pay:active { transform: scale(0.98); }

        /* --- SHOP GRID (FLIPKART STYLE) --- */
        .shop-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }
        .prod-card {
            background: white; border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border);
            transition: 0.2s; position: relative;
        }
        .prod-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
        .prod-img-wrap { height: 120px; background: #f1f5f9; position: relative; }
        .prod-img { width: 100%; height: 100%; object-fit: cover; }
        .discount-badge {
            position: absolute; top: 8px; left: 8px;
            background: var(--success); color: white;
            font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
        }
        .wish-heart {
            position: absolute; top: 8px; right: 8px;
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
            font-size: 14px; color: #ccc; cursor: pointer; z-index: 2;
        }
        .wish-heart.active { color: var(--danger); }
        .prod-body { padding: 12px; }
        .prod-name { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; height: 34px; overflow: hidden; }
        .prod-rating { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
        .prod-price-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
        .curr-price { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .old-price { font-size: 11px; color: var(--text-muted); text-decoration: line-through; }
        .add-cart-btn {
            width: 100%; padding: 8px; border: none; border-radius: 8px;
            background: var(--secondary); color: white; font-weight: 700; font-size: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .add-cart-btn.in-cart { background: var(--primary); }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 16px; left: 16px; right: 16px;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 200; border: 1px solid rgba(255,255,255,0.5);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 10px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; width: 60px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 20px; margin-bottom: 2px; transition: transform 0.2s; }
        .nav-item.active .nav-icon { transform: scale(1.1); }

        /* --- MODALS --- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 300; display: none; align-items: flex-end; justify-content: center;
        }
        .overlay.open { display: flex; }
        .sheet {
            background: white; width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0; padding: 24px;
            max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 0 auto 20px; }
        
        .form-group { margin-bottom: 16px; }
        .label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .input-field {
            width: 100%; padding: 14px; border: 1.5px solid var(--border);
            border-radius: 12px; font-size: 15px; outline: none; transition: border 0.2s;
        }
        .input-field:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(14,92,63,0.1); }
        
        .btn-primary {
            width: 100%; background: var(--primary); color: white;
            border: none; padding: 16px; border-radius: 14px;
            font-weight: 800; font-size: 16px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 90, 31, 0.3);
            margin-top: 10px;
        }
        .btn-secondary {
            width: 100%; background: #f1f5f9; color: var(--text-main);
            border: none; padding: 14px; border-radius: 12px;
            font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 10px;
        }

        /* --- TOAST --- */
        #toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: var(--text-main); color: white;
            padding: 12px 24px; border-radius: 50px;
            font-size: 14px; font-weight: 600;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 400; opacity: 0; pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }

        /* Dark Mode */
        [data-theme='dark'] {
            --bg-body: #0f172a; --surface: #1e293b; --text-main: #f1f5f9;
            --text-muted: #94a3b8; --border: #334155;
        }
        [data-theme='dark'] header { background: linear-gradient(135deg, #0f172a, #1e293b); }
        [data-theme='dark'] .bottom-nav { background: rgba(30, 41, 59, 0.95); border-color: #334155; }
        [data-theme='dark'] .sheet { background: #1e293b; }
        [data-theme='dark'] .input-field { background: #0f172a; border-color: #334155; color: #f1f5f9; }
        [data-theme='dark'] .prod-card { background: #1e293b; border-color: #334155; }
        [data-theme='dark'] .hero-plan { background: #1e293b; border-color: #334155; }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="brand">
        <div class="logo-circle">NU</div>
        <div class="brand-text">
            <h1>Namaste Udala</h1>
            <p>Super App for Udala</p>
        </div>
    </div>
    <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="openCart()">
            🛒
            <span class="badge-dot" id="cartBadge" style="display:none;"></span>
        </button>
    </div>
</header>

<div class="container" id="mainView">
    <!-- Content injected by JS -->
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('home')">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
    </div>
    <div class="nav-item" onclick="switchTab('shop')">
        <span class="nav-icon">🛒</span>
        <span>Shop</span>
    </div>
    <div class="nav-item" onclick="switchTab('profile')">
        <span class="nav-icon">👤</span>
        <span>Profile</span>
    </div>
    <div class="nav-item" onclick="switchTab('owner')">
        <span class="nav-icon">📊</span>
        <span>Owner</span>
    </div>
</nav>

<!-- CART MODAL -->
<div class="overlay" id="cartModal">
    <div class="sheet">
        <div class="handle"></div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:20px;">Your Cart 🛒</h2>
        <div id="cartItemsList" style="max-height:300px;overflow-y:auto;margin-bottom:20px;"></div>
        <div style="display:flex;justify-content:space-between;font-weight:800;font-size:18px;border-top:1px solid var(--border);padding-top:16px;">
            <span>Total:</span>
            <span id="cartTotalDisplay">₹0</span>
        </div>
        <button class="btn-primary" onclick="checkoutCart()">Proceed to Pay 💳</button>
        <button class="btn-secondary" onclick="closeModal('cartModal')">Close</button>
    </div>
</div>

<!-- LOGIN MODAL -->
<div class="overlay" id="loginModal">
    <div class="sheet">
        <div class="handle"></div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:20px;">Login / Register 👤</h2>
        <div class="form-group">
            <label class="label">Full Name</label>
            <input type="text" id="regName" class="input-field" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label class="label">Phone Number</label>
            <input type="tel" id="regPhone" class="input-field" placeholder="10-digit mobile">
        </div>
        <div class="form-group">
            <label class="label">Delivery Address</label>
            <textarea id="regAddr" class="input-field" rows="3" placeholder="House No, Street, Area..."></textarea>
        </div>
        <button class="btn-primary" onclick="saveUser()">Save & Continue</button>
        <button class="btn-secondary" onclick="closeModal('loginModal')">Cancel</button>
    </div>
</div>

<!-- OWNER PIN MODAL -->
<div class="overlay" id="ownerPinModal">
    <div class="sheet">
        <div class="handle"></div>
        <h2 style="font-size:20px;font-weight:800;margin-bottom:20px;">Owner Access 🔐</h2>
        <div class="form-group">
            <label class="label">Enter PIN</label>
            <input type="password" id="ownerPinInput" class="input-field" placeholder="****" maxlength="4">
        </div>
        <button class="btn-primary" onclick="verifyOwnerPin()">Unlock Dashboard</button>
        <button class="btn-secondary" onclick="closeModal('ownerPinModal')">Cancel</button>
    </div>
</div>

<!-- Toast Notification -->
<div id="toast">Message</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

// === CONFIGURATION ===
const firebaseConfig = {
    apiKey: "AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",
    authDomain: "namaste-udala.firebaseapp.com",
    projectId: "namaste-udala",
    storageBucket: "namaste-udala.firebasestorage.app",
    messagingSenderId: "998684348165",
    appId: "1:998684348165:web:4bb0d2f5335a90a394716c",
    databaseURL: "https://namaste-udala-default-rtdb.firebaseio.com"
};

const UPI_ID = '9583937047@jio';
const OWNER_PIN = '4821'; // Change this in production

// Pricing Logic
const BASE_PRICES = {
    veg: { 7: 749, 15: 1499, 30: 2899 },
    nv: { 7: 949, 15: 1849, 30: 3599 }
};
const ADD_ONS = {
    lunchBoth: 10, // per day
    dinnerBoth: 10, // per day
    extraRoti: 5   // per roti per day
};

// Products Data (Shop)
const PRODUCTS = [
    { id: 1, name: "Veg Special Thali", price: 120, mrp: 150, cat: "Food", img: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400&q=80", rating: 4.8 },
    { id: 2, name: "Chicken Curry Pack", price: 180, mrp: 220, cat: "Food", img: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=400&q=80", rating: 4.9 },
    { id: 3, name: "Fresh Milk 500ml", price: 30, mrp: 35, cat: "Grocery", img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&q=80", rating: 4.7 },
    { id: 4, name: "Atta 1kg Bag", price: 50, mrp: 60, cat: "Grocery", img: "https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=400&q=80", rating: 4.5 },
    { id: 5, name: "Wedding Photography", price: 15000, mrp: 20000, cat: "Services", img: "https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=400&q=80", rating: 5.0 },
    { id: 6, name: "Paneer Masala", price: 140, mrp: 160, cat: "Food", img: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400&q=80", rating: 4.6 },
];

// === STATE MANAGEMENT ===
let state = {
    user: JSON.parse(localStorage.getItem('nu_user')) || null,
    cart: {}, 
    view: 'home',
    ownerMode: false,
    allOrders: [], // For owner dashboard
    db: null,
    // Plan Builder State
    plan: {
        type: 'veg',
        days: 30,
        lunch: 'rice',
        dinner: 'roti',
        extraRoti: 0
    }
};

// Helpers
const $ = s => document.querySelector(s);
const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
const getDisc = (mrp, p) => Math.round(((mrp - p) / mrp) * 100);

// Firebase Init
try {
    const app = initializeApp(firebaseConfig);
    state.db = getDatabase(app);
    onValue(ref(state.db, 'orders'), snap => {
        const val = snap.val();
        state.allOrders = val ? Object.values(val) : [];
        if(state.ownerMode && state.view === 'owner') renderOwner();
    });
} catch(e) { console.log('Cloud off', e); }

function saveState() {
    localStorage.setItem('nu_cart', JSON.stringify(state.cart));
    if(state.user) localStorage.setItem('nu_user', JSON.stringify(state.user));
    render(); // Re-render UI
}

// === RENDER ENGINE ===
function init() {
    checkTheme();
    loadCart();
    render();
}

function loadCart() {
    try { state.cart = JSON.parse(localStorage.getItem('nu_cart')) || {}; } catch(e){}
}

function render() {
    const container = $('#mainView');
    let html = '';

    switch(state.view) {
        case 'home': html = renderHome(); break;
        case 'shop': html = renderShop(); break;
        case 'profile': html = renderProfile(); break;
        case 'owner': html = renderOwner(); break;
        default: html = renderHome();
    }

    container.innerHTML = html;
    updateNavActive();
    updateCartBadge();
}

function updateNavActive() {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    const map = { home: 0, shop: 1, profile: 2, owner: 3 };
    if(map[state.view] !== undefined) {
        document.querySelectorAll('.nav-item')[map[state.view]].classList.add('active');
    }
}

function updateCartBadge() {
    const count = Object.values(state.cart).reduce((a, b) => a + b, 0);
    const badge = $('#cartBadge');
    badge.style.display = count > 0 ? 'block' : 'none';
}

// === VIEW: HOME (SMART PLAN BUILDER) ===
function renderHome() {
    const cfg = state.plan;
    const base = BASE_PRICES[cfg.type][cfg.days];
    const lunchCost = cfg.lunch === 'both' ? ADD_ONS.lunchBoth * cfg.days : 0;
    const dinnerCost = cfg.dinner === 'both' ? ADD_ONS.dinnerBoth * cfg.days : 0;
    const rotiCost = cfg.extraRoti * ADD_ONS.extraRoti * cfg.days;
    const total = base + lunchCost + dinnerCost + rotiCost;
    const perDay = Math.round(total / cfg.days);

    return `
        <div class="card hero-plan">
            <span class="hero-tag">BEST VALUE</span>
            <h3 style="color:var(--secondary);margin-bottom:4px;">Customize Your Tiffin Plan 🍱</h3>
            <p style="font-size:12px;color:var(--text-muted);margin-bottom:16px;">Ghar jaisa swad, roz time pe.</p>
            
            <div class="plan-controls">
                <!-- Type Selector -->
                <div class="control-group">
                    <label>Food Type</label>
                    <div class="seg-control">
                        <button class="seg-btn ${cfg.type==='veg'?'active':''}" onclick="setPlanType('veg')">🟢 Veg</button>
                        <button class="seg-btn ${cfg.type==='nv'?'active':''}" onclick="setPlanType('nv')">🔴 Non-Veg</button>
                    </div>
                </div>

                <!-- Duration Selector -->

                    <div class="seg-control">

                        <button class="seg-btn ${cfg.days===15?'active':''}" onclick="setPlanDays(15)">15 Days</button>

                        <button class="seg-btn ${cfg.lunch==='roti'?'active':''}" onclick="setPlanMeal('lunch','roti')">🫓 Roti</button>

                <div class="control-group">
                    <label>Dinner Preference</label>
                    <div class="seg-control">

                        <button class="seg-btn ${cfg.dinner==='roti'?'active':''}" onclick="setPlanMeal('dinner','roti')">🫓 Roti</button>
                        <button class="seg-btn ${cfg.dinner==='both'?'active':''}" onclick="setPlanMeal('dinner','both')">🍱 Both (+₹10)</button>

                <!-- Extra Roti Stepper -->

                    <span class="stepper-label">Extra Roti / Day (+₹5)</span>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <button class="step-btn" onclick="adjustPlanRoti(-1)">−</button>
                        <span class="stepper-val">${cfg.extraRoti}</span>
                        <button class="step-btn" onclick="adjustPlanRoti(1)">+</button>
                    </div>
                </div>
            </div>

            <div class="price-summary">
                <div class="sum-line"><span>Base Plan (${cfg.type.toUpperCase()})</span><span>${fmt(base)}</span></div>
                <div class="sum-line"><span>Lunch Upgrade</span><span>${fmt(lunchCost)}</span></div>
                <div class="sum-line"><span>Dinner Upgrade</span><span>${fmt(dinnerCost)}</span></div>
                <div class="sum-line"><span>Extra Roti (${cfg.extraRoti}x)</span><span>${fmt(rotiCost)}</span></div>
                <div class="sum-total">
                    <span>Total Payable</span>
                    <span>${fmt(total)}</span>
                </div>
                <div style="font-size:11px;color:var(--text-muted);text-align:right;margin-top:4px;">(~${fmt(perDay)}/day)</div>
            </div>

            <button class="btn-pay" onclick="startPlanCheckout()">Join Now & Pay 💳</button>
            <p style="font-size:10px; color:var(--text-muted); text-align:center; margin-top:8px;">
                🔒 Secure UPI Payment • Free Delivery • Skip Facility
            </p>

        <!-- Quick Links -->
        <div class="card" style="background:#f8fafc;border:1px solid var(--border);box-shadow:none;">
            <h3 style="font-size:14px;margin-bottom:10px;">Why Namaste Udala?</h3>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;font-size:12px;color:var(--text-main);">
                <div>✅ Hygienic Kitchen</div>
                <div>✅ Fresh Ingredients</div>
                <div>✅ On-Time Delivery</div>
                <div>✅ Flexible Plans</div>
            </div>
        </div>
    `;
}

// Plan Actions
window.setPlanType = (type) => { state.plan.type = type; render(); };
window.setPlanDays = (days) => { state.plan.days = days; render(); };
window.setPlanMeal = (slot, choice) => { state.plan[slot] = choice; render(); };
window.adjustPlanRoti = (delta) => {
    state.plan.extraRoti = Math.max(0, Math.min(4, state.plan.extraRoti + delta));
    render();
};

window.startPlanCheckout = () => {
    if(!state.user) {
        openModal('loginModal');
        showToast("Please login first");
        return;
    }
    
    const cfg = state.plan;
    const base = BASE_PRICES[cfg.type][cfg.days];
    const lunchCost = cfg.lunch === 'both' ? ADD_ONS.lunchBoth * cfg.days : 0;
    const dinnerCost = cfg.dinner === 'both' ? ADD_ONS.dinnerBoth * cfg.days : 0;
    const rotiCost = cfg.extraRoti * ADD_ONS.extraRoti * cfg.days;
    const total = base + lunchCost + dinnerCost + rotiCost;
    
    const orderId = Date.now();
    const newOrder = {
        id: orderId,
        ts: Date.now(),
        type: 'subscription',
        details: {...cfg},
        total: total,
        status: 'pending',
        userName: state.user.name,
        userPhone: state.user.phone,
        address: state.user.addr
    };

    // Save to LocalStorage & Firebase
    let orders = JSON.parse(localStorage.getItem('nu_orders')) || [];
    orders.push(newOrder);
    localStorage.setItem('nu_orders', JSON.stringify(orders));
    
    if(state.db) set(ref(state.db, 'orders/' + orderId), newOrder);

    // Redirect to UPI
    const note = `Plan#${orderId}`;
    const upiLink = `upi://pay?pa=${UPI_ID}&pn=NamasteUdala&cu=INR&am=${Math.round(total)}&tn=${encodeURIComponent(note)}`;
    window.location.href = upiLink;
    
    setTimeout(() => {
        showToast("Redirecting to UPI...");
        switchTab('profile'); // Go to orders/profile after payment attempt
    }, 1000);
};

// === VIEW: SHOP (GRID) ===
function renderShop() {
    return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h2 style="font-size:20px;font-weight:800;">Shop</h2>
            <div style="font-size:12px;color:var(--text-muted);">${PRODUCTS.length} items</div>
        </div>
        <div class="shop-grid">
            ${PRODUCTS.map(p => createProductCard(p)).join('')}
        </div>
    `;
}

function createProductCard(p) {
    const disc = getDisc(p.mrp, p.price);
    const inCart = state.cart[p.id] > 0;
    const isWished = state.user?.wishlist?.includes(p.id);
    
    return `
        <div class="prod-card">
            <div class="prod-img-wrap">
                ${disc > 0 ? `<span class="discount-badge">${disc}% OFF</span>` : ''}
                <div class="wish-heart ${isWished ? 'active' : ''}" onclick="toggleWish(${p.id})">❤</div>
                <img src="${p.img}" alt="${p.name}" class="prod-img" loading="lazy">
            </div>
            <div class="prod-body">
                <div class="prod-name">${p.name}</div>
                <div class="prod-rating">⭐ ${p.rating}</div>
                <div class="prod-price-row">
                    <span class="curr-price">${fmt(p.price)}</span>
                    ${p.mrp > p.price ? `<span class="old-price">${fmt(p.mrp)}</span>` : ''}
                </div>
                <button class="add-cart-btn ${inCart ? 'in-cart' : ''}" onclick="addToCart(${p.id})">
                    ${inCart ? `In Cart (${state.cart[p.id]})` : 'Add to Cart'}
                </button>
            </div>
        </div>
    `;
}

window.addToCart = (id) => {
    state.cart[id] = (state.cart[id] || 0) + 1;
    saveState();
    showToast("Added to cart!");
};

window.toggleWish = (id) => {
    if(!state.user) {
        openModal('loginModal');
        return;
    }
    state.user.wishlist = state.user.wishlist || [];
    const idx = state.user.wishlist.indexOf(id);
    if(idx > -1) state.user.wishlist.splice(idx, 1);
    else state.user.wishlist.push(id);
    saveState();
};

// === VIEW: PROFILE ===
function renderProfile() {
    if(!state.user) {
        return `
            <div class="card" style="text-align:center;padding:40px 20px;">
                <div style="width:64px;height:64px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;color:#9ca3af;">?</div>
                <h3 style="margin-bottom:8px;">Login Required</h3>
                <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">Track orders, save wishlist, and get exclusive discounts.</p>
                <button class="btn-primary" onclick="openModal('loginModal')">Login / Register</button>
            </div>
        `;
    }
    
    const u = state.user;
    const myOrders = JSON.parse(localStorage.getItem('nu_orders')) || [];
    const activeOrders = myOrders.filter(o => o.status === 'pending');
    
    return `
        <div class="card" style="background:linear-gradient(135deg,var(--secondary),#127a52);color:white;text-align:center;">
            <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 12px;">${u.name.charAt(0).toUpperCase()}</div>
            <h2 style="font-size:18px;font-weight:800;">${esc(u.name)}</h2>
            <p style="opacity:0.9;font-size:12px;">${esc(u.phone)}</p>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;">
                <div style="background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;">
                    <b style="display:block;font-size:16px;">${myOrders.length}</b>
                    <span style="font-size:10px;opacity:0.8;">Orders</span>
                </div>
                <div style="background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;">
                    <b style="display:block;font-size:16px;">${u.wishlist?.length || 0}</b>
                    <span style="font-size:10px;opacity:0.8;">Wishlist</span>
                </div>
                <div style="background:rgba(255,255,255,0.1);padding:8px;border-radius:10px;">
                    <b style="display:block;font-size:16px;">₹${Math.floor(myOrders.reduce((a,o)=>a+o.total,0)/10)}</b>
                    <span style="font-size:10px;opacity:0.8;">Points</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Saved Address</h3>
            <div style="background:#f8fafc;padding:12px;border-radius:12px;font-size:13px;color:var(--text-muted);">
                ${esc(u.addr || 'No address saved')}
            </div>
            <button class="btn-secondary" style="margin-top:10px;" onclick="editAddress()">Change Address</button>
        </div>

        <div class="card">
            <h3>Recent Orders</h3>
            ${myOrders.length ? myOrders.slice(-5).reverse().map(o => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;">
                    <div>
                        <div style="font-weight:700;font-size:14px;">#${String(o.id).slice(-4)}</div>
                        <div style="font-size:11px;color:var(--text-muted);">${new Date(o.ts).toLocaleDateString()}</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:800;">${fmt(o.total)}</div>
                        <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${o.status==='delivered'?'#dcfce7':'#fef3c7'};color:${o.status==='delivered'?'#166534':'#92400e'};">${o.status.toUpperCase()}</span>
                    </div>
                </div>
            `).join('') : '<p style="color:var(--text-muted);font-size:13px;text-align:center;">No orders yet.</p>'}
        </div>

        <button class="btn-primary" style="background:var(--danger);" onclick="logout()">Logout</button>
    `;
}

window.editAddress = () => {
    const newAddr = prompt("Enter New Address:", state.user.addr);
    if(newAddr) {
        state.user.addr = newAddr;
        saveState();
        showToast("Address Updated");
    }
};

window.logout = () => {
    state.user = null;
    localStorage.removeItem('nu_user');
    render();
    showToast("Logged Out");
};

// === VIEW: OWNER DASHBOARD ===
function renderOwner() {
    if(!state.ownerMode) {
        return `
            <div class="card" style="text-align:center;padding:40px 20px;">
                <h3 style="margin-bottom:16px;">Owner Access 🔐</h3>
                <input type="password" id="opin" class="input-field" placeholder="Enter PIN" style="margin-bottom:12px;">
                <button class="btn-primary" onclick="unlockOwner()">Unlock Dashboard</button>
            </div>
        `;
    }
    
    const sales = state.allOrders.reduce((a, o) => a + o.total, 0);
    const pending = state.allOrders.filter(o => o.status === 'pending').length;
    
    return `
        <div class="card" style="background:var(--secondary);color:white;">
            <h3 style="color:white;">Admin Dashboard</h3>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;">
                <div style="background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;text-align:center;">
                    <b style="font-size:18px;display:block;">${fmt(sales)}</b>
                    <small>Total Sales</small>
                </div>
                <div style="background:rgba(255,255,255,0.1);padding:10px;border-radius:10px;text-align:center;">
                    <b style="font-size:18px;display:block;">${pending}</b>
                    <small>Pending</small>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>Live Orders</h3>
            ${state.allOrders.length ? state.allOrders.slice().reverse().map(o => `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f3f4f6;">
                    <div>
                        <div style="font-weight:700;font-size:14px;">${esc(o.userName)}</div>
                        <div style="font-size:11px;color:var(--text-muted);">${new Date(o.ts).toLocaleTimeString()} · ${o.items?.length || 1} items</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="font-weight:800;">${fmt(o.total)}</div>
                        <select onchange="updateOrderStatus('${o.id}', this.value)" style="font-size:11px;padding:4px;border-radius:6px;border:1px solid #ddd;">
                            <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                            <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
                        </select>
                    </div>
                </div>
            `).join('') : '<p style="color:var(--text-muted);font-size:13px;text-align:center;">No orders yet.</p>'}
        </div>

        <button class="btn-primary" style="background:var(--danger);" onclick="lockOwner()">Lock Dashboard</button>
    `;
}

window.unlockOwner = () => {
    const pin = $('#opin').value;
    if(pin === OWNER_PIN) {
        state.ownerMode = true;
        render();
    } else {
        alert("Wrong PIN");
    }
};

window.lockOwner = () => {
    state.ownerMode = false;
    state.view = 'home';
    render();
};

window.updateOrderStatus = (id, status) => {
    const order = state.allOrders.find(o => o.id == id);
    if(order) {
        order.status = status;
        if(state.db) set(ref(state.db, 'orders/' + id), order);
        renderOwner(); // Re-render owner view
        showToast("Status Updated");
    }
};

// === CART LOGIC ===
window.openCart = () => {
    if (!state.user) {
        openModal('loginModal');
        showToast("Please login first");
        return;
    }
    renderCartItems();
    openModal('cartModal');
};

function renderCartItems() {
    const container = $('#cartItemsList');
    let total = 0;
    let html = '';
    
    for (const [id, qty] of Object.entries(state.cart)) {
        const p = PRODUCTS.find(x => x.id == id);
        if (p) {
            const itemTotal = p.price * qty;
            total += itemTotal;
            html += `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;">
                    <div>
                        <div style="font-weight:700;font-size:14px;">${p.name}</div>
                        <div style="font-size:12px;color:#666;">${qty} x ${fmt(p.price)}</div>
                    </div>
                    <div style="font-weight:800;">${fmt(itemTotal)}</div>
                </div>
            `;
        }
    }
    
    container.innerHTML = html || '<p style="text-align:center;color:#999;">Cart is empty</p>';
    $('#cartTotalDisplay').innerText = fmt(total);
}

window.checkoutCart = () => {
    const total = Object.entries(state.cart).reduce((acc, [id, qty]) => {
        const p = PRODUCTS.find(x => x.id == id);
        return acc + (p ? p.price * qty : 0);
    }, 0);
    
    if (total === 0) return alert("Empty Cart");
    
    const orderId = Date.now();
    const newOrder = {
        id: orderId,
        ts: Date.now(),
        type: 'shop',
        items: Object.entries(state.cart).map(([id, q]) => ({ id: +id, q })),
        total: total,
        status: 'pending',
        userName: state.user.name,
        userPhone: state.user.phone,
        address: state.user.addr
    };

    let orders = JSON.parse(localStorage.getItem('nu_orders')) || [];
    orders.push(newOrder);
    localStorage.setItem('nu_orders', JSON.stringify(orders));
    if(state.db) set(ref(state.db, 'orders/' + orderId), newOrder);

    const upiLink = `upi://pay?pa=${UPI_ID}&pn=NamasteUdala&cu=INR&am=${Math.round(total)}&tn=Order#${orderId}`;
    window.location.href = upiLink;
    
    setTimeout(() => {
        state.cart = {};
        saveState();
        closeModal('cartModal');
        showToast("Order Placed! Check Profile.");
        switchTab('profile');
    }, 2000);
};

// === USER AUTH ===
window.saveUser = () => {
    const name = $('#regName').value.trim();
    const phone = $('#regPhone').value.replace(/\D/g,'');
    const addr = $('#regAddr').value.trim();
    
    if (!name || phone.length !== 10 || !addr) {
        alert("Fill all fields correctly");
        return;
    }
    
    state.user = { name, phone, addr, wishlist: [] };
    saveState();
    closeModal('loginModal');
    showToast("Welcome " + name.split(' ')[0] + "!");
};

// === UTILS ===
function showToast(msg) {
    const t = $('#toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function openModal(id) { $('#' + id).classList.add('open'); }
function closeModal(id) { $('#' + id).classList.remove('open'); }

window.switchTab = (tab) => {
    state.view = tab;
    render();
};

function toggleTheme() {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) {
        root.removeAttribute('data-theme');
        localStorage.setItem('nu_theme', 'light');
    } else {
        root.setAttribute('data-theme', 'dark');
        localStorage.setItem('nu_theme', 'dark');
    }
}

function checkTheme() {
    if (localStorage.getItem('nu_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
    }
}

init();
</script>
