document.addEventListener('keydown',e=>{const t=e.target;
if((e.key==='Enter'||e.key===' ')&&t&&t.dataset&&t.dataset.a&&!['INPUT','TEXTAREA','SELECT','BUTTON','A'].includes(t.tagName)){e.preventDefault();const f=A[t.dataset.a];if(f)f(t.dataset.v,t.dataset.k,t.dataset.id);return}
if(!(PQ||TRK||PSUC))return;
if(e.key==='Escape'){A.close();return}
if(e.key==='Tab'){const sh=document.querySelector('.sh');if(!sh)return;const f=[].slice.call(sh.querySelectorAll('button,[href],input')).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
