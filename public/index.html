header { background: linear-gradient(135deg, var(--g) 0%, #0F2C21 100%); color: #fff; padding: 24px 20px 60px; border-radius: 0 0 32px 32px; position: relative; overflow: hidden; box-shadow: var(--shadow-lg); }
header .logo { font-size: 11px; letter-spacing: 3px; font-weight: 800; color: #FCD34D; text-transform: uppercase; }
header h1 { font-size: 26px; font-weight: 900; margin-top: 6px; text-shadow: 0 4px 12px rgba(0,0,0,0.4); }
header .tagline { font-size: 13px; opacity: 0.9; margin-top: 6px; }
#canvas-container { position: absolute; right: 10px; top: 15px; width: 140px; height: 140px; pointer-events: auto; cursor: grab; }
#canvas-container:active { cursor: grabbing; }
.header-wave { position: absolute; bottom: -1px; left: 0; width: 100%; height: 40px; fill: var(--bg); }

#v { padding: 0 16px; margin-top: -30px; position: relative; z-index: 1; perspective: 1000px; }
.card-3d { transform-style: preserve-3d; transition: transform 0.15s ease-out, box-shadow 0.3s ease; }
.card-3d .card-content { transform: translateZ(20px); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-md); animation: rise 0.6s ease both; position: relative; overflow: hidden; }
.card h3 { color: var(--g); font-size: 18px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }

.s { font-size: 13px; color: var(--muted); line-height: 1.5; }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-box { background: linear-gradient(135deg, var(--g) 0%, var(--g-light) 100%); color: #fff; border-radius: 20px; padding: 16px; text-align: center; box-shadow: var(--shadow-md); }

.btn { padding: 14px 24px; border-radius: 16px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 10px; background: linear-gradient(135deg, var(--o) 0%, var(--o-dark) 100%); color: #fff; box-shadow: 0 4px 12px rgba(232, 93, 4, 0.3); transition: transform 0.2s; }
.btn:active { transform: scale(0.96); }
.btn.g { background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%); color: #065F46; border: 1px solid #A7F3D0; }

input, select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 16px; margin: 6px 0 12px; font-size: 15px; background: var(--bg); color: var(--text); font-family: inherit; }
input:focus { outline: none; border-color: var(--o); box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1); }

.nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding: 10px 0 max(12px, env(safe-area-inset-bottom)); z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }

.nav img { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; margin: 0 auto 4px; display: block; border: 2px solid transparent; }

.item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item-img { width: 56px; height: 56px; border-radius: 14px; object-fit: cover; background: var(--line); flex-shrink: 0; }
.item-info { flex: 1; min-width: 0; }
.item-info b { font-size: 15px; font-weight: 700; display: block; margin-bottom: 2px; }
.price { color: var(--o); font-weight: 800; font-size: 16px; }

.qty-ctrl { display: flex; align-items: center; gap: 10px; border: 2px solid var(--o); border-radius: 12px; padding: 4px; background: rgba(255, 107, 53, 0.05); }
.qty-ctrl button { width: 32px; height: 32px; border: 0; border-radius: 10px; background: var(--o); color: #fff; font-size: 18px; font-weight: 800; cursor: pointer; }
.qty-ctrl b { min-width: 24px; text-align: center; font-weight: 800; font-size: 15px; }

.cart-bar { position: fixed; bottom: 85px; left: 16px; right: 16px; background: var(--glass); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 99; box-shadow: var(--shadow-lg); animation: rise 0.4s ease; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1F2937; color: #fff; padding: 14px 28px; border-radius: 50px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); z-index: 1000; opacity: 0; transition: all 0.4s; max-width: 90%; text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: var(--danger); }

.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge.pending { background: #FEF3C7; color: #92400E; }

.theme-toggle { position: fixed; top: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 101; box-shadow: var(--shadow-md); }
.fab { position: fixed; right: 16px; bottom: 95px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4); z-index: 99; text-decoration: none; animation: float 3s ease-in-out infinite; }
</style>

<script type="module">

let S = { prod: [], subs: [], orders: [], expenses: [], pays: [], kopt: {}, mset: {}, done: {}, dailyVideo: 'https://assets.mixkit.co/videos/preview/mixkit-steam-rising-from-a-hot-meal-4327-large.mp4' };
try { const saved = localStorage.getItem('udala6'); if (saved) S = { ...S, ...JSON.parse(saved) }; } catch (e) {}

let db = null, tab = 'plan', C = {}, OK = 0;
try { OK = sessionStorage.getItem('udok') ? 1 : 0; } catch (e) {}
const F = { type: 'veg', days: '30', name: '', phone: '', area: '', addr: '', mapLink: '' };

if (S.prod.length === 0) {
  S.prod = [
    { id: 1, n: 'Doodh 500 ml', p: 30, c: 'Dairy', img: IMAGES.doodh, nv: 0 },
    { id: 2, n: 'Paneer 200 g', p: 80, c: 'Dairy', img: IMAGES.paneer, nv: 0 },
    { id: 3, n: 'Chai patti 250 g', p: 130, c: 'Kirana', img: IMAGES.chai, nv: 0 },
    { id: 4, n: 'Atta 1 kg', p: 50, c: 'Kirana', img: IMAGES.roti, nv: 0 },
    { id: 5, n: 'Chicken piece', p: 40, c: 'Non-Veg', img: IMAGES.chicken, nv: 1 },
    { id: 6, n: 'Egg (6 pcs)', p: 48, c: 'Non-Veg', img: IMAGES.chicken, nv: 1 },

try {

      };

} catch (e) { console.log('Offline mode'); }

// ✅ FIX: Added all missing fields (kopt, mset, done, dailyVideo) to Firebase update
const save = () => { 
  localStorage.setItem('udala6', JSON.stringify(S)); 
  if (db) {
    update(ref(db, 'udala2'), {
      prod: S.prod, 
      subs: S.subs, 
      orders: S.orders, 
      expenses: S.expenses || [], 
      pays: S.pays || [],
      kopt: S.kopt || {},
      mset: S.mset || {},
      done: S.done || {},
      dailyVideo: S.dailyVideo || ''
    });
  }
  render(); 
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const todayStr = () => iso(new Date());
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const cleanPhone = s => String(s || '').replace(/\D/g, '').slice(-10);
const showToast = (msg, type = 'success') => { const t = $('#toast'); t.textContent = msg; t.className = `toast ${type} show`; setTimeout(() => t.classList.remove('show'), 3000); };
const vibrate = () => { if (navigator.vibrate) navigator.vibrate(20); };

// --- ADVANCED 3D MODELS SETUP ---
let scene, camera, renderer, vegModel, nvModel, currentModel;
const init3D = () => {
  const container = $('#canvas-container');
  if (!container) return;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.z = 4;
  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(140, 140);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);
  
  // Advanced Veg Thali Model
  vegModel = new THREE.Group();
  const plate = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.8, 0.15, 32), new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.9, roughness: 0.3 }));
  vegModel.add(plate);
  const rice = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), new THREE.MeshStandardMaterial({ color: 0xFFFDD0, roughness: 0.8 }));
  rice.position.set(-0.35, 0.25, 0); vegModel.add(rice);
  const dal = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), new THREE.MeshStandardMaterial({ color: 0xFFA500, roughness: 0.6 }));
  dal.position.set(0.35, 0.25, 0); vegModel.add(dal);
  const roti = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 16), new THREE.MeshStandardMaterial({ color: 0xD4A574, roughness: 0.9 }));
  roti.position.set(0, 0.15, 0.4); roti.rotation.x = 0.2; vegModel.add(roti);

  // Advanced Non-Veg Model
  nvModel = new THREE.Group();
  const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.8, 8, 16), new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.5, metalness: 0.1 }));
  leg.rotation.z = Math.PI / 4; nvModel.add(leg);
  const bone = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0xFFFFF0, roughness: 0.4 }));
  bone.position.set(-0.35, -0.35, 0); bone.rotation.z = Math.PI / 4; nvModel.add(bone);
  
  currentModel = vegModel;
  scene.add(currentModel);
  
  // Advanced Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const pl1 = new THREE.PointLight(0xFCD34D, 2, 10); pl1.position.set(3, 3, 3); scene.add(pl1);
  const pl2 = new THREE.PointLight(0xFF6B35, 1, 10); pl2.position.set(-3, -2, 2); scene.add(pl2);
  
  // Mouse Parallax Interaction
  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
    const y = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    if(currentModel) {
      currentModel.rotation.y = x * 0.5;
      currentModel.rotation.x = y * 0.3;
    }
  });
  container.addEventListener('mouseleave', () => {
    if(currentModel) { currentModel.rotation.x = 0; currentModel.rotation.y = 0; }
  });

  const animate = () => {
    requestAnimationFrame(animate);
    if (currentModel) { 
      currentModel.position.y = Math.sin(Date.now() * 0.002) * 0.1; 
    }
    renderer.render(scene, camera);
  };
  animate();
};

const switch3DModel = (type) => {
  if (!scene || !currentModel) return;
  currentModel.rotation.x = 0; currentModel.rotation.y = 0;
  scene.remove(currentModel);
  currentModel = type === 'nv' ? nvModel : vegModel;
  scene.add(currentModel);
};

            <button class="btn sm ${F.days==15?'g':''}" data-a="set" data-k="days" data-v="15">15 din</button>

          </div>
          <input data-f="name" placeholder="Aapka Naam" value="${esc(F.name)}">
          <input data-f="phone" type="tel" maxlength="10" placeholder="10 digit Mobile" value="${esc(F.phone)}">
          <input data-f="area" placeholder="Area / Locality" value="${esc(F.area)}">
          <button class="btn sm g" data-a="getLocation" style="margin-top:4px; width:100%">📍 Meri Current Location Lo</button>
          ${F.mapLink ? `<div class="s" style="color:var(--success); margin-top:8px; word-break:break-all;">✅ Location locked: <a href="${F.mapLink}" target="_blank" style="color:var(--success); font-weight:700">Google Maps par dekhein</a></div>` : ''}
          <div style="display:flex;justify-content:space-between;font-size:22px;font-weight:900;margin:16px 0">
            <span>Total</span><span style="color:var(--o)">${inr(price)}</span>
          </div>
          <button class="btn" data-a="join">✅ Plan Shuru Karo</button>
        </div>
      </div>`;
  },

  shop: () => {
    let total = 0, count = 0;
    Object.entries(C).forEach(([k, q]) => { const p = S.prod.find(x => x.id == k); if (p && q > 0) { total += p.p * q; count += q; } });
    return `
      <div class="card" style="background:linear-gradient(135deg,#F59E0B,#E85D04);color:#fff;border:none">
        <h3 style="color:#fff">🛒 Ghar ka Saaman</h3>
      </div>
      <div class="card card-3d">
        <div class="card-content">
          ${S.prod.map(p => {
            const q = C[p.id] || 0;
            return `<div class="item">
              <img class="item-img" src="${p.img}" onerror="this.style.display='none'">
              <div class="item-info"><b>${esc(p.n)}</b><div class="s">${esc(p.c)} ${p.nv ? '· 🔴 Non-Veg' : ''}</div><div class="price">${inr(p.p)}</div></div>
              ${q > 0 ? `<div class="qty-ctrl"><button data-a="dec" data-id="${p.id}">−</button><b>${q}</b><button data-a="inc" data-id="${p.id}">+</button></div>` : `<button class="btn sm" data-a="inc" data-id="${p.id}">ADD</button>`}
            </div>`;
          }).join('')}
        </div>
      </div>
      ${count > 0 ? `<div class="cart-bar"><div><div style="font-size:13px;font-weight:700">🛒 ${count} items</div><div style="font-size:22px;font-weight:900;color:var(--o)">${inr(total)}</div></div><button class="btn g" data-a="order" style="margin:0;width:auto">Checkout</button></div>` : ''}`;
  },

  kitchen: () => {
    if (!OK) return `<div class="card"><h3>🔒 Locked</h3><p class="s">Header par 5 baar tap karo (PIN: 4821)</p></div>`;
    const tStr = todayStr();
    let veg = 0, nv = 0, roti = 0;
    S.subs.forEach(sub => {
      const end = new Date(sub.start || sub.startDate); end.setDate(end.getDate() + sub.days - 1);
      const startStr = sub.start || sub.startDate;
      if (tStr >= startStr && tStr <= iso(end) && sub.status === 'active') {
        if (sub.type === 'veg') veg++; else nv++;
        roti += (sub.extraRoti || 0);
      }
    });
    return `
      <div class="card card-3d">
        <div class="card-content">
          <h3>👨‍🍳 Aaj ki Kitchen List</h3>
          <div class="s" style="margin-bottom:16px">📅 Date: ${tStr}</div>
          <div class="stats-grid">
            <div class="stat-box"><div class="val">${veg}</div><div class="lbl">Veg Thali</div></div>
            <div class="stat-box orange"><div class="val">${nv}</div><div class="lbl">Non-Veg Thali</div></div>
            <div class="stat-box purple"><div class="val">${roti}</div><div class="lbl">Extra Roti</div></div>
            <div class="stat-box" style="background:linear-gradient(135deg, #3B82F6, #1E40AF)"><div class="val">${veg + nv}</div><div class="lbl">Total Tiffin</div></div>
          </div>
        </div>
      </div>`;
  },

  delivery: () => {
    if (!OK) return `<div class="card"><h3>🔒 Locked</h3><p class="s">Header par 5 baar tap karo (PIN: 4821)</p></div>`;
    const pending = S.orders.filter(o => o.status === 'pending');
    return `
      <div class="card card-3d">
        <div class="card-content">
          <h3>🛵 Pending Deliveries (${pending.length})</h3>
          ${pending.length === 0 ? '<p class="s">Koi pending delivery nahi! 🎉</p>' : 
            pending.map(o => `
              <div class="item" style="flex-direction:column;align-items:flex-start;gap:10px">
                <div style="display:flex;justify-content:space-between;width:100%"><b>${esc(o.name)}</b><span class="badge pending">Pending</span></div>
                <div class="s">📍 ${esc(o.area || 'Udala')} | 📱 ${o.phone}</div>
                <div class="s">📦 ${o.items.map(i=>`${i.n} x${i.q}`).join(', ')}</div>
                <div class="s" style="font-weight:800;color:var(--o)">💰 ${inr(o.total)}</div>
                <div style="display:flex;gap:8px;width:100%;margin-top:10px;flex-wrap:wrap">
                  ${o.map ? `<a href="${o.map}" target="_blank" class="btn sm b" style="flex:1;text-align:center;text-decoration:none">🗺️ Maps</a>` : ''}
                  <a href="https://wa.me/91${o.phone}" target="_blank" class="btn sm g" style="flex:1;text-align:center;text-decoration:none">💬 WhatsApp</a>
                  <button class="btn sm" data-a="markDelivered" data-id="${o.id}" style="flex:1">✅ Done</button>
                </div>
              </div>
            `).join('')}
        </div>
      </div>`;
  },

  owner: () => {
    if (!OK) return `<div class="card"><h3>🔒 Owner Access</h3><p class="s">Header par 5 baar tap karo (PIN: 4821)</p></div>`;
    const revenue = (S.orders || []).reduce((sum, o) => sum + (o.total || 0), 0) + (S.subs || []).reduce((sum, s) => sum + (s.price || 0), 0);
    const expenses = (S.expenses || []).reduce((sum, e) => sum + (e.amount || 0), 0);
    const profit = revenue - expenses;
    const activeSubs = (S.subs || []).filter(s => s.status === 'active').length;
    const pendingDel = (S.orders || []).filter(o => o.status === 'pending').length;

    return `
      <div class="card card-3d">
        <div class="card-content">
          <h3>📊 Super Admin Dashboard</h3>
          <div class="stats-grid">
            <div class="stat-box"><div class="val">${inr(revenue)}</div><div class="lbl">Total Revenue</div></div>
            <div class="stat-box orange"><div class="val">${inr(expenses)}</div><div class="lbl">Expenses</div></div>
            <div class="stat-box" style="background:linear-gradient(135deg, ${profit >= 0 ? '#10B981' : '#EF4444'}, ${profit >= 0 ? '#059669' : '#DC2626'})"><div class="val">${inr(profit)}</div><div class="lbl">Net Profit</div></div>
            <div class="stat-box purple"><div class="val">${activeSubs}</div><div class="lbl">Active Subs</div></div>
            <div class="stat-box" style="background:linear-gradient(135deg, #3B82F6, #1E40AF)"><div class="val">${pendingDel}</div><div class="lbl">Pending</div></div>
            <div class="stat-box"><div class="val">${(S.prod || []).length}</div><div class="lbl">Products</div></div>
          </div>
          
          <h3 style="margin-top:20px">📹 Daily Menu Video</h3>
          <input id="vidUrl" placeholder="Video URL (MP4 link)" value="${esc(S.dailyVideo || '')}">
          <button class="btn sm g" data-a="updateVideo">💾 Update Video</button>

          <h3 style="margin-top:20px">🛒 Manage Products</h3>
          <div style="background:var(--bg);padding:16px;border-radius:16px;margin-bottom:16px">
            <input id="newPName" placeholder="Product Name (e.g., Surf Excel)">
            <div style="display:flex;gap:8px">
              <input id="newPPrice" type="number" placeholder="Price ₹" style="flex:1">
              <input id="newPCat" placeholder="Category" style="flex:1">
            </div>
            <select id="newPType" style="margin-top:8px">
              <option value="0">Veg</option>
              <option value="1">Non-Veg</option>
            </select>
            <button class="btn g" data-a="addProduct">➕ Add Product</button>
          </div>
          ${(S.prod || []).map(p => `
            <div class="item">
              <div class="item-info"><b>${esc(p.n)}</b><div class="s">${esc(p.c)} · ${inr(p.p)} ${p.nv ? '(Non-Veg)' : ''}</div></div>
              <button class="btn sm r" data-a="delProd" data-id="${p.id}">🗑️</button>
            </div>
          `).join('')}

          <h3 style="margin-top:24px">💰 Add Expense</h3>
          <div style="background:var(--bg);padding:16px;border-radius:16px;margin-bottom:16px">
            <input id="expName" placeholder="Expense Name (e.g., Petrol, Ration)">
            <input id="expAmount" type="number" placeholder="Amount ₹">
            <button class="btn" style="background:var(--info)" data-a="addExpense">➕ Add Expense</button>
          </div>
          ${(S.expenses || []).slice(-5).reverse().map(e => `
            <div class="item">
              <div class="item-info"><b>${esc(e.name)}</b><div class="s">${e.date}</div></div>
              <div class="price">${inr(e.amount)}</div>
            </div>
          `).join('') || '<p class="s">No expenses yet.</p>'}
          
          <button class="btn r" data-a="out" style="margin-top:24px">🚪 Logout Owner</button>
        </div>
      </div>`;
  }
};

// --- RENDER & ACTIONS ---
const render = () => {
  if (!OK && !['plan', 'shop'].includes(tab)) tab = 'plan';
  $('#v').innerHTML = VIEWS[tab]();
  $('#ht').textContent = { plan: 'Aaj ka Plan', shop: 'Shop', kitchen: 'Kitchen', delivery: 'Delivery', owner: 'Admin Panel' }[tab];
  
  const navItems = [['plan', '🍱 Plan', IMAGES.thali], ['shop', '🛒 Shop', IMAGES.grocery], ['kitchen', '👨‍🍳 Kitchen', IMAGES.kitchen], ['delivery', '🛵 Delivery', IMAGES.scooter], ['owner', '👤 Admin', IMAGES.money]];
  $('#nav').innerHTML = navItems.filter(x => OK || x[0] === 'plan' || x[0] === 'shop').map(x => `<div class="${x[0] === tab ? 'on' : ''}" data-a="tab" data-v="${x[0]}"><img src="${x[2]}" onerror="this.style.opacity=0">${x[1]}</div>`).join('');
    
  $$('.card-3d').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const rx = ((e.clientY - r.top - r.height/2)/(r.height/2))*-5, ry = ((e.clientX - r.left - r.width/2)/(r.width/2))*5;
      card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1.02, 1.02, 1.02)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)'; });
  });
  setTimeout(() => $('#loadingScreen').classList.add('hide'), 600);
};

const ACTIONS = {
  tab: v => {
    if (['kitchen', 'delivery', 'owner'].includes(v) && !OK) {
      const pin = prompt('Owner PIN:');
      if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); showToast('🔓 Admin Access Granted'); }
      else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); return; }
    }
    tab = v; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  set: (v, k) => { F[k] = v; render(); },
  inc: (v, k, id) => { vibrate(); C[id] = (C[id] || 0) + 1; render(); },
  dec: (v, k, id) => { vibrate(); C[id] = Math.max(0, (C[id] || 0) - 1); if (C[id] === 0) delete C[id]; render(); },
  
  getLocation: () => {
    vibrate();
    if (!navigator.geolocation) { showToast('❌ Browser GPS support nahi karta', 'error'); return; }
    showToast('📍 Location dhoondh rahe hain...');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        F.mapLink = `https://www.google.com/maps?q=${lat},${lng}`;
        if (!F.area) F.area = 'Udala (GPS)';
        showToast('✅ Location successfully save ho gayi!');
        render();
      },
      (err) => {
        showToast('❌ Kripya browser mein Location Permission allow karein', 'error');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  },

  join: () => {
    vibrate();
    if (!F.name || F.phone.length !== 10) { showToast('❌ Naam aur 10 digit phone daalo', 'error'); return; }
    const price = PRICING[F.type][F.days] || 2899;
    S.subs.push({ id: Date.now(), name: F.name, phone: cleanPhone(F.phone), area: F.area, type: F.type, days: +F.days, start: todayStr(), startDate: todayStr(), price: price, status: 'active', extraRoti: 0, map: F.mapLink || '' });
    save(); showToast('✅ Plan ban gaya!');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=🍱 *Naya Plan*%0A👤 ${F.name}%0A📱 ${F.phone}%0A🍽️ ${F.type} · ${F.days} din%0A💰 ₹${price}%0A📍 Map: ${F.mapLink || 'N/A'}`, '_blank');
    F.name = ''; F.phone = ''; F.area = ''; F.mapLink = '';
  },
  
  order: () => {
    vibrate();
    if (!F.name || F.phone.length !== 10) { showToast('❌ Naam aur phone daalo', 'error'); return; }
    const items = []; let total = 0;
    Object.entries(C).forEach(([k, q]) => { const p = S.prod.find(x => x.id == k); if (p && q > 0) { items.push({ n: p.n, q, p: p.p }); total += p.p * q; } });
    if (!items.length) { showToast('❌ Cart khali hai', 'error'); return; }
    S.orders.push({ id: Date.now(), name: F.name, phone: cleanPhone(F.phone), area: F.area, items, total, status: 'pending', date: todayStr(), map: F.mapLink || '' });
    C = {}; save(); showToast('✅ Order ho gaya!');
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *Naya Order*%0A👤 ${F.name}%0A📱 ${F.phone}%0A📦 ${items.map(i=>`${i.n} x${i.q}`).join(', ')}%0A💰 ₹${total}%0A📍 Map: ${F.mapLink || 'N/A'}`, '_blank');
  },

  updateVideo: () => {
    vibrate();
    const url = $('#vidUrl')?.value;
    if(url) {
      S.dailyVideo = url;
      save();
      showToast('✅ Daily video updated!');
    }
  },

  addProduct: () => {
    vibrate();
    const name = $('#newPName')?.value, price = parseInt($('#newPPrice')?.value), cat = $('#newPCat')?.value || 'General', nv = parseInt($('#newPType')?.value) || 0;
    if (!name || !price) { showToast('❌ Name aur Price daalo', 'error'); return; }
    S.prod.push({ id: Date.now(), n: name, p: price, c: cat, img: IMAGES.grocery, nv: nv });
    save(); showToast('✅ Product added!');
  },
  
  delProd: (v, k, id) => {
    vibrate();
    if (confirm('Delete this product?')) { S.prod = S.prod.filter(p => p.id != id); save(); showToast('🗑️ Deleted'); }
  },

  addExpense: () => {
    vibrate();
    const name = $('#expName')?.value, amount = parseInt($('#expAmount')?.value);
    if (!name || !amount) { showToast('❌ Name aur Amount daalo', 'error'); return; }
    S.expenses.push({ id: Date.now(), name: name, amount: amount, date: todayStr() });
    save(); showToast('✅ Expense added!');
  },

  markDelivered: (v, k, id) => {
    vibrate();
    const order = S.orders.find(o => o.id == id);
    if (order) { order.status = 'delivered'; save(); showToast('✅ Delivered!'); }
  },
  
  out: () => { OK = 0; sessionStorage.removeItem('udok'); tab = 'plan'; render(); showToast('🚪 Logged out'); }
};

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-a]');
  if (!btn) return;
  vibrate();
  const action = ACTIONS[btn.dataset.a];
  if (action) { try { action(btn.dataset.v, btn.dataset.k, btn.dataset.id); } catch (err) { console.error(err); showToast('❌ Error', 'error'); } }
});

document.addEventListener('input', e => {
  const field = e.target.dataset?.f;
  if (field) { F[field] = e.target.value; if (field === 'phone') F.phone = cleanPhone(F.phone); }
});

let tapCount = 0;
$('#mainHeader').addEventListener('click', () => {
  tapCount++;
  if (tapCount >= 5) {
    tapCount = 0;
    const pin = prompt('Owner PIN:');
    if (pin === CONFIG.ownerPin) { OK = 1; sessionStorage.setItem('udok', '1'); tab = 'owner'; render(); showToast('🔓 Admin Access Granted'); }
    else if (pin !== null) { showToast('❌ Galat PIN!', 'error'); }
  }
});

const initTheme = () => {
  const saved = localStorage.getItem('ud_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('#themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
};
$('#themeToggle').addEventListener('click', () => {
  vibrate();
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ud_theme', next);
  $('#themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
});

initTheme();
init3D();
render();
console.log('🍱 Namaste Udala 6.0 Ultimate 3D Loaded!');
</script>
</body>
</html>
