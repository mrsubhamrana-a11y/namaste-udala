 joinPaid:()=>{const u=needU();if(!u||!needG())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address','error');return}
  const utr=prompt('💳 UTR:');if(!utr||utr.trim().length<4){showToast('❌ UTR zaroori','error');return}
  const price=PRICING[F.type][F.days]||2899;const av=randAv(u.p.charCodeAt(0));
  S.subs.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr:utr.trim(),skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,deviceFp:deviceFp(),avatar:av,due:0,autoPay:0});
  if(!ME){ME={name:u.n,phone:u.p,avatar:av};saveME()}save(true);showToast('⏳ Verify hoga tab active');window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 PLAN ${u.n} ${u.p} ${F.type} ${F.days}d ${inr(price)} UTR:${utr}`,'_blank')},
 order:()=>{const u=needU();if(!u||!needG())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address','error');return}
  const cart=calcCart();if(!cart.cnt){showToast('❌ Cart khali','error');return}
  if(F.payMode==='wallet'){const wal=S.wallet[u.p]||0;if(wal<cart.total+F.tip){showToast('❌ Wallet balance kam','error');return}S.wallet[u.p]=wal-(cart.total+F.tip);S.walletLedger.push({id:Date.now(),d:todayStr(),name:u.n,phone:u.p,amt:-(cart.total+F.tip),note:'Shop order'})}
  const items=[];Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0){items.push({n:p.n,q,p:p.p});p.stock=Math.max(0,(p.stock||99)-q)}});CC.forEach(c=>items.push({n:c.name,q:c.qty,p:c.price}));
  if(CART_COUPON&&S.coupons[CART_COUPON])S.coupons[CART_COUPON].uses=(S.coupons[CART_COUPON].uses||0)+1;
  S.orders.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,items,total:cart.total+F.tip,sub:cart.sub,discount:cart.disc,coupon:cart.code,tip:F.tip,payMode:F.payMode,status:'pending',paid:F.payMode==='wallet'?1:0,date:todayStr(),slot:F.slot});
  C={};CC=[];CART_COUPON='';saveCart();save(true);showToast('✅ Order!');window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 ORDER ${u.n} ${items.map(i=>i.n+'x'+i.q).join(',')} ₹${cart.total+F.tip} ${F.slot}`,'_blank')},
 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;S.pays.push({id:Date.now(),d:todayStr(),name:s.name,phone:s.phone,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});save(true);showToast('✅ Active!');closeModal()},
 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s&&confirm('Reject?')){s.status='rejected';save(true)}},
 autoPayToggle:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(s){s.autoPay=s.autoPay?0:1;save(true);showToast(s.autoPay?'🔁 AutoPay ON':'AutoPay OFF')}},
 walletTop:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const amt=parseInt(prompt('Top-up amount ₹:'));if(!amt||amt<=0)return;S.wallet[s.phone]=(S.wallet[s.phone]||0)+amt;S.walletLedger.push({id:Date.now(),d:todayStr(),name:s.name,phone:s.phone,amt:amt,note:'Top-up'});S.pays.push({id:Date.now(),d:todayStr(),name:s.name,phone:s.phone,amt:amt,mode:'cash',kind:'Wallet'});save(true);showToast('💰 +'+inr(amt))},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=1;const s=S.subs.find(x=>x.id==id);save(true);showToast('✅ Delivered');if(s)window.open(`https://wa.me/91${s.phone}?text=${encodeURIComponent('✅ Aapka tiffin deliver ho gaya! Dhanyavad 🙏')}`,'_blank')},
 naMark:(v,k,id)=>{S.na[todayStr()+'_'+id]=1;save(true);showToast('🚫 Not available marked')},
 odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.status='delivered';save(true);showToast('✅');window.open(`https://wa.me/91${o.phone}?text=${encodeURIComponent('✅ Order delivered! '+inr(o.total))}`,'_blank');closeModal()}},
 pickPod:(v,k,id)=>{const inp=$('#podFile');inp.dataset.id=id;inp.click()},
 pickPhoto:()=>{$('#foodPhotoFile').click()},
 delPhoto:()=>{delete S.foodPhotos[todayStr()];save(true)},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));navigator.clipboard.writeText(`🍱 KITCHEN ${k}\n`+on.map(s=>`• ${s.name}: ${packItems(s).join(', ')}`).join('\n')).then(()=>showToast('📋 Copied'))},
 copyRaw:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));const roti=on.reduce((a,s)=>a+((s.lunch!=='chawal'?4:0)+(s.dinner!=='chawal'?4:0)+s.extraRoti),0);const chawal=on.reduce((a,s)=>a+((s.lunch!=='roti'?1:0)+(s.dinner!=='roti'?1:0)),0);navigator.clipboard.writeText(`🧮 PURCHASE LIST\nAtta ${(roti*0.04).toFixed(1)}kg\nChawal ${(chawal*0.15).toFixed(1)}kg\nDal ${(on.length*0.1).toFixed(1)}kg\nSabzi ${(on.length*0.4).toFixed(1)}kg\nDoodh ${(on.length*0.25).toFixed(1)}L`).then(()=>showToast('📋 Copied'))},
 saveCost:()=>{S.costInputs={atta:+$('#ci_atta').value||42,dal:+$('#ci_dal').value||110,sabzi:+$('#ci_sabzi').value||40,gas:+$('#ci_gas').value||15,labour:+$('#ci_labour').value||20};save(true);showToast('💾 Saved')},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim(),kind=($('#pkind')?.value)||'grocery';if(!n||!p){showToast('❌','error');return}S.prod.push({id:Date.now(),n,p,c,nv:0,s:1,img:kind==='food'?IMG.thali:IMG.grocery,kind,rating:4.3,time:25,best:0,stock:99});save(true);showToast('✅')},
 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete?')){S.prod=S.prod.filter(x=>x.id!=id);save(true)}},
 addCoupon:()=>{const code=($('#cpCode')?.value||'').trim().toUpperCase(),type=$('#cpType').value,val=+$('#cpVal').value,min=+$('#cpMin').value||0,max=+$('#cpMax').value||999,exp=$('#cpExp').value||'';if(!code||!val){showToast('❌','error');return}S.coupons[code]={type,value:val,min,expiry:exp,uses:0,max};save(true);showToast('🎟️ Created')},
 delCoupon:v=>{if(confirm('Delete '+v+'?')){delete S.coupons[v];save(true)}},
 broadcast:()=>{const msg=($('#bcMsg')?.value||'').trim();if(!msg){showToast('❌ Message','error');return}const phs=[...new Set((S.subs||[]).filter(isLive).map(s=>s.phone))];if(!phs.length){showToast('❌ Koi active nahi','error');return}phs.forEach((p,i)=>setTimeout(()=>window.open(`https://wa.me/91${p}?text=${encodeURIComponent(msg)}`,'_blank'),i*1200));showToast(`📢 ${phs.length} ko ja raha hai`)},
 waAllOFD:()=>{const k=todayStr();const pend=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k)&&!S.done[k+'_'+s.id]);pend.forEach((s,i)=>setTimeout(()=>window.open(`https://wa.me/91${s.phone}?text=${encodeURIComponent('🛵 Aapka tiffin out for delivery hai! ETA 20 min')}`,'_blank'),i*1200));showToast(`📢 ${pend.length} ko OFD msg`)},
 waReport:()=>{const t=todayStr();const rev=(S.pays||[]).filter(p=>p.d===t).reduce((a,p)=>a+(+p.amt||0),0);const act=(S.subs||[]).filter(isLive).length;const ord=(S.orders||[]).filter(o=>o.date===t).length;window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(`📊 DAILY REPORT ${t}\n💰 Kamai: ${inr(rev)}\n🍱 Active: ${act}\n🛒 Orders: ${ord}\n⏳ Pending: ${(S.subs||[]).filter(s=>s.status==='pending').length}`)}`,'_blank')},
 expCSV:()=>{const rows=[['Date','Name','Phone','Total','Status','PayMode'],...(S.orders||[]).map(o=>[o.date,o.name,o.phone,o.total,o.status,o.payMode])];const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='orders.csv';a.click();showToast('📊 Exported')},
 invoice:(v,k,id)=>{printInvoice(+id);closeModal()},
 setMenu:()=>{S.mset[iso(addDays(new Date(),1))]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save(true);showToast('💾')},
 backup:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;OKR=0;sessionStorage.removeItem('udok');sessionStorage.removeItem('udokr');tab='plan';render()}
};

document.addEventListener('click',e=>{if(e.target.classList.contains('modal')){closeModal();return}const b=e.target.closest('[data-a]');if(!b)return;const f=ACTIONS[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(err){console.error(err);showToast('❌ Error','error')}}});
document.addEventListener('input',e=>{const f=e.target.dataset?.f;if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone)}
 if(e.target.id==='sq'){clearTimeout(window._t);window._t=setTimeout(()=>{SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}
 if(e.target.id==='tbs1')TB.s1=+e.target.value;if(e.target.id==='tbs2')TB.s2=+e.target.value});
$('#foodPhotoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;readImg(f,d=>{S.foodPhotos[todayStr()]=d;save(true);showToast('📸 Photo live!')});e.target.value=''});
$('#podFile').addEventListener('change',e=>{const f=e.target.files[0];const id=e.target.dataset.id;if(!f||!id)return;readImg(f,d=>{S.pod['s'+id+'_'+todayStr()]=d;save(true);showToast('📸 POD saved')});e.target.value=''});
$('#restoreFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=migrate(JSON.parse(r.result));save(true);showToast('✅ Restored')}catch(err){showToast('❌','error')}};r.readAsText(f);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Owner PIN:');if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();showToast('🔓')}else showToast('❌','error')}});
const initTheme=()=>{const t=localStorage.getItem('ud_theme')||'dark';document.documentElement.setAttribute('data-theme',t);$('#themeToggle').textContent=t==='dark'?'☀️':''};
$('#themeToggle').addEventListener('click',()=>{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('ud_theme',n);$('#themeToggle').textContent=n==='dark'?'☀️':''});
const initP=()=>{const c=$('#particles');for(let i=0;i<20;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*12+'s';p.style.animationDuration=(10+Math.random()*6)+'s';c.appendChild(p)}};
// AutoPay daily deduction on load
(()=>{const k=todayStr();(S.subs||[]).filter(s=>isLive(s)&&s.autoPay).forEach(s=>{const key=k+'_'+s.id;if(S.autoPayLog[key])return;const daily=Math.round(s.price/s.days);const wal=S.wallet[s.phone]||0;if(wal>=daily){S.wallet[s.phone]=wal-daily;S.walletLedger.push({id:Date.now()+Math.random(),d:k,name:s.name,phone:s.phone,amt:-daily,note:'AutoPay daily'});S.autoPayLog[key]=1;save()}})})();
initTheme();initP();render();
setTimeout(()=>showToast('🚀 MEGA v5 · 29 pages ready'),600);
</script>
</body>
