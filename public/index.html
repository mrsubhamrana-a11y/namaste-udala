
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Namaste Udala — Mera Tiffin · Multi-Vendor Food · Kirana & Daily Needs</title>
<meta name="theme-color" content="#113221" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f3eb;
    --sf: #ffffff;
    --sf2: #efe9dc;
    --ink: #13221a;
    --mu: #5f6d65;
    --ln: #dfd6c3;
    --o: #e11d48;
    --o2: #be123c;
    --g: #113221;
    --g2: #15803d;
    --amb: #d97706;
    --serif: 'Fraunces', Georgia, serif;
    --sh-card: 0 14px 28px -8px rgba(19,34,26,.12), inset 0 1px 0 #fff;
    --sh-3d-o: 0 4px 0 #9f1239, 0 10px 20px rgba(225,29,72,.28);
    --sh-3d-g: 0 4px 0 #071910, 0 10px 20px rgba(17,50,33,.25);
  }
  [data-theme=dark] {
    --bg: #0b120e; --sf: #142019; --sf2: #1b2a21; --ink: #f3efe6; --mu: #9ca89f; --ln: #26382d;
    --sh-card: 0 16px 32px -8px rgba(0,0,0,.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 12% 4%, rgba(225,29,72,.08), transparent 36%),
                radial-gradient(circle at 88% 92%, rgba(21,128,61,.08), transparent 36%),
                var(--bg);
    color: var(--ink);
    padding-bottom: 135px;
    min-height: 100vh;
  }
  img { display: block; object-fit: cover; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 60;
    background: linear-gradient(135deg, #0f291c 0%, #173d2a 60%, #2d111d 100%);
    color: #fff; padding: 11px 14px;
    box-shadow: 0 8px 24px rgba(11,34,22,.32);
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(145deg, #f43f5e, #be123c);
    display: grid; place-items: center; font-family: var(--serif); font-weight: 800; font-size: 16px; color: #fff;
    box-shadow: 0 4px 0 #881337; cursor: pointer; flex: none;
  }
  .logo:active { transform: translateY(2px); box-shadow: 0 1px 0 #881337; }
  .brand { flex: 1; min-width: 0; }
  .brand small { display: block; color: #fbbf24; font-size: 9px; letter-spacing: 1.4px; font-weight: 800; }
  .brand h1 { font-family: var(--serif); font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb-pill { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.12); color: #a7f3d0; }

  /* Role Quick Bar */
  .role-strip {
    background: #102419; padding: 6px 12px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .role-strip::-webkit-scrollbar { display: none; }
  .role-strip button {
    flex: none; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #e2e8f0;
    padding: 5px 10px; border-radius: 99px; font-size: 10.5px; font-weight: 800; cursor: pointer;
  }
  .role-strip button.on { background: #fbbf24; color: #0f172a; border-color: #fbbf24; }

  main { max-width: 720px; margin: 0 auto; padding: 14px; }

  /* Cards */
  .card {
    background: var(--sf); border: 1px solid var(--ln); border-radius: 22px;
    padding: 15px; margin-bottom: 14px; box-shadow: var(--sh-card);
  }
  .card h3 {
    font-family: var(--serif); font-size: 16px; font-weight: 800; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .p-green { background: #dcfce7; color: #166534; }
  .p-red { background: #ffe4e6; color: #9f1239; }
  .p-amber { background: #fef3c7; color: #92400e; }
  .p-blue { background: #dbeafe; color: #1e40af; }
  .p-dark { background: #0f172a; color: #fff; }

  /* 3D Pop-Out Hero Banners */
  .hero {
    position: relative; border-radius: 24px; padding: 18px; margin: 8px 0 18px; color: #fff;
    overflow: visible; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 14px 28px rgba(17,50,33,.28);
  }
  .hero.tiffin-bg { background: linear-gradient(135deg, #881337 0%, #e11d48 100%); }
  .hero.food-bg { background: linear-gradient(135deg, #78350f 0%, #d97706 100%); }
  .hero.kirana-bg { background: linear-gradient(135deg, #064e3b 0%, #15803d 100%); }
  .hero h2 { font-family: var(--serif); font-size: 19px; line-height: 1.2; margin: 4px 0; }
  .hero p { font-size: 11.5px; opacity: .94; }
  .hero-pop {
    width: 96px; height: 96px; border-radius: 50%; border: 3px solid rgba(255,255,255,.92); flex: none;
    transform: translateY(-10px) scale(1.08);
    box-shadow: 0 18px 26px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.12);
    transition: transform .25s ease;
  }
  .hero:hover .hero-pop { transform: translateY(-14px) scale(1.13) rotate(-3deg); }

  /* Buttons & Inputs */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 99px; padding: 11px 16px; font-weight: 800; font-size: 12.5px;
    cursor: pointer; text-decoration: none; transition: transform .12s;
  }
  .btn:active { transform: scale(.97); }
  .btn.full { width: 100%; margin-top: 8px; }
  .btn.o { background: linear-gradient(180deg, #f43f5e, #be123c); color: #fff; box-shadow: var(--sh-3d-o); }
  .btn.g { background: linear-gradient(180deg, #16a34a, #113221); color: #fff; box-shadow: var(--sh-3d-g); }
  .btn.amb { background: linear-gradient(180deg, #fbbf24, #d97706); color: #0f172a; }
  .btn.w { background: var(--sf2); color: var(--ink); border: 1px solid var(--ln); }
  .btn.r { background: #ffe4e6; color: #9f1239; border: 1px solid #fecdd3; }
  .btn.sm { padding: 6px 11px; font-size: 11px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .btn-row > * { flex: 1; }

  .inp {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--ln); border-radius: 13px;
    background: var(--sf2); color: var(--ink); font-weight: 700; font-size: 12.5px; margin: 4px 0; outline: none;
  }
  .inp:focus { border-color: var(--o); background: var(--sf); }
  .lbl { display: block; font-size: 10px; font-weight: 800; color: var(--mu); margin: 8px 0 3px; text-transform: uppercase; letter-spacing: .5px; }

  .seg { display: flex; gap: 4px; background: var(--sf2); padding: 4px; border-radius: 99px; margin: 4px 0; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 99px; font-size: 11px; font-weight: 800; color: var(--mu); cursor: pointer; }
  .seg button.on { background: var(--g); color: #fff; }

  /* Tiffin Plans Grid */
  .plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin: 10px 0; }
  .p-tier {
    border: 2px solid var(--ln); border-radius: 18px; padding: 12px 10px; text-align: center;
    background: var(--sf2); cursor: pointer; position: relative; transition: .15s;
  }
  .p-tier.on { border-color: var(--o); background: #fff1f2; transform: translateY(-2px); box-shadow: 0 8px 18px rgba(225,29,72,.18); }
  [data-theme=dark] .p-tier.on { background: #2c121b; }
  .p-tier .tag { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); background: var(--g); color: #fbbf24; font-size: 8.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .p-tier.on .tag { background: var(--o); color: #fff; }
  .p-tier b { display: block; font-family: var(--serif); font-size: 19px; color: var(--o); margin: 3px 0; }

  /* Restaurant Cards */
  .rest-card {
    border: 1px solid var(--ln); border-radius: 20px; overflow: hidden; background: var(--sf);
    margin-bottom: 14px; box-shadow: var(--sh-card); cursor: pointer; transition: transform .18s;
  }
  .rest-card:hover { transform: translateY(-3px); }
  .rest-cover { position: relative; height: 145px; background: #1e293b; }
  .rest-cover img { width: 100%; height: 100%; }
  .rest-status { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .rest-eta { position: absolute; bottom: 10px; right: 10px; background: rgba(15,23,42,.85); color: #fff; padding: 4px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .rest-body { padding: 12px 14px; }
  .rest-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rest-rating { background: #15803d; color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; }

  /* Product Cards & 3D Pop-Out Dish Frame */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pcard {
    border: 1px solid var(--ln); border-radius: 20px; padding: 10px; background: var(--sf);
    box-shadow: var(--sh-card); display: flex; flex-direction: column; justify-content: space-between;
    overflow: visible; margin-top: 6px;
  }
  .pimg {
    position: relative; height: 118px; border-radius: 16px; overflow: visible;
    background: radial-gradient(circle at 50% 45%, #fffbeb 0%, #fde68a 60%, #f59e0b 100%);
    margin-bottom: 10px; cursor: pointer; display: grid; place-items: center;
  }
  [data-theme=dark] .pimg {
    background: radial-gradient(circle at 50% 45%, #29352d 0%, #17221b 100%);
  }
  .pimg img {
    width: 106%; height: 124px; border-radius: 16px;
    transform: translateY(-8px);
    box-shadow: 0 14px 20px -6px rgba(19,34,26,.38);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .pcard:hover .pimg img, .pcard:active .pimg img {
    transform: translateY(-13px) scale(1.05);
    box-shadow: 0 20px 26px -6px rgba(19,34,26,.48);
  }
  .sym { display: inline-grid; place-items: center; width: 13px; height: 13px; border: 2px solid #16a34a; border-radius: 3px; background: #fff; flex: none; }
  .sym i { width: 5px; height: 5px; border-radius: 50%; background: #16a34a; }
  .sym.nv { border-color: #dc2626; } .sym.nv i { background: #dc2626; }
  .qty { display: flex; align-items: center; justify-content: space-between; background: var(--sf2); padding: 3px; border-radius: 99px; margin-top: 6px; }
  .qty button { width: 27px; height: 27px; border-radius: 50%; border: 0; background: var(--o); color: #fff; font-weight: 800; cursor: pointer; }

  /* Chips & Progress */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--ln); background: var(--sf); font-size: 11px; font-weight: 800; cursor: pointer; }
  .chips button.on { background: var(--g); color: #fbbf24; border-color: var(--g); }
  .pbar { height: 8px; background: var(--sf2); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, #e11d48, #16a34a); transition: width .25s; }

  /* Tables, Timeline & Rows */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--ln); font-size: 12px; }
  .row:last-child { border-bottom: 0; }
  .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi div { background: var(--sf); border: 1px solid var(--ln); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: var(--sh-card); }
  .kpi b { display: block; font-family: var(--serif); font-size: 17px; color: var(--o); }
  .kpi span { font-size: 9.5px; font-weight: 800; color: var(--mu); text-transform: uppercase; }
  .tl { display: flex; gap: 4px; margin: 6px 0; }
  .tl span { flex: 1; text-align: center; font-size: 9px; font-weight: 800; padding: 4px 2px; border-radius: 8px; background: var(--sf2); color: var(--mu); }
  .tl span.done { background: #dcfce7; color: #166534; }
  .tl span.now { background: #fbbf24; color: #0f172a; }

  /* Floating Cart & Bottom Nav */
  .cbar {
    position: fixed; left: 12px; right: 12px; bottom: 76px; z-index: 70; max-width: 680px; margin: 0 auto;
    background: linear-gradient(135deg, #15803d, #0f291c); color: #fff; border-radius: 99px;
    padding: 11px 18px; display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; font-weight: 800; box-shadow: 0 10px 24px rgba(15,41,28,.4); cursor: pointer;
  }
  nav {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 80; max-width: 700px; margin: 0 auto;
    background: var(--sf); border: 1px solid var(--ln); border-radius: 99px;
    display: flex; gap: 3px; padding: 5px; box-shadow: 0 12px 30px rgba(0,0,0,.18);
  }
  nav button {
    flex: 1; border: 0; background: transparent; border-radius: 99px; padding: 7px 2px;
    font-size: 9.5px; font-weight: 800; color: var(--mu); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
  }
  nav button.on { background: var(--g); color: #fbbf24; }
  nav .nb { position: absolute; top: 2px; right: 16%; background: var(--o); color: #fff; font-size: 8.5px; padding: 1px 5px; border-radius: 99px; }

  /* Modal Sheet & Toast */
  .ov { position: fixed; inset: 0; z-index: 200; background: rgba(11,22,16,.78); backdrop-filter: blur(5px); display: flex; align-items: flex-end; justify-content: center; }
  .sh { background: var(--sf); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 18px; animation: sUp .2s ease-out; }
  @keyframes sUp { from { transform: translateY(100%); } }
  #toast {
    position: fixed; left: 50%; bottom: 132px; transform: translateX(-50%) translateY(20px);
    background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 12px; font-weight: 800;
    z-index: 900; opacity: 0; pointer-events: none; transition: .22s; text-align: center; max-width: 90vw;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; width: 58mm; font-family: monospace; font-size: 11px; color: #000; background: #fff; padding: 4px; }
  }

  /* ==================== ENHANCED 3D POP-OUT & DEPTH SYSTEM ==================== */
  header {
    border-bottom: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 28px rgba(11,34,22,.38), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .logo {
    transform: perspective(400px) rotateY(-8deg);
    box-shadow: 3px 5px 0 #881337, 0 12px 20px rgba(225,29,72,.38), inset 0 2px 2px rgba(255,255,255,.45);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .logo:hover { transform: perspective(400px) rotateY(0deg) scale(1.06); }

  .card {
    box-shadow: 0 16px 32px -10px rgba(19,34,26,.16), 0 3px 0 rgba(223,214,195,.85), inset 0 1.5px 0 #fff;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  [data-theme=dark] .card {
    box-shadow: 0 18px 34px -8px rgba(0,0,0,.72), 0 3px 0 #080e0a, inset 0 1px 0 rgba(255,255,255,.07);
  }

  /* 3D Hero Stage with Floating Pop-Out Plate & Ambient Rim */
  .hero {
    transform-style: preserve-3d;
    perspective: 900px;
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: 0 18px 34px -8px rgba(17,50,33,.38), 0 6px 0 rgba(15,23,42,.22), inset 0 1.5px 0 rgba(255,255,255,.32);
    margin: 14px 0 22px;
  }
  .hero-pop-wrap {
    position: relative;
    flex: none;
    transform-style: preserve-3d;
  }
  .hero-pop-wrap::after {
    content: "";
    position: absolute;
    left: 12%; right: 12%; bottom: -8px; height: 14px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, transparent 72%);
    filter: blur(3px);
    z-index: 0;
  }
  .hero-pop {
    position: relative;
    z-index: 1;
    width: 104px; height: 104px;
    border-radius: 50%;
    border: 3.5px solid rgba(255,255,255,.95);
    transform: translateY(-14px) translateZ(28px) scale(1.1);
    box-shadow: 0 22px 28px -6px rgba(0,0,0,.52), 0 0 0 6px rgba(255,255,255,.15), inset 0 2px 6px rgba(255,255,255,.4);
    animation: float3d 3.6s ease-in-out infinite;
  }
  @keyframes float3d {
    0%, 100% { transform: translateY(-14px) scale(1.1) rotate(0deg); }
    50% { transform: translateY(-20px) scale(1.13) rotate(-2.5deg); }
  }

  /* Rising Steam Effect on Hot Meals */
  .steam-wrap {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: none; z-index: 3;
  }
  .steam-wrap i {
    width: 4px; height: 16px; border-radius: 99px;
    background: rgba(255,255,255,.72); filter: blur(1.5px);
    animation: steamUp 2.2s ease-in-out infinite;
  }
  .steam-wrap i:nth-child(2) { animation-delay: .6s; height: 20px; }
  .steam-wrap i:nth-child(3) { animation-delay: 1.2s; }
  @keyframes steamUp {
    0% { opacity: 0; transform: translateY(6px) scaleY(.7); }
    50% { opacity: .85; }
    100% { opacity: 0; transform: translateY(-14px) scaleY(1.2); }
  }

  /* 3D Pop-Out Dish Cards & Contact Shadow Pedestal */
  .pcard {
    position: relative;
    transform-style: preserve-3d;
    border: 1.5px solid var(--ln);
    box-shadow: 0 16px 26px -10px rgba(19,34,26,.18), 0 4px 0 rgba(223,214,195,.9), inset 0 1.5px 0 #fff;
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
    margin-top: 12px;
  }
  [data-theme=dark] .pcard {
    box-shadow: 0 18px 28px -8px rgba(0,0,0,.7), 0 4px 0 #09100c, inset 0 1px 0 rgba(255,255,255,.08);
  }
  .pcard:hover {
    transform: translateY(-5px);
    box-shadow: 0 24px 34px -10px rgba(19,34,26,.26), 0 6px 0 rgba(223,214,195,.95), inset 0 1.5px 0 #fff;
  }
  .pimg {
    position: relative; height: 122px; border-radius: 18px; overflow: visible;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #fef3c7 55%, #f59e0b 100%);
    box-shadow: inset 0 -10px 18px rgba(180,83,9,.18), inset 0 2px 4px rgba(255,255,255,.85);
    margin-bottom: 12px; cursor: pointer; display: grid; place-items: center;
  }
  [data-theme=dark] .pimg {
    background: radial-gradient(circle at 50% 42%, #314237 0%, #16221b 100%);
    box-shadow: inset 0 -10px 18px rgba(0,0,0,.45), inset 0 1px 2px rgba(255,255,255,.12);
  }
  .pimg::after {
    content: "";
    position: absolute; bottom: 4px; left: 14%; right: 14%; height: 12px;
    background: radial-gradient(ellipse at center, rgba(19,34,26,.45) 0%, transparent 74%);
    filter: blur(2.5px);
    z-index: 0;
    transition: transform .22s ease, opacity .22s ease;
  }
  .pimg img {
    position: relative; z-index: 1;
    width: 108%; height: 128px; border-radius: 18px;
    transform: translateY(-12px) scale(1.02);
    border: 2px solid rgba(255,255,255,.85);
    box-shadow: 0 18px 24px -8px rgba(19,34,26,.46), 0 4px 10px rgba(0,0,0,.18);
    transition: transform .24s cubic-bezier(.22,1,.36,1), box-shadow .24s ease;
  }
  .pcard:hover .pimg img, .pcard:active .pimg img {
    transform: translateY(-18px) scale(1.07) rotate(-1.5deg);
    box-shadow: 0 26px 32px -8px rgba(19,34,26,.56), 0 6px 14px rgba(0,0,0,.22);
  }
  .pcard:hover .pimg::after {
    transform: scaleX(.86);
    opacity: .65;
  }

  /* 3D Extruded Plan Tiers & Restaurant Cards */
  .p-tier {
    box-shadow: 0 5px 0 var(--ln), 0 10px 16px rgba(19,34,26,.08);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .p-tier.on {
    box-shadow: 0 5px 0 #be123c, 0 14px 24px rgba(225,29,72,.26);
    transform: translateY(-3px);
  }
  .rest-card {
    box-shadow: 0 16px 28px -10px rgba(19,34,26,.18), 0 4px 0 var(--ln);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .rest-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 22px 34px -10px rgba(19,34,26,.25), 0 6px 0 var(--ln);
  }

  /* 3D Tactile Buttons & Floating Nav */
  .btn.o {
    box-shadow: 0 4px 0 #9f1239, 0 10px 20px rgba(225,29,72,.3), inset 0 1.5px 0 rgba(255,255,255,.35);
  }
  .btn.o:active { transform: translateY(2px); box-shadow: 0 2px 0 #9f1239, 0 5px 10px rgba(225,29,72,.25); }
  .btn.g {

function autoMatch3DImage(name, cat, desc = "") {
  const txt = `${name} ${cat} ${desc}`.toLowerCase();
  if (/surf|detergent|easy\s*wash|washing/.test(txt)) return REAL_IMG.surf;
  if (/lifebuoy|soap|sabun|handwash/.test(txt)) return REAL_IMG.soap;
  if (/tea|chai|red\s*label|brooke/.test(txt)) return REAL_IMG.tea;
  if (/oil|tel|fortune|sunlite|mustard/.test(txt)) return REAL_IMG.oil;
  if (/milk|omfed|doodh|bread|curd|dahi/.test(txt)) return REAL_IMG.milk;
  if (/atta|wheat|maida|besan/.test(txt)) return REAL_IMG.atta;
  if (/rice|chawal|miniket|basmati/.test(txt)) return REAL_IMG.rice;
  if (/biryani|pulao|dum/.test(txt)) return REAL_IMG.biryani;
  if (/jar\s*cake|jarcake|cupcake/.test(txt)) return REAL_IMG.jarcake;
  if (/cake|pastry|velvet|truffle|bakery/.test(txt)) return REAL_IMG.cake;
  if (/puri|halwa|aloo\s*dum/.test(txt)) return REAL_IMG.puri;
  if (/idli|dosa|sambar|upma|vada|nashta|breakfast/.test(txt)) return REAL_IMG.idli;
  if (/paneer|mushroom|butter\s*masala|naan/.test(txt)) return REAL_IMG.paneer;
  if (/chicken|mutton|fish|egg|tadka|non-veg|nonveg/.test(txt)) return REAL_IMG.chicken;
  if (/thali|dalma|meal|combo|roti|tiffin|dabba/.test(txt)) return REAL_IMG.thali;
  const catFallback = {
    Breakfast: REAL_IMG.idli, Thali: REAL_IMG.thali, Meals: REAL_IMG.chicken, Biryani: REAL_IMG.biryani,
    Bakery: REAL_IMG.cake, Staples: REAL_IMG.atta, Dairy: REAL_IMG.milk, Kirana: REAL_IMG.kirana
  };
  return catFallback[cat] || REAL_IMG.thali;
}

function autoPrioritySort(orders) {
  const rank = {
    "Placed": 1,
    "Verify Hold": 1,
    "Confirmed": 2,
    "Cooking": 3,
    "Ready for Pickup": 4,
    "Out for Delivery": 5,
    "Delivered": 6,
    "Cancelled": 7
  };
  return (orders || []).slice().sort((a, b) => (rank[a.status] || 9) - (rank[b.status] || 9));
}

function autoCalcOrderComm(o, kind) {
  let comm = 0;
  (o.items || []).forEach(it => {
    const v = S.vendors.find(x => x.id === it.vendorId);
    if (v && !v.isSelf) {
      if (kind === "FOOD") {
        comm += Math.round((it.price * it.qty * (+S.cfg.foodPartnerCommPct || 20)) / 100);
      } else if (kind === "KIRANA" && o.status === "Delivered") {
        comm += (+S.cfg.kiranaPostDeliveryComm || 30);
      }
    }
  });
  return comm;
}

function validateStrictUTR(raw, usedList) {
  const clean = String(raw || "").replace(/\D/g, "");
  if (clean.length !== 12) return { ok: false, msg: "⚠️ Exact 12-digit UPI UTR number daalein!" };
  if (/^(\d) {6,}/.test(clean) || /(012345|123456|234567|345678|456789|987654|654321)/.test(clean)) {
    return { ok: false, msg: "⚠️ Fake sequence UTR blocked! Asli bank UTR daalein." };
  }
  if ((usedList || []).includes(clean)) return { ok: false, msg: "⚠️ Duplicate UTR! Yeh UTR pehle use ho chuka hai." };
  return { ok: true, utr: clean };
}

function hashDataUrl(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i += Math.max(1, Math.floor(s.length / 400))) {
    h = ((h << 5) + h) ^ s.charCodeAt(i);
  }
  return "H-" + (h >>> 0).toString(16);
}

let USER_GPS = { lat: null, lng: null, acc: null, status: "Not captured yet", ok: false };

function captureMandatoryGps(silent = false) {
  if (!navigator.geolocation) {
    USER_GPS.status = "⚠️ Browser GPS support nahi karta";
    USER_GPS.ok = false;
    if (!silent) toast(USER_GPS.status);
    render();
    return;
  }
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    USER_GPS.status = "⚠️ GPS ke liye HTTPS link par app kholein (file:// par GPS block hota hai)";
    USER_GPS.ok = false;
    if (!silent) toast(USER_GPS.status);
    render();
    return;
  }
  USER_GPS.status = "📡 GPS Location pakad raha hai...";
  if (!silent) render();
  navigator.geolocation.getCurrentPosition(
    pos => {
      USER_GPS = {
        lat: +pos.coords.latitude.toFixed(6),
        lng: +pos.coords.longitude.toFixed(6),
        acc: Math.round(pos.coords.accuracy || 0),
        status: `✅ GPS Locked (${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} · ±${Math.round(pos.coords.accuracy || 0)}m)`,
        ok: true
      };
      if (!silent) toast("📍 Live GPS Location Locked!");
      render();
    },
    err => {
      USER_GPS.ok = false;
      USER_GPS.status = err.code === 1
        ? "⚠️ Location Permission Denied! Phone settings/browser se Location Allow karein."
        : "⚠️ GPS signal weak hai — khuli jagah par jakar Retry dabayein.";
      if (!silent) toast(USER_GPS.status);
      render();
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 }
  );
}

/* ==================== CATEGORY 3: KIRANA & HUL ==================== */
function kiranaCartCount() {
  return Object.values(KIRANA_CART).reduce((a, b) => a + (+b || 0), 0);
}
function kiranaSubtotal() {
  return Object.entries(KIRANA_CART).reduce((sum, [id, qty]) => {
    const it = S.kiranaItems.find(x => x.id === id);
    return it ? sum + it.price * qty : sum;
  }, 0);
}
function kiranaDeliveryFee(sub) {
  if (sub <= 0) return 0;
  return sub >= (+S.cfg.kiranaFreeDeliveryAt || 500) ? 0 : (+S.cfg.kiranaDeliveryFee || 25);
}

function viewKirana() {
  const sub = kiranaSubtotal();
  const minOrd = +S.cfg.kiranaMinOrder || 300;
  const freeAt = +S.cfg.kiranaFreeDeliveryAt || 500;
  const fee = kiranaDeliveryFee(sub);
  const pct = Math.min(100, Math.round((sub / freeAt) * 100));

  const q = KIRANA_SEARCH.trim().toLowerCase();
  const items = S.kiranaItems.filter(it => {
    const vName = (S.vendors.find(x => x.id === it.vendorId)?.name || "").toLowerCase();
    return (KIRANA_CAT_FILTER === "ALL" || it.cat === KIRANA_CAT_FILTER) &&
      (!q || it.name.toLowerCase().includes(q) || it.cat.toLowerCase().includes(q) || (it.desc || "").toLowerCase().includes(q) || vName.includes(q));
  });

  return `
    <div class="hero kirana-bg">
      <div>
        <span class="pill p-amber">MIN ₹${minOrd} ORDER · ₹${freeAt}+ FREE DELIVERY</span>
        <h2>Kirana & Daily Needs Daily Needs</h2>
        <p>Atta, Chawal, Tel, Surf Excel, Lifebuoy, Tea & Dairy ghar baithe</p>
      </div>
      <div class="hero-pop-wrap"><img class="hero-pop" src="${ART3D.surf}" alt="Kirana & Daily Needs" /></div>
    </div>

    <div class="card" style="border:2px solid ${sub >= freeAt ? "#16a34a" : sub >= minOrd ? "#d97706" : "#e11d48"}">
      <div style="font-size:12px;font-weight:800">
        ${sub < minOrd ? `⚠️ Kirana Cart: <b>${inr(sub)}</b> — Minimum order ke liye <b>${inr(minOrd - sub)}</b> aur add karein!` :
          sub < freeAt ? `✅ Min ₹${minOrd} unlocked! <b>${inr(freeAt - sub)}</b> aur add karein <b>FREE Delivery</b> ke liye (Save ₹${fee}).` :
          `🎉 <b>FREE Delivery Unlocked!</b> (Cart ${inr(sub)} ≥ ₹${freeAt})`}
      </div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn amb sm" data-act="addKiranaCombo">⚡ 1-Tap ₹500 Free-Del Combo</button>
        <button class="btn w sm" data-act="clearKiranaCart">Clear Kirana Cart</button>

    </div>

    <div class="btn-row"><input class="inp" id="kiranaSearchInp" placeholder="🔍 Product ke naam se find karein (Atta, Rice, Surf Excel...)" value="${esc(KIRANA_SEARCH)}" />${KIRANA_SEARCH ? `<button class="btn w sm" style="max-width:78px" data-act="clearKiranaSearch">Clear</button>` : ""}</div>
    <div class="chips" style="margin-top:6px">
      ${["ALL", "HUL", "Staples", "Dairy"].map(c =>
        `<button class="${KIRANA_CAT_FILTER === c ? "on" : ""}" data-act="setKiranaCat" data-v="${c}">${c === "HUL" ? "Daily Care" : c}</button>`
      ).join("")}

    <div class="grid-2">
      ${items.map(it => {
        const v = S.vendors.find(x => x.id === it.vendorId) || { name: "Kirana Store", status: "Open" };

function viewCheckoutPage() {
  if (!CHECKOUT_MODAL) { TAB = "tiffin"; return viewTiffin(); }
  const m = CHECKOUT_MODAL;
  const isFood = m.kind === "FOOD";
  const isKirana = m.kind === "KIRANA";
  const isTiffin = m.kind === "TIFFIN";

  // Refresh live items & totals if user edits +/- directly on Checkout Page
  let liveItems = [];
  let subTotal = m.total;
  let delFee = 0;
  let discAmt = +m.discountAmt || 0;
  let grandTotal = Math.max(0, m.total - discAmt);

  if (isFood) {
    liveItems = Object.entries(FOOD_CART).map(([id, qty]) => {
      const it = S.foodItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    if (!liveItems.length) { CHECKOUT_MODAL = null; TAB = "food"; return viewFoodShop(); }
    subTotal = foodCartTotal();
    delFee = 0;
    grandTotal = Math.max(0, subTotal - discAmt);
    m.items = liveItems;
    m.total = grandTotal;
  } else if (isKirana) {
    liveItems = Object.entries(KIRANA_CART).map(([id, qty]) => {
      const it = S.kiranaItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    const minOrd = +S.cfg.kiranaMinOrder || 300;
    if (!liveItems.length || kiranaSubtotal() < minOrd) {
      CHECKOUT_MODAL = null;
      TAB = "kirana";
      return viewKirana();
    }
    subTotal = kiranaSubtotal();
    delFee = kiranaDeliveryFee(subTotal);
    grandTotal = Math.max(0, subTotal + delFee - discAmt);
    m.items = liveItems;
    m.sub = subTotal;
    m.deliveryFee = delFee;
    m.total = grandTotal;
  }

  const uLink = qrUrl(`upi://pay?pa=${S.cfg.upi}&pn=Namaste%20Udala&cu=INR&am=${Number(grandTotal).toFixed(2)}`);
  const backTab = isTiffin ? "tiffin" : isFood ? "food" : "kirana";
  const themeBg = isTiffin ? "#881337" : isFood ? "#78350f" : "#064e3b";

  return `
    <div class="card" style="background:${themeBg};color:#fff">

        <button class="btn w sm" data-act="backFromCheckout" data-v="${backTab}">← Back</button>

          <small style="color:#fde68a;font-weight:800;letter-spacing:1px">${esc(m.kind)} CHECKOUT PAGE</small>
          <h2 style="font-family:var(--serif);font-size:18px">${esc(m.title)}</h2>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>1. Order Summary & Items <span class="pill p-green">${isTiffin ? "Subscription" : liveItems.length + " Items"}</span></h3>
      ${isTiffin ? `
        <div style="background:var(--sf2);padding:12px;border-radius:14px;font-size:12.5px;font-weight:700">
          🍱 ${esc(m.summary)}
        </div>
      ` : `
        ${liveItems.map(it => {
          const ven = S.vendors.find(v => v.id === it.vendorId)?.name || "Store";
          const incAct = isFood ? "fInc" : "kInc";
          const decAct = isFood ? "fDec" : "kDec";
          return `
            <div class="row">
              <div style="flex:1;min-width:0">
                <div style="font-size:9.5px;font-weight:800;color:var(--mu)">🏪 ${esc(ven)}</div>
                <b>${esc(it.name)}</b>
                <div style="font-size:11px;color:var(--g2);font-weight:800">${inr(it.price)} × ${it.qty} = ${inr(it.price * it.qty)}</div>
              </div>
              <div class="qty" style="margin-top:0;width:92px;flex:none">
                <button data-act="${decAct}" data-id="${it.id}">−</button>
                <b>${it.qty}</b>
                <button data-act="${incAct}" data-id="${it.id}">+</button>
              </div>
            </div>
          `;
        }).join("")}
      `}

      <div style="margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--ln);font-size:12.5px">
        <div class="row" style="padding:3px 0;border:0"><span>Item Total</span><b>${inr(subTotal)}</b></div>
        ${!isTiffin ? `<div class="row" style="padding:3px 0;border:0"><span>Delivery Fee</span><b style="color:${delFee === 0 ? "#16a34a" : "inherit"}">${delFee === 0 ? "FREE (₹0)" : inr(delFee)}</b></div>` : ""}
        ${discAmt > 0 ? `<div class="row" style="padding:3px 0;border:0;color:#16a34a"><span>Promo Discount (${esc(m.appliedPromo)})</span><b>-${inr(discAmt)}</b></div>` : ""}

      ${!isTiffin ? `

          <option value="Morning (8:00 AM - 10:00 AM)" ${m.delSlot === "Morning (8:00 AM - 10:00 AM)" ? "selected" : ""}>🌅 Morning (8:00 AM – 10:00 AM)</option>

function viewKitchen() {
  const subs = (S.tiffinSubs || []).filter(s => !s.skipToday && !(+(s.vacationDays || 0) > 0) && s.vStat !== "bad");

function getVendorLedger(v) {
  const list = v.type === "FOOD" ? (S.foodOrders || []) : (S.kiranaOrders || []);
  let gross = 0, comm = 0;
  list.filter(o => o.status !== "Cancelled").forEach(o => {
    const vSub = o.items.filter(i => i.vendorId === v.id).reduce((a, i) => a + i.price * i.qty, 0);
    if (vSub > 0) {
      gross += vSub;
      if (!v.isSelf) {
        if (v.type === "FOOD") comm += Math.round((vSub * (+S.cfg.foodPartnerCommPct || 20)) / 100);
        if (v.type === "KIRANA" && o.status === "Delivered") comm += (+S.cfg.kiranaPostDeliveryComm || 30);
      }
    }
  });
  const payable = Math.max(0, gross - comm);
  const due = Math.max(0, payable - (+v.settledPaid || 0));
  return { gross, comm, payable, due };
}

/* ==================== MAIN RENDER ==================== */
function render() {
  autoSyncCustomerDefaults();
  const vPins = { ...PINS.vendors, ...(S.cfg.vendorPins || {}) };
  const partnerVendorRoles = S.vendors
    .filter(v => !v.isSelf && vPins[v.id])
    .map(v => [`vendor_${v.id}`, `${v.name.slice(0, 14)} (${vPins[v.id]})`]);

  const roles = [
    ["customer", "Customer App"],
    ["kitchen", "Kitchen (1122)"],
    ["delivery", "Delivery (3344)"],
    ...partnerVendorRoles,
    ["owner", "Owner Master (4827)"]
  ];
  const curKey = ROLE === "vendor" ? `vendor_${ACTIVE_VENDOR_ID}` : ROLE;
  $("#roleStrip").innerHTML = roles.map(([k, label]) =>
    `<button class="${curKey === k ? "on" : ""}" data-act="askRole" data-v="${k}">${esc(label)}</button>`
  ).join("");

  if (ROLE === "kitchen") $("#appMain").innerHTML = viewKitchen();
  else if (ROLE === "delivery") $("#appMain").innerHTML = viewDelivery();
  else if (ROLE === "vendor") $("#appMain").innerHTML = viewVendor();
  else if (ROLE === "owner") $("#appMain").innerHTML = viewOwner();
  else {
    if (TAB === "checkout" && CHECKOUT_MODAL) {
      $("#appMain").innerHTML = viewCheckoutPage();
    } else if (TAB === "success" && LAST_PLACED_ORDER) {
      $("#appMain").innerHTML = viewOrderSuccessPage();
    } else if (TAB === "itemDetail" && DETAIL_ITEM) {
      $("#appMain").innerHTML = viewItemDetailPage();
    } else if (TAB === "tiffinPass") {
      $("#appMain").innerHTML = viewTiffinPassPage();
    } else {
      if (TAB === "tiffin") $("#appMain").innerHTML = viewTiffin();
      else if (TAB === "food") $("#appMain").innerHTML = viewFoodShop();
      else if (TAB === "kirana") $("#appMain").innerHTML = viewKirana();
      else if (TAB === "orders") $("#appMain").innerHTML = viewCustomerOrders();
      else $("#appMain").innerHTML = viewAccountPage();
    }
  }

  let cbarHtml = "";
  if (ROLE === "customer" && TAB === "food" && foodCartCount() > 0) {
    cbarHtml = `<div class="cbar" data-act="openFoodCheckout"><span>🍛 Food Cart: ${foodCartCount()} Items · ${inr(foodCartTotal())}</span><span>Checkout Food →</span></div>`;
  } else if (ROLE === "customer" && TAB === "kirana" && kiranaCartCount() > 0) {
    const sub = kiranaSubtotal();
    const minOrd = +S.cfg.kiranaMinOrder || 300;
    const fee = kiranaDeliveryFee(sub);
    cbarHtml = `<div class="cbar" data-act="openKiranaCheckout"><span>🛒 Kirana: ${inr(sub)} ${fee ? `(+₹${fee} Del)` : "(FREE Del)"}</span><span>${sub < minOrd ? `Min ₹${minOrd}` : "Checkout Kirana →"}</span></div>`;
  }
  $("#cartFloat").innerHTML = cbarHtml;

  if (ROLE === "customer") {
    const navItems = [
      ["tiffin", "🍱", "Mera Tiffin", 0],
      ["food", "🍛", "Food Shop", foodCartCount()],
      ["kirana", "🛒", "Kirana & Daily Needs", kiranaCartCount()],
      ["orders", "📦", "My Orders", (S.foodOrders?.length || 0) + (S.kiranaOrders?.length || 0)],
      ["account", "👤", "Profile", 0]
    ];
    $("#bottomNav").style.display = "flex";
    $("#bottomNav").innerHTML = navItems.map(([t, ic, lbl, cnt]) =>
      `<button class="${TAB === t ? "on" : ""}" data-act="setTab" data-v="${t}">
        <span style="font-size:17px">${ic}</span><span>${lbl}</span>
        ${cnt > 0 ? `<span class="nb">${cnt}</span>` : ""}
      </button>`
    ).join("");
  } else {
    $("#bottomNav").style.display = "none";
  }

  $("#modalRoot").innerHTML = "";
}

/* ==================== ACTIONS & EVENTS ==================== */
const ACT = {
  toggleTheme: () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "";
    localStorage.setItem("nu_dark", dark ? "1" : "0");
    $("#themeBtn").textContent = dark ? "☀️" : "🌙";
  },
  setTab: v => { TAB = v; SELECTED_REST_ID = null; render(); scrollTo({ top: 0, behavior: "smooth" }); },
  jumpFoodCat: v => { TAB = "food"; SELECTED_REST_ID = null; FOOD_CAT_FILTER = v; render(); },
  setRole: v => { ROLE = v; sessionStorage.setItem("nu_role", v); render(); },
  askRole: v => {
    if (v === "customer") { ROLE = "customer"; sessionStorage.setItem("nu_role", "customer"); render(); return; }
    if (v.startsWith("vendor_")) {
      const vid = v.replace("vendor_", "");
      const pin = prompt(`Enter PIN for Vendor:`);
      const expectedPin = (S.cfg.vendorPins || {})[vid] || PINS.vendors[vid];
      if (expectedPin && pin === expectedPin) {
        ROLE = "vendor"; ACTIVE_VENDOR_ID = vid;
        sessionStorage.setItem("nu_role", "vendor"); sessionStorage.setItem("nu_vid", vid);
        render(); toast("Vendor Panel Unlocked ✓");
      } else if (pin !== null) toast("❌ Galat Vendor PIN!");
      return;
    }
    const pin = prompt(`Enter Security PIN for ${v.toUpperCase()}:`);
    if (pin === PINS[v]) {
      ROLE = v; sessionStorage.setItem("nu_role", v);
      render(); toast(`${v.toUpperCase()} Panel Unlocked ✓`);
    } else if (pin !== null) toast("❌ Galat PIN!");
  },

  tfSet: (v, k) => { TF[k] = k === "days" ? +v : v; render(); },
  openTiffinCheckout: () => {
    const total = calcTiffinPrice(TF.diet, TF.days, TF.slot);
    PROOF_DATA_URL = "";
    TAB = "checkout"; scrollTo({ top: 0, behavior: "smooth" }); captureMandatoryGps(true);
    CHECKOUT_MODAL = {
      kind: "TIFFIN",
      title: "Mera Tiffin Subscription (0% Comm)",
      summary: `${TF.days} Din · ${TF.diet === "nv" ? "Non-Veg" : "Pure Veg"} · ${TF.slot} (${TF.spice}, ${TF.health})`,
      total,
      payMode: "UPI"
    };
    render();
  },
  renewTiffin: (v, k, id) => {
    const s = S.tiffinSubs.find(x => x.id === id);
    if (!s) return;
    TF.diet = s.diet || "veg";
    TF.days = s.days || 15;
    TF.slot = s.slot || "Lunch (12:30 PM)";
    TF.name = s.name;
    TF.phone = s.phone;
    TF.area = s.area;
    TF.addr = s.addr;
    ACT.openTiffinCheckout();
  },
  skipTiffin: (v, k, id) => {
    const s = S.tiffinSubs.find(x => x.id === id);
    if (!s || s.skipToday) return toast("Already skipped today!");
    s.skipToday = true;
    s.remaining = (+s.remaining || 1) + 1;
    save(`Tiffin skipped for ${s.name} (+1d extended)`);
    toast("⏭ Today Skipped! Validity +1 din badh gayi.");
  },
  vacationTiffin: (v, k, id) => {
    const s = S.tiffinSubs.find(x => x.id === id);
    if (!s) return;
    const d = parseInt(prompt("Kitne din ka Vacation Pause chahiye? (3 se 10 din):", "4"), 10);
    if (isNaN(d) || d < 3 || d > 10) return toast("3 se 10 din ke beech enter karein.");
    s.vacationDays = d;
    s.remaining = (+s.remaining || 1) + d;
    save(`Vacation pause ${d}d for ${s.name}`);
    toast(`🏖 Vacation Mode: +${d} din extend ho gaye!`);
  },

  openRest: (v, k, id) => { SELECTED_REST_ID = id; render(); scrollTo({ top: 0, behavior: "smooth" }); },
  backToVendors: () => { SELECTED_REST_ID = null; render(); },
  setFoodCat: v => { FOOD_CAT_FILTER = v; render(); },
  fInc: (v, k, id) => { FOOD_CART[id] = (FOOD_CART[id] || 0) + 1; render(); },
  fDec: (v, k, id) => { FOOD_CART[id] = Math.max(0, (FOOD_CART[id] || 0) - 1); if (!FOOD_CART[id]) delete FOOD_CART[id]; render(); },
  openFoodCheckout: () => {
    const items = Object.entries(FOOD_CART).map(([id, qty]) => {
      const it = S.foodItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    if (!items.length) return;
    PROOF_DATA_URL = "";
    TAB = "checkout"; scrollTo({ top: 0, behavior: "smooth" }); captureMandatoryGps(true);
    CHECKOUT_MODAL = {
      kind: "FOOD",
      title: "Food Shop Checkout",
      summary: items.map(i => `${i.name} ×${i.qty}`).join(", "),
      items,
      total: foodCartTotal(),
      payMode: "UPI"
    };
    render();
  },

  setKiranaCat: v => { KIRANA_CAT_FILTER = v; render(); },
  clearFoodSearch: () => { FOOD_SEARCH = ""; render(); },
  clearKiranaSearch: () => { KIRANA_SEARCH = ""; render(); },
  kInc: (v, k, id) => { KIRANA_CART[id] = (KIRANA_CART[id] || 0) + 1; render(); },
  kDec: (v, k, id) => { KIRANA_CART[id] = Math.max(0, (KIRANA_CART[id] || 0) - 1); if (!KIRANA_CART[id]) delete KIRANA_CART[id]; render(); },
  addKiranaCombo: () => {
    ["kr1", "kr2", "kr3"].forEach(id => { KIRANA_CART[id] = (KIRANA_CART[id] || 0) + 1; });
    render();
    toast("🎉 ₹500+ Free Delivery Combo added!");
  },
  clearKiranaCart: () => { KIRANA_CART = {}; render(); toast("Kirana Cart cleared"); },
  openKiranaCheckout: () => {
    const sub = kiranaSubtotal();
    const minOrd = +S.cfg.kiranaMinOrder || 300;
    if (sub < minOrd) return toast(`⚠️ Kirana minimum order ₹${minOrd} zaroori hai! (${inr(minOrd - sub)} aur add karein)`);
    const fee = kiranaDeliveryFee(sub);
    const items = Object.entries(KIRANA_CART).map(([id, qty]) => {
      const it = S.kiranaItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    PROOF_DATA_URL = "";
    TAB = "checkout"; scrollTo({ top: 0, behavior: "smooth" }); captureMandatoryGps(true);
    CHECKOUT_MODAL = {
      kind: "KIRANA",
      title: "Kirana & Daily Needs Checkout",
      summary: items.map(i => `${i.name} ×${i.qty}`).join(", "),
      items,
      sub,
      deliveryFee: fee,
      total: sub + fee,
      payMode: "UPI"
    };
    render();
  },

  saveCustomerProfile: () => {
    const n = $("#profNameInp")?.value.trim() || "";
    const p = ph($("#profPhoneInp")?.value || "");
    const a = $("#profAreaInp")?.value || "Udala Bus Stand";
    const ad = $("#profAddrInp")?.value.trim() || "";
    if (p && p.length !== 10) return toast("⚠️ Sahi 10-digit mobile number daalein!");
    TF.name = n; TF.phone = p; TF.area = a; TF.addr = ad;
    localStorage.setItem("nu_cname", n);
    localStorage.setItem("nu_cphone", p);
    localStorage.setItem("nu_carea", a);
    localStorage.setItem("nu_caddr", ad);
    if (p.length === 10) ORDER_PHONE_FILTER = p;
    render();
    toast("✅ Profile & Address save ho gaya!");
  },
  clearPhoneFilter: () => { ORDER_PHONE_FILTER = ""; render(); },
  reorder: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodOrders : S.kiranaOrders;
    const o = arr.find(x => x.id === id);
    if (!o) return;
    let added = 0, skipped = 0;
    if (k === "FOOD") {
      o.items.forEach(i => {
        if (S.foodItems.some(x => x.id === i.id && x.stock)) { FOOD_CART[i.id] = (FOOD_CART[i.id] || 0) + i.qty; added++; }
        else skipped++;
      });
      TAB = "food";
    } else {
      o.items.forEach(i => {
        if (S.kiranaItems.some(x => x.id === i.id && x.stock)) { KIRANA_CART[i.id] = (KIRANA_CART[i.id] || 0) + i.qty; added++; }
        else skipped++;
      });
      TAB = "kirana";
    }
    render();
    toast(skipped ? `🔁 ${added} items added (${skipped} out-of-stock skipped)` : "🔁 Sabhi items cart mein add ho gaye!");
  },
  waOrder: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodOrders : S.kiranaOrders;
    const o = arr.find(x => x.id === id);
    if (o) shareOrderWa(o, k);
  },

  captureGps: () => captureMandatoryGps(false),
  setUnverifiedFilter: v => { window._unverifiedOnly = v === "1"; render(); },
  editItemImg: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodItems : S.kiranaItems;
    const it = arr.find(x => x.id === id);
    if (!it) return;
    const url = prompt("Naya Image URL link paste karein (ya blank chhod kar Auto-Link banayein):", it.img || "");
    if (url === null) return;
    it.img = url.trim() ? url.trim() : autoMatch3DImage(it.name, it.cat, it.desc);
    save(`Image link updated for ${it.name}`);
    toast("🖼️ Item image link updated!");
  },
  applyPromo: () => {
    if (!CHECKOUT_MODAL) return;
    const code = ($("#chkPromoInp")?.value || "").trim().toUpperCase();
    const expected = (S.cfg.promoCode || "UDALA20").toUpperCase();
    const baseAmt = CHECKOUT_MODAL.kind === "FOOD" ? foodCartTotal() : CHECKOUT_MODAL.kind === "KIRANA" ? kiranaSubtotal() : calcTiffinPrice(TF.diet, TF.days, TF.slot);
    if (code !== expected) return toast(`⚠️ Invalid Coupon! Try ${expected}`);
    if (baseAmt < (+S.cfg.promoMinOrder || 0)) return toast(`⚠️ Coupon ke liye min ₹${S.cfg.promoMinOrder} order chahiye!`);
    CHECKOUT_MODAL.appliedPromo = code;
    CHECKOUT_MODAL.discountAmt = +S.cfg.promoDiscount || 20;
    render();
    toast(`🎉 Coupon ${code} applied! ₹${CHECKOUT_MODAL.discountAmt} off`);
  },
  editItemFull: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodItems : S.kiranaItems;
    const it = arr.find(x => x.id === id);
    if (!it) return;
    const nn = prompt("Item ka naam edit karein:", it.name);
    if (nn === null || !nn.trim()) return;
    const np = parseFloat(prompt("Naya price ₹ daalein:", it.price));
    if (!(np > 0)) return;
    it.name = nn.trim();
    it.price = np;
    it.img = autoMatch3DImage(it.name, it.cat, it.desc);
    save(`Item edited: ${it.name} -> ₹${np}`);
    toast("✅ Item updated!");
  },
  deleteItem: (v, k, id) => {
    if (!confirm("Kya aap is item ko permanently delete karna chahte hain?")) return;
    if (k === "FOOD") S.foodItems = S.foodItems.filter(x => x.id !== id);
    else S.kiranaItems = S.kiranaItems.filter(x => x.id !== id);
    save(`Item deleted (${k}: ${id})`);
    toast("🗑️ Item deleted!");
  },
  copyFbRules: () => {
    const r = JSON.stringify({ rules: { [NODE]: { ".read": true, ".write": true } } }, null, 2);

    const vCount = (S.vendors || []).length;
    const fCount = (S.foodItems || []).length;
    const kCount = (S.kiranaItems || []).length;

    navigator.clipboard?.writeText(S.cfg.upi).then(() => toast(`📋 UPI ID copied: ${S.cfg.upi}`)).catch(() => toast(`UPI ID: ${S.cfg.upi}`));

  selfCancelOrder: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodOrders : S.kiranaOrders;
    const o = arr.find(x => x.id === id);
    if (!o || o.status !== "Placed") return toast("⚠️ Cooking shuru hone ke baad cancel nahi ho sakta.");
    if (!confirm("Kya aap apna yeh order cancel karna chahte hain?")) return;
    o.status = "Cancelled";
    o.cancelReason = "Cancelled by customer before prep";
    save(`Customer cancelled ${k} Order ${id}`);
    toast("❌ Order Cancelled");
  },
  deliverWithPin: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodOrders : S.kiranaOrders;
    const o = arr.find(x => x.id === id);
    if (!o) return;
    const entered = prompt(`Customer se 4-Digit Delivery Handover PIN poochhein (Hint: ${o.deliveryOtp || "1234"}):`);
    if (entered === null) return;
    if (o.deliveryOtp && entered.trim() !== String(o.deliveryOtp)) {
      return toast("❌ Galat Delivery PIN! Customer ke app par dikh raha 4-digit PIN daalein.");
    }
    o.status = "Delivered";
    save(`Rider delivered ${k} Order ${id} with PIN verification`);

  },
  rolloverTiffinDay: () => {
    if (!confirm("Naya Tiffin din shuru karein? (Aaj delivered tiffins ka 1 din kam hoga aur skip flags reset honge)")) return;
    (S.tiffinSubs || []).forEach(s => {
      if (s.deliveredToday && (+s.remaining || 0) > 0) s.remaining = Math.max(0, (+s.remaining) - 1);
      s.deliveredToday = false;
      s.skipToday = false;
      s.dabbaBack = false;
    });
    save("Started New Tiffin Day (remaining days updated & daily flags reset)");
    toast("🌅 Naya Tiffin din shuru ho gaya!");
  },
  addNewVendor: () => {
    const name = $("#newVenName")?.value.trim();
    const type = $("#newVenType")?.value || "FOOD";
    const area = $("#newVenArea")?.value.trim() || "Market Square";
    const pin = String($("#newVenPin")?.value || "").replace(/\D/g, "");
    const cuisine = $("#newVenCuisine")?.value.trim() || "Fresh Local Specials";
    if (!name || pin.length !== 4) return toast("⚠️ Vendor ka naam aur 4-digit PIN daalein!");
    const id = uid("v_");
    S.vendors.push({
      id, name, type, isSelf: false, cuisine, area, rating: "4.7", eta: "30-40 min",
      status: "Open", cover: type === "FOOD" ? IMG.thali : IMG.kirana, settledPaid: 0
    });
    S.cfg.vendorPins = S.cfg.vendorPins || { ...PINS.vendors };
    S.cfg.vendorPins[id] = pin;
    save(`Owner added new ${type} vendor: ${name} (PIN: ${pin})`);
    toast(`🏪 ${name} added! PIN: ${pin}`);
  },
  ownerAddItemForVendor: (v, k, id) => {
    const ven = S.vendors.find(x => x.id === id);
    if (!ven) return;
    const name = prompt(`Naya item naam (${ven.name}):`);
    if (!name || !name.trim()) return;
    const price = parseFloat(prompt("Item ka Price ₹ daalein:", "100"));
    if (!(price > 0)) return;
    const cat = ven.type === "FOOD" ? (prompt("Category (Breakfast / Thali / Meals / Biryani / Bakery):", "Meals") || "Meals") : (prompt("Category (HUL / Staples / Dairy):", "Staples") || "Staples");

  addUdhaar: () => {
    const name = $("#udhName")?.value.trim();
    const phone = ph($("#udhPhone")?.value || "");
    const amt = +$("#udhAmt")?.value;
    if (!name || !(amt > 0)) return toast("⚠️ Customer naam aur ₹ amount daalein!");
    S.udhaarList = S.udhaarList || [];
    S.udhaarList.unshift({ id: uid("ud"), name, phone, amt });

    save("Udhaar entry marked paid & cleared");
    toast("✅ Udhaar cleared!");
  },
  exportCsv: () => {
    const rows = [["Category", "OrderID", "Date", "Customer", "Phone", "Area", "Total", "PayMode", "UTR", "Status"]];
    (S.foodOrders || []).forEach(o => rows.push(["FOOD", o.id, o.date, o.name, o.phone, o.area, o.total, o.payMode, o.utr || "", o.status]));
    (S.kiranaOrders || []).forEach(o => rows.push(["KIRANA", o.id, o.date, o.name, o.phone, o.area, o.total, o.payMode, o.utr || "", o.status]));
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `namaste-udala-orders-${todayIso()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast("📊 CSV file downloaded!");

  confirmCheckout: () => {
    if (!CHECKOUT_MODAL) return;
    if (window._orderLock && Date.now() - window._orderLock < 3000) return toast("⏳ Order process ho raha hai, kripya wait karein...");
    window._orderLock = Date.now();
    if (!USER_GPS.ok || !USER_GPS.lat || !USER_GPS.lng) {
      captureMandatoryGps(false);
      return toast("⚠️ Order place karne ke liye Live GPS Location capture karna mandatory hai!");
    }
    if (!TF.name.trim() || ph(TF.phone).length !== 10 || !TF.addr.trim()) {
      return toast("⚠️ Naam, 10-digit Mobile aur Address zaroor bharein!");
    }
    if (CHECKOUT_MODAL.items) {
      const closedVen = CHECKOUT_MODAL.items
        .map(i => S.vendors.find(v => v.id === i.vendorId))
        .find(v => v && v.status === "Closed");
      if (closedVen) return toast(`⚠️ ${closedVen.name} abhi Closed hai! Kripya uske items hatayein.`);
    }
    const cleanPhone = ph(TF.phone);
    localStorage.setItem("nu_cname", TF.name.trim());
    localStorage.setItem("nu_cphone", cleanPhone);
    localStorage.setItem("nu_carea", TF.area);
    localStorage.setItem("nu_caddr", TF.addr.trim());
    ORDER_PHONE_FILTER = cleanPhone;

    const payMode = CHECKOUT_MODAL.payMode;
    let utr = "";
    if (payMode === "UPI") {
      const check = validateStrictUTR($("#chkUtrInp")?.value, S.usedUtrs);
      if (!check.ok) return toast(check.msg);
      utr = check.utr;
      if (PROOF_DATA_URL) {
        const h = hashDataUrl(PROOF_DATA_URL);
        if ((S.usedImgHashes || []).includes(h)) return toast("⚠️ Duplicate payment screenshot detected!");
        S.usedImgHashes.push(h);
      }
      S.usedUtrs.push(utr);
    }

    const note = TF.note.trim();
    const delSlot = $("#chkDelSlot")?.value || "ASAP (30-45 mins)";
    if (CHECKOUT_MODAL.kind === "TIFFIN") {
      const newId = "TS-" + Math.floor(1000 + Math.random() * 9000);
      S.tiffinSubs.unshift({
        id: newId,
        name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(),
        diet: TF.diet, days: TF.days, remaining: TF.days, slot: TF.slot, spice: TF.spice, health: TF.health,
        price: CHECKOUT_MODAL.total, paid: payMode === "UPI" ? 1 : 0, vStat: payMode === "UPI" ? "ok" : "cod",
        utr, gps: { lat: USER_GPS.lat, lng: USER_GPS.lng, acc: USER_GPS.acc }, skipToday: false, vacationDays: 0, deliveredToday: false, dabbaBack: false
      });
      LAST_PLACED_ORDER = {
        kind: "TIFFIN", id: newId, name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(),
        itemsSummary: CHECKOUT_MODAL.summary, total: CHECKOUT_MODAL.total, payMode, utr
      };
      CHECKOUT_MODAL = null;
      TAB = "success"; scrollTo({ top: 0, behavior: "smooth" });
      save(`New Tiffin Subscription (${TF.days}d) by ${TF.name.trim()}`);
      toast("🎉 Mera Tiffin Subscription Activated!");
    } else if (CHECKOUT_MODAL.kind === "FOOD") {
      const newId = "FD-" + Math.floor(10000 + Math.random() * 90000);
      const delOtp = String(Math.floor(1000 + Math.random() * 9000));
      S.foodOrders.push({
        id: newId,
        deliveryOtp: delOtp,
        date: todayIso(), name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(),
        items: CHECKOUT_MODAL.items, total: CHECKOUT_MODAL.total, note, delSlot, gps: { lat: USER_GPS.lat, lng: USER_GPS.lng, acc: USER_GPS.acc },
        payMode, utr, utrVerified: false, status: "Placed"
      });
      LAST_PLACED_ORDER = {
        kind: "FOOD", id: newId, name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(),
        itemsSummary: CHECKOUT_MODAL.summary, total: CHECKOUT_MODAL.total, payMode, utr
      };
      FOOD_CART = {};
      TF.note = "";
      CHECKOUT_MODAL = null;
      TAB = "success"; scrollTo({ top: 0, behavior: "smooth" });
      save(`New Food Order placed by ${TF.name.trim()}`);
      toast("🍛 Food Order Placed!");
    } else if (CHECKOUT_MODAL.kind === "KIRANA") {
      const newId = "KR-" + Math.floor(10000 + Math.random() * 90000);
      const delOtp = String(Math.floor(1000 + Math.random() * 9000));
      S.kiranaOrders.push({
        id: newId,
        deliveryOtp: delOtp,
        date: todayIso(), name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(),
        items: CHECKOUT_MODAL.items, sub: CHECKOUT_MODAL.sub, deliveryFee: CHECKOUT_MODAL.deliveryFee, total: CHECKOUT_MODAL.total, note, delSlot, gps: { lat: USER_GPS.lat, lng: USER_GPS.lng, acc: USER_GPS.acc },
        payMode, utr, utrVerified: false, status: "Placed"
      });
      LAST_PLACED_ORDER = {
        kind: "KIRANA", id: newId, name: TF.name.trim(), phone: cleanPhone, area: TF.area, addr: TF.addr.trim(),
        itemsSummary: CHECKOUT_MODAL.summary, total: CHECKOUT_MODAL.total, payMode, utr
      };
      KIRANA_CART = {};
      TF.note = "";
      CHECKOUT_MODAL = null;
      TAB = "success"; scrollTo({ top: 0, behavior: "smooth" });
      save(`New Kirana Order placed by ${TF.name.trim()}`);
      toast("🛒 Kirana & Daily Needs Order Placed!");
    }
  },

      toast(`Status updated: ${st}`);
    }

  cancelOrder: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodOrders : S.kiranaOrders;
    const o = arr.find(x => x.id === id);
    if (!o) return;
    const reason = prompt("Cancel / Reject ka reason likhein (e.g., Item Out of Stock / Shop Busy):", "Item out of stock");
    if (reason === null) return;
    o.status = "Cancelled";
    o.cancelReason = reason.trim() || "Cancelled by operator";
    save(`${k} Order ${id} Cancelled: ${o.cancelReason}`);
    toast("❌ Order Cancelled with reason");
  },
  editVendorProfile: (v, k, id) => {
    const ven = S.vendors.find(x => x.id === id);
    if (!ven) return;
    const newName = prompt("Vendor ka naya naam daalein:", ven.name);
    if (newName === null || !newName.trim()) return;
    const newArea = prompt("Vendor ka Area / Locality daalein:", ven.area);
    const newCuisine = prompt("Cuisine / Description daalein:", ven.cuisine);
    ven.name = newName.trim();
    if (newArea && newArea.trim()) ven.area = newArea.trim();
    if (newCuisine && newCuisine.trim()) ven.cuisine = newCuisine.trim();
    save(`Vendor updated: ${ven.name} (${ven.area})`);
    toast("✅ Vendor details updated!");
  },
  toggleDabba: (v, k, id) => {
    const s = S.tiffinSubs.find(x => x.id === id);
    if (s) { s.dabbaBack = !s.dabbaBack; save(`Dabba status updated for ${s.name}`); }
  },
  toggleTiffinDlv: (v, k, id) => {
    const s = S.tiffinSubs.find(x => x.id === id);
    if (s) { s.deliveredToday = !s.deliveredToday; save(`Tiffin delivery updated for ${s.name}`); }
  },
  submitFuel: () => {
    const s = parseFloat($("#odoStart")?.value), e = parseFloat($("#odoEnd")?.value), rs = parseFloat($("#fuelRs")?.value);
    if (isNaN(s) || isNaN(e) || e <= s || isNaN(rs) || rs <= 0) return toast("Sahi Start/End KM aur ₹ daalein");
    const km = +(e - s).toFixed(1);
    const drops = (S.foodOrders.filter(o => o.status === "Delivered").length + S.kiranaOrders.filter(o => o.status === "Delivered").length);
    const estKm = Math.max(2, drops * 2.4);
    const flag = (km > estKm * 1.5 || rs > estKm * S.cfg.perKmFuelRate * 1.35) ? "⚠️ SUSPICIOUS OVER-CLAIM" : "✅ Route Matched";
    S.fuelLogs.unshift({ id: uid("fl"), km, rs, flag, approved: false });
    save(`Fuel claim submitted: ${km}km / ₹${rs} (${flag})`);
    toast("Fuel log submitted!");
  },
  vendorStatus: (v, k, id) => {
    const ven = S.vendors.find(x => x.id === id);
    if (ven) { ven.status = v; save(`Vendor ${ven.name} status -> ${v}`); }
  },
  toggleStock: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodItems : S.kiranaItems;
    const it = arr.find(x => x.id === id);
    if (it) { it.stock = it.stock ? 0 : 1; save(`Stock toggled: ${it.name}`); }
  },
  addVendorItem: (v, k, id) => {
    const ven = S.vendors.find(x => x.id === id);
    if (!ven) return;
    const name = $("#venNewName")?.value.trim();
    const price = +$("#venNewPrice")?.value;
    const cat = $("#venNewCat")?.value || (ven.type === "FOOD" ? "Meals" : "Staples");
    const desc = $("#venNewDesc")?.value.trim() || "Fresh local item";
    const customImg = $("#venNewImg")?.value.trim();
    if (!name || !(price > 0)) return toast("⚠️ Item ka naam aur sahi price ₹ daalein!");
    const img = customImg || autoMatch3DImage(name, cat, desc);

      S.kiranaItems.unshift({ id: uid("kr"), vendorId: ven.id, cat, name, price, stock: 1, img, desc });

  editItemPrice: (v, k, id) => {
    const arr = k === "FOOD" ? S.foodItems : S.kiranaItems;
    const it = arr.find(x => x.id === id);
    if (!it) return;

  },

    toast(`✅ Rider COD Cash ${inr(amt)} Jama ho gaya!`);

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (btn && ACT[btn.dataset.act]) {
    if (btn.tagName !== "A") e.preventDefault();
    ACT[btn.dataset.act](btn.dataset.v, btn.dataset.k, btn.dataset.id, e);
  }
});

document.addEventListener("input", e => {
  if (e.target.dataset.tf) TF[e.target.dataset.tf] = e.target.value;
  if (e.target.id === "foodSearchInp") {
    FOOD_SEARCH = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#foodSearchInp");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
  if (e.target.id === "kiranaSearchInp") {
    KIRANA_SEARCH = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#kiranaSearchInp");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
  if (e.target.id === "ordPhoneFilterInp") {
    ORDER_PHONE_FILTER = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = $("#ordPhoneFilterInp");
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});

document.addEventListener("change", e => {
  if (e.target.dataset.tf) { TF[e.target.dataset.tf] = e.target.value; render(); }
});

$("#proofInput").addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => { PROOF_DATA_URL = ev.target.result; render(); toast("Screenshot attached ✓"); };
  r.readAsDataURL(f);
});


/* ==================== SMOOTH 3D TILT INTERACTION ==================== */
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const card = e.target.closest(".pcard, .hero");
  if (!card) return;
  const r = card.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  card.style.transform = `perspective(700px) rotateX(${(-y * 6).toFixed(1)}deg) rotateY(${(x * 7).toFixed(1)}deg) translateY(-4px)`;
});
document.addEventListener("pointerout", e => {
  const card = e.target.closest(".pcard, .hero");
  if (card && !card.contains(e.relatedTarget)) {
    card.style.transform = "";
  }
});


$("#importJsonInput").addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (!parsed || !parsed.cfg) return toast("⚠️ Invalid backup file!");
      S = { ...defaultState(), ...parsed, cfg: { ...defaultState().cfg, ...parsed.cfg } };
      save("Restored state from JSON backup");
      toast("✅ Backup successfully restored!");
    } catch (err) {
      toast("⚠️ JSON file parse error!");
    }
  };
  r.readAsText(f);
});


/* ==================== RESILIENT IMAGE FALLBACK (ZERO BROKEN IMAGES) ==================== */
document.addEventListener("error", e => {
  if (e.target && e.target.tagName === "IMG" && !e.target.dataset.fbDone) {
    e.target.dataset.fbDone = "1";
    e.target.src = REAL_IMG.thali;
  }
}, true);


normalizeAllImages();

render();
</script>
</body>
</html>
