<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍱 Namaste Udala — Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
<!-- ✅ Compat SDK: Local + Vercel dono par chalega -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
:root{--o:#FF6B35;--o2:#E85D04;--neon:#06D6A0;--neon2:#22D3EE;--gold:#FCD34D;--bad:#EF4444;--warn:#F59E0B;--info:#3B82F6;--purple:#7C3AED;--pink:#EC4899}
[data-theme="dark"]{--bg:#050812;--text:#E8ECF4;--muted:#8B93A7;--card:rgba(15,20,35,.65);--line:rgba(255,255,255,.08);--glass:rgba(10,14,25,.78);--inp:rgba(255,255,255,.05);--h3:var(--neon)}
[data-theme="light"]{--bg:#F8FAFC;--text:#0F172A;--muted:#64748B;--card:#fff;--line:#E2E8F0;--glass:rgba(255,255,255,.92);--inp:#fff;--h3:#065F46}
*{box-sizing:border-box;font-family:'Poppins',sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:100px;min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s;position:relative}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;animation:drift 18s ease-in-out infinite}
.b1{width:480px;height:480px;background:var(--o);top:-180px;left:-180px}
.b2{width:420px;height:420px;background:var(--neon);bottom:-150px;right:-150px;animation-delay:-6s}
header{position:relative;z-index:2;background:linear-gradient(135deg,rgba(27,67,50,.94),rgba(7,11,20,.92));backdrop-filter:blur(24px);color:#fff;padding:22px 20px 48px;border-radius:0 0 32px 32px;border-bottom:1px solid rgba(6,214,160,.3);box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer}
header .logo{font-size:11px;letter-spacing:3px;font-weight:800;color:var(--gold);text-shadow:0 0 12px rgba(252,211,77,.7)}
header h1{font-size:26px;font-weight:900;margin-top:4px;background:linear-gradient(90deg,#fff,var(--neon),var(--neon2));-webkit-background-clip:text;background-clip:text;color:transparent}
header .tagline{font-size:13px;opacity:.9;margin-top:4px}
#v{padding:0 16px;margin-top:-24px;position:relative;z-index:1}
.card{background:var(--card);backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(0,0,0,.35);animation:rise .5s ease both;position:relative;overflow:hidden}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card h3{color:var(--h3);font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.s{font-size:12.5px;color:var(--muted);line-height:1.5}
.btn{padding:13px;border-radius:14px;border:none;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:8px;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;transition:transform .1s;min-height:44px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.g{background:rgba(6,214,160,.14);color:var(--neon);border:1px solid rgba(6,214,160,.45)}
.btn.r{background:rgba(239,68,68,.14);color:#F87171;border:1px solid rgba(239,68,68,.45)}
.btn.b{background:rgba(59,130,246,.16);color:#93C5FD;border:1px solid rgba(59,130,246,.5)}
.btn.sm{padding:8px 14px;font-size:12px;width:auto;margin:0;border-radius:10px;min-height:36px}
input,select,textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;margin:5px 0 10px;font-size:16px;background:var(--inp);color:var(--text);font-family:inherit;min-height:44px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.nav{position:fixed;bottom:10px;left:10px;right:10px;background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:22px;display:flex;justify-content:space-around;padding:8px 4px;z-index:100;box-shadow:0 10px 40px rgba(0,0,0,.55)}
.nav div{text-align:center;font-size:10px;font-weight:700;color:var(--muted);flex:1;cursor:pointer;padding:6px 4px;border-radius:14px}
.nav div.on{color:var(--o);background:rgba(255,107,53,.12)}
.nav div span{font-size:21px;display:block;margin-bottom:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge.active{background:rgba(6,214,160,.15);color:var(--neon)}
.badge.pending{background:rgba(245,158,11,.15);color:var(--warn)}
.toast{position:fixed;bottom:170px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(15,20,35,.95);color:#fff;padding:12px 24px;border-radius:50px;font-weight:700;z-index:1000;opacity:0;transition:all .3s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.fab{position:fixed;right:16px;bottom:160px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;z-index:99}
.theme-toggle{position:fixed;top:16px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;z-index:101}
.seg{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--inp);color:var(--text);font-weight:700;font-size:13px;cursor:pointer;min-height:44px}
.seg button.on{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:16px;padding:14px;text-align:center;color:#fff}
.stat .v{font-size:22px;font-weight:900}
.pbar{width:100%;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.pfill{height:100%;background:var(--neon)}
.grow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-content{background:var(--card);border:1px solid var(--line);border-radius:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;color:var(--text)}
.confetti{position:fixed;width:10px;height:10px;background:var(--neon);animation:confettiFall 3s linear forwards;z-index:9999;pointer-events:none}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg)}100%{transform:translateY(100vh) rotate(720deg)}}
.add-btn-zomato{width:100%;padding:8px;border:1px solid var(--o);background:rgba(255,107,53,0.1);color:var(--o);font-weight:800;font-size:13px;border-radius:8px;cursor:pointer}
.cartbar-premium{background:linear-gradient(135deg,#1B4332,#0F2C21);color:#fff;position:fixed;bottom:80px;left:12px;right:12px;padding:12px 16px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;z-index:99}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div></div>
<button class="theme-toggle" id="themeToggle">☀️</button>
<header id="mainHeader"><div class="logo">NAMASTE UDALA</div><h1 id="ht">Aaj ka Plan</h1><div class="tagline">Ghar jaisa khana</div></header>
<div id="v"></div>
<a class="fab" href="https://wa.me/919583937047" target="_blank">💬</a>
<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>
<input type="file" id="restoreFile" accept=".json" style="display:none">
<div id="modalRoot"></div>

<script>
// ✅ Compat Mode Initialization (No CORS issues, works on Double-Click)
const firebaseConfig = { databaseURL: "https://namaste-udala-default-rtdb.firebaseio.com" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// Silent Auth
auth.signInAnonymously().catch(e => console.warn("Auth skipped"));

const CONFIG={whatsapp:'919583937047',ownerPin:'4821',delivPin:'7788'};
const PRICING={veg:{7:749,15:1499,30:2899},nv:{7:949,15:1849,30:3599}};
const STORAGE_KEY='udala_final_v1';
const COUPONS_DEFAULT={'UDALA50':{type:'flat',value:50,min:299,expiry:'2026-12-31',maxUses:100,usedCount:0}};
const KIRANA_PRESET=['Doodh 500 ml','Atta 1 kg','Chawal 1 kg','Dal 1 kg','Tel 1 L','Sabun'];

const esc = (s) => window.DOMPurify ? DOMPurify.sanitize(String(s==null?'':s)) : String(s==null?'':s);
const IMG={thali:'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=400',grocery:'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400',kids1:'https://images.unsplash.com/photo-1565538810699-0e7a7d433f66?w=800',av1:'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200'};
const $=s=>document.querySelector(s);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayStr=()=>iso(new Date());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const showToast=(m,t='success')=>{const e=$('#toast');e.textContent=m;e.className='toast '+t+' show';setTimeout(()=>e.classList.remove('show'),2800)};
const generateId=()=>Date.now()+'_'+Math.random().toString(36).slice(2,8);
const randAvatar=()=>IMG.av1;

const SEED=[
{n:'Doodh 500 ml',p:30,c:'Dairy',img:IMG.grocery},{n:'Atta 1 kg',p:50,c:'Kirana',img:IMG.grocery},
{n:'Special Veg Thali',p:120,c:'Thali',img:IMG.thali,rating:4.6},
{n:'Paneer Butter Masala',p:140,c:'Curry',img:IMG.thali,rating:4.5},
{n:'Chicken Biryani',p:150,c:'Biryani',nv:1,img:IMG.thali,rating:4.8}
].map((a,i)=>({id:generateId(),...a,kind:a.img===IMG.thali?'food':'grocery',s:1}));

let S=null, ME=null, tab='plan', C={}, OK=0, OSEC='pay', SHOPMODE='food', FCAT='Sab', SQ='', CART_COUPON='', F={type:'veg',days:'30',name:'',phone:'',addr:'',map:'',slot:'lunch'};
try{ME=JSON.parse(localStorage.getItem('udme')||'null');C=JSON.parse(localStorage.getItem('ud_cart')||'{}');OK=sessionStorage.getItem('udok')?1:0}catch(e){}

const save=(imm=false)=>{
    if(!S) return;
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S));db.ref('namaste_udala_data').set(S).catch(e=>{});render();}catch(e){}
};
const saveCart=()=>{try{localStorage.setItem('ud_cart',JSON.stringify(C))}catch(e){}};

const calcCart=()=>{let sub=0,cnt=0;Object.entries(C).forEach(([k,q])=>{const p=(S.prod||[]).find(x=>x.id==k);if(p&&q>0){sub+=p.p*q;cnt+=q}});let disc=0;if(CART_COUPON&&S.coupons[CART_COUPON]){const cp=S.coupons[CART_COUPON];if(sub>=cp.min)disc=cp.value;}return {sub,disc,total:sub-disc,cnt}};

const showModal=(h)=>{$('#modalRoot').innerHTML=`<div class="modal" data-a="closeModal"><div class="modal-content">${h}</div></div>`};
const closeModal=()=>{$('#modalRoot').innerHTML=''};

const VIEWS={
plan:()=>{
    let h=`<div class="card"><h3>🍱 Namaste Udala</h3><p class="s">Premium Tiffin & Kirana</p></div>`;
    if(ME){h+=`<div class="card"><h3>👤 ${esc(ME.name)}</h3><button class="btn sm b" data-a="showHistory">📜 History</button> <button class="btn sm r" data-a="logout">Logout</button></div>`;}
    else{h+=`<div class="card"><h3>👤 Login</h3><input id="lname" placeholder="Naam"><input id="lphone" placeholder="Phone"><button class="btn g" data-a="login">Login</button></div>`;}
    h+=`<div class="card"><h3>🍽️ New Plan</h3>
    <div class="seg"><button class="${F.type==='veg'?'on':''}" data-a="set" data-k="type" data-v="veg">🟢 Veg</button><button class="${F.type==='nv'?'on':''}" data-a="set" data-k="type" data-v="nv">🔴 NV</button></div>
    <input data-f="name" placeholder="Naam" value="${esc(F.name)}"><input data-f="phone" placeholder="Phone" value="${esc(F.phone)}">
    <button class="btn g" data-a="gps">📍 GPS Location</button>
    <button class="btn" data-a="joinPaid">💳 Buy Plan (${inr(PRICING[F.type][F.days])})</button>
    <button class="btn g" data-a="joinTrial">🎁 Free Trial</button></div>`;
    return h;
},
shop:()=>{
    const cart=calcCart();
    let h=`<div class="card"><h3>🛍️ Shop</h3><input id="sq" placeholder="Search..." value="${esc(SQ)}"></div>`;
    const items=(S.prod||[]).filter(p=>SHOPMODE==='food'?p.kind==='food':p.kind!=='food');
    h+=`<div class="grid2">`;
    items.forEach(p=>{
        const q=C[p.id]||0;
        h+=`<div class="card"><b>${esc(p.n)}</b><div class="s">${inr(p.p)}</div>${q>0?`<div class="row"><button class="btn sm r" data-a="dec" data-id="${p.id}">-</button><b>${q}</b><button class="btn sm g" data-a="inc" data-id="${p.id}">+</button></div>`:`<button class="add-btn-zomato" data-a="inc" data-id="${p.id}">ADD</button>`}</div>`;
    });
    h+=`</div>`;
    if(cart.cnt>0)h+=`<div class="cartbar-premium"><div><b>${cart.cnt} Items</b><br>${inr(cart.total)}</div><button class="btn sm" data-a="goc">Checkout</button></div>`;
    h+=`<div class="card" id="co"><h3>📦 Checkout</h3><input data-f="addr" placeholder="Address" value="${esc(F.addr)}"><button class="btn" data-a="order">✅ Order Now</button></div>`;
    return h;
},
kirana:()=>VIEWS.shop(),
kitchen:()=>`<div class="card"><h3>🔒 Kitchen (PIN Required)</h3></div>`,
delivery:()=>`<div class="card"><h3>🔒 Delivery (PIN Required)</h3></div>`,
owner:()=>`<div class="card"><h3>🔒 Owner Panel</h3><p class="s">Tap Header 5 times</p></div>`
};

const ACTIONS={
    tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const x=prompt('PIN:');if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1')}else return;}tab=v;render();},
    set:(v,k)=>{F[k]=v;render();},
    inc:(v,k,id)=>{C[id]=(C[id]||0)+1;saveCart();render();},
    dec:(v,k,id)=>{C[id]--;if(C[id]<=0)delete C[id];saveCart();render();},
    goc:()=>{$('#co').scrollIntoView({behavior:'smooth'});},
    login:()=>{const n=$('#lname').value,p=$('#lphone').value;if(n&&p.length===10){ME={name:n,phone:p};localStorage.setItem('udme',JSON.stringify(ME));F.name=n;F.phone=p;render();showToast('✅ Login');}},
    logout:()=>{ME=null;localStorage.removeItem('udme');render();},
    gps:()=>{navigator.geolocation.getCurrentPosition(p=>{F.map='locked';showToast('✅ GPS Locked');render();},()=>showToast('❌ Allow GPS','error'));},
    joinTrial:()=>{if(!F.name||!F.phone||!F.map)return showToast('❌ Fill details & GPS','error');S.subs.push({id:generateId(),name:F.name,phone:F.phone,addr:F.addr,type:F.type,days:1,status:'trial',start:todayStr()});save(true);showToast('🎁 Trial Active');showConfetti();},
    joinPaid:()=>{const u=prompt('UTR Number?');if(!u)return;S.subs.push({id:generateId(),name:F.name,phone:F.phone,addr:F.addr,type:F.type,days:30,status:'pending',utr:u,start:todayStr()});save(true);showToast('⏳ Pending Verification');},
    order:()=>{if(!F.addr||!F.map)return showToast('❌ Address & GPS needed','error');const cart=calcCart();S.orders.push({id:generateId(),name:F.name,phone:F.phone,addr:F.addr,items:Object.entries(C).map(([k,q])=>({n:(S.prod.find(p=>p.id==k).n),q})),total:cart.total,status:'pending',date:todayStr()});C={};saveCart();save(true);showToast('✅ Order Placed');showConfetti();tab='plan';render();},
    showHistory:()=>{const myOrders=(S.orders||[]).filter(o=>o.phone===ME.phone);showModal(`<h3>📜 History</h3>${myOrders.map(o=>`<div class="card"><b>#${o.id.slice(-4)}</b> - ${inr(o.total)} <span class="badge ${o.status}">${o.status}</span></div>`).join('')}<button class="btn r" data-a="closeModal">Close</button>`);},
    closeModal:()=>closeModal()
};

const showConfetti=()=>{for(let i=0;i<30;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['var(--neon)','var(--o)'][Math.floor(Math.random()*2)];document.body.appendChild(c);setTimeout(()=>c.remove(),3000);}};

document.addEventListener('click',e=>{if(e.target.classList.contains('modal')){closeModal();return}const b=e.target.closest('[data-a]');if(b&&ACTIONS[b.dataset.a])ACTIONS[b.dataset.a](b.dataset.v,b.dataset.k,b.dataset.id);});
document.addEventListener('input',e=>{if(e.target.dataset.f){F[e.target.dataset.f]=e.target.value;}if(e.target.id==='sq'){SQ=e.target.value;render();}});
$('#mainHeader').addEventListener('click',()=>{let t=(window.tap||0)+1;window.tap=t;if(t>=5){window.tap=0;const p=prompt('Owner PIN:');if(p===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();}}});

function render(){
    if(!S){$('#v').innerHTML=`<div class="card"><h3>☁️ Loading...</h3></div>`;return;}
    $('#v').innerHTML=VIEWS[tab]();
    $('#nav').innerHTML=[['plan','🍱','Plan'],['shop','🛍️','Shop'],['kirana','🛒','Kirana'],['kitchen','👨‍🍳','Kitchen'],['delivery','🛵','Delivery'],['owner','👤','Owner']].map(x=>`<div class="${x[0]===tab?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
}

// ✅ Data Loading Logic (Compat SDK)
function init(){
    db.ref('namaste_udala_data').once('value').then(snap=>{
        if(snap.exists()){S=snap.val();}
        else{S={v:1,prod:SEED,subs:[],orders:[],pays:[],meals:{},done:{},coupons:COUPONS_DEFAULT,wallet:{},walletLedger:[]};}
        render();
    }).catch(err=>{
        console.warn("FB Error, using local",err);
        try{S=JSON.parse(localStorage.getItem(STORAGE_KEY))||{v:1,prod:SEED,subs:[],orders:[],coupons:COUPONS_DEFAULT};}catch(e){S={prod:SEED};}
        render();
    });
    // Live Sync
    db.ref('namaste_udala_data').on('value',snap=>{if(snap.exists()){S=snap.val();render();}});
}

init();
setTimeout(()=>showToast('✨ App Ready!'),500);
</script>
</body>
</html>
