
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Namaste Udala — Mera Tiffin · Multi-Vendor Food · Sauda & Daily Needs</title>
<meta name="theme-color" content="#113221" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Namaste Udala" />
<link id="pwaManifestLink" rel="manifest" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fff6e3;
    --sf: #ffffff;
    --sf2: #efe9dc;
    --ink: #17110d;
    --mu: #5f6d65;
    --ln: #17110d;
    --o: #ff2d8a;
    --o2: #be123c;
    --g: #113221;
    --g2: #15803d;
    --amb: #d97706;
    --lime: #b8ff2c;
    --serif: 'Fraunces', Georgia, serif;
    --hand: 'Caveat', cursive;
    --sh-card: 4px 4px 0 var(--ink);
    --sh-3d-o: 3px 3px 0 var(--ink), 0 10px 20px rgba(255,45,138,.25);
    --sh-3d-g: 3px 3px 0 var(--ink), 0 10px 20px rgba(17,50,33,.25);
  }
  [data-theme=dark] {
    --bg: #0b120e; --sf: #142019; --sf2: #1b2a21; --ink: #f3efe6; --mu: #9ca89f; --ln: #26382d;
    --sh-card: 4px 4px 0 #050907, 0 16px 32px -8px rgba(0,0,0,.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(circle at 12% 4%, rgba(255,45,138,.08), transparent 36%),
                radial-gradient(circle at 88% 92%, rgba(184,255,44,.12), transparent 36%),
                var(--bg);
    color: var(--ink);
    padding-bottom: 145px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  img { display: block; object-fit: cover; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 60;
    background:
      radial-gradient(circle at 15% 20%, rgba(251,191,36,.18), transparent 42%),
      radial-gradient(circle at 88% 80%, rgba(255,45,138,.24), transparent 46%),
      linear-gradient(135deg, #0b2217 0%, #153b28 55%, #2b0f1b 100%);
    backdrop-filter: blur(12px);
    color: #fff; padding: 11px 14px;
    border-bottom: 2px solid var(--ink);
    box-shadow: 0 8px 24px rgba(10,28,19,.35), inset 0 1px 0 rgba(255,255,255,.18);
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(145deg, var(--o), var(--o2));
    border: 2px solid var(--ink);
    display: grid; place-items: center; font-family: var(--serif); font-weight: 800; font-size: 16px; color: #fff;
    box-shadow: 3px 3px 0 var(--ink); cursor: pointer; flex: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .logo:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .brand { flex: 1; min-width: 0; }
  .brand small { display: block; color: var(--lime); font-size: 9px; letter-spacing: 1.4px; font-weight: 800; }
  .brand h1 { font-family: var(--serif); font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .role-strip { display: none !important; }
  main { max-width: 720px; margin: 0 auto; padding: 14px; }

  /* Neo-Brutalist Cards with Alternating Tilt */
  .card {
    background: var(--sf); border: 2px solid var(--ln); border-radius: 22px;
    padding: 15px; margin-bottom: 16px; box-shadow: var(--sh-card);
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
  }
  .card:nth-of-type(odd) { transform: rotate(-0.35deg); }
  .card:nth-of-type(even) { transform: rotate(0.35deg); }
  .card:hover, .card:focus-within { transform: rotate(0deg) translateY(-2px); }
  .card h3 {
    font-family: var(--serif); font-size: 16px; font-weight: 800; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; border: 1.5px solid var(--ink); }
  .p-green { background: var(--lime); color: #17110d; }
  .p-red { background: #ffe4e6; color: #9f1239; }
  .p-amber { background: #fef3c7; color: #92400e; }
  .p-blue { background: #dbeafe; color: #1e40af; }
  .p-dark { background: #0f172a; color: #fff; }

  /* Scroll-Driven Reactive Hero Stage + Rotating SVG Stamp Badge */
  .hero {
    position: relative; border-radius: 24px; padding: 20px 18px; margin: 12px 0 22px; color: #fff;
    border: 2px solid var(--ink);
    overflow: visible; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    --e: 0;
    box-shadow: 5px 5px 0 var(--ink), 0 18px 34px -8px rgba(17,50,33,.35);
    transition: transform .2s ease;
  }
  .hero.tiffin-bg { background: color-mix(in srgb, #be123c calc(var(--e) * 100%), #881337); }
  .hero.food-bg { background: color-mix(in srgb, #ff2d8a calc(var(--e) * 45%), #78350f); }
  .hero.kirana-bg { background: color-mix(in srgb, #15803d calc(var(--e) * 100%), #064e3b); }
  .hero-copy {
    transform: translateY(calc(var(--e) * -6px));
    transition: transform .15s linear;
  }
  .hero h2 { font-family: var(--serif); font-size: 20px; line-height: 1.15; margin: 6px 0; text-shadow: 1px 2px 0 rgba(0,0,0,.35); }
  .hero p { font-size: 11.5px; opacity: .95; }
  .hero-pop-wrap { position: relative; flex: none; }
  .hero-pop {
    width: 102px; height: 102px; border-radius: 50%; border: 3px solid var(--ink); flex: none;
    transform: translateY(calc(-12px - var(--e) * 8px)) scale(calc(1.06 + var(--e) * 0.08)) rotate(calc(var(--e) * -6deg));
    box-shadow: 3px 5px 0 var(--ink), 0 18px 26px rgba(0,0,0,.45);
    transition: transform .18s ease-out;
  }
  .spin-badge {
    position: absolute; right: -10px; top: -18px; width: 64px; height: 64px;
    animation: wwSpin 16s linear infinite; pointer-events: none; z-index: 5;
  }
  .spin-badge svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes wwSpin { to { transform: rotate(360deg); } }

  /* Rising Steam Effect */
  .steam-wrap {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; pointer-events: none; z-index: 3;
  }
  .steam-wrap i {
    width: 4px; height: 16px; border-radius: 99px;
    background: rgba(255,255,255,.78); filter: blur(1.5px);
    animation: steamUp 2.2s ease-in-out infinite;
  }
  .steam-wrap i:nth-child(2) { animation-delay: .6s; height: 20px; }
  .steam-wrap i:nth-child(3) { animation-delay: 1.2s; }
  @keyframes steamUp {
    0% { opacity: 0; transform: translateY(6px) scaleY(.7); }
    50% { opacity: .85; }
    100% { opacity: 0; transform: translateY(-14px) scaleY(1.2); }
  }

  /* Tactile Neo-Brutalist Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 2px solid var(--ink); border-radius: 999px; padding: 10px 16px; font-weight: 800; font-size: 12.5px;
    cursor: pointer; text-decoration: none;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease, filter .15s ease;
  }
  .btn:active { transform: translate(2px, 2px) !important; box-shadow: 0 0 0 var(--ink) !important; }
  .btn.full { width: 100%; margin-top: 8px; }
  .btn.o { background: var(--o); color: #fff; box-shadow: 3px 3px 0 var(--ink); }
  .btn.g { background: var(--lime); color: #17110d; box-shadow: 3px 3px 0 var(--ink); }
  .btn.amb { background: #fbbf24; color: #17110d; box-shadow: 2px 2px 0 var(--ink); }
  .btn.w { background: var(--bg); color: var(--ink); border: 2px solid var(--ink); }
  .btn.r { background: #ffe4e6; color: #9f1239; border: 2px solid var(--ink); }
  .btn.sm { padding: 6px 11px; font-size: 11px; }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .btn-row { display: flex; gap: 7px; flex-wrap: wrap; }
  .btn-row > * { flex: 1; }

  .inp {
    width: 100%; padding: 10px 12px; border: 2px solid var(--ln); border-radius: 13px;
    background: var(--sf2); color: var(--ink); font-weight: 700; font-size: 12.5px; margin: 4px 0; outline: none;
  }
  .inp:focus { border-color: var(--o); background: var(--sf); }
  .lbl { display: block; font-size: 10px; font-weight: 800; color: var(--mu); margin: 8px 0 3px; text-transform: uppercase; letter-spacing: .5px; }

  .seg { display: flex; gap: 4px; background: var(--sf2); padding: 4px; border-radius: 99px; margin: 4px 0; border: 2px solid var(--ink); }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 99px; font-size: 11px; font-weight: 800; color: var(--mu); cursor: pointer; transition: .15s; }
  .seg button.on { background: var(--ink); color: var(--lime); }

  /* Plan Grid */
  .plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0; }
  .p-tier {
    border: 2px solid var(--ink); border-radius: 18px; padding: 12px 10px; text-align: center;
    background: var(--sf); cursor: pointer; position: relative;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .p-tier:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .p-tier.on { background: var(--lime); color: #17110d; transform: translate(-1px, -2px); box-shadow: 4px 4px 0 var(--ink); }
  .p-tier .tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%) rotate(-2deg); background: var(--ink); color: var(--lime); font-size: 8.5px; font-weight: 800; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .p-tier.on .tag { background: var(--o); color: #fff; }
  .p-tier b { display: block; font-family: var(--serif); font-size: 19px; color: var(--o2); margin: 3px 0; }

  /* Restaurant Cards */
  .rest-card {
    border: 2px solid var(--ink); border-radius: 20px; overflow: hidden; background: var(--sf);
    margin-bottom: 15px; box-shadow: 4px 4px 0 var(--ink); cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .rest-card:nth-child(odd) { transform: rotate(-0.6deg); }
  .rest-card:nth-child(even) { transform: rotate(0.6deg); }
  .rest-card:hover { transform: rotate(0deg) translateY(-3px); box-shadow: 6px 6px 0 var(--ink); }
  .rest-cover { position: relative; height: 145px; background: #1e293b; border-bottom: 2px solid var(--ink); }
  .rest-cover img { width: 100%; height: 100%; }
  .rest-status { position: absolute; top: 10px; left: 10px; padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .rest-eta { position: absolute; bottom: 10px; right: 10px; background: var(--ink); color: var(--lime); padding: 4px 9px; border-radius: 99px; font-size: 10px; font-weight: 800; }
  .rest-body { padding: 12px 14px; }
  .rest-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rest-rating { background: var(--lime); color: #17110d; border: 1.5px solid var(--ink); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px; }

  /* Product Cards with Alternating Tilt + 3D Pop-Out Image */
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pcard {
    border: 2px solid var(--ink); border-radius: 20px; padding: 10px; background: var(--sf);
    box-shadow: 4px 4px 0 var(--ink); display: flex; flex-direction: column; justify-content: space-between;
    overflow: visible; margin-top: 10px;
    transition: transform .22s cubic-bezier(.22,1,.36,1), box-shadow .22s ease;
  }
  .pcard:nth-child(odd) { transform: rotate(-0.9deg); }
  .pcard:nth-child(even) { transform: rotate(0.9deg); }
  .pcard:hover { transform: rotate(0deg) translateY(-4px); box-shadow: 6px 6px 0 var(--ink); }
  .pimg {
    position: relative; height: 118px; border-radius: 16px; overflow: visible;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #fef3c7 55%, #f59e0b 100%);
    border: 1.5px solid var(--ink);
    margin-bottom: 10px; cursor: pointer; display: grid; place-items: center;
  }
  [data-theme=dark] .pimg { background: radial-gradient(circle at 50% 42%, #314237 0%, #16221b 100%); }
  .pimg img {
    width: 104%; height: 122px; border-radius: 16px;
    transform: translateY(-10px) scale(1.02);
    border: 2px solid var(--ink);
    box-shadow: 2px 6px 0 rgba(23,17,13,.25);
    transition: transform .24s cubic-bezier(.22,1,.36,1);
  }
  .pcard:hover .pimg img { transform: translateY(-16px) scale(1.06) rotate(-2deg); }
  .sym { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 2px solid #16a34a; border-radius: 3px; background: #fff; flex: none; }
  .sym i { width: 5px; height: 5px; border-radius: 50%; background: #16a34a; }
  .sym.nv { border-color: #dc2626; } .sym.nv i { background: #dc2626; }
  .qty { display: flex; align-items: center; justify-content: space-between; background: var(--lime); border: 2px solid var(--ink); padding: 2px; border-radius: 99px; margin-top: 6px; }
  .qty button { width: 27px; height: 27px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--o); color: #fff; font-weight: 800; cursor: pointer; }

  /* Chips & Progress */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; padding: 6px 12px; border-radius: 99px; border: 2px solid var(--ink); background: var(--sf); font-size: 11px; font-weight: 800; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  .chips button.on { background: var(--ink); color: var(--lime); }
  .pbar { height: 10px; background: var(--sf2); border: 1.5px solid var(--ink); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--o), var(--lime)); transition: width .25s; }

  /* Ripped Paper Section Divider & Double Marquee Bands */
  .rip-divider {
    width: 100%; height: 16px; margin: 14px 0 6px;
    background: var(--ink);
    clip-path: polygon(0 60%, 4% 20%, 8% 75%, 12% 25%, 16% 70%, 20% 20%, 24% 80%, 28% 30%, 32% 75%, 36% 20%, 40% 70%, 44% 25%, 48% 80%, 52% 20%, 56% 75%, 60% 25%, 64% 70%, 68% 20%, 72% 80%, 76% 30%, 80% 75%, 84% 20%, 88% 70%, 92% 25%, 96% 80%, 100% 35%, 100% 100%, 0 100%);
  }
  .ww-mq-wrap {
    margin: 18px -14px; padding: 12px 0; overflow: hidden;
  }
  .ww-band {
    width: 112%; margin-left: -6%; overflow: hidden;
    border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  }
  .ww-band .track {
    display: flex; width: max-content; white-space: nowrap;
    font-family: var(--serif); font-weight: 800; font-size: 16px; letter-spacing: -.01em;
    padding: 8px 0; animation: wwMarquee 26s linear infinite;
  }
  .ww-b1 { background: var(--ink); color: var(--lime); transform: rotate(-1.6deg); }
  .ww-b2 { background: var(--o); color: #fff; transform: rotate(1.3deg); margin-top: -2px; }
  .ww-b2 .track { animation-direction: reverse; animation-duration: 32s; }
  @keyframes wwMarquee { to { transform: translateX(-50%); } }

  /* Floating Side Quick-Jump Dots */
  .ww-dots {
    position: fixed; right: 8px; top: 50%; transform: translateY(-50%); z-index: 55;
    display: flex; flex-direction: column; gap: 9px;
    background: var(--bg); border: 2px solid var(--ink); border-radius: 999px;
    padding: 9px 6px; box-shadow: 2px 2px 0 var(--ink);
  }
  .ww-dots button {
    width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 50%;
    background: transparent; cursor: pointer; padding: 0; transition: transform .15s, background .15s;
  }
  .ww-dots button.on { background: var(--o); transform: scale(1.25); }
  @media (max-width: 400px) { .ww-dots { display: none; } }

  /* Rows, KPIs & Timeline */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--ln); font-size: 12px; }
  .row:last-child { border-bottom: 0; }
  .kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .kpi div { background: var(--sf); border: 2px solid var(--ink); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: 3px 3px 0 var(--ink); }
  .kpi b { display: block; font-family: var(--serif); font-size: 17px; color: var(--o2); }
  .kpi span { font-size: 9.5px; font-weight: 800; color: var(--mu); text-transform: uppercase; }
  .tl { display: flex; gap: 4px; margin: 6px 0; }
  .tl span { flex: 1; text-align: center; font-size: 9px; font-weight: 800; padding: 4px 2px; border-radius: 8px; background: var(--sf2); color: var(--mu); border: 1px solid var(--ink); }
  .tl span.done { background: var(--lime); color: #17110d; }
  .tl span.now { background: #fbbf24; color: #0f172a; }

  /* Floating Cart & Bottom Nav */
  .cbar {
    position: fixed; left: 12px; right: 12px; bottom: 80px; z-index: 70; max-width: 680px; margin: 0 auto;
    background: var(--lime); color: #17110d; border: 2px solid var(--ink); border-radius: 99px;
    padding: 11px 18px; display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; font-weight: 800; box-shadow: 4px 4px 0 var(--ink); cursor: pointer;
    transition: transform .15s ease;
  }
  .cbar:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  nav {
    position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 80; max-width: 700px; margin: 0 auto;
    background: var(--sf); border: 2px solid var(--ink); border-radius: 99px;
    display: flex; gap: 3px; padding: 5px; box-shadow: 4px 4px 0 var(--ink);
  }
  nav button {
    flex: 1; border: 0; background: transparent; border-radius: 99px; padding: 7px 2px;
    font-size: 9.5px; font-weight: 800; color: var(--mu); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
    transition: background .15s, color .15s, transform .12s;
  }
  nav button.on { background: var(--ink); color: var(--lime); transform: translateY(-2px); }
  nav .nb { position: absolute; top: 2px; right: 14%; background: var(--o); color: #fff; border: 1.5px solid var(--ink); font-size: 8.5px; padding: 1px 5px; border-radius: 99px; }

  /* Order Smart Cards */
  .order-smart-card {
    background: var(--sf); border: 2px solid var(--ink); border-left: 5px solid var(--amb);
    border-radius: 18px; padding: 12px; margin-bottom: 10px; box-shadow: 3px 3px 0 var(--ink);
  }
  .order-smart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .order-smart-meta { font-size: 11px; color: var(--mu); line-height: 1.45; margin-top: 4px; }
  .smart-badge-strip { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .smart-chip {
    display: inline-flex; align-items: center; gap: 4px; background: var(--lime);
    border: 1.5px solid var(--ink); color: #17110d; font-size: 10.5px; font-weight: 800;
    padding: 4px 10px; border-radius: 99px; cursor: pointer; box-shadow: 2px 2px 0 var(--ink);
  }

  /* Modal & Toast */
  .ov { position: fixed; inset: 0; z-index: 200; background: rgba(11,22,16,.78); backdrop-filter: blur(5px); display: flex; align-items: flex-end; justify-content: center; }
  .sh { background: var(--sf); border-top: 2px solid var(--ink); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 18px; animation: sUp .2s ease-out; }
  @keyframes sUp { from { transform: translateY(100%); } }
  #toast {
    position: fixed; left: 50%; bottom: 138px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--lime); border: 2px solid var(--lime); padding: 10px 18px; border-radius: 99px; font-size: 12px; font-weight: 800;
    z-index: 900; opacity: 0; pointer-events: none; transition: .22s; text-align: center; max-width: 90vw;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .zomato-notif-banner {
    position: sticky; top: 66px; z-index: 55; margin: 10px 14px 0;
    background: var(--ink); color: #fff; border: 2px solid var(--lime);
    border-radius: 18px; padding: 11px 14px; box-shadow: 4px 4px 0 var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .zomato-notif-banner b { display: block; font-size: 12.5px; color: var(--lime); }
  .zomato-notif-banner small { display: block; font-size: 11px; color: #ecfdf5; margin-top: 2px; }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; width: 58mm; font-family: monospace; font-size: 11px; color: #000; background: #fff; padding: 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin-badge, .ww-band .track, .steam-wrap i { animation: none !important; }

function autoMatch3DImage(name, cat, desc = "") {
  const txt = `${name} ${cat} ${desc}`.toLowerCase();
  if (/surf|detergent|easy\s*wash|washing/.test(txt)) return REAL_IMG.surf;
  if (/lifebuoy|soap|sabun|handwash/.test(txt)) return REAL_IMG.soap;
  if (/tea|chai|red\s*label|brooke/.test(txt)) return REAL_IMG.tea;
  if (/oil|tel|fortune|sunlite|mustard/.test(txt)) return REAL_IMG.oil;
  if (/milk|omfed|doodh|bread|curd|dahi/.test(txt)) return REAL_IMG.milk;
  if (/atta|wheat|maida|besan/.test(txt)) return REAL_IMG.atta;
  if (/rice|chawal|miniket|basmati/.test(txt)) return REAL_IMG.rice;
  if (/biryani|pulao|dum/.test(txt)) return REAL_IMG.biryani;
  if (/jar\s*cake|jarcake|cupcake/.test(txt)) return REAL_IMG.jarcake;
  if (/cake|pastry|velvet|truffle|bakery/.test(txt)) return REAL_IMG.cake;
  if (/puri|halwa|aloo\s*dum/.test(txt)) return REAL_IMG.puri;
  if (/idli|dosa|sambar|upma|vada|nashta|breakfast/.test(txt)) return REAL_IMG.idli;
  if (/paneer|mushroom|butter\s*masala|naan/.test(txt)) return REAL_IMG.paneer;
  if (/chicken|mutton|fish|egg|tadka|non-veg|nonveg/.test(txt)) return REAL_IMG.chicken;
  if (/thali|dalma|meal|combo|roti|tiffin|dabba/.test(txt)) return REAL_IMG.thali;
  const catFallback = {
    Breakfast: REAL_IMG.idli, Thali: REAL_IMG.thali, Meals: REAL_IMG.chicken, Biryani: REAL_IMG.biryani,
    Bakery: REAL_IMG.cake, Staples: REAL_IMG.atta, Dairy: REAL_IMG.milk, Kirana: REAL_IMG.kirana
  };
  return catFallback[cat] || REAL_IMG.thali;
}

  const deliveredPast = allPast.filter(o => o.status === "Delivered").length;

  return { p, totalPast: allPast.length, deliveredPast, cancelledPast, isRepeat: deliveredPast > 0, highCod: (+amount || 0) >= 350 };
}

function validateStrictUTR(raw, usedList) {
  const clean = String(raw || "").replace(/\D/g, "");
  if (clean.length !== 12) return { ok: false, msg: "⚠️ Exact 12-digit UPI UTR number daalein!" };
  if (/^(\d) {6,}/.test(clean) || /(012345|123456|234567|345678|456789|987654|654321)/.test(clean)) {
    return { ok: false, msg: "⚠️ Fake sequence UTR blocked! Asli bank UTR daalein." };
  }
  if ((usedList || []).includes(clean)) return { ok: false, msg: "⚠️ Duplicate UTR! Yeh UTR pehle use ho chuka hai." };
  return { ok: true, utr: clean };
}

function hashDataUrl(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i += Math.max(1, Math.floor(s.length / 400))) {
    h = ((h << 5) + h) ^ s.charCodeAt(i);
  }
  return "H-" + (h >>> 0).toString(16);
}

function compressImageFileToDataUrl(file, maxSize = 480, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width || 1, img.height || 1));
        const w = Math.max(1, Math.round((img.width || 300) * scale));
        const h = Math.max(1, Math.round((img.height || 300) * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let USER_GPS = { lat: null, lng: null, acc: null, status: "Not captured yet", ok: false };

function captureMandatoryGps(silent = false) {
  if (!navigator.geolocation) {
    USER_GPS.status = "⚠️ Browser GPS support nahi karta";
    USER_GPS.ok = false;
    if (!silent) toast(USER_GPS.status);
    render();
    return;
  }
  if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
    USER_GPS.status = "⚠️ GPS ke liye HTTPS link par app kholein (file:// par GPS block hota hai)";
    USER_GPS.ok = false;
    if (!silent) toast(USER_GPS.status);
    render();
    return;
  }
  USER_GPS.status = "📡 GPS Location pakad raha hai...";
  if (!silent) render();
  navigator.geolocation.getCurrentPosition(
    pos => {
      USER_GPS = {
        lat: +pos.coords.latitude.toFixed(6),
        lng: +pos.coords.longitude.toFixed(6),
        acc: Math.round(pos.coords.accuracy || 0),
        status: `✅ GPS Locked (${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)} · ±${Math.round(pos.coords.accuracy || 0)}m)`,
        ok: true
      };
      if (!silent) toast("📍 Live GPS Location Locked!");
      render();
    },
    err => {
      USER_GPS.ok = false;
      USER_GPS.status = err.code === 1
        ? "⚠️ Location Permission Denied! Phone settings/browser se Location Allow karein."
        : "⚠️ GPS signal weak hai — khuli jagah par jakar Retry dabayein.";
      if (!silent) toast(USER_GPS.status);
      render();
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 }
  );
}

function calcTiffinPrice(diet, days, slot) {
  const base = +(S.cfg.tiffinRates[diet]?.[days] || 920);
  const bfTotal = (+S.cfg.tiffinRates.breakfastPerDay || 40) * days;
  if (slot === "Morning Breakfast (7:30 AM)") return bfTotal;
  if (slot === "Breakfast + Lunch") return bfTotal + base;
  if (slot === "Lunch + Dinner") return Math.round(base * 1.85);
  if (slot === "All 3 Meals (B+L+D)") return bfTotal + Math.round(base * 1.85);
  return base;
}

/* ==================== CATEGORY 3: KIRANA & HUL ==================== */
function kiranaCartCount() { return Object.values(KIRANA_CART).reduce((a, b) => a + (+b || 0), 0); }
function kiranaSubtotal() {
  return Object.entries(KIRANA_CART).reduce((sum, [id, qty]) => {
    const it = S.kiranaItems.find(x => x.id === id);
    return it ? sum + it.price * qty : sum;
  }, 0);
}
function kiranaDeliveryFee(sub) {
  if (sub <= 0) return 0;
  return sub >= (+S.cfg.kiranaFreeDeliveryAt || 500) ? 0 : (+S.cfg.kiranaDeliveryFee || 25);
}

    (KIRANA_CAT_FILTER === "ALL" || it.cat === KIRANA_CAT_FILTER) &&

          `🎉 <b>FREE Delivery Unlocked!</b> (Cart ${inr(sub)} ≥ ₹${freeAt})`}

/* ==================== DEDICATED CHECKOUT PAGE ==================== */
function viewCheckoutPage() {
  if (!CHECKOUT_MODAL) { TAB = "tiffin"; return viewTiffin(); }
  const m = CHECKOUT_MODAL;
  const isFood = m.kind === "FOOD";
  const isKirana = m.kind === "KIRANA";
  const isTiffin = m.kind === "TIFFIN";

  let liveItems = [];
  let subTotal = m.total;
  let delFee = 0;
  let discAmt = +m.discountAmt || 0;
  let grandTotal = Math.max(0, m.total - discAmt);

  if (isFood) {
    liveItems = Object.entries(FOOD_CART).map(([id, qty]) => {
      const it = S.foodItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    if (!liveItems.length) { CHECKOUT_MODAL = null; TAB = "food"; return viewFoodShop(); }
    subTotal = foodCartTotal();
    grandTotal = Math.max(0, subTotal - discAmt);
    m.items = liveItems;
    m.total = grandTotal;
  } else if (isTiffin) {
    grandTotal = Math.max(0, (+m.total || 0) - discAmt);
    m.total = grandTotal;
  } else if (isKirana) {
    liveItems = Object.entries(KIRANA_CART).map(([id, qty]) => {
      const it = S.kiranaItems.find(x => x.id === id);
      return it ? { ...it, qty } : null;
    }).filter(Boolean);
    const minOrd = +S.cfg.kiranaMinOrder || 300;
    if (!liveItems.length || kiranaSubtotal() < minOrd) {
      CHECKOUT_MODAL = null; TAB = "kirana"; return viewKirana();
    }
    subTotal = kiranaSubtotal();
    delFee = kiranaDeliveryFee(subTotal);
    grandTotal = Math.max(0, subTotal + delFee - discAmt);
    m.items = liveItems; m.sub = subTotal; m.deliveryFee = delFee; m.total = grandTotal;
  }

  const uLink = qrUrl(`upi://pay?pa=${S.cfg.upi}&pn=Namaste%20Udala&cu=INR&am=${Number(grandTotal).toFixed(2)}`);
  const backTab = isTiffin ? "tiffin" : isFood ? "food" : "kirana";
  const themeBg = isTiffin ? "#881337" : isFood ? "#78350f" : "#064e3b";

  return `
    <div class="card" style="background:${themeBg};color:#fff">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <button class="btn w sm" data-act="backFromCheckout" data-v="${backTab}">← Back</button>

          <small style="color:var(--lime);font-weight:800;letter-spacing:1px">${esc(m.kind)} CHECKOUT</small>
          <h2 style="font-family:var(--serif);font-size:18px">${esc(m.title)}</h2>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>1. Order Summary & Items <span class="pill p-green">${isTiffin ? "Subscription" : liveItems.length + " Items"}</span></h3>
      ${isTiffin ? `<div style="background:var(--sf2);padding:12px;border-radius:14px;font-size:12.5px;font-weight:700">🍱 ${esc(m.summary)}</div>` :
        liveItems.map(it => {
          const ven = S.vendors.find(v => v.id === it.vendorId)?.name || "Store";
          const incAct = isFood ? "fInc" : "kInc";
          const decAct = isFood ? "fDec" : "kDec";
          return `
            <div class="row">
              <div style="flex:1;min-width:0">
                <div style="font-size:9.5px;font-weight:800;color:var(--mu)">🏪 ${esc(ven)}</div>
                <b>${esc(it.name)}</b>
                <div style="font-size:11px;color:var(--g2);font-weight:800">${inr(it.price)} × ${it.qty} = ${inr(it.price * it.qty)}</div>
              </div>
              <div class="qty" style="margin-top:0;width:92px;flex:none">
                <button data-act="${decAct}" data-id="${it.id}">−</button>
                <b>${it.qty}</b>
                <button data-act="${incAct}" data-id="${it.id}">+</button>
              </div>
            </div>`;
        }).join("")}

      <div style="margin-top:10px;padding-top:10px;border-top:2px dashed var(--ln);font-size:12.5px">
        <div class="row" style="padding:3px 0;border:0"><span>Item Total</span><b>${inr(subTotal)}</b></div>
        ${!isTiffin ? `<div class="row" style="padding:3px 0;border:0"><span>Delivery Fee</span><b style="color:${delFee === 0 ? "#16a34a" : "inherit"}">${delFee === 0 ? "FREE (₹0)" : inr(delFee)}</b></div>` : ""}
        ${discAmt > 0 ? `<div class="row" style="padding:3px 0;border:0;color:#16a34a"><span>Promo Discount (${esc(m.appliedPromo)})</span><b>-${inr(discAmt)}</b></div>` : ""}

let RIDER_WATCH_ID = null;
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function recordRouteWaypoint(lat, lng, label = "Move") {
  S.riderAutoTrack = S.riderAutoTrack || { active: false, totalKm: 0, points: [], lastFix: null };
  const tr = S.riderAutoTrack;
  const nLat = +(+lat).toFixed(6), nLng = +(+lng).toFixed(6);
  if (tr.lastFix && typeof tr.lastFix.lat === "number") {
    const stepKm = haversineKm(tr.lastFix.lat, tr.lastFix.lng, nLat, nLng);
    if (stepKm >= 0.015 && stepKm <= 1.5) tr.totalKm = +((+tr.totalKm || 0) + stepKm).toFixed(2);
  }
  tr.lastFix = { lat: nLat, lng: nLng, t: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
  tr.points = tr.points || [];
  tr.points.push({ lat: nLat, lng: nLng, label, t: tr.lastFix.t });
  if (tr.points.length > 120) tr.points.shift();
}
function toggleRiderAutoTrack(forceState = null) {
  S.riderAutoTrack = S.riderAutoTrack || { active: false, totalKm: 0, points: [], lastFix: null };
  const nextActive = typeof forceState === "boolean" ? forceState : !S.riderAutoTrack.active;
  if (!nextActive) {
    S.riderAutoTrack.active = false;
    if (RIDER_WATCH_ID !== null && navigator.geolocation) { navigator.geolocation.clearWatch(RIDER_WATCH_ID); RIDER_WATCH_ID = null; }
    save(`Rider Auto Route stopped (${S.riderAutoTrack.totalKm || 0} km)`);
    return toast("⏹ Auto Route & KM Tracking stopped");
  }
  if (!navigator.geolocation) return toast("⚠️ GPS tracking support nahi hai");
  S.riderAutoTrack.active = true;
  if (RIDER_WATCH_ID !== null) navigator.geolocation.clearWatch(RIDER_WATCH_ID);
  toast("📡 Auto Route & KM Tracking ON!");
  RIDER_WATCH_ID = navigator.geolocation.watchPosition(
    pos => { if (S.riderAutoTrack?.active) { recordRouteWaypoint(pos.coords.latitude, pos.coords.longitude, "GPS Ping"); if (ROLE === "delivery") render(); } },
    () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
  );
  save("Rider Auto Route started");
}

  const pts = (S.riderAutoTrack && S.riderAutoTrack.points) || [];
  if (pts.length >= 2) return `https://www.google.com/maps/dir/${pts[0].lat},${pts[0].lng}/${pts[pts.length - 1].lat},${pts[pts.length - 1].lng}`;
  if (pts.length === 1) return `https://www.google.com/maps?q=${pts[0].lat},${pts[0].lng}`;

}

function getVendorLedger(v) {
  const list = v.type === "FOOD" ? (S.foodOrders || []) : (S.kiranaOrders || []);
  let gross = 0, comm = 0;
  list.filter(o => o.status !== "Cancelled").forEach(o => {
    const vSub = o.items.filter(i => i.vendorId === v.id).reduce((a, i) => a + i.price * i.qty, 0);
    if (vSub > 0) {
      gross += vSub;
      if (!v.isSelf) {
        if (v.type === "FOOD") comm += Math.round((vSub * (+S.cfg.foodPartnerCommPct || 20)) / 100);
        if (v.type === "KIRANA" && o.status === "Delivered") comm += (+S.cfg.kiranaPostDeliveryComm || 30);
      }
    }
  });
  const payable = Math.max(0, gross - comm);
  return { gross, comm, payable, due: Math.max(0, payable - (+v.settledPaid || 0)) };
}

let AUDIO_CTX = null;
function playOrderAlertSound() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!AUDIO_CTX) AUDIO_CTX = new Ctx();
    if (AUDIO_CTX.state === "suspended") AUDIO_CTX.resume().catch(() => {});
    const now = AUDIO_CTX.currentTime;
    [{ t: 0, d: .35, f: 587.33 }, { t: .22, d: .35, f: 783.99 }, { t: .44, d: .5, f: 1046.5 }].forEach(p => {
      const osc = AUDIO_CTX.createOscillator(), gain = AUDIO_CTX.createGain();
      osc.type = "triangle"; osc.frequency.setValueAtTime(p.f, now + p.t);
      gain.gain.setValueAtTime(0.001, now + p.t);
      gain.gain.exponentialRampToValueAtTime(0.28, now + p.t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + p.t + p.d);
      osc.connect(gain); gain.connect(AUDIO_CTX.destination);
      osc.start(now + p.t); osc.stop(now + p.t + p.d + 0.05);
    });
  } catch (e) {}
}

    </div>
  `;
}

/* ==================== MAIN RENDER ==================== */
function render() {
  try {
    normalizeAllImages();
    autoSyncCustomerDefaults();
    const savedRole = sessionStorage.getItem("nu_role");
    ROLE = (savedRole && ["customer", "kitchen", "delivery", "vendor", "owner"].includes(savedRole)) ? savedRole : "customer";

    if (LOGIN_MODE === "gate") {
      $("#appMain").innerHTML = viewLoginPage();
      $("#cartFloat").innerHTML = "";
      $("#bottomNav").style.display = "none";
      $("#wwDots").style.display = "none";
      return;
    }

    if (ROLE === "kitchen") $("#appMain").innerHTML = viewKitchen();
    else if (ROLE === "delivery") $("#appMain").innerHTML = viewDelivery();
    else if (ROLE === "vendor") $("#appMain").innerHTML = viewVendor();
    else if (ROLE === "owner") $("#appMain").innerHTML = viewOwner();
    else {
      if (TAB === "checkout" && CHECKOUT_MODAL) $("#appMain").innerHTML = viewCheckoutPage();
      else if (TAB === "success" && LAST_PLACED_ORDER) $("#appMain").innerHTML = viewOrderSuccessPage();
      else if (TAB === "itemDetail" && DETAIL_ITEM) $("#appMain").innerHTML = viewItemDetailPage();
      else if (TAB === "tiffinPass") $("#appMain").innerHTML = viewTiffinPassPage();
      else if (TAB === "tiffin") $("#appMain").innerHTML = viewTiffin();
      else if (TAB === "food") $("#appMain").innerHTML = viewFoodShop();
      else if (TAB === "kirana") $("#appMain").innerHTML = viewKirana();
      else if (TAB === "orders") $("#appMain").innerHTML = viewCustomerOrders();
      else $("#appMain").innerHTML = viewAccountPage();
    }

    let cbarHtml = "";
    if (ROLE === "customer" && TAB === "food" && foodCartCount() > 0) {
      cbarHtml = `<div class="cbar" data-act="openFoodCheckout"><span>🍛 Food Cart: ${foodCartCount()} Items · ${inr(foodCartTotal())}</span><span>Checkout Food →</span></div>`;
    } else if (ROLE === "customer" && TAB === "kirana" && kiranaCartCount() > 0) {
      const sub = kiranaSubtotal();
      const minOrd = +S.cfg.kiranaMinOrder || 300;
      const fee = kiranaDeliveryFee(sub);
      cbarHtml = `<div class="cbar" data-act="openKiranaCheckout"><span>🛒 Kirana: ${inr(sub)} ${fee ? `(+₹${fee} Del)` : "(FREE Del)"}</span><span>${sub < minOrd ? `+${inr(minOrd - sub)} for Min` : "Checkout Kirana →"}</span></div>`;
    }
    $("#cartFloat").innerHTML = cbarHtml;

    if (ROLE === "customer") {
      const navItems = [
        ["tiffin", "🍱", "Mera Tiffin", 0],
        ["food", "🍛", "Food Shop", foodCartCount()],
        ["kirana", "🛒", "Sauda & Daily Needs", kiranaCartCount()],
        ["orders", "📦", "My Orders", (S.foodOrders?.length || 0) + (S.kiranaOrders?.length || 0)],
        ["account", "👤", "Profile", 0]
      ];
      $("#bottomNav").style.display = "flex";
      $("#bottomNav").innerHTML = navItems.map(([t, ic, lbl, cnt]) =>
        `<button class="${TAB === t ? "on" : ""}" data-act="setTab" data-v="${t}">
          <span style="font-size:17px">${ic}</span><span>${lbl}</span>
          ${cnt > 0 ? `<span class="nb">${cnt}</span>` : ""}
        </button>`
      ).join("");

      $("#wwDots").style.display = "flex";
      $("#wwDots").innerHTML = navItems.map(([t, , lbl]) =>
        `<button class="${TAB === t ? "on" : ""}" data-act="setTab" data-v="${t}" title="${lbl}"></button>`
      ).join("");
    } else {
      $("#bottomNav").style.display = "none";
      $("#wwDots").style.display = "none";
    }

    requestAnimationFrame(updateScrollHero);
  } catch (err) {
    const m = document.querySelector("#appMain");
    if (m) m.innerHTML = `<div class="card"><h3>⚠️ Display Recovery</h3><p style="font-size:12px">${esc(err?.message || "Render issue")}</p><button class="btn g sm" data-act="setTab" data-v="tiffin">Reload</button></div>`;
  }
}

    const o = (k === "FOOD" ? S.foodOrders : S.kiranaOrders).find(x => x.id === id);
    if (!o) return;
    $("#printArea").innerHTML = `<div style="text-align:center;font-weight:bold">NAMASTE UDALA</div><hr><div>${esc(o.name)} (${esc(o.phone)})</div><hr>${o.items.map(i => `<div>${esc(i.name)} x${i.qty} = Rs.${i.price * i.qty}</div>`).join("")}<hr><strong>TOTAL: Rs.${o.total}</strong>`;
    window.print();
  }
};

document.addEventListener("click", e => {
  if (e.target.closest("#logoBtn")) {
    e.preventDefault();
    window._nuTapCount = (window._nuTapCount || 0) + 1;
    clearTimeout(window._nuTapTimer);
    window._nuTapTimer = setTimeout(() => { window._nuTapCount = 0; }, 1400);
    if (window._nuTapCount >= 5) {
      window._nuTapCount = 0;
      const pin = prompt("Staff / Admin PIN daalein:");
      if (pin === PINS.owner) { ROLE = "owner"; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "owner"); sessionStorage.setItem("nu_login_done", "1"); render(); toast("👑 Owner Unlocked"); return; }
      if (pin === PINS.kitchen) { ROLE = "kitchen"; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "kitchen"); sessionStorage.setItem("nu_login_done", "1"); render(); toast("🍳 Kitchen Unlocked"); return; }
      if (pin === PINS.delivery) { ROLE = "delivery"; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "delivery"); sessionStorage.setItem("nu_login_done", "1"); render(); toast("🛵 Delivery Unlocked"); return; }
      const vPins = { ...PINS.vendors, ...(S.cfg.vendorPins || {}) };
      const matchedVid = Object.keys(vPins).find(vid => vPins[vid] === pin);
      if (matchedVid) { ROLE = "vendor"; ACTIVE_VENDOR_ID = matchedVid; LOGIN_MODE = "app"; sessionStorage.setItem("nu_role", "vendor"); sessionStorage.setItem("nu_vid", matchedVid); sessionStorage.setItem("nu_login_done", "1"); render(); toast("🏪 Vendor Unlocked"); return; }
      if (pin !== null) toast("❌ Galat PIN!");
      return;
    }
    if (ROLE === "customer") { TAB = "tiffin"; SELECTED_REST_ID = null; }
    render(); scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (btn && ACT[btn.dataset.act]) {
    if (btn.tagName !== "A") e.preventDefault();
    ACT[btn.dataset.act](btn.dataset.v, btn.dataset.k, btn.dataset.id, e);
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "chkUtrInp" && CHECKOUT_MODAL) { CHECKOUT_MODAL.draftUtr = e.target.value; return; }
  if (e.target.id === "chkPromoInp" && CHECKOUT_MODAL) { CHECKOUT_MODAL.appliedPromo = e.target.value; return; }
  if (e.target.id === "loginCustName") { LOGIN_CUST_NAME = e.target.value; return; }
  if (e.target.id === "loginCustPhone") { LOGIN_CUST_PHONE = e.target.value; return; }
  if (e.target.dataset.tf) TF[e.target.dataset.tf] = e.target.value;
  if (e.target.id === "foodSearchInp") { FOOD_SEARCH = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#foodSearchInp"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
  if (e.target.id === "kiranaSearchInp") { KIRANA_SEARCH = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#kiranaSearchInp"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
  if (e.target.id === "ordPhoneFilterInp") { ORDER_PHONE_FILTER = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#ordPhoneFilterInp"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
});

document.addEventListener("change", e => {
  if (e.target.id === "riderSelectDropdown") { ACT.switchRiderSelect(); return; }
  if (e.target.dataset.tf) { TF[e.target.dataset.tf] = e.target.value; render(); }
});

$("#proofInput").addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => { PROOF_DATA_URL = ev.target.result; render(); toast("Screenshot attached ✓"); };
  r.readAsDataURL(f);
});

document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const card = e.target.closest(".pcard, .hero");
  if (!card) return;
  const r = card.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width - 0.5;
  const y = (e.clientY - r.top) / r.height - 0.5;
  card.style.transform = `perspective(700px) rotateX(${(-y * 6).toFixed(1)}deg) rotateY(${(x * 7).toFixed(1)}deg) translateY(-4px)`;
});
document.addEventListener("pointerout", e => {
  const card = e.target.closest(".pcard, .hero");
  if (card && !card.contains(e.relatedTarget)) card.style.transform = "";
});

document.addEventListener("error", e => {
  const img = e.target;
  if (img && img.tagName === "IMG" && !img.dataset.fbDone) {
    img.dataset.fbDone = "1";
    img.src = REAL_IMG.thali;
  }
}, true);

normalizeAllImages();
render();
</script>
</body>
</html>
