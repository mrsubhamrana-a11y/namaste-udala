<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste Udala</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14452a">
<style>
:root{--o:#e8590c;--g:#15543b;--bg:#fff9f0;--text:#2b1d12;--muted:#8a7561;--card:#fff;--line:#f0e3d3}
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:84px;font-weight:500}
header{background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff;padding:22px 20px 30px;border-radius:0 0 32px 32px;box-shadow:0 10px 40px rgba(0,0,0,.15);position:relative;overflow:hidden}

header b{color:#fcc419;font-size:11px;letter-spacing:3px;font-weight:900}
header h1{font-size:26px;font-weight:900;margin-top:4px}
header .s{color:rgba(255,255,255,.9)!important;font-weight:500}
#v{padding:0 14px;margin-top:-16px;position:relative;z-index:1}

.card:active{transform:scale(.98)}
.card h3{color:var(--g);font-size:17px;font-weight:800;margin-bottom:10px}
.s{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;margin:8px 0}

.seg .on{background:var(--o);color:#fff;border-color:var(--o);box-shadow:0 4px 15px rgba(232,89,12,.28)}
.btn{background:var(--o);color:#fff;border:0;width:100%;margin-top:8px;font-size:15px;box-shadow:0 6px 20px rgba(232,89,12,.28)}
.btn:active{transform:scale(.97)}
.btn.g{background:#e3f4e8;color:#1f7a3f;box-shadow:none}
.btn.r{background:#fde8e8;color:#c92a2a;box-shadow:none}
.btn.sm{padding:6px 12px;flex:none;width:auto;margin:0 0 0 4px;font-size:11px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:5px 0;font-size:14px;background:#fffdf9;color:var(--text);font-weight:500}

.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:6px}

.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}

.gr b{font-size:18px;display:block;font-weight:900}
.ban{background:#fff4d6;border:1px solid var(--line);color:var(--text);font-size:13px;border-radius:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06);display:flex;justify-content:space-around;padding:10px 0 max(12px,env(safe-area-inset-bottom));z-index:100}

.nav i{display:block;font-style:normal;font-size:22px;margin-bottom:2px}
a{color:var(--o);font-weight:700;font-size:12px}
.hero{background:linear-gradient(135deg,#f59f00,#e8590c);border-radius:28px;padding:24px 20px;margin:14px 0 16px;position:relative;overflow:hidden;box-shadow:0 15px 40px rgba(232,89,12,.3);color:#fff}

.hero h2{font-size:26px;line-height:1.2;margin-bottom:8px;font-weight:900;position:relative;z-index:2}
.hero p{font-size:13px;opacity:.95;position:relative;z-index:2}

.pc{flex:1;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--card);text-align:center;transition:all .2s}
.pc.on{background:#fff1e6;border-color:var(--o);box-shadow:0 0 0 3px rgba(232,89,12,.28)}
.pc div{color:var(--text)}
.sps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sp{background:#fff1e6;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;color:var(--text)}
.vi{display:inline-block;width:16px;height:16px;border:2px solid #16a34a;border-radius:4px;position:relative;vertical-align:-3px;background:#fff}
.vi::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#16a34a}
.vi.nv{border-color:#dc2626}.vi.nv::after{background:#dc2626}
.pc .vi{width:32px;height:32px;border-width:3px}.pc .vi::after{inset:6px}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:24px;padding:8px 14px;font-weight:700;font-size:12px;color:var(--text)}
.chips2 button.on{background:var(--o);color:#fff;border-color:var(--o)}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(128,128,128,.15)}
.it:last-child{border-bottom:0}
.ie{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,rgba(232,89,12,.1),rgba(245,159,0,.1));display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.in{flex:1;min-width:0;font-size:14px}.in b{font-size:14px;font-weight:700}
.stp2{display:flex;align-items:center;gap:8px;border:1.5px solid var(--o);border-radius:12px;padding:4px;flex:none;background:rgba(232,89,12,.05)}
.stp2 button{width:30px;height:30px;border:0;border-radius:10px;background:transparent;color:var(--o);font-size:20px;font-weight:900}
.stp2 b{min-width:20px;text-align:center;color:var(--o)}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pm div{background:rgba(128,128,128,.1);border-radius:14px;padding:12px 6px;text-align:center}
.pm b{font-size:18px;display:block;color:var(--o);font-weight:900}
.cbar{position:sticky;bottom:80px;background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.shc{background:linear-gradient(135deg,#15543b,#23734f)!important;color:#fff!important;border:0!important;border-radius:20px!important;padding:18px!important;margin-bottom:14px!important;box-shadow:0 8px 24px rgba(21,84,59,.3)}
.shc h3{color:#fff!important;font-weight:900}
.shc .s{color:#dbe9e1!important}
.shc .row{border-bottom:1px solid rgba(255,255,255,.15)!important}
.shc .pm div{background:rgba(255,255,255,.18)!important}
.shc .pm b{color:#fff!important}
@media(max-width:380px){.hero h2{font-size:22px}.card{padding:14px}.big .n{font-size:36px}}
</style></head>

const firebaseConfig={apiKey:"AIzaSyBfbF6SJlNja1W253Cpz1nLTYfMDHsnQ_Y",authDomain:"namaste-udala.firebaseapp.com",projectId:"namaste-udala",storageBucket:"namaste-udala.firebasestorage.app",messagingSenderId:"998684348165",appId:"1:998684348165:web:4bb0d2f5335a90a394716c"};

const SEED=[['Doodh 500 ml',30,'Doodh aur dairy'],['Dahi 400 g',40,'Doodh aur dairy'],['Paneer 200 g',80,'Doodh aur dairy'],['Chai patti 250 g',130,'Chai aur nashta'],['Coffee 50 g',140,'Chai aur nashta'],['Bread',40,'Chai aur nashta'],['Ande (6)',72,'Chai aur nashta'],['Detergent 1 kg',130,'Ghar ki safai'],['Bartan gel 500 ml',110,'Ghar ki safai'],['Floor cleaner 500 ml',99,'Ghar ki safai'],['Sabun',30,'Body care'],['Shampoo 340 ml',180,'Body care'],['Toothpaste 150 g',95,'Body care'],['Body lotion 100 ml',90,'Body care'],['Sanitary pads (8)',50,'Women care'],['Atta 1 kg',50,'Kirana'],['Chawal 1 kg',70,'Kirana'],['Dal 1 kg',150,'Kirana'],['Tel 1 L',150,'Kirana'],['Roti',5,'Extra khana',1],['Chawal plate',20,'Extra khana',1],['Paneer sabzi',50,'Extra khana',1],['Egg',12,'Extra khana'],['Chicken piece',40,'Extra khana']].map((a,i)=>({id:i+1,n:a[0],p:a[1],c:a[2],s:1,h:a[3]||0}));
let S={prod:SEED,subs:[],orders:[],done:{}};
try{const l=JSON.parse(localStorage.getItem('udala2'));if(l)S=l}catch(e){}

try{const app=initializeApp(firebaseConfig);db=getDatabase(app);onValue(ref(db,'udala2'),sn=>{const v=sn.val();if(v){S=v;fix();const t=document.activeElement&&document.activeElement.tagName;if(t!=='INPUT')render()}})}catch(e){console.log('Cloud off',e)}

const pr=()=>{let b=PL[F.type][F.days];let extra=0;if(F.lunch==='both')extra+=10*F.days;if(F.dinner==='both')extra+=10*F.days;extra+=F.extraRoti*5*F.days;return +F.half?Math.round((b+extra)*.6):(b+extra)};

const wa=(ph,t)=>window.open('https://wa.me/91'+ph+'?text='+encodeURIComponent(t),'_blank');
const mf=(d,t)=>{const w=d.getDay();if(t==='nv'){if(w===3)return'Fish curry, roti, chawal';if(w===5)return'2 egg curry, roti, chawal';if(w===0)return'Chicken, roti, chawal'}else{if(w===3)return'Paneer sabzi, roti, chawal';if(w===5)return'Special veg thali + meetha';if(w===0)return'Mushroom curry, roti, chawal'}return'Dal, sabzi, roti, chawal'};
const act=(s,dt)=>{const k=iso(dt);return k>=s.start&&k<=iso(add(new Date(s.start+'T12:00:00'),s.days-1))};
const seg=(k,o)=>'<div class="seg">'+o.map(([v,l])=>`<button class="${String(F[k])===String(v)?'on':''}" data-a="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')+'</div>';

const OPIN="4821",DPIN="7788";let OK=0;try{OK=sessionStorage.getItem('udok')?1:0}catch(e){}
const vi=t=>'<span class="vi '+(t==='nv'?'nv':'')+'"></span>';

const EM=[[/doodh|milk/,'🥛'],[/dahi/,'🥣'],[/paneer/,'🧀'],[/chai|coffee/,'☕'],[/bread/,'🍞'],[/ande|egg/,'🥚'],[/detergent/,'🧺'],[/bartan/,'🍽️'],[/floor/,'🧹'],[/sabun/,'🧼'],[/shampoo|lotion/,'🧴'],[/toothpaste/,'🪥'],[/pad/,'🌸'],[/atta/,'🌾'],[/chawal|rice/,'🍚'],[/dal/,'🫘'],[/tel/,'🛢️'],[/roti/,'🫓'],[/chicken/,'🍗'],[/mushroom/,'🍄']];

const ce=c=>CE[c]||'🛍️';
const pe=p=>{const n=p.n.toLowerCase();for(const x of EM)if(x[0].test(n))return x[1];return ce(p.c)};

Object.assign(CE,{'Roti & Chawal':'🫓','Sabzi & Dal':'🥘','Non-veg special':'🍗','Meetha & Drinks':'🍮'});
EM.unshift([/fish/,'🐟'],[/paratha/,'🫓'],[/gulab|kheer/,'🍮'],[/lassi|chhaas/,'🥤'],[/raita/,'🥣'],[/mix veg/,'🥗']);
const item=p=>{const q=C[p.id]||0,qh=C[p.id+'h']||0;const ctl=(k,n)=>n?`<div class="stp2"><button data-a="dec" data-id="${k}">−</button><b>${n}</b><button data-a="inc" data-id="${k}">+</button></div>`:`<button class="btn sm" data-a="inc" data-id="${k}">ADD +</button>`;return`<div class="it"><div class="ie">${pe(p)}</div><div class="in"><b>${isF(p)?vi(p.nv?'nv':'veg')+' ':''}${esc(p.n)}</b><div class="s">${inr(p.p)}${p.h?' · Full':''}</div></div>${ctl(p.id,q)}</div>`+(p.h?`<div class="it" style="padding:0 0 12px 60px"><div class="in s">½ Half · <b>${inr(Math.round(p.p*.6))}</b></div>${ctl(p.id+'h',qh)}</div>`:'')};

const V={
plan:()=>{
  const t=D0();let at=0;
  Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k));if(p&&q>0)at+=(k.endsWith('h')?Math.round(p.p*.6):p.p)*q});
  const pcd=(ty,em,l)=>`<button class="pc ${F.type===ty?'on':''}" data-a="set" data-k="type" data-v="${ty}"><div>${vi(ty)}</div><b>${l}</b><div class="s">${F.days} din</div><div style="font-size:20px;font-weight:900;color:var(--o)">${inr(PL[ty][F.days])}</div></button>`;

aRoti">−</button><b style="font-size:16px">${F.extraRoti}</b><button data-a="inc" data-id="extraRoti">+</button></div></div><h3 style="margin-top:10px">4️⃣ Aapki details</h3>${contact()}<h3 style="margin-top:10px">5️⃣ Payment</h3>${seg('pay',[['cash','Cash'],['online','Online UPI']])}</div><div class="card"><div class="row"><span>Base Plan</span><b>${inr(PL[F.type][F.days])}</b></div>${F.lunch==='both'||F.dinner==='both'?`<div class="row"><span>Customization</span><b>+${inr(((F.lunch==='both'?10:0)+(F.dinner==='both'?10:0))*F.days)}</b></div>`:''}${F.extraRoti>0?`<div class="row"><span>Extra Roti (${F.extraRoti} × ${F.days})</span><b>+${inr(F.extraRoti*5*F.days)}</b></div>`:''}<div class="row"><b>Total</b><b style="font-size:24px">${inr(pr()+at)}</b></div><button class="btn" data-a="join">Plan shuru karo</button><button class="btn g" data-a="trial">🎁 1 din FREE trial</button></div><div class="card"><h3>Kaise kaam karta hai?</h3><div class="row"><span>📱 Plan chuno</span><span class="s">1 minute</span></div><div class="row"><span>🍱 Roz time par khana</span><span class="s">Aapke darwaze par</span></div><div class="row"><span>⏭️ Kal nahi chahiye?</span><span class="s">Raat 9 baje tak skip</span></div></div>`},
shop:()=>{const vis=S.prod.filter(p=>p.s);let tot=0,cnt=0;const ln=[];Object.entries(C).forEach(([k,n])=>{const p=S.prod.find(x=>x.id===parseInt(k));if(p&&n>0){const h=k.endsWith('h'),pp=h?Math.round(p.p*.6):p.p;tot+=pp*n;cnt+=n;ln.push(`<div class="row"><span>${esc(p.n)}${h?' (Half)':''} × ${n}</span><b>${inr(pp*n)}</b></div>`)}});const nf=[...new Set(vis.filter(p=>!isF(p)).map(p=>p.c))],fcs=[...new Set(vis.filter(isF).map(p=>p.c))];if(SCAT!=='all'&&SCAT!=='food'&&!nf.includes(SCAT)&&!fcs.includes(SCAT))SCAT='all';const ch=(v,l)=>`<button class="${SCAT===v?'on':''}" data-a="cat" data-v="${esc(v)}">${l}</button>`;return`${utrCard()}<div class="hero" style="padding:14px"><div class="em" style="font-size:40px">🛒</div><h2 style="font-size:20px">Ghar ka saaman,<br>ek tap mein</h2><p>Khana, doodh, kirana aur safai</p></div><input id="sq" placeholder="🔍 Roti, doodh, sabun dhundo..." value="${esc(SQ)}"><div class="chips2">${ch('all','🛍️ Sab')}${ch('food','🍛 Khana')}${nf.map(c=>ch(c,ce(c)+' '+esc(c))).join('')}<button class="${VO?'on':''}" data-a="vo">${vi('veg')} Sirf Veg</button></div>${SCAT==='food'||fcs.includes(SCAT)?`<div class="chips2">${ch('food','Sab khana')}${fcs.map(c=>ch(c,ce(c)+' '+esc(c))).join('')}</div>`:''}<div id="pl">${shopList()}</div>${cnt?`<div class="cbar"><span>🛒 ${cnt} item · <b>${inr(tot)}</b></span><button class="btn sm g" data-a="goc">Checkout ↓</button></div>`:''}<div class="card" id="co"><h3>📦 Cart aur delivery</h3>${ln.join('')||'<div class="s">Cart khali hai. Upar se ADD dabao 👆</div>'}<div class="row"><b>Total</b><b style="font-size:22px">${inr(tot)}</b></div>${contact()}<div class="s">Payment</div>${seg('pay',[['cash','Cash'],['online','Online UPI']])}<button class="btn" data-a="order">Order karo 🚀</button></div>`},
kitchen:()=>{const t=D0(),k=iso(t),all=S.subs.filter(s=>act(s,t)),on=all.filter(s=>!s.skip.includes(k)),c=f=>on.filter(f).length;const totalExtraRotis=on.reduce((sum,s)=>sum+(s.extraRoti||0),0);return`<div style="height:14px"></div><div class="big"><div class="s" style="color:#fff">AAJ KA KHANA (${k}) · COOKING LIST</div><div class="n">${on.length}</div><div class="gr"><div><b>${c(s=>s.type==='veg')}</b>${vi('veg')} Veg</div><div><b>${c(s=>s.type==='nv')}</b>${vi('nv')} Non-veg</div><div><b>${totalExtraRotis}</b>🫓 Extra Roti</div><div><b>${c(s=>!s.half)}</b>Full</div><div><b>${c(s=>s.half)}</b>Half</div><div><b>${on.length*3}</b>Total meals</div></div></div><div class="card"><h3>Customers & Meal Plan</h3>${on.map(s=>{const pref=`${s.lunch==='both'?'Lunch: Dono':s.lunch==='chawal'?'Lunch: Chawal':'Lunch: Roti'} | ${s.dinner==='both'?'Dinner: Dono':s.dinner==='chawal'?'Dinner: Chawal':'Dinner: Roti'}${s.extraRoti>0?' | +'+s.extraRoti+' Extra Roti':''}`;const it=S.orders.filter(o=>o.sid===s.id).map(o=>o.items.map(i=>i.n+' x'+i.q).join(', ')).join('; ');return`<div class="row"><div><b>${esc(s.name)}</b> · ${vi(s.type)} ${s.type==='veg'?'Veg':'Non-veg'} ${s.half?'Half':'Full'}${s.trial?' · Trial':''}<div class="s" style="color:var(--g);font-weight:600;margin-top:4px">🍱 ${pref}</div>${it?'<div class="s" style="color:var(--o);font-weight:600;margin-top:4px">➕ '+esc(it)+'</div>':''}</div><button class="btn sm ${s.skip.includes(k)?'g':'r'}" data-a="skip" data-id="${s.id}">${s.skip.includes(k)?'Wapas':'Skip kal'}</button></div>`}).join('')||'<div class="s">Koi plan nahi</div>'}</div>`},
delivery:()=>{const t=D0(),k=iso(t),l=S.subs.filter(s=>act(s,t)&&!s.skip.includes(k)),g={};l.forEach(s=>(g[s.area||'Other']=g[s.area||'Other']||[]).push(s));const mp=(a,b)=>`<a href="${esc(a||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(b))}" target="_blank">📍 Map kholo</a>`;const ords=S.orders.filter(o=>!o.dlv);return`<div style="height:14px"></div>`+(Object.keys(g).sort().map(a=>`<div class="card"><h3>📍 ${esc(a)} · ${g[a].length} dabbe</h3><div class="s">${SL}</div><a href="${esc(rt(g[a]))}" target="_blank">🧭 Poora route (Kitchen se start)</a>`+g[a].map(s=>{const d=S.done[k+'_'+s.id];return`<div class="row"><div><b>${esc(s.name)}</b> · ${vi(s.type)} ${s.type==='veg'?'Veg':'Non-veg'} ${s.half?'Half':''}<div class="s">${esc(s.addr)}</div>${mp(s.map,s.addr+' '+s.area)}</div><button class="btn sm ${d?'g':''}" style="${d?'':'background:#e2e8f0'}" data-a="done" data-id="${s.id}">${d?'✓ Diya':'Diya?'}</button></div>`}).join('')+'</div>').join('')||'<div class="card">Aaj koi delivery nahi</div>')+(ords.length?`<div class="card"><h3>🛒 Shop orders</h3>`+ords.map(o=>`<div class="row"><div><b>${esc(o.name)}</b> · ${inr(o.total)} · ${o.pay==='online'?'UPI':'Cash'}<div class="s">${o.items.map(i=>esc(i.n)+' x'+i.q).join(', ')}</div><div class="s">${esc(o.addr)} · ${esc(o.area)}</div>${mp(o.map,o.addr+' '+o.area)}</div><button class="btn sm g" data-a="odone" data-id="${o.id}">Diya</button></div>`).join('')+'</div>':'')},
owner:()=>{
  const t=D0(),td=iso(D0()),mo=td.slice(0,7),P=PY();
  const back=`<button class="btn g" data-a="oview" data-v="dash" style="margin-bottom:12px">← Dashboard wapas</button>`;
  const activeSubs=S.subs.filter(s=>act(s,D0()));
  const planRevenue=P.filter(p=>p.kind&&p.kind.includes('Plan')).reduce((a,p)=>a+p.amt,0);
  const shopRevenue=P.filter(p=>p.kind&&p.kind.includes('Shop')).reduce((a,p)=>a+p.amt,0);
  const todayEarn=P.filter(p=>p.d===td).reduce((a,p)=>a+p.amt,0);
  const monthEarn=P.filter(p=>String(p.d).slice(0,7)===mo).reduce((a,p)=>a+p.amt,0);
  const totalEarn=P.reduce((a,p)=>a+p.amt,0);
  const pendAmt=S.subs.filter(s=>!s.paid).reduce((a,s)=>a+due(s),0)+S.orders.filter(o=>!o.paid&&!(o.sid&&S.subs.some(x=>x.id===o.sid&&!x.paid))).reduce((a,o)=>a+o.total,0);
  const todayDeliv=S.subs.filter(s=>act(s,D0())&&!s.skip.includes(td));
  const delivDone=todayDeliv.filter(s=>S.done[td+'_'+s.id]).length;
  const extraRotiToday=todayDeliv.reduce((a,s)=>a+(s.extraRoti||0),0);
  const utrPend=S.subs.filter(s=>!s.paid&&s.utr).length+S.orders.filter(o=>!o.paid&&o.utr).length;

  if(OVIEW==='plan'){
    const rows=S.subs.slice().reverse().map(s=>{const on=act(s,D0());return`<div class="row" style="align-items:flex-start"><div><b>${esc(s.name)}</b> · ${esc(s.phone)}<div class="s">${s.days} din · ${s.type==='veg'?'Veg':'Non-veg'} · ${s.half?'Half':'Full'} · Start ${s.start}</div><div class="s" style="color:var(--o);font-weight:600">🍱 ${s.lunch==='both'?'L:Dono':s.lunch==='chawal'?'L:Chawal':'L:Roti'} | ${s.dinner==='both'?'D:Dono':s.dinner==='chawal'?'D:Chawal':'D:Roti'}${s.extraRoti>0?' +'+s.extraRoti+'R':''}</div>${s.trial?'<div class="s">🎁 Trial</div>':''}</div><div style="text-align:right"><b>${inr(s.price)}</b><div class="s">${s.paid?'✅ Paid':'⏳ Pending'}</div><div class="s">${on?'🟢 Active':' Expired'}</div></div></div>`}).join('')||'<div class="s">Koi plan nahi</div>';
    return`<div style="height:14px"></div>${back}<div class="card"><h3>🍱 Plan Ledger (${S.subs.length})</h3><div class="pm"><div><b>${activeSubs.length}</b><span class="s">Active</span></div><div><b>${S.subs.length-activeSubs.length}</b><span class="s">Expired</span></div><div><b>${inr(planRevenue)}</b><span class="s">Revenue</span></div></div>${rows}</div>`;
  }
  if(OVIEW==='shop'){
    const rows=S.orders.slice().reverse().map(o=>`<div class="row" style="align-items:flex-start"><div><b>${esc(o.name)}</b> · ${esc(o.phone)}<div class="s">${o.items.map(i=>esc(i.n)+' x'+i.q).join(', ')}</div><div class="s">${esc(o.addr)} · ${esc(o.area)}</div></div><div style="text-align:right"><b>${inr(o.total)}</b><div class="s">${o.paid?'✅ Paid':'⏳ Pending'}</div><div class="s">${o.dlv?'🟢 Delivered':'🚚 Baaki'}</div></div></div>`).join('')||'<div class="s">Koi shop order nahi</div>';
    return`<div style="height:14px"></div>${back}<div class="card"><h3>🛒 Shop Ledger (${S.orders.length})</h3><div class="pm"><div><b>${S.orders.filter(o=>!o.dlv).length}</b><span class="s">Delivery baaki</span></div><div><b>${S.orders.filter(o=>!o.paid).length}</b><span class="s">Payment baaki</span></div><div><b>${inr(shopRevenue)}</b><span class="s">Revenue</span></div></div>${rows}</div>`;
  }
  if(OVIEW==='pay'){
    const rows=P.slice().reverse().map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="s">${esc(p.d)} · ${esc(p.kind)} · ${p.mode==='online'?'UPI':'Cash'}${p.utr?' · '+esc(p.utr):''}</div></div><b>${inr(p.amt)}</b></div>`).join('')||'<div class="s">Abhi koi payment nahi</div>';
    return`<div style="height:14px"></div>${back}<div class="card"><h3>💰 Payment Ledger</h3><div class="pm"><div><b>${inr(todayEarn)}</b><span class="s">Aaj</span></div><div><b>${inr(monthEarn)}</b><span class="s">Is mahine</span></div><div><b>${inr(totalEarn)}</b><span class="s">Total</span></div></div><div class="row"><span>⏳ Pending (plans+orders)</span><b style="color:#c92a2a">${inr(pendAmt)}</b></div>${rows}</div>`;
  }
  if(OVIEW==='deliv'){
    const rows=todayDeliv.map(s=>{const d=S.done[td+'_'+s.id];return`<div class="row"><div><b>${esc(s.name)}</b> · ${esc(s.phone)}<div class="s">${esc(s.addr)} · ${esc(s.area)}</div></div><button class="btn sm ${d?'g':''}" data-a="done" data-id="${s.id}">${d?'✓ Diya':'Diya?'}</button></div>`}).join('')||'<div class="s">Aaj koi delivery nahi</div>';
    const shopRows=S.orders.filter(o=>!o.dlv).map(o=>`<div class="row"><div><b>${esc(o.name)}</b><div class="s">${esc(o.area)} · ${inr(o.total)}</div></div><button class="btn sm g" data-a="odone" data-id="${o.id}">Diya</button></div>`).join('');
    return`<div style="height:14px"></div>${back}<div class="card"><h3>🛵 Delivery Ledger (Aaj)</h3><div class="pm"><div><b>${delivDone}</b><span class="s">Delivered</span></div><div><b>${todayDeliv.length-delivDone}</b><span class="s">Baaki</span></div><div><b>${todayDeliv.length}</b><span class="s">Total</span></div></div>${rows}</div>${shopRows?`<div class="card"><h3>🛒 Shop deliveries baaki</h3>${shopRows}</div>`:''}`;
  }
  if(OVIEW==='kitch'){
    const rows=todayDeliv.map(s=>{const pref=`${s.lunch==='both'?'Lunch: Dono':s.lunch==='chawal'?'Lunch: Chawal':'Lunch: Roti (4pcs)'} | ${s.dinner==='both'?'Dinner: Dono':s.dinner==='chawal'?'Dinner: Chawal':'Dinner: Roti (4pcs)'}${s.extraRoti>0?' | +'+s.extraRoti+' Extra Roti':''}`;return`<div class="row" style="align-items:flex-start"><div><b>${esc(s.name)}</b> · ${s.type==='veg'?' Veg':'🔴 Non-veg'} ${s.half?'Half':'Full'}<div class="s" style="color:var(--g);font-weight:600">🍱 ${pref}</div></div></div>`}).join('')||'<div class="s">Aaj kuch nahi banana</div>';
    return`<div style="height:14px"></div>${back}<div class="big"><div class="s" style="color:#fff">AAJ KA KHANA · COOKING LIST</div><div class="n">${todayDeliv.length}</div><div class="gr"><div><b>${todayDeliv.filter(s=>s.type==='veg').length}</b>Veg</div><div><b>${todayDeliv.filter(s=>s.type==='nv').length}</b>Non-veg</div><div><b>${extraRotiToday}</b>Extra Roti</div></div></div><div class="card"><h3>🧑‍ Kitchen Ledger</h3>${rows}</div>`;
  }
  if(OVIEW==='utr'){

  const led=(v,ic,ti,big,sub)=>`<div class="card" style="cursor:pointer;text-align:center;padding:16px 10px;margin-bottom:12px" data-a="oview" data-v="${v}"><div style="font-size:30px">${ic}</div><b style="display:block;font-size:14px;margin:6px 0">${ti}</b><div style="font-size:20px;font-weight:900;color:var(--o)">${big}</div><div class="s">${sub}</div><div class="s" style="color:var(--o);font-weight:700;margin-top:6px">Andar dekho →</div></div>`;
  const dashGrid=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">${led('plan','🍱','Plan Ledger',activeSubs.length,'Active · '+inr(planRevenue))}${led('shop','🛒','Shop Ledger',S.orders.length,'Orders · '+inr(shopRevenue))}${led('pay','💰','Payment Ledger',inr(todayEarn),'Aaj · Pending '+inr(pendAmt))}${led('deliv','🛵','Delivery Ledger',delivDone+'/'+todayDeliv.length,'Delivered / Total')}${led('kitch','🧑‍','Kitchen Ledger',todayDeliv.length,'Aaj ke dabbe · +'+extraRotiToday+' roti')}${led('utr','✅','UTR Ledger',utrPend,'Verify baaki')}</div>`;
  const dashboardBox=`<div class="card" style="background:linear-gradient(135deg,#1f5f3a,#14452a);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px"><h3 style="color:#fff;font-size:20px;margin-bottom:14px">📊 OWNER DASHBOARD</h3><div class="gr" style="grid-template-columns:1fr 1fr;gap:12px"><div style="background:rgba(255,255,255,.15);border-radius:14px;padding:14px;text-align:center"><b style="font-size:22px;display:block;color:#fff">${inr(todayEarn)}</b><span style="font-size:11px;color:#dbe9e1">💰 Aaj ki Kamai</span></div><div style="background:rgba(255,255,255,.15);border-radius:14px;padding:14px;text-align:center"><b style="font-size:22px;display:block;color:#fff">${activeSubs.length}</b><span style="font-size:11px;color:#dbe9e1">📦 Active Plans</span></div><div style="background:rgba(255,190,11,.2);border-radius:14px;padding:14px;text-align:center"><b style="font-size:22px;display:block;color:#ffbe0b">${inr(pendAmt)}</b><span style="font-size:11px;color:#ffbe0b">⏳ Pending</span></div><div style="background:rgba(6,214,160,.2);border-radius:14px;padding:14px;text-align:center"><b style="font-size:22px;display:block;color:#06d6a0">${delivDone}/${todayDeliv.length}</b><span style="font-size:11px;color:#06d6a0">🛵 Delivered</span></div></div></div>`;
  const todayCustomers=todayDeliv;
  const confirmedPlansBox=`<div class="card" style="border-left:4px solid #06d6a0"><h3>✅ Confirmed Plans & Aaj ka Menu</h3>${todayCustomers.map(s=>{const menuToday=mf(D0(),s.type);const pref=`${s.lunch==='both'?'Lunch: Roti+Chawal':s.lunch==='chawal'?'Lunch: Sirf Chawal':'Lunch: Sirf Roti (4 pcs)'} | ${s.dinner==='both'?'Dinner: Roti+Chawal':s.dinner==='chawal'?'Dinner: Sirf Chawal':'Dinner: Sirf Roti (4 pcs)'}${s.extraRoti>0?' | +'+s.extraRoti+' Extra Roti':''}`;return`<div class="row" style="align-items:flex-start;background:#f0fdf4;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #bbf7d0"><div style="flex:1"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#166534;font-size:15px">${esc(s.name)}</b><span style="background:#06d6a0;color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700">SUCCESSFUL</span></div><div class="s" style="color:#15803d;margin-top:4px">📞 ${esc(s.phone)} · 📍 ${esc(s.area)}</div><div class="s" style="color:#166534;margin-top:6px;font-weight:600">🍱 Aaj ka Menu: ${menuToday}</div><div class="s" style="color:#166534">⏰ Subah 7:30, Lunch 1:30, Dinner 8:00</div><div class="s" style="color:#d97706;margin-top:4px;font-weight:600">📝 ${pref}</div></div></div>`}).join('')||'<div class="s">Aaj koi confirmed plan nahi.</div>'}</div>`;
  const shk=iso(add(D0(),1));const sho=S.subs.filter(s=>act(s,add(D0(),1))&&!s.skip.includes(shk));const shit=s=>S.orders.filter(o=>o.sid===s.id).map(o=>o.items.map(i=>i.n+' x'+i.q).join(', ')).filter(Boolean).join('; ');
  const shCard=`<div class="card shc"><h3>📋 KAL KA ORDER SHEET (${shk.slice(5)})</h3><div class="pm"><div><b>${sho.filter(x=>x.type==='veg').length}</b><span>Veg</span></div><div><b>${sho.filter(x=>x.type==='nv').length}</b><span>Non-veg</span></div><div><b>${sho.length}</b><span>Total dabbe</span></div></div><div class="s" style="margin-top:8px">Veg: ${mf(add(D0(),1),'veg')}<br>Non-veg: ${mf(add(D0(),1),'nv')}</div>${sho.map(s=>'<div class="row" style="align-items:flex-start"><div><b>'+esc(s.name)+'</b> · '+esc(s.phone)+'<div class="s">'+esc(s.addr)+' · '+esc(s.area)+'</div><div class="s" style="color:#ffbe0b;margin-top:4px">🍱 '+(s.lunch==='both'?'L:Dono':s.lunch==='chawal'?'L:Chawal':'L:Roti')+' | '+(s.dinner==='both'?'D:Dono':s.dinner==='chawal'?'D:Chawal':'D:Roti')+(s.extraRoti>0?' +'+s.extraRoti+'R':'')+(shit(s)?' | 🍛 '+esc(shit(s)):'')+'</div></div><b>'+inr(due(s))+'</b></div>').join('')+'</div>`;
  return`<div style="height:14px"></div>${dashboardBox}${dashGrid}${confirmedPlansBox}${shCard}<div class="card"><h3>🛍 Products Manage</h3><input id="pn" placeholder="Naam"><input id="pp" type="number" placeholder="Price"><input id="pc" placeholder="Category"><button class="btn" data-a="addp">Product jodo</button>${S.prod.map(p=>`<div class="row"><div>${esc(p.n)}<div class="s">${inr(p.p)} · ${esc(p.c)}</div></div><div><button class="btn sm ${p.s?'g':'r'}" data-a="stock" data-id="${p.id}">${p.s?'Stock mein':'Khatam'}</button><button class="btn sm r" data-a="delp" data-id="${p.id}">✕</button></div></div>`).join('')}</div><button class="btn" data-a="out">Owner se bahar</button><button class="btn r" data-a="reset">Reset sab data</button>`}
};
const T=[['plan','📱','Plan'],['shop','🛒','Shop'],['kitchen','🧑‍','Kitchen'],['delivery','🛵','Delivery'],['owner','💼','Owner']];
function render(){if(!OK&&tab!=='plan'&&tab!=='shop')tab='plan';$('#v').innerHTML=V[tab]();$('#ht').textContent=({plan:'Aaj ka Plan',shop:'Shop',kitchen:'Kal Kitne Dabbe?',delivery:'Aaj Ka Route',owner:'Kiska Paisa Baaki?'})[tab];$('#nav').innerHTML=T.filter(t=>OK||t[0]==='plan'||t[0]==='shop').map(t=>`<div class="${t[0]===tab?'on':''}" data-a="tab" data-v="${t[0]}"><i>${t[1]}</i>${t[2]}</div>`).join('')}
const need=()=>{if(!F.name||!F.phone){alert('Naam aur phone daalo');return 1}if(!/q=-?\d/.test(F.map||'')){alert('Location zaroori hai. GPS wala button dabao');return 1}};
function addon(subscription){const items=[];let total=0;Object.entries(C).forEach(([key,quantity])=>{if(!Number.isInteger(quantity)||quantity<=0)return;const product=S.prod.find(p=>p.id===parseInt(key,10));if(!product||!product.s)return;const half=key.endsWith('h');if(half&&!product.h)return;const price=half?Math.round(product.p*0.6):product.p;items.push({n:product.n+(half?' (Half)':''),q:quantity,p:price});total+=price*quantity});if(!items.length)return 0;S.orders.push({id:Date.now(),sid:subscription.id,name:subscription.name,phone:subscription.phone,area:subscription.area,addr:subscription.addr,map:subscription.map,items,total,pay:subscription.pay,paid:0,dlv:0,t:new Date().toLocaleString()});C={};return total}
const mk=tr=>{if(need())return;const s={id:Date.now(),name:F.name,phone:F.phone.replace(/\D/g,'').slice(-10),area:F.area||'Other',addr:F.addr,map:F.map,type:F.type,days:tr?1:+F.days,half:+F.half,start:F.start,price:tr?0:pr(),pay:F.pay,paid:tr?1:0,skip:[],trial:tr?1:0,lunch:F.lunch,dinner:F.dinner,extraRoti:F.extraRoti};const ad=addon(s);if(ad&&tr)MY.push('o'+S.orders[S.orders.length-1].id);S.subs.push(s);if(!tr)MY.push('s'+s.id);saveMY();save();alert(tr?'1 din free trial shuru!':'Plan ban gaya: '+inr(s.price));if(!tr&&F.pay==='online')location.href=upi(s.price+ad)};
const A={
oview:v=>{OVIEW=v;render()},
login:()=>{const n=($('#lname')||{}).value||'',p=(($('#lphone')||{}).value||'').replace(/\D/g,'').slice(-10);if(!n.trim()||p.length<10){alert('Naam aur 10 digit phone daalo');return}ME={name:n.trim(),phone:p};saveME();F.name=ME.name;F.phone=ME.phone;render();alert('Login ho gaya! Namaste '+ME.name+' 🙏')},
logout:()=>{ME=null;saveME();render();alert('Logout ho gaya')},
markDelivered:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=1;save();alert('✅ Mark kar diya!')},
cat:v=>{SCAT=v;render()},
goc:()=>{const e=document.getElementById('co');if(e)e.scrollIntoView({behavior:'smooth'})},
acat:v=>{ACAT=v;render()},
vo:()=>{VO=VO?0:1;render()},
utr:(v,k,id)=>{const c=((document.getElementById('u'+id)||{}).value||'').replace(/\s/g,'');if(!/^\d{12}$/.test(c)){alert('12 digit UTR number daalo');return}const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(!s)return;s.utr=c;S.orders.forEach(o=>{if(o.sid===s.id)o.utr=c})}else{const o=S.orders.find(x=>x.id==n);if(!o)return;o.utr=c}save();alert('UTR mil gaya ✓')},
badu:(v,k,id)=>{const t=id[0],n=id.slice(1);if(t==='s'){const s=S.subs.find(x=>x.id==n);if(s){s.utr='';S.orders.forEach(o=>{if(o.sid===s.id)o.utr=''})}}else{const o=S.orders.find(x=>x.id==n);if(o)o.utr=''}save()},
paidS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const lo=S.orders.filter(o=>o.sid===s.id&&!o.paid),amt=s.price+lo.reduce((a,o)=>a+o.total,0);if(!confirm(s.name+': '+inr(amt)+' mil gaye?'))return;s.paid=1;lo.forEach(o=>o.paid=1);S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:s.name,amt:amt,mode:s.pay,utr:s.utr||'',kind:'Plan'});save()},
paidO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(!o)return;if(!confirm(o.name+': '+inr(o.total)+' mil gaye?'))return;o.paid=1;S.pays=S.pays||[];S.pays.push({id:Date.now(),d:iso(D0()),name:o.name,amt:o.total,mode:o.pay,utr:o.utr||'',kind:'Shop order'});save()},
remS:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;wa(s.phone,'Namaste '+s.name+'! 🙏\n\nAapka Namaste Udala ka '+inr(due(s))+' pending hai.\nUPI: *'+UPI+'*\n\nPayment ke baad 12 digit UTR number daal dijiye. Dhanyawad! 🍱')},
tab:v=>{if(['kitchen','delivery','owner'].includes(v)&&!OK){const dv=v==='delivery',x=prompt(dv?'Delivery PIN daalo':'Owner PIN daalo');if(dv?(!x||(x!==DPIN&&x!==OPIN)):(x!==OPIN)){if(x!==null)alert('Galat PIN');return}OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}}if(v==='owner')OVIEW='dash';tab=v;render()},
gps:()=>{if(!navigator.geolocation){alert('Is phone mein GPS nahi hai');return}navigator.geolocation.getCurrentPosition(p=>{F.map='https://www.google.com/maps?q='+p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);render();alert('Location mil gayi ✓')},e=>alert('Location nahi mili. Phone ka Location ON karo.'),{enableHighAccuracy:true,timeout:15000})},
set:(v,k)=>{F[k]=v;render()},
join:()=>mk(0),trial:()=>mk(1),
inc:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=Math.min(4,(F.extraRoti||0)+1);render()}else{C[id]=(C[id]||0)+1;render()}},
dec:(v,k,id)=>{if(id==='extraRoti'){F.extraRoti=Math.max(0,(F.extraRoti||0)-1);render()}else{C[id]=Math.max(0,(C[id]||0)-1);render()}},
order:()=>{if(need())return;const it=[];let total=0;Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id===parseInt(k));if(!p||q<1)return;const h=k.endsWith('h'),pp=h?Math.round(p.p*.6):p.p;it.push({n:p.n+(h?' (Half)':''),q,p:pp});total+=pp*q});if(!it.length){alert('Cart khali hai');return}S.orders.push({id:Date.now(),name:F.name,phone:F.phone.replace(/\D/g,'').slice(-10),area:F.area||'Other',addr:F.addr,map:F.map,items:it,total,pay:F.pay,paid:0,dlv:0,t:new Date().toLocaleString()});MY.push('o'+S.orders[S.orders.length-1].id);saveMY();C={};save();alert('Order ho gaya: '+inr(total));if(F.pay==='online')location.href=upi(total)},
skip:(v,k,id)=>{const s=S.subs.find(x=>x.id==id),d=iso(add(D0(),1)),i=s.skip.indexOf(d);i>=0?s.skip.splice(i,1):s.skip.push(d);save()},
done:(v,k,id)=>{const key=iso(D0())+'_'+id;S.done[key]=S.done[key]?0:1;save()},
odone:(v,k,id)=>{S.orders.find(o=>o.id==id).dlv=1;save()},
rem:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);wa(s.phone,'Namaste '+s.name+'! 🙏\n\nAapka Namaste Udala tiffin plan ka '+inr(s.price)+' pending hai.\nUPI: *'+UPI+'*\n\nDhanyawad! 🍱')},
remO:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);wa(o.phone,'Namaste '+o.name+'! 🙏\n\nAapke order ka '+inr(o.total)+' pending hai.\nUPI: *'+UPI+'*\n\nDhanyawad!')},
menu:(v,k,id)=>{const s=S.subs.find(x=>x.id==id),t=add(D0(),1);wa(s.phone,'Namaste '+s.name+'! 🙏\n\nKal ('+t.getDate()+'/'+(t.getMonth()+1)+') ka menu: '+mf(t,s.type)+'\n\nSkip karna ho to aaj raat 9 baje tak bata dijiye. 🍱')},
addp:()=>{const n=$('#pn').value.trim(),p=+$('#pp').value,c=$('#pc').value.trim()||'Other';if(!n||!p){alert('Naam aur price daalo');return}S.prod.push({id:Date.now(),n,p,c,s:1,h:0});save()},
stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);p.s=p.s?0:1;save()},
delp:(v,k,id)=>{if(confirm('Delete karein?')){S.prod=S.prod.filter(x=>x.id!=id);save()}},
out:()=>{OK=0;try{sessionStorage.removeItem('udok')}catch(e){}tab='plan';render()},
reset:()=>{if(confirm('Sab data delete ho jayega. Pakka?')){S={prod:SEED,subs:[],orders:[],done:{},pays:[]};save()}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(!f)return;try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(x){alert('Error: '+x.message)}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f)F[f]=e.target.value;if(e.target.id==='sq'){SQ=e.target.value;const el=document.getElementById('pl');if(el)el.innerHTML=shopList()}});
function ologin(){const x=prompt('Owner PIN daalo');if(x===OPIN){OK=1;try{sessionStorage.setItem('udok','1')}catch(e){}tab='owner';render()}else if(x!==null)alert('Galat PIN')}
let hc=0;document.querySelector('header').addEventListener('click',()=>{hc++;if(hc>=5){hc=0;ologin()}});
render();
if(location.hash==='#owner')ologin();
if(location.hash==='#delivery'){tab='delivery';A.tab('delivery')}
</script></body></html>
