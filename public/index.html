const calcCart=()=>{
 let sub=0,cnt=0;
 Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0){sub+=p.p*q;cnt+=q}});
 let disc=0,code='';
 if(CART_COUPON&&S.coupons[CART_COUPON]){
   const cp=S.coupons[CART_COUPON];
   if(sub>=cp.min){disc=cp.type==='flat'?cp.value:Math.round(sub*cp.value/100);code=CART_COUPON}
 }
 const deliv=0;
 return {sub,disc,deliv,total:sub-disc+deliv,cnt,code};
};

const checkCutoff=(slot)=>{
 const now=new Date();const hr=now.getHours();const mn=now.getMinutes();
 if(slot==='lunch'&&(hr>9||(hr===9&&mn>0)))return false;
 if(slot==='dinner'&&(hr>16||(hr===16&&mn>0)))return false;
 return true;
};

 if(OSEC==='pay'){

   pendPay.forEach(s=>{h+=`<div style="background:var(--bg);border-radius:14px;padding:12px;margin-top:10px"><div style="display:flex;justify-content:space-between"><b>${esc(s.name)}</b>${badge('pending')}</div><div class="s">📱 ${s.phone} · ${s.type} ${s.days} din · ${inr(s.price)}</div><div class="s" style="font-weight:800">🔢 UTR: ${esc(s.utr||'-')}</div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm g" data-a="verifyPay" data-id="${s.id}" style="flex:1">✅ Verify</button><button class="btn sm r" data-a="rejectPay" data-id="${s.id}" style="flex:1">❌ Reject</button></div></div>`});
  } else h+=`<p class="s">Koi payment pending nahi 🎉</p>`;
 }
 else if(OSEC==='subs'){
  (S.subs||[]).slice().reverse().forEach(s=>{h+=`<div class="row"><div><b>${esc(s.name)}</b><div class="s">${s.phone} · ${inr(s.price)}</div></div>${badge(getSubStatus(s))}</div>`});
 }
 else if(OSEC==='prod'){
  h+=`<div style="background:var(--bg);border-radius:14px;padding:12px"><input id="pn" placeholder="Naam" style="margin:0 0 8px"><div style="display:flex;gap:8px"><input id="pp" type="number" placeholder="Price" style="margin:0"><input id="pc" placeholder="Category" style="margin:0"></div>
   <select id="pkind" style="margin:8px 0 0"><option value="grocery">🛒 Grocery</option><option value="food">🍛 Food</option></select>
   <button class="btn g" data-a="addProd">➕ Add</button></div>`;
  (S.prod||[]).forEach(p=>{h+=`<div class="row"><div style="flex:1"><b>${p.kind==='food'?'🍛':'🛒'} ${esc(p.n)}</b><div class="s">${esc(p.c)} · ${inr(p.p)}</div></div><button class="btn sm ${p.s===0?'r':'g'}" data-a="stock" data-id="${p.id}">${p.s===0?'Out':'Stock'}</button><button class="btn sm r" data-a="delProd" data-id="${p.id}">🗑️</button></div>`});
 }
 else{
  h+=`<div class="s">Kal ka menu:</div><input id="mveg" placeholder="Veg menu" value="${esc(mf(addDays(new Date(),1),'veg'))}"><input id="mnv" placeholder="Non-veg menu" value="${esc(mf(addDays(new Date(),1),'nv'))}"><button class="btn sm g" data-a="setMenu">💾 Menu Save</button>
   <button class="btn r" data-a="out" style="margin-top:16px">🚪 Logout Owner</button>`;
 }
 return h+`</div>`}
};

const PAUSE_MODAL=()=>{
 if(!ME)return '';
 const mine=(S.subs||[]).filter(s=>s.phone===ME.phone);
 const live=mine.find(isLive);
 if(!live)return '';
 return `<div class="modal" data-a="closeModal"><div class="modal-content" onclick="event.stopPropagation()">
  <h3>⏸️ Plan Pause Karein</h3>
  <div class="s">Kitne din ke liye pause karna chahte hain? Plan automatically extend hoga.</div>
  <div style="display:flex;gap:8px;margin-top:12px"><input type="date" id="pauseStart" value="${PAUSE_START||todayStr()}" min="${todayStr()}"><input type="date" id="pauseEnd" value="${PAUSE_END||iso(addDays(new Date(),3))}" min="${todayStr()}"></div>
  <div class="s" style="margin-top:8px;color:var(--info)">💡 Example: 5 Jan se 7 Jan pause = 3 din ka plan extend</div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn g" data-a="applyPause" style="flex:1">✅ Apply Pause</button><button class="btn r" data-a="closeModal" style="flex:1">Cancel</button></div>
 </div></div>`;
};

const THALI_MODAL=()=>`<div class="modal" data-a="closeModal"><div class="modal-content" onclick="event.stopPropagation()">
  <h3>🥘 Apni Thali Banao</h3>
  <div class="s">2 sabzi + roti/chawal + meetha chuno. Price auto calculate hoga.</div>
  <div class="s" style="font-weight:800;margin-top:12px">Sabzi 1:</div><select id="tSab1"><option>Paneer Butter Masala (₹80)</option><option>Dal Fry (₹50)</option><option>Aloo Gobi (₹60)</option><option>Chicken Curry (₹100)</option></select>
  <div class="s" style="font-weight:800;margin-top:8px">Sabzi 2:</div><select id="tSab2"><option>Mix Veg (₹60)</option><option>Bhindi (₹60)</option><option>Rajma (₹70)</option><option>Egg Curry (₹70)</option></select>
  <div class="s" style="font-weight:800;margin-top:8px">Carb:</div><div class="seg"><button class="on">🫓 4 Roti (₹20)</button><button>🍚 Chawal (₹50)</button></div>
  <div class="s" style="font-weight:800;margin-top:8px">Meetha:</div><select id="tSweet"><option>Gulab Jamun (₹40)</option><option>Kheer (₹30)</option><option>Koi nahi</option></select>
  <div style="background:var(--bg);border-radius:12px;padding:12px;margin-top:12px"><div class="row"><b>Total</b><b style="color:var(--o);font-size:20px">₹200-260</b></div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-a="confirmThali" style="flex:1">✅ Cart Mein Add</button><button class="btn r" data-a="closeModal" style="flex:1">Cancel</button></div>
 </div></div>`;

const render=()=>{
 try{
  if(!OK&&!['plan','shop'].includes(tab))tab='plan';
  $('#v').innerHTML=VIEWS[tab]();
  $('#ht').textContent={plan:'Aaj ka Plan',shop:'Shop',kitchen:'Kitchen',delivery:'Delivery',owner:'Owner Panel'}[tab];
  $('#nav').innerHTML=[['plan','🍱','Plan'],['shop','🛍️','Shop'],['kitchen','👨‍🍳','Kitchen'],['delivery','🛵','Delivery'],['owner','👤','Owner']].filter(x=>OK||x[0]==='plan'||x[0]==='shop').map(x=>`<div class="${x[0]===tab?'on':''}" data-a="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</div>`).join('');
 }catch(err){
  $('#v').innerHTML=`<div class="card"><h3>⚠️ Error</h3><p class="s">${esc(err.message)}</p><button class="btn g" onclick="location.reload()">🔄 Refresh</button></div>`;
 }
};

const needGPS=()=>{if(!F.map){showToast('❌ Pehle GPS lein','error');return false}return true};
const needUser=()=>{const n=(F.name||'').trim(),p=cleanPhone(F.phone);if(n.length<2){showToast('❌ Sahi naam','error');return null}if(p.length!==10){showToast('❌ 10 digit phone','error');return null}return {n,p}};

const ACTIONS={
 tab:v=>{
  if(['kitchen','delivery','owner'].includes(v)&&!OK){
   const x=prompt(v==='owner'?'Owner PIN:':'PIN (Delivery/Kitchen):');
   if(x===null)return;
   const ok=v==='owner'?(x===CONFIG.ownerPin):(x===CONFIG.delivPin||x===CONFIG.ownerPin);
   if(!ok){showToast('❌ Galat PIN','error');return}
   OK=1;sessionStorage.setItem('udok','1');showToast('🔓 Access granted');
  }
  tab=v;render();window.scrollTo({top:0,behavior:'smooth'})},
 osec:v=>{OSEC=v;render()},
 shopmode:v=>{SHOPMODE=v;SQ='';FCAT='Sab';render()},
 fcat:v=>{FCAT=v;render()},
 set:(v,k)=>{F[k]=v;render()},
 setSlot:v=>{F.slot=v;render()},
 inc:(v,k,id)=>{C[id]=(C[id]||0)+1;saveCart();render()},
 dec:(v,k,id)=>{C[id]=Math.max(0,(C[id]||0)-1);if(!C[id])delete C[id];saveCart();render()},
 goc:()=>{const e=$('#co');if(e)e.scrollIntoView({behavior:'smooth'})},
 addPreset:()=>{let added=0;KIRANA_PRESET.forEach(name=>{const p=S.prod.find(x=>x.n===name);if(p&&p.s!==0){C[p.id]=(C[p.id]||0)+1;added++}});saveCart();render();showToast(`✅ ${added} items add hue`)},
 applyCoupon:()=>{const code=($('#couponInput')?.value||'').trim().toUpperCase();
  if(!code){CART_COUPON='';render();return}
  if(!S.coupons[code]){showToast('❌ Galat coupon code','error');return}
  const cart=calcCart();const cp=S.coupons[code];
  if(cart.sub<cp.min){showToast(`❌ Minimum ₹${cp.min} ka order chahiye`,'error');return}
  CART_COUPON=code;render();showToast(`✅ ${code} applied!`)},
 gps:()=>{const btn=$('#gpsBtn');
  if(!navigator.geolocation){showToast('❌ GPS support nahi','error');return}
  if(btn)btn.innerHTML='<span class="loader"></span> Location dhoondh rahe hain...';
  navigator.geolocation.getCurrentPosition(p=>{F.map=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;showToast('✅ Location lock');render()},()=>showToast('❌ Permission allow karein','error'),{enableHighAccuracy:true,timeout:10000})},
 login:()=>{const n=($('#lname')?.value||'').trim(),p=cleanPhone($('#lphone')?.value);
  if(n.length<2||p.length!==10){showToast('❌ Naam aur 10 digit phone','error');return}
  ME={name:n,phone:p};saveME();F.name=n;F.phone=p;render();showToast('👤 Login ho gaya')},
 logout:()=>{ME=null;saveME();render();showToast('Logout ho gaya')},
 mealMark:(v,k,id)=>{
  if(k==='lunch'&&!checkCutoff('lunch')){showToast('⚠️ Lunch skip cutoff 9 AM hai','error');return}
  if(k==='dinner'&&!checkCutoff('dinner')){showToast('⚠️ Dinner skip cutoff 4 PM hai','error');return}
  S.meals[mealKey(id,k)]=v;save(true);showToast(v==='consumed'?'✅ Khaya mark':'❌ Skip mark')},
 skipToday:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;const k2=todayStr();const i=s.skip.indexOf(k2);if(i>=0)s.skip.splice(i,1);else s.skip.push(k2);save(true)},
 openPause:()=>{PAUSE_START=todayStr();PAUSE_END=iso(addDays(new Date(),3));$('#v').insertAdjacentHTML('beforeend',PAUSE_MODAL())},
 closeModal:()=>{document.querySelectorAll('.modal').forEach(m=>m.remove())},
 applyPause:()=>{
  if(!ME)return;const mine=(S.subs||[]).filter(s=>s.phone===ME.phone);const live=mine.find(isLive);
  if(!live){showToast('❌ Koi plan nahi','error');return}
  const start=$('#pauseStart')?.value,end=$('#pauseEnd')?.value;
  if(!start||!end){showToast('❌ Dates chunein','error');return}
  if(start<todayStr()){showToast('❌ Start date aaj ya uske baad honi chahiye','error');return}
  if(end<start){showToast('❌ End date start ke baad honi chahiye','error');return}
  const pauseArr=live.pause||(live.pause=[]);
  for(let d=new Date(start);d<=new Date(end);d=addDays(d,1)){const k=iso(d);if(!pauseArr.includes(k))pauseArr.push(k)}
  save(true);ACTIONS.closeModal();showToast(`✅ ${pauseArr.length} din pause ho gaya, plan extend hoga`)},
 joinTrial:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const fp=deviceFp();
  const hadPhone=(S.subs||[]).find(s=>s.phone===u.p&&s.trial);
  const hadDevice=(S.subs||[]).find(s=>s.deviceFp===fp&&s.trial);
  if(hadPhone){showToast('❌ Is phone par trial pehle liya hai','error');return}
  if(hadDevice){showToast('❌ Is device par trial pehle liya hai','error');return}
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:1,start:todayStr(),price:0,status:'trial',trial:1,paid:1,utr:'FREE_TRIAL',skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,deviceFp:fp});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save(true);showToast('🎁 1 din FREE trial ACTIVE!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🎁 *FREE TRIAL*%0A👤 ${u.n}%0A📱 ${u.p}`,'_blank')},
 joinPaid:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  const utr=prompt('💳 UTR / Transaction ID likhein:');
  if(!utr||utr.trim().length<4){showToast('❌ Bina UTR plan nahi banega','error');return}
  const price=PRICING[F.type][F.days]||2899;
  S.subs.push({id:Date.now(),ts:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,type:F.type,days:+F.days,start:todayStr(),price,status:'pending',trial:0,paid:0,utr:utr.trim(),skip:[],pause:[],lunch:'chawal',dinner:'roti',extraRoti:0,deviceFp:deviceFp()});
  if(!ME){ME={name:u.n,phone:u.p};saveME()}
  save(true);showToast('⏳ Plan bana! Owner verify karega');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=💳 *NAYA PLAN*%0A👤 ${u.n}%0A📱 ${u.p}%0A🍽️ ${F.type} ${F.days} din%0A💰 ${inr(price)}%0A🔢 UTR: ${utr}`,'_blank')},
 order:()=>{const u=needUser();if(!u)return;if(!needGPS())return;if(!F.addr||F.addr.trim().length<8){showToast('❌ Address daalein','error');return}
  if(!F.slot)F.slot='lunch';
  const cart=calcCart();
  if(!cart.cnt){showToast('❌ Cart khali hai','error');return}
  const items=[];Object.entries(C).forEach(([k,q])=>{const p=S.prod.find(x=>x.id==k);if(p&&q>0)items.push({n:p.n,q,p:p.p})});
  S.orders.push({id:Date.now(),name:u.n,phone:u.p,area:F.area||'Udala',addr:F.addr,map:F.map,notes:F.notes,items,total:cart.total,sub:cart.sub,discount:cart.disc,coupon:cart.code,status:'pending',paid:0,date:todayStr(),slot:F.slot});
  C={};CART_COUPON='';saveCart();save(true);showToast('✅ Order mil gaya!');
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=🛒 *ORDER*%0A👤 ${u.n}%0A📦 ${items.map(i=>i.n+' x'+i.q).join(', ')}%0A🕐 ${F.slot==='dinner'?'Dinner':'Lunch'}%0A💰 ${inr(cart.total)}${cart.disc>0?' ('+cart.code+')':''}%0A📍 ${F.map}`,'_blank')},
 verifyPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;s.status='active';s.paid=1;
  S.pays.push({id:Date.now(),d:todayStr(),name:s.name,amt:s.price,mode:'online',utr:s.utr,kind:'Plan'});save(true);showToast('✅ Verified!')},
 rejectPay:(v,k,id)=>{const s=S.subs.find(x=>x.id==id);if(!s)return;if(confirm(s.name+' ka plan reject?')){s.status='rejected';save(true);showToast('❌ Reject')}},
 done:(v,k,id)=>{const key=todayStr()+'_'+id;S.done[key]=S.done[key]?0:1;save(true)},
 odone:(v,k,id)=>{const o=S.orders.find(x=>x.id==id);if(o){o.status='delivered';save(true);showToast('✅ Delivered')}},
 addProd:()=>{const n=($('#pn')?.value||'').trim(),p=parseInt($('#pp')?.value),c=($('#pc')?.value||'General').trim();
  const kind=($('#pkind')?.value)||'grocery';
  if(!n||!p||p<=0){showToast('❌ Naam aur price daalo','error');return}
  S.prod.push({id:Date.now(),n,p,c,nv:0,s:1,img:'',kind});save(true);showToast('✅ Product add')},
 stock:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p){p.s=p.s===0?1:0;save()}},
 delProd:(v,k,id)=>{const p=S.prod.find(x=>x.id==id);if(p&&confirm('Delete '+p.n+'?')){S.prod=S.prod.filter(x=>x.id!=id);save(true)}},
 setMenu:()=>{const k=iso(addDays(new Date(),1));S.mset[k]={veg:($('#mveg')?.value||'').trim(),nv:($('#mnv')?.value||'').trim()};save(true);showToast('💾 Menu save')},
 copyKitchen:()=>{const k=todayStr();const on=(S.subs||[]).filter(s=>isLive(s)&&s.start<=k&&!s.skip.includes(k));
  const t=`🍱 KITCHEN ${k}\n👥 ${on.length} customers\n\n`+on.map(s=>`• ${s.name} - ${packItems(s).join(', ')}`).join('\n');
  navigator.clipboard.writeText(t).then(()=>showToast('📋 Copy ho gaya!')).catch(()=>showToast('❌ Copy nahi hua','error'))},
 backup:()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='udala-backup-'+todayStr()+'.json';a.click();showToast('💾 Backup download')},
 restore:()=>{$('#restoreFile').click()},
 out:()=>{OK=0;sessionStorage.removeItem('udok');tab='plan';render();showToast('🚪 Logout')}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=ACTIONS[b.dataset.a];if(f){try{f(b.dataset.v,b.dataset.k,b.dataset.id)}catch(err){console.error(err);showToast('❌ Error','error')}}});
document.addEventListener('input',e=>{
 const f=e.target.dataset?.f;
 if(f){F[f]=e.target.value;if(f==='phone')F.phone=cleanPhone(F.phone)}
 if(e.target.id==='sq'){clearTimeout(window._sqT);window._sqT=setTimeout(()=>{SQ=e.target.value;render();const el=$('#sq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},200)}
});
$('#restoreFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();
 rd.onload=()=>{try{let d=JSON.parse(rd.result);d=migrate(d);S=d;save(true);showToast('✅ Backup restore!')}catch(err){showToast('❌ Galat backup','error')}};
 rd.readAsText(file);e.target.value=''});
let tap=0;$('#mainHeader').addEventListener('click',()=>{tap++;if(tap>=5){tap=0;const x=prompt('Owner PIN:');if(x===null)return;if(x===CONFIG.ownerPin){OK=1;sessionStorage.setItem('udok','1');tab='owner';render();showToast('🔓 Owner access')}else showToast('❌ Galat PIN','error')}});

render();
setTimeout(()=>showToast(`✅ Phase 1 loaded · Schema v${SCHEMA_V}`),500);
</script>
</body>
</html>
